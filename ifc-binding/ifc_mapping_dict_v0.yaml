# ============================================================
# 规范 ↔ IFC 映射词表 v0.6（2026-09-24）
# ============================================================
# 用途：GB50222 / GB55031 / GB55024 三册黄金样本的模型绑定层唯一词表。
#       审计脚本（实体白名单校验）、IDS 导出、自研规则引擎共用本文件。
# 决策依据：07_IFC模型绑定/决策记录_20260921.md（6 项决策已拍板）。
# 状态：draft —— 待 5 条 MVP 闭环 + 20 条黄金样本迭代为 v1。
# 事实核查来源：buildingSMART IFC4 FINAL 官方文档（已核实的标注 ✅）。
#
# v0.2 变更（评审 7 细节）：
#   ① 表4 材料级路径修正：分类与关联拆开不成链；材料级分类走
#      IfcExternalReferenceRelationship（IfcMaterial 非 IfcObjectDefinition，
#      不能作 IfcRelAssociatesClassification.RelatedObjects——官方实体层级证实）
#   ② 新增 material_channels 块：材料级三通道（分类/属性/关联）官方路径
#   ③ 表1 多候选实体策略：方案 B（拆多条绑定），见 binding_strategy
#   ④ entity_whitelist 拆分 component / relation / resource 三表
#   ⑤ 表4 墙面绑定策略明确（装修面层→CLADDING，墙体本体才→IfcWall）
#
# v0.3 变更（评审 5 处收紧 + 3 矩阵缺口）：
#   ① 表1 补「栏杆/栏板」→ IfcRailing（含 PredefinedType 枚举与检查形态说明）
#   ② 白名单 component_ifc4 补 IfcRailing（并预留 IfcMember/IfcPlate 栏杆构件细分）
#   ③ 新增 member_alias_map：系统成员 ObjectType 别名表（has_all 归一用，
#      schema §9.5 匹配语义分支 3）——不同项目写法差异不得导致静默失败
#   ④ 新增 process_parameters：纯过程参数落点（ifc_binding.target=process）
#   ⑤ 表2 补湿区空间（厕所/浴室/公共厨房/垃圾间——GB55031 6.3.3 防水层收窄用）
#
# ⚠ 核心红线（可行性分析 D1，已官方证实）：
#   燃烧性能等级（GB8624 的 A/B1/B2/B3）≠ 耐火极限（GB50016 构件耐火等级）。
#   前者绑 FlammabilityRating / 材料分类；后者绑 FireRating。
#   两者错绑 = 语义级事故，审计规则 C-BINDING-02 强制拦截。
# ============================================================

meta:
  version: v0.6
  date: "2026-09-24"
  ifc_baseline: IFC4                # 决策⑥：IFC4 基线
  ifc_extension: IFC4.3             # 仅扩展列可引用，引用时须显式声明
  scope: [GB 50222-2017, GB 55031-2022, GB 55024-2022]
  status: draft
  changelog:
    - "v0.6（2026-09-24）：forbidden 补死名 IfcEntrance（GB55019 宽匹配残留：CT 81 + 规则 89）；GB50222 剔除 IfcCeiling 残留并升 schema_version v2.3；审计器对未迁移册 CT 命中 forbidden 报 C-BINDING-01。"
    - "v0.5（2026-09-22）：space_map 补 GB50222 第5–6章表格场所类别 18 条（表5.1.1/5.2.1/5.3.1/6.0.1/6.0.5 的『建筑物及场所』行），随批次1d落地。"
    - "v0.4（2026-09-22）：space_map 补 GB50222 第4章特别场所 16 条（中庭/走马廊/开敞楼梯/自动扶梯/消防水泵房/机械加压送风排烟机房/固定灭火系统钢瓶间/配电室/变压器室/发电机房/储油间/通风和空调机房/厨房/库房/贮藏间/阳台），随批次1b落地。"
    - "v0.3（2026-09-22）：space_map 补 湿区（厕所/浴室/公共厨房/垃圾间）+ 安装场所（室外/埋地/水下）；member_alias_map 首次落地。"

# ------------------------------------------------------------
# 表1 部位 → 构件实体 + PredefinedType
# binding_strategy: split（方案 B）——一个部位若存在多种候选实体/枚举，
#   拆成多条 model_bindings 分别绑定，保持单条绑定语义单纯；
#   规则引擎按多条绑定分别生成规则（勿用 ifc_entity_candidates 多值）
# 覆盖度: strong=IFC4 直接对应 / medium=需 ObjectType 辅助 / weak=无直接实体
# ------------------------------------------------------------
part_component_map:
  - part: 顶棚
    ifc_entity: IfcCovering
    predefined_type: CEILING
    coverage: strong
    common_psets: [Pset_CoveringCommon]
    notes: "装修面层视角；结构顶板用 IfcSlab"
  - part: 墙面（装修面层）
    ifc_entity: IfcCovering
    predefined_type: CLADDING
    coverage: strong
    common_psets: [Pset_CoveringCommon]
    notes: "GB50222『墙面』指装修面层→CLADDING；涉及墙体本体（耐火极限/传热）时另拆一条 IfcWall.STANDARD 绑定（方案 B，勿单条绑定多候选）"
  - part: 墙体（结构/围护本体）
    ifc_entity: IfcWall
    predefined_type: STANDARD
    coverage: strong
    common_psets: [Pset_WallCommon]
    notes: "隔断墙用 PARTITION；外墙建议 IsExternal=true。★ 与『墙面（装修面层）』是两条绑定：面层燃烧性能 → IfcCovering.CLADDING；本体耐火极限 → IfcWall.STANDARD.FireRating"
  - part: 地面（装修面层）
    ifc_entity: IfcCovering
    predefined_type: FLOORING
    coverage: strong
    common_psets: [Pset_CoveringCommon]
    alt: "楼板本体（层高/厚度约束）另拆 IfcSlab.FLOOR 绑定"
  - part: 楼板（结构）
    ifc_entity: IfcSlab
    predefined_type: FLOOR
    coverage: strong
    common_psets: [Pset_SlabCommon]
    notes: "湿区楼面防水层等构造要求挂本体（GB55031 6.3.3）"
  - part: 屋面构造层
    ifc_entity: IfcSlab
    predefined_type: ROOF
    coverage: strong
    common_psets: [Pset_SlabCommon]
    notes: "热工参数（ThermalTransmittance）挂构造层"
  - part: 屋面（整体）
    ifc_entity: IfcRoof
    predefined_type: FLAT_ROOF      # 按实际形式；无坡度信息可缺省
    coverage: medium
    common_psets: [Pset_RoofCommon]
    notes: "整体性约束（如构造做法存在性）挂 IfcRoof；与 IfcSlab.ROOF 拆两条绑定"
  - part: 门
    ifc_entity: IfcDoor
    predefined_type: null
    coverage: strong
    common_psets: [Pset_DoorCommon]
  - part: 窗
    ifc_entity: IfcWindow
    predefined_type: null
    coverage: strong
    common_psets: [Pset_WindowCommon]
  - part: 隔断
    ifc_entity: IfcWall
    predefined_type: PARTITION
    coverage: strong
    common_psets: [Pset_WallCommon]
  - part: 幕墙
    ifc_entity: IfcCurtainWall
    predefined_type: null
    coverage: strong
    common_psets: [Pset_CurtainWallCommon]
  - part: 固定家具
    ifc_entity: IfcFurniture
    predefined_type: null
    coverage: medium
    notes: "固定式才绑；活动家具不属建筑装修交付范围"
  - part: 楼梯
    ifc_entity: IfcStair
    predefined_type: null
    coverage: strong
  - part: 坡道
    ifc_entity: IfcRamp
    predefined_type: null
    coverage: strong
  - part: 栏杆/栏板
    ifc_entity: IfcRailing
    predefined_type: HANDRAIL | GUARDRAIL | BALUSTRADE
    coverage: medium
    common_psets: [Pset_RailingCommon]
    notes: "★ 检查形态（v0.3 补）：GB55031 第6.6节栏杆条文的约束分两类——
              (甲) 属性型（如『应采取防止攀滑措施』）→ 可走自定义 GB_栏杆 Pset 属性（exists/in）；
              (乙) 几何型（如 6.6.3『杆件净间距不应大于 0.11m』）→ 属几何推导量，
              规则引擎 v1 不支持，**降级 needs_expert_review + 参数保留供几何引擎消费**。
              白名单收录不放行几何检查——补白名单≠可自动检查，必须先定检查形态。"
    alt_entities: "栏杆构件细分（立柱/扶手/栏板）可用 IfcMember / IfcPlate 表达，v0.3 已预留白名单，但需项目约定 ObjectType"
  - part: 疏散净宽（门洞/走道几何）
    ifc_entity: IfcDoor
    predefined_type: null
    coverage: weak
    notes: "疏散宽度是几何推导量（Qto_*BaseQuantities Width）——规则引擎走几何检查路径"

# ------------------------------------------------------------
# 材料级三通道（v0.2 修正：分类与关联分开，不成链）
# 依据：IfcMaterial 是 IfcMaterialDefinition，不是 IfcObjectDefinition——
#       不能作 IfcRelAssociatesClassification.RelatedObjects（✅ IFC4 实体层级证实）
# ------------------------------------------------------------
material_channels:
  material_association:             # 通道1 材料关联
    path: "IfcRelAssociatesMaterial（构件 → IfcMaterial）"
    source: "✅ IFC4：IfcMaterialDefinition.AssociatedTo 逆属性"
  material_classification:          # 通道2 材料级分类（GB8624 分级挂材料本体）
    path: "IfcExternalReferenceRelationship → IfcClassificationReference(GB8624)，RelatedResourceObjects=[IfcMaterial]"
    source: "✅ IFC4：IfcMaterialDefinition.HasExternalReferences 逆属性（classification 属 external reference）"
    warning: "不要写 IfcRelAssociatesClassification → IfcMaterial（schema 非法）；该关系只挂构件"
  element_classification:           # 通道2b 构件级分类（表达『该构件材料属某级』）
    path: "IfcRelAssociatesClassification → IfcClassificationReference(GB8624)，RelatedObjects=[构件]"
    notes: "与通道2 二选一或并用；工程上构件级最通用，材料级最精确"
  material_properties:              # 通道3 材料级属性
    path: "IfcMaterialProperties(Material=IfcMaterial) → Properties"
    source: "✅ IFC4：IfcMaterialProperties 非抽象、直接带 Material 属性；IfcMaterial.HasProperties 逆属性"
    standard_pset: "Pset_MaterialCombustion（✅ IFC4 官方标准材料燃烧属性集）"
    custom_rule: "GB 分级等无标准属性的概念用自定义 IfcMaterialProperties（命名遵守表6 GB_ 前缀）"

