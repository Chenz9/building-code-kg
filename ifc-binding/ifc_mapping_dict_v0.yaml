# 空间组（carrier=IfcZone.Name 用；成员须为上方 space_map 中的空间）
space_zones:
  - zone_name: 消防疏散区组
    members: [疏散楼梯间, 前室, 疏散走道]
    semantics: "经 IfcRelAssignsToGroup 编组；构件空间上下文取 zone.Name 判定"
  - zone_name: 湿区组
    members: [厕所（卫生间）, 浴室, 公共厨房, 垃圾间]
    semantics: "GB55031 6.3.3 防水层条文的空间收窄载体；成员变更多为图纸级调整"

# ------------------------------------------------------------
# 表3 系统映射（IFC4 基线，✅ 已核实官方文档）
# 系统实体：IfcDistributionSystem + PredefinedType；成员经 IfcRelAssignsToGroup 编组
# ------------------------------------------------------------
system_map:
  - system_name: 防雷接地系统
    ifc_entity: IfcDistributionSystem
    predefined_type: LIGHTNINGPROTECTION
    coverage: strong
    source: "✅ IFC4 FINAL（IfcDistributionSystemEnum.LIGHTNINGPROTECTION：A path for conducting lightning current to the ground）"
    member_binding: "装置级成员（接闪器/引下线/接地装置）→ IfcDistributionElement + ObjectType + 自定义 GB_防雷 Pset（覆盖度 weak，预期 needs_expert_review）"
  - system_name: 等电位联结系统
    ifc_entity: IfcDistributionSystem
    predefined_type: EARTHING
    coverage: strong
    source: "✅ IFC4（EARTHING：equipotential bonding, conducting current to the ground）"
  - system_name: 电气系统（总体）
    ifc_entity: IfcDistributionSystem
    predefined_type: ELECTRICAL
    coverage: strong
    source: "✅ IFC4 CHANGE：总体电力系统用 IfcDistributionSystem.ELECTRICAL"
  - system_name: 电气回路（开关回路级）
    ifc_entity: IfcDistributionCircuit
    predefined_type: ELECTRICAL
    coverage: strong
    source: "✅ IFC4 中 IfcElectricalCircuit 已被 IfcDistributionCircuit 取代"
  - system_name: 消防系统
    ifc_entity: IfcDistributionSystem
    predefined_type: FIREPROTECTION
    coverage: medium
    notes: "主动消防（探测/扑救）；被动防火（耐火等级）是构件属性，勿混入系统绑定"
  - system_name: 通风空调系统
    ifc_entity: IfcDistributionSystem
    predefined_type: VENTILATION
    coverage: strong
  - system_name: 照明回路
    ifc_entity: IfcDistributionSystem
    predefined_type: LIGHTING
    coverage: strong
  - system_name: 通信/智能化系统
    ifc_entity: IfcDistributionSystem
    predefined_type: COMMUNICATION
    alt_predefined: [DATA, SECURITY]
    coverage: medium
    notes: "智能化细分（安防/数据）用 SECURITY/DATA，GB55024 按条文语义选"

# ------------------------------------------------------------
# 系统成员别名表（v0.3 新增——has_all 归一用，schema §9.5 匹配语义分支 3）
# 用法：模型侧成员的 ObjectType 先按本表归一为规范名，再与 member_requirements 比对。
# ★ 别名只写在这里，禁止写进规则 value（保持规则与项目约定解耦）。
# ★ 归一失败时按精确匹配处理（不静默放过）；未收录写法应由审计提示补录。
# ------------------------------------------------------------
member_alias_map:
  - canonical: 接闪器
    system: LIGHTNINGPROTECTION
    aliases: [避雷针, 接闪杆, 接闪带, 接闪网, AirTermination, AirTerminal, 避雷带, 避雷网]
    notes: "平屋面多用『接闪带』、突出物用『接闪杆/避雷针』——同一条文成员要求，写法须归一"
  - canonical: 引下线
    system: LIGHTNINGPROTECTION
    aliases: [专设引下线, 引下导体, DownConductor, Downconductor, 防雷引下线]
    notes: "GB55024 8.8.2 出现『专设引下线』——同一概念"
  - canonical: 接地装置
    system: LIGHTNINGPROTECTION
    aliases: [接地体, 接地极, 接地网, 人工接地装置, Earthing, Grounding, EarthingArrangement]
  - canonical: 短路保护
    system: ELECTRICAL
    aliases: [短路保护电器, 短路保护装置, 过电流保护（短路）, ShortCircuitProtection]
    notes: "GB55024 4.5.1 保护功能类成员——成员非构件（无 IFC 实体承载），见该条降级处理"
  - canonical: 过负荷保护
    system: ELECTRICAL
    aliases: [过载保护, 过负荷保护装置, OverloadProtection]
  - canonical: 接地故障保护
    system: ELECTRICAL
    aliases: [接地故障保护电器, 故障保护, EarthFaultProtection]
  - canonical: 剩余电流动作保护电器
    system: ELECTRICAL
    aliases: [剩余电流保护器, 漏电保护器, RCD, ResidualCurrentDevice]
    notes: "GB55024 4.6.5——设备类成员，可挂 IfcElectricDistributionBoard/IfcDistributionElement"

# ------------------------------------------------------------
# 纯过程参数落点（v0.3 新增——schema §9.3 ifc_binding.target=process）
# 适用：过程/检测/验收章条文含数值或记录要求，但不落任何构件。
# 形状：
#   parameters:
#     - id: p_<std>_<clause>_<n>
#       name: <检测项名>
#       operator: gte | lte | in | exists
#       min_value / max_value / value: <值>
#       unit: <单位>
#       ifc_binding:
#         target: process
#         activity_ref: act_<std>_<clause>     # 必填，关联 activity_types
#         document_refs: [<记录/报告名>]         # 可空（缺省继承 activity_types）
#         note: "<值来源说明>"
# ★ 红线：target=process 时不得给 pset/property（不落构件）；不得为放参数把过程
#   条文挂到无关构件（C-BINDING-10 拦）。
# ★ 诚实提醒（2026-09-22 核实）：GB55024 9.4.1「布线工程施工后，必须进行回路的
#   绝缘电阻检测」**原文无数值阈值**——其 0.5MΩ 等具体值来自 GB 50303 等其他标准。
#   本词表禁止跨标准借值：该条 parameters 应为空（或仅记检测项名），阈值由项目
#   EIR / 其他标准承载。凡是条文未给值的检测项，一律按此处理。
# ------------------------------------------------------------
process_parameters:
  shape_example:
    parameters:
      - id: p_<std>_<clause>_<n>
        name: <检测项名（如 回路绝缘电阻检测值）>
        operator: gte
        min_value: null            # ★ 条文未给值时必须为 null，禁借其他标准的值
        max_value: null
        unit: null
        ifc_binding:
          target: process
          activity_ref: act_<std>_<clause>
          document_refs: [检测记录]
          note: "值来源须在 EIR 或引用标准中声明；本册条文未赋值的，此处留空"
  verified_cases:
    - clause: "GB 55024-2022#9.4.1"
      text: "布线工程施工后，必须进行回路的绝缘电阻检测。"
      verdict: "原文无数值 → parameters 留空；activity_types 记『回路绝缘电阻检测』+ document_refs：[绝缘电阻测试记录]"
    - clause: "GB 55024-2022#9.5.6"
      text: "竣工验收时应检查下列工程质量控制记录：1…16 过程验收记录。"
      verdict: "16 项记录清单 → activity_types.document_refs 逐项列出（document_refs 多值实证样本）"

# ------------------------------------------------------------
# 表4 规范概念 → IFC 属性落点（双路径：构件级 quick_check ∥ 材料级 primary）
# ★ 单一事实源（决策②）：本表只描述『落点』；数值一律存 parameters，绑定引用 param id
# ------------------------------------------------------------
concept_property_map:
  - concept: 燃烧性能等级（A/B1/B2/B3）
    gb_basis: GB 8624-2012（GB50222 沿用 A/B1/B2/B3 分组）
    primary:
      target: material
      channels: "材料级分类（material_channels.material_classification）+ 材料关联（material_channels.material_association），两通道组合使用、不成链"
    quick_check:
      target: element
      pset: Pset_CoveringCommon
      property: FlammabilityRating
    material_pset_reference: "Pset_MaterialCombustion（✅ IFC4 官方标准，燃烧性能材料属性集；GB 分级值另用自定义属性）"
    value_format: "IfcLabel：A / B1 / B2 / B3"
    warning: "禁止绑 FireRating（那是耐火极限，见下条）——审计规则 C-BINDING-02"
  - concept: 耐火极限（构件）
    gb_basis: GB 50016（建筑构件耐火极限）
    primary:
      target: element
      pset: Pset_WallCommon          # 对应实体各自的 Pset_*Common
      property: FireRating
    value_format: "IfcLabel：项目约定 GB 小时制（1.00h / 2.00h）；ISO 形式（REI 120）为备选"
    warning: "与燃烧性能等级严格区分；FireRating 属构件/类型级，不属材料级。★ 与燃烧性能同条出现时（如 4.0.5 墙面面层 A 级 + 墙体本体耐火极限），必须拆成两条绑定两个参数"
  - concept: 传热系数（K/U 值）
    gb_basis: GB 55031 / GB 50189
    primary:
      target: element
      pset: Pset_SlabCommon          # 屋面构造层；墙 Pset_WallCommon / 窗 Pset_WindowCommon 同名属性
      property: ThermalTransmittance
    value_format: "IfcThermalTransmittanceMeasure，W/(m²·K)"
    notes: "材料层热工参数走 material_channels.material_properties（Pset_MaterialThermal）"
  - concept: 接地电阻
    gb_basis: GB 55024
    primary:
      target: system
      path: "IfcDistributionSystem.LIGHTNINGPROTECTION + 自定义 GB_防雷 Pset"
    value_format: "IfcResistanceMeasure，Ω"
    coverage: weak
    notes: "IFC4 无标准属性；自定义 Pset 命名遵守表6（GB_ 前缀）"
  - concept: 防水层（构造措施）
    gb_basis: GB 55031 6.3.3
    primary:
      target: element
      pset: GB_防水                 # 自定义（GB_ 前缀）
      property: 防水层
    value_format: "IfcLabel：设 / 未设（或做法编号）"
    coverage: medium
    notes: "定性措施走 exists 检查；防水等级（一级/二级/三级）另见下条"
  - concept: 建筑面积
    gb_basis: GB 55031
    primary:
      target: space_or_building
      path: "Qto_SpaceBaseQuantities.NetFloorArea / Qto_BuildingBaseQuantities.GrossFloorArea"
    value_format: "IfcQuantityArea，m²"
    notes: "属 IfcElementQuantity 数量集，非 Pset；binding_level=building/storey/space"
  - concept: 空间净高
    gb_basis: GB 55031
    primary:
      target: space
      path: "Qto_SpaceBaseQuantities.Height / 几何推导"
    coverage: medium
    notes: "涉及梁底/管线底标高时只能几何推导，规则引擎走几何检查路径"
  - concept: 气密性（门窗）
    gb_basis: GB 55031 / GB/T 7106
    primary:
      target: element
      pset: Pset_WindowCommon        # 门用 Pset_DoorCommon 同名属性
      property: AirInfiltration
    coverage: medium
  - concept: 防水等级
    gb_basis: GB 55031 / GB 50108
    primary:
      target: element
      path: "IfcSlab.ROOF / IfcRoof + 自定义 GB_ Pset（等级：一级/二级/三级）"
    coverage: weak
    notes: "IFC 无标准属性；值域项目约定（1/2/3 级），随词表 v1 收敛"
  - concept: 杆件净间距（栏杆几何）
    gb_basis: GB 55031 6.6.3
    primary:
      target: geometric
      path: "IfcRailing 几何（杆件间距推导）"
    value_format: "IfcLengthMeasure，m"
    coverage: weak
    notes: "★ 几何推导量，v1 降级 needs_expert_review；参数保留（max_value=0.11, unit=m）供几何引擎消费，不生成规则"
  - concept: 疏散净宽度
    gb_basis: GB 55031 / GB 50016
    primary:
      target: geometric
      path: "Qto_DoorBaseQuantities.Width / 走道几何"
    coverage: weak
    notes: "几何推导量，不走 Pset 绑定；规则引擎实现为几何检查"

# ------------------------------------------------------------
# 表5 分类系统（材料/构件分类库）
# ------------------------------------------------------------
classification_systems:
  - system: GB8624
    full_name: 建筑材料及制品燃烧性能分级（GB 8624-2012）
    notation_used_by_gb50222: [A, B1, B2, B3]
    notation_in_material_certs: [A1, A2, B, C, D, E, F]
    group_mapping: "A1/A2→A组；B/C→B1组；D/E→B2组；F→B3组（铺地材料带 fl 后缀同理）"
    binding_path: "材料级走 material_channels.material_classification；构件级走 element_classification"
    warning: "材料证书用 2012 版细分级、规范条文用分组级——比对规则必须先做组映射，否则 A1 会被误判不满足 A"
  - system: GB50016-耐火等级
    full_name: 建筑设计防火规范 建筑耐火等级（一/二/三/四级）
    binding_path: "构件 Pset_*Common.FireRating（值=耐火极限小时数）；整栋等级走 IfcBuilding 自定义 Pset"
    notes: "构件级与整栋级两个粒度，勿混绑"

# ------------------------------------------------------------
# 表6 项目命名约定（黄金样本阶段即冻结，换项目先对齐）
# ------------------------------------------------------------
naming_conventions:
  custom_pset_prefix: "GB_"          # buildingSMART 约定：自定义属性集禁用 Pset_ 前缀
  custom_pset_examples:
    - "GB_防雷（属性：接地电阻Ω、冲击接地电阻Ω、验收日期）"
    - "GB_装修防火（属性：装修部位、燃烧性能等级、依据条号）"
    - "GB_防水（属性：防水层、防水等级、依据条号）"
    - "GB_栏杆（属性：防攀滑措施、杆件净间距、依据条号）"
  space_object_type_rule: "IfcSpace.ObjectType 取规范原文用语（疏散楼梯间/前室/合用前室/疏散走道…），禁自造缩写"
  zone_grouping: "消防疏散相关空间编入 IfcZone（消防疏散区组）、湿区编入湿区组，供空间上下文条件快速筛选；zone.Name 取值见 space_zones"
  firerating_value_rule: "GB 小时制（1.00h）；同时存在 ISO 形式（REI 120）时以项目约定为准并在 EIR 声明"
  predefined_type_required_entities: [IfcCovering, IfcSlab, IfcWall, IfcRoof, IfcDistributionSystem, IfcRailing]
  # ↑ 审计 C-RATIO-02（v0.3 对齐）：分母 = 该册 model_bindings 中 ifc_entity 命中
  #   本列表的绑定条数；其中 predefined_type 非 null 的占比 < 90% → warning
  #   ★ v0.3 增补 IfcRailing（HANDRAIL/GUARDRAIL/BALUSTRADE 三枚举须明确）

# ------------------------------------------------------------
# 实体白名单（v0.2 拆分三类；审计 C-BINDING-01 只检查 component 表）
#   component：可出现在 model_bindings.ifc_entity
#   relation：只出现在 DSL 路径与引擎遍历，禁作 ifc_entity
#   resource：资源实体（材料/分类），只作绑定通道的端点，禁作 ifc_entity
# ------------------------------------------------------------
entity_whitelist:
  component_ifc4:
    [IfcCovering, IfcWall, IfcSlab, IfcRoof, IfcCurtainWall, IfcDoor, IfcWindow,
     IfcStair, IfcRamp, IfcFurniture, IfcRailing, IfcMember, IfcPlate,
     IfcSpace, IfcZone, IfcSite, IfcBuilding,
     IfcBuildingStorey, IfcDistributionSystem, IfcDistributionCircuit,
     IfcDistributionElement, IfcElectricDistributionBoard]
    # v0.3 增补：IfcRailing（GB55031 第6.6节栏杆整类）；
    #           IfcMember / IfcPlate 预留（栏杆立柱/扶手/栏板细分，需项目约定 ObjectType）
  component_ifc4_3_ext: []           # 待需要时增补并注明枚举来源
  relation_ifc4:
    [IfcRelAssociatesMaterial, IfcRelAssociatesClassification,
     IfcExternalReferenceRelationship, IfcRelContainedInSpatialStructure,
     IfcRelAssignsToGroup, IfcRelDefinesByProperties, IfcRelAggregates,
     IfcRelServicesBuildings]
  resource_ifc4:
    [IfcMaterial, IfcMaterialProperties, IfcClassification, IfcClassificationReference,
     IfcPropertySet, IfcPropertySingleValue, IfcElementQuantity]
  forbidden:
    - entity: IfcCeiling
      reason: "IFC4 不存在；顶棚=IfcCovering+CEILING"
    - entity: IfcFloor
      reason: "IFC1.0 旧名，IFC2.0 起并入 IfcSlab；地面=IfcSlab+FLOOR / IfcCovering+FLOORING"
    - entity: IfcEntrance
      reason: "IFC4 不存在；入口=IfcDoor（入口空间可用 IfcSpace/IfcZone 表达）"
  building_as_component_restricted: "IfcBuilding 仅 binding_level=building 可用（整栋级指标）"
  system_requires_type: "IfcDistributionSystem/IfcSystem 必须带 predefined_type 或 ObjectType"
