# ============================================================
# 黄金样本 20 条 · 反例场景（埋雷 16 处，预期 fail=16 / pass=8 / error=0）
# ============================================================
# 与正例同结构，仅改数值/成员/属性存在性——保证记录数不变（24 条），
# 便于断言「恰好 16 条 fail」而非笼统「有失败」。
# 埋雷清单：
#   1 疏散走道顶棚 B1（样本2A）        9  湿区楼面缺防水层（样本8）
#   2 办公室顶棚 B2（样本2B 其他部位） 10 防雷系统缺引下线/接地装置（样本9 has_all）
#   3 消防控制室顶棚 B1（样本3）      11 等电位系统缺金属管道和线路（样本10）
#   4 消防控制室墙面 B1（样本3）      12 RCD 额定剩余电流 100mA（样本12 lte）
#   5 消防控制室地面 B2（样本3）      13 室外灯具 IP44（样本13）
#   6 办公室墙面 B2（样本4 not_in）   14 埋地灯具 IP54（样本13）
#   7 屋面缺传热系数（样本6）         15 水下灯具 IP67（样本13）
#   8 外墙缺「防潮」（样本7）         16 栏杆缺防攀滑措施（样本15）
#   ※ 办公区楼板保持合规 → 仍应零记录（对照组不受影响）
# ============================================================
project_name: 黄金样本20反例
spatial: {site: 场地, building: 测试楼, storeys: [1F]}

spaces:
  - {name: 疏散走道, object_type: 疏散走道, storey: 1F}
  - {name: 消防控制室, object_type: 消防控制室, storey: 1F}
  - {name: 办公室, object_type: 办公室, storey: 1F}
  - {name: 厕所（卫生间）, object_type: 厕所（卫生间）, storey: 1F}
  - {name: 室外, object_type: 室外, storey: 1F}
  - {name: 埋地, object_type: 埋地, storey: 1F}
  - {name: 水下, object_type: 水下, storey: 1F}

zones:
  - {name: 湿区组, spaces: [厕所（卫生间）]}

classification: {name: "GB 8624-2012"}

elements:
  # ---- 埋雷 1/2/3：顶棚三处 ----
  - {ifc_class: IfcCovering, name: 疏散走道顶棚, predefined_type: CEILING, container: 疏散走道,
     psets: [{name: Pset_CoveringCommon, properties: {FlammabilityRating: B1}}]}          # 雷1
  - {ifc_class: IfcCovering, name: 办公室顶棚, predefined_type: CEILING, container: 办公室,
     psets: [{name: Pset_CoveringCommon, properties: {FlammabilityRating: B2}}]}          # 雷2
  - {ifc_class: IfcCovering, name: 消防控制室顶棚, predefined_type: CEILING, container: 消防控制室,
     psets: [{name: Pset_CoveringCommon, properties: {FlammabilityRating: B1}}]}          # 雷3
  # ---- 埋雷 4/5：墙面/地面 ----
  - {ifc_class: IfcCovering, name: 消防控制室墙面, predefined_type: CLADDING, container: 消防控制室,
     psets: [{name: Pset_CoveringCommon, properties: {FlammabilityRating: B1}}]}          # 雷4（s4 不触发：B1 不在禁值域）
  - {ifc_class: IfcCovering, name: 消防控制室地面, predefined_type: FLOORING, container: 消防控制室,
     psets: [{name: Pset_CoveringCommon, properties: {FlammabilityRating: B2}}]}          # 雷5
  # ---- 埋雷 6：办公室墙面 B2（样本4 not_in 命中）----
  - {ifc_class: IfcCovering, name: 办公室墙面, predefined_type: CLADDING, container: 办公室,
     psets: [{name: Pset_CoveringCommon, properties: {FlammabilityRating: B2}}]}          # 雷6

  # ---- 埋雷 7：屋面缺传热系数 ----
  - {ifc_class: IfcSlab, name: 屋面构造层, predefined_type: ROOF}                          # 雷7

  # ---- 埋雷 8：外墙缺「防潮」 ----
  - ifc_class: IfcWall
    name: 外墙
    predefined_type: STANDARD
    psets:
      - {name: Pset_WallCommon, properties: {ThermalTransmittance: 0.45, AcousticRating: "45", FireRating: "1.00h"}}
      - {name: GB_外墙, properties: {防水: 设, 防结露: 设}}                                # 雷8（缺 防潮）

  # ---- 埋雷 9：湿区楼面缺防水层 ----
  - {ifc_class: IfcSlab, name: 湿区楼面, predefined_type: FLOOR, container: 厕所（卫生间）}  # 雷9
  # ---- 对照组保持合规 ----
  - {ifc_class: IfcSlab, name: 办公区楼板, predefined_type: FLOOR, container: 办公室,
     psets: [{name: GB_防水, properties: {防水层: 设}}]}

  # ---- 埋雷 13/14/15：灯具 IP 不足 ----
  - {ifc_class: IfcDistributionElement, name: 室外灯具, container: 室外,
     psets: [{name: GB_灯具, properties: {防护等级: IP44}}]}                              # 雷13
  - {ifc_class: IfcDistributionElement, name: 埋地灯具, container: 埋地,
     psets: [{name: GB_灯具, properties: {防护等级: IP54}}]}                              # 雷14
  - {ifc_class: IfcDistributionElement, name: 水下灯具, container: 水下,
     psets: [{name: GB_灯具, properties: {防护等级: IP67}}]}                              # 雷15

  # ---- 埋雷 12：RCD 额定剩余电流 100mA ----
  - {ifc_class: IfcElectricDistributionBoard, name: 末端配电箱-RCD,
     psets: [{name: GB_电气, properties: {额定剩余电流动作值: 100}}]}                      # 雷12

  # ---- 埋雷 16：栏杆缺 GB_栏杆 psets ----
  - {ifc_class: IfcRailing, name: 儿童活动区栏杆, predefined_type: HANDRAIL}               # 雷16

systems:
  # ---- 埋雷 10：防雷系统只留接闪器 ----
  - ifc_class: IfcDistributionSystem
    name: 防雷接地系统
    predefined_type: LIGHTNINGPROTECTION
    members:
      - {name: 接闪器-1, object_type: 避雷针}                                              # 雷10（缺引下线/接地装置）
  # ---- 埋雷 11：等电位系统缺金属管道和线路 ----
  - ifc_class: IfcDistributionSystem
    name: 等电位联结系统
    predefined_type: EARTHING
    members:
      - {name: 结构钢筋, object_type: 结构钢筋及金属构件}                                   # 雷11
