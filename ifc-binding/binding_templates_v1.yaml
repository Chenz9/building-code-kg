# ------------------------------------------------------------
# T6 宏观 / 场地
# ------------------------------------------------------------
T6:
  name: 宏观 / 场地（不落构件或落几何降级）
  binding_level: macro | site
  text_patterns:
    - "宏观：总则|术语|符号|代号|基本规定|一般规定|分类|分级|保养|维修|监管"
    - "场地：基地|总平面|道路|出入口|道路红线|建筑控制线|管线综合|绿地"
  model_bindings_skeleton:
    macro: []                          # ★ 宏观章禁有 model_bindings（C-BINDING-10）
    site:
      - id: mb_<std>_<clause>_site
        role: <对象>
        ifc_entity: IfcSite
        predefined_type: null
        property_requirements: []
        mapping_status: needs_expert_review
        confidence: low
        rationale: "<几何/跨对象关系，规则引擎 v1 不支持；降级人工或几何引擎>"
  parameters_skeleton:
    site_example:
      - id: <p_id>
        name: <名称>
        operator: gte
        min_value: <数值>
        max_value: null
        unit: m
        ifc_binding: {target: site, path: "几何复核（IfcSite ↔ 周边设施）"}
  rule_form: "site 级：结构校验（绑定须带 mapping_status + rationale），不生成模型规则"
  compile_branch: "§9.4 分支5（needs_expert_review 不生成规则）"
  id_capability: "几何推导量不导出 IDS"
  checklist:
    - "★ macro 章 component_types 必须为 []（v2.2.1 已全库归零，勿回填）"
    - "★ site 级绑定必须带 rationale 说明为何降级（否则结构校验失败）"
    - "★ C-BINDING-03 组合占比分母**已排除 site/macro/process 级与整条降级条文**
        （否则 site 条文多的册会误报『全册兜底』）"
    - "距离/宽度/视距类 → 参数保留（供人工/几何引擎消费）但 rule 为空"
  samples_verified:
    - {clause: "GB 55031-2022#4.3.4", role: MVP⑤, note: "基地出入口 20m 距离 → site 降级 + 几何复核"}
