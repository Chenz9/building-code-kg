samples:

  # ============================================================
  # 样本 2 — GB50222 4.0.4  T1 · 多值域 + b 分支（无空间收窄）
  # ============================================================
  - clause_id: "GB 50222-2017#4.0.4"
    standard_code: "GB 50222-2017"
    clause_no: "4.0.4"
    text: "地上建筑的水平疏散走道和安全出口的门厅，其顶棚应采用A级装修材料，其他部位应采用不低于B1级的装修材料；地下民用建筑的疏散走道和安全出口的门厅，其顶棚、墙面和地面均应采用A级装修材料。"
    related_objects:
      binding_level: element
      component_types: [IfcCovering]
      model_bindings:
        # A) 地上水平疏散走道/门厅顶棚 → A 级（空间收窄）
        - id: mb_gb50222_4_0_4_corridor_ceiling
          role: 疏散走道顶棚
          ifc_entity: IfcCovering
          predefined_type: CEILING
          space_context:
            carrier: IfcSpace.ObjectType
            values: [疏散走道]
          material_binding: {required: true, classification_system: GB8624}
          property_requirements:
            - parameter_ref: p_gb50222_4_0_4_corridor_class
              pset: Pset_CoveringCommon
              property: FlammabilityRating
          mapping_status: reviewed
          confidence: high
          rationale: "地上水平疏散走道/安全出口门厅顶棚应采用 A 级（安全出口门厅未入 space_map，v1 仅以『疏散走道』收窄）"
        # B) 「其他部位」→ 不低于 B1 级（★ 无 space_context → C-BINDING-04(b) 合法分支）
        - id: mb_gb50222_4_0_4_other_ceiling
          role: 其他部位顶棚
          ifc_entity: IfcCovering
          predefined_type: CEILING
          material_binding: {required: true, classification_system: GB8624}
          property_requirements:
            - parameter_ref: p_gb50222_4_0_4_other_class
              pset: Pset_CoveringCommon
              property: FlammabilityRating
          mapping_status: reviewed
          confidence: high
          rationale: "『其他部位』是部位集合补集（非空间收窄）→ 不声明 space_context，规则 when 仅 entity/pdt（v0.4 (b) 分支实证）"
        # C) 地下疏散走道/门厅 墙面·地面 → A 级（地上/地下属建筑级属性，v1 不参数化 → 诚实降级）
        #    注：地下「顶棚」A 级要求已由上方规则 A（疏散走道顶棚→A）正确覆盖，故此处只补墙面/地面。
        - id: mb_gb50222_4_0_4_ug_wall
          role: 地下疏散走道墙面
          ifc_entity: IfcCovering
          predefined_type: CLADDING
          material_binding: {required: true, classification_system: GB8624}
          property_requirements: []
          mapping_status: needs_expert_review
          confidence: low
          rationale: "『地下民用建筑』是建筑级属性，规则引擎 v1 无(地上/地下)判定路径；按空间无条件套用将误伤地上走道墙面 → 降级人工/建筑级属性补齐"
        - id: mb_gb50222_4_0_4_ug_floor
          role: 地下疏散走道地面
          ifc_entity: IfcCovering
          predefined_type: FLOORING
          material_binding: {required: true, classification_system: GB8624}
          property_requirements: []
          mapping_status: needs_expert_review
          confidence: low
          rationale: "同上（地下地面 A 级）；地上/地下不可区分 → 降级人工/建筑级属性补齐"
    parameters:
      - id: p_gb50222_4_0_4_corridor_class
        name: 疏散走道顶棚装修材料燃烧性能等级
        operator: in
        value: [A]
        unit: null
        ifc_binding: {target: element, pset: Pset_CoveringCommon, property: FlammabilityRating, classification: GB8624}
      - id: p_gb50222_4_0_4_other_class
        name: 其他部位顶棚装修材料燃烧性能等级
        operator: in
        value: [A, B1]
        unit: null
        ifc_binding: {target: element, pset: Pset_CoveringCommon, property: FlammabilityRating, classification: GB8624}
        note: "「不低于B1」是组级全序（A>B1>B2>B3）→ 编译为 in [A, B1]"

  # ============================================================
  # 样本 3 — GB50222 4.0.10  T1 · 参数复用（同参多绑定）
  # ============================================================
  - clause_id: "GB 50222-2017#4.0.10"
    standard_code: "GB 50222-2017"
    clause_no: "4.0.10"
    text: "消防控制室等重要房间，其顶棚和墙面应采用A级装修材料，地面及其他装修应采用不低于B1级的装修材料。"
    related_objects:
      binding_level: element
      component_types: [IfcCovering]
      model_bindings:
        - id: mb_gb50222_4_0_10_ceiling
          role: 消防控制室顶棚
          ifc_entity: IfcCovering
          predefined_type: CEILING
          space_context: {carrier: IfcSpace.ObjectType, values: [消防控制室]}
          material_binding: {required: true, classification_system: GB8624}
          property_requirements:
            - {parameter_ref: p_gb50222_4_0_10_a, pset: Pset_CoveringCommon, property: FlammabilityRating}
          mapping_status: reviewed
          confidence: high
          rationale: "顶棚 A 级；与墙面复用同一参数（同参多绑定）"
        - id: mb_gb50222_4_0_10_wall
          role: 消防控制室墙面
          ifc_entity: IfcCovering
          predefined_type: CLADDING
          space_context: {carrier: IfcSpace.ObjectType, values: [消防控制室]}
          material_binding: {required: true, classification_system: GB8624}
          property_requirements:
            - {parameter_ref: p_gb50222_4_0_10_a, pset: Pset_CoveringCommon, property: FlammabilityRating}
          mapping_status: reviewed
          confidence: high
          rationale: "墙面 A 级（装修面层 → CLADDING）"
        - id: mb_gb50222_4_0_10_floor
          role: 消防控制室地面
          ifc_entity: IfcCovering
          predefined_type: FLOORING
          space_context: {carrier: IfcSpace.ObjectType, values: [消防控制室]}
          material_binding: {required: true, classification_system: GB8624}
          property_requirements:
            - {parameter_ref: p_gb50222_4_0_10_b1, pset: Pset_CoveringCommon, property: FlammabilityRating}
          mapping_status: reviewed
          confidence: high
          rationale: "地面不低于 B1 级（值域 [A,B1]）"
    # 注：原文「其他装修」外延不明确（未列举部位），v1 不单列绑定，避免过度约束。
    parameters:
      - id: p_gb50222_4_0_10_a
        name: 消防控制室顶棚墙面装修材料燃烧性能等级
        operator: in
        value: [A]
        unit: null
        ifc_binding: {target: element, pset: Pset_CoveringCommon, property: FlammabilityRating, classification: GB8624}
      - id: p_gb50222_4_0_10_b1
        name: 消防控制室地面装修材料燃烧性能等级
        operator: in
        value: [A, B1]
        unit: null
        ifc_binding: {target: element, pset: Pset_CoveringCommon, property: FlammabilityRating, classification: GB8624}

  # ============================================================
  # 样本 4 — GB50222 4.0.17  T1 · 否定（not_in）
  # ============================================================
  - clause_id: "GB 50222-2017#4.0.17"
    standard_code: "GB 50222-2017"
    clause_no: "4.0.17"
    text: "建筑内部的配电箱、控制面板、接线盒、开关、插座等不应直接安装在低于B1级的装修材料上；用于顶棚和墙面装修的木质类板材，当内部含有电器、电线等物体时，应采用不低于B1级的材料。"
    related_objects:
      binding_level: element
      component_types: [IfcCovering]
      model_bindings:
        - id: mb_gb50222_4_0_17_covering
          role: 装修面层（配电箱等依附面）
          ifc_entity: IfcCovering
          predefined_type: CLADDING
          material_binding: {required: true, classification_system: GB8624}
          property_requirements:
            - {parameter_ref: p_gb50222_4_0_17_notbelow, pset: Pset_CoveringCommon, property: FlammabilityRating}
          mapping_status: reviewed
          confidence: medium
          rationale: "『不应直接安装在低于B1级的装修材料上』→ 装修面层不得为 B2/B3；无法在 IFC 中识别『配电箱所依附的具体面层』，故对全部装修面层取最严解读（not_in 否定逻辑实证样本）"
    parameters:
      - id: p_gb50222_4_0_17_notbelow
        name: 装修面层燃烧性能等级（禁值域）
        operator: not_in
        value: [B2, B3]
        unit: null
        ifc_binding: {target: element, pset: Pset_CoveringCommon, property: FlammabilityRating, classification: GB8624}
        note: "禁值表达；等价于 in [A, B1]，但保留 not_in 以实证 IDS prohibited 基数导出"

  # ============================================================
  # 样本 5 — GB50222 5.1.1  T1_table · 分阶段（第一步骨架）
  # ============================================================
  - clause_id: "GB 50222-2017#5.1.1"
    standard_code: "GB 50222-2017"
    clause_no: "5.1.1"
    text: "单层、多层民用建筑内部各部位装修材料的燃烧性能等级，不应低于本规范表5.1.1的规定。"
    related_objects:
      binding_level: element
      component_types: [IfcCovering]
      model_bindings:
        - id: mb_gb50222_5_1_1_table_skeleton
          role: 各部位装修材料（表5.1.1 骨架）
          ifc_entity: IfcCovering
          predefined_type: CEILING
          material_binding: {required: true, classification_system: GB8624}
          property_requirements:
            - parameter_ref: PENDING_TABLE_STRUCTURE    # ★ 占位符（表未结构化，C-BINDING-09 对 draft 豁免）
              pset: Pset_CoveringCommon
              property: FlammabilityRating
          mapping_status: draft
          confidence: low
          rationale: "表格型条文（表5.1.1）：行=建筑物及场所、列=部位（顶棚/墙面/地面/隔断/固定家具/窗帘/帷幕/其他装修装饰材料）；表已在正本结构化（tables[].headers+rows 齐备），待『行→space_context / 列→predefined_type』绑定展开（batch 1d）；第一步只建骨架，draft 不编译规则"
    parameters: []                       # ★ 未结构化前禁止猜值（占位符不指向参数）

  # ============================================================
  # 样本 6 — GB55031 6.1.1  T2 · 存在性（MVP② 复用）
  # ============================================================
  - clause_id: "GB 55031-2022#6.1.1"
    standard_code: "GB 55031-2022"
    clause_no: "6.1.1"
    text: "屋面应合理采取保温、隔热、防水等措施。屋面防水应按排水与防水相结合的原则，根据建筑物的重要程度及使用功能，结合工程特点、气候条件等按不同等级设置防水层。"
    related_objects:
      binding_level: element
      component_types: [IfcSlab, IfcRoof]
      model_bindings:
        - id: mb_gb55031_6_1_1_roofslab
          role: 屋面构造层
          ifc_entity: IfcSlab
          predefined_type: ROOF
          property_requirements:
            - {parameter_ref: null, pset: Pset_SlabCommon, property: ThermalTransmittance}
          mapping_status: mapped
          confidence: high
          rationale: "保温隔热措施落屋面构造层，交付应含传热系数；防水等级值域项目约定，本条不定值（词表覆盖度 weak）"
        - id: mb_gb55031_6_1_1_roof
          role: 屋面（整体）
          ifc_entity: IfcRoof
          predefined_type: FLAT_ROOF
          property_requirements: []
          mapping_status: mapped
          confidence: medium
          rationale: "整体性约束挂 IfcRoof；按坡度信息选枚举，无信息可缺省"
    parameters: []

  # ============================================================
  # 样本 7 — GB55031 6.2.2  T2 · 一属性一条目（多措施）
  # ============================================================
  - clause_id: "GB 55031-2022#6.2.2"
    standard_code: "GB 55031-2022"
    clause_no: "6.2.2"
    text: "外墙应根据气候条件和建筑使用要求，采取保温隔热、隔声、防火、防水、防潮和防结露等措施。"
    related_objects:
      binding_level: element
      component_types: [IfcWall]
      model_bindings:
        - id: mb_gb55031_6_2_2_extwall
          role: 外墙（围护本体）
          ifc_entity: IfcWall
          predefined_type: STANDARD
          property_requirements:
            - {parameter_ref: null, pset: Pset_WallCommon, property: ThermalTransmittance}
            - {parameter_ref: null, pset: Pset_WallCommon, property: AcousticRating}
            - {parameter_ref: null, pset: Pset_WallCommon, property: FireRating}
            - {parameter_ref: null, pset: GB_外墙, property: 防水}
            - {parameter_ref: null, pset: GB_外墙, property: 防潮}
            - {parameter_ref: null, pset: GB_外墙, property: 防结露}
          mapping_status: mapped
          confidence: medium
          rationale: "六类措施（保温隔热/隔声/防火/防水/防潮/防结露）→ 一属性一条目，全部为存在性交付检查；数值属项目 EIR，本条不定值"
    parameters: []

  # ============================================================
  # 样本 8 — GB55031 6.3.3  T2 · IfcZone 空间组（v0.4 夹具实证）
  # ============================================================
  - clause_id: "GB 55031-2022#6.3.3"
    standard_code: "GB 55031-2022"
    clause_no: "6.3.3"
    text: "建筑内的厕所（卫生间）、浴室、公共厨房、垃圾间等场所的楼面、地面，开敞式外廊、阳台的楼面应设防水层。"
    related_objects:
      binding_level: element
      component_types: [IfcSlab]
      model_bindings:
        - id: mb_gb55031_6_3_3_wetfloor
          role: 湿区楼面（防水层）
          ifc_entity: IfcSlab
          predefined_type: FLOOR
          space_context:
            carrier: IfcZone.Name
            values: [湿区组]
            zone_hint: "湿区（厕所/浴室/公共厨房/垃圾间，词表 space_zones）"
          property_requirements:
            - {parameter_ref: null, pset: GB_防水, property: 防水层}
          mapping_status: mapped
          confidence: medium
          rationale: "『应设防水层』是定性措施 → 交付完整性检查；空间范围用湿区组收窄（逐空间枚举的可维护替代）"
    parameters: []

  # ============================================================
  # 样本 9 — GB55024 7.1.1  T3 · has_all + 别名归一（MVP③ 复用）
  # ============================================================
  - clause_id: "GB 55024-2022#7.1.1"
    standard_code: "GB 55024-2022"
    clause_no: "7.1.1"
    text: "各类防雷建筑物应设接闪器、引下线、接地装置，并应采取防闪电电涌侵入的措施。"
    related_objects:
      binding_level: system
      component_types: [IfcDistributionSystem, IfcDistributionElement]
      model_bindings:
        - id: mb_gb55024_7_1_1_lps
          role: 防雷接地系统
          ifc_entity: IfcDistributionSystem
          predefined_type: LIGHTNINGPROTECTION
          member_requirements: [接闪器, 引下线, 接地装置]
          property_requirements: []
          mapping_status: reviewed
          confidence: high
          rationale: "系统级承载；成员写法差异（避雷针/接闪带/接地网）由词表别名归一对齐"
        - id: mb_gb55024_7_1_1_devices
          role: 防雷装置
          ifc_entity: IfcDistributionElement
          predefined_type: null
          system_context: {ifc_entity: IfcDistributionSystem, predefined_type: LIGHTNINGPROTECTION}
          property_requirements: []
          mapping_status: needs_expert_review
          confidence: low
          rationale: "装置级 ObjectType 项目约定承载（v1 限制：element 级 system_context 不编译为 when）"
    parameters: []

  # ============================================================
  # 样本 10 — GB55024 7.1.5  T3 · 成员枚举扩展（等电位联结系统）
  # ============================================================
  - clause_id: "GB 55024-2022#7.1.5"
    standard_code: "GB 55024-2022"
    clause_no: "7.1.5"
    text: "各类防雷建筑物除应符合本规范第7.1.2条～第7.1.4条的规定外，尚应符合下列规定：1 在建筑物的地下一层或地面层处，下列物体应与防雷装置做防雷等电位连接：1 )建筑物结构钢筋及金属构件；2 )进出建筑物处的金属管道和线路。2当建筑物的电气与智能化系统需要做防雷击电磁脉冲时，应在设计时将建筑物的金属支撑物、金属框架或结构钢筋等自然构件、金属管道、配电的保护接地系统等与防雷装置组成一个接地系统。"
    related_objects:
      binding_level: system
      component_types: [IfcDistributionSystem, IfcDistributionElement]
      model_bindings:
        - id: mb_gb55024_7_1_5_bonding
          role: 等电位联结系统
          ifc_entity: IfcDistributionSystem
          predefined_type: EARTHING
          member_requirements: [结构钢筋及金属构件, 金属管道和线路]
          property_requirements: []
          mapping_status: reviewed
          confidence: medium
          rationale: "等电位联结对象（结构钢筋及金属构件 / 进出建筑物的金属管道和线路）→ EARTHING 系统成员；成员集合**扩展**于 7.1.1 的三装置（矩阵『成员枚举扩展』样本）"
        - id: mb_gb55024_7_1_5_devices
          role: 等电位联结导体
          ifc_entity: IfcDistributionElement
          predefined_type: null
          system_context: {ifc_entity: IfcDistributionSystem, predefined_type: EARTHING}
          property_requirements: []
          mapping_status: needs_expert_review
          confidence: low
          rationale: "联结导体无专用 IFC 实体，ObjectType 项目约定（同 7.1.1 限制）"
    parameters: []

  # ============================================================
  # 样本 11 — GB55024 4.5.1  T3 · 成员非构件（保护功能）→ 整体降级
  # ============================================================
  - clause_id: "GB 55024-2022#4.5.1"
    standard_code: "GB 55024-2022"
    clause_no: "4.5.1"
    text: "建筑物应设置照明供配电系统。照明配电终端回路应设短路保护、过负荷保护和接地故障保护，室外照明配电终端回路还应设置剩余电流动作保护电器作为附加防护。"
    related_objects:
      binding_level: system
      component_types: [IfcDistributionSystem, IfcDistributionElement]
      model_bindings:
        - id: mb_gb55024_4_5_1_lighting
          role: 照明配电终端回路
          ifc_entity: IfcDistributionSystem
          predefined_type: LIGHTING
          member_requirements: [短路保护, 过负荷保护, 接地故障保护]
          property_requirements: []
          mapping_status: needs_expert_review
          confidence: low
          rationale: "保护功能类成员（短路/过负荷/接地故障保护）**不是构件**，IFC4 无实体承载，且『回路是否为终端回路』无关系路径 → 整体降级人工复核（矩阵『成员非构件』样本）"
        - id: mb_gb55024_4_5_1_protective
          role: 保护电器（附加防护）
          ifc_entity: IfcDistributionElement
