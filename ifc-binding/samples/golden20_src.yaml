# 用途：按 binding_templates_v1.yaml（T1–T6 骨架）逐条补 model_bindings。
# 本文件**只含源数据**（related_objects + parameters），不含 compiled_rules——
#   compiled_rules 由 tools/rule_compiler.py --emit 生成（单一事实源，防手写漂移）。
#
# 条文原文取自 03_标准结构化/_v2/ 的 3 册开源正本（2026-09-22 抽取）。
# 样本 6/9/16/19 为 MVP 已实证样本，此处**复用**其结构以保证 golden20 自洽。
# 样本 5 为表格型 → 分阶段第一步（draft + PENDING_TABLE_STRUCTURE）。
# 样本 14/15(几何型)/20 为几何降级（needs_expert_review + 参数保留，不生成规则）。
#
# 生成： python tools/rule_compiler.py golden20_src.yaml --emit golden20_bindings.yaml
# 校验： python tools/rule_compiler.py golden20_bindings.yaml     # 须 0
#        python tools/audit_binding_v23.py golden20_bindings.yaml # 须 0
# ============================================================

