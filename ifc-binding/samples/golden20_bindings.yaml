- clause_id: GB 50222-2017#4.0.17
  standard_code: GB 50222-2017
  clause_no: 4.0.17
  text: 建筑内部的配电箱、控制面板、接线盒、开关、插座等不应直接安装在低于B1级的装修材料上；用于顶棚和墙面装修的木质类板材，当内部含有电器、电线等物体时，应采用不低于B1级的材料。
  related_objects:
    binding_level: element
    component_types:
    - IfcCovering
    model_bindings:
    - id: mb_gb50222_4_0_17_covering
      role: 装修面层（配电箱等依附面）
      ifc_entity: IfcCovering
      predefined_type: CLADDING
      material_binding:
        required: true
        classification_system: GB8624
      property_requirements:
      - parameter_ref: p_gb50222_4_0_17_notbelow
        pset: Pset_CoveringCommon
        property: FlammabilityRating
      mapping_status: reviewed
      confidence: medium
      rationale: 『不应直接安装在低于B1级的装修材料上』→ 装修面层不得为 B2/B3；无法在 IFC 中识别『配电箱所依附的具体面层』，故对全部装修面层取最严解读（not_in
        否定逻辑实证样本）
  parameters:
  - id: p_gb50222_4_0_17_notbelow
    name: 装修面层燃烧性能等级（禁值域）
    operator: not_in
    value:
    - B2
    - B3
    unit: null
    ifc_binding:
      target: element
      pset: Pset_CoveringCommon
      property: FlammabilityRating
      classification: GB8624
    note: 禁值表达；等价于 in [A, B1]，但保留 not_in 以实证 IDS prohibited 基数导出
  compiled_rules:
  - rule_id: R_4_0_17_covering_1
    source_clause: GB 50222-2017#4.0.17
    mapping_refs:
    - mb_gb50222_4_0_17_covering
    parameter_refs:
    - p_gb50222_4_0_17_notbelow
    when:
      all:
      - path: object.entity
        op: eq
        value: IfcCovering
      - path: object.predefined_type
        op: eq
        value: CLADDING
    not_when: []
    then:
      severity: error
      message: GB 50222-2017#4.0.17 装修面层（配电箱等依附面）：FlammabilityRating 落入禁值域 ['B2',
        'B3']
      check:
        path: object.pset[Pset_CoveringCommon].FlammabilityRating
        op: not_in
        parameter_ref: p_gb50222_4_0_17_notbelow
- clause_id: GB 50222-2017#5.1.1
  standard_code: GB 50222-2017
  clause_no: 5.1.1
  text: 单层、多层民用建筑内部各部位装修材料的燃烧性能等级，不应低于本规范表5.1.1的规定。
