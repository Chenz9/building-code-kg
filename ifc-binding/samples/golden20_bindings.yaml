  parameters: []
  compiled_rules: []
- clause_id: GB 55024-2022#4.6.5
  standard_code: GB 55024-2022
  clause_no: 4.6.5
  text: 当采用剩余电流动作保护电器作为电击防护附加防护措施时，应符合下列规定：1 额定剩余电流动作值不应大于30mA。2额定电流不超过32A的下列回路应装设剩余电流动作保护电器：1
    )供一般人员使用的电源插座回路；2 )室内移动电气设备；3 )人员可触及的室外电气设备。3剩余电流动作保护电器不应作为唯一的保护措施。4采用剩余电流动作保护电器时应装设保护接地导体
    （PE）。
  related_objects:
    binding_level: element
    component_types:
    - IfcElectricDistributionBoard
    model_bindings:
    - id: mb_gb55024_4_6_5_rcd
      role: 剩余电流动作保护电器
      ifc_entity: IfcElectricDistributionBoard
      predefined_type: null
      property_requirements:
