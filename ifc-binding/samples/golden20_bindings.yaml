    model_bindings:
    - id: mb_gb50222_5_1_1_table_skeleton
      role: 各部位装修材料（表5.1.1 骨架）
      ifc_entity: IfcCovering
      predefined_type: CEILING
      material_binding:
        required: true
        classification_system: GB8624
      property_requirements:
      - parameter_ref: PENDING_TABLE_STRUCTURE
        pset: Pset_CoveringCommon
        property: FlammabilityRating
      mapping_status: draft
      confidence: low
      rationale: 表格型条文（表5.1.1）：行=建筑物及场所、列=部位（顶棚/墙面/地面/隔断/固定家具/窗帘/帷幕/其他装修装饰材料）；表已在正本结构化（tables[].headers+rows
        齐备），待『行→space_context / 列→predefined_type』绑定展开（batch 1d）；第一步只建骨架，draft 不编译规则
  parameters: []
  compiled_rules: []
- clause_id: GB 55031-2022#6.1.1
  standard_code: GB 55031-2022
  clause_no: 6.1.1
  text: 屋面应合理采取保温、隔热、防水等措施。屋面防水应按排水与防水相结合的原则，根据建筑物的重要程度及使用功能，结合工程特点、气候条件等按不同等级设置防水层。
  related_objects:
    binding_level: element
    component_types:
    - IfcSlab
    - IfcRoof
    model_bindings:
    - id: mb_gb55031_6_1_1_roofslab
      role: 屋面构造层
      ifc_entity: IfcSlab
      predefined_type: ROOF
      property_requirements:
      - parameter_ref: null
        pset: Pset_SlabCommon
        property: ThermalTransmittance
      mapping_status: mapped
      confidence: high
      rationale: 保温隔热措施落屋面构造层，交付应含传热系数；防水等级值域项目约定，本条不定值（词表覆盖度 weak）
    - id: mb_gb55031_6_1_1_roof
      role: 屋面（整体）
      ifc_entity: IfcRoof
      predefined_type: FLAT_ROOF
      property_requirements: []
      mapping_status: mapped
      confidence: medium
      rationale: 整体性约束挂 IfcRoof；按坡度信息选枚举，无信息可缺省
  parameters: []
  compiled_rules:
  - rule_id: R_6_1_1_roofslab_1
    source_clause: GB 55031-2022#6.1.1
    mapping_refs:
    - mb_gb55031_6_1_1_roofslab
    parameter_refs: []
    when:
      all:
      - path: object.entity
        op: eq
        value: IfcSlab
      - path: object.predefined_type
        op: eq
        value: ROOF
    not_when: []
    then:
      severity: error
      message: GB 55031-2022#6.1.1 屋面构造层：缺少属性 ThermalTransmittance（交付完整性检查）
      check:
        path: object.pset[Pset_SlabCommon].ThermalTransmittance
        op: exists
