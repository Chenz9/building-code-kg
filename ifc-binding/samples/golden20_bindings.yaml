        property: 额定剩余电流动作值
      mapping_status: reviewed
      confidence: medium
      rationale: 额定剩余电流动作值 ≤30mA（原文仅 1 款给值；2–4 款为配置/措施要求，v1 不单列）。★ 落点取词表 member_alias_map
        提示的 IfcElectricDistributionBoard，与样本 13 灯具（IfcDistributionElement）实体分离——避免全域规则把灯具/系统成员误卷入
  parameters:
  - id: p_gb55024_4_6_5_rcd
    name: 额定剩余电流动作值
    operator: lte
    max_value: 30
    min_value: null
    unit: mA
    ifc_binding:
      target: element
      pset: GB_电气
      property: 额定剩余电流动作值
    note: ★ 单位一致性须人工核对（属性实际单位 vs 条文 mA）；引擎与 IDS 按字面数值比较，不换算
  compiled_rules:
  - rule_id: R_4_6_5_rcd_1
    source_clause: GB 55024-2022#4.6.5
    mapping_refs:
    - mb_gb55024_4_6_5_rcd
    parameter_refs:
    - p_gb55024_4_6_5_rcd
    when:
      all:
      - path: object.entity
        op: eq
        value: IfcElectricDistributionBoard
    not_when: []
    then:
      severity: error
      message: GB 55024-2022#4.6.5 剩余电流动作保护电器：额定剩余电流动作值 不满足 lte 30mA
      check:
        path: object.pset[GB_电气].额定剩余电流动作值
        op: lte
        parameter_ref: p_gb55024_4_6_5_rcd
