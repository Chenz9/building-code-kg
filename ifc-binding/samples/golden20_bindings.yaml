- clause_id: GB 55024-2022#7.1.5
  standard_code: GB 55024-2022
  clause_no: 7.1.5
  text: 各类防雷建筑物除应符合本规范第7.1.2条～第7.1.4条的规定外，尚应符合下列规定：1 在建筑物的地下一层或地面层处，下列物体应与防雷装置做防雷等电位连接：1
    )建筑物结构钢筋及金属构件；2 )进出建筑物处的金属管道和线路。2当建筑物的电气与智能化系统需要做防雷击电磁脉冲时，应在设计时将建筑物的金属支撑物、金属框架或结构钢筋等自然构件、金属管道、配电的保护接地系统等与防雷装置组成一个接地系统。
  related_objects:
    binding_level: system
    component_types:
    - IfcDistributionSystem
    - IfcDistributionElement
    model_bindings:
    - id: mb_gb55024_7_1_5_bonding
      role: 等电位联结系统
      ifc_entity: IfcDistributionSystem
      predefined_type: EARTHING
      member_requirements:
      - 结构钢筋及金属构件
      - 金属管道和线路
      property_requirements: []
      mapping_status: reviewed
      confidence: medium
      rationale: 等电位联结对象（结构钢筋及金属构件 / 进出建筑物的金属管道和线路）→ EARTHING 系统成员；成员集合**扩展**于 7.1.1
        的三装置（矩阵『成员枚举扩展』样本）
    - id: mb_gb55024_7_1_5_devices
      role: 等电位联结导体
      ifc_entity: IfcDistributionElement
      predefined_type: null
      system_context:
        ifc_entity: IfcDistributionSystem
        predefined_type: EARTHING
      property_requirements: []
      mapping_status: needs_expert_review
      confidence: low
      rationale: 联结导体无专用 IFC 实体，ObjectType 项目约定（同 7.1.1 限制）
  parameters: []
  compiled_rules:
  - rule_id: R_7_1_5_bonding_1
    source_clause: GB 55024-2022#7.1.5
    mapping_refs:
    - mb_gb55024_7_1_5_bonding
    - mb_gb55024_7_1_5_devices
    parameter_refs: []
