- clause_id: GB 50222-2017#4.0.4
  standard_code: GB 50222-2017
  clause_no: 4.0.4
  text: 地上建筑的水平疏散走道和安全出口的门厅，其顶棚应采用A级装修材料，其他部位应采用不低于B1级的装修材料；地下民用建筑的疏散走道和安全出口的门厅，其顶棚、墙面和地面均应采用A级装修材料。
  related_objects:
    binding_level: element
    component_types:
    - IfcCovering
    model_bindings:
    - id: mb_gb50222_4_0_4_corridor_ceiling
      role: 疏散走道顶棚
      ifc_entity: IfcCovering
      predefined_type: CEILING
      space_context:
        carrier: IfcSpace.ObjectType
        values:
        - 疏散走道
      material_binding:
        required: true
        classification_system: GB8624
      property_requirements:
      - parameter_ref: p_gb50222_4_0_4_corridor_class
        pset: Pset_CoveringCommon
        property: FlammabilityRating
      mapping_status: reviewed
      confidence: high
      rationale: 地上水平疏散走道/安全出口门厅顶棚应采用 A 级（安全出口门厅未入 space_map，v1 仅以『疏散走道』收窄）
    - id: mb_gb50222_4_0_4_other_ceiling
      role: 其他部位顶棚
      ifc_entity: IfcCovering
      predefined_type: CEILING
      material_binding:
        required: true
        classification_system: GB8624
      property_requirements:
      - parameter_ref: p_gb50222_4_0_4_other_class
        pset: Pset_CoveringCommon
        property: FlammabilityRating
      mapping_status: reviewed
      confidence: high
      rationale: 『其他部位』是部位集合补集（非空间收窄）→ 不声明 space_context，规则 when 仅 entity/pdt（v0.4
        (b) 分支实证）
    - id: mb_gb50222_4_0_4_ug_wall
      role: 地下疏散走道墙面
      ifc_entity: IfcCovering
      predefined_type: CLADDING
      material_binding:
        required: true
        classification_system: GB8624
      property_requirements: []
      mapping_status: needs_expert_review
      confidence: low
      rationale: 『地下民用建筑』是建筑级属性，规则引擎 v1 无(地上/地下)判定路径；按空间无条件套用将误伤地上走道墙面 → 降级人工/建筑级属性补齐
    - id: mb_gb50222_4_0_4_ug_floor
      role: 地下疏散走道地面
      ifc_entity: IfcCovering
      predefined_type: FLOORING
      material_binding:
        required: true
        classification_system: GB8624
      property_requirements: []
      mapping_status: needs_expert_review
      confidence: low
      rationale: 同上（地下地面 A 级）；地上/地下不可区分 → 降级人工/建筑级属性补齐
  parameters:
  - id: p_gb50222_4_0_4_corridor_class
    name: 疏散走道顶棚装修材料燃烧性能等级
    operator: in
    value:
    - A
    unit: null
    ifc_binding:
      target: element
      pset: Pset_CoveringCommon
      property: FlammabilityRating
      classification: GB8624
  - id: p_gb50222_4_0_4_other_class
    name: 其他部位顶棚装修材料燃烧性能等级
    operator: in
    value:
    - A
    - B1
    unit: null
    ifc_binding:
      target: element
      pset: Pset_CoveringCommon
      property: FlammabilityRating
      classification: GB8624
    note: 「不低于B1」是组级全序（A>B1>B2>B3）→ 编译为 in [A, B1]
  compiled_rules:
  - rule_id: R_4_0_4_ceiling_1
    source_clause: GB 50222-2017#4.0.4
    mapping_refs:
    - mb_gb50222_4_0_4_corridor_ceiling
    parameter_refs:
    - p_gb50222_4_0_4_corridor_class
    when:
      all:
      - path: object.entity
        op: eq
        value: IfcCovering
      - path: object.predefined_type
        op: eq
        value: CEILING
      - path: object.space.usage
        op: in
        value:
        - 疏散走道
    not_when: []
    then:
      severity: error
      message: GB 50222-2017#4.0.4 疏散走道顶棚：FlammabilityRating = ['A'] 之外（不满足值域）
      check:
        path: object.pset[Pset_CoveringCommon].FlammabilityRating
        op: in
        parameter_ref: p_gb50222_4_0_4_corridor_class
  - rule_id: R_4_0_4_ceiling_2
    source_clause: GB 50222-2017#4.0.4
    mapping_refs:
    - mb_gb50222_4_0_4_other_ceiling
    parameter_refs:
    - p_gb50222_4_0_4_other_class
    when:
      all:
      - path: object.entity
        op: eq
        value: IfcCovering
      - path: object.predefined_type
        op: eq
        value: CEILING
    not_when: []
    then:
      severity: error
      message: GB 50222-2017#4.0.4 其他部位顶棚：FlammabilityRating = ['A', 'B1'] 之外（不满足值域）
      check:
        path: object.pset[Pset_CoveringCommon].FlammabilityRating
        op: in
        parameter_ref: p_gb50222_4_0_4_other_class
