# ============================================================
# 工程规范结构化索引库 — 结构规范定义 v2.2.2（当前权威）
# ============================================================
# 本文件是 v2.2 字段定义的权威参考。每个规范的正式交付为
# 同目录下的 <标准编号>.yaml（含 standard / clauses / executable_rules 三段）。
#
# 修订要点（v2.2.2，2026-09-10）：
#   - ★ 边界语义：否定词 + 紧邻边界动词（不得少于3间 / 不应大于50N）语义是
#       边界约束（≥/≤），polarity 归 正面/required，不再误标为 反面/prohibited（§6.2）
#   - ★ 跨档 mixed：定级取严与极性判定相互独立，「必须…不得…」也须识别为
#       正反并存并生成 constraint_items（§6.2）
#   - ★ text 唯一权威：modal_words 由 text 重推导，清除正文中不存在的遗留词
#   - 审计规则扩充至 11 条，新增 MODAL_TEXT_MISMATCH / MODAL_DERIVE_MISMATCH /
#       MODAL_ITEMS_ONLY_MIXED / MODAL_BOUNDARY_POLARITY（§6.5）
#
# 修订要点（相对 v2.1）：
#   - 【核心】语气字段重构：modal_level 废弃，改为
#       strictness（严格等级）× polarity（正/反面）正交叠加
#     依据《工程建设标准编写规定》"本规范用词说明"四档两极体系（v2.2 §6）
#   - 枚举采用「中文/英文」双列写法，兼顾人工阅读与程序解析（v2.2 §6.1）
#   - 新增 modal_words_primary：定级主词，解决混词无级问题
#   - 新增 constraint_items：polarity=正反并存/mixed 的条文在条内细化拆分
#   - is_mandatory_clause（是否强条）与语气等级解耦：前者是法定属性，
#     后者是文本属性，二者正交，不可互相推导（v2.2 §6.4）
#
# 继承 v2.1 的修订要点：
#   - 规范级元数据 schema_version / last_reviewed_date（v2.1 §7）
#   - 参数命名规范：禁 OCR 碎片，必须是语义短语（v2.1 §2.1）
#   - 单位词典：禁错配单位（v2.1 §2.2）
#   - applicability.exceptions 风格统一（v2.1 §3）
#   - 全文强制规范（GB 55xxx）全部 is_mandatory_clause=True（v2.1 §4）
#   - parameter_table 的 content 改为结构化 {headers, rows}（v2.1 表格）
# ============================================================

