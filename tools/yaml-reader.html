    arr(c.converted_tables).forEach(function(t){
      parts.push('<div class="kv"><span class="lbl">转换表</span><span class="val">' +
        (typeof t === 'string' ? '<pre class="raw">' + esc(t) + '</pre>'
          : '<pre class="raw">' + esc(t.raw || asText(t)) + '</pre>' + (t.note ? '<div class="dimnote">' + esc(t.note) + '</div>' : '')) +
        '</span></div>');
    });

    arr(c.references).forEach(function(r){
      if(typeof r === 'string'){ parts.push(kvHTML('引用', r, ql)); return; }
      const st = r.resolution_status || '';
      const bc = /已|ok|resolved/i.test(st) ? 'b-ok' : (/未|待|un/i.test(st) ? 'b-warn' : 'b-gray');
      parts.push('<div class="kv"><span class="lbl">引用</span><span class="val"><span class="chips">' +
        '<span class="chip ref">' + esc(r.target_standard || '') + (r.target_clause ? ' ' + esc(r.target_clause) : '') + '</span>' +
        (st ? '<span class="badge ' + bc + '">' + esc(st) + '</span>' : '') +
        (r.resolution_note ? '<span class="dimnote">' + esc(r.resolution_note) + '</span>' : '') +
        (r.original_text ? '<div class="dimnote">原文：' + esc(r.original_text) + '</div>' : '') +
        '</span></span></div>');
    });

    arr(c.conflicts).forEach(function(x){
      parts.push(kvHTML('冲突', asText(x), ql));
    });

    const ro = c.related_objects || {};
    const comps = arr(ro.component_types), acts = arr(ro.activity_types);
    const extra = Object.keys(ro).filter(function(k){ return k !== 'component_types' && k !== 'activity_types'; });
    if(comps.length || acts.length || extra.length){
      parts.push('<div class="kv"><span class="lbl">关联对象</span><span class="val"><span class="chips">' +
        comps.map(function(x){ return '<span class="chip ifc">' + esc(x) + '</span>'; }).join('') +
        acts.map(function(x){ return '<span class="chip act">' + esc(x) + '</span>'; }).join('') +
        extra.map(function(k){ return '<span class="chip">' + esc(k) + '：' + esc(short(asText(ro[k]), 60)) + '</span>'; }).join('') +
        '</span></span></div>');
    }

    crules.forEach(function(r){
      const whens = arr(r.when), then = r.then;
      let thenTxt = '';
      if(typeof then === 'string') thenTxt = then;
      else if(then && typeof then === 'object'){
        const p = then;
        if(p.parameter !== undefined || p.min_value !== undefined || p.max_value !== undefined){
          thenTxt = (p.parameter || '') + (p.condition ? '（' + p.condition + '）' : '') + ' ' +
            (p.min_value !== null && p.min_value !== undefined ? '≥ ' + p.min_value : '') +
            (p.max_value !== null && p.max_value !== undefined ? ' ≤ ' + p.max_value : '') +
            (p.unit ? ' ' + p.unit : '');
        } else {
          thenTxt = Object.keys(p).map(function(k){
            const v = p[k];
            return k + '：' + (v !== null && typeof v === 'object' ? JSON.stringify(v) : String(v));
          }).join('；');
        }
      }
      parts.push('<div class="kv"><span class="lbl">' + esc(r.rule_type || '规则') + '</span><span class="val">' +
        '<div class="rule">' +
        (whens.length ? '<div class="rw"><b>当</b> ' + whens.map(function(w){ return esc(w); }).join('　<i style="color:var(--dim)">且</i>　') + '</div>' : '') +
        '<div class="rt"><b>则</b> ' + esc(thenTxt) + '</div>' +
        '<div class="rmeta">' + esc(r.rule_id || '') + (r.auto_generated ? ' · 自动生成的镜像规则' : '') + (r.note ? ' · ' + esc(r.note) : '') + '</div>' +
        '</div></span></div>');
    });

    if(c.abolition_note || S.edit) parts.push(kvHTML('废止说明', c.abolition_note, ql, cbase + '.abolition_note', c.clause_no));
    if(ct.mandatory_basis || S.edit) parts.push(kvHTML('强条依据', ct.mandatory_basis, ql, cbase + '.constraint.mandatory_basis', c.clause_no));

    if(parts.length) h += '<div class="struct">' + parts.join('') + '</div>';
  }

  if(S.rawClause.has(c.clause_no)){
    S.expanded = new Set(['']);
    const sub = renderTree(c, '').replace(/<div class="thead">[\s\S]*?<\/div>/, '').replace(/<div class="crumb"[\s\S]*?<\/div>/, '');
    h += '<details class="rawbox" open><summary>原始结构（YAML 树）</summary>' + sub + '</details>';
  }
  h += '</article>';
  return h;
}
function kvHTML(label, val, ql, epPath, cno){
  const body = (S.edit && epPath)
    ? ed(val, epPath, label, cno)
    : hl(val, ql);
  return '<div class="kv"><span class="lbl">' + esc(label) + '</span><span class="val">' + body + '</span></div>';
}
/* 可编辑包裹：非编辑态就是普通文本，编辑态变成 contenteditable + 路径标记 */
function ed(val, path, field, cno, kind){
  if(!S.edit) return esc(val === null || val === undefined ? '' : val);
  const txt = (val === null || val === undefined) ? '' : String(val);
  return '<span contenteditable="true" data-ep="' + esc(path) + '"' +
    ' data-ep-field="' + esc(field || '') + '"' +
    (cno ? ' data-ep-clause="' + esc(cno) + '"' : '') +
    (kind ? ' data-ep-kind="' + esc(kind) + '"' : '') + '>' + esc(txt) + '</span>';
}

/* ---- 表格渲染：兼容 headers+rows（结构化）与 content（原始文本）---- */
function tableHTML(t, ql, base, cno){
  const tid = t.table_id !== undefined ? t.table_id : t.id;
  const idKey = t.table_id !== undefined ? 'table_id' : 'id';
  const title = (t.title !== undefined ? t.title : (t.description !== undefined ? t.description : t.caption));
  const titleKey = (t.title !== undefined ? 'title' : (t.description !== undefined ? 'description' : 'caption'));
  const heads = arr(t.headers), rows = arr(t.rows);
  const content = (t.content === null || t.content === undefined) ? '' : asText(t.content);

  let h = '<div class="kv"><span class="lbl">' + esc(t.type || 'table') + '</span><span class="val">';
  h += '<div class="tbl-head">';
  h += '<span class="cap">' + ed(tid, base + '.' + idKey, '表号', cno) + '</span>';
  h += '<span>' + ed(title, base + '.' + titleKey, '表标题', cno) + '</span>';
  h += rows.length ? '<span class="tblsrc">结构化 ' + rows.length + ' 行</span>'
                   : (content ? '<span class="tblsrc">原始文本 · 未结构化</span>' : '');
  h += '<button class="tbtn" data-edittbl="' + esc(base) + '" data-tblcno="' + esc(cno || '') + '">编辑表格</button>';
  h += '</div>';

  if(rows.length){
    let cols = heads.slice();
    if(!cols.length && rows[0] && !Array.isArray(rows[0]) && typeof rows[0] === 'object') cols = Object.keys(rows[0]);
    h += '<div class="tbwrap"><table class="data">';
    h += '<thead><tr>' + cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function(r){
      if(Array.isArray(r)){
        h += '<tr>' + cols.map(function(_, i){ return '<td>' + hl(r[i] === undefined ? '' : r[i], ql) + '</td>'; }).join('') + '</tr>';
      } else if(r && typeof r === 'object'){
        h += '<tr>' + cols.map(function(k){ return '<td>' + hl(r[k] === undefined ? '' : r[k], ql) + '</td>'; }).join('') + '</tr>';
      } else {
        h += '<tr><td colspan="' + Math.max(1, cols.length) + '">' + hl(r, ql) + '</td></tr>';
      }
    });
    h += '</tbody></table></div>';
  } else if(content){
    h += '<pre class="tbltext">' + hl(content, ql) + '</pre>';
  } else {
    h += '<div class="dimnote">（该表既无结构化数据也无原始文本，点「编辑表格」补录）</div>';
  }
  if(t.note) h += '<div class="tblnote">注：' + ed(t.note, base + '.note', '表注', cno) + '</div>';
  else if(S.edit) h += '<div class="tblnote">注：' + ed('', base + '.note', '表注', cno) + '（点此补表注）</div>';
  h += '</span></div>';
  return h;
}

/* ---- 表格编辑模态（TSV） ---- */
function rowsToTSV(heads, rows){
  let cols = heads.slice();
  if(!cols.length && rows[0] && !Array.isArray(rows[0]) && typeof rows[0] === 'object') cols = Object.keys(rows[0]);
  const lines = [cols.join('\t')];
  rows.forEach(function(r){
    if(Array.isArray(r)) lines.push(cols.map(function(_, i){ return String(r[i] === undefined ? '' : r[i]); }).join('\t'));
    else if(r && typeof r === 'object') lines.push(cols.map(function(k){ return String(r[k] === undefined ? '' : r[k]); }).join('\t'));
    else lines.push(String(r === null || r === undefined ? '' : r));
  });
  return lines.join('\n');
}
function editTable(base, cno){
  const f = S.files[S.cur];
  const t = getByPath(f.data, base);
  if(!t || typeof t !== 'object'){ toast('找不到该表格'); return; }
  const heads = arr(t.headers), rows = arr(t.rows);
  const hasRows = rows.length > 0;
  const dictMode = hasRows && !Array.isArray(rows[0]) && typeof rows[0] === 'object';
  let body = '';
  if(hasRows){
    body = '<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem">' +
      '以 <b>制表符（Tab）</b> 分列。第一行是表头，可增删列；其余每行一条数据。' +
      (dictMode ? '本表为「键:值」形态，保存时按表头回填键名。' : '') + '</div>' +
      '<textarea id="taTbl" rows="16" spellcheck="false">' + esc(rowsToTSV(heads, rows)) + '</textarea>';
  } else {
    body = '<div style="font-size:.8rem;color:var(--muted);margin-bottom:.4rem">' +
      '该表尚未结构化，只有抽取到的原始文本。可直接修订文本；<br>' +
      '若已看清表结构，勾选下方「转为结构化表格」并填写 TSV（首行为表头），保存后即可变成真正的表格。</div>' +
      '<textarea id="taRaw" rows="9" spellcheck="false">' + esc(asText(t.content || '')) + '</textarea>' +
      '<label style="display:block;margin:.6rem 0 .3rem;font-size:.82rem;cursor:pointer">' +
      '<input type="checkbox" id="cbStruct"> 转为结构化表格（下方填 TSV，Tab 分列）</label>' +
      '<textarea id="taTbl" rows="8" spellcheck="false" placeholder="列1\t列2\t列3"></textarea>';
  }
  body += '<div style="margin-top:.5rem;display:flex;gap:.5rem;align-items:center">' +
    '<span style="font-size:.8rem;color:var(--muted);white-space:nowrap">表注</span>' +
    '<input type="text" id="taNote" value="' + esc(t.note || '') + '" style="flex:1"></div>';

  openModal('编辑表格 · ' + (cno || '') + ' · ' + (t.table_id || t.id || ''), body,
    '<button class="btn" id="mkCancel">取消</button><button class="btn on" id="mkSave">保存修订</button>');

  const ta = $('taTbl');
  if(ta) ta.addEventListener('keydown', function(e){
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = this.selectionStart, en = this.selectionEnd;
      this.value = this.value.slice(0, s) + '\t' + this.value.slice(en);
      this.selectionStart = this.selectionEnd = s + 1;
    }
  });
  $('mkCancel').onclick = closeModal;
  $('mkSave').onclick = function(){
    const noteRaw = ($('taNote') || {}).value;
    const noteVal = String(noteRaw === undefined ? '' : noteRaw).trim();
    if(String(t.note || '') !== noteVal)
      applyEdit(base + '.note', noteVal, '表注', cno);

    if(hasRows){
      const txt = ($('taTbl') || {}).value || '';
      const lines = txt.replace(/\r/g, '').split('\n').filter(function(l){ return l.trim() !== ''; });
      if(!lines.length){ toast('表格不能为空'); return; }
      const cols = lines[0].split('\t').map(function(x){ return x; });
      const newRows = lines.slice(1).map(function(l){
        const cells = l.split('\t');
        if(dictMode){
          const o = {};
          cols.forEach(function(k, i){ o[k] = cells[i] === undefined ? '' : cells[i]; });
          return o;
        }
        return cols.map(function(_, i){ return cells[i] === undefined ? '' : cells[i]; });
      });
      applyStructEdit(base + '.headers', cols, '表头', cno);
      applyStructEdit(base + '.rows', newRows, '表格数据', cno);
    } else {
      const rawVal = String(($('taRaw') || {}).value || '');
      applyEdit(base + '.content', rawVal, '表格原始文本', cno);
      const doStruct = $('cbStruct') && $('cbStruct').checked;
      if(doStruct){
        const txt = ($('taTbl') || {}).value || '';
        const lines = txt.replace(/\r/g, '').split('\n').filter(function(l){ return l.trim() !== ''; });
        if(lines.length >= 2){
          const cols = lines[0].split('\t');
          const newRows = lines.slice(1).map(function(l){
            const cells = l.split('\t');
            return cols.map(function(_, i){ return cells[i] === undefined ? '' : cells[i]; });
          });
          applyStructEdit(base + '.headers', cols, '表头', cno);
          applyStructEdit(base + '.rows', newRows, '表格数据', cno);
          applyEdit(base + '.content', '', '表格原始文本（转为结构化后清空）', cno);
        } else {
          toast('结构化需要至少 2 行（表头 + 数据）');
        }
      }
    }
    closeModal();
    render();
    toast('表格修订已记录');
  };
}
/* 结构化字段（数组 / 对象）整体替换 + 留痕 */
function summarize(v){
  if(v === null || v === undefined) return '';
  if(Array.isArray(v)){
    if(!v.length) return '（空）';
    return v.length + ' 项：' + v.slice(0, 3).map(function(x){
      return typeof x === 'object' ? JSON.stringify(x) : String(x);
    }).join(' | ') + (v.length > 3 ? ' …' : '');
  }
  if(typeof v === 'object') return JSON.stringify(v);
  return String(v);
}
function applyStructEdit(path, newVal, field, cno){
  const f = S.files[S.cur];
  if(!f || !f.data) return false;
  const oldVal = getByPath(f.data, path);
  if(JSON.stringify(oldVal) === JSON.stringify(newVal)) return false;
  if(!setByPath(f.data, path, newVal)){ toast('该字段不可写：' + path); return false; }
  S.changes.push({
    id: 'C' + String(++S.seq).padStart(4, '0'),
    ts: nowStr(), author: S.author || '（未署名）', file: f.name,
    clause_no: cno || '', path: path, field: field || path.split('.').pop(),
    before: summarize(oldVal), after: summarize(newVal), status: 'applied'
  });
  refreshRevUI();
  return true;
}

/* =========================================================================
   6. 渲染入口 / 事件
   ========================================================================= */
function render(){
  const f = S.files[S.cur];
  if(!f){ return; }
  document.body.classList.toggle('editing', !!S.edit);
  if(S.mode === 'book' && isStandardDoc(f.data)){
    side.classList.remove('narrow');
    renderBook(f.data);
  } else {
    side.classList.add('narrow');
    side.innerHTML = '';
    let html;
    try { html = renderTree(f.data, ''); }
    catch(e){ html = '<div class="err">渲染失败：' + esc(e && e.message) + '</div>'; }
    content.innerHTML = editBar() + dirtyBar() +
      '<div style="font-size:.85rem;color:var(--muted);margin-bottom:.8rem">' +
      '<b>' + esc(f.name) + '</b> · 通用树模式（' + (isStandardDoc(f.data) ? '标准文档，可切回书模式' : '非标准结构，仅树模式') + '）</div>' + html;
    markDirty();
  }
  document.querySelectorAll('#modeSeg button').forEach(function(b){
    b.classList.toggle('on', b.dataset.mode === S.mode);
  });
}
function redraw(){ render(); }

function addFiles(list){
  const files = Array.prototype.slice.call(list).filter(function(f){ return f.size < 24 * 1024 * 1024; });
  if(!files.length) return;
  let pending = files.length;
  files.forEach(function(file){
    const fr = new FileReader();
    fr.onload = function(){
      const text = String(fr.result || '');
      let data = null, err = null;
      try { data = YAMLParse(text); } catch(e){ err = e; }
      S.files.push({name: file.name, data: data, text: text, err: err ? String(err.message || err) : null});
      if(--pending === 0) finishLoad();
    };
    fr.readAsText(file, 'utf-8');
  });
}
function finishLoad(){
  const sel = $('fileSel');
  sel.innerHTML = S.files.map(function(f, i){
    return '<option value="' + i + '">' + esc(f.name) + (f.err ? '（解析失败）' : '') + '</option>';
  }).join('');
  S.cur = S.files.length - 1;
  sel.value = String(S.cur);
  $('welcome').style.display = 'none';
  const f = S.files[S.cur];
  if(f.err){
    content.innerHTML = '<div class="err"><b>' + esc(f.name) + '</b> 解析失败：\n' + esc(f.err) + '\n\n原始文本预览（前 2000 字）：\n' + esc(f.text.slice(0, 2000)) + '</div>';
    side.innerHTML = '';
    return;
  }
  S.mode = isStandardDoc(f.data) ? 'book' : 'tree';
  S.filter = 'all'; S.q = ''; $('search').value = '';
  render();
}
function loadText(name, text){
  let data = null, err = null;
  try { data = YAMLParse(text); } catch(e){ err = e; }
  S.files.push({name: name, data: data, text: text, err: err ? String(err.message || err) : null});
  finishLoad();
}

  const f = S.files[S.cur];
  S.mode = isStandardDoc(f.data) ? 'book' : 'tree';
  S.filter = 'all'; S.q = ''; $('search').value = '';
  render();
});
let searchTimer = null;
$('search').addEventListener('input', function(e){
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(function(){ S.q = v; render(); }, 180);
});
$('modeSeg').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;
  S.mode = b.dataset.mode; render();
});
$('btnTheme').addEventListener('click', function(){
  S.theme = S.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
});
$('btnFontS').addEventListener('click', function(){
  S.fontSize = Math.max(12, S.fontSize - 1); document.body.style.fontSize = S.fontSize + 'px';
});
$('btnFontL').addEventListener('click', function(){
  S.fontSize = Math.min(26, S.fontSize + 1); document.body.style.fontSize = S.fontSize + 'px';
});
$('btnExpand').addEventListener('click', function(){ S.treeDepth = Math.min(12, S.treeDepth + 1); render(); });
$('btnCollapse').addEventListener('click', function(){ S.treeDepth = 0; render(); });
$('btnSide').addEventListener('click', function(){ side.classList.toggle('narrow'); });
$('btnPaste').addEventListener('click', togglePaste);
$('btnPaste2').addEventListener('click', togglePaste);
function togglePaste(){
  const b = $('pasteBox');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
  if(b.style.display === 'block') $('pasteTa').focus();
}
$('pasteCancel').addEventListener('click', function(){ $('pasteBox').style.display = 'none'; });
$('pasteOk').addEventListener('click', function(){
  const t = $('pasteTa').value;
  if(!t.trim()) return;
  $('pasteBox').style.display = 'none';
  loadText('粘贴内容 ' + new Date().toLocaleTimeString(), t);
});

/* 内容区委托事件 */
content.addEventListener('click', function(e){
  const fb = e.target.closest('[data-filter]');
  if(fb){ S.filter = fb.dataset.filter; render(); return; }
  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a === 'togglestruct'){ S.showStruct = !S.showStruct; render(); return; }
    if(a === 'openrev'){ $('revPanel').classList.add('open'); renderRevList(); return; }
    if(a === 'expyaml'){ exportYAML(); return; }
    if(a === 'saveback'){ saveBack(); return; }
  }
  const et = e.target.closest('[data-edittbl]');
  if(et){ editTable(et.dataset.edittbl, et.dataset.tblcno || ''); return; }
  const raw = e.target.closest('[data-raw]');
  if(raw){
    const no = raw.dataset.raw;
    if(S.rawClause.has(no)) S.rawClause.delete(no); else S.rawClause.add(no);
    render();
    const el = document.getElementById('c-' + no);
    if(el) el.scrollIntoView({block:'start'});
    return;
  }
  const caret = e.target.closest('.tcaret[data-tpath]');
  if(caret){
    const p = caret.dataset.tpath;
    if(S.expanded.has(p)) S.expanded.delete(p); else S.expanded.add(p);
    render(); return;
  }
  const key = e.target.closest('.tkey[data-tpath]');
  if(key){
    const p = key.dataset.tpath;
    if(S.expanded.has(p)) S.expanded.delete(p); else S.expanded.add(p);
    render();
    const cr = $('crumb');
    if(cr){
      const f = S.files[S.cur];
      const v = getByPath(f.data, p);
      cr.innerHTML = '<b>' + esc(p) + '</b>　' + esc(preview(v)) +
        '　<button class="linkbtn" id="crumbCopy">复制值</button>';
      const cb = $('crumbCopy');
      if(cb) cb.addEventListener('click', function(){
        const txt = (typeof v === 'object') ? JSON.stringify(v, null, 2) : String(v);
        navigator.clipboard && navigator.clipboard.writeText(txt);
        cb.textContent = '已复制';
      });
    }
    return;
  }
  const row = e.target.closest('.trow[data-tpath]');
  if(row){
    document.querySelectorAll('.trow.sel').forEach(function(x){ x.classList.remove('sel'); });
    row.classList.add('sel');
    return;
  }
});

/* 侧栏目录 */
side.addEventListener('click', function(e){
  const ch = e.target.closest('[data-ch]');
  if(ch){
    const k = 'ch' + ch.dataset.ch;
    if(S.openCh.has(k)) S.openCh.delete(k); else S.openCh.add(k);
    render();
    const el = document.getElementById('ch-' + ch.dataset.ch);
    if(el && S.openCh.has(k)) el.scrollIntoView({block:'start'});
    return;
  }
  const relate = e.target.closest('a[href^="#c-"]');
  if(relate){ /* 默认锚点跳转即可 */ }
});

/* 拖放 */
['dragenter','dragover'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); document.body.classList.add('dragging'); $('drop') && $('drop').classList.add('hot'); });
});
['dragleave','drop'].forEach(function(ev){
  document.addEventListener(ev, function(e){
    e.preventDefault();
    if(ev === 'drop' || e.target === document.documentElement){
      document.body.classList.remove('dragging');
      if($('drop')) $('drop').classList.remove('hot');
    }
  });
});
document.addEventListener('drop', function(e){
  e.preventDefault();
  document.body.classList.remove('dragging');
  if($('drop')) $('drop').classList.remove('hot');
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* =========================================================================
   7. 编辑模式 / 留痕 事件
   ========================================================================= */
$('btnEdit').addEventListener('click', function(){
  S.edit = !S.edit;
  this.classList.toggle('on', S.edit);
  document.body.classList.toggle('editing', S.edit);
  render();
  toast(S.edit ? '编辑模式已开启：点字段即可修改' : '编辑模式已关闭（已记录的留痕保留）');
});
$('btnRev').addEventListener('click', function(){ $('revPanel').classList.toggle('open'); renderRevList(); });
$('rpClose').addEventListener('click', function(){ $('revPanel').classList.remove('open'); });
$('author').addEventListener('input', function(e){
  S.author = e.target.value;
  try { localStorage.setItem('yaml_reader_author', S.author); } catch(err){}
  S.changes.forEach(function(c){ if(c.status === 'applied' && c.author === '（未署名）') c.author = S.author || '（未署名）'; });
  renderRevList();
});
$('rpRevertAll').addEventListener('click', function(){
  if(!pendingChanges().length){ toast('没有生效中的修订'); return; }
  if(!confirm('确定要还原全部 ' + pendingChanges().length + ' 处修订吗？（留痕记录会保留，标记为已还原）')) return;
  revertAll();
});
$('rpClear').addEventListener('click', function(){
  if(!S.changes.length) return;
  if(!confirm('清空全部留痕记录？（已经生效的修改不会撤销）')) return;
  S.changes = []; refreshRevUI();
});
$('rpExportMd').addEventListener('click', exportMD);
$('rpExportJson').addEventListener('click', exportJSON);
$('revList').addEventListener('click', function(e){
  const r = e.target.closest('[data-rev]');
  if(r){ revertChange(r.dataset.rev); toast('已还原 ' + r.dataset.rev); return; }
  const d = e.target.closest('[data-del]');
  if(d){
    S.changes = S.changes.filter(function(x){ return x.id !== d.dataset.del; });
    refreshRevUI();
  }
});
$('expSeg').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.exp;
  if(!S.files[S.cur]){ toast('请先加载文件'); return; }
  if(k === 'yaml') exportYAML();
  else if(k === 'md') exportMD();
  else if(k === 'py') exportPy();
  else if(k === 'save') saveBack();
});
$('mkClose').addEventListener('click', closeModal);
$('mask').addEventListener('click', function(e){ if(e.target === $('mask')) closeModal(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});

/* 内容区：编辑提交（失焦即记录） */
content.addEventListener('focusout', function(e){
  const el = e.target.closest ? e.target.closest('[data-ep]') : null;
  if(!el || !S.edit) return;
  const path = el.getAttribute('data-ep');
  const field = el.getAttribute('data-ep-field') || '';
  const cno = el.getAttribute('data-ep-clause') || '';
  const kind = el.getAttribute('data-ep-kind');
  const raw = (el.innerText || '').replace(/\u00a0/g, ' ').replace(/\s+$/, '');
  const ok = (kind === 'list') ? applyListEdit(path, raw, field, cno) : applyEdit(path, raw, field, cno);
  if(ok){
    const st = content.scrollTop;
    render();
    content.scrollTop = st;
    toast('已记录留痕 · ' + (cno ? cno + ' ' : '') + field);
  } else {
    const cur = getByPath(S.files[S.cur].data, path);
    el.innerText = (cur === null || cur === undefined) ? '' : String(cur);
  }
});
/* 编辑态下回车不要插入 <div>，直接提交 */
content.addEventListener('keydown', function(e){
  if(!S.edit) return;
  const el = e.target.closest ? e.target.closest('[data-ep]') : null;
  if(!el) return;
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); el.blur(); }
  if(e.key === 'Escape'){ e.preventDefault(); el.blur(); }
});

/* 连接文件夹（可回写） */
$('btnConnect').addEventListener('click', connectDir);
async function connectDir(){
  if(!window.showDirectoryPicker){
    toast('当前浏览器不支持 File System Access API。请用 Chrome / Edge，或使用「导出 YAML」下载后手动覆盖。');
    return;
  }
  try{
    const dh = await window.showDirectoryPicker();
    S.dirHandle = dh;
    let n = 0;
    for await (const entry of dh.entries()){
      const h = entry[1];
      if(!h || h.kind !== 'file') continue;
      if(!/\.(ya?ml|json|txt)$/i.test(h.name)) continue;
      const file = await h.getFile();
      if(file.size > 24 * 1024 * 1024) continue;
      const text = await file.text();
      let data = null, err = null;
      try { data = YAMLParse(text); } catch(e){ err = e; }
      S.files.push({name: h.name, data: data, text: text, err: err ? String(err.message || err) : null});
      S.handles[h.name] = h;
      n++;
    }
    if(!n){ toast('该目录下没有 yaml / json 文件'); return; }
    finishLoad();
    toast('已连接 ' + n + ' 个文件，可直接「写回原文件」');
  }catch(e){
    if(e && e.name !== 'AbortError') toast('连接失败：' + (e.message || e));
  }
}

document.documentElement.setAttribute('data-theme', S.theme);
try {
  const a = localStorage.getItem('yaml_reader_author');
  if(a){ S.author = a; $('author').value = a; }
} catch(e){}
refreshRevUI();
