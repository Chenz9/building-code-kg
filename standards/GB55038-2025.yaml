    full_text: ，1，2条，七。住宅室内装饰装修设计规范，JGJ,367 2015第3，0,4 3，0 7条 八 城市居住区热环境设计标准、JGJ，286.2013第4，1 1。4。2、1条,本规范在住房城乡建设部门户网站公开。并由住房城乡建设部标准定额研究所组织中国建筑出版传媒有限公司出版发行.中华人民共和国住房和城乡建设部2025年3月13日前言，为适应国际技术法规与技术标准通行规则.2016年以来。住房城乡建设部陆续印发。关于深化工程建设标准化工作改革的意见。等文件，提出政府制定强制性标准.社会团体制定自愿采用性标准的长远目标,明确了逐步用全文强制性工程建设规范取代现行标准中分散的强制性条文的改革任务.逐步形成由法律 行政法规 部门规章中的技术性规定与全文强制性工程建设规范构成的、技术法规、体系。关于规范种类、强制性工程建设规范体系覆盖工程建设领域各类建设工程项目.分为工程项目类规范 简称项目规范，和通用技术类规范 简称通用规范、两种类型。项目规范以工程建设项目整体为对象,以项目的规模,布局，功能、性能和关键技术措施等五大要素为主要内容.通用规范以实现工程建设项目功能性能要求的各专业通用技术为对象、以勘察、设计，施工。维修.养护等通用技术要求为主要内容，在全文强制性工程建设规范体系中,项目规范为主干、通用规范是对各类项目共性的,通用的专业性关键技术措施的规定.关于五大要素指标、强制性工程建设规范中各项要素是保障城乡基础设施建设体系化和效率提升的基本规定,是支撑城乡建设高质量发展的基本要求 项目的规模要求主要规定建设工程项目应具备完整的生产或服务能力.应与经济社会发展水平相适应、项目的布局要求主要规定产业布局 建设工程项目选址，总体设计,总平面布置以及与规模相协调的统筹性技术要求 应考虑供给能力合理分布、提高相关设施建设的整体水平、项目的功能要求主要规定项目构成和用途。明确项目的基本组
