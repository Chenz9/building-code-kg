    full_text: '的规定.当住宅建筑采用低层或多层高密度布局方式时，其居住街坊的空间环境控制指标应符合表3 1、1、2的规定 3,1 2、住宅建筑间距应按表3,1、2规定的日照标准进行控制 旧区改建项目内新建住宅建筑日照标准不应低于大寒日日照时数1h. ## page=4891635 3.2 场地3、2、1、住宅项目的场地应保障安全.并应符合下列规定。1。存在噪声污染，光污染的地段。应采取相应防护措施、并应达到居住用地声环境和光环境质量要求。2、存在土壤污染的地段 应采取有效措施进行无害化处理,并应达到居住用地土壤环境质量要求，3.场地设计应满足应急疏散要求、3.2 2 居住街坊内应设集中绿地，并应符合下列规定 1，新区建设项目人均集中绿地面积不应小于0.50m2,旧区改建项目人均集中绿地面积不应小于0、35m2,2。集中绿地宽度不应小于8m,3。集中绿地中。在标准的建筑日照阴影线范围之外的绿地面积占比不应小于1，3、并应设老年人和儿童活动场地 3、2.3，住宅项目应配建附属道路。并应符合下列规定，1。应与城镇道路系统联通，并应满足急救,消防及运输车辆的通行要求、2,应与住宅项目场地步行出入口.住宅单元出入口。老年人和儿童活动场地无障碍联通,并应与城镇道路的人行道联通形成无障碍步行系统、3.步行路面应符合防滑要求 3 2、4。住宅项目场地的自然坡度大于8,0。时,应采用台地式布局方式，并应符合下列规定,1.台地之间应设护坡或挡土墙等支挡结构 2,高度大于2,0m的护坡或挡土墙的上缘与高台地上建筑物的水平净距不应小于3。0m,其下缘与低台地上建筑物的水平净距不应小于2.0m、3,2,5。住宅项目场地竖向设计应有利于雨水径流的控制和雨水的资源化利用、并应满足防洪排涝的要求,场地地面排水设计坡度不应小于0.2,3.2，6，住宅建筑高度大于10m时,外墙面至道路边缘的最小距离。应符合表3,2、6'
