- id: GB 55024-2022#2.0.3
  standard_code: GB 55024-2022
  chapter: 2 基本规定
  section: ''
  clause_no: 2.0.3
  text: 建筑物电气设备用房和智能化设备用房应符合下列规定：1 不应设在卫生间、浴室等经常积水场所的直接下一层，当与其贴邻时，应采取防水措施；2 地面或门槛应高出本层楼地面，其标高差值不应小于0.10m，设在地下层时不应小于0.15m；3 无关的管道和线路不得穿越；4 电气设备的正上方不应设置水管道；5 变电所、柴油发电机房、智能化系统机房不应有变形缝穿越；6 楼地面应满足电气设备和智能化设备荷载的要求。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 建筑物电气设备用房和智能化设备用房
    conditions:
    - 当与其贴邻时
    - 设在地下层时
    exceptions: []
  constraint:
    modal_level: null
    modal_words:
    - 不应
    - 应
    is_mandatory_clause: true
    mandatory_basis: 全文强制
  parameters:
  - name: 防水台阶高度
    unit: m
    condition: null
    min_value: 0.1
