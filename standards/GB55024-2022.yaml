  clause_no: 7.1.7
  text: 防雷建筑物设置的接闪器应符合以下规定：1 当建筑物采用接闪带保护时，接闪带应装设在建筑物易受雷击的屋角、屋脊、女儿墙及屋檐等部位；2 当接闪带采用热镀锌圆钢或扁钢制成时，其截面面积不应小于50mm²；3 当接闪杆采用热镀锌圆钢或钢管制成时，热镀锌圆钢的直径不应小于20mm，热镀锌钢管的直径不应小于40mm；4 当采用金属屋面作为接闪器时，金属板应无绝缘层覆盖；5 当双层彩钢板屋面作为接闪器时，其夹层中的保温材料必须为不燃或难燃材料。
