- id: JGJ 218-2010#1.0.5
  standard_code: JGJ 218-2010
  chapter: 1 总则
  section: ''
  clause_no: 1.0.5
  text: 展览建筑应结合我国国情，根据当地的气候条件和地理位置、经济和技术发展水平等因素，因地制宜地进行设计，并应反映当地建筑艺术、科学技术和文化发展等的先进水平。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 本条对展览建筑设计的指导思想作原则性规定，即强调展览建筑设计应结合展览建筑的性质、特点及发展趋势，为运用先进的管理方式提供灵活性强、适应性高的空间，并力求造型美观，环境协调。由于我国地域辽阔，民族众多，自然气候、地理条件有很大差异，如气温和温差、地质条件和抗震、雨雪、施工技术和管理水平等，在设计中需因地制宜，不能-一概而论。
    note: 合并重复提取片段
  references: []
  related_objects:
    component_types:
    - IfcBuilding
    activity_types:
    - 展览建筑设计
  conflicts: []
- id: JGJ 218-2010#1.0.6
  standard_code: JGJ 218-2010
  chapter: 1 总则
  section: ''
  clause_no: 1.0.6
  text: 展览建筑设计应根据展览建筑的性质、特点和发展趋势，与展览工艺设计相结合，并应遵循可持续发展的原则。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 展览建筑设计需满足展览工艺的要求，为了使展览建筑设计更合理、更经济，需要根据展览工艺所提出的各种条件和要求进行设计。同时要给水、电气、智能化等技术支持需求的不断发展预留设施和空问。
    note: 合并重复提取片段
