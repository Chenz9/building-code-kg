  converted_tables:
  - raw: 参照《采暖通风与空气调节设计规范》GB50019、《全用供热空调设计手册》均推荐对建筑空间高度大于或等于10m、国民用建筑工程设计技术措施·暖通空调·动力》、《剧场建筑设且体积大于10000m的大空间建筑物采用分层空调。展览建筑中计规范》JGJ57、《体育建筑设计规范》JGJ31以及《公共建筑的展厅通常为大空间的建筑形式，理应按分层空调的概念来设计其空调系统。大空间展厅内的人员密度较大，而且变化比较频繁，如果一直按照设计工况的较大的人员密度供应新风，将浪费较多的新风分层空调气流将整个建筑空间分隔成下部空调区和上部非空调区，热空气聚集在上部非空调区内，若不及时排出，将导致非处理能耗。因此，对这类人员活动区域宜采用新风需求控制，即空调区向空调区过量的热转移，影响空调区的空调效果。因此，根据室内O浓度检测值来调节新风量，节约新风处理用能，并在非空调区域应采取自然和机械通风措施，消除非空调区的散热使C）浓度始终能满足人体卫生要求。上海浦东国际机场候机大量，减少非空调区向空调区的热转移。厅的空调系统已采用了这项技术。空调区域排风中所含的能量十分可观，加以回收利用可以取喷口的射程是影响室内空调效果的重要因素之一，确定喷口得很好的节能效益和环境效益，设计时应充分考虑。空调季的时的射程一方面要使其满足空调区域气流组织的需要，另外一一方面间长短是影响排风热回收量的重要因素，空调季时间越长，相对还需要将送风的噪声水平控制在要求的范围内。所以，应该依据气流组织计算的结果并综合考虑噪声的要求来确定喷口射程。采来说全年回收的冷、热量越多，故本条推荐在空调季时间较长的用可调节角度的喷口是为了满足冬季送热风、夏季送冷风时的不地区，当经济技术分析合理时，设置排风热回收装置。
