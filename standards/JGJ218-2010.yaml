    modal_level: null
    modal_words: []
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 本条规定了本规范的适用范围。博物馆、美术馆、科技馆等不属于展览建筑的范畴。对于临时性展览建筑，也可以按照永久性展览建筑标准进行设计。
    note: 合并重复提取片段
  references: []
