  text: 展览建筑通常观众较多，为保证室内的空气质量应有良也有一定噪声，参照现行国家标准《民用建筑隔声设计规范》好的通风。从节约能源考虑，在设计上应优先采用自然通风的方GB50118中规定旅馆建筑中餐厅、宴会厅室内允许噪声级的二式，自然通风有困难或仅靠自然通风达不到换气要求时，应采用级标准应小于或等于55dB（A声级），因此本规范亦规定展厅允机械通风或辅以机械通风的方式。采用人工空气调节的展览建筑许噪声级的标准不宜大于55dB。应有足够的新风量。
