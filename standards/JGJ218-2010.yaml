clauses:
- id: JGJ 218-2010#1.0.1
  standard_code: JGJ 218-2010
  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: 为使展览建筑设计符合安全、适用、卫生、经济及展览工艺等方面的基本要求，制定本规范。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: null
    modal_words: []
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 随着我国经济持续发展，展览业在我国发展迅速，已逐步形成一个新兴产业。近年来，全国各省市不断兴建、筹建或扩建展览场地，先后建造了一批现代化的展览建筑。由于展览建筑的投资大，影响面广且技术难度高，针对功能、安全、卫生、经济及展览设施等方面标准的确定与执行，将直接关系展览建筑的质量和社会效益。本规范的各章内容，满足了展览工艺要求，并在适用、安全、卫生及技术合理方面提出最低限度的要求。
    note: 合并重复提取片段
  references: []
  related_objects:
    component_types:
    - IfcBuilding
    activity_types:
    - 展览建筑设计
  conflicts: []
- id: JGJ 218-2010#1.0.2
  standard_code: JGJ 218-2010
  chapter: 1 总则
  section: ''
  clause_no: 1.0.2
  text: 本规范适用于新建、改建和扩建的展览建筑的设计。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 本规范适用于新建、改建和扩建的展览建筑的设计。
