  parameters: []
  tables: []
  converted_tables:
  - raw: 现在一些展览建筑采用大面积玻璃幕墙或玻璃顶椰作为建筑的表现形式，而实际上展厅并不需要过多的自然光线，室内自然光过于明亮给展览带来一定的困难。经调查采用大面积透明幕墙的展厅在室内装修时，不是用非透明材料将幕墙遮挡起来，就是挂起厚厚的窗帘。展厅一般为大跨建筑：屋顶设置一些天窗可改善室内的光环境、空气质量，且节约能源。但若采用大面积玻璃顶棚则会适得其反，过度的光照会影响展厅的正常使用。因此本规范从使用功能方面考虑设立此条。
