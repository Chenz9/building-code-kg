  - raw: 展览建筑是以展厅为主的多功能综合建筑，各功能部分有质量下降且不利节能，内置窗帘对减少由阳光直射室内而产生的各自的照明要求。现行国家标准《建筑照明设计标准》GB50034~空调负荷作用不大，而外部遮阳设施，特别是可调节角度的外部2004中相关条文基本涵盖了展览建筑各功能部分，其中第5.2.9条遮阳设施有明显的节能作用，因此设置外部遮阳设施，防止夏季专为展览馆展厅设置，规定了展厅地面的照度标准值为2001x～强烈阳光直射室内，是提高此类展厅室内热环境质量、节约能源300lx，统一眩光值（UGR）为22，一般显色指数（Ra）为80，高的有效措施。于6m的展厅可降低到60。故本规范规定展览建筑的照明设计应按6.5声学环境《建筑采光设计标准》GB/T50033中相关条文执行。
