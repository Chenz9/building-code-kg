  text: 条的规定；设置回廊或挑檐时，其出挑宽度不应小于1.2m；步行街两侧的商铺在上部各层需设置回廊和连接天桥时，应保证步行街上部各层楼板的开口面积不应小于步行街地面面积的37%，且开口宜均匀布置。5步行街两侧建筑内的疏散楼梯应靠外墙设置并宜直通室外，确有困难时，可在首层直接通至步行街；首层商铺的疏散门可直接通至步行街，步行街内任一点到达最近室外安全地点的步行距离不应大于60m。步行街两侧建筑二层及以上各层商铺的疏散门至该层最近疏散楼梯口或其他安全出口的直线距离不应大于37.5m。6步行街的顶棚材料应采用不燃或难燃材料，其承重结构的耐火极限不应低于1.00h。步行街内不应布置可燃物。7步行街的顶棚下檐距地面的高度不应小于6.0m，顶棚应设置自然排烟设施并宜采用常开式的排烟口，且自然排烟口的有效面积不应小于步行街地面面积的25%。常闭式自然排烟设施应能在火灾时手动和自动开启。8步行街两侧建筑的商铺外应每隔30m设置DN65的消火栓，并应配备消防软管卷盘或消防水龙，商铺内应设置自动喷水灭火系统和火灾自动报警系统；每层回廊均应设置自动喷水灭火系统。步行街内宜设置自动跟踪定位射流灭火系统。9步行街两侧建筑的商铺内外均应设置蔬散照明、灯光疏散指示标志和消防应急广播系统。
