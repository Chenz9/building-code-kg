  standard_code: GB 50016-2014
  chapter: 5 民用建筑
  section: 5.5安全疏散和避难
  clause_no: 5.5.16
  text: 剧场、电影院、礼堂和体育馆的观众厅或多功能厅，其疏散门的数量应经计算确定且不应少于2个，并应符合下列规定：1对于剧场、电影院、礼堂的观众厅或多功能厅，每个疏散门的平均疏散人数不应超过250人；当容纳人数超过2000人时，其超过2000人的部分，每个疏散门的平均疏散人数不应超过400 人。:78:2对于体育馆的观众厅，每个疏散门的平均疏散人数不宜超过400人～700人。
