- id: GB 50016-2014#6.4.3
  standard_code: GB 50016-2014
  chapter: 6 建筑构造
  section: 6.4疏散楼梯间和疏散楼梯等
  clause_no: 6.4.3
  text: 防烟楼梯间除应符合本规范第6.4.1条的规定外，尚应符合下列规定：应设置防烟设施。前室可与消防电梯间前室合用。3前室的使用面积：公共建筑、高层厂房（仓库），不应小于6.0m²；住宅建筑，不应小于4.5m²。与消防电梯间前室合用时，合用前室的使用面积：公共建筑、高层厂房（仓库），不应小于10.0m²；住宅建筑，不应小于6.0m²。4疏散走道通向前室以及前室通向楼梯间的门应采用乙:95:级防火门。5除住宅建筑的楼梯间前室外，防烟楼梯间和前室内的墙上不应开设除疏散门和送风口外的其他门、窗、洞口。6楼梯间的首层可将走道和门厅等包括在楼梯间前室内形成扩大的前室，但应采用乙级防火门等与其他走道和房间分隔。间在各层的平面位置不应改变。除住宅建筑套内的自用楼梯外，地下或半地下建筑（室）的疏散楼梯间，应符合下列规定：人1室内地面与室外出入口地坪高差大于10m或3层及以上的地下、半地下建筑（室），其疏散楼梯应采用防烟楼梯间；其他地下或半地下建筑（室），其疏散楼梯应采用封闭楼梯间。2应在首层采用耐火极限不低于2.00h的防火隔墙与其他部位分隔并应直通室外，确需在隔墙上开门时，应采用乙级防火门。3，建筑的地下或半地下部分与地上部分不应共用楼梯间，确需共用楼梯间时，应在首层采用耐火极限不低于2.00h的防火隔墙和乙级防火门将地下或半地下部分与地上部分的连通部位完全分隔，并应设置明显的标志。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
    scope: 防烟楼梯间及地下、半地下建筑（室）的疏散楼梯间
    conditions:
    - 室内地面与室外出入口地坪高差大于10m或3层及以上的地下、半地下建筑（室），其疏散楼梯应采用防烟楼梯间；其他地下或半地下建筑（室）应采用封闭楼梯间
    - 建筑的地下或半地下部分与地上部分确需共用楼梯间时，应在首层采用耐火极限不低于2.00h防火隔墙和乙级防火门将连通部位完全分隔
    exceptions:
    - 住宅建筑套内的自用楼梯（地下、半地下部分与地上部分不应共用楼梯间的规定不适用）
