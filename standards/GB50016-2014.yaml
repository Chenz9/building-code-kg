  clause_no: 8.2.2
  text: 本规范第8.2.1条未规定的建筑或场所和符合本规范第8.2.1条规定的下列建筑或场所，可不设置室内消火栓系.113:统，但宜设置消防软管卷盘或轻便消防水龙：1耐火等级为一、二级且可燃物较少的单、多层丁、戊类厂房（仓库）。2耐火等级为三、四级且建筑体积不大于3000m²的丁类厂房；耐火等级为三、四级且建筑体积不大于5000m²的戊类厂房（仓库）。3粮食仓库、金库、远离城镇且无人值班的独立建筑。4存有与水接触能引起燃烧爆炸的物品的建筑。5室内无生产、生活给水管道室外消防用水取自储水池且建筑体积不大于5000m3的其他建筑。
