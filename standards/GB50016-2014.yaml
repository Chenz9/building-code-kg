- id: GB 50016-2014#6.4.11
  standard_code: GB 50016-2014
  chapter: 6 建筑构造
  section: 6.4疏散楼梯间和疏散楼梯等
  clause_no: 6.4.11
  text: 建筑内的疏散门应符合下列规定：民用建筑和厂房的疏散门，应采用向疏散方向开启的平开门，不应采用推拉门、卷帘门、吊门、转门和折叠门。除甲、乙类生产车间外，人数不超过60人且每门的平均疏散人数不超过30人的房间，其疏散门的开启方向不限。2仓库的疏散门应采用向疏散方向开启的平开门，但丙、丁、戊类仓库首层靠墙的外侧可采用推拉门或卷帘门。3开向疏散楼梯或疏散楼梯间的门，当其完全开启时，不应减少楼梯平台的有效宽度。4人员密集场所内平时需要控制人员随意出入的疏散门:97:和设置门禁系统的住宅、宿舍、公寓建筑的外门，应保证火灾时不需使用钥匙等任何工具即能从内部易于打开，并应在显著位置设置具有使用提示的标识。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
