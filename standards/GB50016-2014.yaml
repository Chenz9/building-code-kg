  text: 歌舞厅、录像厅、夜总会、卡拉OK厅（含具有卡拉OK功能的餐厅）、游艺厅（含电子游艺厅）桑拿浴室（不包括洗浴部分）、网吧等歌舞娱乐放映游艺场所（不含剧场、电影院）的布置应符合下列规定：1不应布置在地下二层及以下楼层；2宜布置在一、二级耐火等级建筑内的首层、一层或三层的靠外墙部位；3不宜布置在袋形走道的两侧或尽端；4确需布置在地下一层时,地下一层的地面与室外出入口地坪的高差不应大于10m;5确需布置在地下或四层及以上楼层时，一个厅、室的建筑面积不应大于200m²；6厅、室之间及与建筑的其他部位之间，应采用耐火极限不低于2.00h的防火隔墙和1.00h的不燃性楼板分隔，设置在厅、室墙上的门和该场所与建筑内其他部位相通的门均应采用乙级防火门。
