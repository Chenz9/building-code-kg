  clause_no: 10.1.10
  text: 消防配电线路应满足火灾时连续供电的需要，其敷设应符合下列规定：1明敷时（包括敷设在吊顶内），应穿金属导管或采用封闭式金属槽盒保护，金属导管或封闭式金属槽盒应采取防火保护措施；当采用阻燃或耐火电缆并敷设在电缆井、沟内时，可不穿金属导管或采用封闭式金属槽盒保护；当采用矿物绝缘类不燃性电缆时，可直接明敷。2暗敷时，应穿管并应敷设在不燃性结构内且保护层厚度不应小于30mm。:129·3消防配电线路宜与其他配电线路分开敷设在不同的电缆井、沟内；确有困难需敷设在同一电缆并、沟内时，应分别布置在电缆井、沟的两侧，且消防配电线路应采用矿物绝缘类不燃性电缆。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
