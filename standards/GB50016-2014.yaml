  text: 耐火极限判定标准应符合下列规定：1 当采用HC标准升温曲线测试时，耐火极限的判定标准为：受火后，当距离混凝土底表面25mm处钢筋的温度超过250℃，或者混凝土表面的温度超过380℃时，则判定为达到耐火极限；2 当采用RABT标准升温曲线测试时，耐火极限的判定标准为：受火后，当距离混凝土底表面25mm处钢筋的温度超过300℃，或者混凝土表面的温度超过380℃时，则判定为达到耐火极限。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
