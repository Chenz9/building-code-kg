- id: GB 50016-2014#4.3.1
  standard_code: GB 50016-2014
  chapter: 4 甲、乙、丙类液体、气体储罐(区)和可燃材料堆场
  section: ''
  clause_no: 4.3.1
  text: 可燃气体储罐与建筑物、储罐、堆场等的防火间距应符合下列规定： 1 湿式可燃气体储罐与建筑物、储罐、堆场等的防火间距不应小于表4.3.1的规定。 [表图] 注：固定容积可燃气体储罐的总容积按储罐几何容积（m³）和设计储存压力（绝对压力，105Pa）的乘积计算。 2 固定容积的可燃气体储罐与建筑物、储罐、堆场等的防火间距不应小于表4.3.1的规定。 3 干式可燃气体储罐与建筑物、储罐、堆场等的防火间距：当可燃气体的密度比空气大时，应按表4.3.1的规定增加25%；当可燃气体的密度比空气小时，可按表4.3.1的规定确定。 4 湿式或干式可燃气体储罐的水封井、油泵房和电梯间等附属设施与该储罐的防火间距，可按工艺要求布置。 5 容积不大于20m³的可燃气体储罐与其使用厂房的防火间距不限。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性效力（2023-06-01，公告2022年第189号）
  applicability:
    scope: 可燃气体储罐与建筑物、储罐、堆场等的防火间距
    conditions:
    - 固定容积可燃气体储罐总容积按几何容积与设计储存压力乘积计算
    - 干式可燃气体储罐：当可燃气体密度比空气大时，应按表4.3.1增加25%；当密度比空气小时，可按表4.3.1确定
    - 容积不大于20m3的可燃气体储罐与其使用厂房的防火间距不限
    exceptions: []
