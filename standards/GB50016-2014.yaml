  text: '避难走道的设置应符合下列规定：避难走道防火隔墙的耐火极限不应低于3.0oh，楼板的耐火极限不应低于1.50h。2避难走道直通地面的出口不应少于2个，并应设置在: 98:不同方向；当避难走道仅与一个防火分区相通且该防火分区至少有1个直通室外的安全出口时，可设置1个直通地面的出地面的出口的距离不应大于60m。3避难走道的净宽度不应小于任一防火分区通向该避难走道的设计疏散总净宽度。4避难走道内部装修材料的燃烧性能应为A级。5防火分区至避难走道入口处应设置防烟前室，前室的使用面积不应小于6.0m²，开向前室的门应采用甲级防火门，前室开向避难走道的门应采用乙级防火门。6避难走道内应设置消火栓消防应急照明、应急广播和消防专线电话。'
