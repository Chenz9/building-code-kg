    - 暗敷时，应穿管并敷设在不燃性结构内且保护层厚度不应小于30mm
    - 消防配电线路宜与其他配电线路分开敷设在不同电缆井、沟内；确有困难需敷设在同一电缆井、沟内时，应分别布置在两侧且消防配电线路应采用矿物绝缘类不燃性电缆
