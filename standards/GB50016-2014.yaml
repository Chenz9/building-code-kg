- id: GB 50016-2014#12.2.2
  standard_code: GB 50016-2014
  chapter: 12 城市交通隧道
  section: 12.2消防给水和灭火设施
  clause_no: 12.2.2
  text: 消防给水系统的设置应符合下列规定：消防水源和供水管网应符合国家现行有关标准的规定。2消防用水量应按隧道的火灾延续时间和隧道全线同一时间发生一次火灾计算确定。一、二类隧道的火灾延续时间不应小于3.0h；三类隧道，不应小于2.0h。:142:3隧道内的消防用水量应按同时开启所有灭火设施的用水量之和计算。4隧道内宜设置独立的消防给水系统。严寒和寒冷地区的消防给水管道及室外消火栓应采取防冻措施；当采用干式给水系统时，应在管网的最高部位设置自动排气阀，管道的充水时间不宜大于90s。5隧道内的消火栓用水量不应小于20L/s,隧道外的消火栓用水量不应小于30L/s。对于长度小于1000m的三类隧道，隧道内、外的消火栓用水量可分别为10L/s和20L/s。6管道内的消防供水压力应保证用水量达到最大时，最不利点处的水枪充实水柱不小手10.0m。消火栓栓口处的出水压力大于0.5MPa时，应设置减压设施。7在隧道出人口处应设置消防水泵接合器和室外消火栓。8隧道内消火栓的间距不应大于50m,消灭栓的栓口距地面高度宜为1.1m。9设置消防水泵供水设施的隧道，应在消火栓箱内设置消防水泵启动按钮。10应在隧道单侧设置室内消火栓箱，消火栓箱内应配置1支喷嘴口径19mm的水枪、1盘长25m、直径65mm的水带，并宜配置消防软管卷盘。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 隧道消防给水系统的设置
    conditions:
    - 一、二类隧道火灾延续时间不应小于3.0h；三类隧道不应小于2.0h
    - 严寒和寒冷地区消防给水管道及室外消火栓应采取防冻措施；当采用干式给水系统时，应在管网最高部位设置自动排气阀，管道充水时间不宜大于90s
    - 对于长度小于1000m的三类隧道，隧道内、外消火栓用水量可分别为10L/s和20L/s
    - 消火栓栓口处出水压力大于0.5MPa时，应设置减压设施
