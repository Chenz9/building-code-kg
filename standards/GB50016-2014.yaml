  text: 可燃材料露天堆场区，液化石油气储罐区。甲 乙,丙类液体储罐区和可燃气体储罐区 应设置消防车道,消防车道的设置应符合下列规定，1，储量大于表7.1.6规定的堆场.储罐区、宜设置环形消防车道,2,占地面积大于30000m2的可燃材料堆场,应设置与环形消防车道相通的中间消防车道,消防车道的间距不宜大于150m 液化石油气储罐区，甲,乙 丙类液体储罐区和可燃气体储罐区内的环形消防车道之间宜设置连通的消防车道。
