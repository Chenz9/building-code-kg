- id: GB 50016-2014#5.3.2
  standard_code: GB 50016-2014
  chapter: 5 民用建筑
  section: 5.3防火分区和层数
  clause_no: 5.3.2
  text: 建筑内设置自动扶梯、敬开楼梯等上、下层相连通的开口时，其防火分区的建筑面积应按上、下层相连通的建筑面积叠加计算；当叠加计算后的建筑面积大于本规范第5.3.1条的规定时，应划分防火分区。建筑内设置中庭时，其防火分区的建筑面积应按上、下层相连通的建筑面积叠加计算；当叠加计算后的建筑面积大于本规范第5.3.1条的规定时，应符合下列规定：1与周围连通空间应进行防火分隔：采用防火隔墙时，其耐火极限不应低于1.00h；采用防火玻璃墙时，其耐火隔热性和耐火完整性不应低于1.00h，采用耐火完整性不低于1.00h的非隔热性防火玻璃墙时，应设置自动喷水灭火系统进行保护；采用防火卷帘时，其耐火极限不应低于3.00h，并应符合本规范第6.5.3条的规定；与中庭相连通的门、窗，应采用火灾时能自行关闭的甲级防火门、窗；2高层建筑内的中庭回廊应设置自动喷水灭火系统和火灾自动报警系统；3中庭应设置排烟设施；4中庭内不应布置可燃物。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
    scope: 建筑内设置自动扶梯、敞开楼梯、中庭时的防火分区建筑面积
    conditions:
    - 当上、下层相连通开口叠加计算后的建筑面积大于第5.3.1条规定时，应划分防火分区
    - 建筑内设置中庭时，其防火分区的建筑面积按上、下层相连通建筑面积叠加计算，当大于第5.3.1条规定时，应符合下列规定（与周围连通空间防火分隔等）
    exceptions: []
