  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
    scope: 室外疏散楼梯
    conditions: []
    exceptions:
    - 疏散门（除疏散门外，楼梯周围2m内墙面不应设置门、窗、洞口）
  constraint:
