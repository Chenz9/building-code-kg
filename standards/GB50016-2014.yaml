- id: GB 50016-2014#4.2.5
  standard_code: GB 50016-2014
  chapter: 4 甲、乙、丙类液体、气体储罐(区)和可燃材料堆场
  section: ''
  clause_no: 4.2.5
  text: 甲、乙、丙类液体的地上式、半地下式储罐或储罐组，其四周应设置不燃性防火堤。防火堤的设置应符合下列规定：1防火堤内的储罐布置不宜超过2排，单罐容量不大于1000m且闪点大于120℃的液体储罐不宜超过4排。2防火堤的有效容量不应小于其中最大储罐的容量。对于浮顶罐，防火堤的有效容量可为其中最大储罐容量的一3防火堤内侧基脚线至立式储罐外壁的水平距离不应小于罐壁高度的一半。防火堤内侧基脚线至卧式储罐的水平距离不应小于3m。4防火堤的设计高度应比计算高度高出0.2m，且应为1.0m～2.2m，在防火堤的适当位置应设置便于灭火救援人员进出防火堤的踏步。5沸溢性油品的地上式、半地下式储罐，每个储罐均应设置一个防火堤或防火隔堤。6含油污水排水管应在防火堤的出口处设置水封设施，雨水排水管应设置阀门等封闭、隔离装置。
  is_abolished: true
