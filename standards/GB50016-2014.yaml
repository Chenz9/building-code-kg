- id: GB 50016-2014#A.0.1
  standard_code: GB 50016-2014
  chapter: 附录A 建筑高度和建筑层数的计算方法
  section: ''
  clause_no: A.0.1
  text: A.0.1建筑高度的计算应符合下列规定：1建筑屋面为坡屋面时，建筑高度应为建筑室外设计地面至其檐口与屋脊的平均高度。2建筑屋面为平屋面（包括有女儿墙的平屋面)时，建筑高度应为建筑室外设计地面至其屋面面层的高度。3同一座建筑有多种形式的屋面时，建筑高度应按上述方法分别计算后，取其中最大值。4对于台阶式地坪，当位于不同高程地坪上的同一建筑之间有防火墙分隔，各自有符合规范规定的安全出口，且可沿建筑的两个长边设置贯通式或尽头式消防车道时，可分别计算各自的建筑高度。否则，应按其中建筑高度最大者确定该建筑的建筑高度。5，局部突出屋顶的瞭望塔、冷却塔、水箱间、微波天线间或设施，电梯机房、排风和排烟机房以及楼梯出口小间等辅助用房占屋面面积不大于1/4者，可不计入建筑高度。6对于住宅建筑，设置在底部且室内高度不大于2.2m的自行车库、储藏室、开空间，室内外高差或建筑的地下或半地下室的顶板面高出室外设计地面的高度不大于1.5m的部分，可不计入建筑高度。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 建筑高度的计算
    conditions:
    - 建筑屋面为坡屋面时，建筑高度应为室外设计地面至檐口与屋脊平均高度
    - 建筑屋面为平屋面（含女儿墙）时，建筑高度应为室外设计地面至屋面面层高度
    - 同一座建筑有多种形式屋面时，应分别计算取最大值
    - 对于台阶式地坪，当位于不同高程地坪上的同一建筑之间有防火墙分隔、各自有符合规定安全出口且可沿两个长边设置贯通式或尽头式消防车道时，可分别计算各自建筑高度；否则按最大者确定
    - 局部突出屋顶的瞭望塔等辅助用房占屋面面积不大于1/4者，可不计入建筑高度
    - 对于住宅建筑，设置在底部且室内高度不大于2.2m的自行车库、储藏室、开敞空间，室内外高差或地下、半地下室顶板面高出室外设计地面高度不大于1.5m的部分，可不计入建筑高度
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters:
  - name: 室内高度
    unit: m
    condition: null
    min_value: 2.2
    max_value: null
  - name: 面的高度
    unit: m
    condition: null
    min_value: 1.5
    max_value: null
