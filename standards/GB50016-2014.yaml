  clause_no: 6.4.5
  text: 室外疏散楼梯应符合下列规定：1栏杆扶手的高度不应小于1.10m，楼梯的净宽度不应小于0.90m。2倾斜角度不应大于45°。3梯段和平台均应采用不燃材料制作。平台的耐火极限不应低于1.00h，梯段的耐火极限不应低于0.25h。4通向室外楼梯的门应采用乙级防火门，并应向外开启。:96:5除疏散门外，楼梯周围2m内的墙面上不应设置门、窗、洞口。疏散门不应正对梯段。
