- id: GB 50016-2014#5.5.17
  standard_code: GB 50016-2014
  chapter: 5 民用建筑
  section: 5.5安全疏散和避难
  clause_no: 5.5.17
  text: 公共建筑的安全疏散距离应符合下列规定：直通疏散走道的房间疏散门至最近安全出口的直线距离不应大于表5.5.17的规定；2 楼梯间应在首层直通室外，确有困难时，可在首层采用扩大的封闭楼梯间或防烟楼梯间前室。当层数不超过4层且未采用扩大的封闭楼梯间或防烟楼梯间前室时，可将直通室外的门设置在离楼梯间不大于15m处；3 房间内任一点至房间直通疏散走道的疏散门的直线距离，不应大于表5.5.17规定的袋形走道两侧或尽端的疏散门至最近安全出口的直线距离；4 一、二级耐火等级建筑内疏散门或安全出口不少于2个的观众厅、展览厅、多功能厅、餐厅、营业厅等，其室内任一点至最近疏散门或安全出口的直线距离不应大于30m；当疏散门不能直通室外地面或疏散楼梯间时，应采用长度不大于10m的疏散走道通至最近的安全出口。当该场所设置自动喷水灭火系统时，室内任一点至最近安全出口的安全疏散距离可分别增加25%。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《GB 55037-2022》废止强制性条文效力（住房城乡建设部公告，2023-06-01实施）
  applicability:
    scope: 多层公共建筑中顶层局部升高部分的安全出口与疏散楼梯
    conditions:
    - 顶层局部升高，且高出部分的层数不超过2层、人数之和不超过50人、每层建筑面积不大于200m²时
    - 当疏散门不能直通室外地面或疏散楼梯间时
    - 当该场所设置自动喷水灭火系统时
