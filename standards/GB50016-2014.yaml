  text: 公共建筑内房间的疏散门数量应经计算确定且不应少于2个。除托儿所、幼儿园、老年人建筑、医疗建筑、教学建筑内位于走道尽端的房间外，符合下列条件之一的房间可设置1个疏散门：1位于两个安全出口之间或袋形走道两侧的房间，对于托儿所、幼儿园、老年人建筑，建筑面积不大于50m，对于医疗建筑、教学建筑，建筑面积不大于75m²；对于其他建筑或场所，建筑面积不大于120m²。2位于走道尽端的房间，建筑面积小于50m²且疏散门的净宽度不小于0.90m，或由房间内任一点至疏散门的直线距离不大于15m、建筑面积不大于200m²且疏散门的净宽度不小于1.40m。3歌舞娱乐放映游艺场所内建筑面积不大于50m²且经常停留人数不超过15人的厅、室。
