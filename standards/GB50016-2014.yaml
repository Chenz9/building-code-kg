- id: GB 50016-2014#6.2.8
  standard_code: GB 50016-2014
  chapter: 6 建筑构造
  section: 6.2建筑构件和管道井
  clause_no: 6.2.8
  text: 冷库、低温环境生产场所采用泡沫塑料等可燃材料作墙体内的绝热层时，宜采用不燃绝热材料在每层楼板处做水平防火分隔。防火分隔部位的耐火极限不应低于楼板的耐火极限。冷库阁楼层和墙体的可燃绝热层宜采用不燃性墙体分隔。人冷库、低温环境生产场所采用泡沫塑料作内绝热层时，绝热层的燃烧性能不应低于B1级，且绝热层的表面应采用不燃材料做防护层。冷库的库房与加工车间贴邻建造时，应采用防火墙分隔，当确需开设相互连通的开口时，应采取防火隔间等措施进行分隔，隔间两侧的门应为甲级防火门。当冷库的氨压缩机房与加工车间贴邻时，应采用不开门窗洞口的防火墙分隔。
