  clause_no: 6.7.5
  text: 与基层墙体、装饰层之间无空腔的建筑外墙外保温系统，其保温材料应符合下列规定：1住宅建筑：1)建筑高度大于100m时，保温材料的燃烧性能应为A2)建筑高度大于27m,但不大于100m时，保温材料的燃烧性能不应低于B1级；3)建筑高度不大于27m时，保温材料的燃烧性能不应低于B2级。除住宅建筑和设置人员密集场所的建筑外，其他建筑：1)建筑高度大于50m时，保温材料的燃烧性能应为A2）建筑高度大于24m，但不大于50m时，保温材料的燃烧性能不应低于B1级；3）建筑高度不大于24m时，保温材料的燃烧性能不应低于B,级。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
