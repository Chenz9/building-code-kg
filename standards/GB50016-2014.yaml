  text: 医院和疗养院的住院部分不应设置在地下或半地下。医院和疗养院的住院部分采用三级耐火等级建筑时，不应超过2层；采用四级耐火等级建筑时，应为单层；设置在三级耐火等级的建筑内时，应布置在首层或二层；设置在四级耐火等.68:级的建筑内时，应布置在首层。医院和疗养院的病房楼内相邻护理单元之间应采用耐火极限不低于2.00h的防火隔墙分隔，隔墙上的门应采用乙级防火门，设置在走道上的防火门应采用常开防火门。
