- id: GB 50016-2014#8.4.1
  standard_code: GB 50016-2014
  chapter: 8 消防设施的设置
  section: 8.4火灾自动报警系统
  clause_no: 8.4.1
  text: 下列建筑或场所应设置火灾自动报警系统：1任一层建筑面积大于1500m²或总建筑面积大于3000m的制鞋、制衣、玩具、电子等类似用途的厂房；2每座占地面积大于1000m²的棉、毛、丝、麻、化纤及其制品的仓库，占地面积大于500m或总建筑面积大于1000m²的卷烟仓库;3任一层建筑面积大于1500m²或总建筑面积大于3000m的商店、展览、财贸金融、客运和货运等类似用途的建筑，总建筑面积大于500m²的地下或半地下商店；4图书或文物的珍藏库，每座藏书超过50万册的图书馆，重要的档案馆；5地市级及以上广播电视建筑、邮政建筑、电信建筑，城市或区域性电力、交通和防灾等指挥调度建筑；6特等、甲等剧场，座位数超过1500个的其他等级的剧场或电影院，座位数超过2000个的会堂或礼堂，座位数超过3000个的体育馆；:119:7大、中型幼儿园的儿童用房等场所，老年人建筑，任一层建筑面积大于1500m²或总建筑面积大于3000m²的疗养院的病房楼、旅馆建筑和其他儿童活动场所，不少于200床位的医院门诊楼、病房楼和手术部等；8歌舞娱乐放映游艺场所；9净高大于2.6m且可燃物较多的技术夹层，净高大于0.8m且有可燃物的闷顶或吊顶内；10电子信息系统的主机房及其控制室、记录介质库，特殊贵重或火灾危险性大的机器、仪表、仪器设备室、贵重物品库房；11二类高层公共建筑内建筑面积大于50m²的可燃物品库房和建筑面积大于500m的营业厅；12其他一类高层公共建筑;13设置机械排烟、防烟系统，雨淋或预作用自动喷水灭火系统，固定消防水炮灭火系统、气体灭火系统等需与火灾自动报警系统联锁动作的场所或部位。
