  text: 托儿所、幼儿园的儿童用房，老年人活动场所和儿童游乐厅等儿童活动场所宜设置在独立的建筑内，且不应设置在地下或半地下；当采用一、级耐火等级的建筑时,不应超过3层；采用三级耐火等级的建筑时，不应超过2层；采用四级耐火等级的建筑时，应为单层；确需设置在其他民用建筑内时，应符合下列规定：1设置在一、二级耐火等级的建筑内时,应布置在首层、二层或三层；设置在三级耐火等级的建筑内时，应布置在首层或二设置在四级耐火等级的建筑内时，应布置在首层；设置在高层建筑内时，应设置独立的安全出口和疏散楼梯;5设置在单、多层建筑内时，宜设置独立的安全出口和疏散楼梯。
