  clause_no: 8.3.1
  text: 除本规范另有规定和不宜用水保护或灭火的场所外，下列厂房或生产部位应设置自动灭火系统，并宜采用自动喷水灭火系统： 1 不小于50000纱锭的棉纺厂的开包、清花车间，不小于5000锭的麻纺厂的分级、梳麻车间，火柴厂的烤梗、筛选部位； 2 占地面积大于1500m²或总建筑面积大于3000m²的单、多层制鞋、制衣、玩具及电子等类似生产的厂房； 3 占地面积大于1500m²的木器厂房； 4 泡沫塑料厂的预发、成型、切片、压花部位； 5 高层乙、丙类厂房； 6 建筑面积大于500m²的地下或半地下丙类厂房。
