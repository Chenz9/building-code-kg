  clause_no: 6.4.12
  text: 用于防火分隔的下沉式广场等室外开散空间，应符合下列规定：1分隔后的不同区域通向下沉式广场等室外开空间的开口最近边缘之间的水平距离不应小于13m。室外开空间除用于人员蔬散外不得用于其他商业或可能导致火灾蔓延的用途，其中用于疏散的净面积不应小于169m²。2下沉式广场等室外开空间内应设置不少于1部直通地面的疏散楼梯。当连接下沉广场的防火分区需利用下沉广场进行疏散时，疏散楼梯的总净宽度不应小于任一防火分区通向室外开散空间的设计疏散总净宽度。3确需设置防风雨篷时，防风雨篷不应完全封闭，四周开口部位应均匀布置，开口的面积不应小于该空间地面面积的25%，开口高度不应小于1.0m；开口设置百叶时，百叶的有效排烟面积可按百叶通风口面积的60%计算。
  is_abolished: false
