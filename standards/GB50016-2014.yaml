  section: ''
  clause_no: 5.4.10
  text: 除商业服务网点外，住宅建筑与其他使用功能的建筑合建时，应符合下列规定：1住宅部分与非住宅部分之间，应采用耐火极限不低于2.00h且无门、窗、洞口的防火隔墙和1.50h的不燃性楼板完全分隔；当为高层建筑时，应采用无门、窗、洞口的防火墙和耐火极限不低于2.00h的不燃性楼板完全分隔。建筑外墙:70:上、下层开口之间的防火措施应符合本规范第6.2.5条的规定。2住宅部分与非住宅部分的安全出口和疏散楼梯应分别独立设置；为住宅部分服务的地上车库应设置独立的疏散楼梯或安全出口，地下车库的疏散楼梯应按本规范第6.4.4条的规定进行分隔。3住宅部分和非住宅部分的安全疏散、防火分区和室内消防设施配置，可根据各自的建筑高度分别按照本规范有关住宅建筑和公共建筑的规定执行，该建筑的其他防火设计应根据建筑的总高度和建筑规模按本规范有关公共建筑的规定执行。
