  text: 剧场、电影院、礼堂宜设置在独立的建筑内；采用三级耐火等级建筑时，不应超过2层；确需设置在其他民用建筑内时，至少应设置1个独立的安全出口和疏散楼梯，并应符合下列规定：1应采用耐火极限不低于2.00h的防火隔墙和甲级防火门与其他区域分隔。2设置在～二级耐火等级的建筑内时,观众厅宜布置在首层、二层或三层；确需布置在四层及以上楼层时，一个厅、室的疏散门不应少于2个，且每个观众厅的建筑面积不宜大于400m²。3设置在三级耐火等级的建筑内时，不应布置在三层及以上楼层。4设置在地下或半地下时，宜设置在地下一层，不应设置在地下三层及以下楼层。5设置在高层建筑内时，应设置火灾自动报警系统及自动喷水灭火系统等自动灭火系统。
