  section: ''
  clause_no: 4.3.2
  text: 可燃气体储罐（区）之间的防火间距应符合下列规定： 1 湿式可燃气体储罐或干式可燃气体储罐之间及湿式与干式可燃气体储罐的防火间距，不应小于相邻较大罐直径的1/2。 2 固定容积的可燃气体储罐之间的防火间距不应小于相邻较大罐直径的2/3。 3 固定容积的可燃气体储罐与湿式或干式可燃气体储罐的防火间距，不应小于相邻较大罐直径的1/2。 4 数个固定容积的可燃气体储罐的总容积大于200000m³时，应分组布置。卧式储罐组之间的防火间距不应小于相邻较大罐长度的一半；球形储罐组之间的防火间距不应小于相邻较大罐直径，且不应小于20m。
