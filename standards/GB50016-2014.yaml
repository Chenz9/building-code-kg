  section: 10.2电力线路及电器装置
  clause_no: 10.2.4
  text: 开关、插座和照明灯具靠近可燃物时，应采取隔热、散热等防火措施。卤钨灯和额定功率不小于100W的白炽灯泡的吸顶灯、槽灯、嵌入式灯，其引入线应采用瓷管、矿棉等不燃材料作隔热保护。额定功率不小于60W的白炽灯、卤钨灯、高压钠灯、金属卤化物灯、荧光高压汞灯（包括电感镇流器）等，不应直接安装在可燃物体上或采取其他防火措施。
