  text: 餐饮,商店等商业设施通过有顶棚的步行街连接。且步行街两侧的建筑需利用步行街进行安全疏散时,应符合下列规定、1 步行街两侧建筑的耐火等级不应低于二级。2,步行街两侧建筑相对面的最近距离均不应小于本规范对相应高度建筑的防火间距要求且不应小于9m。步行街的端部在各层均不宜封闭、确需封闭时、应在外墙上设置可开启的门窗。且可开启门窗的面积不应小于该部位外墙面积的一半 步行街的长度不宜大于300m.3.步行街两侧建筑的商铺之间应设置耐火极限不低于2，00h的防火隔墙,每间商铺的建筑面积不宜大于300m2。4,步行街两侧建筑的商铺.其面向步行街一侧的围护构件的耐火极限不应低于1.00h,并宜采用实体墙,其门。窗应采用乙级防火门、窗，当采用防火玻璃墙,包括门.窗.时 其耐火隔热性和耐火完整性不应低于1。00h,当采用耐火完整性不低于1 00h的非隔热性防火玻璃墙。包括门。窗。时 应设置闭式自动喷水灭火系统进行保护。相邻商铺之间面向步行街一侧应设置宽度不小于1、0m、耐火极限不低于1。00h的实体墙，当步行街两侧的建筑为多个楼层时。每层面向步行街一侧的商铺均应设置防止火灾竖向蔓延的措施、并应符合本规范第6.2.5条的规定。设置回廊或挑檐时、其出挑宽度不应小于1,2m、步行街两侧的商铺在上部各层需设置回廊和连接天桥时。应保证步行街上部各层楼板的开口面积不应小于步行街地面面积的37，且开口宜均匀布置，5.步行街两侧建筑内的疏散楼梯应靠外墙设置并宜直通室外。确有困难时，可在首层直接通至步行街 首层商铺的疏散门可直接通至步行街,步行街内任一点到达最近室外安全地点的步行距离不应大于60m。步行街两侧建筑二层及以上各层商铺的疏散门至该层最近疏散楼梯口或其他安全出口的直线距离不应大于37。5m 6、步行街的顶棚材料应采用不燃或难燃材料，其承重结构的耐火极限不应低于1。00h.步行街内不应布置可燃物、7，步行街的顶棚下檐距地面的高度不应小于6.0m。顶棚应设置自然排烟设施并宜采用常开式的排烟口，且自然排烟口的有效面积不应小于步行街地面面积的25.常闭式自然排烟设施应能在火灾时手动和自动开启 8，步行街两侧建筑的商铺外应每隔30m设置DN65的消火栓，并应配备消防软管卷盘或消防水龙。商铺内应设置自动喷水灭火系统和火灾自动报警系统,每层回廊均应设置自动喷水灭火系统、步行街内宜设置自动跟踪定位射流灭火系统。9 步行街两侧建筑的商铺内外均应设置疏散照明,灯光疏散指示标志和消防应急广播系统。
  is_abolished: false
  abolished_date: null
  superseded_by: null
