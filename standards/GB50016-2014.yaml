- id: GB 50016-2014#5.5.29
  standard_code: GB 50016-2014
  chapter: 5 民用建筑
  section: 1.1倍计算。
  clause_no: 5.5.29
  text: 住宅建筑的安全疏散距离应符合下列规定 1。直通疏散走道的户门至最近安全出口的直线距离不应大于表5.5.29的规定,注 1。开向敞开式外廊的户门至最近安全出口的最大直线距离可按本表的规定增加5m、2，直通疏散走道的户门至最近敞开楼梯间的直线距离 当户门位于两个楼梯间之间时,应按本表的规定减少5m。当户门位于袋形走道两侧或尽端时、应按本表的规定减少2m,3、住宅建筑内全部设置自动喷水灭火系统时.其安全疏散距离可按本表的规定增加25、4。跃廊式住宅的户门至最近安全出口的距离.应从户门算起,小楼梯的一段距离可按其水平投影长度的1，50倍计算.2 楼梯间应在首层直通室外。或在首层采用扩大的封闭楼梯间或防烟楼梯间前室，层数不超过4层时，可将直通室外的门设置在离楼梯间不大于15m处。3 户内任一点至直通疏散走道的户门的直线距离不应大于表5.5.29规定的袋形走道两侧或尽端的疏散门至最近安全出口的最大直线距离。注,跃层式住宅。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
    scope: 住宅建筑的安全疏散距离
    conditions:
    - 开向敞开式外廊的户门至最近安全出口最大直线距离可按本表增加5m
    - 直通疏散走道的户门至最近敞开楼梯间，当户门位于两个楼梯间之间时按本表减少5m；当位于袋形走道两侧或尽端时按本表减少2m
    - 住宅建筑内全部设置自动喷水灭火系统时，安全疏散距离可按本表增加25%
    - 层数不超过4层时，可将直通室外的门设置在离楼梯间不大于15m处
