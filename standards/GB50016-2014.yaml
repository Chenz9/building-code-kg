- id: GB 50016-2014#6.2.9
  standard_code: GB 50016-2014
  chapter: 6 建筑构造
  section: 6.2建筑构件和管道井
  clause_no: 6.2.9
  text: 建筑内的电梯井等竖井应符合下列规定：1电梯井应独立设置，井内严禁敷设可燃气体和甲、乙、丙类液体管道，不应敷设与电梯无关的电缆、电线等。电梯井的井壁除设置电梯门、安全逃生门和通气孔洞外，不应设置其·92·他开口。2电缆井、管道井、排烟道、排气道、垃圾道等竖向井道，应分别独立设置。并壁的耐火极限不应低于1.00h，并壁上的检查门应采用丙级防火门。3建筑内的电缆井、管道井应在每层楼板处采用不低于楼板耐火极限的不燃材料或防火封堵材料封堵建筑内的电缆井、管道井与房间、走道等相连通的孔隙应采用防火封堵材料封堵。4建筑内的垃圾道宜靠外墙设置，垃圾道的排气口应直接开向室外，垃圾斗应采用不燃材料制作，并应能自行关闭。5电梯层门的耐火极限不应低于1.00h，并应符合现行国家标准《电梯层门耐火试验完整性、隔热性和热通量测定法》GB/T27903规定的完整性和隔热性要求。
