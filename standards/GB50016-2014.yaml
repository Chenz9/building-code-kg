- id: GB 50016-2014#6.4.1
  standard_code: GB 50016-2014
  chapter: 6 建筑构造
  section: 6.4疏散楼梯间和疏散楼梯等
  clause_no: 6.4.1
  text: 疏散楼梯间应符合下列规定：1楼梯间应能天然采光和自然通风，并宜靠外墙设置。靠外墙设置时，楼梯间、前室及合用前室外墙上的窗口与两侧门、窗、洞口最近边缘的水平距离不应小于1.0m。2楼梯间内不应设置烧水间、可燃材料储藏室、垃圾道。3楼梯间内不应有影响疏散的凸出物或其他障碍物。:94:4封闭楼梯间、防烟楼梯间及其前室，不应设置卷帘。5楼梯间内不应设置甲、乙、丙类液体管道。6封闭楼梯间、防烟楼梯间及其前室内禁止穿过或设置可燃气体管道。开楼梯间内不应设置可燃气体管道，当住宅表时，应采用金属管和设置切断气源的阀门。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
    scope: 疏散楼梯间
    conditions:
    - 靠外墙设置时，楼梯间、前室及合用前室外墙上窗口与两侧门、窗、洞口最近边缘水平距离不应小于1.0m
    - 开楼梯间内不应设置可燃气体管道；当住宅建筑内设置可燃气体管道时，应采用金属管和设置切断气源阀门
    exceptions: []
