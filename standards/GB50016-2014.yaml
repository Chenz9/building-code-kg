- id: GB 50016-2014#8.3.9
  standard_code: GB 50016-2014
  chapter: 8 消防设施的设置
  section: 8.3自动灭火系统
  clause_no: 8.3.9
  text: 下列场所应设置自动灭火系统，并宜采用气体灭火. 117:系统：1国家、省级或人口超过100万的城市广播电视发射塔内的微波机房、分米波机房、米波机房、变配电室和不间断电源(UPS)室；2国际电信局、大区中心、省中心和一万路以上的地区中心内的长途程控交换机房、控制室和信令转接点室；3两万线以上的市话汇接局和六万门以上的市话端局内的程控交换机房、控制室和信令转接点室，4中央及省级公安、防灾和网局级及以上的电力等调度指挥中心内的通信机房和控制室；5A、B级电子信息系统机房内的主机房和基本工作间的已记录磁（纸）介质库；6中央和省级广播电视中心内建筑面积不小于120m²的音像制品库房；7国家、省级或藏书量超过100万册的图书馆内的特藏库；中央和省级档案馆内的珍藏库和非纸质档案库；大、中型博物馆内的珍品库房；一级纸绢质文物的陈列室；注：1本条第1、4、5、8款规定的部位，可采用细水雾灭火系统。当有备用主机和备用已记录磁（纸）介质，且设置在不同建筑内或同一建筑内的不同防火分区内时，本条第5款规定的部位可采用预作用自动喷水灭火系统。8.3. 10甲、乙、丙类液体储罐的灭火系统设置应符合下列规定：1单罐容量大于1000m的固定顶罐应设置固定式泡沫灭火系统；2罐壁高度小于7m或容量不大于200m的储罐可采用移动式泡沫灭火系统；:118:3其他储罐宜采用半固定式泡沫灭火系统；4石油库、石油化工、石油天然气工程中甲、乙、丙类液体储罐的灭火系统设置，应符合现行国家标准《石油库设计规范》GB50074等标准的规定。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
