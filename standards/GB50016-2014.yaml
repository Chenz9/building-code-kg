  text: 设置商业服务网点的住宅建筑。其居住部分与商业服务网点之间应采用耐火极限不低于2.00h且无门，窗，洞口的防火隔墙和1，50h的不燃性楼板完全分隔.住宅部分和商业服务网点部分的安全出口和疏散楼梯应分别独立设置、商业服务网点中每个分隔单元之间应采用耐火极限不低于2、00h且无门，窗 洞口的防火隔墙相互分隔、当每个分隔单元任一层建筑面积大于200m2时，该层应设置2个安全出口或疏散门 每个分隔单元内的任一点至最近直通室外的出口的直线距离不应大于本规范表5.5.17中有关多层其他建筑位于袋形走道两侧或尽端的疏散门至最近安全出口的最大直线距离，注、室内楼梯的距离可按其水平投影长度的1，50倍计算。
