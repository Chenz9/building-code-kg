- id: GB 50016-2014#12.3.4
  standard_code: GB 50016-2014
  chapter: 12 城市交通隧道
  section: 12.3通风和排烟系统
  clause_no: 12.3.4
  text: 隧道内设置的机械排烟系统应符合下列规定：1采用全横向和半横向通风方式时，,可通过排风管道排烟。2采用纵向排烟方式时，应能迅速组织气流、有效排烟，其排烟风速应根据隧道内的最不利火灾规模确定，且纵向气流的速度不应小于2m/s，并应大于临界风速。3排烟风机和烟气流经的风阀、消声器、软接等辅助设备，应能承受设计的隧道火灾烟气排放温度，并应能在250℃下连续正常运行不小于1.0h。排烟管道的耐火极限不应低于1.00h。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
