- id: GB 50016-2014#6.4.2
  standard_code: GB 50016-2014
  chapter: 6 建筑构造
  section: 6.4疏散楼梯间和疏散楼梯等
  clause_no: 6.4.2
  text: 封闭楼梯间除应符合本规范第6.4.1条的规定外，尚应符合下列规定：1不能自然通风或自然通风不能满足要求时，应设置机械加压送风系统或采用防烟楼梯间。2除楼梯间的出入口和外窗外，楼梯间的墙上不应开设其他门、窗、洞口。3高层建筑、人员密集的公共建筑、人员密集的多层丙类厂房、甲、乙类厂房，其封闭楼梯间的门应采用乙级防火门，并应向疏散方向开启；其他建筑，可采用双向弹簧门。4楼梯间的首层可将走道和门厅等包括在楼梯间内形成扩大的封闭楼梯间，但应采用乙级防火门等与其他走道和房间分隔。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
    scope: 封闭楼梯间
    conditions:
    - 不能自然通风或自然通风不能满足要求时，应设置机械加压送风系统或采用防烟楼梯间
    - 高层建筑、人员密集公共建筑、人员密集多层丙类厂房、甲、乙类厂房，其封闭楼梯间门应采用乙级防火门并应向疏散方向开启；其他建筑可采用双向弹簧门
    exceptions:
    - 楼梯间出入口和外窗（除此外楼梯间墙上不应开设其他门、窗、洞口）
  constraint:
