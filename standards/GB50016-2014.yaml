    content: 表5.5.29的规定。:86:表5.5.291住宅建筑直通疏散走道的户门至最近安全出口的直线距离（m）位于袋形走道两侧或尽端的户门位于两个安全出口之间的户门住宅建筑类别一、二级三级四级一、二级三级四级单、多层高层Ot注：1开向散开式外廊的户门至最近安全出口的最大直线距离可按本表的规定增加5m。2直通疏散走道的户门至最近散开楼梯间的直线距离，当户门位于两个楼梯间之间时，应按本表的规定减少5m；当户门位于袋形走道两侧或尽端时，应按本表的规定减少2m。3住宅建筑内全部设置自动喷水灭火系统时，其安全疏散距离可按本表的规定增加25%。4跃廊式住宅的户门至最近安全出口的距离，应从户门算起，小楼梯的一段距离可按其水平投影长度的1.50倍计算。2楼梯间应在首层直通室外，或在首层采用扩大的封闭楼梯间或防烟楼梯间前室。层数不超过4层时，可将直通室外的门设置在离楼梯间不大于15m处。3户内任一点至直通疏散走道的户门的直线距离不应大于表5.5.29规定的袋形走道两侧或尽端的疏散门至最近安全出口的最大直线距离。注：跃层式住宅，户内楼梯的距离可按其梯段水平投影长度的1.50倍计算。
