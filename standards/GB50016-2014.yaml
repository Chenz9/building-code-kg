- id: GB 50016-2014#5.5.23
  standard_code: GB 50016-2014
  chapter: 5 民用建筑
  section: 1.1倍计算。
  clause_no: 5.5.23
  text: '建筑高度大于100m的公共建筑，应设置避难层(间）。避难层(间)应符合下列规定：1第一个避难层（间）的楼地面至灭火救援场地地面的高度不应大于50m，两个避难层（间）之间的高度不宜大于50m2通向避难层（间)的疏散楼梯应在避难层分隔、同层错位或上下层断开。3避难层（间）的净面积应能满足设计避难人数避难的要求,并宜按5.0人/m²计算。4避难层可兼作设备层。设备管道宜集中布置，其中的易燃、可燃液体或气体管道应集中布置，设备管道区应采用耐火极限不低于3.00h的防火隔墙与避难区分隔。管道井和设备间应采用耐火极限不低于2.00h的防火隔墙与避难区分隔，管道井和设备间的门不应直接开向避难区；确需直接开向避难区时，与避难层区出入口的距离不应小于5m，且应采用甲级防火门。避难间内不应设置易燃、可燃液体或气体管道，不应开设除外窗、疏散门之外的其他开口。5避难层应设置消防电梯出口。: 84 :应设置消火栓和消防软管卷盘。应设置消防专线电话和应急广播。在避难层（间）进入楼梯间的入口处和疏散楼梯通向避难层（间）的出口处，应设置明显的指示标志。9应设置直接对外的可开启窗口或独立的机械防烟设施，外窗应采用乙级防火窗。'
