  clause_no: 5.3.5
  text: '总建筑面积大于20000m的地下或半地下商店，应采用无门、窗、洞口的防火墙、耐火极限不低于2.00h的楼板分隔为多个建筑面积不大于20000m²的区域。相邻区域确需局部连通时，应采用下沉式广场等室外开敲空间、防火隔间、避难走道、防烟楼梯间等方式进行连通，并应符合下列规定：: 65 :1下沉式广场等室外开散空间应能防止相邻区域的火灾蔓延和便于安全疏散，并应符合本规范第6.4.12条的规2防火隔间的墙应为耐火极限不低于3.00h的防火隔墙，并应符合本规范第6.4.13条的规定；3避难走道应符合本规范第6.4.14条的规定；防烟楼梯间的门应采用甲级防火门。'
  is_abolished: true
