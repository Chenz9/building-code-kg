- id: GB 50016-2014#11.0.1
  standard_code: GB 50016-2014
  chapter: 11 木结构建筑
  section: 10.3消防应急照明和疏散指示标志
  clause_no: 11.0.1
  text: 木结构建筑的防火设计可按本章的规定执行。建筑构件的燃烧性能和耐火极限应符合表11.0.1的规定。注，1。除本规范另有规定外、当同一座木结构建筑存在不同高度的屋顶时，较低部分的屋顶承重构件和屋面不应采用可燃性构件、采用难燃性屋顶承重构件时。其耐火极限不应低于0，75h,2。轻型木结构建筑的屋顶.除防水层,保温层及屋面板外、其他部分均应视为屋顶承重构件。且不应采用可燃性构件，耐火极限不应低于0，50h,3,当建筑的层数不超过2层 防火墙间的建筑面积小于600m2且防火墙间的建筑长度小于60m时。建筑构件的燃烧性能和耐火极限可按本规范有关四级耐火等级建筑的要求确定。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 木结构建筑构件的燃烧性能和耐火极限
    conditions:
    - 除本规范另有规定外，当同一座木结构建筑存在不同高度屋顶时，较低部分屋顶承重构件和屋面不应采用可燃性构件；采用难燃性屋顶承重构件时耐火极限不应低于0.75h
    - 轻型木结构建筑屋顶（除防水层、保温层及屋面板外）其他部分均应视为屋顶承重构件且不应采用可燃性构件，耐火极限不应低于0.50h
    - 当建筑层数不超过2层、防火墙间建筑面积小于600m2且防火墙间建筑长度小于60m时，建筑构件燃烧性能和耐火极限可按四级耐火等级建筑要求确定
    exceptions:
    - 本规范另有规定
