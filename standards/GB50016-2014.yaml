  section: 7.3消防电梯
  clause_no: 7.3.5
  text: 除设置在仓库连廊、冷库穿堂或谷物筒仓工作塔内的消防电梯外，消防电梯应设置前室，并应符合下列规定：:108 :1前室宜靠外墙设置，并应在首层直通室外或经过长度不大于30m的通道通向室外；2前室的使用面积不应小于6.0m²；与防烟楼梯间合用的前室，应符合本规范第5.5.28条和第6.4.3条的规定；3除前室的出入口、前室内设置的正压送风口和本规范第5.5.27条规定的户门外，前室内不应开设其他门、窗、洞口；4前室或合用前室的门应采用乙级防火门，不应设置卷帘。
