- id: GB 50016-2014#3.3.1
  standard_code: GB 50016-2014
  chapter: 3 厂房和仓库
  section: 3.3厂房和仓库的层数、面积和平面布置
  clause_no: 3.3.1
  text: 除本规范另有规定外,厂房的层数和每个防火分区的最大允许建筑面积应符合表3.3.1的规定，注。1 防火分区之间应采用防火墙分隔。除甲类厂房外的一。二级耐火等级厂房。当其防火分区的建筑面积大于本表规定 且设置防火墙确有困难时、可采用防火卷帘或防火分隔水幕分隔,采用防火卷帘时 应符合本规范第6.5.3条的规定，采用防火分隔水幕时，应符合现行国家标准,自动喷水灭火系统设计规范 GB,50084的规定,2.除麻纺厂房外、一级耐火等级的多层纺织厂房和二级耐火等级的单。多层纺织厂房,其每个防火分区的最大允许建筑面积可按本表的规定增加0，5倍、但厂房内的原棉开包、清花车间与厂房内其他部位之间均应采用耐火极限不低于2 50h的防火隔墙分隔.需要开设门。窗,洞口时，应设置甲级防火门,窗,3 一、二级耐火等级的单 多层造纸生产联合厂房 其每个防火分区的最大允许建筑面积可按本表的规定增加1，5倍,一，二级耐火等级的湿式造纸联合厂房、当纸机烘缸罩内设置自动灭火系统，完成工段设置有效灭火设施保护时.其每个防火分区的最大允许建筑面积可按工艺要求确定,4，一，二级耐火等级的谷物筒仓工作塔 当每层工作人数不超过2人时.其层数不限.5 一 二级耐火等级卷烟生产联合厂房内的原料 备料及成组配方，制丝。储丝和卷接包 辅料周转.成品暂存,二氧化碳膨胀烟丝等生产用房应划分独立的防火分隔单元 当工艺条件许可时。应采用防火墙进行分隔，其中制丝，储丝和卷接包车间可划分为一个防火分区.且每个防火分区的最大允许建筑面积可按工艺要求确定.但制丝.储丝及卷接包车间之间应采用耐火极限不低于2.00h的防火隔墙和1 00h的楼板进行分隔.厂房内各水平和竖向防火分隔之间的开口应采取防止火灾蔓延的措施。6、厂房内的操作平台.检修平台。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
    scope: 厂房的层数和每个防火分区的最大允许建筑面积
    conditions:
    - 除甲类厂房外的一、二级耐火等级厂房，当其防火分区的建筑面积大于本表规定且设置防火墙确有困难时，可采用防火卷帘或防火分隔水幕分隔
    - 一、二级耐火等级湿式造纸联合厂房，当纸机烘缸罩内设置自动灭火系统、完成工段设置有效灭火设施保护时，每个防火分区最大允许建筑面积可按工艺要求确定
    - 一、二级耐火等级谷物筒仓工作塔，当每层工作人数不超过2人时，其层数不限
    - 卷烟生产联合厂房内，当工艺条件许可时，应采用防火墙分隔，制丝、储丝和卷接包车间可划分为一个防火分区且面积可按工艺要求确定
    exceptions:
    - 本规范另有规定
    - 甲类厂房（防火分区之间应采用防火墙，不得采用防火卷帘或水幕分隔）
    - 麻纺厂房（一级多层纺织厂房和二级单多层纺织厂房防火分区面积可增加0.5倍）
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: true
    mandatory_basis: 住建部公告2014年第517号（2018年第35号局部修订）强制性条文
  parameters: []
