- id: GB 50016-2014#5.4.12
  standard_code: GB 50016-2014
  chapter: 5 民用建筑
  section: ''
  clause_no: 5.4.12
  text: 燃油或燃气锅炉,油浸变压器,充有可燃油的高压电容器和多油开关等、宜设置在建筑外的专用房间内,确需贴邻民用建筑布置时、应采用防火墙与所贴邻的建筑分隔,且不应贴邻人员密集场所 该专用房间的耐火等级不应低于二级.确需布置在民用建筑内时 不应布置在人员密集场所的上一层,下一层或贴邻,并应符合下列规定.1。燃油或燃气锅炉房,变压器室应设置在首层或地下一层的靠外墙部位.但常。负，压燃油或燃气锅炉可设置在地下二层或屋顶上，设置在屋顶上的常、负。压燃气锅炉,距离通向屋面的安全出口不应小于6m、采用相对密度，与空气密度的比值，不小于0、75的可燃气体为燃料的锅炉.不得设置在地下或半地下.2.锅炉房，变压器室的疏散门均应直通室外或安全出口。3 锅炉房。变压器室等与其他部位之间应采用耐火极限不低于2 00h的防火隔墙和1.50h的不燃性楼板分隔.在隔墙和楼板上不应开设洞口。确需在隔墙上设置门.窗时。应采用甲级防火门、窗、4 锅炉房内设置储油间时 其总储存量不应大于1m3 且储油间应采用耐火极限不低于3.00h的防火隔墙与锅炉间分隔。确需在防火隔墙上设置门时。应采用甲级防火门 5，变压器室之间 变压器室与配电室之间，应设置耐火极限不低于2 00h的防火隔墙,6、油浸变压器，多油开关室、高压电容器室。应设置防止油品流散的设施、油浸变压器下面应设置能储存变压器全部油量的事故储油设施。7，应设置火灾报警装置。8，应设置与锅炉。变压器,电容器和多油开关等的容量及建筑规模相适应的灭火设施.当建筑内其他部位设置自动喷水灭火系统时。应设置自动喷水灭火系统、9、锅炉的容量应符合现行国家标准、锅炉房设计规范.GB。50041的规定.油浸变压器的总容量不应大于1260kV。A、单台容量不应大于630kV,A，10,燃气锅炉房应设置爆炸泄压设施、燃油或燃气锅炉房应设置独立的通风系统、并应符合本规范第9章的规定。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性条文效力（住建部公告2022年第189号，2023-06-01 起实施）
  applicability:
    scope: 燃油或燃气锅炉、油浸变压器、充可燃油高压电容器和多油开关等布置在民用建筑内或贴邻时
    conditions:
    - 确需贴邻民用建筑布置时，应采用防火墙与所贴邻建筑分隔且不应贴邻人员密集场所
    - 确需布置在民用建筑内时，不应布置在人员密集场所上一层、下一层或贴邻
    - 常、负压燃油或燃气锅炉可设置在地下二层或屋顶上；设置在屋顶上的常、负压燃气锅炉，距离通向屋面安全出口不应小于6m
