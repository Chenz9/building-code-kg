  text: 布置在民用建筑内的柴油发电机房应符合下列规定： 1 宜布置在首层或地下一、二层。 2 不应布置在人员密集场所的上一层、下一层或贴邻。 3 应采用耐火极限不低于2.00h的防火隔墙和1.50h的不燃性楼板与其他部位分隔，门应采用甲级防火门。 4 机房内设置储油间时，其总储存量不应大于1m³，储油间应采用耐火极限不低于3.00h的防火隔墙与发电机间分隔；确需在防火隔墙上开门时，应设置甲级防火门。 5 应设置火灾报警装置。 6 应设置与柴油发电机容量和建筑规模相适应的灭火设施，当建筑内其他部位设置自动喷水灭火系统时，机房内应设置自动喷水灭火系统。
