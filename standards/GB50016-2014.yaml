  chapter: 8 消防设施的设置
  section: ''
  clause_no: 8.2.1
  text: 下列建筑或场所应设置室内消火栓系统： 1 建筑占地面积大于300m²的厂房和仓库； 2 高层公共建筑和建筑高度大于21m的住宅建筑； 注：建筑高度不大于27m的住宅建筑，设置室内消火栓系统确有困难时，可只设置干式消防竖管和不带消火栓箱的DN65的室内消火栓。 3 体积大于5000m³的车站、码头、机场的候车（船、机）建筑、展览建筑、商店建筑、旅馆建筑、医疗建筑、老年人照料设施和图书馆建筑等单、多层建筑； 4 特等、甲等剧场，超过800个座位的其他等级的剧场和电影院等以及超过1200个座位的礼堂、体育馆等单、多层建筑； 5 建筑高度大于15m或体积大于10000m³的办公建筑、教学建筑和其他单、多层民用建筑。
  is_abolished: true
  abolished_date: '2023-06-01'
  superseded_by: GB 55037-2022
  abolition_note: 被《建筑防火通用规范》GB 55037-2022 废止强制性效力（2023-06-01，公告2022年第189号）
