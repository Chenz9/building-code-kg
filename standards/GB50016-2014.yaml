  text: 商店建筑、展览建筑采用三级耐火等级建筑时，不应超过2层；采用四级耐火等级建筑时，应为单层。营业厅、展览厅设置在三级耐火等级的建筑内时，应布置在首层或二层；设置在四级耐火等级的建筑内时，应布置在首层。营业厅、展览厅不应设置在地下三层及以下楼层。地下或半地下营业厅、展览厅不应经营、储存和展示甲、乙类火灾危险性物品。
