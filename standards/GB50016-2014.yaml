    - 体积大于5000m3的车站、码头、机场候车（船、机）建筑、展览建筑、商店建筑、旅馆建筑、医疗建筑、老年人照料设施和图书馆建筑等单、多层建筑
    - 特等、甲等剧场，超过800个座位其他等级剧场和电影院等以及超过1200个座位的礼堂、体育馆等单、多层建筑
