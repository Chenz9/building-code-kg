- id: JGJ 58-2008#5.2.1
  standard_code: JGJ 58-2008
  chapter: 5 声学设计
  section: ''
  clause_no: 5.2.1
  text: '电影院观众厅混响时间，应根据观众厅的实际容积按下列公式计算或从图5.2.1中确定：

    500Hz时的上限公式为：

    T60≤0.07653V0.287353 (5.2.1-1)

    500Hz时的下限公式为：

    T60≥0.032808V0.333333(5.2.1-2)

    式中：T60——观众厅混响时间(s)；

    V——观众厅的实际容积(m³)。

