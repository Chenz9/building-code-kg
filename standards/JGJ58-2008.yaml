- id: JGJ 58-2008#1.0.2
  standard_code: JGJ 58-2008
  chapter: 1 总则
  section: ''
  clause_no: 1.0.2
  text: 本规范适用于放映35mm的变形宽银幕、遮幅宽银幕及普通银幕三种画幅制式电影和数字影片的新建、改建、扩建电影院建筑设计。
  is_mandatory_clause: false
  is_abolished: false
  applicability:
    scope: 本规范适用于放映35mm的变形宽银幕、遮幅宽银幕及普通银幕三种画幅制式电影和数字影片的新建、改建、扩建电影院建筑设计。
    conditions: []
