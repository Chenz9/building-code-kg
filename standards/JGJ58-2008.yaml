  section: ''
  clause_no: 4.2.6
  text: '每排座位的数量应符合下列规定：

    1 短排法：两侧有纵走道且硬椅排距不小于0.80m或软椅排距不小于0.85m时，每排座位的数量不应超过22个，在此基础上排距每增加50mm，座位可增加2个；当仅一侧有纵走道时，上述座位数相应减半；

