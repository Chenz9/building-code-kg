  chapter: 4 建筑设计
  section: ''
  clause_no: 4.6.2
  text: 观众厅装修的龙骨必须与主体建筑结构连接牢固，吊顶与主体结构吊挂应有安全构造措施，顶部有空间网架或钢屋架的主体结构应设有钢结构转换层。容积较大、管线较多的观众厅吊顶内，应留有检修空间，并应根据需要，设置检修马道和便于进入吊顶的人孔和通道，且应符合有关防火及安全要求。
