- id: JGJ 58-2008#4.2.1
  standard_code: JGJ 58-2008
  chapter: 4 建筑设计
  section: ''
  clause_no: 4.2.1
  text: '观众厅应符合下列规定：

    1 观众厅的设计应与银幕的设置空间统一考虑，观众厅的长度不宜大于30m，观众厅长度与宽度的比例宜为(1.5±0.2):1；

    2 楼面均布活荷载标准值应取3kN/㎡；

    3 观众厅体形设计，应避免声聚焦、回声等声学缺陷；

    4 观众厅净高度不宜小于视点高度、银幕高度与银幕上方的黑框高度(0.5～1.0m)三者的总和；

    5 新建电影院的观众厅不宜设置楼座；

    6 乙级及以上电影院观众厅每座平均面积不宜小于1.0㎡，丙级电影院观众厅每座平均面积不宜小于0.6㎡。'
