- id: JGJ 58-2008#1.0.1
  standard_code: JGJ 58-2008
  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: 为保证电影院建筑的设计质量，使其满足适用、安全、卫生及电影工艺等方面的基本要求，制定本规范。
  is_mandatory_clause: false
  is_abolished: false
  applicability:
    scope: ''
