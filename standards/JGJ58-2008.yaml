- id: JGJ 58-2008#4.2.4
  standard_code: JGJ 58-2008
  chapter: 4 建筑设计
  section: ''
  clause_no: 4.2.4
  text: '银幕设置应符合下列规定：

    1 采用“等高法”画幅制式配置时，三种制式的银幕高度宜一致，左右宽度可根据画幅高宽比调整(图4.2.4-1)。

    2 采用“等宽法”画幅制式配置时，应符合下列规定：

    1) 宽银幕和遮幅幕的银幕宽度宜一致，上下高度可根据画幅高宽比调整(图4.2.4-2)；

    2) 普通幕和遮幅幕的高度宜一致，左右宽度可根据画幅高宽比调整(图4.2.4-2)。

    3 采用“等面积法”画幅制式配置时，应符合下列规定：

    1) 宽银幕和遮幅幕的面积宜相等，高度可根据画幅高宽比调整(图4.2.4-3)；

    2) 普通幕和遮幅幕的高度宜相等，宽度可根据画幅高宽比调整(图4.2.4-3)。

    ![图4.2.3  地面升高的无遮挡视线设计](JGJ58-2008_images/10-221125114332N1.jpg)

    图4.2.3  地面升高的无遮挡视线设计

    ![图4.2.4-1  “等高法”银幕画幅制式配置](JGJ58-2008_images/10-221125114411D8.jpg)

    图4.2.4-1  “等高法”银幕画幅制式配置

    ![图4.2.4-2  “等宽法”银幕画幅制式配置](JGJ58-2008_images/10-221125114501G4.jpg)

    图4.2.4-2  “等宽法”银幕画幅制式配置

    ![图4.2.4-3  “等面积法”银幕画幅制式配置](JGJ58-2008_images/10-221125114534556.jpg)

    图4.2.4-3  “等面积法”银幕画幅制式配置

    4 银幕画面宽度应由放映距离与放映机片门、放映镜头焦距之间的比例关系(图4.2.4-4)确定。普通银幕画面宽度和变形宽银幕画面宽度可分别按式4.2.4-1和式4.2.4-2计算。

    ![图](JGJ58-2008_images/10-221125114603c0.jpg)

    ![图](JGJ58-2008_images/10-22112511462E35.jpg)

    式中：b——片门宽度(mm)；

    Wp——普通银幕画面宽度(m)；

    Wb——变形宽银幕画面宽度(m)；

    f——镜头焦距(mm)；

    L——放映距离(m)。

    ![图4.2.4-4  银幕画面尺寸设计 ](JGJ58-2008_images/10-22112511464bN.jpg)

    图4.2.4-4  银幕画面尺寸设计

    5 银幕应设置坚固的金属银幕架、幕轨、可调节画面的幕框，可设置保护幕。

    6 宽银幕在水平方向呈弧面设计时，其曲率半径宜为放映距离L的1.5～2倍(图4.2.2-1)。银幕弧面中点至幕后的墙面距离不宜小于1.2m。当放映距离和银幕宽度的比值大于1.5且银幕宽度不超过10m时，银幕可为平面，银幕至幕后的墙面距离不宜小于1.0m。'
