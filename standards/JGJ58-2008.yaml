- id: JGJ 58-2008#4.3.2
  standard_code: JGJ 58-2008
  chapter: 4 建筑设计
  section: ''
  clause_no: 4.3.2
  text: '门厅和休息厅应符合下列规定：

    1 门厅和休息厅内交通流线及服务分区应明确，宜设置售票处、小卖部、衣物存放处、吸烟室和监控室等；

    2 电影院门厅和休息厅合计使用面积指标，特、甲级电影院不应小于0.50㎡/座；乙级电影院不应小于0.30㎡/座；丙级电影院不应小于0.10㎡/座；

    3 电影院设有分层观众厅时，各层的休息厅面积宜根据分层观众厅的数量予以适当分配；

    4 门厅或休息厅宜设有观众入场标识系统；

    5 严寒及寒冷地区的电影院，门厅宜设门斗。'
