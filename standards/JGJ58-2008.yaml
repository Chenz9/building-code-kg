  chapter: 7 建筑设备
  section: ''
  clause_no: 7.2.6
  text: '放映机房的通风和带有新风的空气调节应符合下列规定：

    1 凡观众厅设空气调节的电影院，其放映机房亦宜设空气调节；

    2 机械通风或空气调节均应保持负压，其排风换气次数不应小于15次/h；

    3 电影放映机的排风量可采用表7.2.6的数值。

