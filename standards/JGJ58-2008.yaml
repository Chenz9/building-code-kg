- id: JGJ 58-2008#4.2.3
  standard_code: JGJ 58-2008
  chapter: 4 建筑设计
  section: ''
  clause_no: 4.2.3
  text: '观众厅的地面升高应满足无遮挡视线的要求，并可按下式计算(图4.2.3)：

    ![图](JGJ58-2008_images/10-221125113I1V3.jpg)

    式中：X0——前一排观众眼睛到设计视点的水平距离(m)；

    Xn——后一排观众眼睛到设计视点的水平距离(m)；

    Y0——前一排观众眼睛到设计视点的垂直距离(m)；

    Yn——后一排观众眼睛到设计视点的垂直距离(m)；

    c——视线超高值，0.12m；

    Hn——地面升高值(m)。

    ![图4.2.2-1  观众厅工艺设计平面图](JGJ58-2008_images/10-221125113UDa.jpg)

    图4.2.2-1  观众厅工艺设计平面图

    W—银幕最大画面宽度（m）；L—放映距离（m）

