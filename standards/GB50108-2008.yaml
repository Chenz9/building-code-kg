- id: GB 50108-2008#5.1.2
  standard_code: GB 50108-2008
  chapter: 5 地下工程混凝土结构细部构造防水
  section: 5.1变形缝
  clause_no: 5.1.2
  text: 用于伸缩的变形缝宜少设，可根据不同的工程结构类别、工程地质情况采用后浇带、加强带、诱导缝等替代措施。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: should
    modal_words:
    - 宜
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 伸缩缝的设置距离一直是防水工程界关心的问题，目前就这一问题的探索和实践一直十分活跃，但尚未取得致的看法。，国外对伸缩缝间距的规定有三种情况，一是前苏联、东欧、法国等国家，规定室内和土中的伸缩缝间距约为30～40m，而英国规定处于露天条件下连续浇筑钢筋混凝土构造物最小伸缩缝间距为7m；二是美国，没有明确规定伸缩缝的间距，而只要求设计者根据结构温度应力计算和配筋，自已确定合理的伸缩缝间距；三是日本，虽有要求，如伸缩缝间距不大于30m，施工缝间距为9m，但设计人员往往按自已的经验和各公司的内部规定进行设计。国内规定伸缩缝间距为30m，但由于地下工程的规模越来越大，而在城市中建设的地下工程工期往往有一定的要求，加上多设缝以后缝的防水处理难度较大，因此工程界采取了不少措施，如设置后浇带、加强带、诱导缝等，以取消伸缩缝或延长伸缩缝的间距。后浇带是过去常用的一种措施，这种措施对减少混凝土干缩和温度变化收缩产生的裂缝起到较好的抑制作用，但由于后浇带需待一定时间后才能浇筑混凝土，故对工期要求较紧的工程应用时受到一定限制。加强带是工程界使用的一种新的方法，它是在原规定的伸缩缝间距：136·上，留出1m左右的距离，浇筑混凝土时缝间和其他地方同时浇：筑，但缝间浇筑掺有膨胀剂的补偿收缩混凝土。宝鸡、沧州、济南等地采用这种方法后，伸缩缝间距可延长至60～80m。哈尔滨在混凝土中采用掺FS101外加剂措施后，伸缩缝间距达到80～100m。诱导缝是上海地铁采用的一种方法，在原设置伸缩缝的地方作好防水处理，并在结构受力许可的条件下减少这部分（1m左右）位置上的结构配筋，有意削弱这部分结构的强度，使混凝土伸缩应力造成的裂缝尽量在这一位置上产生。采用这一措施后，其他部位混凝土裂缝明显减少，这一方法虽有一定效果，但尚不能令人满意。根据上述情况，条文作了相应规定。
    note: 合并重复提取片段
