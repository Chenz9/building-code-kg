- id: GB 50108-2008#5.2.12
  standard_code: GB 50108-2008
  chapter: 5 地下工程混凝土结构细部构造防水
  section: ''
  clause_no: 5.2.12
  text: 掺膨胀剂的补偿收缩混凝土，大多用于控制有害裂缝的钢筋混凝土结构工程，以往绝大多数设计图纸只写混凝土掺人膨胀剂、强度等级和抗渗等级，而对混凝土的限制膨胀率没有提出具体要求，造成膨胀剂少掺或误掺，起不到补偿收缩的作用，从而出现有害裂缝。施工单位或混凝土搅拌站，应根据设计要求确定膨胀剂的最佳掺量，在满足混凝土强度和抗渗要求的同时，达到补偿144:收缩混凝土的限制膨胀率。只有这样，才能达到控制结构出现裂缝的效果。
