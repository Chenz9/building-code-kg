  text: 密封材料嵌填施工时，应符合下列规定：缝内两侧基面应平整干净、干燥，并应刷涂与密封材料相容的基层处理剂；嵌缝底部应设置背衬材料：嵌填应密实连续、饱满，并应粘结牢固。
