- id: GB 50108-2008#9.3.6
  standard_code: GB 50108-2008
  chapter: 9 地下工程渗漏水治理
  section: 9.3治理材料
  clause_no: 9.3.6
  text: 密封材料宜选用硅酮、聚硫橡胶类、聚氨酯类等柔性密封材料，也可选用遇水膨胀止水条（胶）。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: should
    modal_words:
