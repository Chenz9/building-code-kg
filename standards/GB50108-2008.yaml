  converted_tables:
  - raw: 矿物掺合料品种很多，但用于配制防水混凝土的矿物掺合料主要是粉煤灰、硅粉及粒化高炉矿渣粉。掺合料的品质对防水混凝土性能影响较大，掺量必须严格控制。粉煤灰可以有效地改善混凝土的抗化学侵蚀性（如氯化物侵蚀、碱-骨料反应、硫酸盐侵蚀等）其最佳掺量一般在20%以上，但掺粉煤灰后混凝土的强度发展较慢，故掺量不宜过多，以20%～30%为宜。另外粉煤灰对水胶比非常敏感，在低水胶比（0.40～0.45)时，粉煤灰的作用才能发挥得较充分。掺入硅粉可明显提高混凝土强度及抗化学腐蚀性，但随着硅粉掺量的增加其需水量随之增加，混凝土的收缩也明显加大，当掺量大于8%时强度会降低，因此硅灰掺量不宜过高，以2%5%为宜。
