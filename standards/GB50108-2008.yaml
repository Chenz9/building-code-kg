    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables:
  - table_id: 表13
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 在地下工程结构的内表面和外表面做防水砂浆抹面防水，是我国传统的简便有效的防水方法，特别是在结构自防水或外贴卷材防水失败后，往往用这种方法补救。防水砂浆做法很多，五层抹面是最普通的方法，它不使用任何防水外加剂，仅利用不同配比的素浆和砂浆分层次交错抹压而成连续封闭的整体防水层，这种方法上世纪40年代就已应用，具有几十年的历史。随着防水技术的发展，普通防水抹面已被掺有各种外加剂、防水剂和聚合物乳液的砂浆所代替，且技术性能有很大进步，施工程序也有所简化。在国外，防水砂浆的使用也很普遍，表13列举日本防水砂浆在各种工程上的应用情况，从表中可以看到，砂浆防水在日本地下防水中无论新建工程还是旧有工程渗漏水补修中的使用比例都很大，且有逐年上升的趋势。.168·表13日本防水砂浆使用情况地下防水屋面防水外墙防水室内防水年度新工程旧工程新工程旧工程新工程旧工程新工程旧工程17.5%1%19.5%19.6%24.4%9.2%9.5%3.6%25.2%23%16.1%0.6%7.8%5.1%30.4%20.3%用于防水砂浆的外加剂品种主要有萘磺酸盐、三聚氰胺磺酸盐、松香皂、氯化物金属盐、无机铝盐、有机硅和FS102渗透结晶型等。聚合物乳液的种类有很多种，但国内常用的主要是聚醋酸乙烯乳液、苯丙乳液、丙烯酸酯共聚乳液、环氧树脂及氯丁胶乳液等。
