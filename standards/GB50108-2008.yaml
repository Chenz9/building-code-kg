clauses:
- id: GB 50108-2008#3.2.1
  standard_code: GB 50108-2008
  chapter: 3 地下工程防水设计
  section: ''
  clause_no: 3.2.1
  text: 、3.2.2、4.1.22、4.1.26(1、2)、5.1.3条（款）为强制性条文，必须严格执行。原《地下工程防水技术规范》GB50108-2001同时废止。本规范由我部标准定额研究所组织中国计划出版社出版发行。中华人民共和国住房和城乡建设部二〇〇八年十一月二十七日前言本规范是根据建设部“关于印发《2005年工程建设标准规范制定、修订计划（第一批）》的通知”建标函【2005】84号的要求，由总参工程兵科研三所会同有关单位，对国家标准《地下工程防水技术规范》GB50108一2001进行修订的基础上编制完成的。本规范共分10章，主要内容包括：总则；术语；地下工程防水设计；地下工程混凝土结构主体防水；地下工程混凝土结构细部构造防水；地下工程排水；注浆防水；特殊施工法的结构防水；地下工程渗漏水治理；其他规定。本次修编的主要内容是：提高了防水等级为二级的地下工程防水标准；增加新的防水材料和防水施工技术；与国内外相关规范协调与接轨；重视结构耐久性和环境保护；淘汰落后的防水材料，对不适应国家发展要求的条文进行修改。本规范中以黑体字标志的条文为强制性条文，必须严格执行。本规范由住房和城乡建设部负责管理和对强制性条文的解释，由国家人民防空办公室负责日常管理，由总参工程兵科研三所负责具体技术内容的解释。本规范在执行过程中，请各单位结合工程实践，认真总结经验，注意积累资料，随时将意见和建议反馈给总参工程兵科研三所（地址：河南洛阳，总参工程兵科研三所，邮政编码：471023），以供今后修订时参考。本规范主编单位、参编单位和主要起草人：主编单位：总参工程兵科研三所参编单位：山西建筑工程（集团）总公司中冶集团建筑研究总院上海市隧道工程轨道交通设计研究院中铁工程设计咨询集团有限公司中国建筑科学研究院中铁隧道集团有限公司科研所深圳大学建筑设计研究院中国建筑业协会建筑防水分会北京城建设计研究总院有限责任公司中国建筑防水材料工业协会主要起草人：冀文政朱忠厚张玉玲朱祖熹姚源道李承刚李治国蔡庆华雷志梁张道真曲慧郭德友卓越哈成德沈秀芳潘水艳·地下工程防水设计(5）3.1一般规定(5）3.2防水等级3.3防水设防要求地下工程混凝土结构主体防水(10)4.1防水混凝土(10)4.2水泥砂浆防水层(17)4.3卷材防水层(19)4.4涂料防水层(27)4.5塑料防水板防水层(31)4.6金属防水层(34）4.7膨润土防水材料防水层(35)4.8地下工程种植顶板防水(38)地下工程混凝土结构细部构造防水（41)5.1变形缝（41)5.2后浇带(46)5.3穿墙管(盒)(49)5.4埋设件(51)5.5预留通道接头(52)5.6桩头(53)5.7孔口(55)5.8坑、池(56)地下工程排水(57)6.1一般规定(57)6.2设计(57)6.3(62)材料6.4(63)注浆防水(64)7.1一般规定(64)7.2设计(65)7.3材料(65)7.4施工(66)特殊施工法的结构防水(68)8.1盾构法隧道(68)8.2(72)沉井8.3地下连续墙(73)8.4逆筑结构(75)8.5锚喷支护(76)地下工程渗漏水治理(78)9.1一般规定(78)9.2方案设计(78)9.3治理材料(79)9.4施工(80)其他规定(81)
