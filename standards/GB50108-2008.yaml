    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 铺设基面要求比较平整，是为了保证防水板的铺设和焊接质量。不平整的处理方法是，当喷射混凝土厚度达到设计要求时，可在低凹处涂抹水泥砂浆；如喷射混凝土厚度小于设计厚度时，必须用喷射混凝土找平。防水板系在初期支护如喷射混凝土、地下连续墙上铺设，要求初期支护基层表面十分平整则费时费力，故条文中只提宜平整，并根据工程实践的经验提出平整度的定量指标，以便于铺设防水板。但基层表面上伸出的钢筋头、铁丝等坚硬物体必须予以清除，以免损伤防水板。
