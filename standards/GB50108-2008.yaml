- id: GB 50108-2008#6.2.12
  standard_code: GB 50108-2008
  chapter: 6 地下工程排水
  section: ''
  clause_no: 6.2.12
  text: 贴壁式衬砌在隧道、坑道应用较多，由于多数有自流排水条件，因此在做好衬砌本体防水的同时，也要充分利用自流排水条件，形成完整的防排水系统。贴壁式衬砌的排水系统分为两部分：一部分是将围岩的渗漏水从拱顶、侧墙引至基底即本条介绍的盲沟、盲管（导水管）、暗沟等几种方法；一部分是将水引至工程的基底排水系统。盲沟所用的材料来源广泛，造价低，但施工较麻烦，特别是拱顶部分。而拱·149·顶部分采用钻孔引流措施时，由于拱部钻孔较困难，还需先设钻孔室，投资较大，所以只作为一种措施以供选择。
