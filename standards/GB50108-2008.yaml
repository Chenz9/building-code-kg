  - raw: 规定试配防水混凝土的抗渗压力应比设计要求高0.2MPa，是因为混凝土抗渗压力是试验室得出的数值，而施工现场条件比试验室差，其影响混凝土抗渗性能的因素有些难以控制，因此抗渗等级应提高一个等级（0.2MPa）。本条修编时在抗渗等级前面增加了“试配混凝土的”几个字，目的是明确抗渗等级提高一级是对试配混凝土的抗渗性试验而言的。
