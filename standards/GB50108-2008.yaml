  parameters: []
  tables: []
  converted_tables:
  - raw: 防水施工是技术性强、标准要求较高的防水材料再加工过程，应由有资质等级证书的防水专业施工队伍来承担，操作人员必须经过专业培训，考核合格，并取得建设行政管理部门所发的上岗证方可进行施工。虽然我国的建筑防水从业人员迅猛发展，各类防水专业施工队伍形成了一定规模，但在市场经济发展过程中存在着施工队伍良募不齐的问题，不少从业人员中，真正了解建筑防水工程的构造、材料特点、使用方法以及具备施工操作技能的人员很少，并且民工队伍较多，很难确保堵漏工程的质量，有的工程经过几个施工队伍处理后还存在渗水的现象。为保证国家财产不受重大损失和确保堵漏工程的质量，防水工作应由专业设计人员和具有防水资质的专业队伍来完成。.165·9.2方案设计
