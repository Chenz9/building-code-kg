  clause_no: 8.3.3
  text: 地下连续墙与内衬构成的复合式衬砌.应符合下列规定、1,应用作防水等级为一、二级的工程、2，应根据基坑基础形式.支撑方式内衬构造特点选择防水层。3.墙体施工应符合本规范第8.3.2条第3.10款的规定。并应按设计规定对墙面，墙缝渗漏水进行处理.并应在基面找平满足设计要求后施工防水层及浇筑内衬混凝土、4、内衬墙应采用防水混凝土浇筑。施工缝.变形缝和诱导缝的防水措施应按本规范并应与地下连续墙墙缝互相错开,施工要求应符合本规范第4,1和5 1节的有关规定.。
