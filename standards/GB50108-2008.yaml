    content: 本条说明如下：1排水坡度(结构找坡)可以减少构造层次，是提高防水可靠.131.程度的有力措施之一。实际上，很难找到理想的找坡材料（既坚实、耐久，又轻而不裂）。特别是随着小锅炉的日渐淘汰，传统的找坡材料（炉渣混凝土）已渐被陶粒混凝土取代，但陶粒混凝土贵，工艺要求严，做不好易开裂；加气混凝土、水泥有同样的问题。至于水泥膨胀珍珠岩、水泥膨胀蛭石，更因其强度低、含水率高，尤其不适用于种植屋面。如用水泥砂浆、细石混凝土找坡，是明显不合理的做法，落后、浪费、易裂，荷重大增。结构找坡，为防水层直接提供了坚实的基础，也消除了防水失败后形成的永久蓄水层。2标准叙述应为裂缝控制等级为三级，Wmax<0.2mm”。裂缝表述为裂缝宽度不应大于0.2mm。3种植顶板结构荷载包括活荷载、构造荷载和植物荷载等，不同的行业设计要求不同，设计时应按实际设计进行计算。《种植屋面工程防水技术规程》JGJ155中叙述了种植植物与荷载的关系，列于表6，供设计时参考选用。表6初栽植物荷重及种植荷载参考值植物类型小乔木（带土球）大灌木小灌木地被或草坪植物高度（m）或面积2.0~2.51.5~2.01.0~1.51.0(m²)80~120植物重量（kg/株）60~8030 ~605~30(kg/m²)种植荷载（kg/m²）250~300150~250100～15050~100表6中选择植物应考虑植物生长产生的活荷载变化，一般情况下，树高增加2倍，其重量增加8倍，需10年时间；种植荷载包括种植区构造层自然状态下的整体荷载。
  converted_tables: []
  references:
