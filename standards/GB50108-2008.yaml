  parameters: []
  tables: []
  converted_tables:
  - raw: 在地下工程中，围岩与衬砌之间存在有一定的间隙，这种间隙有大有小。为防止围岩漏水危及衬砌结构，往往根据工程的需要进行注浆处理。注浆时为节省材料，一般是注入水泥浆液，掺有膨润土、粉煤灰等掺合料的水泥浆，水泥砂浆等粗颗粒材料。
