  section: 8.4逆筑结构
  clause_no: 8.4.2
  text: 采用地下连续墙和防水混凝土内衬的复合式逆筑结构，应符合下列规定：可用于防水等级为一、二级的工程。地下连续墙的施工应符合本规范第8.3.2条第3～8、10款的规定。3顶板、楼板及下部500mm的墙体应同时浇筑，墙体的下部应做成斜坡形；斜坡形下部应预留300～500mm空间，并应待下部先浇混凝土施工14d后再行浇筑；浇筑前所有缝面应凿毛、清理干净，并应设置遇水膨胀止水条（胶）和预埋注浆管。上部施工缝设置遇水膨胀止水条时，应使用胶粘剂和射钉（或水泥钉）固定牢靠。浇筑混凝土应采用补偿收缩混凝土（图8.4.2）。4底板应连续浇筑，不宜留设施工缝，底板与桩头相交处的防水处理应符合本规范第5.6节的有关规定。图8.4.2逆筑法施工接缝防水构造1-地下连续墙；2一楼板；3—顶板4一补偿收缩混凝土；5一应凿去的混凝土；6一遇水膨胀止水条或预埋注浆管；7-遇水膨胀止水胶；8一粘结剂
