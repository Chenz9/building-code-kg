  - raw: 预注浆的段长，不仅要考虑工程地质和水文地质条件（主要是把相同孔隙率或裂隙宽度的地层放在同一注浆段内，以便浆液均匀扩散），而且要考虑工作实际和钻孔时间，充分发挥钻机效率，缩短工程建设工期。随着液压凿岩台车的引进，凿岩能力加大，因此，注浆段长以10～50m为宜。由于开挖后要留2～3m止浆岩墙，注浆段越长，开挖也越长，工期越短；但钻孔越深，钻孔速度越低，进度越慢。因此，合理选择段长是加快注浆工期的关键。
