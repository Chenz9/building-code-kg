- id: GB 50108-2008#4.1.10
  standard_code: GB 50108-2008
  chapter: 4 地下工程混凝土结构主体防水
  section: 4.1防水混凝土
  clause_no: 4.1.10
  text: 用于防水混凝土的砂、石，应符合下列规定：宜选用坚固耐久、粒形良好的洁净石子；最大粒径不宜大于40mm，泵送时其最大粒径不应大于输送管径的1/4；吸水率不应大于1.5%；不得使用碱活性骨料；石子的质量要求应符合国家. 11 .现行标准《普通混凝土用碎石或卵石质量标准及检验方法》JGJ53的有关规定；2砂宜选用坚硬、抗风化性强、洁净的中粗砂，不宜使用海砂；砂的质量要求应符合国家现行标准《普通混凝土用砂质量标准及检验方法》JGJ52的有关规定。
  is_abolished: false
