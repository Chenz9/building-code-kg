  - table_id: 表8.1.2
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 根据多年来的工程实践，对原规范“不同等级的盾构隧道衬砌防水设防措施表”进行了修改。修改内容如下：1修改了外防水涂料的使用范围。外防水涂料的品种，包括了水泥基渗透结晶型、硅氧烷类渗透型材料与环氧类封闭型材料。不仅有防腐蚀作用，也能起到防渗作用，在工程实践中都有使用，故均列入。在一级防水等级中，从加强耐久性着眼，即使非侵蚀地层也“宜选”,对混凝土有中等以上腐蚀的地层则“应选”。在二、三级防水等级中，因并非隧道经过的全部地段都有侵蚀性介质，并且各地段埋深差异也可能很大，因而要求也不尽相同，故用“对混凝土有中等以上腐蚀的地层宜选”。2对防水等级二、三级的隧道工程，明确不要求采用全隧道嵌缝措施。局部区段也只是“宜”嵌缝。总之，反映了国内外盾构隧道弱化嵌缝防水的趋势。3取消了混凝土内衬的使用范围。盾构隧道设计与施工内衬的做法，总体上在不断减少。盾构隧道如果施作内衬，则主要根.156..据使用功能的需要，设计全内衬砌或局部内衬，如输水隧道为了减少输水壁面阻力、大型公路隧道为路面以下空间的利用，盾构隧道为加强防水能力；包括防止地下水渗入或输水盾构隧道内水的流失而施作内衬的。正因为如此，按防水等级来确定是否选择内衬就欠科学，故表8.1.2中删去了这一项。：
