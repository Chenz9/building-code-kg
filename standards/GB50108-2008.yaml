  converted_tables:
  - raw: 与原规范相比，本条增加了渗排水方法的适用范围。对地下水较丰富、土层属于透水性砂质土的地基，应设置渗排水层；对常年地下水位低于建筑物底板，只有丰水期内水位较高、土层为弱透水性的地基，可考虑盲沟排水。本条介绍了渗排水层的构造、施工程序及要求。设计渗排水:148层时，应合理选择排水材料。渗排水法是将排水层渗出的水，通过集水管流人集水井内，然后采用专用水泵机械排水。集水管可采用无砂混凝土集水管或软塑盲管，可根据工程的排水量大小、造价等因素进行选用。
