- id: GB 50108-2008#8.1.1
  standard_code: GB 50108-2008
  chapter: 8 特殊施工法的结构防水
  section: ''
  clause_no: 8.1.1
  text: 盾构法施工的隧道，宜采用钢筋混凝土管片、复合管片等装配式衬砌或现浇混凝土衬砌。衬砌管片应采用防水混凝土制作。当隧道处于侵蚀性介质的地层时，应采取相应的耐侵蚀混凝土或外涂耐侵蚀的外防水涂层的措施。当处于严重腐蚀地层时，可同时采取耐侵蚀混凝土和外涂耐侵蚀的外防水涂层措施。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 盾构隧道开挖掘进中用现浇混凝土成为隧道衬砌的方式虽然还存在，但国内工程中极少使用，绝大部分都采用预制衬砌。故规范取消了这方面的提法。随着对混凝土结构耐久性的重视，管片混凝土采用耐侵蚀混凝土的技术已很成熟，因此，当隧道处于侵蚀性介质的地层时，首先应考虑耐侵蚀混凝土措施；也可采用外防水涂层来抵御侵蚀性离子侵入的措施。对于严重腐蚀地层，两项耐侵蚀措施一起采用更为可靠。
