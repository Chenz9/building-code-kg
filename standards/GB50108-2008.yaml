- id: GB 50108-2008#9.2.4
  standard_code: GB 50108-2008
  chapter: 9 地下工程渗漏水治理
  section: 9.2方案设计
  clause_no: 9.2.4
  text: 渗漏水较大的裂缝，宜采用钻斜孔法或凿缝法注浆处理，干燥或潮湿的裂缝宜采用骑缝注浆法处理。注浆压力及浆液凝结时间应按裂缝宽度、深度进行调整。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 裂缝渗漏水一般根据漏水量和水压力来采取堵漏措施。对于水压较小和渗水量不大的裂缝或空洞，可将裂缝按设计要求剔成较小深度和宽度的“V”形槽，槽内用速凝材料填压密实。对于水压和渗水量都较大的裂缝常采用注浆方法处理。注浆材料有环氧树脂、聚氨酯等，也可采用超细水泥浆液。裂缝渗漏水处理完毕后，表面用掺外加剂防水砂浆、聚合物防水砂浆或涂料等防水材料加强防水。越来越多，效果也比较明显，因此增加了这方面的内容。
    note: 合并重复提取片段
