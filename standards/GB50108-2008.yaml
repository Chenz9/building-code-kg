  standard_code: GB 50108-2008
  chapter: 7 注浆防水
  section: 7.1一般规定
  clause_no: 7.1.1
  text: 注浆方案应根据工程地质及水文地质条件制定，并应符合下列要求：1工程开挖前，预计涌水量大的地段、断层破碎带和软弱地层，应采用预注浆；2开挖后有大股涌水或大面积渗漏水时，应采用衬砌前围岩衬砌后渗漏水严重的地段或充填壁后的空隙地段，应进行回填注浆；衬砌后或回填注浆后仍有渗漏水时，宜采用衬砌内注浆或衬砌后围岩注浆。
