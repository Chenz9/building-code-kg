- id: GB 50108-2008#1.0.3
  standard_code: GB 50108-2008
  chapter: 1 总则
  section: ''
  clause_no: 1.0.3
  text: 地下工程防水的设计和施工应遵循“防、排、截、堵相结合，刚柔相济，因地制宜，综合治理”的原则。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 防水原则既要考虑如何适应地下工程种类的多样性问题，也要考虑如何适应地下工程所处地域的复杂性的问题，同时还要使每个工程的防水设计者在符合总的原则的基础上可根据各自工程的特点有适当选择的自由。原规范提出的防水原则基本符合上述要求，从修编过程中征求的意见来看，使用单位对这一原则也是基本满意的。规范从材性角度要求在地下工程防水中刚性防水材料和柔性防水材料结合使用。实际上目前地下工程不仅大量使用刚性防水材料，如结构主体采用防水混凝土，也大量使用柔性防水材料，如细部构造处的一些部位、主体结构加强防水层也采取柔性防水材料。因此地下工程防水方案设计时要结合工程使用情况和地质环境条件等因素综合考虑。
    note: 合并重复提取片段
  references: []
