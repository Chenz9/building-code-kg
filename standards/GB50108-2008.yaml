- id: GB 50108-2008#1.0.1
  standard_code: GB 50108-2008
  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: ，为使地下工程防水的设计和施工符合确保质量、技术先进、经济合理、安全适用的要求，制定本规范。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: null
    modal_words: []
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 地下工程由于深埋在地下，时刻受地下水的渗透作用，如防水问题处理不好，致使地下水渗漏到工程内部，将会带来一系列问题：影响人员在工程内正常的工作和生活；使工程内部装修和设备加快锈蚀。使用机械排除工程内部渗漏水，需要耗费大量能源和经费，而且大量的排水还可能引起地面和地面建筑物不均匀沉降和破坏等。另外，据有关资料记载，美国有20%左右的地下室存在氮污染，而氢是通过地下水渗漏渗入到工程内部聚积在内表面的。我国地下工程内部氢污染的情况如何，尚未见到相关报道，但如地下工程存在渗漏水则会使氯污染的可能性增加。为适应我国地下工程建设的需要，使新建、续建、改建的地下工程能合理正常地使用，充分发挥其经济效益、社会效益、战备效益，因此对地下工程的防水设计、施工内容做出相应规定是极为必要的。在防水设计和施工中，要贯彻质量第一的思想，把确保质量放在首位。
    note: 合并重复提取片段
  references: []
