  - raw: 膨润土防水材料分段铺设完毕后，由于绑扎钢筋等后续工程施工需要一定的时间，膨润土材料长时间暴露，会影响防水效果，因此应在膨润土防水材料表面覆盖塑料薄膜等挡水材料，避免下雨或施工用水导致膨润土材料提前膨胀。雨水直接淋在膨润土防水材料表面时导致膨润土颗粒提前膨胀，并在雨水的冲刷过程中出现流失的现象，在地下工程中经常发生，严重降低了膨润土防水材料的防水性能。特别是在雨季施工时，应采取临时遮挡措施对膨润土防水材料进行有效的保护。
