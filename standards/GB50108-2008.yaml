  conflicts: []
- id: GB 50108-2008#9.3.3
  standard_code: GB 50108-2008
  chapter: 9 地下工程渗漏水治理
  section: 9.3治理材料
  clause_no: 9.3.3
  text: 防水抹面材料宜选用掺各种外加剂.防水剂 聚合物乳液的水泥砂浆。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
