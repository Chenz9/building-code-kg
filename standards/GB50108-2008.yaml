  - raw: 注浆分类方法很多，按施工顺序可分为预注浆和后注浆；按注浆目的可分为加固注浆和堵水注浆；按浆液扩散形态可分为渗透注浆和劈裂注浆等等。高压喷射注浆属于结构加固的内容，和防水无太大关系，所以修改时将此删除。本条所列条款可单独进行，也可按工程情况采用几种注浆方法，确保工程达到要求的防水等级。
