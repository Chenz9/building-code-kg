    max_value: 30.0
  tables: []
  converted_tables:
  - raw: 沉降缝和伸缩缝统称变形缝，由于两者防水做法有很多相同之处，故一般不细加区分。但实际上两者是有一定区别的，沉降缝主要用在上部建筑变化明显的部位及地基差异较大的部位，而伸缩缝是为了解决因干缩变形和温度变化所引起的变形以避免产生裂缝而设置的，因此修编时针对这点对两种缝作了相应的规定。沉降缝的渗漏水比较多，除了选材、施工等诸多因素外，沉降量过大也是一个重要原因。目前常用的止水带中，带钢边的橡胶止水带虽大大增加了与混凝土的粘结力，但如沉降量过大，也会造成钢边止水带与混凝土脱开，使工程渗漏。根据现有材料适应变形能力的情况，本条规定了沉降缝最大允许沉降差值。
