  converted_tables:
  - raw: 地下工程应用的防水涂料既有有机类涂料，也有无机类涂料。有机类涂料主要为高分子合成橡胶及合成树脂乳液类涂料。无机类涂料主要是水泥类无机活性涂料，水泥基防水涂料中可掺入外加剂、防水剂、掺合料等，水泥基渗透结晶型防水涂料是一种以水泥、石英砂等为基材，掺人各种活性化学物质配制的一种新型刚性防水材料。它既可作为防水剂直接加人混凝土中，也可作为防水涂层涂刷在混凝土基面上。该材料借助其中的载体不断向混凝土内部渗透，并与混凝土中某种组分形成不溶于水的结晶体充填毛细孔道大大提高混凝土的密实性和防水性，在地下工程防水.120:中应用日益增多。聚合物水泥防水涂料，是以有机高分子聚合物为主要基料，加人少量无机活性粉料，具有比一般有机涂料干燥快、弹性模量低、体积收缩小、抗渗性好的优点。
