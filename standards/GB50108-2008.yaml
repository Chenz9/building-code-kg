  text: 明挖法地下工程的混凝土和防水层的保护层验收合格后，应及时回填，并应符合下列规定：基坑内杂物应清理干净、无积水。2.工程周围800mm以内宜采用灰土、粘土或亚粘土回填，其中不得含有石块、碎砖、灰渣、有机杂物以及冻土。3回填施工应均匀对称进行，并应分层夯实。人工夯实每层厚度不应大于250mm，机械夯实每层厚度不应大于300mm，并应采取保护措施；工程顶部回填土厚度超过500mm时，可采用机械回填碾压。
