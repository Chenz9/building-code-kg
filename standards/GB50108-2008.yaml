  converted_tables:
  - raw: 管片防水混凝土抗渗等级应符合规范第4.1.4条的规定，：且不得小于P8的理由是：1目前盾构法隧道管片防水混凝土≥C30时，混凝土试块的抗渗等级都大于P8，通常达到P10。2国内施工的盾构隧道管片混凝土试块抗渗等级均大于P8。3根据国内外地下工程对密封材料的抗水压要求，有不少是按抗实际水压力的3倍进行设计，显然管片抗渗等级至少应与接缝抗水压能力相当。本条增加了对管片进行C1-扩散系数或渗透系数检测的规定，这是因为对管片进行C1-扩散系数或渗透系数检测是判断其耐久性的主要手段，尤其是对处于侵蚀性地层的隧道衬砌而言。鉴于国内对有关检测的设备、方法（如检测C1-扩散系数的自然扩散法、RCM法、NEL法以及电量法等等）要求不，检测标准尚无正式规定，因而条文中也不做具体规定（包括定量要求）。
