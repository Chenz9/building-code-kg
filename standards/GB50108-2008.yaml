  - raw: 后浇带采用补偿收缩混凝土，可以避免出现新的收缩裂缝造成工程渗漏水的隐患，如果后浇带施工留设施工缝，就会大大降低后浇带的抗渗性，因此强调后浇带混凝土应一次浇筑。混凝土养护时间对混凝土的抗渗性尤为重要，混凝土早期脱水或养护过程中缺少必要的水分和温度，则抗渗性将大幅度降低甚至完全消失，其影响远较强度敏感。因此，当混凝土进入终凝以后即应开始浇水养护，使混凝土外露表面始终保持湿润状态。后：浇带混凝土必须充分湿润地养护6周，以避免后浇带混凝土的收缩，使混凝土接缝更严密。
