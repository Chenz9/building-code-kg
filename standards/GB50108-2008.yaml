  - raw: 注浆结束前，为了检验注浆效果，防止开挖时发生塌涌水事故，必须进行注浆效果检查。通常是在分析资料的基础上采取钻孔取芯法进行检查。有条件时，还可采用物探进行检查。分析资料时要结合注浆设计、注浆记录、注浆结束标准，分析各注浆孔的注浆效果，看哪些达到了标准，哪些是薄弱环节，有无漏注或未达到结束标准的孔，原因何在，如何补救等。钻孔取芯法是按设计要求在注浆薄弱地方，钻检查孔，检查浆液扩散、固结情况，并进行压水（抽）水试验，检查地层的吸水率（透水率），计算渗透系数及开挖时的出水量。:155:特殊施工法的结构防水8.1盾构法隧道
