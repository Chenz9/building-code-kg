- id: GB 50108-2008#9.2.2
  standard_code: GB 50108-2008
  chapter: 9 地下工程渗漏水治理
  section: 9.2方案设计
  clause_no: 9.2.2
  text: 大面积严重渗漏水可采取下列措施：1衬砌后和衬砌内注浆止水或引水，待基面无明水或干燥后，用掺外加剂防水砂浆、聚合物水泥砂浆、挂网水泥砂浆或防水涂料等加强处理；2引水孔最后封闭；必要时采用贴壁混凝土衬砌。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
