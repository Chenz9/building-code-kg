  clause_no: 4.1.8
  text: 用于防水混凝土的水泥应符合下列规定：1水泥品种宜采用硅酸盐水泥、普通硅酸盐水泥，采用其他品种水泥时应经试验确定；2在受侵蚀性介质作用时，应按介质的性质选用相应的水泥品种；不得使用过期或受潮结块的水泥，并不得将不同品种或强度等级的水泥混合使用。
