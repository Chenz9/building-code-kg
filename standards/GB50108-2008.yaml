  - table_id: 表8.1.5
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 密封垫是衬砌防水的首要防线，应对其技术性能指标做出规定。由于自前密封垫的材质以氯丁橡胶、三元乙丙橡胶为主，这里将弹性密封垫分为氯丁橡胶与三元乙丙橡胶。遇水膨胀橡胶应用较多，技术也较为成熟，所以通过表8.1.5-1、8.1.5-2将这三种（包括以它们为主、适量加人其他橡胶为辅的混合胶）材料的部分性能作为检验项目。所列性能指标中的防霉、热老化等性能检测·157:较繁杂，可列人形式检验项目。遇水膨胀橡胶的技术性能指标及测试方法，这里按国家规定列出。溶出物量是一项反映耐久性的重要指标，它受试件断面、浸泡时间、浸泡量、试件是否受约束等影响，故此指标可作试验时比较，未作正式指标列入。按规定，密封垫应直接从成品切片制成试样测试，由于遇水膨胀橡胶密封垫的断面尺寸一般较小，难以由成品切片检测，故宜从胶料制取试样。表中数据的制定参考了现行国家标准《高分子防水材料第3部分遇水膨胀橡胶》GB/T18173.3。
