  - raw: 鉴于目前嵌缝槽的形式已趋于集中，可以归结成图8.1.8所示的几类，并对槽的深、宽尺寸及其关系加以定量的规定。与地面建筑、道路工程变形缝嵌缝槽不同，因隧道衬砌嵌缝材158·料在背水面防水，故嵌缝槽槽深应大于槽宽，又由于盾构隧道衬砌承受水压较大，相对变形较小，因而嵌缝材料应是：1中、高弹性模量类的防水密封材料，如聚硫、聚氨酯、改性环氧类材料，也可以是有限制膨胀措施下的遇水膨胀类腻子或密封材料等未定型类材料。2特殊外形的预制密封件为主，辅以柔性密封材料或扩张型材料构成复合密封件。根据我国常用的定型与不定型两类材料特性以及施工的要求，参考德国STUVA、美国盾构隧道接缝密封膏应用指南及日本有关实践，提出的嵌缝槽深宽比为>2.5。3之所以作出本条第3款的规定，是因为一方面底部嵌缝对避免隧道，尤其是铁路隧道沉降是有一定功效的；整环嵌缝对水工隧道减少流动阻力是有利的；顶部嵌缝对防止渗漏影响公路隧道、地铁隧道的运营安全与防腐蚀是需要的；另一方面，随着盾构隧道防水技术的发展和隧道渗漏水量的减少，嵌缝在根本上不能防水、止水，只是起到蔬引作用，故目前国内外越来越少进行管片整体嵌·缝。目前的嵌缝更多的是起的堵水与引排水的功效。
