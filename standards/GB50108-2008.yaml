  text: 管片接缝密封垫应被完全压人密封垫沟槽内，密封垫沟槽的截面积应大于或等于密封垫的截面积，其关系宜符合下式：A=(1～1.15)A。(8.1. 6)式中A-—密封垫沟槽截面积；A。——密封垫截面积。管片接缝密封垫应满足在计算的接缝最大张开量和估算的错位量下、埋深水头的2～3倍水压下不渗漏的技术要求；重要工程中选用的接缝密封垫，应进行一字缝或十字缝水密性的试验检测。
