- id: GB 50108-2008#4.1.22
  standard_code: GB 50108-2008
  chapter: 4 地下工程混凝土结构主体防水
  section: ''
  clause_no: 4.1.22
  text: 针对施工中遇到落度不满足施工要求时有随意加水的现象，本条做了严禁直接加水的规定。因随意加水将改变原有规定的水灰比，而水灰比的增大将不仅影响混凝土的强度，而且对混凝土的抗渗性影响极大，将会造成渗漏水的隐患。
