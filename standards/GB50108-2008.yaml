  parameters: []
  tables: []
  converted_tables:
  - raw: 地下工程进行冬期施工时，必须采取一定的技术措施。因为混凝土温度在4℃时，强度增长速度仅为15℃时的1/2。当混凝土温度降到一4℃时，水泥水化作用停止，混凝土强度也停止增长。水冻结后，体积膨胀8%～9%，使混凝土内部产生很大的冻胀应力。如果此时混凝土的强度较低，就会被冻裂，使混凝土内部结构破坏，造成强度、抗渗性显著下降。冬期施工措施，既要便于施工、成本低，又要保证混凝土质量，具体应根据施工现场条件选择。化学外加剂主要是防冻剂。在混凝土拌合物拌合用水中加入防冻剂能降低水溶液的冰点，保证混凝土在低温或负温下硬化。如掺亚硝酸钠-三乙醇胺防冻剂的防水混凝土，可在外界温度不低于一10℃的条件下硬化。但由于防冻剂的掺人会使溶液的导电能力倍增，故此不得在高压电源和大型直流电源的工程中应用。在施工时，还要适当延长混凝土的搅拌时间，混凝土人模温度应为正温，振捣要密实，并要注意早期养护。暖棚法是采取暖棚加温，使混凝土在正温下硬化，当建筑物体积不大或混凝土工程量集中的工程，宜采用此法。暖棚法施工时，.112.暖棚内可以采用蒸汽管片或低压电阻片加热，使暖棚保持在5℃以上，混凝土人模温度也应为正温。在室外平均气温为一15℃以：下的结构，应优先采用蓄热法。采用蓄热法需经热工计算，根据每立方米混凝土从浇筑完毕的温度降到0℃的过程中，透过模板及覆盖的保温材料所放出的热量与混凝土所含的热量及水泥在此期间所放出的水化热之和相平衡，与此同时混凝土的强度也正好达到临界强度。当利用水泥水化热不能满足热量平衡时，可采用原材料加热法（分别加热水、砂、石)或增加保温材料的热阻。蒸汽加热法和电加热法，由于易使混凝土局部热量集中，故不宜在防水混凝土冬期施工中使用。4.2水泥砂浆防水层I一般规定
