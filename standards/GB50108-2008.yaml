    type: parameter_table
    note: 条件→参数查表（OCR合并正文，行列结构缺失）
    content: 表3中的数据是在下列试验条件下获得的，供设计施工单位参考。①水泥品种：矿渣水泥；②水泥强度等级：42.5MPa；③水泥用量：275kg/m；④模板：钢模板；③养护条件：两层草包保温养护。当使用其他品种水泥，强度等级、模板、水泥用量有变化时，应将表3中的数值乘以修正系数：(1)Tmax=T·ki·k2·k3·k4各修正系数的值见表4。表3混凝土结构物水化热温升值（T)夏季（气温32~38℃）冬季(气温-5～3℃)壁厚温升温升壁厚人模温度最高温度(u)T(℃)人模温度最高温度(u)T(℃)(℃)(℃)(℃)(℃)0.515~2030～3536~410.510～~151.030～3540～451.010～1519~242.030～3550～552.010~1528～333.030～3560～653.010~1537～424.030～3570～754.010~1546～51表4修正系数水泥强度等级水泥品种水泥用量模板修正系数k1修正系数k2修正系数ks修正系数k41.0kaw/275钢模板32.5MPa1.001.00矿渣水泥木模板1.4w为实际水泥用量42.5MPa1.13普通硅酸盐水泥1.20(kg/m3)其他保温模板1.4表4中如遇有中间状态可用插人法确定。现举例说明表3、表4两表的具体用法。某工程混凝土厚度2m，采用强度等级为42.5MPa的普通硅酸盐525号水泥，水泥用量360kg/m²，木模板，夏季施工，试计算最高温升。.110.Tmax=T·ki·k2·k3·k4=20×1.13×1.2×360/275X1.4=49.7℃夏季人模温度为32.5℃，则混凝土的最高温度可达49.7℃十32.5℃=82.2℃。而有一类似工程的实测温度记录为80℃，故以上两表直接用于相似的工程中，是比较切合实际的。根据各地大体积混凝土施工的经验，增补了大体积混凝土施工时防止裂缝产生的有关技术措施。大体积混凝土施工时，一是要尽量减少水泥水化热，推迟放热高峰出现的时间，如采用60d龄期的混凝土强度作为设计强度（此点必须征得设计单位的同意），以降低水泥用量；掺粉煤灰可替代部分水泥，既可降低水泥用量，且由于粉煤灰的水化反应较慢，可推迟放热高峰的出现时间；掺外加剂也可减少水泥、水的用量，推迟放热高峰出现的时间；夏季施工时采用冰水拌合、砂石料场遮阳等措施可降低混凝土的出机和人模温度。以上这些措施可减少混凝土硬化过程中的温度应力值。二是进行保温保湿养护，使混凝土硬化过程中产生的温差应力小于混凝土本身的抗拉强度，从而可避免混凝土产生贯穿性的有害裂缝。大体积混凝土开裂主要是水泥水化热使混凝土温度升高引起的，采取掺加矿物掺合料或采用水化热低的水泥等措施控制混凝土温度升高和温度变化速度在一定范围内，就可以避免出现裂缝。低热或中热水泥，因产量满足不了所有大体积混凝土工程的需求，故在水利工程大坝工程等用的较多，而一般工业民用建筑工程大多采用掺加粉煤灰、磨细矿渣粉等矿物掺合料的措施，可获得很好的效果。
