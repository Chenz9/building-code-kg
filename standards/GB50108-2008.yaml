  - raw: 本条在原条文控制总碱量的基础上又增加了对C1-含量的控制要求。碱骨料反应引起混凝土破坏已成为一个世界性普遍存在的问题。由于地下工程长期受地下水、地表水的作用，如果混凝土中水泥和外加剂中含碱量高，遇到混凝土中的集料具有碱活性时，即有引起碱骨料反应的危险，因此在地下工程中应对所用的水泥和外加剂的含碱量有所控制，以避免碱骨料反应的发生。国内外对混凝土中含碱量的规定各不相同，英国规定混凝土每立方米含碱量不超过3kg，对不重要工程可放宽至4.5kg；南非一些国家认为混凝土每立方米含碱量小于1.8kg时较安全，1.8～3.8kg时为可疑危害，大于3.8kg时为有害；北京市建委于1995年3月1日规定：对于应用于桥梁、地下铁道、人防、自来水厂大型水池、承压输水管、水坝、深基础、桩基等外露或地下结构以及经常处于潮湿环境的建筑结构工程（包括构筑物）必须选用低碱外加剂，每立方米混凝土含碱量不得超过1kg。根据以上资料，规范建议每立方米防水混凝土中各类材料的总碱量（Na2O当量）不得大于3kg。C1-含量高会导致混凝土中的钢筋锈蚀，是影响结构耐久性的主要危害之一，应给予足够的重视。为了减少氯盐的危害，在配制防水混凝土时，首先应严格控制混凝土各种原材料（水泥、矿物掺合料、骨料、拌合水和外加剂等)中的CI-含量。当C1-在混凝土内达到一定浓度时，钢筋才会发生锈蚀，此时的浓度称为临界浓度。许多国家的有关标准对混凝土中的C1-含量均有不同限量规定，具体量值也不完全一致。美国ACI混凝土结构设计规范规定处于海水等氯盐环境下的混凝土，C1-含量不应超过0.15%。·105：日本土木学会编制的规范中规定，对耐久性要求较高的钢筋混凝土，CI-含量不超过0.3kg/m，一般钢筋混凝土C1-含量不超过0.6kg/m。若按每立方米混凝土采用400kg胶凝材料计算，0.3kg/mCl-含量约占胶凝材料的0.15%左右。与美国规定大致相同。国内《混凝土结构耐久性设计与施工指南》中限定混凝土原材料（水泥、矿物掺合料、集料、外加剂、拌合水等）中引入的氯离子总量，应不超过胶凝材料重量的0.1%。引发钢筋锈蚀的CI-临界浓度变化很大（约在0.10%～2.5%之间），对混凝土的影响与混凝土自身的质量、配比、保护层厚度，环境条件等因素有关，很难准确地提出一个统一的限值。在参照国内外有关资料的基础上，结合地下工程的特点，提出CI含量不应超过胶凝材料总量的0.1%的规定。IV施工
