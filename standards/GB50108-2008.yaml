  text: 预注浆的段长，应根据工程地质、水文地质条件、钻孔设备及工期要求确定，宜为10～50m，但掘进时应保留止水岩垫（墙）的厚度。注浆孔底距开挖轮廓的边缘，宜为毛洞高度（直径）的0.5～1倍，特殊工程可按计算和试验确定。
