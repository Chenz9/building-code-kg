- id: GB 50108-2008#4.1.7
  standard_code: GB 50108-2008
  chapter: 4 地下工程混凝土结构主体防水
  section: ''
  clause_no: 4.1.7
  text: 本条说明如下：.100.1关于防水混凝土衬砌厚度。防水混凝土能防水，除了混凝土致密、孔隙率小、开放性孔隙少以外，还需要一定的厚度，这样就使地下水从混凝土中渗透的距离增大，也就是阻水截面加大，当混凝土内部的阻力大于外部水压力时，地下水就只能渗透到混凝土中一定距离而停下来，因此防水混凝土结构必须有一定厚度才能抵抗地下水的渗透。考虑到现场施工的不利因素及钢筋混凝土中钢筋的引水作用，把防水混凝土衬砌的最小厚度定为250mm，通过这几年的使用来看，防水效果明显，这次修编予以保留。2关于防水混凝土裂缝宽度。一般钢筋混凝土工程，都是以混凝土裂缝宽度0.2mm进行设计的，在地下工程中宽度小于0.2mm的裂缝多数可以自行愈合，所以规定裂缝宽度不得大于0.2mm，并不得贯通。3关于钢筋混凝土保护层厚度。我国地下工程建设正在持续不断地发展，由于地下工程所处环境的复杂多变所引发材料性能的劣化，影响结构安全性与适用性的现象日益突出，此外，有关单位还提出了工程结构须满足50～100年的安全使用年限要求，因此，在修改规范时，对钢筋保护层厚度慎重地进行了审核。钢筋保护层的厚度对提高混凝土结构的耐久性、抗渗性极为重要。据有关资料介绍，一般氯盐或碳化从混凝土表面扩散到钢筋表面引起钢筋锈蚀的时间与混凝土保护层厚度的平方成正比。当保护层厚度分别为40mm、30mm、20mm时，钢筋产生移位或保护层厚度发生负偏差时，5mm的误差就能使钢筋锈蚀的时间分别缩短24%、30%、44%，由此可见保护层越薄其受到的损害越大，因此保护层必须具有足够的厚度。此外，国内外有关标准，均对混凝土结构的钢筋保护层作了明确的规定，内容如下：：1)英国混凝土结构设计规范BS8110规定，设计寿命为60年的工程C40混凝土要求钢筋保护层厚度不小于40mm。2)美国ACI规范中规定，钢筋直径大于16mm时保护层的厚度应为50mm。·101·3）日本建筑学会有关标准中规定，室外的承重墙保护层厚度为50mm，室内为40mm。该学会2003年出版的钢筋混凝土建筑物设计施工指南中对使用寿命为30年的楼板、屋面板、非承重墙主筋最小保护层厚度分别为室内30mm和室外40mm。使用年限为100年的工程，楼板、屋面板、非承重墙室内为40mm，室外为50mm；梁、柱和承重墙室内为50mm，室外为60mm。对与水接触的承重梁、柱与挡土墙无年限要求，保护层厚度分别为50mm和70mm。4）我国《混凝土结构耐久性规范》GB50010一2002规定，基础中纵向钢筋保护层厚度（钢筋外边缘至混凝土表面距离）不应小于40mm。此外还应考虑施工负误差△之和（现浇构件△取5～10mm）及箍筋与主筋应具有同样厚度的保护层要求，故最终保护层厚度约为50mm左右。钢筋保护层厚度对提高混凝土结构耐久性和抗渗性极为重要，为与国内外有关规范协调一致，并与国际标准接轨，规范规定的迎水面钢筋保护层厚度不应小于50mm是适宜的。在海水环境或其他腐蚀介质环境中，可参照有关规范规定适当提高混凝土的保护层厚度。钢筋保护层厚度的确定，除在结构上应保证钢筋与混凝土共同作用外，在耐久性方面还应有效地保护钢筋，使其在设计使用年限内，不因自然因素的影响而出现钢筋锈蚀的现象。Ⅲ材料
