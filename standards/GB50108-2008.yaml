    content: 当防水混凝土用于具有一定温度的工作环境时，其抗渗性随着温度提高而降低，温度越高则降低越显著，当温度超过250℃时，混凝土几乎失去抗渗能力（表1），因此规定，最高使用温度不得超过80℃。这次修编将原来的“处于侵蚀性介质中防水混凝土的耐侵蚀系数，不应小于0.8”，修改为“处于侵蚀性介质中防水混凝土的耐侵蚀要求应根据介质的性质按有关标准执行”。之所以这样修改，是因为地下工程的环境比较复杂，每个工程的水文地质条件不尽相同，侵蚀破坏途径也不一样，耐侵蚀系数也不好测试，因此，作了修改。表1不同加热温度的防水混凝土抗渗性能表加热温度(℃)抗渗压力(MPa)常温1.81.10.80.70.60.4
