- id: GB 50108-2008#9.2.7
  standard_code: GB 50108-2008
  chapter: 9 地下工程渗漏水治理
  section: 9.2方案设计
  clause_no: 9.2.7
  text: 锚喷支护工程渗漏水部位，可采用引水带或导管排水，也可喷涂快凝材料及化学注浆堵水。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: may
    modal_words:
    - 可
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 喷射混凝土和锚杆联合支护，不仅是安全可靠的支护形式，而且是在岩层中构筑地下工程最为优越的衬砌形式，这种方法在铁路隧道、矿山工程等地下工程中都已大量采用。喷锚支护一般作为临时支护来考虑，要想作为永久衬砌必须解决防水问题。喷射混凝土施工前，要对围岩渗水情况进行调查，对不同的渗水形式采用不同的防水方法。明显的裂隙渗漏水和点漏水，可采用下弹簧管、半圆铁皮、钻孔引流等方法将渗漏水排走。大面积的片状渗漏水，可用玻璃棉等做引水带，紧贴岩壁渗水处，将水引到排水沟内。无明显渗漏水或间歇性渗水地段，可在两层喷射混凝土层间用快凝材料做防水层。当喷射混凝土层有明显的渗漏水时，可采用注浆的方法堵水，注浆孔深度根据裂隙情况而定，一般为1.8～2.0m，常用的注浆材料有水泥-水玻璃、聚氨酯等，注浆压力 0.3~0.5MPa。
