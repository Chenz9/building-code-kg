  tables: []
  converted_tables:
  - raw: 工程实践证明，密实的回填是工程防水的一道防线，而疏松的回填不仅起不到防水作用，还使得回填区成为一个积水区。回填密实程度与回填土的质量有很大关系，因此对土质也相应提出了要求。为此规范规定在工程范围800mm以内宜采用灰土、粘土、亚粘土、黄土回填，考虑到有的地区取土困难，可采用原土，但不得夹有石块、碎砖、灰渣及有机物等，也不得用冻土。采用机械进行回填碾压时，土中产生的压应力随着深度增加而逐渐减少，超过一定深度后，工程受机械回填碾压影响减小，其深度与施工机械、土质、土的含水量等因素有关。1《铁路工程技术规范》条文说明：“涵顶具有不少于1m的填土厚度时，机械才能越过涵顶”。因为涵顶填土厚度1m以上时，一般说来涵洞可以消除机械冲击影响，并可将机械压力匀散.171·减小。210t压路机碾压最佳含水量状态下的轻亚粘土，其压实影响可达0.45m，若为重粘土，则只能达到0.3m。3北京地铁规定：回填厚度超过0.6m，才允许采用机械回填碾压。综合上述数据，规范规定允许机械回填碾压时的回填厚度值。
