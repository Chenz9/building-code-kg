  tables: []
  converted_tables:
  - raw: 补偿收缩混凝土是在混凝土中加人一定量的膨胀剂，使混凝土产生微膨胀，在有配筋的情况下，能够补偿混凝土的收缩，提高混凝土抗裂性和抗渗性。后浇带采用补偿收缩混凝土，是为了使新旧混凝土粘结牢固，避免出现新的收缩裂缝造成工程渗漏水的隐患。补偿收缩混凝土配合比设计，尚应满足防水混凝土的抗渗和强度等级要求，故规定补偿收缩混凝土的抗渗和强度等级不·141·应低于两侧混凝土。Ⅱ设计
