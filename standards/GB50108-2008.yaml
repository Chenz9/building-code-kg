    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 要使嵌填的密封材料具有良好的防水性能，除了嵌填的密封材料要密实外，缝两侧的基面处理也十分重要，否则密封材料与基面粘结不紧密，就起不到防水作用。另外，嵌缝材料下面的背衬材料不可忽视，否则会使密封材料三向受力，对密封材料的耐久性和防水性都有不利影响。由于基层处理剂涂刷完毕后再铺设背衬材料，将会对两侧基面的基面处理剂有一定的破坏，削弱基层处理剂的作用，故本条还规定基层处理剂应在铺设背衬材料后进行。
