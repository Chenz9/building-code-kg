  converted_tables:
  - raw: 当地下工程长宽比较大时，工程结构的横向刚度较大，纵向刚度较小，如不适当加大结构的纵向刚度则结构容易开裂形成渗漏水通道。另外，由于工程较长，混凝土干燥收缩、温度变化收缩导致混凝土开裂的可能性也大大增加，因此设计时对以上两个方面要特别重视。当基坑支护结构（如地下连续墙）与各结构的内衬墙共同受力时，设计时应采取措施控制两者的不均匀沉降，以减少不均匀沉降对结构的不利影响；在结构设计时还可通过适当增加内衬墙的厚度、底板纵向梁的刚度来提高整个地下工程纵向刚度；对于防止干缩、温度引起混凝土开裂等问题，在设计时可采用合理设置诱导缝、后浇带、适当增加纵向构造钢筋等措施来解决。在防水材料选择时，要根据计算的结构变形量选用延伸率大的卷材、涂料等柔性防水材料。4．地下工程混凝土结构主体防水4.1防水混凝土I一般规定
