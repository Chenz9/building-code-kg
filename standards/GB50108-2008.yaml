  section: 5.6桩头
  clause_no: 5.6.1
  text: 桩头防水设计应符合下列规定：桩头所用防水材料应具有良好的粘结性、湿固化性；桩头防水材料应与垫层防水层连为一体。5.6. 2桩头防水施工应符合下列规定：应按设计要求将桩顶剔凿至混凝土密实处，并应清洗干净；破桩后如发现渗漏水，应及时采取堵漏措施；涂刷水泥基渗透结晶型防水涂料时，应连续、均匀，不得少涂或漏涂，并应及时进行养护；采用其他防水材料时，基面应符合施工要求；5、应对遇水膨胀止水条（胶）进行保护。
