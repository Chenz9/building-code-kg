  tables:
  - table_id: 表3.2.1
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 地下工程的防水等级应分为四级，各等级防水标准应符合表3.2.1的规定。表3.2.1地下工程防水标准防水防水标准等级一级不允许渗水，结构表面无湿渍不允许漏水，结构表面可有少量湿溃；工业与民用建筑：总湿渍面积不应大于总防水面积（包括顶板、墙面、地面）的1/1000；任意100m²防水面积上的湿溃不超过2处，单个湿渍的最大面积不大于0.1m²；二级其他地下工程：总湿渍面积不应大于总防水面积的2/1000；任意100m²防水面积上的湿渍不超过3处，单个湿溃的最大面积不大于0.2m；其中，隧道工程还要求平均渗水量不大于0.05L/(m²·d)，任意100m²防水面积上的渗水量不大于0.15L/（m²·d)续表3.2.1防水防水标准等级有少量漏水点，不得有线流和漏泥砂；三级任意100m²防水面积上的漏水或湿渍点数不超过7处，单个漏水点的最大漏水量不大于2.5L/d，单个湿溃的最大面积不大于0.3m²有漏水点，不得有线流和漏泥砂；四级整个工程平均漏水量不大于2L/m²·d)；任意100m²防水面积上的平均漏水量不大于4L/(m²·d)
  converted_tables:
  - raw: 、3.2.2原规范规定的防水等级划分为四级，经过五年来的使用，从防水工程界的反映来看基本上是符合实际、切实可行的。因此这次修编仍保留原防水等级的划分，但对二级防水等级标准进行了局部修改，理由如下：1.二级防水等级标准是按湿渍来反映的，这是它合理的一面。与“工业与民用建筑·任意100m防水面积的湿渍不超过2处，单个湿渍的最大面积不大于0.1m²”的规定是匹配的。理由是“任意100m²”是指包括建筑中渗水最集中区，因此与整个建筑总湿面积为总防水面积的1/1000绝不应对等，更何况以上的表述还意味着任意100m²防水面积的湿渍还小于建筑总湿面积的平均值。理论上讲，“任意100m²防水面积上的湿渍比例”应是“建筑总湿面积的比例的”2倍。2关于隧道渗漏水量的比较和检测，国内外早已达成的共识是：规定单位面积的渗水量（或包括单位时间），如：渗水量L/（m²·d）、湿渍面积×湿渍数/100m，这样就撇开了工程断面和长度，可比性强，也比较客观。3隧道工程还要求“平均渗水量不大于0.05L/（m²·d)，任意100m²防水面积上的渗水量不大于0.15L/（m²·d)”，基本是2～4倍，考虑到隧道的总内表面积通常较大，故定为3倍。4考虑到国外的有关隧道等级标准（包括二级）都与渗水量挂钩{L/（m²·d)】，目前国内设计上，防水等级为二级的隧道工程，尤其是圆形隧道或房屋建筑的地下建筑的渗水量的提法有所.94.差别，即隧道工程已按国际惯例提出L/（m²·d）的指标，包括整体与局部，其倍数关系，应与湿迹一致，因此，这次修编时增补了这方面的内容。在进行防水设计时，可根据表中规定的适用范围，结合工程的实际情况合理确定工程的防水等级。如办公用房属人员长期停留场所，档案库、文物库属少量湿迹会使物品变质、失效的贮物场所，配电间、地下铁道车站顶部属少量湿迹会严重影响设备正常运转和危及工程安全运营的场所或部位，指挥工程属极重要的战备工程，故都应定为一级；而一般生产车间属人员经常活动的场所，地下车库属有少量湿迹不会使物品变质、失效的场所，电气化隧道、地铁隧道、城市公路隧道、公路隧道侧墙属有少量湿迹基本不影响设备正常运转和工程安全运营的场所或部位，人员掩蔽工程属重要的战备工程，故应定为二级；城市地下公共管线沟属人员临时活动场所，战备交通隧道和蔬散干道属一般战备工程，可定为三级。对于一个工程（特别是大型工程），因工程内部各部分的用途不同，其防水等级可以有所差别，设计时可根据表中适用范围的原则分别予以确定。但设计时要防止防水等级低的部位的渗漏水影响防水等级高的部位的情况。3.3防水设防要求
