    min_value: 1.5
    max_value: null
  tables: []
  converted_tables:
  - raw: 本条说明如下：1关于骨料粒径。混凝土孔隙大小，对其本身的抗渗性能的影响是显著的。混凝土的空隙可分为施工孔隙和构造孔隙两大类。构造孔隙是由于配比问题引起的，它主要包括胶孔、毛细孔和沉降缝隙等。沉降缝隙是在混凝土结构形成时，骨料与水泥因各·103·自的比重和粒径大小不一致，在重力作用下，产生不同程度的相对沉降所引起的。混凝土浇灌后，粗骨料沉降较快，并较早地固定下来，而水泥砂浆则在粗骨料间继续沉降，水被析出，其中一部分沿着毛细管通道析出至混凝土表面，另一部分则聚集在粗骨料下表面形成积水层。水蒸发后形成沉降缝隙，粗骨料粒径越大，则这种沉降越大，也就越不利于防水。在混凝土硬化过程中，石子不收缩，石子周围的水泥浆则收缩，两者变形不一致。石子越大，周长越大，与砂浆收缩的差值越大，使砂浆与石子间产生微细裂缝。这些缝隙的存在使混凝土的有效阻水截面显著减少，压力水容易透过。因此，防水混凝土的石子粒径不宜过大，以不超过40mm为宜。泵送防水混凝土的石子最大粒径应根据输送管的管径决定，其石子最大粒径不应大于管径的1/4，否则将影响泵送。2由于防水混凝土水泥用量相对较高，使用粉细砂更易产生裂缝，因此应优先选用中砂。3砂、石子含泥量对混凝土抗渗性影响很大，粘土降低水泥与骨料的粘结力，尤其是颗粒粘土，体积不稳定，干燥时收缩，潮湿时膨胀，对混凝土有很大的破坏作用。因此防水混凝土施工时，对骨料含泥量应严格控制。与原规范相比，本条增加了“不宜使用海砂”的规定，这是因为海砂含有氯离子（CI-），会对混凝土产生破坏，在没有河沙的条件时，对海砂进行处理后才能使用。
    note: 合并重复提取片段
