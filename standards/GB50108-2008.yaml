  clause_no: 4.8.9
  text: 地下工程种植顶板的防排水构造应符合下列要求：耐根穿刺防水层应铺设在普通防水层上面。耐根穿刺防水层表面应设置保护层，保护层与防水层之间应设置隔离层。3排（蓄)水层应根据渗水性、储水量、稳定性、抗生物性和碳酸盐含量等因素进行设计；排（蓄）水层应设置在保护层上面，并应结合排水沟分区设置。4排(蓄)水层上应设置过滤层，过滤层材料的搭接宽度不应小于200mm。5种植土层与植被层应符合国家现行标准《种植屋面工程技术规程》JGJ155的有关规定。
