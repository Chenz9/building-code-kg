  converted_tables:
  - raw: 地下连续墙作为复合衬砌的一部分，不直接作为主体结构的墙体使用，而主体结构用防水混凝土浇筑时，可用做防水等级为一、二级工程。但应指出，由于地下连续墙和直接作主体结构的墙体在板的位置上的钢筋连为一体，此处防水如处理不好，极易形成:161:渗漏水通道，而一直接作主体结构的墙体渗漏，很难找出渗漏水点，因此直接作主体结构的墙体，特别是这些细部构造的施工更要精心。为了解决地下连续墙与直接作主体结构的墙体因钢筋相连造成防水难度加大这一问题，目前有些工程直接作主体结构的墙体与地下连续墙已不相连，在两者之间的塑料防水板防水层可以连续铺设形成一一个完整的防水层，防水效果很好，故本条第3款对此做了相应的规定。
