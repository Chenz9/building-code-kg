- id: GB 50108-2008#4.5.13
  standard_code: GB 50108-2008
  chapter: 4 地下工程混凝土结构主体防水
  section: 4.5塑料防水板防水层
  clause_no: 4.5.13
  text: 塑料防水板的铺设应符合下列规定：铺设塑料防水板时，宜由拱顶向两侧展铺，并应边铺边用压焊机将塑料板与暗钉圈焊接牢靠，不得有漏焊、假焊和焊穿现象。两幅塑料防水板的搭接宽度不应小于100mm。搭接缝应为热熔双焊缝，每条焊缝的有效宽度不应小于10mm；环向铺设时，应先拱后墙，下部防水板应压住上部防水板；塑料防水板铺设时宜设置分区预埋注浆系统；分段设置塑料防水板防水层时，两端应采取封闭措施。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
