  converted_tables:
  - raw: 变形缝的渗漏水除设计不合理的原因之外，施工不合理也是一个重要的原因，针对目前存在的一些问题，本条做了相关规定。中埋式止水带施工时常存在以下问题：一是顶、底板止水带下部的混凝土不易振捣密实，气泡也不易排出，且混凝土凝固时产生的收缩易使止水带与下面的混凝土产生缝隙，从而导致变形缝漏水。根据这种情况，条文中规定顶、底板中的止水带安装成盆形，有助于消除上述弊端。二是中埋式止水带的安装，在先浇一侧混凝土时，端模被止水带分为两块，给模板固定造成困难，故条文中规定端模要支撑牢固，防止漏浆。施工时由于端模支撑不牢，不仅造成漏浆，而且也不敢按规定要求进行振捣，致使变形缝处的混凝土密实性较差，从而导致渗漏水。三是止水带的接缝是止水带本身的防水薄弱处，因此接缝愈少愈好，考虑到工程规模不同，缝的长度不一，故对接缝数量未做严格的限定。四是转角处止水带不·139.能折成直角，故条文规定转角处应做成圆弧形，以便于止水带的安
