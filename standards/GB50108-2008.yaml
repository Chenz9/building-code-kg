  chapter: 4 地下工程混凝土结构主体防水
  section: ''
  clause_no: 4.7.2
  text: 膨润土与淡水反应后，膨胀为自身重量的5倍、自身体积的13倍左右，靠粘结性和膨胀性发挥止水功能，这里的淡水是指不会降低膨润土膨胀功能且不含有害物质的水。当地下水不是淡水而是污水时，膨润土难以发挥防水功能，不能使用普通的天然钠基膨润土，而应该使用防污膨润土。地下水是否是污水，可通过测定电子传导度（EC）、总污度（TDS)或PH来确定。而盐水的电导度都比较高，必须使用防污膨润土。
