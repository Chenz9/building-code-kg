  - raw: 钠基膨润土颗粒或粉剂是生产膨润土防水材料的主材。钠基膨润土分为天然钠基膨润土和人工钠化处理的膨润土，两种膨润土的物性指标差距不大，均可作为防水材料。一般情况下天然钠基膨润土的性能高于人工钠化处理的膨润土的性能，但由于国内的天然钠基膨润土储量有限，在保证防水性能不变的情况下也可采用人工钠化处理的膨润土。人工钠化处理的膨润土是对其他种类的膨润土进行合理的加工，具有与天然钠基膨润土相同的物理性能，技术性能特别是耐久性符合行业标准《钠基膨润土防水毯》JG/T193，同样可以在地下工程防水中使用。钙基膨润土的稳定性差，膨胀倍率低，一般用于铸造、泥浆护壁等，不能作为防水材料使用。膨润土颗粒通过针刺法固定在编织布和无纺布之间，针刺的密度、均匀度会影响膨润土颗粒的分散均匀性，如果针刺密度不均匀或过小，则防水毯在运输、现场搬运过程中会导致颗粒在毯体内
    note: 合并重复提取片段
