  section: 5.5预留通道接头
  clause_no: 5.5.3
  text: 预留通道接头的防水施工应符合下列规定：中埋式止水带、遇水膨胀橡胶条（胶）、预埋注浆管、密封材料、可卸式止水带的施工应符合本规范第5.1节的有关规定；预留通道先施工部位的混凝土、中埋式止水带和防水相关的预埋件等应及时保护，并应确保端部表面混凝土和中埋式止水带清洁，埋设件不得锈蚀；3采用图5.5.2-1的防水构造时，在接头混凝土施工前应将先浇混凝土端部表面凿毛，露出钢筋或预埋的钢筋接驳器钢板，与待浇混凝土部位的钢筋焊接或连接好后再行浇筑；4当先浇混凝土中未预埋可卸式止水带的预埋螺栓时，可选用金属或尼龙的膨胀螺栓固定可卸式止水带。采用金属膨胀螺栓时，可选用不锈钢材料或用金属涂膜、环氧涂料等涂层进行防锈处理。
