  standard_code: GB 50108-2008
  chapter: 4 地下工程混凝土结构主体防水
  section: 4.6金属防水层
  clause_no: 4.6.1
  text: 金属防水层可用于长期浸水、水压较大的水工及过水隧道，所用的金属板和焊条的规格及材料性能，应符合设计要求。
