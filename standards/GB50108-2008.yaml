  clause_no: 4.2.17
  text: 水泥砂浆防水层终凝后，应及时进行养护，养护温度不宜低于5℃，并应保持砂浆表面湿润，养护时间不得少于14d。聚合物水泥防水砂浆未达到硬化状态时，不得浇水养护或直接受雨水冲刷，硬化后应采用干湿交替的养护方法。潮湿环境中，可在自然条件下养护。
