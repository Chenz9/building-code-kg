    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 密封材料按材性可分为合成高分子密封材料、高聚物改性沥青密封材料及定型密封材料，地下工程中使用的密封材料为合成高分子密封材料和定型密封材料。合成高分子密封材料多采用硅酮、聚硫橡胶类、聚氨酯类等材料，它们的性能应符合规范第5.1.9条的规定。定型密封材料的主要品种有遇水膨胀橡胶条、自粘性橡胶止水条等。遇水膨胀橡胶条是以改性橡胶为基料而制成的一种新型防水材料，它一方面具有橡胶制品的优良弹性和延展性，起到弹性密封作用；另一方面当结构变形量超过材料的弹性复原率时，在膨胀倍率范围内具有遇水膨胀的特性。起到以水止水的功能，这种双重止水机理提高了防水效果，目前这种防水材料有各种定型产.169.品。自粘性橡胶是由特种合成橡胶掺入各种助剂加工而成的弹塑性腻子状聚合物，它具有橡胶腻子充填空隙的性能，同时在一定压力下又具有与混凝土良好的粘着性能。它们主要用于地下工程的变形缝、施工缝、穿墙管等接缝的防水。地下工程中由于经常受水侵蚀，使用密封防水材料时要注意以下问题：密封材料经常承受水压作用易产生较大拉伸变形，不宜使用圆形或方形背衬材料，应用薄片背衬材料，并防止三面粘结。材料不能因长期受水浸泡而产生胀溶，污染水质。受振动、温差、结构变形等影响接缝并产生活动时，要选用弹性或弹塑性好的密封材料。密封材料与基层的粘结，不能因为长期浸水而造成粘结老化，发生粘结剥离破坏，因此应选择适当的耐水基层处理剂。9.4施工
