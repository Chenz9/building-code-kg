- id: GB 50108-2008#4.1.27
  standard_code: GB 50108-2008
  chapter: 4 地下工程混凝土结构主体防水
  section: ''
  clause_no: 4.1.27
  text: 大体积混凝土与普通混凝土的区别表面上看是厚度不同，但实质的区别是大体积混凝土内部的热量不如表面的热量散失得快，容易造成内外温差过大，所产生的温度应力使混凝土开裂。因此判断是否属于大体积混凝土既要考虑混凝土的浇筑厚度，又要考虑水泥品种、强度等级、每立方米水泥用量等因素，比较准确的方法是通过计算水泥水化热所引起的混凝土的温升值与环境温度的差值大小来判别。一般来说，当其差值小于25℃时，所产生的温度应力将会小于混凝土本身的抗拉强度，不会造成混凝土的开裂，当差值大于25℃时，所产生的温度应力有可能大于混凝土本身的抗拉强度，造成混凝土的开裂，此时就可判定该混凝土属大体积混凝土，并应按条文中规定的措施进行施工，以确保混凝.109.土不开裂。通过水泥水化热来计算温升值比较麻烦，《工程结构裂缝控制》（王铁梦著)中根据最近几年来的现场实测降温曲线及实测数据，经统计整理水化热温升值，可直接应用于相类似的工程
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
