    conditions: []
    exceptions: []
  constraint:
    modal_level: may
    modal_words:
    - 可
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 、9.2.3大面积的渗漏水是地下工程渗漏水的主要表现形式之一，它在渗水的工程中所占比例高达95%以上，几乎所有的渗水工程都存在这类问题。造成这类渗水的原因来自设计与施工两方面。表现特征为：渗水基面多为麻面；渗水点有大有小，且分布密集；渗水面积大。·：大面积严重渗漏水一般采用综合治理的方法，即刚柔结合多道防线。首先疏通漏水孔洞，引水泄压，在分散低压力渗水基面上涂抹速凝防水材料，然后涂抹刚柔性防水材料，最后封堵引水孔洞。并根据工程结构破坏程度和需要采用贴壁混凝土衬砌加强处理。其处理顺序是：大漏引水一小漏止水一涂抹快凝止水材料一柔性防水一刚性防水一注浆堵水一必要时贴壁混凝土衬砌加强。大面积的轻微渗漏水和漏水点是指漏水不十分明显，只有湿迹和少量滴水的点。这种形式的渗水处理一般采用速凝材料直接封堵，也可对漏水点注浆堵漏，然后做防水砂浆抹面或涂抹柔性防水材料、水泥基渗透结晶型防水涂料等。当采用涂料防水时防水层表面要采取保护措施。
    note: 合并重复提取片段
  references: []
  related_objects:
