  - raw: 锚喷支护的混凝土因是喷射施工，影响混凝土质量的因素较多，因此不宜直接单独用于防水等级高的工程的主体结构。因影响喷射混凝土抗渗性能的因素较多，故取消了喷射混凝土抗渗等级的要求。外加剂和掺合料等对喷射混凝土的抗渗性能影响较大，特别是对收缩开裂及后期强度下降有较大影响，故喷射·163·混凝土中可掺入纤维作为抗裂措施，各种外加剂的掺量应通过试验确定。地下工程变截面及曲线转折点的阳角，即突出部位，喷射混凝土的质量往往不易保证，因此规定此处喷射混凝土的厚度应在原设计的基础上增加50mm。
