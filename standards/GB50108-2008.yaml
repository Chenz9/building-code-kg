    note: 条件→参数查表（OCR合并正文，行列结构缺失）
    content: 表4.1.4的规定。表4.1.4防水混凝土设计抗渗等级工程埋置深度H(m)设计抗渗等级H<10P610≤H<20P820≤H<30P10H≥30P12注:1本表适用于I、Ⅱ、Ⅲ类围岩（土层及软弱围岩)。山岭隧道防水混凝土的抗渗等级可按国家现行有关标准执行。
  converted_tables:
  - raw: 在建筑工程中，混凝土的配制一般是以抗压强度要求作为主要设计依据的，20世纪70年代后期由于环境劣化，混凝土质量不良，导致工程事故时有发生，因此混凝土的耐久性、安全性问题引起了国内外的关注，对有耐久性要求的工程提出了混凝土以耐久性、可靠性作为主要的设计理念。地下工程所处的环境较为复杂、恶劣，结构主体长期浸泡在水中或受到各种侵蚀介质的侵蚀以及冻融、干湿交替的作用，易使混凝土结构随着时间的推移，逐渐产生劣化，因此地下工程混凝土的防水性有时比强度更为重要。各种侵蚀介质对混凝土的破坏与混凝土自身的透水性和吸水性密切相关。故防水混凝土的配制首先应以满足抗渗等级要求作为主·99要设计依据，同时也应根据工程所处环境条件和工作条件需要，相应满足抗压、抗冻和耐腐蚀性要求：Ⅱ设计
