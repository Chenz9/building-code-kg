  tables: []
  converted_tables:
  - raw: 根据各地工程实践，地下水位应降到工程底部最低标高500mm以下较为合理。如控制距离较小，往往会造成基础施工困难，而影响地下工程防水质量。由于一般工程的抗浮力均考虑工程上部覆土的重量，如在防水工程完工而尚未回填时就停止抽水，则有可能由于水位上升而造成工程上浮，导致工程防水层破坏，因此规范规定降水作业直至回填作业完毕为止。
