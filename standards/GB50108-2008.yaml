    content: 防水混凝土的养护是至关重要的。在浇筑后，如混凝土:111:养护不及时，混凝土内部的水分将迅速蒸发，使水泥水化不完全。而水分蒸发会造成毛细管网彼此连通，形成渗水通道，同时混凝土收缩增大，出现龟裂，抗渗性急剧下降，甚至完全丧失抗渗能力。若养护及时，防水混凝土在潮湿的环境中或水中硬化，能使混凝土内的游离水分蒸发缓慢，水泥水化充分，水泥水化生成物堵塞毛细孔隙，因而形成不连通的毛细孔，提高混凝土的抗渗性。表5给出了不同养护龄期的混凝土的抗渗性能，供参考。表5不同养护龄期的混凝土抗渗性能养护方式雾室养护备注龄期(d)水灰比为0.5，落度（cm）7.17.17.1砂率为35%抗渗压力（MPa)1.1>3.5>3.5
