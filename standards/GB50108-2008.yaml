  chapter: 6 地下工程排水
  section: 6.2设计
  clause_no: 6.2.3
  text: 地下工程采用渗排水法时应符合下列规定。1,宜用于无自流排水条件，防水要求较高且有抗浮要求的地下工程、2、渗排水层应设置在工程结构底板以下,并应由粗砂过滤层与集水管组成,图6.2.3 3 粗砂过滤层总厚度宜为300mm 如较厚时应分层铺填,过滤层与基坑土层接触处，应采用厚度100.150mm,粒径5。10mm的石子铺填.过滤层顶面与结构底面之间，宜干铺一层卷材或30、50mm厚的1、3水泥砂浆作隔浆层.4，集水管应设置在粗砂过滤层下部,坡度不宜小于1 且不得有倒坡现象.集水管之间的距离宜为5，10m,渗入集水管的地下水导入集水井后应用泵排走。
