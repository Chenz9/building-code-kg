    content: 表4.5.8的规定。表4.5.8塑料防水板主要性能指标性能指标项目乙烯-醋酸乙烯乙烯-沥青共混高密度聚氯乙烯共聚物聚合物聚乙烯拉伸强度（MPa)≥16≥14≥10≥16断裂延伸率（%）≥550≥550≥500≥200不透水性，120min（MPa）≥0.3≥0.3≥0.3≥0.3低温弯折性-35℃无裂纹-35℃无裂纹20℃无裂纹-35℃无裂纹热处理尺寸变化率(%)≤2.0≤2.52.0≤2.0
  converted_tables:
  - raw: 本条修改时，参考了现行国家标准《地下防水工程质量验收规范》GB50208，结合地下工程防水的特点和不同材质制作的塑料防水板的要求，依据《高分子防水材料》GB18173.1的标准规定，提出了塑料防水板的物理力学性能，便于在设计施工中选用。防水板的幅宽应尽量宽些，这样防水板的搭接缝数量就会少些，如1m宽的防水板的搭接缝数量是4m宽板的4倍，而搭接缝又是防水板防水的薄弱环节。但防水板的幅宽又不能过宽，否则防水板的重量变大，会造成铺设困难。根据近年来工程实践来看，防水板的幅宽以2～4m为宜。防水板的厚度与板的重量、造价、防水性能有关，板过厚则较重，于铺设不利，且造价较高，但过薄又不易保证防水施工质量，根据我国目前的使用情况，在地下工程防水中应用时，塑料防水板的厚度不得小于1.2mm。防水板铺设于初期支护与二次衬砌之间，在二次衬砌浇筑时会受到一定的拉力，故应有足够的抗拉强度。初期支护为锚喷支护时，支护后围岩仍在变形，即使整个工程建成后，由于使用或地质等方面的原因，工程结构也存在着变形问题，故防水板应有较高的延伸率。，耐刺穿性是施工中对材料提出的要求，因二次衬砌时有的地段需要采用钢筋混凝土结构，在绑扎钢筋时会对防水板造成损伤，故要求防水板有一定的耐刺穿性，以免板被刺破使其完整的防水性遭到破坏。防水板因长期处于地下并要长期发挥其防水性能，故应具有良好的耐久性、耐腐蚀性、耐菌性。抗渗性是防水板非常重要的性能。但目前的试验方法不能反映防水板处于地下受水长期作用这一条件，而要制定一套符合地下工程使用环境的试验方法也不是短期能解决的问题，故只好沿用现在工程界公认的试验方法所测得的数据。：125·防水板的物理力学性能是根据现在使用较多的几种防水板的性能综合考虑提出的，有些防水板的某些指标值可能远远大于表中的规定值，设计选用时可根据工程的要求及投资等情况合理选
    note: 合并重复提取片段
