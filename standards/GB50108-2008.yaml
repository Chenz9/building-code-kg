  converted_tables:
  - raw: 当采用地下连续墙和防水混凝士内衬的复合式衬砌的逆筑法施工时，为确保整个工程的防水等级达到一、二级要求，必须处理好逆接施工缝的防水。逆接施工缝与顶板、中楼板的距离要大些，否则不便于逆接施工缝处的混凝土浇筑施工；逆接施工缝采用土胎模，容易做成斜坡形，目前工程中也常用这种形式，故本条予以推荐；在浇筑侧墙混凝土时，一次浇筑至逆接施工缝在施工时要方便快速，但不利于防水，因逆接施工缝本身就是防水薄弱环·162·节，一次浇至逆接施工缝时，由于混凝土沉降收缩、干燥收缩等原因会在逆接施工缝处形成裂缝，造成渗漏水隐患，又因整个侧墙的工程量较大，如全部用补偿收缩混凝土浇筑则会使工程造价增加，故本条规定逆接施工缝处采用二次浇筑，待先浇混凝土收缩大部分完成后再进行浇筑，以确保逆接施工缝处的防水质量。这些年在逆接施工缝部位采用单组分遇水膨胀密封胶和预埋注浆管作为*防水措施较为成功，因此在逆作法结构施工缝处补人了这两项防水措施。
    note: 合并重复提取片段
  - raw: 条的规定。比较难办的是由于没有地下连续墙这一初期支护，而施工时为了安全不可能把结构内的土体一次挖除，而需边挖边浇筑混凝土侧墙，这就会留下一些垂直施工缝，而垂直施工缝又与水平施工缝、逆接施工缝相交，给防水处理带来较大难度。故施工时在保证安全的前提下应尽量少留垂直施工缝，需要留设时方面要做好垂直施工缝本身的防水，同时也要做好垂直施工缝与水平施工缝、逆接施工缝相交处的防水处理，确保工程的防水要求。逆筑法的底板应一次浇筑，同时按防水等级的要求做好底板与侧墙、桩柱相交处的防水处理。8.5锚喷支护
