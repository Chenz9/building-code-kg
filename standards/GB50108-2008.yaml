  - raw: 本条说明如下：1耐根穿刺防水层设置在普通防水层上面的目的是防止植物根系刺破防水层。严格说，只有在混凝土中加纤维，减少终凝前后的裂缝，增加其防水性、抗裂性（韧性），并处理好分格缝处的耐根穿才能为耐根穿刺做出贡献。《种植屋面工程防水技术规程》JGJ155中规定了耐根穿刺防水材料的种类和物理性能指标，在进行防水设计时可参照选用。2主要考虑园艺操作对耐根穿刺防水层的损坏。3主要考虑蓄排水材料的有效使用寿命。粒料蓄水量小，排水性能与总体厚度及粒料粒径有关，应作好滤水，才能保证其有效·133·使用。4有些简易种植，可能采用毯状专用蓄排水层，并兼作滤水层。其搭接不需要重叠。
