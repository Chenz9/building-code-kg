- id: GB 50108-2008#4.4.7
  standard_code: GB 50108-2008
  chapter: 4 地下工程混凝土结构主体防水
  section: ''
  clause_no: 4.4.7
  text: 、4.4.8这两条是对材料的要求，是根据地下工程对材料的基本要求和目前材料性能的现状提出来的。防水涂料品种较多，既给设计和施工单位在材料选择上有较大余地，又给如何选择适合于地下工程防水要求的材料造成一定难度。根据地下工程防水对涂料的要求及现有涂料的性能，在表：4.4.8-1
  is_abolished: false
