  section: 9.2方案设计
  clause_no: 9.2.8
  text: 细部构造部位渗漏水处理可采取下列措施：1变形缝和新旧结构接头，应先注浆堵水或排水，再采用嵌填遇水膨胀止水条、密封材料，也可设置可卸式止水带等方法处2穿墙管和预埋件可先采用快速堵漏材料止水，再采用嵌填密封材料、涂抹防水涂料、水泥砂浆等措施处理；3施工缝可根据渗水情况采用注浆、嵌填密封防水材料及设置排水暗槽等方法处理，表面应增设水泥砂浆、涂料防水层等加强措施。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 在地下工程渗漏水中细部构造部位占主要部分，尤其是变形缝几乎是十缝九漏。由于该部位的防水操作困难，质量难以保证，经常出现止水带固定不牢，位置不准确，石子过分集中于止水带附近或止水带两侧混凝土振捣不密实等现象，致使防水失败。施工缝和穿墙管的渗漏水在地下工程中也比较常见。对于这些部位的渗漏水处理可采用以下方法：施工缝、变形缝一般是采用综合治理的措施即注浆防水与嵌缝和抹面保护相结合，具体做法是将变形缝内的原密封材料清除，深度约100mm，施工缝沿缝凿槽，清洗干净，漏水较大部位埋设引水管，把缝内主要漏水引出缝外，对其余较小的渗漏水用快凝材料封堵。然后嵌填密封防水材料，并抹水泥砂浆保护层或压上保护钢板，待这些工序做完后，注浆堵水。穿墙管与预埋件的渗水处理步骤是：将穿墙管或预埋件周围的混凝土凿开，找出最大漏水点后，用快凝胶浆或注浆的方法堵水，然后涂刷防水涂料或嵌填密封防水材料，最后用掺外加剂水泥砂浆或聚合物水泥砂浆进行表面保护。.167·9.3治理材料
