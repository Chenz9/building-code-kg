    content: 表4.1.17的规定。表 4.1. 17防水混凝土配料计量允许偏差混凝土组成材料每盘计量(%)累计计量(%)水泥、掺合料±2±1粗、细骨料±3±2±2水、外加剂±1注：累计计量仅适用于微机控制计量的搅拌站。
  converted_tables:
  - raw: 本条有较大修改，在混凝土配制的理念及材料组成上均与原规范有较大不同，引用了当前普遍采用的胶凝材料的概念。混凝土的配制一直是以28d抗压强度作为衡量其质量的主要指标，并片面认为只有极具活性的水泥才能赋予混凝土足够的强度，常常以增加水泥用量或提高水泥强度等级作为获得理想强度的手段，却忽略了由于水泥产生大量的水化热使混凝土开裂，耐久性降低的弊病。：随着混凝土技术的发展，现代混凝土的设计理念也在更新，尽可能减少硅酸盐水泥用量而掺人一定量且具有活性的粉煤灰、粒化高炉矿渣、硅灰等矿物掺合料，使混凝土在获得所需抗压强度的:106:同时，能获得良好的耐久性、抗渗性、抗化学侵蚀性、抗裂性等技术性能，并可降低成本，获得明显的经济效益。但水泥用量也不能过低，经大量试验研究和工程实践，配制防水混凝土时水泥用量不应小于260kg/m3和胶凝材料的总用量不宜小于320kg/m，当地下水有侵蚀性介质和对耐久性有较高要求时，水泥和胶凝材料用量可适当调整。随着混凝士技术的发展，为了适应混凝土性能的要求，包括防水混凝土在内的混凝土原材料组成也在发生变化。作为胶凝材料的主角一一水泥固然仍占主导地位，但其他胶凝材料（粉煤灰、矿渣粉、硅粉等)的用量正在大幅提升，其用量约占混凝土全部胶凝材料的25%～35%，甚至更多。水泥以外的其他胶凝材料，它们均具有不同程度的活性，对改善混凝土性能起着重要作用。胶凝材料活性的激发，同样要依赖其与水的结合反应，因此必须有足够的水分才能使混凝土充分水化。基于以上原因，修编后的规范条文中，以胶凝材料的用量取代传统的水泥用量，并以水胶比（即水与胶凝材料之比）取代传统的水灰比，并提出水胶比不得大于0.5的要求。
