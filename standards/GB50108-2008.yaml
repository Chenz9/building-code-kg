  converted_tables:
  - raw: 本条作了两处修改，一是取消了“水泥的强度等级不应低于32.5MPa”的规定，二是规定防水混凝土只采用普通硅酸盐水泥和硅酸盐水泥，取消了其他品种的水泥。关于防水混凝土水泥品种的选用，原规范规定，在不受侵蚀介质作用时，宜采用硅酸盐水泥、普通硅酸盐水泥、火山灰质硅酸盐水泥、粉煤灰硅酸盐水泥、矿渣硅酸盐水泥五个品种，这次修改为“水泥品种宜采用硅酸盐水泥、普通硅酸盐水泥，使用其他品种水.102：泥时应经试验确定”。这是因为硅酸盐水泥无任何矿物混合料，普通硅酸盐水泥掺有5%～15%的掺合料，而其他三个品种的水泥硅酸盐水泥允许掺有20%～70%的粒化高炉矿渣粉，火山灰质硅酸盐水泥掺有20%～50%的火山灰质材料；粉煤灰硅酸盐水泥掺有20%～40%的粉煤灰。由于所掺入的矿物掺合料品种、质量、数量的不同，生产出的水泥性能有很大差异。近年来一般工程特别是防水工程，混凝土主要采用硅酸盐水泥或普通硅酸盐水泥，掺人矿物掺合料进行配制，工程中已很少采用火山灰硅酸盐、矿渣硅酸盐和粉煤灰硅酸盐等水泥，故采用上述三种水泥时，应通过试验确定其配合比，以确保防水混凝土的质量。：在受侵蚀性介质或冻融作用时，可以根据侵蚀介质的不同，选择相应的水泥品种或矿物掺合料。
