  parameters: []
  tables: []
  converted_tables:
  - raw: 注浆压力是浆液在裂隙中扩散、充填、压实、脱水的动力。注浆压力太低，浆液就不能充填裂隙，扩散范围也有限，注浆质量也差。注浆压力太高，会引起裂隙扩大，岩层移动和抬升，浆液易扩散到预定注浆范围之外，造成浪费。特别在浅埋隧道，会引起地表隆起，破坏地面设施，造成事故，因此，合理选择注浆压力，是注浆成败的关键。因此规范规定预注浆比静水压力大0.5～1.5MPa，回填注浆及衬砌内注浆压力应小于0.5MPa。
