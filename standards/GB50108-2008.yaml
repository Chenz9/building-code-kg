  - raw: 地下工程由于受施工工期的限制，要想使基面达到比较干燥的程度较难，因此在潮湿基面上施作涂料防水层是地下工程常遇到的问题之一。目前一些有机或无机涂料在潮湿基面上均有一定的粘结力，可从中选用粘结力较大的涂料。在过于潮湿的基面上还可采用两种涂料复合使用的方法，即先涂无基防水涂料，利用其凝固快和与其他涂层防水层粘结好的特点，作成防水过渡层，而后再涂反应型、水乳型、聚合物水泥涂料。冬期施工时，由于气温低，用水乳型涂料已不适宜，此时宜选用反应型涂料。溶剂型涂料也适于在冬期施工使用，但由于涂料中溶剂挥发会给环境造成污染，故不宜在封闭的地下工程中使用。聚合物水泥防水涂料分为I型和Ⅱ型两个产品，Ⅱ型是以水泥为主的防水涂料，主要用于长期浸水环境下的建筑防水工程。与原规范相比，本条增加了在地下工程防水中应选用聚合物水泥防水涂料为Ⅱ型产品的规定。聚合物水泥防水涂料，是以丙烯酸酯等聚合物乳液和水泥为主要原料，加入其他外加剂制得的双组分水性建筑防水涂料。：聚合物水泥防水涂料发展很快，1990年上海从日本大关化学有限公司引进的自闭型聚合物水泥防水涂料，除具有聚合物水泥:121:防水涂料良好的柔韧性、粘结性、安全环保的特点外，还有独特的龟裂自封闭特性。目前国内已有200多项地下工程应用此种涂料，防水面积达1.8×10°m，最早施工的防水工程已有10年之久。国家现行标准《聚合物水泥防水涂料》JC/T894一2001标准即将修订，此涂料将被纳人其中。
    note: 合并重复提取片段
