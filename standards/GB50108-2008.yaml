  tables: []
  converted_tables:
  - raw: 地下工程种类繁多，施工方法各异，但除了全封闭防水结构以外，都应该根据自身的特点，设置完整的排水体系，有自流排水条件的工程和山岭隧道、坑道，应通过明沟或暗沟（管）将水排出工程以外，无自流排水条件的工程，如地铁、地下室、水底隧道等，应设置集水坑或集水井，将汇入坑（井）中的水用机械排出。渗排水、盲沟排水适用于无自流排水条件的地下工程，具体采用时应对地下水文及地质情况分析后确定。本章所指的盲沟是指具有过滤层的盲沟。热塑性塑料丝盲沟因其过滤与排水一体化，故纳人盲管范畴中。
