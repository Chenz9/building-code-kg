  text: '防水混凝土的冬期施工，应符合下列规定：: 16 :(拆模后)①图4.1.28固定模板用螺栓的防水构造1一模板：2结构混凝土；3-止水环；4—工具式螺栓；5--固定模板用螺栓；6一密封材料；7一聚合物水泥砂浆混凝土人模温度不应低于5℃；混凝土养护应采用综合蓄热法、蓄热法、暖棚法、掺化学外加剂等方法，不得采用电热法或蒸气直接加热法应采取保湿保温措施。'
