    content: 原规范只规定了密封材料的最大拉伸强度、最大伸长率和·138·拉伸压缩循环，给设计施工时的选材带来不便，这次修编，根据变形缝的使用功能和密封材料的弹性模量提出了一些性能指标，比较符合工程实际。变形缝所用密封材料，必须经受得起长期的压缩和拉伸、振动及疲劳等作用。本条规定密封材料应采用混凝土接缝用密封胶，密封胶应具有一定弹性、粘结性、耐候性和位移能力。同时，由于密封胶是不定型的膏状体，因此还应具有一定的流动性和挤出性。表5.1.9给出的密封胶的物理性能，主要是参考《混凝土建筑接缝用密封胶》JC/T881一2001提出的。密封胶按位移能力分为25和20两个级别，按拉伸模量分为低模量（LM)和高模量（HM)两个次级别，也称为弹性密封胶。施工现场应抽样复检拉伸模量、定伸粘结性和断裂伸长率等项目。选用时应注意，迎水面宜采用低模量的密封材料、背水面宜采用高模量的密封材料。V施工
