  chapter: 5 地下工程混凝土结构细部构造防水
  section: 5.2后浇带
  clause_no: 5.2.2
  text: 后浇带应在其两侧混凝土龄期达到42d后再施工；高层建筑的后浇带施工应按规定时间进行。
  is_abolished: false
