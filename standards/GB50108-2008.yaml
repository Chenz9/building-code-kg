  tables: []
  converted_tables:
  - raw: 本条增加了“塑料防水板铺设时的分区注浆系统”。1两幅塑料板的搭接宽度应视开挖面（基石）的平整度确定，铁路隧道设计规范确定，不应小于150mm，搭接太宽造成浪费，因此仍保持原规范搭接宽度为100mm的规定。为确保防水板的整体性，搭接缝不宜采用粘结法，因胶粘剂在地下长期使用很难确保其性能不变。采用焊接法时，应采用双焊缝，一方面能确保焊接效果，另一方面也便于充气检查焊缝质量。2下部防水板压住上部防水板这一规定是为了使防水板外侧上部的渗漏水能顺利流下，不至于积聚在防水板的搭接处而形成渗漏水的隐患。3设置分区注浆的目的是防止渗水到处乱窜。4分段设置防水板时，若两侧封闭不好，则地下水会从此处流出。由于防水板与混凝土粘结性不好，工程上一般采用设过渡层的方法，即选用一种既能与防水板焊接，又能与混凝土结合的材料作为过渡层，以保证防水板两侧封闭严密。
