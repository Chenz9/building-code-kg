- id: GB 50108-2008#9.3.2
  standard_code: GB 50108-2008
  chapter: 9 地下工程渗漏水治理
  section: 9.3治理材料
  clause_no: 9.3.2
  text: 工程结构注浆宜选用水泥类浆液，有补强要求时可选用改性环氧树脂注浆材料;裂缝堵水注浆宜选用聚氨酯或丙烯酸盐等化学浆液。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: should
    modal_words:
    - 宜
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 壁内注浆的目的是堵水与加固，封堵混凝土衬砌由于施工缺陷所造成的渗漏水。混凝土毕竟是密实性的材料，壁内缺陷很小，粗颗粒的材料如水泥浆液很难达到预期的堵水目的。因此必须选择渗透性能好的灌浆材料，使其在一定压力下渗入衬砌结构内起到堵水加固的作用。超细水泥由于其对环境不存在污染，可以灌入细度模数Mk=0.86的特细和粉细砂层以及宽度小于30μm的裂隙中，并在些地下工程渗漏水治理中应用，取得了较好的防水效果。所以本条推荐超细水泥和目前常用的环氧树脂、聚氨酯等浆液。
    note: 合并重复提取片段
  references: []
