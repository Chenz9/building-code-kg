- id: GB 50108-2008#3.1.1
  standard_code: GB 50108-2008
  chapter: 3 地下工程防水设计
  section: 3.1一般规定
  clause_no: 3.1.1
  text: 地下工程应进行防水设计，并应做到定级准确、方案可靠、施工简便、耐久适用、经济合理。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 地下工程种类繁多，其重要性和使用要求各有不同，有的工程对防水有特殊要求，有的工程在少量渗水情况下并不影响使用，在同一工程中其主要部位要求不渗水，但次要部位可允许有少量渗水。为避免过分要求高指标或片面降低防水标准，造成工程造价高或维修使用困难，因此地下工程防水应做到定级准确、方案可靠、经济合理。
    note: 合并重复提取片段
  references: []
  related_objects:
    component_types:
    - IfcSlab
    - IfcWall
    activity_types:
    - 地下防水设计
  conflicts: []
- id: GB 50108-2008#3.1.2
  standard_code: GB 50108-2008
  chapter: 3 地下工程防水设计
  section: 3.1一般规定
  clause_no: 3.1.2
  text: 地下工程防水方案应根据工程规划、结构设计、材料选择、结构耐久性和施工工艺等确定。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 地下工程的耐久性很大程度上取决于结构施工过程中的质量控制、质量保证以及使用过程中的维修与管理，为此建设部出版了《混凝土结构耐久性设计与施工指南》。该指南根据耐久性要求将结构设计使用年限分为100年、50年、30年三个等级，地下工程的设计寿命一般超过50年，因此本条增加了“应根据结构耐久性”做好防水方案的规定。
    note: 合并重复提取片段
  references: []
  related_objects:
    component_types:
    - IfcSlab
    - IfcWall
    activity_types:
    - 地下防水设计
  conflicts: []
- id: GB 50108-2008#3.1.3
  standard_code: GB 50108-2008
  chapter: 3 地下工程防水设计
  section: 3.1一般规定
  clause_no: 3.1.3
  text: 地下工程的防水设计，应根据地表水、地下水、毛细管水等的作用，以及由于人为因素引起的附近水文地质改变的影响确定。单建式的地下工程，宜采用全封闭、部分封闭的防排水设计；附建式的全地下或半地下工程的防水设防高度，应高出室外地坪高程500mm以上。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters:
  - name: 外地坪高程
    unit: mm
    condition: null
    min_value: 500.0
    max_value: 500.0
  tables: []
  converted_tables:
  - raw: 地下工程不仅受地下水、上层滞水、毛细管水等作用，也受地表水的作用，同时随着人们对水资源保护意识的加强，合理开发利用水资源的人为活动将会引起水文地质条件的改变，也会对地下工程造成影响，因此地下工程不能单纯以地下最高水位来确定工程防水标高。对单建式地下工程应采用全封闭、部分封闭的防排水设计（全封闭、部分封闭系指防水层的封闭程度）。对附建式的全地下或半地下工程的设防高度，应高出室外地坪高程500mm以上，确保地下工程的正常使用。
    note: 合并重复提取片段
  references: []
  related_objects:
    component_types:
    - IfcSlab
    - IfcWall
    activity_types:
    - 地下防水设计
  conflicts: []
