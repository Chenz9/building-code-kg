    content: 、4.3.9由于防水卷材产品标准的某些技术指标不能满足地下工程的需要，考虑到地下工程使用年限长，质量要求高，工程渗漏维修无法更换材料等特点，故规范除列出两大类可供选用的卷材品种外，并以其产品标准为基础，结合地下工程的特点和需要，经研究比较，制订出适应于地下工程要求的防水卷材物理性能，分别列于表4.3.8、4.3.9中。设计选用和对卷材进行质量检验时均应按两表的要求执行。在制定两表防水卷材物理性能指标时，参考了下列标准：弹性体改性沥青防水卷材GB18242；改性沥青聚乙烯胎防水卷材GB18967；自粘聚合物改性沥青聚酯胎防水卷材JC898；自粘橡胶沥青防水卷材JC840；三元乙丙橡胶防水卷材GB18173.1（代号JL1）；聚氯乙烯防水卷材GB12952；聚乙烯丙纶复合防水卷材GB18173.1（代号FS2）；高分子自粘胶膜防水卷材GB18173.1（代号FS,）。:116:在市场推出的产品中，有些品种是新产品，与传统的防水材料及施工技术有很大不同，因此选用这些材料应根据工程特点和施工条件而定。现对这些防水卷材的特性表述如下：1自粘改性沥青类防水卷材。青防水卷材”的延伸产品，因卷材的沥青涂盖料具有自粘性能，故称本体自粘卷材，其特点是采用冷粘法施工。2)自粘橡胶沥青防水卷材是一种以SBS等弹性体和沥青为基料，无胎体，以树脂膜为上表面材料或无膜（双面自粘），采用防粘隔离层的卷材，厚度以选择1.5mm或2.0mm为宜。这种卷材具有良好的接缝不透水性、低温柔性、延伸性、自愈性、粘结性，以及冷粘法施工等特点。：类在高聚物改性沥青防水卷材、合成高分子防水卷材的表面涂有一层自粘橡胶沥青胶料，或在胎体两面涂盖自粘胶料混合层的卷材，采用水泥砂浆或聚合物水泥砂浆与基层粘结（湿铺法施工），构成自粘卷材复合防水系统，其特点是：使胶料中的高聚物与水泥砂浆及后续浇筑的混凝土结合，产生较强的粘结力；可在潮湿基面上施工，简化防水层施工工序；采用“对接附加自粘封口条连接工艺，可使卷材接缝实现胶粘胶”的模式。2聚乙烯丙纶复合防水卷材。该卷材归类于高分子防水卷材复合片中树脂类品种，其特点是：由卷材与聚合物水泥防水粘结材料复合构成防水层，可在潮湿基面上施工。需要指出的是：聚乙烯丙纶复合防水卷材生产使用的聚乙烯必须是成品原生料；卷材两面热覆的丙纶纤维必须采用长纤维无纺布；卷材必须采用一次成型工艺生产；在现场配制用于粘结卷材的聚合物水泥防水粘结材料应是以聚合物乳液或聚合物再分散性粉末等材料和水泥为主要材料组成，不得使用水泥净浆或水泥与聚乙烯醇缩合物混合的材料。:117:表4.3.9项目及性能要求中的复合强度指标依据国家标准《高分子防水材料第一部分：片材》GB18173.1-一2006的FS2规定设置，该标准目前正在修订，标准修订后，此项指标及检测方法按新标准要求执行。3高分子自粘胶膜防水卷材。该卷材系在一定厚度的高密度聚乙烯膜面上涂覆一层高分子胶料复合制成的一种自粘性防水卷材，归类于高分子防水卷材复合片中树脂类品种（FS2），其特点是具有较高的断裂拉伸强度和撕裂强度，胶膜的耐水性好，一、二级的防水工程单层使用时也能达到防水要求，采用预铺反粘法施工，由卷材表面的胶膜与结构混凝土发生粘结作用。需要指出的是，卷材的搭接缝和接头要采用配套的粘结材料。
