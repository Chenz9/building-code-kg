  - raw: 后浇带部位在结构中实际形成了两条施工缝，对结构在该处的受力有些影响，所以应设在变形较小的部位。后浇带的间距是根据近年来工程实践总结出来的。采用补偿收缩混凝土时，底板后烧带的最大间距可延长至60m；超过60m时，可用膨胀加强带代替后浇带。加强带宽度宜为1～2m，加强带外用限制膨胀率大于0.015%的补偿收缩混凝土浇筑，带内用限制膨胀率大于0.03%、强度等级提高5MPa的膨胀混凝土浇筑。后浇带的宽度主要考虑：是对后浇带部位和外贴式止水带的保护，二是对落入后浇带内的杂物清理，三是对施工缝处理和埋设遇水膨胀止水条，故后浇带宽度宜为700～1000mm。
