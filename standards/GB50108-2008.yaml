- id: GB 50108-2008#5.5.2
  standard_code: GB 50108-2008
  chapter: 5 地下工程混凝土结构细部构造防水
  section: ''
  clause_no: 5.5.2
  text: 本条取消了原规范图5.5.2-1的防水构造形式，原因是这种做法在地下工程防水中的应用较少，且此做法只起防潮作用，不起防水作用，故予以取消。：146：预留通道接头是防水的薄弱环节之一，这不仅由于接头两边的结构重量及荷载可能有较大差异，从而可能产生较大的沉降变形，而且由于接头两边的施工时间先后不一，其间隔可达几年之久。条文中的两种防水构造做法，既能适应较大沉降变形，同时由于遇水膨胀止水条、可卸式止水带、嵌缝材料等均是在通道接头完成后才设置的，所以比较适合通道接头防水这种特殊情况。
