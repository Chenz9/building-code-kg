  text: 锚喷支护用作工程内衬墙时，应符合下列规定：宜用于防水等级为三级的工程；喷射混凝土宜掺人速凝剂、膨胀剂或复合型外加剂、钢纤维与合成纤维等材料，其品种及掺量应通过试验确定；3喷射混凝土的厚度应大于80mm，对地下工程变截面及轴线转折点的阳角部位，应增加50mm以上厚度的喷射混凝土；喷射混凝土设置预埋件时，应采取防水处理；喷射混凝土终凝2h后，应喷水养护，养护时间不得少于14d。
