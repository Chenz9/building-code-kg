    content: 本条说明如下：保温隔热材料品种较多，密度大小悬殊，模压聚苯乙烯板材密度为15～30kg/m²，而加气混凝土类板材密度为400~600kg/m。为了减轻荷载，隔热材料一般选用喷涂硬泡聚氨酯和聚苯乙烯泡沫塑料板，也可采用其他保温隔热材料。2目前国内耐根穿刺防水材料有十多种，有铅锡锑合金防水卷材、复合铜胎基SBS改性沥青防水卷材、铜箔胎SBS改性沥青防水卷材、铝箔胎SBS改性沥青防水卷材、聚乙烯胎高聚物改性沥青防水卷材、聚氯乙烯防水卷材（内增强型）等品种，《种植屋面工程防水技术规程》JGJ155列出了这几种材料的物理性能，设计选用时可参考。目前，我国正在编制耐根穿刺防水材料试验方法标准，待发布后应按标准规定执行；在发布前，设计选用耐根穿刺防水材料时，生产厂家需提供相应的检验报告或三年以上的种植工程证明。3排水材料的品种较多，为了减轻荷载，应尽量选用轻质材料。本条列举了两种排水材料，供参考。这两种排水材料的性能见表7、表8。表7凸凹型排水板物理性能单位面积延伸率凸凹高度抗压强度抗拉强度项目质量（g/m²）(mm)(kN/m²)(N/10mm)(%)性能要求500～900≥7.5≥150≥200≥25表8网状交织排水板物理性能抗压强度表面开孔率耐酸碱项目空率(%)通水量(cm/s)(kN/m²)(%)稳定性性能要求95～9785～ 90稳定.134:Ⅱ绿化改造
