  tables: []
  converted_tables:
  - raw: 采用地下连续墙既做工程周围土体的支护，又兼做地下工程的内衬时，作为永久性结构的一部分，无疑对降低工程造价、缩短工程周期、充分利用地下空间都极为有利。但由于地下连续墙的钢筋混凝土是在泥浆中浇筑，影响混凝土质量的因素较多，从耐久性考虑较不利，加上连续墙幅间接缝的防水处理难度较大，从耐久性要求，通常不适合防水等级为一级的地下工程。但也不强行限制，因为不少地铁车站已采用单层地下墙为主体结构，且防水效果尚好，尤其在强调采用高分子稳定浆液作为护壁泥浆时，混凝土的质量，包括耐久性得到提高，故规定为不宜用作防水等级为一级的地下工程中。根据修改后防水等级适用范围的规定，有的工程各部位防水等级可有差别，故不能说采用地下连续墙做内衬的整:160:个工程均为防水等级为二级以下的工程。当其工程顶、底板的防水等级要求较高，而墙面防水等级较低或受施工环境限制时，则可使用地下连续墙直接作主体结构的墙体。地下连续墙直接作为主体结构的墙体时，需要有一定的厚度才能保证工程达到所要求的防水等级。根据近年来工程实践经验，其厚度以不小于0.6m为宜。成槽精度越高，对防水越有利，但施工难度加大，根据目前的施工水平提出“整修后墙面平整度的允许偏差不宜大于50mm”的要求。幅间接缝是防水的薄弱环节，根据工程实践提出两种较好的形式。锁口管的质量也是影响幅间接缝防水质量的一个因素，所以条文中也对此作了相应要求。在强调工程耐久性与设计使用寿命的今天，单层地下连续墙直接用于防水等级为一级的地下工程的墙体的做法是不符合耐久性设计要求的，因此将“不宜”改为“不应”，并规定只有用“高分子聚合物作为护壁泥浆”才可以采用地下连续墙作为单墙结构墙体。有关水泥用量的提法已不合适，应提胶凝材料才合理。由于水泥可以是纯硅，也可以为普硅，强度等级可以为42.5级、52.5级（尤其沿海地区）：原规定水泥用量超400kg/m，绝对没必要，强度会太高。实践表明，胶凝材料≥400kg/m²较为合适，原先落度规定200土20mm，应取消上限，目前为配置高流态的混凝土，落度可以大于250mm，使其流动性、保水性都好，且宜提扩展度指标，而随着未来深基础工程增多，地下墙超深时必须使用高落度、大扩展度的自密实混凝土。顶板，底板的防水措施与本节关系不大，故作删除。
