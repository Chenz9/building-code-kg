  - raw: 本条对文字的表述做了一些修改，以便表达得更明确。国外近年设计弹性橡胶密封垫时，对原规范公式（8.1.6)有所突破，即密封垫断面中的孔有越来越多、呈蜂窝状的趋势。这时，规范公式(8.1.6)A=（1～1.15)A。，其中的系数远大于“1～1.15”。由于尚未成为主流，这次对此将“应”改为“宜”，更为确切。另外，需要补充的是：由于对深（浅）埋隧道要求的埋深水头分别为实际埋深水头的2倍和3倍，故设计时应规定密封垫的技术要求，即它能适应的最大接缝张开量、错位量和埋深水头。而这些技术要求又应通过目前已普遍确认的模拟管片一字缝、十字缝水密性试验检测验证。
