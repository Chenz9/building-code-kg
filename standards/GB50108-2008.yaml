  text: 明挖法地下工程防水施工时,应符合下列规定，1,地下水位应降至工程底部最低高程500mm以下。降水作业应持续至回填完毕,2。工程底板范围内的集水井，在施工排水结束后应采用微膨胀混凝土填筑密实 3，工程顶板.侧墙留设大型孔洞时,应采取临时封闭,遮盖措施。
