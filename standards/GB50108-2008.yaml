    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 、4.6.2金属板防水层由于重量大，造价高，般的下防水工程中很少采用，但对于一些抗渗要求较高、且面积较小的工程，如冶炼厂的浇铸坑、电炉基坑等，可采用金属防水层。在一些受施:127:工工艺限制并兼有防水防冲撞等功能需要的地下工程也采用金属板防水层。作为传统的防水层，早期的沉管隧道外包防水层几乎均由它包揽。其厚度与材质，由沉管所处的水下地层水文地质等环境作用条件经试验后，确定不同钢板的腐蚀速率，进而设计选定，同时也可加涂防锈涂层或设阴极保护。钢板防水层可与混凝土中的钢筋连接成一体。如今随着工程塑料，高分子防水材料的不断面世，它的应用在减少，但由于它有可以替代模板，强度高等长处，故仍在很多海底沉管隧道工程的底板使用（包括我国香港、广州新建的沉管隧道）。同时，为防止海水腐蚀，往往还设阴极保护。金属板包括钢板、铜板、铝板、合金钢板等。金属板和焊条应由设计部门根据工艺要求及具体情况确定，故对选材问题规范不作限制。金属板防水层采用焊接拼接，检验焊缝质量是至关重要的。对外观检查和无损检验不合格的焊缝，应予以修整或补焊。
    note: 合并重复提取片段
