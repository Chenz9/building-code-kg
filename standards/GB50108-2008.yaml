  text: 涂料防水层应包括无机防水涂料和有机防水涂料。无机防水涂料可选用掺外加剂、掺合料的水泥基防水涂料、水泥基渗透结晶型防水涂料。有机防水涂料可选用反应型、水乳型、聚合物水泥等涂料。
