    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 近年来因桩头处理不好引起工程渗漏水的情况时有发生，分析其原因，主要是在以下几个部位形成的：桩头钢筋与混凝土间；底板与桩头间的施工缝：混凝土桩身与地基土两者膨胀收缩不一致形成缝隙。因此本条规定了桩头所用防水材料的性能，并强调桩头防水应与主体防水连成一体，形成整体防水性。
