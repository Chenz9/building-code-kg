  text: 地下连续墙用作主体结构时，应符合下列规定：1单层地下连续墙不应直接用于防水等级为级的地下工程墙体。单墙用于地下工程墙体时，应使用高分子聚合物泥浆护壁材料。2墙的厚度宜大于600mm。.73:3应根据地质条件选择护壁泥浆及配合比，遇有地下水含盐或受化学污染时，泥浆配合比应进行调整。：4单元槽段整修后墙面平整度的允许偏差不宜大于50mm。5浇筑混凝土前应清槽、置换泥浆和清除沉渣，沉渣厚度不应大于100mm，并应将接缝面的泥皮、杂物清理干净。6钢筋笼浸泡泥浆时间不应超过10h，钢筋保护层厚度不应小于70mm。7幅间接缝应采用工字钢或十字钢板接头，锁口管应能承受混凝土浇筑时的侧压力，浇筑混凝土时不得发生位移和混凝土绕管。8胶凝材料用量不应少于400kg/m，水胶比应小于0.55，落度不得小于180mm，石子粒径不宜大于导管直径的1/8。浇筑导管理人混凝土深度宜为1.5～3m，在槽段端部的浇筑导管与端部的距离宜为1～1.5m，混凝土浇筑应连续进行。冬期施工时应采取保温措施，墙顶混凝土未达到设计强度50%时，不得受冻。9支撑的预埋件应设置止水片或遇水膨胀止水条（胶），支撑部位及墙体的裂缝、孔洞等缺陷应采用防水砂浆及时修补；墙体幅间接缝如有渗漏，应采用注浆、嵌填弹性密封材料等进行防水处理，并应采取引排措施。10底板混凝土应达到设计强度后方可停止降水，并应将降水井封堵密实。11墙体与工程顶板、底板、中楼板的连接处均应凿毛，并应清洗干净，同时应设置1～2道遇水膨胀止水条（胶），接驳器处宜喷涂水泥基渗透结晶型防水涂料或涂抹聚合物水泥防水砂浆。
