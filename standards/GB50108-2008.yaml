    max_value: 42.0
  tables: []
  converted_tables:
  - raw: 后浇带应在两侧混凝土干缩变形基本稳定后施工，混凝土的收缩变形一般在龄期为6周后才能基本稳定，在条件许可时，间隔时间越长越好。高层建筑后浇带的施工除满足上述条件外，尚应符合国家现行标准《高层建筑混凝土结构技术规程》JGJ3—2002第13.5.9条的要求，对高层建筑后浇带的施工应按规定时间进行。这里所指按规定时间应通过地基变形计算和建筑物沉降观测，并在地基变形基本稳定情况下才可以确定。高层建筑一般是按照上部结构、基础与地基的共同作用进行变形计算，其计算值不应大于地基变形允许值；必要时，还需要分别预估建筑物在施工期间和使用期间的地基变形值。测定建筑地基沉降量、沉降差及沉降速度，是一种十分直观的方法。一般情况下，若沉降速度小于0.01～0.04m/d时，可认为已进入稳定阶段，具体取值宜根据各地区地基土的压缩性确定。如工程需要适当提前浇筑后浇带混凝土，应采取有效措施，并取得设计单位同意。
