  - table_id: 表3.3.1
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 地下工程的防水可分为两部分，一是结构主体防水，二是细部构造特别是施工缝、变形缝、诱导缝、后浇带的防水。目前结构主体采用防水混凝土结构自防水其防水效果尚好，而细部构造，特别是施工缝、变形缝的渗漏水现象较多。针对目前存在的这种情况，明挖法施工时不同防水等级的地下工程防水方案分为四部分内容，即主体、施工缝、后浇带、变形缝（诱导缝）。对于结构主体，目前普遍应用的是防水混凝土自防水结构，当工程的防水等级为一级时，应再增设两道其他防水层，当工程的防水等级为二级时，可视工程所处的水文地质条件、环境条件、工程设计使用年限·95·等不同情况，应再增设一道其他防水层。之所以做这样的规定，除了确保工程的防水要求外，还考虑到下面的因素：即混凝土材料过去人们一直认为是永久性材料，但通过长期实践，人们逐渐认识到混凝土在地下工程中会受地下水侵蚀，其耐久性会受到影响。现在我国地下水特别是浅层地下水受污染比较严重，而防水混凝土文不是绝对不透水的材料，据测定抗渗等级为P8的防水混凝土的渗透系数为（5～8）×10-1°cm/s。所以地下水对地下工程的混凝土结构、钢筋的侵蚀破坏已是一个不容忽视的问题。防水等级为一、二级的工程，多是一些比较重要、投资较大、要求使用年限长的工程，为确保这些工程的使用寿命，单靠防水混凝土来抵抗地下水的侵蚀其效果是有限的，而防水混凝土和其他防水层结合使用则可较好地解决这一矛盾。对于施工缝、后浇带、变形缝，应根据不同防水等级选用不同的防水措施，防水等级越高，拟采用的措施越多，一方面是为了解决目前缝隙渗漏率高的状况，另一方面是由于缝的工程量相对于结构主体来说要小得多，采用多种措施也能做到精心施工，容易保证工程质量。暗挖法与明挖法不同处是工程内垂直施工缝多，其防水做法与水平施工缝有所区别。这次修编在表3.3.1-1主体结构防水措施中增加了膨润土防水材料，施工缝防水措施中增加了预埋注浆管和水泥基渗透结晶型防水材料。之所以这样修改，是因为近年来膨润土防水材料在地下工程尤其是城市地铁、房建地下室防水中的应用实例越来越多，如北京地铁、南京地铁、成都地铁、上海金茂大厦等，取得了较好的防水效果和实践经验，并制定了行业标准《钠基膨润土防水毯》JG/T193。预埋注浆管也是近年来处理施工缝漏水的新增措施。施工缝在使用过程中如果发生渗漏水，可通过预埋注浆管直接注浆。从应用实例来看，效果比较理想，因此增补了这方面的内容。水泥基渗透结晶型防水材料在施工缝中的应用也比较多，普遍反映防水效果较好。但值得注意的是二级及以上防水工程中单独采用水泥基渗透结晶型防水涂料防水要慎重对待。调研过程中，设计、施工单位普遍反映遇水膨胀止水条在新建工程变形缝使用时，防水效果不明显，因此在变形缝防水措施中取消了“遇水膨胀止水条”，保留了原有的其他防水措施。调研过程中，专家和施工单位反映，防水砂浆不能单独用于防水等级为一至二级的地下工程的主体防水，因为防水砂浆是刚性防水材料，一旦结构发生变形，砂浆防水层将随结构开裂而开裂，从而失去防水作用，因此应在主体结构防水措施中将防水砂浆删除。考虑到国内在地下工程防水中，基本上采用聚合物防水砂浆和掺外加剂、掺合料的防水砂浆，与普通砂浆相比，防水性能有较大提高，因此将“防水砂浆”这一措施保留。2006年11月，建设部科技发展促进中心向全国推行了“FS101、FS102刚性防水技术”项目，这项成果是在掺FS1oi防水混凝土主体结构的基础上抹掺FS102的防水砂浆，近几年在北方地区多项地下工程防水中应用，取得了较好的防水效果。但在选用这项技术时要根据工程地质情况、工期要求综合考虑。暗挖法地下工程主体结构包括复合式衬砌（叠合式）、离壁式（分离式）衬砌、贴壁式（复合式）衬砌、喷射混凝土衬砌和衬套等几种形式。原规范表3.3.1-2主体防水一栏中，是按衬砌结构形式来考虑防水措施的，容易产生误解，这次修编主体结构防水措施是按防水材料选用，一是与表3.3.1-1协调，二是便于操作，使设计者对防水措施一目了然。在选用两表进行地下工程防水设计时，应符合“防、排、截、堵相结合，刚柔相济，因地制宜，综合治理”的原则，两种以上防水措施的复合使用，要根据结构特点、材料性能、施工可操作性进行有选择性的复合使用，达到有效互补、增强防水的目的。此条只讲了明挖法和暗挖法施工的地下工程的不同防水等级的防水措施，采用其他施工方法施工的地下工程不同防水等级的防水措施拟结合其施工特点放在本规范第8章各节内叙述。需要指出的是，由于我国南北地区环境条件差异较大，对干旱·97·.少雨和土壤渗透性较好的地区，在进行地下工程防水设计和防水材料选择时，可根据实际情况酌情考虑。
