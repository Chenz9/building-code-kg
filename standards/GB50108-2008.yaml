  parameters: []
  tables:
  - table_id: 表4.4.8
    type: parameter_table
    note: 条件→参数查表（OCR合并正文，行列结构缺失）
    content: 表4.4.8-2中分无机涂料和有机涂料两大类分别规定了其性能指标要求。要想在地下工程中充分发挥防水涂料的防水作用，一是要有可操作时间，可操作时间过短的涂料将不利于大面积防水涂料施工；二是要有一定的粘结强度，特别是在潮湿基面（基面饱和但无渗漏水）上，粘结强度一定要高，因地下工程施工工期较紧，不允许基面干燥后再进行防水涂料施工。抗渗性是防水涂料最重要的性能，尤其是水泥基渗透结晶型防水涂料的二次抗渗性能，充分体现了这类材料堵塞混凝土结构孔隙的能力。对有机涂料表中分别规定涂膜在砂浆迎水面、背水面所应达到的值；有机防水涂料的特点是有较好的延伸率，根据目前在地下工程中应用较广的几种防水涂料提出了这一指标值，考虑地下工程的使用要求，此处提出的是浸水后的延伸率值；耐水性也是用于地下工程中的涂料需要强调的个指标，因地下工程处于地下水的包围之中，如涂料遇水产生溶胀现象，性能降低，就会失去其应有的防水功能。目前国内尚无适用于地下工程防水涂料耐水性试验的方法和标准，表中的方法和标准是根据地下工程使用要求制定的；实干时间也是实际施工中应注意的指标，它也是根据目前材料的实际情况提出的。在进行两表数据的制定时，参考了下列标准：聚氨酯防水涂料GB/T19250；聚合物乳液建筑防水涂料JC/T864；聚合物水泥防水涂料JC/T894；聚氯乙烯弹性防水涂料JC674；水泥基渗透结晶型防水材料GB18445。IV施工4,4.9涂料施工前必须对基层表面的缺陷和渗水进行认真处理。因为涂料尚未凝固时，如受到水压力的作用会使涂料无法凝固或形成空洞，形成渗漏水的隐患。基面干净、无浮浆，有利于涂料均匀涂敷，并与基面有一定的粘结力。基面干燥在地下工程中很难做到，所以此条只提出无水珠、不渗水的要求。本次修编，保留了原来的内容，只是将部分文字进行了修改。
