    content: 施工缝的防水质量除了与选用的构造措施有关外，还与施工质量有很大的关系，本条根据各地的实践经验，对原条文进行了修改。1水平施工缝防水措施中增加了涂刷水泥基渗透结晶型防水涂料的内容，做法是在混凝土终凝后（一般来说，夏季在混凝土浇筑后24h，冬季则在36～48h，具体视气温、混凝土强度等级而定，气温高、混凝土强度等级高者可短些），立即用钢丝刷将表面浮浆刷除，边刷边用水冲洗干净，并保持湿润，然后涂刷水泥基渗透结晶型防水涂料或界面处理剂，目的是使新老混凝土结合得更好。如不先铺水泥砂浆层或铺的厚度不够，将会出现工程界俗称的“烂根”现象，极易造成施工缝的渗漏水。还应注意铺水泥砂浆层或刷界面处理剂、水泥基渗透结晶型防水涂料后，应及时浇筑混凝土，若时间间隔过久，水泥砂浆已凝固，则起不到使新老混凝土紧密结合的作用，仍会留下渗漏水的隐患。施工缝凿毛也是增强新老混凝土结合力的有效方法，但在垂直施工缝中凿毛作业难度较大，不宜提倡。：本条规定的施工缝防水措施，对于具体工程而言，并不是所列的方法都采用，而是根据具体情况灵活掌握，如采用水泥基渗透结晶型防水涂料，就不一定采用界面处理剂，但水泥砂浆是要采用·的，这是保证新老混凝土结合的主要措施。2遇水膨胀止水条（胶），国内常用的有腻子型和制品型两种。腻子型止水条必须具有一定柔软性，与混凝土基面结合紧密，在完全包裹的状态下使用才能更好地发挥作用，达到理想的止水效果。工程实践和试验证明，腻子型止水条的硬度（用C型微孔材料硬度计测试）小于40度（相当邵氏硬度10度左右）时，其柔软度方符合工程使用要求，如硬度过大，安装时与混凝土基面很难密贴，浇注混凝土后止水条与混凝土界面间留下缝隙造成渗水隐患。:108:关于遇水膨胀止水条的缓胀性，目前有两种解决方法，一是采用自身具有缓胀性的橡胶制作，二是在遇水膨胀止水条表面涂缓胀剂。在选用遇水膨胀止水条时，可将21d的膨胀率视为最终膨胀率。在完全包裹约束状态的（施工缝、后浇带、穿墙管等）部位，可使用腻子型的遇水膨胀止水条，腻子型的遇水膨胀止水条在水温23℃士2℃和蒸馏水中测得的技术性能如表2所示。表2腻子型遇水膨胀止水条技术性能项目技术指标≤40度硬度（C型微孔材料硬度计）7d膨胀率≤最终膨胀率的60%最终膨胀率(21d)≥220%耐热性(80℃×2h)无流滴低温柔性（-20℃×2h，绕$10圆棒）无裂纹耐水性(浸泡15h)整体膨胀无碎块目前，国内应用较多的遇水膨胀止水条（胶）产品，其膨胀率大多在200%左右。3中埋式止水带只有位置埋设准确、固定牢固才能起到止水作用。
