  text: 当保温板材采用粘贴法时，应符合下列规定： 1 当采用专用胶粘剂粘贴保温板材时，保温板材与基层在 天沟、檐沟、边角处应满涂胶结材料，其他部位可采用点粘或条 粘，并应使其互相贴严、粘牢，缺角处应用碎屑加胶粘剂拌匀填 补严密； 2 当采用有机胶粘剂粘贴保温板材时，施工环境温度应符 合本规范表6.1.5 的规定； 3 胶粘剂厚度不应小于5mm; 4 保温板材铺设后，在胶粘剂凝固前不得上人踩踏； 5 保温层胶粘剂凝固后宜尽快施工保护层，当不能及时进 行保护层施工时，应在保温板材上铺设压重材料。
