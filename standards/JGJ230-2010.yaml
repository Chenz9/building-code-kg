  - raw: 对于开敞式保护层的倒置式屋面，当有雨水进入保温材料下部时，一般情况可完全蒸发掉，而进入封闭式保护层屋面保温层中的雨水可能蒸发不完全；当室外气温低，会在保护层与保温材料交界面及保温材料内部，出现结露；保温材料的长期使用老化，吸水率增大。因此，应考虑、10 ～20年后，保温层的导热系数会比初期增大。所以，实际应用中应控制保温层湿度，并适当增大保温层厚度作为补偿；另外保温层受保护层压置后厚度也会减小。故本规程规定保温层的设计厚度按计算厚度增加不低于25%取值。保温层的厚度如果太薄，不能对防水层形成有效的保护作用，失去了倒置式屋面最根本的意义，而且在施工中和保护层压置后保温层容易损坏，故保温层应保证一定的厚度，本规程规定不得小于25mmo为确保倒置式屋面的保温性能在保温层积水、吸水、结露、长期使用老化、保护层压置等复杂条件下持续满足屋面节能的要求，有必要将此条列为强制性条文。
