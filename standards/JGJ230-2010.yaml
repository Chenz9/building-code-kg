- id: JGJ 230-2010#7.2.2
  standard_code: JGJ 230-2010
  chapter: 7 既有建筑倒置式屋面改造
  section: ''
  clause_no: 7.2.2
  text: 既有建筑倒置式屋面改造设计应符合下列规定： 1 屋面改造设计应根据勘查报告或鉴定结论和建筑节能标 准要求进行； 2 当原有屋面防水层有效或经修补可达到设计使用要求时， 可作为一道防水层，并应再增设一道防水层； 3 当原有屋面防水层渗漏或保温层含水率较大时，应彻底 拆除并清理干净，再按正常倒置式屋面设计； 4 保温层宜选用聚苯乙烯泡沫塑料或硬泡聚氨醋等保温 材料； 5 屋面改造设计与既有建筑外立面的装饰效果应具有统 一性。
