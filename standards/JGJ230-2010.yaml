- id: JGJ 230-2010#3.0.6
  standard_code: JGJ 230-2010
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.6
  text: 参照国务院第393号令《建设工程安全生产管理条例》。3. o. 7按现行国家标准《建筑工程施工质量验收统一标准》GB 50300的规定，建筑工程施工质量验收时，对涉及结构安全和使用功能的重要分部工程应进行抽样检测。因此，屋面工程验收时，应检查屋面有无渗漏、积水和排水系统是否畅通，可在雨后或持续淋水2h 后进行。有可能作蓄水检验的屋面，其蓄水时间不应少于24h。检验后应填写安全和功能检验（检测）报告，作为屋面工程验收的文件和记录之一。3. o. 8目前部分屋面的渗漏以致返修，管理维护不善是原因之一。不少工程交付使用后，又在屋面上增设电视天线，太阳能热水器等设施，尤其是高层建筑中增设广告招牌，对屋面防水层造成局部损坏，导致屋面发生渗漏现象。排水系统不但交工时要畅通，在使用过程中仍要经常检查，防止由于堵塞而造成屋面长期积水和大雨时溢水。为此，要求建筑物使用者加强管理和维护使之经常化、制度化，以利及时发现问题及时进行维修，延长使用寿命。材料4.1一般规定
