- id: JGJ 230-2010#8.4.6
  standard_code: JGJ 230-2010
  chapter: 8 质量验收
  section: ''
  clause_no: 8.4.6
  text: 坡屋面保温材料的下滑力较大，如不固定牢固，会造成整体下滑，严重的会引起重大质量事故和人身伤亡安全事故，应高度重视。8. 4. 7屋面保温层施工应事先制定专项施工方案，施工方案应科学合理，保温层的施工质量应保证表面平整，坡向正确，铺设牢固、缝隙严密，对现场配料还应检查配料记录。8.5细部构造工程8. 5.1 屋面的檐口、檐沟和天沟、女儿墙和山墙、水落口、变形缝、伸出屋面管道、屋面出人口、反梁过水孔、设施基座等部位，是屋面工程中最容易出现渗漏的薄弱环节。据调查表明有70% 的屋面渗漏是由于细部构造的防水处理不当引起的，所以，对这些部位均应进行防水增强处理，并作重点质量检查验收。8. 5. 4天沟、檐沟的排水坡度和排水方向应能保证雨水及时排走，充分体现防排结合的屋面工程设计思想。如果屋面长期积水或干湿交替，在天沟等低洼处滋生青苔、杂草或发生霉烂，最后导致屋面渗漏。8.6 保护层工程8. 6.1验收内容主要针对倒置式屋面大量采用的各种材料不同形式保护层施工的质量验收。
