    content: 表4. 3. 3的规定。表4.3.3挤塑聚苯乙烯泡沫塑料板主要物理性能性能指标试验项目试验方法Xl50X2SOX350X600现行国家标准《硬质压缩强度，kPa二主150二三250二:o,:j50二主600泡沫塑料压缩性能的测定》GB/T88B现行国家标准《绝热导热系数（25℃）．材料稳态热阻及有关主二0.030三三0.030王三0.030三三0.030W/(m•K)特性的测定防护热板法》GB/T10294现行国家标准《硬质吸水率（V/V).%<1.5三l.0三三1.0＝二1.0泡沫塑料吸水率的测定》GB/T8810现行国家标准《泡沫表观密度，kg/m3二＞－20主主25二主30二三40塑料及橡胶表观密度的测定》GB/T6343现行国家标准《硬质尺寸稳定性泡沫塑料尺寸稳定三二l.5ζ］. 5:S;:l. 5<].5(70℃. 48h), %性试验方法》GB/T 8811水蒸气渗透系数现行行业标准《硬质泡(23℃，RH50%),4二3.5运：t三二3主二2沫塑料水蒸气透过性ng/(m • s •Pa)能的测定》QB/T2411现行国家标准《建筑燃烧性能等级不低于B2级材料及制品燃烧性能分级））GB 8624
  converted_tables:
  - raw: 挤塑聚苯乙烯泡沫塑料（XPS）的表观密度一般随压缩强度的增高而增大，但不是简单的线性关系，由于这类保温材料的其他性能与表观密度没有直接关系，而是由其独特的分子构造所决定的，而不像其他两种保温材料（EPS 、PU）的性能与表现密度那么直接，因此本表只给出一个较宽泛的密度指标。此处对XPS 尺寸稳定性均要求不大于1.5% ，该指标对于低强度的XPS 板（Xl50 ）来说严于《绝热用挤塑聚苯乙烯泡沫GB/T10801. 2塑料（XPS）》2002要求的2.0% ，对于X600的XPS 来说则宽于该标准要求的1.0% 。由于倒置式屋面构造或者采用细石混凝土保护层，且增设钢丝网加强，对XPS的尺寸稳定性要求不高，或者是采用块材或卵石保护层，采用的是松铺方式，对尺寸稳定性的要求也可以放宽；对于高强XPS主要用于重型荷载，这种场合下的保护层一般都是钢筋混凝土板，XPS 板的尺寸稳定性已不重要。因此，从实际应用角度，本表的尺寸稳定性要求不大于1.5% 已经足够。此处采用《建筑材料燃烧性能分级方法》GB8624 -1997的分级标准和相应的检测方法，主要是公安部公通宇［2009]46号文件：关于印发《民用建筑外保温系统及外墙装饰防火暂行规定》的通知及暂行规定中对于屋面保温材料的燃烧性能仍采用GB 8624 -1997的分级标准，这个暂行规定没有采纳已经颁布实施的最新版本《建筑材料及制品燃烧性能分级》GB86242006的分级标准。作为应用型标准，本规程与相关最新的工程标准或规定相协调，随后章节的其他保温材料亦然。根据不同使用条件，挤塑型聚苯乙烯泡沫塑料板按照压缩强度分为若干等级。但对于屋面工程，挤塑型聚苯乙烯泡沫塑料板的压缩强度，一般不上人和上人屋面采用Xl50级，中型荷载屋面可通过荷载计算采用X250或X350级，重型荷载如行车屋面采用X600级或通过荷载计算确定，所以本规范没有罗列挤塑型聚苯乙烯泡沫塑料板的全部产品类型。4. 3. 4在性能满足设计要求前提下，模塑聚苯乙烯也沫塑料板也可用于倒置屋面工程，但要严格控制其吸水率。根据使用条件和工程需要，按照压缩强度来确定，Ill 型～VI型的模塑型聚苯乙烯泡沫塑料板可用于倒置式屋面工程，I型和H 型模塑型聚苯乙烯泡沫塑料板由于压缩强度太低而不适于屋面工程。
