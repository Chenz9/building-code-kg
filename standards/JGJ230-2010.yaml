  section: ''
  clause_no: 6.5.4
  text: '板块材料作保护层时的施工要求。1 为保证板块材料保护层铺设后均匀着力于下部构造，可设置结合层，可选用砂或水泥砂浆，禁止干摆干铺。为保证屋面工程排水顺畅、不积水，在铺设板状材料保护层时也应按设计坡度挂线、抄平，防止在铺设时出现反坡、倒流水等现象。还应保证铺砌的块体横平竖直，板块接缝对齐，以保证保护层的保护作用以及屋面工程美观。为保证铺设质量，采用砂结合层时，砂应适当洒水（最佳含水率）压实，并用刮尺刮平，以防止板块松动及保证平整度。板块拼缝宽度宜控制为lOmm，以方便句缝处理和保证美观。为保证平整度和排水坡度，在板块铺设完成后，还应洒水并轻拍压平，同样也保证块材不会翘角、空鼓。板缝处理时应先用砂将缝填至一半高度，然后用1: 2水泥砂浆勾成凹缝，保证缝内元空隙，保证勾缝质量。采用砂结合层时，在使用过程中，因雨水等冲刷，会造成结合层砂流失而导致保护层破坏，为防止上述情况发生，应在保护层四周500mm 范围内用低强度等级水泥砂浆作为结合层。为防止温度应力造成块材保护层接缝处开裂，板块保护层宜留设纵横间距不大于lOm的分格缝，缝宽不宜小于20mmo6. 5. 5采用整体现浇混凝土保护层时的施工要求。混凝土收水后应进行二次压光，以切断和封闭漉凝土中的毛细管，提高其密实性和抗渗性。抹压面层时，在表面洒水、加水泥浆或撒干水泥，会造成表面龟裂脱皮，降低防水效果。为防止温度应力造成混凝土保护层裂缝，应按规定留设分格缝；为保证每个分格内的混凝土（砂浆）不出现冷缝、分层，每格内的混凝土（砂浆）应连续浇筑。为保证每个分格内的保护层可自由变形，防止产生温度应力裂缝，若保护层配筋时，钢筋网片应在分格缝处断开。养护是保证混凝土保护层质量的关键因素之一，为保证保护层质量，在保护层浇筑完成后应及时养护并不少于7d ，最后清理分格缝。'
