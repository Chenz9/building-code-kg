  converted_tables:
  - raw: 硬泡聚氨醋由于具有较低的导热系数，保温性能优异，适合用于屋面保温工程。尤其是聚氨醋硬泡具有很高的闭孔率（一般都可大于90% ），所以具有良好的防水性能和不透水性，非常适合用于倒置式屋面工程。喷涂硬泡聚氨醋还具有保温层整体性好，可以形成整体保温防水层，有助于提高倒置式屋面工程的整体保温防水性能。鉴于屋面工程的使用特点，用于屋面工程的硬泡聚氨醋保温材料的力学性能主要是压缩强度，而拉f申强度、拉伸粘结强度等力学性能对屋面工程用保温材料并不是主要力学指标，所以本规程对硬泡聚氨醋保温材料不列出拉伸强度、拉伸粘结强度等力学性能指标要求。对于喷涂硬泡聚氨醋，由于其形成整体保温层，为了保证其整体性，还要规定其断裂延伸率指标。
