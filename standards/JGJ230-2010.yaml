  text: 倒置式屋面的保温材料可选用挤塑聚苯乙烯泡沫塑料板、硬泡聚氨醋板、硬泡聚氨酣防水保温复合板、喷涂硬泡聚氨醋及泡沫玻璃保温板等。模塑聚苯乙烯泡沫塑料板的吸水率应符合设计要求。
