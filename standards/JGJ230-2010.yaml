  - raw: 根据具体工程的屋面形式、建筑功能、环境、气候条件、屋面构造和经济条件不同，进行具体设计。防水材料、隔离层材料和保温层材料的选用要防止假冒伪劣产品，并要选择合理的、经济的材料，要体现倒置性屋面保温层对防水层的保护作用。屋面排水系统要求高，保温层不能有积水，因此要求设计出设计详图。5.1. 2倒置式屋面基本构造是大量实际工程的常规做法。隔离层的设置应根据选择的防水材料和保温层的材料相容性和保护层材料的种类来决定的。倒置式屋面一般不需设隔汽层。5.1. 3为防止倒置式屋面保温层长期积水，使积水能够顺畅排走，需适当加大倒置式屋面的坡度，因此作出此项规定。5.1. 4防滑措施主要是防止防水层、保温层和保护层的向下滑动；防滑条的材料和形式由设计具体确定，其间距根据屋面坡度和保温材料种类确定；防滑条设计应避免采用断开保温层的导热性材料；并应避免保温层形成冷热桥。5.1. 5寒冷地区的采暖建筑，宜采用卵石排水保护层或种植排水保护层；严寒地区的采暖建筑，宜采用松铺混凝土板块排水保护层；炎热地区或冬季较冷夏天较热需要空调降温的建筑，宜采用卵石排水保护层或松铺混凝土板块排水保护层。硬泡聚氨醋保温层宜采用封闭式保护层，多雨地区不宜采用封闭式保护层。5. 1. 6倒置式屋面不会产生水汽积聚，所以可不设置透气孔式排气槽。5.1. 7防止天沟积水，参照了《屋面工程技术规范》GB503452004第4.2.4条的规定。5. 1. 8参照了《屋面工程技术规范》GB50345 -2004第4.2.12条的规定，并强调了通过计算确定。5. 1. 9倒置式屋面中的防水材料耐用年限可以适当延长，从节材和经济的角度考虑，可选用质量较好的防水涂料，防水性能好、有弹性且强度较高的防水卷材价格较高。
