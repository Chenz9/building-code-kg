  tables: []
  converted_tables:
  - raw: 由于目前一些施工单位对找平层的施工质量不重视，致使水泥砂浆、细石混凝土找平层的表面有酥松、起砂、起皮和破裂现象，直接影响防水层和基层的粘结质量或导致防水层开裂。沥青砂浆找平层表面不密实会产生蜂窝现象，使卷材胶结材料或涂膜的厚度不均匀，影响防水质量。对找平层的质量要求、表面应坚固密实、平整，水泥砂浆，细石混凝土找平层应充分进行养护，使其水泥充分水化，以确保找平质量。经调研，表面平整度，其允许偏差Smm，提高平整度的要求，可使其卷材胶结材料或涂膜的厚度均匀一致，保证工程质量。8. 2. 8经调查分析认为，卷材、涂膜防水层的不规则拉裂，是由于找平层的开裂造成的，水泥砂浆找平层面积大开裂是难免的，找平层合理分格后，可将变形集中到分格缝处。规范规定其纵横缝的最大间距不宜大于6m ，因此按平层分格缝的位置和间距应符合设计要求。8. 2. 9基层与突出屋面结构（女儿墙、山墙、天窗壁、变形缝、烟囱等）的交接处以及基层的转角处，根据卷材的特性，应按《屋面工程技术规范》GB50345的规定做成圆弧形，以保证卷材、涂膜防水层的质量。8. 2.10 找平层的表面平整度是根据抹灰质量标准规定的，其允许偏差为5mm。提高对基层平整度的要求，可使卷材胶结材料或涂膜的厚度均匀一致，保证屋面工程的质量。8. 3防水与密封工程8. 3.1现行国家标准《屋面工程质量验收规范》GB50207对防水工程的验收作了比较详细的规定，本规程防水工程的验收执行现行国家标准。
