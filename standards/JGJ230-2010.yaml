- id: JGJ 230-2010#5.3.12
  standard_code: JGJ 230-2010
  chapter: 5 设计
  section: ''
  clause_no: 5.3.12
  text: 因聚氨醋防水保温复合板可以作为一道防水层，板缝的处理极为关键。粘贴卷材的胶粘剂应为卷材配套专用，满粘卷材，卷材覆盖板缝的宽度严格控制，不得小于150mm，卷材应铺贴牢固，尺寸准确，不应有空鼓、扭曲榴皱情况，卷材边缘用防水密封胶密封严密。施工6.1一般规定6. 1.1 施工前应进行图纸会审及设计交底，施工单位应编制专项施工方案，作业前的技术交底是为了保证倒置式屋面的构造做法与细部构造等符合设计意图，并做到质量的预控。6.1. 2各构造层次的过程控制和质量检查及完整记录备案为了保证各构造层次的质量，从而保证了整个屋面分部工程的质量。6. 1. 3屋面防水层、保温层的厚度是屋面防水、保温效果最重要的技术要求，施工时应符合设计要求。6.1. 4伸出屋面的管道、烟道、设备、零星设施或预埋件等，均应在防水层施工前固定、安装完毕，并采用防水附加层对其节点加强，顶部密封严密等。6.1. 5屋面工程均为露天施工，且防水层和保温层施工对基层含水率、气温等要求较严格，若环境气温不适合防水层和保温层施工，将元法保证其工程质量，所以在防水层和保温层施工时，有雨雪、大风天气禁止施工，环境气温应符合要求。6.1. 6在坡度大于15% 的坡屋面进行屋面工程施工时，因倾角较大，易发生危险，所以必须设置可靠的防滑和其他防护设施。6. 1. 7对倒置式屋面工程的成品保护是一个非常重要的环节。防水层开始施工直到屋面施工完成，均不得在屋面上进行动火作业，动火作业极易导致防水层损坏，还会引燃保温材料导致火灾事故。屋面工程完工后，上人进行其他作业操作，极易造成防水层、保温层局部破坏出现渗漏或保温层局部失效，确需进行其他工序施工时，应采取有效的保护措施，以防止损坏。6.2找坡层、找平层施工6. 2.1上一道工序完工后，应经验收合格，方可进行一下道工序施工。6. 2. 2找坡层、找平层施工应选用设计要求的材料和按照相应的配合比。6. 2.3 冬期施工时，根据不同的材料应采取相应的防冻措施。6. 2. 4基层表面处理是保证施工质量的重要环节，是不可缺少的一道工序。6. 2. 5屋面每一个构造层的坡度或平整度偏差较大，均会对上一个构造层造成影响，特别是如果保护层坡度、平整度达不到设计要求，会引起屋面排水不畅或积水，给屋面防水造成隐患，还会影响屋面保温效果。6. 2.6分格缝的设置在设计一章中有明确规定，施工时应符合设计要求。6. 2. 7根据长期的工程实践，交接处均应做成圆弧形。落水口周边做成凹坑便于排水，采取相应密封措施防止渗漏。6. 3防水层施工6. 3.1基层是卷材防水层的依附层，其质量好坏将直接影响到防水层的质量，应对基层进行质量验收。基层不干净，将使防水层难以粘结牢固，会产生空鼓现象。如在潮湿的基层上施工防水层，防水层与基层粘结困难，也易产生空鼓现象，立面防水层还会下坠，因此基层干燥也是保证防水层质量的重要环节。6.3. 2 现行国家标准《屋面工程技术规范》GB50345对防水层的施工作了比较详细的规定，本规程防水层的施工不作进一步规定，执行现行国家标准。
