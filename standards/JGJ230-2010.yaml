- id: JGJ 230-2010#5.3.8
  standard_code: JGJ 230-2010
  chapter: 5 设计
  section: ''
  clause_no: 5.3.8
  text: 伸出屋面穿过防水层管道多种多样，包括伸出屋面排汽管道、换气管道等等。应采用套管防水处理，即浇捣混凝土时先预埋套管，并焊有一道或多道止水片，当管道通过套管后，两端采用密封材料填嵌。为防止混凝土干缩与套管周边脱开裂缝而导致渗漏，设计时须在套管四周与混凝土找平层间留有凹槽，一般为20mm × 20mm，填嵌密封材料，并将管根部垫高，做成1/10排水坡，以利排水，然后做防水层。防水层与管道套管用金属箍配橡胶垫绑扎牢固，再以密封膏密封，保温材料铺至套管周围。
