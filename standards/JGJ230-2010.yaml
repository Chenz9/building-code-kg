  chapter: 6 施工
  section: ''
  clause_no: 6.4.10
  text: 喷涂硬泡聚氨醋保温层施工应符合下列规定： 1 喷涂硬泡聚氨醋屋面保温施工应使用专用喷涂设备； 2 喷涂硬泡聚氨醋的配合比应准确计量，发泡厚度应均匀 一致； 3 施工前应对喷涂设备进行调试及材料性能检测，并宜喷 涂三块500mm × 500mm、厚度不小于50mm 的试块试验； 4 喷嘴与施工基层的间距宜为200mm～400mm; 5 根据设计厚度，一个作业面应分层喷涂完成，每层厚度 不宜大于20mm ，当日的施工作业面应于当日连续喷涂完毕； 6 在天沟、檐沟的连接处应连续喷涂，屋面与女儿墙、变 形缝、管道、山墙等突出屋面结构处应连续喷涂至泛水高度； 26 7 风力不宜大于三级，空气相对湿度宜小于85%; 8 硬泡聚氨醋喷涂后不得将喷涂设备工具置于己喷涂层上， 且30min 内不得上人。
