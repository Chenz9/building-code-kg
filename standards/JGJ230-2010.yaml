- id: JGJ 230-2010#5.2.6
  standard_code: JGJ 230-2010
  chapter: 5 设计
  section: ''
  clause_no: 5.2.6
  text: 倒置式屋面为了防止紫外线的直接照射、人为损害以及防止保温层泡雨水后上浮，应在保温层上做保护层。保护层多为开敞式，即在保温层上做板块材料、卵石保护层。倒置式屋面分上人、非上人和功能性屋面。上人屋面宜采用混凝土板块、地砖、种植等做保护层；非上人屋面宜采用卵石做保护层；功能性屋面宜采用现浇细石？昆凝土保护层或板块材料保护层。5.3细部构造
