  chapter: 6 施工
  section: ''
  clause_no: 6.5.6
  text: 分格缝的设置及施工要求。1 分格缝设置在屋面板的端头、凸出屋面交接处、转折处，因纵横向的形变量不一致，保护层易出现裂缝，所以在此部位应设置分格缝。为保证屋面美观以及各分格之间相对变形小，分格缝设置在交接处必须相通，不宜成为T 字形或L 字形缝。在坡屋面的屋脊处或平屋面分水线处应留设分格缝。分格越大，每个分格受温度影响变形越大，为保证保护层质量，分格缝纵横间距均不应大于6m 。为防止因结构屋面板变形而影响保护层质量，分格缝应与结构板缝位置一致，位于开间处，并延伸至挑檐、天沟内。既有建筑倒置式屋面改造7.1一般规定
