  chapter: 7 既有建筑倒置式屋面改造
  section: ''
  clause_no: 7.3.4
  text: 原有屋面彻底拆除防水保温层时，屋面改造应符合设计要求，并应按本规程第6.2节～第6.5节的规定施工。质量验收8.1一般规定8.1. 1 倒置式屋面工程施工单位应建立各道工序自检、交接检和专职人员检查的质量控制制度，并应有完整的检查记录；每道工序完成后，应经检查合格后再进行下道工序的施工；检验批、分项工程应自检并经监理单位或建设单位验收合格。8.1. 2倒置式屋面施工的各种材料，应按规定进行进场验收，并应按规定进行见证取样复验。8.1. 3倒置式屋面子分部工程和分项工程划分应符合
