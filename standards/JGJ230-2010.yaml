  - raw: 保温材料的导热系数，密度或干密度指标直接影响到屋面保温效果。抗压强度或压缩强度影响到屋面的施工质量，燃烧性能是防止火灾隐患的重要条件，因此，在选择保温材料时，应对保温的导热系数、密度、干密度、抗压强度或压缩强度及燃烧性能严格控制，必须符合设计要求及相关施工规范要求，材料的导热系数，密度抗压强度或压缩强度应进场复验。不同厂家，不同品种的保温材料进行不少于3次复验，复验报告齐全，复验样品应由监理人员现场见证取样，样品检验单位应取得相应的资质。燃烧性能可不必进场复验，但需核其相关质量证明文件。
