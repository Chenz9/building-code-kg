  converted_tables:
  - raw: 目前适用于倒置式屋面效果较好的保温材料主要有挤塑型聚苯乙烯泡沫塑料板、硬泡聚氨醋保温板、硬泡聚氨醋防水保温复合板、喷涂硬泡聚氨醋及泡沫玻璃保温板等。模塑型聚苯乙烯泡沫塑料板、屋面复合保温板一般吸水率较大，当用于倒置式屋面时，应根据设计要求，优选低吸水率的材料。选用的硬泡聚氨醋保温材料耐久性能应满足防水层合理使用年限要求。
