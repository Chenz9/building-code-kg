    content: 表8.1. 3的规定。表8.1.3倒置式屋面子分部工程和分项工程划分子分部工程分项工程基层工程：找平层和找坡层、隔离层防水与密封工程：卷材防水层、涂膜防水层、复合防水层、接缝防水密封倒置式屋面保温工程：板状材料保温层、喷涂硬泡聚氨醋保温层细部构造工程2檐口、檐沟和天沟、女儿墙和山墙、水落口、变形缝、伸出屋面管道、屋面出入口、反梁过水孔、设施基座保护层工程：现浇保护层、板块保护层、瓦材保护层8. 1. 4倒置式屋面各分项工程宜按屋面面积每500m2 ～1000m2划分为一个检验批，不足500m2应作为一个检验批。8.1. 5倒置式屋面每个检验批的抽样数量应符合下列规定：防水密封各分项工程，应按每50m 抽查一处，每处应为Sm ，且不得少于3处；细部构造各分项工程，应全部进行检查；其他分项工程应按屋面面积每l00m2抽查一处，每处应为10时，且不得少于3处。8. 1. 6倒置式屋面检验批质量验收应符合下列规定：主控项目抽查质量应符合本规程规定；一般项目抽查质量应符合本规程规定，有允许偏差的项目，80%允许偏差应符合本规程规定，其余20% 不得大于允许偏差值的1.5倍；质量控制资料应完整。8. 1. 7倒置式屋面分项工程质量验收应符合下列规定：分项工程所含检验批均应验收合格；质量控制资料应完整。8. 1. 8倒置式屋面子分部工程质量验收应符合下列规定：1 子分部工程所含分项工程应验收合格；子分部工程验收时，应提交下列文件和记录：1 ）防水和保温工程施工单位专业资质证书，作业人员上岗证书；2）工程设计图纸及会审记录、审图记录、设计变更通知单、技术核定单等；3 ）施工组织设计，防水、保温施工专项方案；4）防水、保温材料产品合格证、质量检验报告和现场抽样复检报告；5 ）分项工程质量验收记录：6 ）隐蔽工程验收记录；7 ）施工检测记录：屋面蓄水和淋水检验记录；8）其他质量记录或文件。防水及保温功能检测应符合设计要求；观感质量应符合本规程规定。8.2基层工程8. 2.1倒置式屋面基层的施工质量验收可包括找坡层、找平层、隔离层等分项工程。8. 2. 2倒置式屋面基层的质量验收应符合现行国家标准《屋面工程质量验收规范》GB50207的规定。
  converted_tables:
  - raw: '当需拆除原有屋面的保温层和防水层时，为保证屋面工程施工质量，各层次应严格按照本规程第6.2节～6.5节规定施工。为保证新做屋面工程与基层结合牢靠，保证屋面工程质量，对于原有屋面结构层存在的结合不牢固、面层污染、空鼓、开裂等部位应彻底清除，再用适宜强度的水泥砂浆或聚合物砂浆找平。质量验收8.1一般规定8. 1. 1 倒置式屋面工程施工应建立施工班组自检，合格后报质量员验收，质量员检查验收合格后，报送监理单位（或建设单位）检查验收，合格后方可进行下道工序施工，并有完整的检查记录，严格控制各工序质量，确保屋面工程检验批、分项、分部工程质量的合格。8. 1. 2 材料质量直接关系到工程质量，所以在施工过程中应严把材料质量关，现场材料抽样复验过程往往需要一段时间，在施工过程中先施工后有检验报告现象较多，因此材料外观质量，质量证明文件，检验报告等经监理单位（或建设单位）检查验收合格后，材料方可用到工程中去，使屋面工程所用材料全部合格。8.1. 3倒置式屋面工程为一个子分部工程，分项工程按照屋面各构造层和使用功能进行划分。8.1. 4按《屋面工程质量验收规范》GB50207的要求。分项工程划分成检验批进行验收有助于及时纠正施工中出现的质量问题，确保工程质量，也符合施工实际需要。8.1. 8屋面防水和保温分项工程是屋面重要的分项工程，直接关系到屋面工程质量，防水保温工程施工实际上是对防水、保温材料的一次再加工，必须由专业队伍进行施工，才能确保防水保温工程的质量。专业资质单位应是由当地建设行政主管部门对防水、保温施工企业的规模、技术水平、业绩等综合考核后颁发资质证书的防水、保温专业队伍。作业人员应经过防水、保温施工技术专业培训，并达到符合要求的操作技术水平，由当地建设行政主管部门颁发上岗证书。对非专业队伍和非专业人员施工，当地质量监督部门应责令其停止施工。屋面E程验收的文件和记录体现了施工全过程控制，必须做到真实、准确，不得有涂改和伪造，各相关人员签字盖章后方可有效。施工组织设计应体现防水、保温的内容，并要编制防水、保温施工方案，由施工单位，监理单位（或建设单位）共同审批后，严格按施工方案施工。隐蔽工程的后续工序和分项工程覆盖、包裹、遮挡的前一工序的各项工程，应经过检验符合质量标准，避免因质量问题造成渗漏，或不易修复而直接影响工程质量。按现行国家标准《建筑工程施工质量验收统一标准》GB50300的规定，建筑工程质量验收时对涉及结构安全和使用功能的重要分部工程进行抽样检测，因此屋面工程验收时，应检查屋面有无渗漏、积水和排水系统是否畅通，可在雨后持续淋水2h后进行。有可能做蓄水检验的屋面，其蓄水时间应不少于24h。检验后应填写记录、相关人员签字盖章，作为验收文件。8. 2基层工程8. 2.1目前倒置式屋面主要采用轻质和保温材料找坡以及采用水泥砂浆和细石混凝土找平，故本节的验收内容主要针对采用上述材料的找坡和找平层质量验收。8. 2. 3既有建筑屋面改造，基层坡度同样不宜小于3%。8. 2.41: 2. 5~1 : 3 （水泥z砂）体积水泥砂浆找平层采用比，水泥强度等级不得低于32.5级，细石棍凝土找平层采用强度等级不低于C20 ；拥青砂浆找平层采用1: 8 （沥青：砂）质量比，沥青可采用10号、30号的建筑石油，沥青或其熔合物，其材质和配合比必须符合设计要求。8. 2. 5屋面找平层是防水层的基层，在调研中发现平屋面（坡度3% ～5% ）天沟、檐沟，由于排水坡度过小或找坡不正确，会造成屋面排水不畅或积水现象。基层找坡正确，能将屋面上的雨水迅速排走，延长了防水层、保温层的寿命，其排水坡度须符合设计要求。8. 2. 6隔离层所用材料的质量应符合设计要求，当设计无要求时，隔离层所用的材料应能经得起保护层的施工荷载，故建议塑料模的厚度不应小于0.4mm，土工布应采用聚醋土工布，单位面积质量不应小于200g／町，卷材厚度不应小于2mma为了消除保护层与防水层之间的粘结力及机械咬合力，隔离层必须是完全隔离，对隔离层破损或漏铺部位应及时修复。'
