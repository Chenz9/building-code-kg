  text: 屋面细部构造的设计应符合下列规定： 1 檐口、檐沟和天沟、女儿墙和山墙、水落口、变形缝、 伸出屋面管道、屋面出人口、设施基座等细部节点部位应增设防 水附加层，平面与立面交接处的卷材应空铺； 2 细部节点应采用高弹性、高延伸性防水和密封材料； 3 细部节点的密封防水构造应使密封部位不渗水，并应满 足防水层合理使用年限的要求； 4 在与室内空间有关联的细部节点处，应铺设保温层。
