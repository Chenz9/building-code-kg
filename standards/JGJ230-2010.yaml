  standard_code: JGJ 230-2010
  chapter: 6 施工
  section: ''
  clause_no: 6.4.12
  text: 坡屋面保温板材施工应符合下列规定：1 保温板材施工应自屋盖的檐口向上铺贴，阴角和阳角处的板块接搓时应割成角度，接搓应紧密，并应用钢丝网连接，钢丝网宽度宜为300mm;屋面及檐口处的保温板材应采用预埋件固定牢固，固定点应采用密封材料密封；泡沫玻璃作为保温层时，应对泡沫玻璃表面加设玻纤布或聚醋毡保护膜。6.5保护层施工6. 5.1保护层的施工应在屋面保温层验收合格后进行。6. 5. 2保护层施工应符合下列规定：1 保护层施工不得损坏保温层；保护层与保温层之间的隔离层应满铺，不得漏底，搭接宽度不应小于lOOmm;天沟、檐沟、出屋面管道和水落口处防水层外露部分应采取有效的保护措施；保护层的分格缝宜与找平层的分格缝对齐。6. 5.3 卵石保护层施工应符合下列规定：卵石直径应符合规定，卵石应满铺、铺设均匀；卵石质（重）量应符合设计要求；卵石下宜铺设带支点的塑料排水板，通过空腔层排水；卵石铺设前，应先铺设聚醋纤维无纺布等隔离材料，并应保持水落口和天沟等处的排水畅通。6. 5. 4板块材料保护层施工应符合下列规定：1 板块材料保护层的结合层可采用砂或水泥砂浆；在板块铺砌时应根据排水坡度挂线，铺砌的板块应横平竖直，板块的接缝应对齐；在砂结合层上铺砌板块时，砂结合层应洒水压实，并用刮尺刮平，板块对接铺砌、铺设平整，缝隙宽度宜为lOmm;在板块铺砌完成后，宜洒水压平；板缝宜用水泥砂浆勾缝；在砂结合层四周500mm范围内，应采用水泥砂浆作结合层；板块材料保护层宜留设分格缝，其纵横间距不宜大于lOm ，分格缝宽度不宜小于20mm 。6. 5. 5细石混凝土保护层施工应符合下列规定：混凝土的强度等级和厚度应符合设计要求，提凝土收水后应进行收浆压光；混凝土应密实，表面应平整；分格缝应按规定设置，一个分格内的混凝土应连续浇筑；当采用钢筋网细石混凝土作保护层时，钢筋网片保护层厚度不应小于lOmm，钢筋网片在分格缝处应断开；5 混凝土保护层浇筑完后应及时温润养护，养护期不得少于7d ，养护完后应将分格缝清理干净。6. s. 6分格缝的施工应符合下列规定：1 分格缝应设置在屋面板的端头、凸出屋面交接处的根部和现浇屋面的转折处；2 分格缝纵横向交接处应相互贯通，不宜形成T 宇形或L字形缝；屋脊处应设置纵向分格缝；分格缝纵横向间距均不应大于6m;5 分格缝宜与板缝位置一致，并应位于开间处，分格缝应延伸至挑檐、天沟内。既有建筑倒置式屋面改造7.1一般规定7. 1. 1既有建筑屋面改造前，应对屋面的结构、防水性能等情况进行勘查，并宜进行现场检测和采取加固措施。7. 1. 2既有建筑屋面勘查、鉴定、设计和施工，应由具有该资质的单位和专业技术人员承担。7.1. 3既有建筑屋面改造工程宜选用对居民干扰小、工艺便捷、工期短，有利排水防水、节能减排、环境保护的技术。7.1. 4既有建筑屋面勘查时应具备下列资料：房屋原设计资料及相关竣工资料；房屋装修及改造资料；历年屋面修缮资料；城市建设规划和市容要求。7. 1. 5既有建筑屋面改造应重点勘查下列内容：屋面荷载及使用条件的变化；房屋地基基础、结构类型及重要结构构件的安全性状况；屋面材料和基本构造做法；屋面保温及热工缺陷状况；屋面防水状况。7.1. 6既有建筑屋面改造应核验防水层的有效性和保温层的完好程度，并宜根据工程实际需要进行结构可靠性鉴定。7.1. 7既有建筑屋面改造应有安全防护措施，并应保护环境、文明施工。7.2设计7. 2.1既有建筑倒置式屋面改造工程设计，应由原设计单位或具备相应资质的设计单位承担。当增加屋面荷载或改变使用功能时，应先做设计方案或评估报告。7. 2. 2既有建筑倒置式屋面改造设计应符合下列规定：1 屋面改造设计应根据勘查报告或鉴定结论和建筑节能标准要求进行；当原有屋面防水层有效或经修补可达到设计使用要求时，可作为一道防水层，并应再增设一道防水层；当原有屋面防水层渗漏或保温层含水率较大时，应彻底拆除并清理干净，再按正常倒置式屋面设计；保温层宜选用聚苯乙烯泡沫塑料或硬泡聚氨醋等保温材料；屋面改造设计与既有建筑外立面的装饰效果应具有统一性。7. 2.3 既有建筑倒置式屋面改造设计文件应经审查合格。7.3施工7. 3.1既有建筑倒置式屋面改造施工前，施工单位应编制专项施工方案，对施工人员进行技术交底和专业技术培训，并应做好安全防护措施，对施工过程实行质量控制。7. 3. 2既有建筑倒置式屋面改造施工准备工作应包括下列内容：对原屋面保护层进行清理；2 对原防水层的损害部位修复或拆除；3 屋面上的设备、管道等应提前安装完毕，并预留出保温层的厚度；安全防护设施应安装到位。
