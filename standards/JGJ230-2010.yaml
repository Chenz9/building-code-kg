- id: JGJ 230-2010#7.3.3
  standard_code: JGJ 230-2010
  chapter: 7 既有建筑倒置式屋面改造
  section: ''
  clause_no: 7.3.3
  text: 在原屋面上增加保温层的倒置式屋面应符合下列规定：当不拆除屋面原有排汽管时，施工中应采取保护措施；当拆除屋面原有排汽管时，拆除后原有防水层在排汽管洞口处应采取封口措施；屋面应清理干净，表面应用水泥砂浆或聚合物砂浆找平；当屋面坡度不符合要求时，应加设找坡层。
