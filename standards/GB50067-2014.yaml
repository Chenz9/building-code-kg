- id: GB 50067-2014#3.0.2
  standard_code: GB 50067-2014
  chapter: 3 分类和耐火等级
  section: ''
  clause_no: 3.0.2
  text: 汽车库 修车库的耐火等级应分为一级,二级和三级。其构件的燃烧性能和耐火极限均不应低于表3.0.2的规定.修车库构件的燃烧性能和耐火极限,h，注、预制钢筋混凝土构件的节点缝隙或金属承重构件的外露部位应加设防火保护层、其耐火极限不应低于表中相应构件的规定。
  is_abolished: true
  abolished_date: '2023-06-01'
