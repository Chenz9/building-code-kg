  clause_no: 5.1.3
  text: 室内无车道且无人员停留的机械式汽车库，应符合下列规定：1当停车数量超过100辆时，应采用无门、窗、洞口的防火墙分隔为多个停车数量不大于100辆的区域，但当采用防火隔墙和耐火极限不低于1.00h的不燃性楼板分隔成多个停车单元，且停车单元内的停车数量不大于3辆时，应分隔为停车数量不大于300辆的区域；2汽车库内应设置火灾自动报警系统和自动喷水灭火系统，自动喷水灭火系统应选用快速响应喷头；:13:3楼梯间及停车区的检修通道上应设置室内消火栓；4汽车库内应设置排烟设施，排烟口应设置在运输车辆的通道顶部。
