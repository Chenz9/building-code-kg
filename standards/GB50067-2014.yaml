  clause_no: 5.2.4
  text: 防火墙不宜设在汽车库、修车库的内转角处。当设在转角处时，内转角处两侧墙上的门、窗、洞口之间的水平距离不应小于4m。防火墙两侧的门、窗、洞口之间最近边缘的水平距离不应小于2m。当防火墙两侧设置固定乙级防火窗时，可不受距离的限制。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 汽车库、修车库内的防火墙（设在转角处时及两侧门、窗、洞口）
