- id: JGJ/T 235-2011#3.0.2
  standard_code: JGJ/T 235-2011
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.2
  text: 针对国内建筑外墙的渗漏情况，本规程编制组进行了多次的各地调研和全国范围的问卷调查，主要内容有年降雨量与基本风压情况，建筑外墙的渗漏情况，建筑外墙的形式、构造与材料，是否采取防水措施、使用何种材料，是否采用外墙外保温，采用外保温时保温层的材料以及其外部保护采用何种材料，外墙防水设防对工程造价的影响等方面。调研结果的综合分析表明：建筑外墙渗漏状况：在全国范围内比较多见，尤其南方地区的华南、江南，北方地区的东北、华北等地。例如，江南某住宅小区，人住700户，发生墙体渗漏的有160多户，约占23%,导致了业主与开发商较大的纠纷。南方地区的华南、江南，由于降雨量大，尤其沿海地区风力大，加之建筑形式的多样化致使墙体渗漏的情况加剧。北方地区由于采用外墙外保温时采取的防水措施不充分产生的问题也较多。各地采取的建筑外墙防水措施：目前外墙防水工程实践中主要采用两类方式进行设防，一类是墙面整体防水，主要应用于南方地区、沿海地区以及降雨量大、风压强的地区；另一类是对节点构造部位采取防水措施，主要应用于降雨量较小、风压较弱的地区和多层建筑以及未采用外保温墙体的建筑。各地采用外墙外保温的建筑均采取了墙面整体防水设防。墙面整体防水包括所有外墙面的防水和节点构造部位的防水。节点构造的防水指门窗洞口、雨篷、阳台、变形缝、伸出外墙管道、女儿墙压顶、外墙预埋件、预制构件等交接部位的防水。根据国内建筑外墙防水的现状和实际做法，以及现代建筑对建筑外墙的要求，本规程将建筑外墙防水分为墙面整体防水和节点构造防水两种类别。墙面整体防水分为两类：一类是指降水量大、风压强的无外保温外墙，包含“年降水量大于等于800mm 地区的高层建筑外墙”和“年降水量大于等于600mm、基本风压大于等于
