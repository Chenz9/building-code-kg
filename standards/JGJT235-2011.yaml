- id: JGJ/T 235-2011#6.2.4
  standard_code: JGJ/T 235-2011
  chapter: 6 施工
  section: ''
  clause_no: 6.2.4
  text: 砂浆防水层施工应符合下列规定： 1 基层表面应为平整的毛面，光滑表面应进行界面处理， 并应按要求温润。 2 防水砂浆的配制应满足下列要求： 1 ）配合比应按照设计要求，通过试验确定； 2）配制乳液类聚合物水泥防水砂浆前，乳液应先搅拌均 匀，再按规定比例加人拌合料中搅拌均匀； 3）干粉类聚合物水泥防水砂浆应按规定比例加水搅拌 均匀； 4）粉状防水剂配制普通防水砂浆时，应先将规定比例的 水泥、砂和粉状防水剂干拌均匀，再加水搅拌均匀； 如液态防水剂配制普通防水砂浆时，应先将规定比例的 水泥和砂干拌均匀，再加人用水稀释的液态防水剂搅 拌均匀。 3 配制好的防水砂浆宜在lh 内用完P 施工中不得加水。 4 界面处理材料涂刷厚度应均匀、覆盖完全，收水后应及 时进行砂浆防水层施工。 5 防水砂浆铺抹施工应符合下列规定： 1) 厚度大于lOmm 时，应分层施工，第二层应待前一层 指触不粘时进行，各层应粘结牢固； 2）每层宜连续施工，留茬时，应采用阶梯坡形茬，接茬 部位离阴阳角不得小于200mm ；上下层接茬应错开 300mm 以上，接茬应依层次顺序操作、层层搭接 紧密； 19 3）喷涂施工时，喷枪的喷嘴应垂直于基面，合理调整压 力、喷嘴与基面距离； 4）涂抹时应压实、抹平；遇气泡时应挑破，保证铺抹 密实； 5）抹平、压实应在初凝前完成。 6 窗台、窗帽和凸出墙面的腰线等部位上表面的排水坡度 应准确，外口下沿的滴水线应连续、 Jr顶直。 7 砂浆防水层分格缝的留设位置和尺寸应符合设计要求， 嵌填密封材料前，应将分格缝清理干净，密封材料应嵌填密实。 8 砂浆防水层转角宜抹成圆弧形，圆弧半径不应小于 5mm，转角抹压应顺直。 9 门框、窗框、伸出外墙管道、预埋件等与防水层交接处 应留8mm～lOmm 宽的凹槽，并应按本条第7 款的规定进行密 封处理。 10 砂浆防水层未达到硬化状态时，不得浇水养护或直接受 雨水冲刷，聚合物水泥防水砂浆硬化后应采用干湿交替的养护方 法；普通防水砂浆防水层应在终凝后进行保湿养护。养护期间不 得受冻。
