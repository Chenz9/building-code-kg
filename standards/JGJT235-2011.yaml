  text: 强调了应做好建筑外墙地面与地下交接的防水处理，使外墙防水层与地下防水层形成整体设防。5.3 节点构造防水设计5. 3.1节点部位是外墙渗漏水的重点部位，大量的外墙渗漏主要出现在节点部位，其中门窗框周边是最易出现渗漏的部位，应着重进行设防。门窗框间嵌填的密封处理应与外墙防水层连续，才能阻止雨水从门窗框四周流向室内。门窗上帽的外口的滴水处理可以阻止顺墙下流的雨水爬人门窗上口。窗台必要的外排水坡度利于防水。
