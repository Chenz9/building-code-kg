  - raw: 节点部位是防水设计的重点部位，也是渗漏的多发区，在施工准备阶段应认真按设计要求进行密封处理或增强处理。双组分或多组分涂料，各组分的计量不准或搅拌不均匀会影响涂膜性能，故应按照产品说明书的要求配制。单组分材料在储存、运输过程中可能会出现分层、沉淀等现象，重新搅拌均匀后一般不影响材料的性能。采用机械搅拌配料比手工搅拌效率高，料浆均匀，但应注意搅拌时间不宜过长，搅拌约5min即可，否则也会影响涂料质量。为提高涂膜与基层的粘结强度，涂布前应先涂基层处理剂，基层处理剂可以按生产厂的配方，在现场用防水涂料加水稀释配制，也可采用厂方提供的专用基层处理剂。外墙防水涂料一般采用与水泥砂浆基层具有很好相容性的防水涂料，如聚合物水泥防水涂料等。这类涂料一般为水分蒸发成膜的材料，如涂层太厚，表面成膜后会阻止膜层中水分的蒸发，影响成膜质量，故通过用量来控制单遍涂布的厚度。并要掌握好涂刷各层之间的时间间隔，通常以前一遍涂层干燥不粘手为准，一般约需2h～6h；若现场气温低、温度大，通风不畅，则干燥时间会长些。每层涂布按规定的用量取料，涂布时应均匀，上下层之间不留气泡。在使用中涂料如有沉淀应注意随时搅拌均匀。交替改变涂层的涂布方向，可以使涂膜的纵横向物理力学性能比较一致，同时可更好地消除前遍涂层的毛细孔道，防止漏涂。甩茬是指同一遍涂层分两次施工时，先后施工涂层的交接处。为保证该部位涂层的连续性和整体性，甩茬部位应清理干净，并有足够的接茬宽度。接茬是指每遍涂刷时的交接处，为避免交接处漏涂，涂布时应有一定的接茬宽度。采用加铺增强层做法时，除应注意本条规定的技术措施外，还要注意增强层与上涂层应连续施工，一次成活。增强层应铺贴平整，密实，不空鼓。胎体间应有一定的搭接宽度，以保证胎体的连续性。采用二层胎体时，为减少胎体接缝的交叉重叠，上下层胎体不得垂直铺设，其搭接缝应错开。胎体在涂层中主要起增加抗拉强度和抗裂作用，因此施工时应控制胎体在涂层中的位置，使胎体充分发挥作用。
    note: 合并重复提取片段
