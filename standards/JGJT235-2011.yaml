  text: 涂膜防水层施工应符合下列规定： 1 施工前应对节点部位进行密封或增强处理。 2 涂料的配制和搅拌应满足下列要求： 1 ）双组分涂料配制前，应将液体组分搅拌均匀，配料应 按照规定要求进行，不得任意改变配合比； 2）应采用机械搅拌，配制好的涂料应色泽均匀，无粉团、 沉淀。 3 基层的干燥程度应根据涂料的品种和性能确定；防水涂 料涂布前，宜涂刷基层处理剂。 4 涂膜宜多遍完成，后遍涂布应在前遍涂层干燥成膜后进 行。挥发性涂料的每遍用量每平方米不宜大于0.6kg 。 5 每遍涂布应交替改变涂层的涂布方向，同一涂层涂布时， 20 先后接茬宽度宜为30mm～50mm 。 6 涂膜防水层的甩茬部位不得污损，接茬宽度不应小 于lOOmmo 7 胎体增强材料应铺贴平整，不得有榴皱和胎体外露，胎 体层充分浸透防水涂料；胎体的搭接宽度不应小于50mm。胎体 的底层和面层涂膜厚度均不应小于0.5mm 。 8 涂膜防水层完工并经检验合格后，应及时做好饰面层。
