- id: JGJ/T 235-2011#3.0.3
  standard_code: JGJ/T 235-2011
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.3
  text: 除本规程第3.0.2条规定的建筑外，年降水量大于等于 400mm 地区的其他建筑外墙应采用节点构造防水措施。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters:
  - name: 外年降水量
    unit: mm
    condition: null
    min_value: 400.0
    max_value: null
  tables: []
  converted_tables:
  - raw: 根据调研的情况，本规程第3.0. 2条规定之外的地区，年降水量大于等于400mm 地区的建筑外墙渗漏主要发生在门窗洞口、雨篷、阳台、变形缝、伸出外墙管道等节点部位，因此应采用节点构造防水措施。根据调研资料，降水量小于200mm的干旱区、降水量在400mm以下的地区主要在甘肃、青海、宁夏、内蒙古和新疆大部，外墙渗漏的情况比较少见，本规程未对其防水作出规定，必要时可根据实际情况对节点部位进行防水密封处理。
    note: 合并重复提取片段
  references: []
  related_objects:
    component_types:
    - IfcWall
    activity_types:
    - 外墙防水设计
  conflicts: []
