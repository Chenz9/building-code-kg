- id: JGJ/T 235-2011#7.4.6
  standard_code: JGJ/T 235-2011
  chapter: 7 质量检查与验收
  section: 7.4 防水透气膜防水层
  clause_no: 7.4.6
  text: 防水透气膜的搭接缝应粘结牢固，密封严密；收头应与基层粘结并固定牢固，缝口应封严，不得有翘边现象。检验方法：观察检查。7. 5工程验收7. 5.1外墙防水质量验收的程序和组织，应符合现行国家标准《建筑工程施工质量验收统一标准》GB50300的规定。7. 5. 2外墙防水工程验收时，应提交下列技术资料并归档z1 外墙防水工程的设计文件，图纸会审、设计变更、洽商记录单；主要材料的产品合格证、质量检验报告、进场抽检复验报告、现场施工质量检测报告；3 施工方案及安全技术措施文件；隐蔽工程验收记录；雨后或淋水检验记录；施工记录和施工质量检验记录；施工单位的资质证书及操作人员的上岗证书。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
