- id: JGJ/T 235-2011#2.0.3
  standard_code: JGJ/T 235-2011
  chapter: 2 术语
  section: ''
  clause_no: 2.0.3
  text: 滴水线 drip water line 在凸出或凹进外墙面的部位外沿，设置的阻止水由水平方向 内渗的构造。
  is_abolished: false
