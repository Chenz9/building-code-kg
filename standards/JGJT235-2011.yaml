  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 防水材料及其配套材料均应满足相应的技术指标要求；同时，应满足环境保护及安全要求，例如，不得产生有害物质，不得污染环境，不得采用易燃材料。建筑防水涂料应符合《建筑防水涂料中有害物质限量》JC1066的要求。材料4.1一般规定
