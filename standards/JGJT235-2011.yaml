    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 防水透气膜的搭接缝是采用配套的丁基双面胶粘带进行粘结的，如接缝粘结不可靠、密封不严，会造成接缝的渗漏；收头部位也是防水密封的重点。因此，防水透气膜的验收应对搭接缝和收头部位给予重视。7.5工程验收7. 5.1《建筑工程施工质量验收统一标准》GB50300规定分项工程可由若干检验批组成，本条文规定了外墙防水工程，应符合分项工程各检验批相应的质量标准要求。7. 5. 2本条规定了外墙防水工程验收文件和记录的内容，以与《建筑工程施工质量验收统一标准》GB50300相关内容协调。需要强调隐蔽工程部位的检验，隐蔽工程为后续的工序或分项过程覆盖、包裹、遮挡的前一分项工程，例如防水层的基层、密封防水处理部位、门窗洞口、伸出外墙管道、预埋件及收头等节点做法，应经过检查符合质量要求后方可进行隐蔽，避免因质量问题造成渗漏或不易修复而直接影响防水效果。外墙防水工程完成后，应会同各有关方验收，进行记录归档，以便查验。
