- id: JGJ/T 235-2011#7.4.4
  standard_code: JGJ/T 235-2011
  chapter: 7 质量检查与验收
  section: 7.4 防水透气膜防水层
  clause_no: 7.4.4
  text: 防水透气膜的铺贴应顺直，与基层应固定牢固，膜表面不得有皱裙、伤痕、破裂等缺陷。检验方法：观察检查。7. 4. 5防水透气膜的铺贴方向应正确，纵向搭接缝应错开，搭接宽度的负偏差不应大于lOmm 。检验方法z观察和尺量检查。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
