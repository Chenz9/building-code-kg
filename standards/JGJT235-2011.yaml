    - 不得
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 防水透气膜是空铺于保温层外表面，用带塑料垫片的塑料锚栓固定在基层墙体上。如铺贴不顺直，表面出现皱裙、伤痕、破裂等缺陷，将会影响其使用功能和耐久性。防水透气膜铺贴完成后应进行外观的观察检查，以保证铺贴质量。7. 4. 5防水透气膜的铺贴方向正确是保证顺水搭接的关键，施工过程中应加强检查监督。纵向搭接缝是短边搭接缝，为避免搭接缝过于集中，上下两幅的纵向搭接缝应相互错开，其间距不得小于500mm。必要的搭接宽度是保证搭接缝防水可靠性的关键，因此对搭接宽度负偏差应进行控制。
