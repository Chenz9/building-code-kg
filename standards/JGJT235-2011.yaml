- id: JGJ/T 235-2011#5.3.7
  standard_code: JGJ/T 235-2011
  chapter: 5 设计
  section: ''
  clause_no: 5.3.7
  text: 强调了外墙预埋件密封要求。外墙落水管和外挂锚固件的防水可参照预埋件处理。由于预埋件大都具有承载作用，易产生变动，因此，后置埋件和预埋件均需作密封增强处理以保证防水的整体性。施工6.1一般规定6. 1. 1 根据设计要求，找出需要解决的技术难点，制定施工方案。外墙防水工程施工方案的内容包括：技术措施（其中须包括施工程序、施工条件和成品保护的内容）、工程概况、质量工作目标、施工组织与管理、防水材料及其使用、施工操作技术、质量保证措施、安全注意事项等。6. 1. 2外墙防水应由专业队伍进行施工，是保证工程质量的基本条件要求。本条文所指的防水专业队伍，是由当地建设行政主管部门对防水施工企业的规模、技术水平、业绩等综合考核后颁发资质证书的专业队伍。作业人员应经过专业培训，达到符合要求的操作技术水平，由有关相关的主管部门发给上岗证。6. 1. 3防水材料产品进入施工现场，应经复验合格后方可使用，是为了确认进场所用材料的质量，应根据不同的防水材料进行相应的技术指标检验，提供产品的试验检测报告。6. 1. 4外墙由多个构造层次组成，上道工序会被下道工序所覆盖，任何一个层次出现质量隐患，都会影响外墙的保温和防水工程质量。因此，强调按工序、层次进行过程的质量控制和检查验收，即每个层次施工都应有质量控制的措施，每道工序完成后操作人员应进行自检，合格后进行工序间的交接检验和专职质量人员的检查，检查结果应有完整的记录，然后经监理单位（或建设单位）进行检查验收后，方可进行下一工序的施工，以达到消除质量隐患的目的。6. 1. 5本条文强调，应将外墙门、窗框、伸出外墙管道、设备或预埋件等部件安装完毕，再进行防水施工；如先进行防水施工，后再安装门、窗框、伸出外墙管道、设备或预埋件等部件，其部件周边极易造成渗漏水现象。6.1. 6找平层质量是保证防水层质量的基本要素，如找平层表面有酥松、起砂、起皮和裂缝等现象，将直接影响防水层和基层的粘结质量，导致空鼓甚至出现脱落，找平层裂缝会导致防水层开裂。因此找平层施工时，应在收水后及时进行二次压光，使表面坚固密实、平整；水泥砂浆终凝后，应浇水充分养护，保证砂浆中的水泥充分水化，以确保找平层质量。找平层基面的含水率应根据防水材料品种确定，采用水泥基类防水材料时，为保证水泥的充分水化以增强防水层的强度和密实度，基面应充分湿润。而柔性防水材料往往要求基层干燥以保证防水层与基层面的粘结能力。6.1. 7勾缝密封，可以起到局部加强，使之具有一定的整体防水功能。6.1. 8本条规定是对施工期间外墙防水成品保护的要求：外墙防水完工后应采取有效的保护措施，防止外墙防水层的损坏。其中包括已完成的外墙防水层上不得剔凿打洞；有机涂料防水层和防水透气膜防水层上不得进行电气焊等高温作业；其他工序交叉作业时不得损害外墙防水层。6.1. 9外墙防水层是室外施工，气候条件对其影响很大。雨雪天施工会使防水层难以成型，并使保温层、找平层中的含水率增大，导致柔性胶结防水材料与基面的粘结能力降低或防水层起鼓破坏；气温过低时水泥基类防水材料中的水泥水化速度明显降低，影响防水层成型，如受冻则会产生强度降低、酥松、开裂等缺陷，而防水涂料在低温或负温时不易成膜。雨雪、五级风以上进行外墙防水层施工，也难以确保人身安全；因此外墙防水施工应有适宜的施工环境气候条件。除了施工现场常见的触电、机具伤害、坠物伤人、洞口坠落等事故外，外墙防水施工属于高空作业，易发生高空坠落事故；因此，外墙防水施工应严格执行国家有关安全生产法律、法规和现场安全施工要求。6.2无外保温外墙防水工程施工6. 2.1外墙结构表面的油污、浮浆会影响找平层的粘结性能及造成空鼓；外脚手架的连墙件拆除后留下的孔洞、砌筑砂浆不饱满形成的缝隙等，如不填塞抹平，会造成找平层空鼓、开裂。不同结构材料的线膨胀系数不同，温度的变化造成的热胀冷缩不同，使相关层次在交接处容易产生规则性裂缝。因此在交接处铺设增强处理材料来限制拉伸应力，约束裂缝的产生。增强处理材料主要包括玻璃纤维网布以及金属网等材料。6. 2. 2无论是混凝土还是砌体结构墙体，当表面平整度无法达到保温层或防水层施工要求时，应进行找平处理。为使找平层粘结牢固，找平层施工前应进行界面处理。为保证找平层的密实度、平整度和不易产生裂缝，每遍抹灰的厚度不宜大于lOmm 。为保证找平层与后道工序的构造层次粘结牢固，找平层表面应用木抹子搓成毛面。
