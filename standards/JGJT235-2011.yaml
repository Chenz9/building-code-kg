  - raw: 防水透气膜一般从外墙底部开始铺设，长边沿水平方向自下而上横向铺设，第二幅透气膜搭接压盖第一幅膜，保证搭接缝为顺水方向，每幅透气膜的纵、横向搭接缝均应有足够的搭接宽度，并采用配套胶带覆盖密封，以保证水不会从搭接缝中渗入。防水透气膜采用带塑料垫片的塑料锚栓固定在基层上，固定锚栓的数量应符合设计要求，固定部位采用丁基胶带密封，以保证固定部位的密封性能。门洞、窗洞等洞口处的防水透气膜应根据门、窗框与外墙面的距离裁剪，“ I”形实为两个对接的“Y”字形。使透气膜能压人门、窗框与墙体之间的空隙，再用专用配套密封胶带满粘密封。防水透气膜－般应用于干挂幕墙及墙体小龙骨构造体系的外墙工程，对于穿过透气膜的连接件四周应采用密封胶粘带封严。质量检查与验收7.1一般规定7. 1. 1 本条规定了找平层、防水层等施工质量的基本要求，主要用于分项工程验收时进行的观感质量验收。工程观感质量由验收人员通过现场检查，并应共同确认。7. 1. 2防水材料除有产品合格证和性能检测报告等出厂质量证明文件外，还应有经建设行政主管部门认定，拥有相应资质的检测单位对该产品抽样检测认证的试验报告，其质量应符合国家产品标准和设计要求。为了控制防水材料的质量，对进入现场的材料应按本规程的规定进行抽样复验，以保证实际进人现场的防水材料质量。7.1. 3对外墙完成的砂浆防水层、涂膜防水层、防水透气膜等防水层均应进行检验验收。外墙防水层的质量对整个外墙防水至关重要，防水层施工完毕后要进行渗漏检查。检查应在雨后或持续淋水30min 后进行（在墙体外墙的上部设置淋水的排管进行淋水试验；排管的长度、管孔的数量、孔径的大小，达到墙面连续满流为准），并作记录。如有渗漏，应对渗漏原因进行分析，按照编制的专项修改方案，在监理人员监督下进行修改，修改后重新进行渗漏检查，无渗漏后方可进行下道工序。7.1. 4外墙防水层工程施工质量的检测数量应按抽查面积与防水层总面积的1/10考虑，这一比例要求对检验防水层质量具有一定代表性，实践也证明是可行的；节点部位为重点，应全部检查。7.1. 5规定了防水材料及主要相关材料现场抽样数量和复验项目的内容要求。7.2砂浆防水层7. 2.1 设计所采用材料的主要性能指标应符合本规程第4.2. 1、
