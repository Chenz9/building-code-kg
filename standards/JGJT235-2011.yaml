- id: JGJ/T 235-2011#o.5
  standard_code: JGJ/T 235-2011
  chapter: 条文说明
  section: ''
  clause_no: o.5
  text: o.5kN/m2地区的外墙”两种情形。二类是指降水量较大、风压较强的有外保温外墙，包含“年降水量大于等于400mm 且基本风压大于等于O.4kN/m2地区有外保温的外墙”、“年降水量大于等于500mm 且基本风压大于等于0.35kN／时地区有外保温的外墙”和“年降水量大于等于600mm 且基本风压大于等于0.3kN/m2地区有外保温的外墙”三种情形。调查和问卷反馈的情况显示，由于外墙外保温的广泛实施，以及目前常用的保温材料和外保温构造做法，使外墙更易发生渗漏。并且即使水分不进入外墙本体和室内，只要进入保温层，就会严重降低保温效果和保温层的耐久性。据研究，保温层的导热系数会随着含水率的增加呈线性增大。所以本规程规定上述情形下的外墙需要采取墙面整体防水，以加强保温功能的实现。外墙防水类别划分的主要考虑因素为：1 年降水量、基本风压等气候参数与外墙渗漏的高度关联性外墙渗漏究其根本原因是有水的来源，主要是降雨，雨水可以沿着墙体的裂缝、薄弱的节点缝隙进入墙体内部甚至室内，或是通过墙体非密实的孔隙渗入墙体内部；同时，水的冻融也对墙体产生破坏作用，因此降水量的大小必然是防水的主要依据。风压的增加会增大与墙体接触的雨水量和雨水对墙体的渗透压力，也会加大墙面雨水的爬升高度，致使外墙的渗漏水率增加，加剧渗漏水程度。本规程防水设计规定与实际防水工程的对应性调研资料和问卷调查的结果显示，广西、广东、福建、云南、贵州、江西（部分）、湖南、湖北（部分）等地区的建筑主要采用无保温或者自保温的外墙，主要采用防水砂浆进行墙面整体设防，饰面层主要采用面砖和涂料；上海、江苏、浙江、安徽、江西（部分）、湖北（部分）等地区的建筑主要采用外保温或内保温的外墙，也采用墙面整体设防；北方城市（淮河、秦岭以南地区）的建筑主要采用外保温的外墙，也采用墙面整体设防，饰面层采用饰面涂料为主。因此本规程对外墙的墙面整体防水要求作出了合理和切实可行的规定。
