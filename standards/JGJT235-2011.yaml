  tables: []
  converted_tables:
  - raw: 滴水线具有阻止水流向外墙面的功能。在凸出外墙的窗台、窗帽、雨篷、阳台、女儿墙压顶和突出外墙的腰线等部位均要做滴水线，滴水线的形式有滴水槽和鹰嘴两种，通常采用水泥砂浆制作，也可采用金属（不锈钢、铝合金）预制件。基本规定3. 0.1对建筑外墙防水提出的基本功能要求，主要有以下三个方面因素：1 雨雪水侵人墙体，会对墙体产生侵蚀作用，进人室内，将会影响使用；当有保温层时，还会降低热工性能，达不到原设计保温隔热的节能指标，由此产生的损害应引起高度的认识和重视。防止雨水雪水侵人墙体是外墙防水的最重要功能。建筑外墙的防水层自身及其与基层的结合应能抵抗风荷载的破坏作用。冻融和夏季高温将影响建筑外墙防水的使用寿命，降低使用功能。
    note: 合并重复提取片段
