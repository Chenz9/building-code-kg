  converted_tables:
  - raw: 本条规定了变形缝的做法。合成高分子防水卷材的柔’性及延伸性可以与基层很好地贴合，两端采用满粘法固定，并辅之以金属压条和锚栓，同时应做好卷材的收头密封，使外墙变形缝部位完全封闭，达到可靠的防水要求。变形缝可采用不锈钢板进行封盖，也可采用铝合金板、镀悻薄钢板等具有防腐蚀的金属板封盖，既有防护功能，同时具有装饰作用。5.3. 5伸出外墙管道指空调管道、热水器管道、排油烟管道等，由于安装的需要，管道和管道孔壁间会有一定的空隙，雨水在风压作用下会飘入到空隙中，另外孔道上部顺墙流下的雨水也会爬人空隙中，进而渗入墙体中或室内。因此伸出外墙管道宜采用套管的形式，套管周边做好密封处理，并形成内高外低的坡度，使雨水能向外排出。如管道安装完成后固定不动的，可将管道和套管间的空隙用防水砂浆封堵。伸出外墙管道防水构造的图5. 3. 5 1为混凝土墙体，图5.3. 5 2为砌筑墙体。
