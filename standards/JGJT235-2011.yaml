  standard_code: JGJ/T 235-2011
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.6
  text: 建筑外墙防水采用的防水材料及配套材料除应符合外墙 各构造层的要求外．尚应满足安全及环保的要求。
