    max_value: 8.0
  tables: []
  converted_tables:
  - raw: 节点部位是防水设计的重点部位，也是渗漏的多发区，如门窗洞口周边、伸出外墙管道、设备安装的预埋件、墙体分格缝等；大面防水层施工前，应先对这些节点部位根据做法要求进行密封处理。6. 2. 4防水砂浆是外墙防水的主要材料，应用还处于发展阶段，许多工程技术人员对防水砂浆的材料要求、施工技术和施工要点尚不熟悉，对此应给予足够的重视。防水砂浆要有坚固的基层方可充分发挥作用，为保证与基层的粘结能力，基层表面应为干净的毛面，抹压防水砂浆前基层应充分温润，以保证防水砂浆中有足够的水分使水泥产生水化反应。一般防水砂浆在施工现场搅拌，配比的准确性、拌合器具、搅拌机具、投料顺序、搅拌时间等对防水砂浆的性能有较大的影响，施工时应严格控制。拌制好的砂浆应及时用完，宜随拌随用，以免拌制好的砂浆放置时间过长，造成初凝结块现象；己产生结块现象的材料不得用于工程。为保证防水砂浆与基层的粘结能力，抹压防水砂浆前应进行界面处理。厚度是保证防水砂浆抗渗能力的重要因素，砂浆一次涂抹厚度越大，厚薄不均匀的现象越严重。为保证防水砂浆厚薄的均匀性，厚度大于lOmm时应分层施工。分层施工应注意层间的粘结，不得出现空鼓现象。一个分格区域内每层宜连续施工，以保证防水砂浆的连续性。如面积过大不能连续施工时，应留设阶梯坡形茬，以保证接茬部位的水密性，接茬部位和施工做法应符合相关要求。涂抹施工有抹压和喷涂两种。无论采用哪种方法，防水砂浆层应压实、抹平，以保证砂浆防水层的密实性。普通防水砂浆每层的施工厚度宜为5mm～lOmm，聚合物防水砂浆每层的施工厚度宜为lmm～3mm ，防水层的厚度应根据材料特性确定。窗台、窗帽和凸出墙面的腰线等，为使水及时排走，其上表应做成向外的流水坡，下端设鹰嘴或滴水线（槽）使水不会流到根部。防水砂浆是刚性材料，抗裂性能较差，而建筑外墙在结构材料、构造发生变化的部位容易产生变形裂缝，所以在这些部位宜设置分格缝，嵌填密封材料，以柔性材料来适应基层的变形。由于材料的线膨胀系数不同，门框、窗框、管道、预埋件等与防水砂浆的交接处，易产生温差裂缝而成为渗水通道，因此对这些部位均应留设凹槽用密封胶嵌填。为防止应力集中出现裂缝，砂浆防水层的转角部位应用专用抹灰工具抹成弧形。聚合物防水砂浆在硬化过程中，既有水泥的水化反应，又有聚合物乳液的脱水固化过程，因此，在聚合物防水砂浆完工后初期，采用不洒水的自然养护，时间根据聚合物乳液的掺量、环境温度确定，→般在48h左右，硬化后再采用干湿交替养护的方法；其他的防水砂浆在终凝后采用洒水保湿养护。
    note: 合并重复提取片段
  references: []
