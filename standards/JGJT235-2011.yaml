- id: JGJ/T 235-2011#4.1.1
  standard_code: JGJ/T 235-2011
  chapter: 4 材料
  section: ''
  clause_no: 4.1.1
  text: 建筑外墙防水工程所用材料应与外墙相关构造层材料 相容。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables:
  - table_id: 表4.2.1
    type: parameter_table
    note: 条件→参数查表（OCR合并正文，行列结构缺失）
    content: 表4.2.1的规定，检验方法应按现行国家标准《预拌砂浆》GB/T25181的有关规定执行。表4.2.1普通防水砂浆主要性能项目指标稠度（mm)50, 70, 90终凝时间（h)二主8,二主12,二主24抗渗压力CMPa)28d二主0.6拉伸粘结强度（MPa)14d二三0.20收缩率（%）28d主三o.154. 2. 2聚合物水泥防水砂浆主要’性能应符合表4.2.2的规定，检验方法应按现行行业标准《聚合物水泥防水砂浆》JC/T984执行。表4.2.2聚合物水泥防水砂浆主要性能指标项目于粉类乳液类初凝（min)二三45二三45凝结时间终凝Chl主二12＝二24续表4.2. 2指标项目干粉类乳液类抗渗压力CMPa)7d二三1.07d二主1.0粘结强度CMPal28d抗压强度CMPal二三24.0抗折强度CMPal28d二主8.0收缩率（%）28d三三0.15压折比主二3
  converted_tables:
  - raw: 相容性是指不同材料间不产生破坏作用或降低性能的物理化学反应的性质。通常讲，就是材料与材料之间（比如防水材料与界面材料、防水材料与饰面材料以及不同防水材料之间）不会产生起泡、鼓泡、粘结失效（或强度等性能下降）等现象。在建筑外墙防水工程中，选择材料时一定要考虑材料之间的相容性，否则会引起防水作用减小或失效。4.1. 2墙体的构造不同、外保温的做法不同，所使用的防水材料不同，对防水材料的性能要求也不同；防水材料’性能应满足设计要求，同时应符合相应材料标准规定的指标要求。4.2防水材料4. 2.1防水砂浆分为聚合物水泥防水砂浆和普通防水砂浆。普通防水砂浆分为湿拌防水砂浆和干混防水砂浆两种。湿拌防水砂浆是用水泥、细骨料、水以及根据防水性能确定的各种外加剂，按一定比例，在搅拌站经计量、拌制后，采用搅拌运输车运至使用地点，放人专用容器储存，并在规定时间内使用完毕的湿拌拌合物。干？昆防水砂浆也叫干拌防水砂浆，是经干燥筛分处理的骨料与水泥以及根据防水d性能确定的各种组分，按一定比例在专业生产厂混合而成，在使用地点按规定比例加水或配套液体拌合使用的干混拌合物。各项性能指标的试验检测按照《预拌砂浆》GB/T 25181的相关规定执行。4. 2. 2聚合物水泥防水砂浆是以水泥、细骨料为主要原材料，以聚合物和添加剂等为改性材料并以适当配比混合而成的防水材料；具有一定的柔韧性、抗裂性和防水性，与各种基层墙体有很好的粘结力，可在潮温基面施工。在施工现场，只需加水搅拌即可施工，操作简单，使用方便。各项性能按照《聚合物水泥防水砂浆》JC/T984的相关规定执行。本规程规定其压折比小于等于3 ，收缩率小于等于0.15% ，以保证有较好的柔韧性和抗裂性能。4. 2.3聚合物水泥防水涂料，又称JS防水涂料，是以丙烯酸醋、乙烯醋等聚合物乳液和水泥为主要原料，掺加各种添加剂组成的双组分防水涂料。各项性能指标的试验检测按照《聚合物水泥防水涂料》GB/T23445的相关规定执行。聚合物水泥防水涂料按物理力学性能分为I型、E 型和皿型，I型适用于变形较大的基层，E 型和田型适用于变形较小的基层；建筑外墙受温度的影响，墙体基层产生的变形较大，因此，本规程选择I型产品的性能指标。产品中有害物质限量应符合《建筑防水涂料中有害物质限量》JC1066的要求。4. 2. 4聚合物乳液防水涂料是以各类聚合物乳液为主要原料，加人其他添加剂而制得的单组分水乳型防水涂料。各项性能指标的试验检测按照《聚合物乳液建筑防水涂料》JC/T864的相关规定执行，产品中有害物质限量应符合《建筑防水涂料中有害物质限量》JC1066的要求。4. 2. 5聚氨醋防水涂料分双组分、单组分两种；双组分聚氨醋防水涂料中的甲组分是以聚酷树脂和二异氨酸醋等原料，经过聚合反应制成的含有二异氨酸醋基CNOC）的巨氨基甲酸醋预聚物，乙组分是由交联剂、促进剂、增韧剂、增茹剂、防霉剂、填充剂和稀释剂等混合加工而成。单组分聚氨醋防水涂料是利用？昆合聚酷进行脱水，加人二异氨酸醋与各种助剂进行环氧改性制成。各项性能指标的试验检测按照《聚氨醋防水涂料》GB/T19250的相关规定执行，产品中有害物质限量应符合《建筑防水涂料中有害物质限量》JC1066的要求。4. 2.6 防水透气膜是具有防水透气功能的膜状材料，其主要性能指标是在对国内外有代表性的防水透气膜产品进行试验验证的基础上参考欧盟标准确定。水蒸气透过量按《塑料薄膜和片材透水蒸气性试验方法杯式法》GB/T1037中B 法；不透水性按《建筑防水卷材试验方法第10部分沥青和高分子防水卷材不透水性》GB/T328 A法；最大拉力、断裂延伸率按《建筑防水卷材试验方法第9部分高分子防水卷材拉伸性能》GB/T328;撕裂性能按《建筑防水卷材试验方法第18部分改性沥青防水卷材撕裂性能钉杆法》GB/T328进行检测。4.3密封材料
