  chapter: 7 居住区、居住建筑
  section: 7.2居住绿地
  clause_no: 7.2.2
  text: 出入口应符合下列规定：1居住绿地的主要出入口应设置为无障碍出入口；有3个以上出入口时，无障碍出入口不应少于2个；2居住绿地内主要活动广场与相接的地面或路面高差小于300mm时，所有出入口均应为无障碍出入口；高差大于300mm时，当出入口少于3个，所有出入口均应为无障碍出入口，当出入口为3个或3个以上，应至少设置2个无障碍出入口；3组团绿地、开放式宅间绿地、儿童活动场、健身运动场出入口应设提示盲道。
