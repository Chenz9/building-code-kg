- id: GB 50763-2012#3.5.3
  standard_code: GB 50763-2012
  chapter: 3 无障碍设施的设计要求
  section: 3.4轮椅坡道
  clause_no: 3.5.3
  text: 门的无障碍设计应符合下列规定：1不应采用力度大的弹簧门并不宜采用弹簧门、玻璃门；当采用玻璃门时，应有醒目的提示标志；自动门开启后通行净宽度不应小于1.00m；平开门、推拉门、折叠门开启后的通行净宽度不应小于800mm，有条件时，不宜小于900mm；4在门扇内外应留有直径不小于1.50m的轮椅回转空间；5在单扇平开门、推拉门、折叠门的门把手一侧的墙面，应设宽度不小于400mm的墙面；△6平开门、推拉门、折叠门的门扇应设距地900mm的把手，宜设视线观察玻璃人并宜在距地350mm范围内安装护门板；门槛高度及们内外地面高差不应大于15mm，并以斜面过渡；无障碍通道上的门扇应便于开关，宜与周围墙面有一定的色彩反差，方便识别。
