    - 建筑院落的出入口以及院内广场、通道有高差时（应设置轮椅坡道）
    - 码头与无障碍园路和广场衔接处有高差时（应设置轮椅坡道）
    - 无障碍游览路线上的桥与园路、广场衔接有高差时（应设轮椅坡道）
