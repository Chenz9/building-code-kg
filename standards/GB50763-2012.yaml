  text: 为公众办理业务与信访接待的办公建筑的无障碍设施应符合下列规定：1建筑的主要出入口应为无障碍出入口；2建筑出入口大厅、休息厅、贵宾休息室、疏散大厅等人员聚集场所有高差或台阶时应设轮椅坡道，宜提供休息座椅和可以放置轮椅的无障碍休息区；3公众通行的室内走道应为无障碍通道，走道长度大于60.00m时，宜设休息区，休息区应避开行走路线；4供公众使用的楼梯宜为无障碍楼梯；5供公众使用的男、女公共厕所均应满足本规范第3.9.1条的有关规定或在男、女公共厕所附近设置1个无障碍厕所，且建筑内至少应设置1个无障碍厕所，内部办公人员使用的男、女公共厕所至少应各有1个满足本规范第3.9.1条的有关规定或在男、女公共厕所附近设置1个无障碍厕所；6法庭、审判庭及为公众服务的会议及报告厅等的公众坐席座位数为300座及以下时应至少设置1个轮椅席位，300座以上时不应少于Q!2%且不少于2个轮椅席位。
