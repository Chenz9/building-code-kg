- id: GB 50763-2012#1.0.1
  standard_code: GB 50763-2012
  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: 为建设城市的无障碍环境，提高人民的社会生活质量，确保有需求的人能够安全地、方便地使用各种设施，制定本规范。
