  clause_no: 8.4.2
  text: 医疗康复建筑中，凡病人、康复人员使用的建筑的无障碍设施应符合下列规定：室外通行的步行道应满足本规范第3.5节有关规定的要求;院区室外的休息座椅旁，应留有轮椅停留空间；主要出入口应为无障碍出入口，宜设置为平坡出入口；4室内通道应设置无障碍通道，净宽不应小于1.80m，并按照本规范第3.8节的要求设置扶手；5门应符合本规范第3.5节的要求；6同一建筑内应至少设置1部无障碍楼梯；7建筑内设有电梯时，每组电梯应至少设置1部无障碍电梯；8首层应至少设置1处无障碍厕所；各楼层至少有1处公共厕所应满足本规范第3.9.1条的有关规定或设置无障碍厕所；病房内的厕所应设置安全抓杆，并符合本规范第3.9.4条的有关规定；9儿童医院的门、急诊部和医技部，每层宜设置至少1处母婴室，并靠近公共厕所；10诊区、病区的护士站、公共电话台、查询处、饮水器、自助售货处、服务台等应设置低位服务设施；11无障碍设施应设符合我国国家标准的无障碍标志，在康复建筑的院区主要出入口处宜设置盲文地图或供视觉障碍者使用的语音导医系统和提示系统供听力障碍者需要的手语服务及文字提示导医系统。
