- id: GB 50763-2012#8.6.2
  standard_code: GB 50763-2012
  chapter: 8 公共建筑
  section: 8.6体育建筑
  clause_no: 8.6.2
  text: 体育建筑的无障碍设施应符合下列规定1特级、甲级场馆基地内应设置不少于停车数量的2%，且不少于2个无障碍机动车停车位，乙级、丙级场馆基地内应设置不少于2个无障碍机动车停车位；2建筑物的观众、运动员及贵宾出入口应至少各设1处无障碍出入口，其他功能分区的出入口可根据需要设置无障碍出入口;3建筑的检票口及无障碍出入口到各种无障碍设施的室内走道应为无障碍通道，通道长度大于60.00m时宜设休息区，休息区应避开行走路线：4大厅，休息厅、贵宾休息室、疏散大厅等主要人员聚集场宜设放置轮椅的无障碍休息区；，5供观众使用的楼梯应为无障碍楼梯；特级、甲级场馆内各类观众看台区、主席台、贵宾区内如设置电梯应至少各设置1部无障碍电梯，乙级、丙级场馆内坐席区设有电梯时，至少应设置1部无障碍电梯，并应满足赛事和观众的需要；7特级、甲级场馆每处观众区和运动员区使用的男、女公共厕所均应满足本规范第3.9.1条的有关规定或在每处男、女公共厕所附近设置1个无障碍厕所，且场馆内至少应设置1个无障碍厕所，主席台休息区、贵宾休息区应至少各设置1个无障碍厕所；乙级、丙级场馆的观众区和运动员区各至少有1处男、女公共厕所应满足本规范第3.9.1条的有关规定或各在男、女公共厕所附近设置1个无障碍厕所；8运动员浴室均应满足本规范第3.10节的有关规定；9场馆内各类观众看台的坐席区都应设置轮椅席位，并在轮椅席位旁或邻近的坐席处，设置1：1的陪护席位，轮椅席位数不应少于观众席位总数的0.2%。
