- id: GB 50763-2012#1.0.2
  standard_code: GB 50763-2012
  chapter: 1 总则
  section: ''
  clause_no: 1.0.2
  text: 本规范适用于全国城市新建、改建和扩建的城市道路、城市广场、城市绿地、居住区、居住建筑、公共建筑及历史文物保护建筑等。本规范未涉及的城市道路城市广场、城市绿地、建筑类型或有无障碍需求的设计，宜按本规范中相似类型的要求执行。农村道路及公共服务设施宜按本规范执行。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 本规范适用于全国城市新建、改建和扩建的城市道路、城市广场、城市绿地、居住区、居住建筑、公共建筑及历史文物保护建筑等。
