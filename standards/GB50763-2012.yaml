- id: GB 50763-2012#4.2.1
  standard_code: GB 50763-2012
  chapter: 4 城市道路
  section: 4.2人行道
  clause_no: 4.2.1
  text: 人行道在各种路口、各种出入口位置必须设置缘石坡道；人行横道两端必须设置缘石坡道。4.2.人行道处盲道设置应符合下列规定：城市主要商业街、步行街的人行道应设置盲道；视觉障碍者集中区域周边道路应设置盲道；坡道的上下坡边缘处应设置提示盲道；道路周边场所、建筑等出入口设置的盲道应与道路盲道相衔接。4.2. 3人行道的轮椅坡道设置应符合下列规定：人行道设置台阶处，应同时设置轮椅坡道；轮椅坡道的设置应避免干扰行人通行及其他设施的使用。4.2. 4人行道处服务设施设置应符合下列规定：服务设施的设置应为残障人士提供方便；宜为视觉障碍者提供触摸及音响一体化信息服务设施；3设置屏幕信息服务设施，宜为听觉障碍者提供屏幕手语及字幕信息服务；4低位服务设施的设置，应方便乘轮椅者使用；5设置休息座椅时，应设置轮椅停留空间。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
