- id: GB 50763-2012#3.7.2
  standard_code: GB 50763-2012
  chapter: 3 无障碍设施的设计要求
  section: 3.7无障碍电梯、升降平台
  clause_no: 3.7.2
  text: 无障碍电梯的轿厢应符合下列规定：1 轿厢门开启的净宽度不应小于800mm；2 在轿厢的侧壁上应设高0.90m～1.10m带盲文的选层按钮，盲文宜设置于按钮旁；3 轿厢的三面壁上应设高850mm～900mm扶手，扶手应符合本规范第3.8节的相关规定；4 轿厢内应设电梯运行显示装置和报层音响；5 轿厢正面高900mm处至顶部应安装镜子或采用有镜面效果的材料；6 轿厢的规格应依据建筑性质和使用要求的不同而选用，最小规格为深度不应小于1.40m、宽度不应小于1.10m，中型规格为深度不应小于1.60m、宽度不应小于1.40m，医疗建筑与老人建筑宜选用病床专用电梯；7 电梯位置应设无障碍标志，无障碍标志应符合本规范第3.16节的有关规定。
