  clause_no: 5.2.3
  text: 城市文场盲道的设置应符合下列规定：1设有台阶或坡道时，距每段台阶与坡道的起点与终点250mm～500mm处应设提示盲道，其长度应与台阶、坡道相对应，宽度应为250mm～500mm；人行道中有行进盲道时，应与提示盲道相连接。5.2. 4城市广场的地面有高差时坡道与无障碍电梯的选择应符合下列规定：设置台阶的同时应设置轮椅坡道；当设置轮椅坡道有困难时，可设置无障碍电梯。5.2. 5城市广场内的服务设施应同时设置低位服务设施。5.2. 6男、女公共厕所均应满足本规范第8.13节的有关规定。5.2. 7城市广场的无障碍设施的位置应设置无障碍标志，无障碍标志应符合本规范第3.16节的有关规定，带指示方向的无障碍设施标志牌应与无障碍设施标志牌形成引导系统，满足通行的连续性。
