- id: GB 50763-2012#6.2.6
  standard_code: GB 50763-2012
  chapter: 6 城市绿地
  section: 6.2公园绿地
  clause_no: 6.2.6
  text: 常规设施的无障碍设计应符合下列规定：1在主要出入口、主要景点和景区，无障碍游憩区内的游憩设施、服务设施、公共设施、管理设施应为无障碍设施；2游憩设施的无障碍设计应符合下列规定：1）在没有特殊景观要求的前提下，应设为无障碍游憩设施；2）单体建筑和组合建筑包括亭、廊、榭、花架等，若有台明和台阶时，台明不宜过高，入口应设置坡道，建筑室内应满足无障碍通行；3）建筑院落的出入口以及院内广场、通道有高差时，应设置轮椅坡道；有三个以上出入口时，至少应设两个无障碍出入口，建筑院落的内廊或通道的宽度不应小于1.20m;4）码头与无障碍园路和广场衔接处有高差时应设置轮椅坡道；5）无障碍游览路线上的桥应为平桥或坡度在8%以下的小拱桥，宽度不应小于1.20m，桥面应防滑，两侧应设栏杆。桥面与园路、广场衔接有高差时应设轮椅坡道。3服务设施的无障碍设计应符合下列规定：1）小卖店等的售货窗口应设置低位窗口；2）茶座、咖啡厅、餐厅、摄影部等出入口应为无障碍出入口，应提供定数量的轮椅席位；3）服务台、业务台、咨询台、售货柜台等应设有低位服务设施。4公共设施的无障碍设计应符合下列规定：1）公共厕所应满足本规范第8.13节的有关规定，大型园林建筑和主要游览区应设置无障碍厕所；饮水器、洗手台、垃圾箱等小品的设置应方便乘轮椅者使用；3）游客服务中心应符合本规范第8.8节的有关规定；4）休息座椅旁应设置轮椅停留空间。5管理设施的无障碍设计应符合本规范第8.2节的有关规定。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 常规设施（游憩、服务、公共、管理设施）的无障碍设计
    conditions:
