  text: 无障碍厕所的无障碍设计应符合下列规定，1、位置宜靠近公共厕所,应方便乘轮椅者进入和进行回转.回转直径不小于1,50m 2。面积不应小于4,00m2。3、当采用平开门。门扇宜向外开启。如向内开启，需在开启后留有直径不小于1.50m的轮椅回转空间。门的通行净宽度不应小于800mm。平开门应设高900mm的横扶把手.在门扇里侧应采用门外可紧急开启的门锁.4、地面应防滑。不积水 5,内部应设坐便器，洗手盆，多功能台 挂衣钩和呼叫按钮 6 坐便器应符合本规范第3.9.2条的有关规定。洗手盆应符合本规范第3.9.4条的有关规定。7、多功能台长度不宜小于700mm,宽度不宜小于400mm 高度宜为600mm、8 安全抓杆的设计应符合本规范第3.9.4条的有关规定 9，挂衣钩距地高度不应大于1,20m。10、在坐便器旁的墙面上应设高400mm。
