- id: GB 50763-2012#6.2.4
  standard_code: GB 50763-2012
  chapter: 6 城市绿地
  section: 6.2公园绿地
  clause_no: 6.2.4
  text: 无障碍游览路线应符合下列规定：1 无障碍游览主园路应结合公园绿地的主路设置，应能到达部分主要景区和景点，并宜形成环路，纵坡宜小于5%，山地公园绿地的无障碍游览主园路纵坡应小于8%；无障碍游览主园路不宜设置台阶、梯道，必须设置时应同时设置轮椅坡道；2 无障碍游览支园路应能连接主要景点，并和无障碍游览主园路相连，形成环路，小路可到达景点局部，不能形成环路时，应便于折返，无障碍游览支园路和小路的纵坡应小于8%，坡度超过8%时，路面应作防滑处理，并不宜轮椅通行；3 园路坡度大于8%时，宜每隔10.00m~20.00m在路旁设置休息平台；4 紧邻湖岸的无障碍游览园路应设置护栏，高度不应低于900mm；5 在地形险要的地段应设置安全防护设施和安全警示线，路面应平整、防滑、不松动。
  is_abolished: true
  abolished_date: '2022-04-01'
  superseded_by: GB 55019-2021
  abolition_note: 被《建筑与市政工程无障碍通用规范》GB 55019-2021 废止强制性条文效力（住建部公告2021年第174号，2022-04-01 起实施）
  applicability:
    scope: 无障碍游览路线（园路）
    conditions:
    - 当无障碍游览主园路必须设置台阶、梯道时（应同时设置轮椅坡道）
    - 当无障碍游览支园路和小路坡度超过8%时（路面应作防滑处理，并不宜轮椅通行）
    - 当园路坡度大于8%时（宜每隔10.00m~20.00m在路旁设置休息平台）
    exceptions: []
