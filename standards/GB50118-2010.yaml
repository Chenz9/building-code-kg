    content: 表7.2.2的规定。2旅馆建筑内的电梯间，高层旅馆的加压泵、水箱间及其他产生噪声的房间，不应与需要安静的客房、会议室、多用途大厅等毗邻，更不应设置在这些房间的上部。确需设置于这些房间的上部时，应采取有效的隔振降噪措施。3走廊两侧配置客房时，相对房间的门宜错开布置。走廊内宜采用铺设地毯、安装吸声吊顶等吸声处理措施，吊顶所用吸声材料的降噪系数（NRC）不应小于0.40。4相邻客房卫生间的隔墙，应与上层楼板紧密接触，不留缝隙。相邻客房隔墙上的所有电气插座、配电箱或其他嵌入墙里对墙体构造造成损伤的配套构件，不宜背对背布置，宜相互错开，并应对损伤墙体所开的洞（槽）有相应的封堵措施。5客房隔墙或楼板与玻璃幕墙之间的缝隙应使用有相应隔声性能的材料封堵，以保证整个隔墙或楼板的隔声性能满足标准要求。在设计玻璃幕墙时应为此预留条件。6当相邻客房橱柜采用“背靠背”布置，两个橱柜应使用满足隔声标准要求的墙体隔开。
  converted_tables:
  - raw: 如果客房之间隔墙上有通风或排风管道直接相连，则客房内的噪声会通过管道传到毗邻的房间，降低隔墙的隔声性能，为了解决这个问题，规定本条中第1款。一般客房墙面上均有许多电气插座和接线箱，尤其是一般集中控制的接线箱尺寸和厚度均较大，如果隔墙两侧的接线箱相对，则会导致墙体构造在这些位置变得很薄，甚至形成连通的孔洞，而这些孔洞对于墙体的隔声性能会有很大的影响，为了防止这种情况，规定本条中第4款。现在许多旅馆建筑中为了外立面的美观，设计了大片的玻璃幕墙，但由于构造的原因，房间之间的隔墙和楼板是不能直接与玻璃幕墙相连接的，必须留有定的缝隙，这样就会形成传声通道，降低隔墙或楼板的整体隔声性能，所以必须对这些缝隙进行封堵。封堵构造必须在玻璃幕墙设计时就预留条件，如增加窗框的厚度等。因此规定本条中第5款。有关旅馆声学设计的规范，几乎涉及建筑声学的全部内容。因为近代旅馆除客房外，还包括：高标准的俱乐部（音乐厅、舞厅、会议厅）、各种健身房、共享大厅或多功能大厅、餐厅兼宴会厅等，这类房间都有音质设计问题，本规范侧重于隔声设计。关于音质问题可参看有关专门资料。8办公建筑8.1允许噪声级
