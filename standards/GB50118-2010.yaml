  text: 、5.1.2本章中的学校建筑是指大量性的用于日常教学活动的场所，不包括如音乐厅、体育馆和多功能厅等专业用途的空间，这些空间中的声学指标可参照相应的声学设计规范。本章中的教学用房不包括特殊教育学校中的教室，这些教室中的允许噪声值指标可参考《特殊教育学校建筑设计规范》JGJ76－2003。允许噪声级不包括教学活动及教学设备所产生的噪声，但包括建筑设备（如空调）的噪声。室内允许噪声级旨在提出教学用房和辅助用房室内噪声的最大值，以保障学校教学活动中学生的注意力不受来自外界和内部噪声的影响，提高教学用房内的语言清晰度。与原规范《民用建筑隔声设计规范》GBJ11888相比，这次修订取消了房间允许噪声级的分级，而根据学校建筑中各种房间的安静要求程度，分别给出了主要教学用房和教学辅助用房的最大噪声允许值。本章中普通教室是指教师采用自然声授课的教室，不包括采用扩声设备的教室。由于本规范的室内噪声采用关窗条件下无教学人员时测得的噪声值，所以房间内的最大噪声值要求较原规范有所提高。在教学用房中，取消了原规范对录音室的噪声要求，主要考虑到在学校建筑中录音室的数量较少，而声学要求较高，所以需根据录音室的专业标准进行专门声学设计。本章修订中，参考了英国BuildingBulletin93和美国ANSIS12.60-2002中有关学校建筑的声学设计标准，增加了教学楼封闭走廊和楼梯间的噪声要求，主要考虑到这些空间与教室相邻，为减少噪声干扰，这些空间内的允许噪声级也需有一定的限值。5.2隔声标准
