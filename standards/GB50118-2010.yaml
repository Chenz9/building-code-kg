    note: 条件→参数查表（OCR合并正文，行列结构缺失）
    content: 表4.2.7的规定。表 4.2.7分户楼板撞击声隔声标准构件名称撞击声隔声单值评价量(dB)卧室、起居室(厅）计权规范化撞击声压级Ln，w（实验室测量）<75的分户楼板计权标准化撞击声压级L'nT.w（现场测量）注：当确有困难时，可允许住宅分户楼板的撞击声隔声单值评价量小于或等于85dB，但在楼板结构上应预留改善的可能条件。
  - table_id: 表4.2.7
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 、4.2.8对住宅分户楼板的撞击声隔声性能作规定，旨在控制楼板上层产生的诸如脚步声、物体坠地等撞击噪声对楼下住户的干扰。采用计权规范化撞击声压级（符号：Ln，w）作为分户楼板构件撞击声隔声性能的评价量，其指标值是构件的实验室测量值，供设计师隔声设计选材使用；采用计权标准化撞击声压级（符号：LnT,w）作为现场分户楼板撞击声隔声性能的评价量，其指标值是现场测量值，是住宅建成并完成地面装修后实际要达到的值。测量方法见GB/T19889.6、GB/T19889.7和GB/T19889.14，评价方法见GB/T50121。国外对楼板撞击声隔声的要求普遍较高，例如，英国、澳大利亚、美国及德国分户楼板撞击声隔声最低要求指标分别为L'nT,w 62dB、L'nT.w 62dB、IIC 45（相当于 L'.w 65dB）及Ln.w 53dB.国内住宅现场隔声测量调查表明，厚度在120mm～150mm的光裸混凝土楼板的计权标准化撞击声压级通常为80dB左右，普通的住宅混凝土楼板如果不做隔声装修，是达不到表4.2.7中规定的撞击声隔声要求的。因此，要使楼板的计权标准化撞击声压级不超过75dB，在建筑设计时就需要考虑对楼板采取必要的隔声措施。混凝土楼板上铺装弹性地面材料或建造由弹性材料隔开面层的浮筑楼板，均可有效改善楼板撞击声隔声性能。结合地面装修铺装弹性地面材料是解决楼板撞击声隔声问题的简易而又有效的措施。通常在混凝土楼板上铺装计权撞击声改善量大于5dB（测量方法见GB/T19889.8）的地面材料，如木地板（无论是复合地板还是实木地板）或厚度3mm以上的弹性橡胶（橡塑）地板，可使楼板计权标准化撞击声压级不超过75dB。层高较高的住宅楼，也可在楼板下设置隔声吊顶，实测隔声吊顶对撞击声的改善量为10dB左右。要想在住宅地面使用硬性地砖，一般需加隔声垫层（浮筑楼板）或隔声吊顶，才可使楼板计权标准化撞击声压级控制在75dB以内。据国家建筑工程质量监督检验中心近几年进行的隔声现场调查和检测资料，住户对LnT,w在80dB左右的楼板的撞击声隔声现状的抱怨远不及对DnT,w在40dB至45dB之间分户墙的空气声隔声现状的抱严重。根据我国经济和建筑技术水平的实际情况、发展趋势以及住户的反应，结合考虑国内商品房和保障性住房等住宅的不同特点与供给原则，本规范保留了原规范（GBJ11888）楼板撞击声隔声的高要求标准和低限标准及附注，供不同性能要求的住宅设计使用。本规范4.2.7条和4.2.8条的楼板撞击声隔声要求也适用于卧室、起居室与上层门厅、走廊之间的楼板。本规范暂不对住宅厨房、卫生间楼板的撞击声隔声性能作规定，一一是考虑到厨房、卫生间地面要做防水处理，通常楼板较厚，面积也不大，楼板撞击声问题不突出；二是考虑到厨房、卫生间对地面材料有较高的防水要求（地面一般采用水泥、瓷砖等硬性防水材料），要求这些地面全做浮筑楼板或铺弹性材料不切实际。4.3隔声减噪设计
