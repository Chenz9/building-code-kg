  - raw: 条的规定。2室内噪声级的测量值为等效［连续A计权」声级。3对不同特性噪声的测量值，应按本规范表A.0.4的规定进行修正。
    note: 合并重复提取片段
  - raw: 允许噪声级是室内噪声容许标准，一般可以用NR评价曲线或A声级来规定。NR评价曲线是人为规定的各频带（从低频至高频）噪声声压级的曲线，往往用它检查是哪些频带的噪声有问题。在通常的声级范围内，A声级与人们对声音响度的主观感觉有良好的相关性，使用简便，是被广泛采用的单值评价方法。因此，本规范选用A声级来规定允许噪声级。这样也有利于室内、室外噪声标准的衔接，因为我国室外环境噪声的标准《声环境质量标准》GB3096-2008中也是用A声级来规定的。本规范中规定了房间关窗状态下的室内允许噪声级。医院建筑中的某些房间（如病房等）因卫生原因需要开窗使用，故也对这些房间开窗时的室内允许噪声级作了规定。在目前室外噪声源增多、室外噪声较高（尤其是城市交通干线、高速公路、铁路、机场附近）的情况下，要求在开窗状态室内的噪声也较低是比较困难的。为减小室外噪声对房间内的于扰，增强房间外窗部位的隔声能力是从建筑本身所能采取的主要、有效措施。虽然关窗可以降低室外噪声对室内的影响，但关窗也隔断了室内外的空气交流，不利于房间内的空气新鲜。所以，在规划、设计民用建筑时，仍应尽可能从平面布置方面采取防噪措施，争取实现在开窗状态下，房间内的噪声也能达到本规范中室内允许噪声级的正常情况下，人们在昼间工作、学习，在夜间休息、睡觉。人的不同生活状态对安静程度的要求是不同的。国内外声学专家通过调查研究后提出，人睡眠时的安静程度，理想状态是A声级30dB以下，若达不到理想状态，最差A声级也不能大于50dB；交谈、思考时对安静程度的要求，理想状态是A声级40dB以下，最差A声级也不能大于60dB。.人睡眠时对安静程度的要求最高，因而一般噪声在夜间比昼间对人有更大的干扰。正是由于人们叠间活动、夜间休息，因而昼间噪声较高、夜间噪声较低。因此，本规范对夜间人们要在其中睡觉的民用建筑，按昼间、夜间两个不同时段分别规定室内的允许噪声级。也有国家将一天分成白天、晚、夜间三个时段，分别规定各个时段的允许噪声级。但是，将一天分成白天、傍晚、夜间三个时段的必要性并不高，还增加了执行、操作的困难，所以本规范对有需要的民用建筑，按白天、夜间两个时段分别规定室内的允许噪声级。由于我国幅员辽阔，跨越多个时区，有些地方政府考虑当地的时差、作息习惯而对昼间、夜间的划分另有规定。对于这种情况昼间和夜间时段所对应的时间可以按照当地人民政府的规定。2　术语和符号2.1术．语本规范中的术语，只是为了说明本规范中有关项目的物理意义，而不追求该术语的全部完整定义。其中，部分术语按《声学名词术语》GB/T3947－1996给出，部分术语参考有关建筑隔声标准和习惯上常用的词汇编写。
    note: 合并重复提取片段
