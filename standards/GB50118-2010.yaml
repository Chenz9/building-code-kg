    content: 表7.1.1中的不同房间从使用功能考虑，允许噪声级在昼间和夜间差别是不同的。如客房由于有睡眠的要求，所以昼间和夜间的允许噪声级的差别较大，但会议室、多用途厅等房间对昼间和夜间的允许噪声级的要求没有差别，所以在表7.1.1中分别给出了不同房间昼间和夜间的允许噪声标准。2.原规范中有四个等级，考虑到社会的进步和人们对旅馆舒适性要求的提高，本次修编中取消原规范中的最低等级（客房中允许噪声级标准叠间为55dB（A），夜间为45dB（A）），以保证所有客房都能有比较满意的休息环境。3.原规范中客房允许噪声级夜间标准比叠间标准低10dB，但旅馆建筑，主要噪声源可能来自房间内部的风机盘管，昼间和夜间的变化不大，另外根据旅客调查结果，40dB（A)以内可以达到比较满意的睡眠环境，将客房内夜间和昼间的允许噪声值的差别定为5dB。.4.旅馆的其他用房，如会议室、多用途厅、舞厅、餐厅、办公室等的允许噪声级，与其他建筑中的相应用房没有大的区别，所以其充许噪声标准与本标准中办公建筑、商业建筑等章节中相应用房的允许噪声级标准一致。7.2隔声标准
