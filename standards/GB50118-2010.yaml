  - raw: 、5.2.2空气声隔声量标准参照《建筑隔声评价标准》GB/T50121-2005考虑了频谱修正量。教学用房的围护结构采用实验室测得的计权隔声量与粉红噪声频谱修正量之和：（Rw十C）作为隔声性能的评价指标。学校建筑设计中应尽量使产生噪声的房间与其他教学用房布置在不同的教学楼中，或在同一教学楼的不同区域。如受条件限制，少量产生噪声的房间确需与教学用房相邻，则应将相邻墙体和楼板的空气声隔声量提高至50dB，这在技术上和经济上当属可能。学校琴房由于数量较多面积较小，般采用非承重的轻质隔墙，规范中要求隔墙的隔声量不小于45dB，主要考虑了轻质隔墙可能达到的实际隔声量和经济性，过高的隔声量要求不切实际。另外，调查发现琴房的噪声主要通过外窗、门传播，尤其对于没有安装空调系统的学校琴房，所以单独提高隔墙的隔声量对琴房的实际噪声降低效果有限。普通教室之间隔墙和楼板的隔声量较原规范（GBJ118-88）中的要求提高了5dB为45dB，主要考虑本次修订规范的室内噪声级采用关窗条件下的测试结果，同时参考了美国和英国的学校声学标准，对于目前新建或改建的学校建筑应能够达到。
