  - raw: 由于我们人类生活在空气中，所以一般情况下（头处于水中时除外），我们听到的声音都是空气声。为帮助理解，举几个空气声的例子，如：邻室的电视声、邻室的谈话声、室外的交通噪声等。空气声隔声是通过在空气声的传播途径一空气中采取措施，增加声衰减。
