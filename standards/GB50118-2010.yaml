- id: GB 50118-2010#3.0.4
  standard_code: GB 50118-2010
  chapter: 3 总平面防噪设计
  section: ''
  clause_no: 3.0.4
  text: 在进行建筑设计前，应对环境及建筑物内外的噪声源作详细的调查与测定，并应对建筑物的防噪间距、朝向选择及平面布置等作综合考虑，仍不能达到室内安静要求时，应采取建筑构造上的防噪措施。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 无论设计独立的或群体的建筑，都需要对环境与建筑物内外的噪声源进行调查测定，然后作防噪设计的综合考虑。加大距离固然是防噪的有效措施，根据《公路建设项目环境影响评价规范》JTGB03－2006，当行车道上的小时交通量大于300辆时，交通噪声的衰减为10lg（ro/r）（r代表距离，ro二7.5m）；当行车道上的小时交通量小于300辆时，交通噪声的衰减为15lg（ro/r）。即距离加倍，噪声衰减3dB～4.5dB。但在一定距离之外，由于距离增加而致使噪声衰减的效果将逐渐减少。因此在城市用地紧张情况下，以加大距离，使噪声减低往往难以实现。从建筑平面布置上将安静要求较低的房间安置在噪声高的一侧是很有效的，前后室的噪声衰减量可以达到16dB，即使在前后室门打开有穿堂风的情况下，声衰减也可以达到9dB～10dB，但有时受到建筑物的朝向限制，因此必要时就需要采取建筑上的防噪措施。
