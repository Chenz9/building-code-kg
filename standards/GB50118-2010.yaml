- id: GB 50118-2010#1.0.2
  standard_code: GB 50118-2010
  chapter: 1 总则
  section: ''
  clause_no: 1.0.2
  text: 本规范适用于全国城镇新建、改建和扩建的住宅、学校、医院、旅馆、办公建筑及商业建筑等六类建筑中主要用房的隔声、吸声、减噪设计。其他类建筑中的房间，根据其使用功能，可采用本规范的相应规定。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 本规范适用于全国城镇新建、改建和扩建的住宅、学校、医院、旅馆、办公建筑及商业建筑等六类建筑中主要用房的隔声、吸声、减噪设计。
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 本规范主要针对住宅、学校、医院、旅馆、办公建筑及商业建筑等六类建筑中的噪声控制作了规定。对于学校、医院、旅馆、办公建筑中的会议室、教室等房间，在控制其中噪声的同时，兼顾了控制混响时间，以保证语言清晰。住宅建筑的标准也适用于公寓。住宅建筑的设计原则也适用于集体宿舍。学校建筑的标准适用于中、小学及大专院校的一般教学用房及教学辅助用房（图书馆等）。幼儿园的一一般教学用房应按学校建筑的标准设计，幼儿园的睡眠房间应按住宅建筑的标准设计。医院建筑的标准适用于综合医院，专科医院、疗养院与其他医院可采用综合医院相应房间的标准。旅馆建筑的标准适用于能够以夜为时间单位向客人提供相关服务的住宿设施。按不同习惯旅馆也被称为酒店、旅社、宾馆、招待所、度假村、俱乐部、大厦、中心等。办公建筑的标准适用于行政机关、企事业单位、商贸集团专用处理事务的建筑，也适用于其他各类建筑中的办公用房。商业建筑的标准适用于以商业经营为自的、有固定的服务人员和相对较多的流动人员的营业性场所，如购物中心、餐厅、娱乐场（迪斯科和KTV等）、健身中心、会展中心等等。
    note: 合并重复提取片段
