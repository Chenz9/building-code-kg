- id: GB 50118-2010#9.1.1
  standard_code: GB 50118-2010
  chapter: 9 商业建筑
  section: ''
  clause_no: 9.1.1
  text: 本条中的“空场”是指无人进人，暖通空调启动，正常照明，无背景音乐、货品或展品不发声的状况。商业建筑室内的噪声主要来源于外部传入噪声、设备机械噪声等背景噪声和室内人群走动、交谈等人为噪声。商业建筑室内声学设计的核心是，一方面降低室内背景噪声，另方面通过室内吸声控制人为噪声，为建筑空间提供舒适的声环境。健身中心、娱乐中心有较多可能发声器材或就是以发声为娱乐目的，因此，噪声限值不作规定。但是由医学研究表明，噪声达到80dB（A）以上时，对人的听觉系统、视觉系统、精神系统和消化系统会产生明显的负面影响，因此在健身中心或迪斯科、KTV等场所，噪声较高的情况下，有必要提醒消费者注意健康。餐厅、商业办公室、购物中心、走廊等有交谈需要，背景噪声级以不妨碍语言表达为宜。会展中心的声环境宜与展览的品位、档次相协调，背景噪声级宜尽可能低。员工休息室允许噪声级是以满足昼间上班期间临时休息的需要而确定的。9.2室内吸声
