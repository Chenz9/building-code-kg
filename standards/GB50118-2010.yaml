  - raw: 医院的人口大厅、挂号大厅、候药厅、候诊厅等是医院内人员较为密集、面积较大、净空较高的场所。如采用吸声性能差的材料做装修，这些空间的中频混响时间达4s甚至可能达到10s。当混响严重，人们不能用正常的噪音交流时，就不得不提高说话的声音，从而又提高了室内噪声水平，严重时室内声级将高达85dB（A)左右，非常噜杂。对此，应采取对应的声学措施，一是尽可能控制使其室内噪声水平小于72dB（A）（等效声级测量时间应大于5min），或控制室内中频混响时间不大于2s。因此，本条文提出控制此类场所500Hz～1000Hz混响时间不大于2s的规定。
