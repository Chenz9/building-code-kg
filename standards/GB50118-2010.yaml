  converted_tables:
  - raw: 根据GB/T14259-93，稳态噪声指在观察的时间内，具有可忽略不计的小的声级起伏的噪声。对于稳态噪声的测量，原规范是用声级计测量A声级，时间计权慢档，测量时间5s～15s，取平均值，实际上所得值近似等于等效［连续A计权」声级，随着检测技术和检测仪器的发展，测量等效「连续A计权」声级已是很简单的事，因此，稳态噪声的测量参数修订为等效[连续A计权］声级。2声级随时间变化较复杂的持续的非稳态噪声是指在观察时间内，声级连续在一个相当大范围变化的噪声，也就是GB/T14259-93定义的起伏噪声，例如道路交通噪声、工业噪声。按照GB/T14259－93的规定，测量此类噪声的最好方法是测量固定时间内的等效连续声压级，因此，本规范对此类噪声的测量方法是测量10min的等效［连续A计权］声级。3间歇性非稳态噪声是在观察时间内，声级多次突然下降到背景噪声级的噪声。如飞机噪声、铁路噪声等，对这种噪声是测量声源密集发声时20min的等效［连续A计权」声级，如果在测量时段内，仅与一个声源相关，应根据噪声特性对测量值进行修正。此方法是参照GB/T3222.1-2006中规定的重复性单一声事件的评价声级确定方法，并对其进行了简化。对于在测量时段内，有多个声源是相关的情况，对测量值的修正，本方法暂不作规定。4考虑到水泵是建筑物的服务设备，是建筑物的一部分，而且利用现有的技术手段，通过合理的建筑平面布置及采取有效的噪声控制措施，可使它的运行噪声达到标准要求，因此，对于水泵噪声，作为稳态噪声进行测量。5电梯运行时产生的噪声主要包括停止及启动噪声、运行噪声和开、关电梯门产生的噪声。因此，对电梯噪声的测量方法是测量包括这些动作的一个运行过程的等效连续声压级。运行过程的选择原则是：在室内产生较大电梯噪声的运行过程。例如，一个六层的建筑物，被测房间在三层。运行过程可以是：（1）从二层启动到四层停止；（2）从一层启动到四层停止；（3）从二层启动到三层停止；（4）从三层启动到四层停止；（5）从一层启动到六层停止，等等。从这些过程中选择对被测房间室内噪声较不利的过程作为测量运行过程。向上运行过程及向下运行过程所指的“向上或向下”是指电梯的运行方向。6根据GB/T3222.1-2006，有调声是指出自总声音且具有单一一频率或窄带频谱特性的可听声。对于噪声中是否包含有调声的判定方法及对测量值的修正参照了GB/T3222.1-2006及GB/T3222.2-2009（ISO1996-2：2007）中的相关规定。1511217934统一书号：15112：17934价：15.00
