- id: GB 50118-2010#A.0.1
  standard_code: GB 50118-2010
  chapter: 附录A 室内噪声级测量方法
  section: ''
  clause_no: A.0.1
  text: A.0.1室内噪声级的测量应符合下列规定：1室内噪声级的测量应在昼间、夜间两个不同时段内，各选择较不利的时间进行。昼间、夜间时段的划分应符合本规范第
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
