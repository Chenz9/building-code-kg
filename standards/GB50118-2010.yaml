  converted_tables:
  - raw: 允许噪声级是指室内无人占用、空调系统正常运转条件下应符合的噪声级。办公室、会议室的室内允许噪声级按安静程度划分为两个档次的标准，以适应不同标准的办公建筑。其中的低限标准是所有办公室、会议室都应达到的最低要求标准，高要求标准供高标准办公建筑设计使用。办公室、会议室内噪声的测量条件和测量方法见本规范附录A。根据近年在南京、太原、香港等地的询访、测量、分析，单人办公室一般都是职务级别较高的人员使用，对安静及私密的要求较高。依现在的允许噪声级，轻声语言交谈（大致是50dB(A)～55dB(A)），在有相应围护结构隔声条件下，足以保证语言交谈等办公活动的效率。为便于相对独立的办公人员之间业务联络，开放式、分格式的办公室已是一种常见的办公空间。在一个大的共享空间里数十人（甚至更多的人)办公，办公人员的“分格”之间只有装配的隔断分隔，安静标准相对宽松。在规定的限值条件下，办公人员业务联络时的一般语言交谈（大致55dB（A）～60dB（A)），不会引起对相邻房间办公活动的明显干扰。研究还表明，如果总声级超过57dB（A），就须提高噪音以抵消背景噪声，也将导致室内噪声级的提高。在此种空间里，常有办公设备的运行、操作声，有时还播放大致50dB(A)的掩蔽声（可以是音乐）作为基本的背景噪声，这样可适当掩蔽办公设备的运行噪声和操作仪器的噪声。根据广泛的实践和体验，如果背景噪声不超过50dB（A），在10m的距离范围已可以用正常的噪音交谈、讨论。如果背景噪声不超过55dB（A），略微提高的噪音可以进行交谈。电视电话会议室较普通会议室有较高安静要求。8.2隔声标准
