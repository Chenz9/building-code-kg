  - raw: A.0.3对于面积较大的房间，例如开式办公室、商场等，由于情况复杂，在这里没有给出确定测点数量的具体规定。对于这类场所的测点的选取和布置原则是：选取的测点数量应能代表该区域的室内噪声水平；测点分布应均匀，同时测点应设在人的活动区域内。例如：开式办公室，测点可设在办公区域；商场，测点可设在购物区域及收银处；超市，测点可设在购物通道内及收银台等处。由于本规范中的允许噪声级为关窗状态下的标准值，所以规定测量住宅、学校、旅馆、办公建筑及商业建筑的室内噪声时应关闭房间门窗。由于医院中有些房间必须开窗使用，所以规定根据房间实际使用状态测量关窗或开窗时的室内噪声。
