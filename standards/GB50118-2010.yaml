    content: 条的噪声级要求。室内噪声不仅和住宅建筑所处的声功能区、周围噪声源的情况有关，而且和建筑物本身的隔声设计密切相关。目前对交通干线两侧的住宅所采取的简单有效的防噪措施是安装隔声窗，保证在关窗状态下室内安静。因此，根据我国住宅外部环境噪声的实际状况，结合我国的技术经济条件，本规范规定了住宅在关窗状态下的室内允许噪声级。本次修订将住宅允许噪声级由原规范（GBJ118－88）的三级标准调整为两级，相应指标数值也作了调整。本规范与原规范住宅允许噪声级对照表见表3。表3本规范与原规范住宅允许噪声级对照表允许噪声级（A声级，dB)房间名称本规范原规范（GBJ118-88）高要求低限要求一级二级≤40(昼间）≤45(昼间）≤40(昼间）≤45(昼间）≤50（昼间）≤30(夜间)≤37（夜间）≤30（夜间）≤35（夜间）《40（夜间）≤45（昼间）≤50(昼间)起居室\40《45≤35（夜间）≤40（夜间）4.2隔声标准
