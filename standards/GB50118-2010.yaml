  clause_no: 7.3.1
  text: 旅馆建筑的总平面设计应符合下列规定：旅馆建筑的总平面布置，应根据噪声状况进行分区。产生噪声或振动的设施应远离客房及其他要求安静的房间，并应采取隔声、隔振措施。3旅馆建筑中的餐厅不应与客房等对噪声敏感的房间在同一区域内。4可能产生强噪声和振动的附属娱乐设施不应与客房和其他有安静要求的房间设置在同一主体结构内，并应远离客房等需要安静的房间。5可能产生较大噪声并可能在夜间营业的附属娱乐设施应远离客房和其他有安静要求的房间，并应进行有效的隔声、隔振处理。6可能在夜间产生干扰噪声的附属娱乐房间，不应与客房和其他有安静要求的房间设置在同一走廊内。7客房沿交通干道或停车场布置时，应采取防噪措施，如采用密闭窗或双层窗；也可利用阳台或外廊进行隔声减噪处理。8电梯井道不应毗邻客房和其他有安静要求的房间。
