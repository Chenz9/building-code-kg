  text: A.0.3测量条件应符合下列规定：1对于住宅、学校、医院、旅馆、办公建筑及商业建筑中面积小于30m²的房间，在被测房间内选取1个测点，测点应位于房间中央。2对于面积大于等于30m²、小于100m²的房间，选取3个测点，测点均匀分布在房间长方向的中心线上，房间平面为正方形时，测点应均匀分布在与窗面积最大的墙面平行的中心线上。3对于面积大于等于100m²的房间，可根据具体情况，优化选取能代表该区域室内噪声水平的测点及测点数量。4测点分布应均匀且具代表性，测点应分布在人的活动区域内。对于开式办公室，测点应布置在办公区域；对于商场，测点应布置在购物区域。5测点的布置应符合下列规定：1）测点距地面的高度应为1.2m～1.6m。2）测点距房间内各反射面的距离应大于等于1.0m。3）各测点之间的距离应大于等于1.5m。4）测点距房间内噪声源的距离应天于等于1.5m。注：对于较拥挤的房间，上述测点条件无法满足的情况下，测点距房间内各反射面（不包括窗等重要的传声单元）的距离应大于等于0.7m，各测点之间的距离应大于等于0.7m。6对于间歇性非稳态噪声的测量，测点数可为一个，测点应设在房间中央。7测量室内噪声时，室内应无人（测试人员除外）。测量住宅、学校、旅馆、办公建筑及商业建筑的室内噪声时，应在关闭门窗的情况下进行。测量医院的室内噪声时，应关闭房间门并根据房间实际使用状态决定房间窗的开或关。
