- id: GB 50118-2010#7.1.1
  standard_code: GB 50118-2010
  chapter: 7 旅馆建筑
  section: ''
  clause_no: 7.1.1
  text: 旅馆建筑中的客房与住宅建筑中的卧室有共同之处，即确保睡眠所必需的安静条件，因此，客房内的允许噪声级可参照住宅允许噪声级而定；但旅馆建筑中噪声干扰的噪声源与住宅中有所不同，住宅卧室噪声干扰主要来自户外，而旅馆除受环境噪声影响外，对设有空调的旅馆客房还会有空调噪声的影响。因此有空调设施的客房，应对空调系统的噪声加以控制。客房允许噪声标准的编制依据如下：1.根据睡眠所必需的安静程度：理想值为30dB（A），最大不超过50dB（A）。2.根据我国已制定的环境噪声标准（见《声环境质量标准》GB3096-2008），确定有可能实现的标准。3.根据国内旅馆调查结果，室内噪声级与旅馆反映如下：30dB(A)～35dB(A)满意；35dB(A)～40dB(A)比较满意；40dB(A)～45dB(A)没有较多的抱怨；大于45dB(A)有各种不同的反映，多数不太满意。4.参考了国外12个国家的住宅、旅馆客房的允许噪声级标准，这些标准值在30～40dB(A)范围内。本次修编与原规范相比，进行了如下改动：1..原规范中在正文中只给出了昼间的标准，而在附录中统-给出了夜间标准与昼间标准的修正量，但考虑到
