  text: A.0.4测量方法及数据处理应符合下列规定：1对于稳态噪声，在各测点处测量5s～10s的等效L连续A计权声级，每个测点测量3次，并将各测点的所有测量值进行能量平均，计算结果修约到个数位。2对于声级随时间变化较复杂的持续的非稳态噪声，在各测点处测量10min的等效L连续A计权，声级。将各测点的所有测量值进行能量平均，计算结果修约到个数位。3对于间歇性非稳态噪声，测量噪声源密集发声时20min的等效连续A计权」声级。室内噪声级的测量应在水泵正常运行时，按稳态噪声的测量方法进行。5当建筑物内部的电梯是影响室内噪声级的主要噪声源时，室内噪声级的测量应在电梯正常运行时进行，测量电梯完成一个运行过程的等效［连续A计权］声级，被测运行过程是电梯噪声在室内产生较不利影响的运行过程。电梯运行过程及测量方法应符合下列规定：1）运行过程：电梯轿厢内载1～2人，打开并立即关闭电梯门——立即启动—运行停止—打开并立即关闭电梯门。2）测量方法：测量从运行过程开始时起到运行过程结束时止这个时段的等效「连续A计权］声级。每个测点测量5个向上运行过程和5个向下的运行过程，并将各测点的所有测量值进行能量平均，计算结果修约到个数位。6在进行室内噪声级测量时，若主观判断噪声中含有调声（可听纯音或窄带噪声），应在测量等效［连续A计权」声级的同时测量等效［连续A计权」声级所对应的线性1/3倍频带频谱，按下列规定进行判定，并按表A.0.4的规定对测量值进行修正。稳态噪声、持续的非稳态噪声是否含有调声的判定依据是：1）在测量过程中有调声被清楚地听到。2）在测量结果的1/3倍频带频谱中，某一个1/3倍频带声压级应超过相邻的两个频带声压级某个恒定的声压级差，声压级差随频率而变，声压级差至少为：一低频段（25Hz～125Hz）15dB;中频段（160Hz～400Hz）8dB；高频段（500Hz～10000Hz）5dB。表A.0.41因噪声特性的不同对噪声测量值的修正值噪声特性修正值(dB)持续稳定的噪声稳态噪声包含有调声的稳态噪声+5续表A.0.4噪声特性修正值（dB)声级随时间起伏，变化较复杂的噪声（如道路交通噪声）非稳态噪声包含有调声的持续的非稳态噪声+5飞机噪声+3本规范用词说明1为了便于执行本规范条文时区别对待，对要求严格程度不同的用词，说明如下：1）表示很严格，非这样做不可的用词：正面词采用“必须”，反面词采用“严禁”；2）表示严格，在正常情况下均应这样做的用词：正面词采用“应”，反面词采用“不应”或“不得”；3）表示允许稍有选择，在条件许可时首先应这样做的用词：正面词采用“宜”，反面词采用“不宜”；4）表示有选择，在-一定条件下可以这样做的用词，采用“可”。2本规范中指明应按其他有关标准执行时，写法为“应符合…的规定”或“应按执行”。引用标准名录《建筑隔声评价标准》GB/T50121《声环境质量标准》GB3096《倍频程和分数倍频程滤波器》GB/T3241《电声学声级计第1部分：规范》GB/T3785.1《积分平均声级计》GB/T17181《声校准器》GB/T15173中华人民共和国国家标准民用建筑隔声设计规范GB 50118-2010
