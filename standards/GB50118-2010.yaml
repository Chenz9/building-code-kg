    content: 表6.1.1中的“低限标准”是以原规范的“二级”、“三级”标准为基础制定，是一个基本要求，是所有的医院都应达到的标准。表6.1.1中的“高要求标准”是以原规范的“一级”标准为基础制定，同时参考世界卫生组织（WHO）、法国国家标准的有关限值制定，供对声环境要求较高的医院房间选用。世界卫生组织（WHO）环境噪声指南（GuidelinesforCommunityNoise1999）有关医院室内噪声的指导限值如下：病房：LAeq≤30dB;LAmax≤40dB。治疗或观察室：LAeg≤35dB。法国国家标准（Relatif a la Limitation du Bruit Dans lesEtablissementsdeSante2003）关于医疗机构室内设备噪声的相关规定如下：病房：病房内LnAT≤30dB(A);检查和诊断室、医疗办公室、等候室内LnAT ≤35dB(A);治疗室LnAT ≤40dB(A);手术室、产房、工作室LnAT≤40dB(A）。在已颁布实施的《医院洁净手术部建筑技术规范》GB50333-2002中规定：洁净手术室的室内允许噪声级不大于50dB（A）。故本条表6.1.1洁净手术室的室内允许噪声级与该规范保持致，规定为50dB（A）。听力测听方法主要有纯音气导和骨导听阈测听法与用纯音及窄带测试信号的声场测听两种测试方法。后者对室内环境噪声级、室内声场有更严格的规定，需进行专业声学设计，故本规范不涉及。具体要求详见《声学一一测听方法，第2部分：用纯音及窄带测试信号的声场测听》GB/T16296-1996。6.2隔声标准
