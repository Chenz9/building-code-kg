  - raw: 人群进人商业空间时，走动及相互间的交流形成人为噪声。人听到的正常谈话声为70dB（A）左右，当噪声超过70dB（A)时，人们为了互相听清，不得不提高音量或缩短谈话距离。噪声超过75dB(A)以后，正常交谈受到干扰，1m以内的交谈必须提高音量，1m以上时需要喊叫。一般认为，50dB（A）～60dB（A)左右是购物中心、餐厅、展览馆等商业空间较理想的、有利于交流的噪声水平。室内吸声可显著降低人群交流噪声。人群不断进入室内时噜杂声的变化分为四个阶段：（1）安静阶段。开始时人流稀疏，环境尚安静，人群会有意识地小声说话避免被其他人听到，维护安静局面。安静阶段噪声一般在50dB（A）以下。（2）舒适阶段。人群继续进入，噜杂声增多，掩蔽了房间中远处的谈话，人们的交谈自然轻松了，环境也变得舒适，舒适阶段的噪声一般在50dB(A)～60dB(A)左右。（3）膨胀阶段。人数继续增多，当噪声升高到65dB(A)左右时，由于远处传来的无法了解内容混响声的干扰，所有人被迫提高嗓音，出现“鸡尾酒会”效应，室内迅速吵闹起来，环境变得喧闹而不舒服。这一阶段随人数增加的变化非常迅速，因此称为膨胀阶段。（4）持续阶段。噜杂声不再随人数涌入而无限增加，而是持续在个稳定水平。人们在高噪声条件下为了交谈，必须拉近相互的距离，或者放弃某些谈话，待到噪声降低时下意识地见缝插针地插话。持续阶段-一般会在75dB（A）～80dB(A)左右，如果噪声再大，讲话者只能放弃正常的讲话，甚至因此提出抗议。根据对北京的一些会展中心、餐厅、商场的声环境实测和调查，人群噪声极限基本在80dB（A)左右，这可能是正常交谈的噪声干扰心理承受平均上限。人们自行调节讲话音量、时机和距·离，使群体声出现稳定值。在吵闹的环境中，人们依靠自发的调节和群体承受力控制着室内噪声的上限。最理想的吸声处理是使人为噪声控制在舒适阶段，并防止出现膨胀阶段。吸声可以减少室内声反射，降低混响时间，进而降低噜杂的环境声。声源是存在心理因素的人，因此吸声必须达到够量，使人群噪声控制在50dB(A)～60dB(A)左右。商业空间中重要的吸声表面是顶棚，不但面积大，而且是声音长距离反射的必经之地。也可以在墙体等其他位置安装吸声材料，但与顶棚相比，吸声面积偏小，且可能受门窗等条件限制，吸声效果差一些。顶棚吸声材料可选用玻纤吸声板、三聚氰胺泡沫（防火）、穿孔铝板、穿孔石膏板、矿棉吸声板和木丝吸声板等。有大量柜台摆货的购物中心，货物吸声可能已经足够，因此也可不做吸声顶棚。体积小且人流稀疏的空间，如小商场、小餐厅等小房间，由于体积小，人及室内陈设等吸声效果显著，亦可不做吸声顶棚。9.3隔声标准
