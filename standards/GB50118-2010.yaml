- id: GB 50118-2010#3.0.3
  standard_code: GB 50118-2010
  chapter: 3 总平面防噪设计
  section: ''
  clause_no: 3.0.3
  text: 产生噪声的建筑服务设备等噪声源的设置位置、防噪设计，应按下列规定：1锅炉房、水泵房、变压器室、制冷机房宜单独设置在噪声敏感建筑之外。住宅、学校、医院、旅馆、办公等建筑所在区域内有噪声源的建筑附属设施，其设置位置应避免对噪声敏感建筑物产生噪声干扰，必要时应作防噪处理。区内不得设置未经有效处理的强噪声源。2确需在噪声敏感建筑物内设置锅炉房、水泵房、变压器室、制冷机房时，若条件许可，宜将噪声源设置在地下，但不宜，毗邻主体建筑或设在主体建筑下。并且应采取有效的隔振、隔声措施。3冷却塔、热泵机组宜设置在对噪声敏感建筑物噪声干扰较小的位置。当冷却塔、热泵机组的噪声在周围环境超过现行国家标准《声环境质量标准》GB3096的规定时，应对冷却塔、热泵机组采取有效的降低或隔离噪声措施。冷却塔、热泵机组设置在楼顶或裙房顶上时，还应采取有效的隔振措施。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 不得
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 锅炉、水泵、变压器、制冷机等强噪声源设在建筑内易产生固体声，且噪声敏感建筑对安静程度的要求较高，因而固体声的治理难度大、代价高。将锅炉房、水泵房、变压器室、制冷机房单独设置在噪声敏感建筑之外，可从根本上解决相关建筑设备的噪声干扰问题。对于小区内部的噪声控制，在各类民用建筑设计时，应注意有噪声源的建筑附属设施（如锅炉房、水泵房等），不仅需要考虑防止对所属建筑的噪声干扰，还需考虑防止对邻近建筑的噪声干扰，而后者常被忽视而引起纠纷。采取相应的治理措施后，将能有效地降低小区内的噪声水平。实践证明噪声源设置在地下时，对噪声控制有较好的效果。但必须注意设置在建筑物内时，除隔离空气声外，对结构声的隔离十分重要，不然将对整个建筑物有严重干扰，过去已有教训。因此，当噪声源设在噪声敏感建筑内时必须采取有效的隔声、隔振措施。冷却塔、热泵机组产生的噪声较大，一般可达65dB（A）～85dB（A）。由于建筑的体量越来越大，需要的冷却塔、热泵机组也越来越多，常常可以见到一座建筑配数个乃至十几个冷却塔、热泵机组的情形，在这种情况下冷却塔、热泵机组产生的噪声就更大了。对于无噪声屏蔽措施的情形，当冷却塔、热泵机组设在地面或裙房顶上时，一方面冷却塔、热泵机组产生的噪声直接辐射到其所属楼房的窗卢上，对其所属楼房内的房间产生噪声干扰；另一方面冷却塔、热泵机组产生的噪声被地面、裙房顶面、冷却塔所属楼房的外墙面反射到空间中，使得噪声加大；当冷却塔、热泵机组设在楼顶时，冷却塔、热泵机组所属楼房的房间均在冷却塔、热泵机组的下方，楼顶面将冷却塔、热泵机组产生的噪声反射到天空中去，自然也屏蔽了冷却塔、热泵机组产生噪声直接对冷却塔、热泵机组所属楼房内房间的噪声干扰；由于在室外人们大多在地面活动，人们与设置在楼顶的冷却塔、热泵机组的距离要比设置在地面或裙房顶上的距离远得多，从而加大了声衰减。此外，楼顶的通风散热条件也优于地面或裙房顶。因此，对于高楼林立的城市，应尽可能将冷却塔、热泵机组设置在楼顶。
    note: 合并重复提取片段
