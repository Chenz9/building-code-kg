  text: 在城市规划中，从功能区的划分、交通道路网的分布、绿化与隔离带的设置、有利地形和建筑物屏蔽的利用，均应符合防噪设计要求。住宅、学校、医院等建筑，应远离机场、铁路线、编组站、车站、港口、码头等存在显著噪声影响的设施。
