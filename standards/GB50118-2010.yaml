  - raw: 产生噪声或振动的设施是指空调机组、新风机组、直燃机组、柴油发电机组、排风机、水泵、冷却塔等。旅馆建筑中可能产生强噪声和振动的附属娱乐设施主要有迪·斯科舞厅、慢摇吧、保龄球馆，大量测量结果表明，迪斯科舞厅和慢摇吧在正常营业时声压级一般都在110dB左右，尤其是大功率超低音箱产生的强大的低频气流可以直接引发结构的振动，引起固体传声。保龄球馆的摆瓶机房的噪声在90dB以上，另外保龄球落地时会产生很强的脉冲撞击声。如果将这些设施与客房设置在同一主体结构内，其隔声隔振处理非常困难，很难保证客房及其他对噪声敏感的房间达到标准的要求，所以增加本条中第4款规定。卡拉OK歌厅、健身房等设施经常要营业到凌晨，经过调查，客人反映卡拉OK产生的声音对睡眠的影响很大，所以增加本条中第5款规定。麻将室和棋牌室通常是通宵营业，而在麻将室和棋牌室活动的客人会产生较大的喧哗声，并经常在走廊内活动，会严重影响同走廊内普通客房内客人的睡眠，所以增加本条中第6款规定。
