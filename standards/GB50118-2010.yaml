- id: GB 50118-2010#3.0.2
  standard_code: GB 50118-2010
  chapter: 3 总平面防噪设计
  section: ''
  clause_no: 3.0.2
  text: 新建居住小区临交通干线、铁路线时，宜将对噪声不敏感的建筑物作为建筑声屏障，排列在小区外围。交通干线、铁路线旁边，噪声敏感建筑物的声环境达不到现行国家标准《声环境质量标准》GB3096的规定时，可在噪声源与噪声敏感建筑物之间采取设置声屏障等隔声措施。交通干线不应贯穿小区。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 不应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 许多国家的调查研究表明，城市噪声的70%来自交通噪声（公路交通、铁路、飞机、航运）。在我国，公路交通噪声是城市环境噪声的主要来源，许多城市调查后绘出的城市噪声分布图证明最高噪声带都分布在交通线上，至少有20%的城市居民受交通噪声的干扰，睡觉不得安眠。极大部分城市都未处理好沿街居住建筑的防噪问题，而事后在已有建筑上进行补救就相当困难。当前我国城镇建设方兴未艾，不断涌现出新的居住小区，因此应接受这一教训，在新小区设计开始便能贯彻防噪布局的原则，倘小区能从外部防止交通噪声的入侵，内部处理好各种噪声源，则兴建完成后的小区将是一个比较安静的小区。对噪声不敏感的建筑物系指防噪要求不高的建筑物，以及外围护结构有较好的防噪能力的建筑物。对噪声不敏感的建筑占着相当大的比例，例如商业建筑、饮食服务行业建筑、文化娱乐建筑、体育场地等，而且这些建筑本身要求方便群众，交通便利，均匀地分布在城市中，以减少城市交通的压力；旅馆虽为居住建筑，但亦有交通便利的要求，并有较大的停车场地，因此只要有高隔声的门窗与空调设备，也属于对噪声不敏感建筑；甚至医院的门诊部也要求临近交通线，以方便病人就医；某些低噪声的精密仪器工厂、进出货品繁忙的仓库、展览等公共建筑也可作为屏蔽建筑。声屏障是降低地面运输噪声的有效措施之。般3m～6m高的声屏障，其声影区内降噪效果在5dB12dB之间。当噪声源发出的声波遇到声屏障时，它将沿三条路径传播：部分越过声屏障顶端绕射到达受声点；部分穿透声屏障到达受声点；一部分在声屏障壁面上产生反射。声屏障的插人损失（在保持噪声源、地形、地貌、地面和气象条件不变情况下安装声屏障前后在某特定位置上的声压级之差）主要取决于声源发出的声波沿这三条路径传播的声能分配。
    note: 合并重复提取片段
