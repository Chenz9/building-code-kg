  chapter: 4 住宅建筑
  section: 4.3隔声减噪设计
  clause_no: 4.3.2
  text: 当住宅建筑位于交通干线两侧或其他高噪声环境区域时，应根据室外环境噪声状况及本章第4.1节规定的室内允许噪声级，确定住宅防噪措施和设计具有相应隔声性能的建筑围护结构（包括墙体、窗、门等构件）。
