  converted_tables:
  - raw: 本条是本次修编新增加的内容。住宅建筑的承重外墙通常用混凝土、承重砌块这类面密度较大的建筑材料建造，这类重质墙体的隔声能力一般都大于45dB，远比外窗的隔声好。有窗的重质外墙，隔声主要由窗决定。考虑到框架结构体系和钢结构体系的住宅建筑中，非承重外墙往往采用轻质墙体材料建造，有些轻质墙体虽然保温隔热性能很好，但隔声不一定好。因此本次规范修编增加了对住宅外墙隔声基本要求的规定。外墙构件的空气声隔声性能评价量，采用实验室测量的计权隔声量与交通噪声频谱修正量之和（符号：Rw十Ctr），测量方法见 GB/T 19889.3。对户（套）门的隔声性能作规定，旨在控制楼梯走廊内噪声对居室的干扰。对户内分室墙的隔声性能作规定，旨在控制户内各房间之间生活噪声的相互干扰。户（套）门和分室墙的空气声隔声性能评价量，采用实验室测量的计权隔声量与粉红噪声频谱修正量之和（符号：Rw十C），测量方法见GB/T8485和GB/T19889.3。
