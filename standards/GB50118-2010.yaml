  - raw: 在夏季，建筑需要开窗的时间较多，而且般是将建筑迎风一侧的窗打开，以便让风吹进室内。将对安静要求较高的民用建筑设置于本区域主要噪声源夏季主导风向的上风侧，就可以使建筑在夏季开窗时，打开的窗子处于背向主要噪声源的状态，建筑自身就成为了噪声屏蔽措施，起到减少传人室内的噪声的作用。4住宅建筑4.1充许噪声级
