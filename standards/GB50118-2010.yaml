  section: ''
  clause_no: 6.1.1
  text: 本规范将对各主要用房室内允许噪声级的规定从原来的三个级别简化为两个级别，即一般都应达到的最低要求标准和较舒适的高要求标准。本次修订改变了通过对叠间时段室内允许噪声级进行修正而得出夜间时段室内允许噪声级的方法，改为对具有睡眠功能的房间直接规定昼间时段和夜间时段的室内允许噪声级。本条新增重症监护室、人口大厅、候诊厅、洁净手术室和化验室、分析实验室等用房的室内允许噪声级规定
