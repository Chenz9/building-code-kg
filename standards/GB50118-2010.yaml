- id: GB 50118-2010#1.0.3
  standard_code: GB 50118-2010
  chapter: 1 总则
  section: ''
  clause_no: 1.0.3
  text: 本规范中的室内允许噪声级应采用A声级作为评价量。本规范中的室内允许噪声级应为关窗状态下昼间和夜问时段的标准值。医院建筑中应开窗使用的房间，开窗时室内允许噪声级的标准值宜与关窗状态下室内允许噪声级的标准值相间。昼间和夜间时段所对应的时间分别为：叠间，6：00～22：00时；夜间，22：00～6：00时；或者按照当地人民政府的规定。室内噪声级的测量应按本规范附录A的规定执行。
