- id: GB 50118-2010#1.0.1
  standard_code: GB 50118-2010
  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: 为减少民用建筑受噪声影响，保证民用建筑室内有良好的声环境，制定本规范。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: null
    modal_words: []
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 建设各类民用建筑，应考虑噪声控制。噪声控制应从建筑项目的方案设计阶段开始，并贯穿所有设计阶段。并宜有噪声控制专业技术人员参加设计工作。随着我国经济、科技的发展，各种交通工具和用于民用建筑的机械、设备都越来越多，使得噪声源不断增多；同时也出现了许多新型轻质建筑材料，使得民用建筑的隔声降噪能力减弱。由于以上这些原因，使得民用建筑内的噪声干扰问题日益突出，要求降低噪声、改善声环境的呼声日益强烈。因此，在建设民用建筑时，必须将隔声减噪作为一个重要因素加以考虑。解决民用建筑内的噪声干扰问题应该从规划设计、单体建筑内的平面布置、选择建筑围护结构以及减小、控制建筑设备的振动、噪声等方面采取措施，并且应该在各个设计阶段就加以考虑。许多隔振、减噪措施需要占用一定的空间或要求建筑结构能够承受较大的荷载，若设计时不预留，则这些措施将难以实施。如果建筑建成后再来解决噪声问题，不仅所需的经费可能比在设计阶段就考虑解决噪声问题要多很多，而且还受到许多已不可改变（因建筑已建成）的建筑条件限制，而难以达到最佳降噪效果。较大、较重要的民用建筑中的噪声控制方面的工作量大、要求高，由专业噪声控制工程师来负责这项工作，将使民用建筑的噪声控制效果更加有保证。
    note: 合并重复提取片段
