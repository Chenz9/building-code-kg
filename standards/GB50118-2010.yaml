- id: GB 50118-2010#4.2.1
  standard_code: GB 50118-2010
  chapter: 4 住宅建筑
  section: ''
  clause_no: 4.2.1
  text: 分户墙、分户楼板及分隔住宅和非居住用途空间楼板的空气声隔声性能，应符合表4.2.1的规定。
  is_abolished: true
  abolished_date: '2025-05-01'
  superseded_by: GB 55038-2025
  abolition_note: 被《住宅项目规范》GB 55038-2025 废止强制性条文效力（住建部公告，2025-05-01 起实施）
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 必须
    is_mandatory_clause: true
    mandatory_basis: 住建部公告2010年第744号强制性条文
  parameters: []
  tables:
  - table_id: 表4.2.1
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 分户墙、分户楼板及分隔住宅和非居住用途空间楼板的空气声隔声性能，应符合表4.2.1的规定。表4.2.1分户构件空气声隔声标准构件名称空气声隔声单值评价量十频谱修正（dB)计权隔声量十粉红噪声频谱修正量>45分户墙、分户楼板Rw+C分隔住宅和非居住计权隔声量十交通噪声频谱修正量>51用途空间的楼板Rw+Ctr
  converted_tables:
  - raw: ～4.2.4对分户墙、分户楼板及相邻两户房间之间的空气声隔声性能作规定，旨在控制邻居之间诸如说话声、电视音响声等噪声的干扰，以及保障居家生活中声音的私密性。对分隔住宅和非居住用途空间的楼板的空气声隔声性能作规定，旨在防止住宅楼内其他用途空间内（如上层电梯机房、下层车库、商住楼的底商等）的噪声扰民。分户构件空气声隔声性能的评价量采用计权隔声量与粉红噪声频谱修正量之和（符号：Rw十C），其指标值是构件的实验室测量值，供设计师隔声设计选材使用。相邻两户房间之间的空气声隔声性能评价量采用计权标准化声压级差与粉红噪声频谱修正量之和（符号：DnT.w十C），其指标值是现场测量值，是住宅建成后实际要达到的值。分隔住宅和非居住用途空间的楼板的空气声隔声性能评价量，采用计权隔声量与交通噪声频谱修正量之和（符号：Rw十Ctr）及计权标准化声压级差与交通噪声频谱修正量之和（符号：DnT,w十Ctr）。前者是实验室测量值，供设计选材用；后者是现场测量值，是住宅建成后实际要达到的值。测量方法见GB/T19889.3、GB/T19889.4和GB/T19889.14，评价方法见GB/T50121。对分户墙、分户楼板的空气声隔声要求也适用于分隔住宅楼内居住空间与套外楼梯、门厅、走廊等的墙体或楼板。
    note: 合并重复提取片段
  - raw: 条和4.2.2条是所有住宅都应该达到的空气声隔声的最低要求标准；4.2.3条和4.2.4条是供性能要求较高的住宅设计使用的高要求标准。本规范卧室、起居室（厅）分户墙、分户楼板空气声隔声性能的最低要求与原规范（GBJ118－88）相比，大约提高了5dB~7dB。修编的主要依据：1根据建筑构件空气声隔声性能与主观感觉的关系，考虑满足基本的安静和私密要求。国内城市住宅现场隔声测量调查表明，当住宅分户构件的空气声隔声性能指标值（DnT,w十C）在40dB～45dB时，隔壁的大声讲话时常能被听到，大约有1/3的居住者对隔声不满意；当分户构件的指标值（DnT,w十C）在45dB～50dB时，隔壁的大声讲话--般听不到，播放音乐音量大时能听到，大约有1/5的居住者对隔声不满意；当分户构件的指标值（DnT.w十C）大于50dB后，隔壁的音乐声（钢琴声除外）、叫喊声一般听不到，有90%以上的居住者对隔声效果认可。2参考国内外住宅隔声相关标准。例如，英国标准：DnTw+C43dB～45dB、澳大利亚标准：DmT,w十Ctr45dB、美国标准：STC45（现场测量，相当于DnT.w45dB）。我国已有城市在住宅设计地方标准中将住宅分户构件的空气声隔声最低要求指标规定为45dB。分隔住宅和非居住用途空间的楼板的空气声隔声要求与现行国家标准《住宅建筑规范》GB50368－2005第
    note: 合并重复提取片段
