  converted_tables:
  - raw: 当住宅建筑不可避免地处于高噪声的外部环境时，住宅设计除要考虑防噪声的平剖面布置，使卧室、书房、起居室（厅）布置在背噪声源的一侧外，还可采取设置隔声屏障、设封闭外廊、封闭阳台、安装高隔声性能的门窗和提高围护结构的隔声能力等防噪措施，以减轻室外噪声的影响，隔声设计的同时还要考虑室内的通风换气。通常情况下，窗比墙的隔声要差，含窗外墙的综合隔声效果主要由窗决定。提高围护结构综合隔声效果的措施：一是提高窗的隔声性能，二是控制窗墙比。交通干线两侧的住宅，不适宜做成大面积外窗的形式。例如：夜间室外噪声在65dB（A）时，为使卧室在关窗情况下室内噪声达到4.1.2条的标准要求，当窗的隔声指标值（Rw十Cr）为30dB时，窗墙比要控制在40%以内。
