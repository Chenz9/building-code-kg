    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 根据房间的使用功能，房间的室内允许噪声级分为叠间标准、夜间标准及单一全天标准。因此，为检验室内噪声级是否符合标准规定，对于室内允许噪声级分为昼间标准、夜间标准的房间，例如住宅中的卧室、旅馆的客房、医院的病房等，室内噪声级的测量分别在昼间、夜间两个时段内进行；对于室内允许噪声级为单一全天标准的房间，例如教室、办公室、诊室等，室内噪声级的测量在房间的使用时段内进行。2测量应选择在对室内噪声较不利的时间进行，测量应在影响较严重的噪声源发声时进行。例如：临街建筑，一般情况下，道路交通噪声是影响室内噪声级的主要噪声，测量应在昼间、夜间，交通繁忙，车流量较大的时段内进行；当影响较严重的噪声是飞机飞行噪声时，测量应在飞机经过架次较多的时段内进行。当建筑物内部的服务设备是影响较严重的噪声源时，例如电梯、水泵等，测量应在这些设备运行时进行。3科学研究表明，不同特性的噪声弓引起公众的烦恼度不同。例如，具有相同等效连续声压级，飞机噪声比道路交通噪声更能弓引起人们的烦恼；带有明显可听单频声或窄带噪声的噪声引起公众的烦恼度高于道路交通噪声，因此，现参照GB/T3222.12006（ISO1996－1：2003）中规定的评价声级的确定方法，根据噪声的特性对测量值进行修正。对飞机噪声的修正量仅用于飞机噪声是影响室内噪声级的主要噪声的情况下。
