  clause_no: 4.1.1
  text: 建筑的平面布置应便于建筑发生火灾时的人员疏散和避难 有利于减小火灾危害。控制火势和烟气蔓延 同一建筑内的不同使用功能区域之间应进行防火分隔 4.1,2。工业与民用建筑，地铁车站。平时使用的人民防空工程应综合其高度。埋深。使用功能和火灾危险性等因素，根据有利于消防救援。控制火灾及降低火灾危害的原则划分防火分区，防火分区的划分应符合下列规定 1。建筑内横向应采用防火墙等划分防火分区 且防火分隔应保证火灾不会蔓延至相邻防火分区，2,建筑内竖向按自然楼层划分防火分区时 除允许设置敞开楼梯间的建筑外，防火分区的建筑面积应按上。下楼层中在火灾时未封闭的开口所连通区域的建筑面积之和计算,3。高层建筑主体与裙房之间未采用防火墙和甲级防火门分隔时。裙房的防火分区应按高层建筑主体的相应要求划分,4。除建筑内游泳池。消防水池等的水面 冰面或雪面面积，射击场的靶道面积，污水沉降池面积。开敞式的外走廊或阳台面积等可不计入防火分区的建筑面积外 其他建筑面积均应计入所在防火分区的建筑面积。4 1,3。下列场所应采用防火门,防火窗 耐火极限不低于2 00h的防火隔墙和耐火极限不低于1,00h的楼板与其他区域分隔。1。住宅建筑中的汽车库和锅炉房 2。除居住建筑中的套内自用厨房可不分隔外。建筑内的厨房,3。
