  section: ''
  clause_no: 7.1.15
  text: 避难层应符合下列规定：避难区的净面积应满足该避难层与上一避难层之间所有楼层的全部使用人数避难的要求。除可布置设备用房外，避难层不应用于其他用途。设置在避难层内的可燃液体管道、可燃或助燃气体管道应集中布置，设备管道区应采用耐火极限不低于3.00h的防火隔墙与避难区及其他公共区分隔。管道井和设备间应采用耐火极限不低于2.00h的防火隔墙与避难区及其他公共区分隔。设备管道区、管道井和设备间与避难区或疏散走道连通时，应设置防火隔间，防火隔间的门应为甲级防火门。避难层应设置消防电梯出口、消火栓、消防软管卷盘、灭火器、消防专线电话和应急广播在避难层进入楼梯间的人口处和疏散楼梯通向避难层的出口处，均应在明显位置设置标示避难层和楼层位置的灯光指示标识。避难区应采取防止火灾烟气进入或积聚的措施，并应设置可开启外窗。避难区应至少有一边水平投影位于同一侧的消防车登高操作场地范围内。避难间应符合下列规定：
