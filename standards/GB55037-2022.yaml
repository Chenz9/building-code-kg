  text: 燃油或燃气锅炉、可燃油油浸变压器、充有可燃油的高压电容器和多油开关、柴油发电机房等独立建造的设备用房与民用建筑贴邻时，应采用防火墙分隔，且不应贴邻建筑中人员密集的场所。上述设备用房附设在建筑内时,应符合下列规定：当位于人员密集的场所的上一层、下一层或贴邻时，应采取防止设备用房的爆炸作用危及上层、下一层或相邻场所的措施；设备用房的疏散门应直通室外或安全出口；设备用房应采用耐火极限不低于2.00h的防火隔墙和耐火极限不低于1.50h 的不燃性楼板与其他部位分隔,防火隔墙上的门、窗应为甲级防火门、窗。
