  standard_code: GB 55037-2022
  chapter: 4 建筑平面布置与防火分隔
  section: ''
  clause_no: 4.3.2
  text: 住宅与非住宅功能合建的建筑应符合下列规定：除汽车库的疏散出口外，住宅部分与非住宅部分之间应采用耐火极限不低于2.00h，且无开口的防火隔墙和耐火极限不低于2.00h的不燃性楼板完全分隔。住宅部分与非住宅部分的安全出口和疏散楼梯应分别独立设置。为住宅服务的地上车库应设置独立的安全出口或疏散楼梯，地下车库的疏散楼梯间应按本规范第7.1.10条的规定分隔。住宅与商业设施合建的建筑按照住宅建筑的防火要求建造的，应符合下列规定：1)商业设施中每个独立单元之间应采用耐火极限不低于2.00h且无开口的防火隔墙分隔;2)每个独立单元的层数不应大于2层，且2层的总建筑面积不应大于300m²；3)每个独立单元中建筑面积大于200m²的任一楼层均应设置至少2个疏散出口。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 住宅与非住宅功能合建建筑的防火分隔与疏散
    conditions:
    - 住宅与商业设施合建且按住宅建筑防火要求建造时（每个独立单元层数不大于2层、总建筑面积不大于300m²、面积大于200m²楼层设至少2个疏散出口等）
