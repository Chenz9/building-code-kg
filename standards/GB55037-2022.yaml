  section: ''
  clause_no: 7.1.8
  text: 疏散楼梯间内不应设置烧水间、可燃材料储藏室、垃圾道及其他影响人员疏散的凸出物或障碍物。疏散楼梯间内不应设置或穿过甲、乙、丙类液体管道在住宅建筑的疏散楼梯间内设置可燃气体管道和可燃气体计量表时，应采用开楼梯间，并应采取防止燃气泄漏的防护措施；其他建筑的疏散楼梯间及其前室内不应设置可燃或助燃气体管道疏散楼梯间及其前室与其他部位的防火分隔不应使用卷帘。筑疏散楼梯间前室或合用前室内的管道井检查门外，疏散楼梯间及其前室或合用前室内的墙上不应设置其他门、窗等开口。自然通风条件不符合防烟要求的封闭楼梯间，应采取机械加压防烟措施或采用防烟楼梯间。防烟楼梯间前室的使用面积，公共建筑、高层厂房、高层仓库、平时使用的人民防空工程及其他地下工程，不应小于 6.0m²;与消防电梯前室合用的前室的使用住宅建筑,不应小于 4.5m²面积，公共建筑、高层厂房、高层仓库、平时使用的人民防空工程及其他地下工程，不应小于10.0m²；住宅建筑，,不应小于 6.0m疏散楼梯间及其前室上的开口与建筑外墙上的其他相邻开口最近边缘之间的水平距离不应小于1.0m。兰当距离不符合要求时,应采取防止火势通过相邻开口蔓延的措施。通向避难层的疏散楼梯应使人员在避难层处必须经过避
