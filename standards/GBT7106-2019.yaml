  text: 变形检测9.2.4.1定级检测时的变形检测应按下列步骤进行：a)先进行正压检测，后进行负压检测。b)检测压力逐级升、降。每级升降压力差值不超过250Pa，每级检测压力差稳定作用时间约为10s。检测压力绝对值最大不宜超过2000Pa。记录每级压力差作用下的面法线度值（角位移值），利用压力差和变形之间的相对线性关系（线性回归方法见附录C中的C.4）求出变形检测时最大面法线度（角位移）对应的压力差值，作为变形检测压力差值，标以土P1。不同类型试件变形检测时对应的最大面法线挠度（角位移值）应符合产品标准的要求。注：产品标准无要求时，玻璃面板的允许挠度取短边1/60；面板为中空玻璃时，杆件允许挠度为1/150，面板为单层玻璃或夹层玻璃时，杆件允许挠度为1/100。d)记录检测中试件出现损坏或功能障碍的状况和部位。9.2.4.2工程检测时的变形检测应按下列步骤进行：a)先进行正压检测，后进行负压检测。b)检测压力逐级升、降。每级升、降压力差不超过风荷载标准值的10%，每级压力作用时间不少于10S。压力差的升、降直到任一受力构件的相对面法线挠度值达到变形检测规定的最大面法线挠度（角位移），或压力达到风荷载标准值的40%L对于单扇单锁点平开窗（门），风荷载标准值的50%为止。求出变形检测时最大面法线挠度（角位移）对应的压力差值，作为变形检测压力差值，标以土P1。当P1小于风荷载标准值的40%［对于单扇单锁点平开窗（门），风荷载标准值的50%时，应判为不满足工程设计要求，检测终止；当P1大于或等于风荷载标准值的40%［对于单扇单锁点平开窗（门），风荷载标准值的50%时，P1取风荷载标准值的40%对于单扇单锁点平开窗（门），风荷载标准值的50%。d）记录检测中试件出现损坏或功能障碍的状况和部位。9.2.4.3求取杆件或面板的面法线挠度按式（8）进行：(a一ao)+(c一co)B=(bbo)-.(8)式中：ao、boco名各测点在预备加压后的稳定初始读数值，单位为毫米（mm）；某级检测压力差作用过程中的稳定读数值，单位为毫米（mm）；面法线挠度，单位为毫米（mm）。9.2.4.4单扇单锁点平开窗（门)的角位移值为E测点和F测点位移值之差，按式（9)计算：=(e-eo)-(f-fo)...(9)式中：eo、f。测点E和F在预备加压后的稳定初始读数值，单位为毫米(mm)；e、f一某级检测压力差作用过程中的稳定读数值，单位为毫米（mm）。
