  chapter: 9 抗风压性能检测
  section: 9.3检测结果的评定
  clause_no: 9.3.3
  text: 安全检测的评定9.3.3.1定级检测的评定9.3.3.1.1产品设计风荷载标准值P3检测时，试件未出现功能障碍和损坏，且主要构件相对面法线挠度（角位移值）未超过允许挠度，注明土P3值；当检测中试件出现损坏或功能障碍时，以相应压力差值的前一级压力差作为Pmax，按士Pmax/1.4中绝对值较小者进行定级。9.3.3.1.2产品设计风荷载设计值Pmax检测时，试件未出现损坏或功能障碍时，注明正、负压力差值，按9.3.3.1.3以三试件定级值的最小值为该组试件的定级值，依据GB/T31433进行定级。9.3.3.2工程检测的评定9.3.3.2.1试件在风荷载标准值P检测时未出现损坏或功能障碍、主要构件相对面法线挠度（角位移值）未超过充许挠度，且在风荷载设计值Pmax检测时未出现损坏或功能障碍，则该试件判为满足工程设计要求，否则判为不满足工程设计要求。9.3.3.2.2三橙试件应全部满足工程设计要求。
