- id: GB/T 7106-2019#9.2.6
  standard_code: GB/T 7106-2019
  chapter: 9 抗风压性能检测
  section: 9.2检测方法
  clause_no: 9.2.6
  text: 定级检测时的安全检测9.2.6.1产品设计风荷载标准值P3检测9.2.6.1.1P：取2.5P1，对于单扇单锁点平开窗（门）,P：取2.0P1。没有要求的，P：值不宜大于5000Pa。9.2.6.1.2检测压力从零升至P：后降至零，再降至一P：后升至零。加载速度为300Pa/s～500Pa/s，压力稳定作用时间均不应少于3S，泄压时间不应少于1S。正、负加压后各将试件可开启部分启闭5次，最后关紧。记录面法线位移量（角位移值）、发生损坏或功能障碍时的压力差值及部位。如有要求，可记录试件残余变形量，残余变形量记录时间应在P：检测结束后5min～60min内进行。9.2.6.1.3如试件未出现损坏或功能障碍，但主要构件相对面法线挠度（角位移值）超过允许挠度，则应降低检测压力，直至主要构件相对面法线挠度（角位移值）在允许挠度范围内，以此压力差作为土P3值。9.2.6.2产品设计风荷载设计值Pmx检测检测压力从零升至Pmax值后降至零，再降至一Pmax值后升至零。加载速度为300Pa/s～500Pa/s，压力稳定作用时间均不应少于3S，泄压时间不应少于1S。正、负加压后各将试件可开启部分启闭5次，最后关紧。记录发生损坏或功能障碍的压力差值及部位。如有要求，可记录试件残余变形量，残余变形量记录时间应在Pmax检测结束后5min～60min内进行。
