- id: GB 50365-2019#3.1.1
  standard_code: GB 50365-2019
  chapter: 3 管理
  section: 3.1 技术资料
  clause_no: 3.1.1
  text: 空调通风系统的设计、施工、调试、检测，以及评定等技术资料应齐全并妥善保存，并应对照系统实际情况进行核对。必备文件档案应包括下列文件：空调通风系统设备明细表及采购资料；主要材料和设备的出合格证明及进场检（试）验报告；仪器仪表的出厂合格证明、使用说明书和最近一次的校正记录；图纸会审记录、设计变更通知书和竣工图；更新改造和维修改造技术交底资料及改造部分竣工图；隐蔽工程检查验收记录；设备风管和水管系统安装及检验记录；管道冲洗和试验记录；设备单机试运转记录；空调通风系统无负荷联合试运转与调试记录；空调通风系统在有负荷条件下的综合能效测试报告；与实际相符的空调通风系统电子版竣工图。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
