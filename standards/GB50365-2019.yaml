- id: GB 50365-2019#3.1.2
  standard_code: GB 50365-2019
  chapter: 3 管理
  section: 3.1 技术资料
  clause_no: 3.1.2
  text: 应建立运行管理档案，各系统运行管理记录应真实齐全，填写信息应详细准确，填写人应签名，运行管理记录应包括下列内容:空调通风系统运行管理方案及运行管理记录；各系统设备性能参数及易损易耗配件型号参数名册；各主要设备运行参数记录；日常事故分析及其处理记录；日常巡回检查记录；全年运行值班记录及交接班记录；各主要设备维护保养及日常维修记录；设备和系统部件的大修和更换零配件及易损件记录年度运行总结和分析资料等。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
