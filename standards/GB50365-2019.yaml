  text: 空调通风系统中的风管和空气处理设备应定期检查、清洗和检验，应去除积尘、污物、铁锈和菌斑等，并应符合下列规定：√X风管检查周期每2年不应少于1次，空气处理设备检查周期每年不应少于1次。1）通风系统不满足卫生要求或存在其他污染；2）系统性能下降；3）对室内空气质量有特殊要求。1）当采用目测法检验时，内表面不应有明显碎片和非黏合物质；2）当采用称质量法检验时，应通过专用器材进行擦拭取样和测量，残留尘粒量应少于1.0g/m²；3）当采用阻力测试法检验时，应通过压差计测试空气过滤器、表面式冷却器、加热器等被清洗部件的前后静压差，阻力损失应在常规范围内。
