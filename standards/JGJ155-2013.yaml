- id: JGJ 155-2013#6.9.1
  standard_code: JGJ 155-2013
  chapter: 6 种植屋面工程施工
  section: 6.9设施
  clause_no: 6.9.1
  text: 铺装施工应符合下列规定：基层应坚实、平整，结合层应粘结牢固，无空鼓现象；2木铺装所用的面材及垫木等应选用防腐、防蛀材料；固定用螺钉、螺栓等配件应做防锈处理；安装应紧固、无松动，螺钉顶部不得高出铺装表面；3透水砖的规格、尺寸应符合设计要求，边角整齐，铺设后应采用细砂扫缝；4嵌草砖铺设应以砂土、砂壤土为结合层，其厚度不应低于30mm；湿铺砂浆应饱满严实；干铺应采用细砂扫缝；5卵石面层应无明显坑洼、隆起和积水等现象；石子与基层应结合牢固，石子宜采用立铺方式，镶嵌深度应大于粒径的1/2；带状卵石铺装长度大于6m时，应设伸缩缝；铺装踏步高度不应大于160mm，宽度不应小于300mm。
