  section: 6.7植被层
  clause_no: 6.7.3
  text: 草本植物种植应符合下列规定：根据植株高低、分藥多少、冠丛大小确定栽植的株行距；种植深度应为原苗种植深度，并保持根系完整，不得损伤茎叶和根系；高矮不同品种混植，应按先高后矮的顺序种植。6.7. 4草坪块、草坪卷铺设应符合下列规定：周边应平直整齐，高度一致，并与种植土紧密衔接，不留空隙;铺设后应及时浇水，并应磅压、拍打、踏实，并保持土壤湿润。6.7. 5植被层灌溉应符合下列规定：根据植物种类确定灌溉方式、频率和用水量；2乔灌木种植穴周围应做灌水围堰，直径应大于种植穴直径200mm，高度宜为150mm～200mm;3新植植物宜在当日浇透第一遍水，三日内浇透第二遍水，以后依气候情况适时灌溉。树木的防风固定宜符合下列规定：6.7. 6根据设计要求可采用地上固定法或地下固定法；树木绑扎处宜加软质保护衬垫，不得损伤树干。6.7. 7应根据设计和当地气候条件，对植物采取防冻、防晒、降温和保湿等措施。
