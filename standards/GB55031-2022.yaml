  chapter: 6 建筑部件与构造
  section: 6.2内墙、外墙
  clause_no: 6.2.8
  text: 建筑幕墙应综合考虑建筑类别、使用功能、高度、所在地域的地理气候、环境等因素，合理选择幕墙形式和面板材料，并应符合下列规定：X应具有承受自重、风、地震温度作用的承载能力和变形能力，且应便于制作安装、维护保养及局部更换面板等构件；2应满足建筑需求的水密、气密、保温隔热、隔声、采光、耐撞击、防火、防雷等性能要求；3幕墙与主体结构的连接应牢固可靠，与主体结构的连接锚固件不应直接设置在填充砌体中；4幕墙外开窗的开启扇应采取防脱落措施；5玻璃幕墙的玻璃面板应采用安全玻璃，斜幕墙的玻璃面板应采用夹层玻璃；6超高层建筑的幕墙工程应设置幕墙维护和更换所需的装置；7外倾斜、水平倒挂的石材或脆性材质面板应采取防坠落措施。
  is_abolished: false
  abolished_date: null
  superseded_by: null
