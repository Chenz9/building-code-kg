  text: 自动扶梯、自动人行道设置应符合下列规定：1 出入口畅通区的宽度从扶手带端部算起不应小于2.50m；2 位于中庭中的自动扶梯或自动人行道临空部位应采取防止人员坠落的措施；两梯（道）相邻平行或交叉设置，当扶手带中心线与平行墙面或楼板（梁）开口边缘完成面之间的水平投影距离、两梯（道）之间扶手带中心线的水平距离小于0.50m时，应在产生的锐角口前部1.00m处范围内，设置具有防夹、防剪的保护设施或采取其他防止建筑障碍物伤害人员的措施；4 自动扶梯的梯级、自动人行道的踏板或传送带上空，垂直净高不应小于2.30m。
