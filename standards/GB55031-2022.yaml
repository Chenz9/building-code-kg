  section: 6.1屋面
  clause_no: 6.1.2
  text: 屋面应符合下列规定：屋面应设置坡度，且坡度不应小于2%；屋面设计应进行排水计算，天沟、檐沟断面及雨水立管管径、数量应通过计算合理确定;3装配式屋面应进行抗风揭设计，各构造层均应采取相应的固定措施；4严寒和寒冷地区的屋面应采取防止冰雪融坠的安全措施；5坡度大于45°瓦屋面，以及强风多发或抗震设防烈度为7度及以上地区的瓦屋面，应采取防止瓦材滑落、风揭的措施；6种植屋面应满足种植荷载及耐根穿刺的构造要求；上人屋面应满足人员活动荷载，临空处应设置安全防护设施；8屋面应方便维修、检修，大型公共建筑的屋面应设置检修口或检修通道。
