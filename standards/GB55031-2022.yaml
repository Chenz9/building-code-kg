- id: GB 55031-2022#2.1.5
  standard_code: GB 55031-2022
  chapter: 2 基本规定
  section: 2.1功能要求
  clause_no: 2.1.5
  text: 当民用建筑存在不同功能场所组合的情况时，除应满足上述条款的要求外，尚应符合下列规定：1各功能场所不应降低其他功能场所的基本安全、卫生标准；当产生污染、辐射的功能场所与其他功能场所组合时，应采取必要的安全防护措施；3当不同安全等级的功能场所组合时，应采取确保各功能场所使用安全的相应措施。
  is_abolished: false
  abolished_date: null
