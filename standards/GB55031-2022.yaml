- id: GB 55031-2022#1.0.3
  standard_code: GB 55031-2022
  chapter: 1 总则
  section: ''
  clause_no: 1.0.3
  text: 民用建筑的建设和使用维护应遵循下列基本原则：1 应按照可持续发展的原则，正确处理人、建筑与环境的相互关系，营建与使用功能匹配的合理空间；2 应贯彻节能、节地、节水、节材、保护环境的政策要求；3 应与所处环境协调，体现时代特色、地域文化。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
