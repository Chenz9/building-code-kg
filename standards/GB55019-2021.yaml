- id: GB 55019-2021#1.0.3
  standard_code: GB 55019-2021
  chapter: 1 总则
  section: ''
  clause_no: 1.0.3
  text: 无障碍设施的建设和运行维护应遵循下列基本原则：会生活上的障碍；保证安全性和便利性，兼顾经济、绿色和美观；保证系统性及无障碍设施之间有效衔接；碍通行设施、无障碍服务设施和无障碍信息交流设施的安全、功能和性能无障碍信息交流设施的建设与信息技术发展水平相适应；各级文物保护单位根据需要在不破坏文物的前提下进行无障碍设施建设。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
