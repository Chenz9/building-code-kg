  buf:
  - '本条对种植隔热层施工作出具体规定:'
  - 1 种植隔热层挡墙泄水孔是为了排泄种植土中过多的水分
  - 而设置的，若留设位置不正确或泄水孔被堵塞，种植土中过多的
  - 水分不能排出，不仅会影响使用，而且会对防水层不利;
  - '2'
  - 排水层是指能排出渗入种植土中多余水分的构造层，排
  - 水层的施工必须与排水管、排水沟、水落口等排水系统连接且不
  - 得堵塞，保证排水畅通;
  - '3'
  - 过滤层土工布应沿种植土周边向上敷设至种植土高度，
  - 以防止种植土的流失而造成排水层堵塞;
  - '4'
  - 考虑到种植土和植物的重量较大，如果集中堆放在一起
  - 或不均匀堆放，都会使屋面结构的受力情况发生较大的变化，严
  - 重时甚至会导致屋面结构破坏事故，种植土层的荷载尤其应严格
  - 控制，防止过量超载。
  - '1'
  - 做好施工前的准备工作，以保证施工顺利进行; 2
  - 考虑架空隔热制品支座部位负荷增大，支座底面的卷材、
  - 涂膜均属于柔性防水，若不采取加强措施，容易造成支座下的防
  - 水层破损，导致屋面渗漏;
  - '3'
  - 由于架空隔热层对防水层可起到保护作用，一般屋面防
  - 水层上不做保护层，所以在铺设架空隔热制品或清扫屋面上的落
  - 灰、杂物时，均不得损伤防水层;
  - '4'
  - 考虑到屋面在使用中要上人清扫等情况，架空隔热制品
  - 的敷设应做到平整和稳固，板缝应以勾填密实为好，使板块形成
  - 一个整体。
  - '1'
  - 由于蓄水池的特殊性，孔洞后凿不宜保证质量，故强调
  - 所有孔洞应预留;
  - '2'
  - 为了保证每个蓄水区提凝土的整体防水'性，防水混凝土
  - 应一次浇筑完毕，不得留施工缝，避免因接缝处理不好而导致
  - 裂缝;
  - '3'
  - 蓄水隔热层完工后，应在混凝土终凝时进行养护，养护
  - 后方可蓄水，并不可断水，防止混凝土干泪开裂;
  - '4'
  - 溢水口的标高、数量、尺寸应符合设计要求，以防止暴
  - 雨溢流。
  - 5.4 卷材防水层施工
  - 裂缝，基层的干燥程度应视所用防水材料而定。当采用机械固定
  - 法铺贴卷材时，对基层的干燥度没有要求。
  - 基层干燥程度的简易检验方法，是将1m2 卷材平坦地干铺
  - 在找平层上，静置3h~4h 后掀开检查，找平层覆盖部位与卷材
  - 上未见水印，即可铺设隔汽层或防水层。
  - 出现渗漏现象最多，故应按设计要求和规范规定先行仔细处理，
  - 检查无误后再开始铺贴大面卷材，这是保证防水质量的重要措 施，也是较好素质施工队伍的一般施工顺序。
  - 檐沟、天沟是雨水集中的部位，而卷材的搭接缝又是防水层
  - 的薄弱环节，如果卷材垂直于檐沟、天沟方向铺贴，搭接缝大大
  - 增加，搭接方向难以控制，卷材开缝和受水冲刷的概率增大，故
  - 规定檐沟、天沟铺贴的卷材宜顺流水方向铺贴，尽量减少搭
  - 接缝。
  - 卷材铺贴方向规定宜平行屋脊铺贴，其目的是保证卷材长边
  - 接缝顺流水方向;上、下层卷材不得相互垂直铺贴，主要是避免
  - 接缝重叠，即重叠部位的上层卷材接缝造成间隙，接缝密封难以
  - 保证。
  - 卷材与基层粘贴牢固，规定采取满粘法铺贴，必要时采取金属压
  - 条钉压固定，并用密封材料封严。短边搭接过多，对防止卷材下
  - 滑不利，因此要求尽量减少短边搭接。
  - 基层处理剂应与防水卷材相容，尽量选择防水卷材生产
  - 厂家配套的基层处理剂。在配制基层处理剂时，应根据所用基层
  - 处理剂的品种，按有关规定或说明书的配合比要求，准确计量，
  - 混合后应搅拌3min~5min ，使其充分均匀。在喷涂或涂刷基层
  - 处理剂时应均匀一致，不得漏涂，待基层处理剂干燥后应及时进
  - 行卷材防水层的施工。如基层处理剂涂刷后但尚未干燥前遭受雨
  - 淋，或是干燥后长期不进行防水层施工，则在防水层施工前必须
  - 再涂刷一次基层处理剂。
  - 500mm，是避免短边接缝重叠，接缝质量难以保证，尤其是改
  - 性沥青防水卷材比较厚，四层卷材重叠也不美观。
  - 上、下层卷材长边搭接缝应错开，且不小于幅宽的1/3 ，目
  - 的是避免接缝重叠，消除渗漏隐患。
  - '1'
  - 胶粘剂的涂刷质量对保证卷材防水施工质量关系极大，
  - 涂刷不均匀，有堆积或漏涂现象，不但影响卷材的粘结力，还会 造成材料浪费。空铺法、点粘法、条粘法，应在屋面周边
  - 800mm 宽的部位满粘贴。点粘时每平方米粘结不少于5 个点，
  - 每点面积为100mmX 100mm，条粘时每幅卷材与基层粘结面不
  - 少于2 条，每条宽度不小于150mm 。
  - '2'
  - 由于各种胶粘剂的性能及施工环境要求不同，有的可以
  - 在涂刷后立即粘贴，有的则需待溶剂挥发一部分后粘贴，间隔时
  - 间还和气温、湿度、风力等因素有关，因此，本条提出应控制胶
  - 粘剂涂刷与卷材铺贴的间隔时间，否则会直接影响粘结力，降低
  - 粘结的可靠性。
  - '3'
  - 卷材与基层、卷材与卷材间的粘贴是否牢固，是防水工
  - 程中重要的指标之一。铺贴时应将卷材下面空气排净，加适当压
  - 力才能粘牢，一旦有空气存在，还会由于温度升高、气体膨胀，
  - 致使卷材粘结不良或起鼓。
  - '4'
  - 卷材搭接缝的质量，关键在搭接宽度和粘结力。为保证
  - 搭接尺寸，一般在基层或已铺卷材上按要求弹出基准线。铺贴时
  - 应平整顺直，不扭曲、皱折，搭接缝应涂满胶粘剂，粘贴牢固。
  - '5'
  - 卷材铺贴后，考虑到施工的可靠性，要求搭接缝口用宽
  - lOmm 的密封材料封口，提高卷材接缝的密封防水性能。密封材
  - 料宜选择卷材生产厂家提供的配套密封材料，或者是与卷材同种
  - 材性的密封材料。
  - 型改'性沥青胶铺贴高聚物改'性沥青防水卷材，可起到涂膜与卷材
  - 之间优势互补和复合防水的作用，更有利于提高屋面防水工程质
  - 量，应当提倡和推广应用。为了防止加热温度过高，导致改性沥
  - 青中的高聚物发生裂解而影响质量，故规定采用专用的导热油炉
  - 加热熔化改性沥青，要求加热温度不应高于200 'C ，使用温度不
  - 应低于180.C 。
  - 铺贴卷材时，要求随刮涂热熔型改性沥青胶随滚铺卷材，展
  - 平压实，本条对粘贴卷材的改性沥青胶结料厚度提出了具体的
  - 规定。 5.4.8 本条对热熔法铺贴卷材的施工要点作出规定。施工时加
  - 热幅宽内必须均匀一致，要求火焰加热器喷嘴距卷材面适当，加
  - 热至卷材表面有光亮时方可以粘合，如熔化不够会影响粘结强
  - 度，但加温过高全使改性沥青老化变焦，失去粘结力且易把卷材
  - 烧穿。铺贴卷材时应将空气排出使其粘贴牢固，滚铺卷材时缝边
  - 必须溢出热熔的改性沥青，使搭接缝粘贴严密。
  - 由于有些单位将2mm 厚的卷材采用热熔法施工，严重地影
  - 响了防水层的质量及其耐久性，故在条文中规定厚度小于3mm
  - 的高聚物改性沥青防水卷材，严禁采用热熔法施工。
  - 为确保卷材搭接缝的粘结密封性能，本条规定有铝宿或矿物
  - 粒或片料保护层的部位，应先将其清除干净后再进行热熔的接缝
  - 处理。
  - 用条粘法铺贴卷材时，为确保条粘部分的卷材与基层粘贴牢
  - 固，规定每幅卷材的每条粘贴宽度不应小于150mm 。
  - 为保证铺贴的卷材搭接缝平整顺直，搭接尺寸准确和不发生
  - 扭曲，应在基层或己铺卷材上按要求弹出基准线，严禁控制搭接
  - 缝质量。
  - 粘胶底面隔离纸撕净，否则不能实现完全粘贴。为了提高自粘卷
  - 材与基层粘结性能，基层处理剂干燥后应及时铺贴卷材。为保证
  - 接缝粘结性能，搭接部位提倡采用热风机加热，尤其在温度较低
  - 时施工，这一措施就更为必要。
  - 采用这种铺贴工艺，考虑到防水层的收缩以及外力使缝口翘
  - 边开缝，接缝口要求用密封材料封口，提高卷材接缝的密封防水
  - 性能。
  - 在铺贴立面或大坡面卷材时，立面和大坡面处卷材容易下
  - 滑，可采用加热方法使自粘卷材与基层粘贴牢固，必要时采取金
  - 属压条钉压固定。
  - 为了使搭接缝焊接牢固和密封，必须将搭接缝的结合面清扫干 净，无灰尘、砂粒、污垢，必要时要用溶剂清洗。焊接施焊前，
  - 应将卷材铺放平整顺直，搭接缝应按事先弹好的基准线对齐，不
  - 得扭曲、皱折。为了保证焊接缝质量和便于施焊操作，应先焊长
  - 边搭接缝，后焊短边搭接缝。
  - 目前国内适用机械固定法铺贴的卷材，主要有PVC 、
  - TPO 、
  - EPDM 防水卷材和5mm 厚加强高聚物改性沥青防水卷
  - 材，要求防水卷材强度高、搭接缝可靠和使用寿命长等特性。机
  - 械固定法铺贴卷材，当固定件固定在屋面板上拉拔力不能满足风
  - 揭力的要求时，只能将固定件固定在穰条上。固定件采用螺钉加
  - 垫片时，应加盖200mmX 200mm 卷材封盖。固定件采用螺钉加
  - '"U" 形压条时，应加盖不小于150mm 宽卷材封盖。'
  - 由于卷材品种繁多、性能差异很大，外观可能完全一样
  - 难以辨认，因此要求按不同品种、型号、规格等分别堆放，避免
  - 工程中误用后造成质量事故。
  - 卷材具有一定的吸水性，施工时卷材表面要求干燥，避免雨
  - 淋和受潮，否则施工后可能出现起鼓和粘结不良现象;卷材不能
  - 接近火源，以免变质和引起火灾。
  - 卷材宜直立堆放，由于卷材中空，横向受挤压可能压扁，开
  - 卷后不易展开铺平，影响工程质量。
  - 卷材较容易受某些化学介质及溶剂的溶解和腐蚀，故规定不
  - 允许与这些有害物质直接接触。
  - 子防水卷材需进行的物理性能检验项目。
  - 胶粘剂和胶粘带品种繁多、性能各异，胶粘剂有榕剂
  - 型、水乳型、反应型(单组分、多组分)等类型。一般溶剂型胶
  - 粘剂应用铁桶密封包装，避免溶剂挥发变质或腐蚀包装桶;水乳
  - 型胶粘剂可用塑料桶密封包装，密封包装是为了运输、贮存时胶
  - 粘剂不致外漏，以免污染和侵蚀其他物品。溶剂型胶粘剂受热后
  - 容易挥发而引起火灾，故不能接近火源和热源。
  - 强度保持率是一个重要性能指标，因为诸多高分子胶粘剂及胶粘
  - 带浸水后剥离强度会下降，为保证屋面的整体防水性能，规定其
  - 浸水168h 后剥离强度保持率不应低于70% 。
  - 低于本条规定值，将会影响卷材的粘结效果，尤其是冷粘法或自
  - 帖法铺贴的卷材，严重的可能导致开胶或粘结不牢。此外热熔法
  - 或热粘法还会造成能源的浪费。
  - '5.5'
  - 涂膜防水层施工
  - 涂膜防水层基层应坚实平整、排水坡度应符合设计要求，
  - 否则会导致防水层积水;同时防水层施工前基层应干净、元孔
  - 隙、起砂和裂缝，保证涂膜防水层与基层有较好粘结强度。
  - 本条对基层的干燥程度作了较为灵活的规定。溶剂型、热熔
  - 型和反应固化型防水涂料，涂膜防水层施工时，基层要求干燥，
  - 否则会导致防水层成膜后空鼓、起皮现象;水乳型或水泥基类防
  - 水涂料对基层的干燥度没有严格要求，但从成膜质量和涂膜防水
  - 层与基层粘结强度来考虑，干燥的基层比潮湿基层有利。
  - 厂家配套的基层处理剂;二是采用同种防水涂料稀释而成。
  - 在基层上涂刷基层处理剂的作用，一是堵塞基层毛细孔，使
  - 基层的湿气不易渗到防水层中，引起防水层空鼓、起皮现象;二
  - 是增强涂膜防水层与基层粘结强度。因此，涂膜防水层一般都要
  - 涂刷基层处理剂，而且要求涂刷均匀、覆盖完全。同时要求待基
  - 层处理剂干燥后再涂布防水涂料。
  - 反应而由液态变成固体，各组分的配料计量不准和搅拌不匀，将
  - 会影响混合料的充分化学反应，造成涂料性能指标下降。配成涂
  - 料固化的时间比较短，所以要按照在配料固化时间内的施工量来
  - 确定配料的多少，已固化的涂料不能再用，也不能与未固化的涂 料泪合使用，棍合后将会降低防水涂膜的质量。若涂料蒙古度过大
  - 或固化过快时，可加人适量的稀释剂或缓凝剂进行调节，涂料固
  - 化过慢时，可适当地加人一些促凝剂来调节，但不得影响涂料的
  - 质量。
  - 布三遍或三遍以上为宜，而且须待先涂的涂料干后再涂后一遍涂
  - 料，最终达到本规范规定要求厚度。
  - 涂膜防水层涂布时，要求涂刮厚薄均匀、表面平整，否则会
  - 影响涂膜层的防水效果和使用年限，也会造成材料不必要的
  - 浪费。
  - 涂膜中夹铺胎体增强材料，是为了增加涂膜防水层的抗拉强
  - 度，要求边涂布边铺胎体增强材料，而且要刮平排除内部气泡，
  - 这样才能保证胎体增强材料充分被涂料浸透并粘结更好。涂布涂
  - 料时，胎体增强材料不得有外露现象，外露的胎体增强材料易于
  - 老化而失去增强作用，本条规定最上层的涂层应至少涂刮两遍，
  - 其厚度不应小于lmmo
  - 节点和需铺附加层部位的施工质量至关重要，应先涂布节点
  - 和附加层，检查其质量是否符合设计要求，待检查无误后再进行
  - 大面积涂布，这样可保证屋面整体的防水效果。
  - 屋面转角及立面的涂膜若一次涂戚，极易产生下滑并出现流
  - 淌和堆积现象，造成涂膜厚薄不均，影响防水质量。
  - 涂膜施工的工效，二是保证涂膜的均匀'恒和涂膜质量。水乳型及
  - 洛剂型防水涂料宜选用滚涂或喷涂，工效高，涂层均匀;反应固
  - 化型防水涂料属厚质防水涂料宜选用刮涂或喷涂，不宜采用滚
  - 涂;热熔型防水涂料宜选用刮涂，因为防水涂料冷却后即成膜，
  - 不适用滚涂和喷涂;刷涂施工工艺的工效低，只适用于关键部位
  - 的涂膜防水层施工。
  - 或溶剂挥发后，易使涂料表面结皮，另外榕剂挥发时易引起 火灾。
  - 包装容器上均应有明显标志，标明涂料名称，尤其多组分涂
  - 料，以免把各类涂料搞混，同时要标明生产日期和有效期，使用
  - 户能准确把握涂料是否过期失效;另外还要标明生产厂名，使用
  - 户一旦发现质量问题，可及时与厂家取得联系;特别要注明材料
  - 质量执行的标准号，以便质量检测时核实。
  - 在贮运和保管环境温度低于OOC 肘，水乳型涂料易冻结失
  - 效，溶剂型涂料虽然不会产生冻结，但涂料稠度要增大，施工时
  - 也不易涂开，所以分别提出涂料在贮运和保管时的环境温度。由
  - 于溶剂型涂料具有一定的燃爆性，所以应严防日晒、渗漏，远离
  - 火源、热源，避免碰撞，在库内应设有消防设备。
  - 理性能检验项目。
  - 溶剂型涂料在负温下虽不会冻结，但黠度增大会增加施
  - 工操作难度，涂布前应采取加温措施保证其可涂性，所以榕剂型
  - 涂料的施工环境温度宜在一50C~350C; 水乳型涂料在低温下将
  - 延长固化时间，同时易遭冻结而失去防水作用，温度过高使水蒸
  - 发过快，涂膜易产生收缩而出现裂缝，所以水乳型涂料的施工环
  - 境温度宜为50C~350C 。
  - 5.6 接缝密封防水施工
  - 密封防水部位的基层应符合本条第1 、
  - 2 款的规定。密封防水部
  - 位的基层不密实，会降低密封材料与基层的粘结强度;基层不平
  - 整，会使嵌填密封材料不均匀，接缝位移时密封材料局部易拉
  - 坏，失去密封防水作用。如果基层不干净、不干燥，会降低密封
  - 材料与基层的粘结强度，尤其是洛剂型或反应固化型密封材料，
  - 基层必须干燥。由于我国目前无适当的现场测定基层含水率的设
  - 备和措施，不能给出定量的规定，只能提出定性的要求。按本规
  - 范第4.6.4 条的有关规定，背衬材料应比接缝宽度大20% 的规 定，使用专用压轮嵌入背衬材料后，可以保证接缝密封材料的设
  - 计厚度，同时还保证背衬材料与接缝壁间不留有空隙。基层处理
  - 剂的主要作用，是使被粘结体的表面受到渗透及浸润，改善密封
  - 材料和被粘结体的粘结性，并可以封闭混凝土及水泥砂浆表面，
  - 防止从内部渗出碱性物质及水分，因此密封防水部位的基层宜涂
  - 刷基层处理剂。
  - 践总结出来的。由于各种密封材料均存在着不同程度的干温变
  - 形，当干湿变形和接缝尺寸均较大时，密封材料宜分次嵌填，否
  - 则密封材料表面会出现
  - '"U" 形。且一次嵌填的密封材料量过多'
  - 时，材料不易固化，会影响密封材料与基层的粘结力，同时由于
  - 残留榕剂的挥发引起内部不密实或产生气泡。热灌法施工应严格
  - 按照施工工艺要求进行操作，热熔型改性石油沥青密封材料现场
  - 施工时，熬制温度应控制在180
  - 0C ~ 200
  - 0C ，若熬制温度过低，
  - 不仅大大降低密封材料的帖结性能，还会使材料变稠，不便施
  - 工;若熬制温度过高，则会使密封材料性能变坏。
  - 场可直接使用，多组分密封材料为反应固化型，各个组分配比一
  - 定要准确，宜采用机械搅拌，拌合应均匀，否则不能充分反应，
  - 降低材料质量。拌合好的密封材料必须在规定的时间内施工完，
  - 因此应根据实际情况和有效时间内材料施工用量来确定每次拌合
  - 量。不同的材料、生产厂家都规定了不同的拌合时间和拌合温
  - 度，这是决定多组分密封材料施工质量好坏的关键因素。合成高
  - 分子密封材料的嵌填十分重要，如嵌填不饱满，出现凹陷、漏
  - 嵌、孔洞、气泡，都会降低接缝密封防水质量，因此，在施工中
  - 应特别注意，出现的问题应在密封材料表于前修整;如果表干前
  - 不修整，则表干后不易修整，且容易将固化的密封材料破坏。
