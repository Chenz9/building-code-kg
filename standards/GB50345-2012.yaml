- id: GB 50345-2012#4.6.3
  standard_code: GB 50345-2012
  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.6.3
  text: '密封材料的选择应符合下列规定: 1 应根据当地历年最高气温、最低气温、屋面构造特点和 使用条件等因素，选择耐热度、低温柔性相适应的密封材料; 2 应根据屋面接缝变形的大小以及接缝的宽度，选择位移 能力相适应的密封材料; 3 应根据屋面接缝粘结性要求，选择与基层材料相容的密 封材料; 4 应根据屋面接缝的暴露程度，选择耐高低温、耐紫外线、 耐老化和耐潮湿等性能相适应的密封材料。'
  is_mandatory_clause: false
  is_abolished: false
  superseded_by: null
  abolished_date: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
