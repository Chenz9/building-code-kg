  text: '本条对蓄水隔热层的设计提出以下要求: 1 蓄水隔热层主要在我国南方采用。国外有资料介绍在寒 冷地区使用的为密封式，我国目前均为敞开式的，冬季如果不将 水排除，则易冻冰而导致胀裂损坏，故不宜在北方寒冷地区 使用。 地震地区和振动较大的建筑物上，最好不采用蓄水隔热层。 振动易使建筑物产生裂缝，造成屋面渗漏。 2 为保证蓄水池的整体性、坚固性和防水性，强调采用现 浇防水混凝土，混凝土强度等级不低于C25 ，抗渗等级不低于 P6 ，且蓄水池内用20mm 厚防水砂浆抹面。 3 蓄水隔热层划分蓄水区和设分仓缝，主要是防止蓄水面 积过大引起屋面开裂及损坏防水层。根据使用及有关资料介绍， 蓄水深度宜为150mm~ 200mm ，低于此深度隔热效果不理想， 高于此深度加重荷载，隔热效果提高并不大，旦当水较深时夏季 白天水温升高，晚间水温降低放热，反而导致室温增加。蓄水隔 热层设置人行通道，对于使用过程中的管理是非常重要的。 4.5 卷材及涂膜防水层设计 应的防水做法。当防水等级为I 级时，设防要求为两道防水设 防，可采用卷材防水层和卷材防水层、卷材防水层和涂膜防水 层、复合防水层的防水做法;当防水等级为E 级时，设防要求为 一道防水设防，可采用卷材防水层、涂膜防水层、复合防水层的 防水做法。 1 由于各种卷材的耐热度和柔性指标相差甚大，耐热度低 的卷材在气温高的南方和坡度大的屋面上使用，就会发生流淌， 而柔性差的卷材在北方低温地区使用就会变硬变脆。同时也要考 虑使用条件，如防水层设置在保温层下面时，卷材对耐热度和柔 性的要求就不那么高，而在高温车间则要选择耐热度高的卷材。 2 若地基变形较大、大跨度和装配式结构或温差大的地区 和有振动影响的车间，都会对屋面产生较大的变形而拉裂，因此 必须选择延伸率大的卷材。 3 长期受阳光紫外线和热作用时，卷材会加速老化;长期 处于水泡或干湿交替及潮湿背阴时，卷材会加快霉烂，卷材选择 时一定要注意这方面的性能。 4 种植隔热屋面的防水层应采用耐根穿刺防水卷材，其性 能指标应符合现行行业标准《种植屋面用耐根穿剌防水卷材》 JCjT 1075 的技术要求。 温差等气候变化幅度大，各类建筑的使用条件、结构形式和变形 差异很大，涂膜防水层用于暴露还是埋置的形式也不同。高温地 区应选择耐热性高的防水涂料，以防流淌;严寒地区应选择低温 柔性好的防水涂料，以免冷脆;对结构变形较大的建筑屋面，应 选择延伸大的防水涂料，以适应变形;对暴露式的涂膜防水层， 应选用耐紫外线的防水涂料，以提高使用年限。设计人员应综合 考虑上述各种因素，选择相适应的防水涂料，保证防水工程的 质量。 层。使用过程中除要求两种材料材性相容外，同时要求两种材料 不得相互腐蚀，施工过程中不得相互影响。因此本条规定挥发固 化型防水涂料不得作为卷材粘结材料使用，否则涂膜防水层成膜 质量受到影响;水乳型或合成高分子类防水涂料上面不得采用热 熔型防水卷材，否则卷材防水层施工时破坏涂膜防水层;水乳型 或水泥基类防水涂料应待涂膜干燥后铺贴卷材，否则涂膜防水层 成膜质量差，严重的将成不了柔性防水膜。当两种防水材料不相 容或相互腐蚀时，应设置隔离层，具体选择应依据上层防水材料 对基层的要求来确定。 防水层的使用年限，主要取决于防水材料物理性 能、防水层的厚度、环境因素和使用条件四个方面，而防水层厚 度是影响防水层使用年限的主要因素之一。本条对卷材防水层及 涂膜防水层厚度的规定是以合理工程造价为前提，同时又结合国 内外的工程应用的情况和现有防水材料的技术水平综合得出的量 化指标。卷材防水层及涂膜防水层的厚度若按本条规定的厚度选 择，满足相应防水等级是切实可靠的。 、 E 级复合防水层最小厚度作出明确规定。 需要说明的是:聚乙烯丙纶卷材物理性能除符合《高分子防水材 料第1 部分:片材>> GB 18173. 1 中FS2 的技术要求外，其生 产原料聚乙烯应是原生料，不得使用再生的聚乙烯;粘贴聚乙烯 丙纶卷材的聚合物水泥防水胶结材料主要性能指标，应符合本规 范附录第B. 1. 8 条的要求。 所谓一道防水设防，是指具有单独防水能力的一道防水 层。虽然本规范相关条文已明确了屋面防水等级和设防要求，以 及每道防水层的厚度，但防水工程设计与施工人员对屋面的一道 防水设防存在不同的理解。为此，本条将一些常见的违规行为作 为禁忌条目，比较具体也容易接受，便于掌握屋面防水设计的各 项要领。 对于喷涂硬泡聚氨醋保温层，是指国家标准《硬泡聚氨醋保 温防水工程技术规范>> GB 50404 一2007 中的I 型保温层。 附加层一般是设置在屋面易渗漏、防水层易破坏的部位， 例如平面与立面结合部位、水落口、伸出屋面管道根部、预埋件 等关键部位，防水层基层后期产生裂缝或可预见变形的部位。前 者设置涂膜附加层，后者设置卷材空铺附加层。附加层设置得 当，能起到事半功倍的作用。 对于屋面防水层基层可预见变形的部位，如分格缝、构件与 构件、构件与配件接缝部位，宜设置卷材空铺附加层，以保证基 层变形时防水层有足够的变形区间，避免防水层被拉裂或疲劳破 坏。附加层的卷材与防水层卷材相同，附加层空铺宽度应根据基 层接缝部位变形量和卷材抗变形能力而定。空铺附加层的做法可 在附加层的两边条粘、单边粘贴、铺贴隔离纸、涂刷隔离剂等。 为了保证附加层的质量和节约工程造价，本条对附加层厚度 作出了明确的规定。 接宽度是接缝质量的保证。本条对高聚物改性沥青防水卷材和合 成高分子防水卷材的搭接宽度，统一列出表格，条理明确。表 4.5.10 卷材搭接宽度，系根据我国现行多数做法及国外资料的 数据作出规定的。同时本条规定屋面防水卷材应采用搭接缝，不 提倡采用对接法。对接法是指卷材对接铺贴，上加贴一定宽度卷 材覆盖条来实现接缝密封防水处理方法，其缺点一是增加接缝 量，由一条接缝变为两条接缝;二是覆盖条其中一边接缝形成逆 水接茬。 设置胎体增强材料目的，一是增加涂膜防水层的抗拉强 度，二是保证胎体增强材料长短边一定的搭接宽度，三是当防水 层拉伸变形时避免在胎体增强材料接缝处出现断裂现象。胎体增 强材料的主要性能指标，应符合本规范附录第B. 1. 9 条的要求。 4.6 接缝密封防水设计 根据本规范的有关规定，在屋面工程中的一些接缝部位 要嵌填密封材料或用密封材料封严。查阅我国现行的技术标准和 图集，密封材料在防水工程中有大量设计，几乎到了遇缝就设计 密封材料的程度。而在现实工程中，有关密封材料的使用和质量 却令人担忧。原因一是密封材料在防水工程中的重要作用不被重 视;二是密封材料的使用部位不够合理;三是对密封材料基层处 理不符合要求。为此，本条针对密封材料的使用方式，参考日本 建筑工程标准规范]A岱8 防水工程，将屋面接缝分为位移接缝 和非位移接缝。对位移接缝应采用两面粘结的构造，非位移接缝 可采用三面粘结的构造。 这里，对表4.6.1 屋面接缝密封防水技术要求，需说明 两点: 1 接缝部位是按本规范有关内容加以整理的，并对原规范 作了一些调整，如:装配式钢筋混凝土板的板缝、找平层的分格 缝、管道根部与找平层的交接处，水落口杯周围与找平层交接 处，一律不再嵌填密封材料。 2 密封材料是按改性石油沥青密封材料、合成高分子密封 材料、硅酣耐候密封胶、硅酣结构密封胶来选用的。改性石油沥 青密封材料产品价格相对便宜、施工方便，但承受接缝位移只有 5%左右，使用寿命较短。国外在建筑用密封胶中，油性嵌缝膏 已趋于消失F 建筑密封胶产品按位移能力分为四级，承受接缝位 移有7.5% 、 12.5% 、 20% 、 25% 。弹性密封胶的耐候性好，使 用寿命较长，在建筑中大量使用;硅酣结构密封胶是指与建筑接 缝基材粘结且能承受结构强度的弹性密封胶，主要用于建筑幕 墙。硅酣结构密封胶设计，应根据不同的受力情况进行承载力极 限状态验算，确定硅酣结构密封胶的粘结宽度和粘结厚度。 由于密封材料品种繁多、性能各异，设计人员应根据不同用 途正确选择密封材料，并按产品标准提出材料的品种、规格和性 能等要求。 进行接缝部位的密封防水设计时，应根据建筑接缝位移的特征， 选择相应的密封材料和辅助材料，同时还要考虑外部条件和施工 可行性。原规范虽对屋面防水等级和设防要求作出了明确的规 定，但对接缝密封防水设计没有具体规定。完整的屋面防水工程 应包括主体防水层和接缝密封防水，并相辅相成;同时，接缝密 封防水应与主体防水层的使用年限相适应。需要指出的是，工程 实践中所用密封材料与主体防水层相当多是不匹配的，有些密封 材料使用寿命只有2 年~3 年，从而大大降低了整体防水效果。 为此，本条规定接缝密封防水设计应保证密封部位不渗漏，并应 做到接缝密封防水与主体防水层相匹配。 温差变化及振动、冲击、错动等条件下起到防水作用，这就要求 密封材料必须经受得起长期的压缩拉伸、振动疲劳作用，还必须 具备一定的弹塑性、粘结性、耐候性和位移能力。本规范所指接 缝密封材料是不定型膏状体，因此还要求密封材料必须具备可施 工性。 我国地域广阔，气候变化幅度大，历年最高、最低气温差别 .很大，并且屋面构造特点和使用条件不同，接缝部位的密封材料 存在着埋置和外露、水平和竖向之分，接缝部位应根据上述各种 因素，选择耐热度、柔性相适应的密封材料，否则会引起密封材 料高温流淌或低温龟裂。 接缝位移的特征分为两类，一类是外力引起接缝位移，可以 是短期的、恒定不变的;另一类是温度引起接缝周期性拉伸一压 缩变化的位移，使密封材料产生疲劳破坏。因此应根据屋面接缝 部位的大小和位移的特征，选择位移能力相适应的密封材料。一 般情况下，除结构粘结外宜采用低模量密封材料。 屋面位移接缝的接缝宽度，应按屋面接缝位移量计算确 定。接缝的相对位移量不应大于可供选择密封材料的位移能力， 否则将导致密封防水处理的失败。密封材料的嵌填深度取接缝宽
    度的50%~70% ，是从国外大量资料和国内工程实践中总结出 来的，是一个经验值。 背衬材料填塞在接缝底部，主要控制嵌填密封材料的深度， 以及预防密封材料与缝的底部粘结，三面粘会造成应力集中，破 坏密封防水。因此背衬材料应选择与密封材料不粘或粘结力弱的 材料，并应能适应基层的延伸和压缩，具有施工时不变形、复原 率高和耐久性好等性能。 4.7 保护层和隔离层设计 据调研情况，本条列出了目前常用的保护层材料，这些材料简单 易得，施工方便，经济可靠。 对于不上人屋面和上人屋面的要求，所用保护层的材料有所 不同，本条列出了保护层材料的适用范围和技术要求。铝宿、矿 物粒料，通常是在改性沥青防水卷材生产过程中，直接覆盖在卷 柑表面作为保护层。覆盖铝衙时要求平整，无皱折，厚度应大于 0 ，05mm; 矿物粒料粒度应均匀一致，并紧密粘附于卷材表面。'
