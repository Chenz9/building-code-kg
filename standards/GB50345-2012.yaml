- id: GB 50345-2012#5.3.8
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.3.8
  text: '现烧泡沫棍凝土保温层施工应符合下列规定: 1 基层应清理干净，不得有油污、浮尘和积水; 2 泡沫氓凝土应按设计要求的干密度和抗压强度进行配合 比设计，拌制时应计量准确，并应搅拌均匀; 3 泡沫混凝土应按设计的厚度设定浇筑面标高线，找坡时 宜采取挡板辅助措施; 4 泡沫混凝土的挠筑出料口离基层的高度不宜超过1m ，泵 送时应采取低压泵送; 5 泡沫混凝土应分层浇筑，一次浇筑厚度不宜超过 200mm ，终凝后应进行保湿养护，养护时间不得少于7d 。'
