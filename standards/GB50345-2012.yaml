  clause_no: 5.4.8
  text: '热熔法铺贴卷材应符合下列规定: 1 火焰加热器的喷嘴距卷材面的距离应适中，幅宽内加热应 均匀，应以卷材表面熔融至光亮黑色为度，不得过分加热卷材;厚 度小于3mm 的高聚物改性沥青防水卷材，严禁采用热熔法施工; 2 卷材表面沥青热熔后应立即滚铺卷材，滚铺时应排除卷 材下面的空气; 3 搭接缝部位宜以溢出热熔的改性沥青胶结料为度，溢出 的改性沥青胶结料宽度宜为8mm ，并宜均匀顺直;当接缝处的 卷材上有矿物粒或片料时，应用火焰烘烤及清除干净后再进行热 熔和接缝处理; 4 铺贴卷材时应平整顺直，搭接尺寸应准确，不得扭曲。'
