  text: 密封材料嵌填应密实、连续、饱满，与基层粘结牢固， 才能确保密封防水的效果。密封材料嵌填时，不管是用挤出枪还 是用腻子刀施工，表面都不会光滑平直，可能还会出现凹陷、漏 嵌、孔洞、气泡等现象，对于出现的问题应在密封材料表干前及 时修整。 必须对接缝部位的密封材料采取保护措施，如施工现场清扫或保 温隔热层施工时，对已嵌缝的密封材料宜采用卷材或木板条保 护，防止污染及碰损。嵌填的密封材料，固化前不得踩踏，因为 密封材料嵌缝时构造尺寸和形状都有一定的要求，而未固化的密 封材料则不具有一定的弹性，踩踏后密封材料发生塑性变形，导 致密封材料构造尺寸不符合设计要求。 化和降低产品质量。大部分密封材料是易燃品，因此贮运和保管 时应避免日晒、雨淋、远离火源和热源。合成高分子密封材料贮 运和保管时，应保证包装密封完好，如包装不严密，挥发固化型 密封材料中的溶剂和水分挥发会产生固化，反应固化型密封材料 如与空气接触会产生凝胶。保管时应将其分类，不应与其他材料 或不同生产日期的同类材料堆放在一起，尤其是多组分密封材料 更应该避免棍乱堆放。 材料需进行的物理性能检验项目。 施工时气温低于OOC ，密封材料变稠，工人难以施工， 同时大大减弱了密封材料与基层的粘结力。在5 0C 以下施工，乳 胶型密封材料易破乳，产生凝胶现象，反应型密封材料难以固 化，无法保证密封防水质量。故规定改性沥青密封材料和榕剂型 高分子密封材料的施工环境温度宜为OOC~350C ;乳胶型及反应 型密封材料施工环境温度宜为50C~350C 。 5.7 保护层和隔离层施工 层或保温层的检验，可防止防水层被保护层覆盖后，存在未解决 的问题;同时做好清理工作和施工维护工作，保证防水层和保温 层的表面平整、干净，避免施工作业中人为对防水层和保温层造 成损坏。 工而改变屋面的排水坡度，造成积水现象。 体间缝隙与分格缝，块体间缝用水泥砂浆句缝，每10m 留设的 分格缝应用密封材料嵌缝。 可避免保护层表面出现起砂、起皮现象。由于收缩和温差的影 响，水泥砂浆及细石混凝土保护层预先留设分格缝，使裂缝集中 于分格缝中，可减少大面积开裂的现象。 当采用浅色涂料做保护层时，涂刷时涂刷的遍数越 多，涂层的密度就越高，涂层的厚度越均匀;堆积会造成不 必要的浪费，还会影响成膜时间和成膜质量，流淌会使涂膜 厚度达不到要求，涂料与防水层粘结是否牢固，其厚度能否 达到要求，直接影响到屋面防水层的耐久性;因此，涂料保 护层必须与防水层粘结牢固和全面覆盖，厚薄均匀，才能起 到对防水层的保护作用。 本条分别对水泥、块体材料和浅色涂料的贮运、保管提 出要求。 本条规定了块体材料、水泥砂浆、细石混凝土等的施工 环境温度，若在负温下施工，应采取必要的防冻措施。 隔离层必须使保温层与防水层完全隔离，对隔离层破损或漏铺部 位应及时修复。 对隔离层铺设提出具体质量要求。 5.7. 日本条对隔离层材料的贮运、保管提出要求。 意材料的低温开卷性，对于沥青基卷材，应选择低温柔性好的卷 材。铺抹低强度砂浆施工环境温度不宜低于5 0C 。 5.8 瓦屋面施工
