- id: GB 50345-2012#4.5.2
  standard_code: GB 50345-2012
  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.5.2
  text: '防水卷材的选择应符合下列规定: 1 防水卷材可按合成高分子防水卷材和高聚物改性沥青防 水卷材选用，其外观质量和品种、规格应符合国家现行有关材料 标准的规定; 2 应根据当地历年最高气温、最低气温、屋面坡度和使用 条件等因素，选择耐热度、低温柔性相适应的卷材; 3 应根据地基变形程度、结构形式、当地年温差、日温差 和振动等因素，选择拉伸性能相适应的卷材; 4 应根据屋面卷材的暴露程度，选择耐紫外线、耐老化、 耐霉烂相适应的卷材; 5 种植隔热屋面的防水层应选择耐根穿刺防水卷材。'
