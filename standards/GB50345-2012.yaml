- id: GB 50345-2012#5.3.14
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.3.14
  text: 蓄水隔热层施工应符合下列规定，1,蓄水池的所有孔洞应预留 不得后凿。所设置的溢水管 排水管和给水管等，应在混凝土施工前安装完毕。2,每个蓄水区的防水混凝土应一次浇筑完毕，不得留置施工缝,3.蓄水池的防水混凝土施工时 环境气温宜为5 35.并应避免在冬期和高温期施工,4，蓄水池的防水混凝土完工后,应及时进行养护。养护时间不得少于14d，蓄水后不得断水、5.蓄水池的溢水口标高 数量，尺寸应符合设计要求.过水孔应设在分仓墙底部,排水管应与水落管连通。
