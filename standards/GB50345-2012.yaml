  - 天沟外排水的方式，将屋面雨水由天沟两端排出室外。如果天沟
  - 的长度较长，为满足沟底纵向坡度及沟底水落差的要求，一般沟 底分水线距水落口的距离超过20m 时，可采用除两端外排水口
  - 外，在天沟中间增设水落口和内排水管。排水口的设置同时也确
  - 定了找坡分区的划分，当屋面找坡较长时，可以增设排水口，以
  - 减小找坡长度。
  - 筑给水排水设计规范ìì GB 50015 的有关规定。首先应根据屋面
  - 形式及使用功能要求，确定屋面的排水方式及排水坡度，明确是
  - 采用有组织排水还是无组织排水。如采用有组织排水设计时，要
  - 根据所在地区的气候条件、雨水流量、暴雨强度、降雨历时及排
  - 水分区，确定屋面排水走向。通过计算确定屋面檐沟、天沟所需
  - 要的宽度和深度。根据屋面汇水面积和当地降雨历时，按照水落
  - 管的不同管径核定每根水管的屋面汇水面积以及所需水落管的数
  - 量，并根据檐沟、天沟的位置及屋面形状布置水落口及水落管。
  - 屋面形式、屋面面积、屋面高低层的设置等情况，将屋面划分成
  - 若干个排水区域，根据排水区域确定屋面排水线路，排水线路的
  - 设置应在确保屋面排水通畅的前提下，做到长度合理。
  - 当采用重力式排水时，每个水落口的汇水面积宜为
  - 150m2 ~200m2 ，在具体设计时还要结合地区的暴雨强度及当地
  - 的有关规定、常规做法来进行调整。屋面每个汇水面积内，雨水
  - 排水立管不宜少于2 根，是避免一根排水立管发生故障，屋面排
  - 水系统不会瘫痪。
  - 上后，会对低跨屋面造成冲刷，天长日久就会使低跨屋面的防水
  - 层破坏，所以在低跨屋面上受高跨屋面排下的雨水直接冲刷的部
  - 位，应采取加铺卷材或在水落管下加设水簸宾等措施，对低跨屋
  - 面进行保护。
  - 目前在屋面工程中大部分采用重力流排水，但是随着建
  - 筑技术的不断发展，一些超大型建筑不断涌现，常规的重力流排
  - 水方式就很难满足屋面排水的要求，为了解决这一问题，本规范 修订时提出了推广使用虹吸式屋面雨水排水系统的必要性。虹吸
  - 排水的原理是利用建筑屋面的高度和雨水所具有的势能，产生虹
  - 吸现象，通过雨水管道变径，在该管道处形成负压，屋面雨水在
  - 管道内负压的抽吸作用下，以较高的流速迅速排出屋面雨水。
  - 相对于普通重力流排水，虹吸式雨水排水系统的排水管道均
  - 按满流有压状态设计，悬吊横管可以无坡度铺设。由于产生虹吸
  - 作用时，管道内水流流速很高，相对于同管径的重力流排水量
  - 大，故可减少排水立管的数量，同时可减小屋面的雨水负荷，最
  - 大限度地满足建筑使用功能要求。
  - 虹吸式屋面雨水排水系统，目前在我国逐渐被采用，如东莞
  - 国际会展中心、上海科技馆、浦东国际机场、北京世贸商城等一
  - 批大型项目相继建成技人使用后，系统运行良好。为了在我国推
  - 广应用这一技术，中国工程建设标准化协会制定了《虹吸式屋面
  - '雨水排水系统技术规程)) CECS183 : 2005 。故本条规定暴雨强'
  - 度较大地区的工业厂房、库房、公共建筑等大型屋面，宜采用虹
  - 吸式屋面雨水排水系统。
  - 由于虹吸排水系统的设计有一定的技术要求，排水口、排水
  - 管等构件如果不按要求设计，将起不到虹吸作用，所以虹吸式屋
  - 面雨水排水系统应按专项技术规程进行设计。
  - 落口堵塞或冻裂，而在化冻时水落口的冰尚未完全解冻，造成屋
  - 面的溶水无法排出。故本条规定严寒地区应采用内排水，寒冷地
  - 区宜采用内排水，以避免水落管受冻。有条件时，外排水系统应
  - 对水落管和水落口采取防冻措施，以便屋面上化冻后的冰雪榕水
  - 能顺利排出。
  - 西、陕西、甘肃等地区。这种湿陷性黄土在上覆土的自重压力或
  - 上覆土的自重压力与附加压力共同作用下，受水浸湿后，土体结
  - 构逐渐被破坏，土颗粒向大孔中移动，从而导致地基湿陷，引起
  - 上部建筑的不均匀下沉，使墙体出现裂缝。所以本条规定在湿陷 性黄土地区的建筑屋面宜采用有组织排水系统，将屋面雨水直接
  - 排至排水管网或排至不影响建筑物地基的区域，避免屋面雨水直
  - 接排到室外地面上，沿地面渗入地下而造成地基不均匀下沉，导
  - 致建筑物破坏。
  - 根据多年实践经验，檐沟、天沟宽度太窄不仅不利于防
  - 水层施工，而且也不利于排水，所以本条规定其净宽度不应小于
  - 300mm。檐沟、天沟的深度按沟底的分水线深度来控制，本条
  - 规定分水线处的最小深度不应小于100mm ，如过小，则当沟中
  - 水满时，雨水易由天沟边溢出，导致屋面渗漏。
  - 在本条中还规定了檐沟、天沟沟底的纵向坡度不应小于
  - 1% ，这是因为如果沟底坡度过小，在施工中很难做到沟底平直
  - 顺坡，常常会因沟底凸凹不平或倒坡，造成檐沟、天沟中排水不
  - 畅或积水。沟内如果长期积水，沟内的卷材或涂膜防水层易发生
  - 霉烂，造成渗漏。
  - 沟底的水落差就是天沟内的分水线到水落口的高差，本条文
  - 规定沟底水落差不应大于200mm ，这是因为沟底排水坡度为
  - 1% ，排水线路长20m 时，水落差就是200mm 。
  - 而金属檐沟、天沟的坡度是由结构找坡的，考虑制作和安装方面
  - 的因素，规定金属檐沟、天沟的纵向坡度宜为0.5% 。在雨水丰
  - 富降雨量较大的地区，金属檐沟、天沟要有足够的盛水量及排水
  - 能力，以免雨量较大时雨水溢出。
  - 采用经过防锈处理的金属成品或塑料成品，这样不仅施工方便，
  - 而且有利于保证工程质量。
  - '4.3'
  - 找坡层和找平层设计
  - 工业厂房和公共建筑只要对顶棚水平度要求不高或建筑功能允
  - 许，应首先选择结构找坡，既节省材料、降低成本，又减轻了屋 面荷载，因此，本条规定混凝土结构屋面宜采用结构找坡，坡度
  - 不应小于3% 。
  - 当用材料找坡时，为了减轻屋面荷载和施工方便，可采用质
  - 量轻和吸水率低的材料。找坡材料的吸水率宜小于20% ，过大
  - 的吸水率不利于保温及防水。找坡层应具有一定的承载力，保证
  - 在施工及使用荷载的作用下不产生过大变形。找坡层的坡度过大
  - 势必会增加荷载和造价，因此本条规定材料找坡坡度宜为2% 。
  - 平整的基层，找平层应具有一定的厚度和强度。如果整体现浇混
  - 凝土板做到随挠随用原浆找平和压光，表面平整度符合要求时，
  - 可以不再做找平层。采用水泥砂浆还是细石混凝土作找平层，主
  - 要根据基层的刚度。根据调研结果，在装配式混凝土板或板状材
  - 料保温层上设水泥砂浆找平层时，找平层易发生开裂现象，故本
  - 规范修订时规定装配式混凝土板上应采用细石混凝土找平层。基
  - 层刚度较差时，宜在混凝土内加钢筋网片。同时，还规定板状材
  - 料保温层上应采用细石混凝土找平层。
  - 由于找平层的自身干缩和温度变化，保温层上的找平层
  - 容易变形和开裂，直接影响卷材或涂膜的施工质量，故本条规定
  - 保温层上的找平层应留设分格缝，使裂缝集中到分格缝中，减少
  - 找平层大面积开裂。分格缝的缝宽宜为5mm ，......，20mm ，当采用后
  - 切割时可小些，采用预留时可适当大些，缝内可以不嵌填密封材
  - 料。由于结构层上设置的找平层与结构同步变形，故找平层可以
  - 不设分格缝。
