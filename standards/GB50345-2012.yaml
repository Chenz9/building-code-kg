- id: GB 50345-2012#4.9.14
  standard_code: GB 50345-2012
  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.9.14
  text: '金属面绝热夹芯板采用紧固件连接的构造，应符合下列 规定: 1 应采用屋面板压盖和带防水密封胶垫的自攻螺钉，将夹 芯板固定在穰条上; 2 夹芯板的纵向搭接应位于嫖条处，每块板的支座宽度不 应小于50mm ，支承处宜采用双攘或擦条一侧加焊通长角钢; 3 夹芯板的纵向搭接应顺流水方向，纵向搭接长度不应小 于200mm ，搭接部位均应设置防水密封胶带，并应用拉娜钉 连接; 4 夹芯板的横向搭接方向宜与主导风向一致，搭接尺寸应 按具体板型确定，连接部位均应设置防水密封胶带，并应用拉娜 钉连接。'
