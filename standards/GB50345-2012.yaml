  - 金属板是将镀层钢板或铝合金板经辑压冷弯，沿板宽方向形成连
  - 续波形截面的成型板，一方面大大提高屋面板的刚度，另一方面
  - 波肋的存在允许屋面板在横向有一定的伸缩。由于在工厂轧制的
  - 压型金属板受运输条件的限制，一般板长宜在12m 之内;在施
  - 工现场轧制的压型金属板应根据吊装条件尽量采用较长尺寸的板
  - 材，以减少板的纵向搭接，防止渗漏。
