玻璃采光顶设计坡度不 宜太小，以防止结露水滴落;玻璃采光顶的型材应设置集水槽， 并使所有集水槽相互沟通，使玻璃下的结露水汇集，并将结露水 汇集排放到室外或室内水落管内。 理，型材己作表面处理的可不再作防腐处理。 铝合金型材与其他金属材料接触、紧固时，容易产生电化学 腐蚀，应在铝合金材料与其他金属材料之间采取隔离措施。 这三条对玻璃采光顶的玻璃提出具体要求。 规定玻璃采光顶的玻璃面板应采用安全玻璃，安全玻璃主要包括 夹层玻璃和中空夹层玻璃。中空玻璃设计时上层玻璃尚应考虑冰 雹等的影响。 夹层玻璃是一种性能良好的安全玻璃，是用聚乙烯醇缩丁醒 (Pvm 胶片将两块玻璃粘结在一起，当受到外力冲击时，玻璃 碎片粘在PVB 胶片上，可以避免飞溅伤人。钢化玻璃是将普通 玻璃加热后急速冷却形成，当被打破时，玻璃碎片细小而无锐 角，不会造成割伤。 采光顶玻璃组装采用镶嵌方式时，玻璃与构件槽口之 间应适应在正常工作情况下会发生结构层间位移和玻璃变形，以 避免玻璃直接碰到构件槽口造成玻璃破损，因此，明框玻璃组件 中，玻璃与槽口的配合尺寸很重要，应符合设计和技术标准的 规定。 玻璃四周的密封胶条应采用有弹性、耐老化的密封材料，密 封胶条不应有硬化、龟裂现象。《建筑玻璃采光顶)) JG/T 231 - 2007 中规定:橡胶制品应符合现行行业批准《硫化橡胶和热塑 性橡胶 建筑用预成型密封垫的分类、要求和试验方法)) HG/T 3100 和现行国家标准《工业用橡胶板)) GB/T 5574 的规定，宜 采用三元乙丙橡胶、氯丁橡胶和硅橡胶。 璃之间的周边以及隐框和半隐框构件的玻璃与金属框之间，都应 采用硅酣结构密封胶粘结。结构胶使用前必须经过胶与相接触材 料的相容性试验，确认其粘结可靠才能使用。硅酣结构密封胶的 相容性试验应符合现行国家标准《建筑硅酣结构密封胶)) GB 16776 的有关规定。 采光顶玻璃采用点支式组装方式时，在正常工作情况 下会发生结构层间位移和玻璃变形。若连接件与玻璃面板为硬性 直接接触，易产生玻璃爆裂的现象，同时直接接触亦易产生摩擦 噪声。因此，点支承玻璃采光顶的支承装置除应符合结构受力和 建筑美观要求外，还应具有吸收平面变形的能力，在连接件与玻 璃之间应设置衬垫材料，这种材料应具备一定的韧性、弹性、硬 度和耐久性。 水卷材或防水涂料处理，而是集中对玻璃面板之间的装配接缝嵌 填弹性密封胶，保证密封不渗漏。由于采光顶渗漏现象时有发 生，主要表现在接缝密封层的开裂、脱粘或局部缺陷，而且一处 的渗漏治理往往会产生新的漏点，所以在设计时应充分评估采光 顶玻璃接缝的变位特征，正确设定接缝构造及选材，控制接缝密 封形状和施工质量，才能实现屋面工程无渗漏的目标。 玻璃接缝设计应首先分析引起玻璃面板接缝位移的诸多因 素，并计算这些因素产生的位移量值。以温差位移为例:如采光 顶面板为18mm 厚夹层玻璃，表层为热反射玻璃(热吸收系数 H=0.83 ，热容常数C= 56) ，面板长边为2000mm ，短边为 1500mm，夏季最高环境温度为 33 0C ，冬季最低环境温度为 一16 0C ，在面板边部无约束条件下，面板间接缝的最大温差位移 量t:.L 可按下式计算: t:.L = L 0 ð..Tmax 0α 式中:L 长边尺寸 (mm); α一一玻璃热膨胀系数，取9 X 10-6 (/OC); ð..T max一一最大温差 CC) 。 (2) ð..T max= 夏季日照下玻璃最高温度(即HXC十夏季最高环境 温度)一冬季最低环境温度=(0.83X56 十33) 一(-16) =80+ 16 =96CC) t:.L=2000 X 96 X 9 X 10•=1. 73(mm) 考虑风荷载变化、雪荷载、地震、自重挠度等引起接缝的位 移量为1. 20mm (计算略) ，叠加温差位移后总位移量为 2.93mm ，考虑误差等其他因素，取安全系数1. 1 ，则接缝最大 位移量值为3. 22mm 。 若设定接缝宽度为6mm，计算位移量为3.22mm，则接缝 胶的相对位移量为士27% ，在密封胶标准中最高位移能力级别为 25 级，即位移能力为士25% ，所以无胶可选，必须加大接缝宽 度。如加宽为8mm ，则接缝相对位移量为:i: 20. 2% ，这样设定 可选用位移能力级别为25 级密封胶。考虑到接缝形状和变形产 生的应力集中，以及密封胶随使用年限的增加可能发生性能变 化，为更安全地设定接缝宽度宜加大到10mm o 本条规定玻璃接缝密封胶应符合现行行业标准《幕墙玻璃接 缝用密封胶ìì JCjT 882 的规定。还规定接缝深度宜为接缝宽度 的50%~70% ，是从国外大量资料和国内屋面接缝防水实践中 总结出来的，是一个经验值。另外根据德国的经验，缝深为缝宽 的lj2~