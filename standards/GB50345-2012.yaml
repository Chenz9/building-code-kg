- id: GB 50345-2012#5.3.4
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.3.4
  text: '屋面排汽构造施工应符合下列规定: 1 排汽道及排汽孔的设置应符合本规范第4.4.5 条的有关 规定; 2 排汽道应与保温层连通，排汽道内可填入透气性好的 材料; 3 施工时，排汽道及排汽孔均不得被堵塞; 4 屋面纵横排汽道的交叉处可埋设金属或塑料排汽管，排 汽管宜设置在结构层上，穿过保温层及排汽道的管壁四周应打 孔。排汽管应作好防水处理。'
