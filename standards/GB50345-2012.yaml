  - 并应符合环境保护要求;
  - '3'
  - 种植隔热层宜根据植物种类及环境布局的需要进行分区
  - 布置，分区布置应设挡墙或挡板;
  - '4'
  - 排水层材料应根据屋面功能及环境、经济条件等进行选
  - 择F 过滤层宜采用200g/m2 ,..__ 400g/ m2 的土工布，过滤层应沿种
  - 植土周边向上铺设至种植土高度;
  - '5'
  - 种植土四周应设挡墙，挡墙下部应设泄水孔，并应与排
  - 水出口连通;
  - 6 种植土应根据种植植物的要求选择综合d性能良好的材料;
  - 种植土厚度应根据不同种植士和植物种类等确定;
  - '7'
  - 种植隔热层的屋面坡度大于20%时，其排水层、种植土
  - 应采取防滑措施。
- id: GB 50345-2012#4.4.9
  standard_code: GB 50345-2012
  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.4.9
  text: 架空隔热层的设计应符合下列规定。1、架空隔热层宜在屋顶有良好通风的建筑物上采用,不宜在寒冷地区采用，2,当采用混凝土板架空隔热层时、屋面坡度不宜大于5 3,架空隔热制品及其支座的质量应符合国家现行有关材料标准的规定。4,架空隔热层的高度宜为180mm 300mm。架空板与女儿墙的距离不应小于250mm 5.当屋面宽度大于10m时,架空隔热层中部应设置通风屋脊.6、架空隔热层的进风口,宜设置在当地炎热季节最大频率风向的正压区。
