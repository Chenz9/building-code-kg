  clause_no: 4.8.10
  text: '木基层、木顺水条、木挂瓦条等木质构件，由于在潮湿 的环境和一定的温度条件下，木腐菌极易繁殖，木腐菌侵蚀木 材，导致木构件腐朽。另外在潮湿闷热的环境中，还会给白蚁、 甲壳虫等的生存创造了条件，这些昆虫的习性是喜欢居住在木材 中，并将木材内部蛙成蜂窝状洞穴和曲折形穴道，使木基层遭到 损害而失去使用功能，所以当瓦屋面使用木基层时，应按现行国 家标准《木结构设计规范)) GB 50005 的规定进行防腐和防蛙处 理。另外，木材是易燃材料，易导致火灾，所以本条规定对此类 木基层，还必须进行防火处理。 金属顺水条、金属挂瓦条在干湿交替的环境中，铁类金属极 易锈蚀，年长日久更易造成严重锈蚀而使金属构件损坏，因此， 本条规定当烧结瓦、混凝土瓦屋面采用金属顺水条、挂瓦条时， 应事先进行防锈蚀处理，如涂刷防锈潦或进行镀铸处理等。 烧结瓦、混凝土瓦干法挂瓦时，应将顺水条、挂瓦条钉 在基层上，顺水条的间距宜为500mm，再在顺水条上固定挂瓦 条。块瓦采用在基层上使用泥背的非永久性建筑，本条已取消。 烧结瓦、混凝土瓦的后爪均应挂在挂瓦条上，上下行瓦的左 右拼缝应相互错开搭接并落槽密合;瓦背面有挂钩和穿线小孔均 为铺筑时固定瓦片用的，一般坡度的瓦屋面檐口两排瓦片，均应 用18 号铁丝穿在瓦背面的小孔上，并扎穿在挂瓦条上，以防止 瓦片脱离时滑下。 4.8.12 根据烧结瓦和混凝土瓦的特性，通过经验总结，本条规 定了块瓦铺装时相关部位的搭伸尺寸。烧结瓦、混凝土瓦屋面的 檐口如果挑出墙面太少，下大雨时檐口下的墙体易被雨水淋湿， 甚至会导致渗漏。按实践经验和美观的要求，檐口挑出墙面的长 度以不小于300mm 为宜。瓦片挑出檐口的长度如果过短，雨水 易流淌到封檐板上，造成爬水，按经验总结瓦片挑出檐口的长度 以50mm~70mm 为宜。 沥青瓦屋面由于具有重量轻、颜色多样、施工方便、 可在木基层或混凝土基层上使用等优点，所以近年来在坡屋 面工程中广泛采用。沥青瓦屋面必须具有一定的坡度，如果 屋面坡度过小，则不利于屋面雨水排出，而且在沥青瓦片之 间还可能发生浸水现象，所以本条规定沥青瓦屋面的坡度不 应小于20% 。当沥青瓦屋面坡度过大或在大风地区，瓦片易 出现下滑或被大风掀起，所以应采取加固措施，以确保沥青 瓦屋面的工程质量。 保沥青瓦安装在屋面上后垂片能被粘结。沥青瓦的厚度是确保屋 面防水质量的关键，根据现行国家标准《玻纤胎沥青瓦)) GB/T 20474 的规定，矿物粒(片)沥青瓦质量不低于3.4kg/时，厚 度不小于2..6mm; 金属宿面沥青瓦质量不低于2. 2kg/m2 ，厚度 不小于2mm 。 的方法与基层固定。沥青瓦通过钉子钉人持钉层和沥青瓦片之间 的相互粘结，成为一个与基层牢固固定的整体。为了使沥青瓦与 基层固定牢固，要求在每片沥青瓦片上应钉人4 个固定钉。如果 屋面坡度过大，为防止沥青瓦片下坠的作用，以及防止大风时将 沥青瓦片掀起破坏，所以本条规定在大风地区或屋面坡度超过 100%时，每张瓦片上不得少于6 个固定钉。 1 搭接式:沿天沟中心线铺设一层宽度不小于1000mm 的 附加防水垫层，将外边缘固定在天沟两侧，从一侧铺设瓦片跨过 天沟中心线不小于300mm ，然后用固定钉固定，再将另一侧的 瓦片搭过中心线后固定，最后剪修沥青瓦片上的边角，并用沥青 基胶结材料固定。 2 编织式:沿天沟中心线铺设一层宽度不小于1000mm 的 附加防水垫层，将外边缘固定在天沟两侧。在两侧屋面上同时向 天沟方向铺设瓦片，至距天沟中心线75mm 处再铺设天沟上的 瓦片。 3 敞开式:沿天沟中心线的两侧，采用厚度不小于 0.45mm 的防锈金属板，用金属固定件固定在基层上，沥青瓦片 与金属天沟之间用100mm 宽的沥青基胶粘材料粘结，瓦片上的 固定钉应密封覆盖。 铺装时相关部位的搭伸尺寸。 4.9 金属板屋面设计 近几年，大量公共建筑的涌现使得金属板屋面迅猛发展， 大量新材料应用及细部构造和施工工艺的创新，对金属板屋面设 计提出了更高的要求。 金属板屋面是由金属面板与支承结构组成，金属板屋面的耐 久年限与金属板的材质有密切的关系，按现行国家标准《冷弯薄 壁型钢结构技术规范)) GB 50018 的规定，屋面压型钢板厚度不 宜小于0.5mm o 参照奥运工程金属板屋面防水工程质量控制技 术指导意见中对金属板的技术要求，本条规定当防水等级为I 级 时，压型铝合金板基板厚度不应小于0.9mm; 压型钢板基板厚 度不应小于0.6mm ，同时压型金属板应采用360。咬口锁边连接 方式。 尽管金属板屋面所使用的金属板材料具有良好的防腐蚀性， 但由于金属板的伸缩变形受板型连接构造、施工安装工艺和冬夏 季温差等因素影响，使得金属板屋面渗漏水情况比较普遍。根据 本规范规定屋面I 级防水需两道防水设防的原则，同时考虑金属 板屋面有一定的坡度和泄水能力好的特点，本条规定I 级金属板 屋面应采用压型金属板+防水垫层的防水做法; II 级金属板屋面 应采用紧固件连接或咬口锁边连接~J 压型金属板以及金属面绝热 夹芯板的防水做法。 料为彩色涂层钢板、镀层钢板、不锈钢板、铝合金板、铁合金板 和铜合金板。选用金属面板材料时，产品吃符合现行国家或行业 标准，也可参照国外同类产品标准的性能、指标及要求。彩色涂 层钢板应符合现行《彩色涂层钢板及钢带)) GB/T 12754 的要 求;镀层钢板应符合现行国家标准《连续热镀辞钢板及钢带》 GB/T 2518 和《连续热镀铝铮合金镀层钢板及钢带)) GB/T 14978 的要求;不锈钢板应符合现行国家标准《不锈钢冷轧钢板 和钢带)) GB/T 3280 和《不锈钢热轧钢板和钢带)) GB/T 4237 的要求;铝合金板应符合现行国家标准《铝及铝合金轧制板材》 GB/T 3880 的要求;铁合金板应符合现行国家标准《铁及铁合 金板材)) GB/T 3621 的要求;铜合金板应符合现行国家标准 《铜及铜合金板)) GB/T 2040 的要求;金属板材配套使用的紧固 件应符合现行国家标准《紧固件机械性能)) GB/T 3098 的要求; 防水密封胶带应符合现行行业标准《丁基橡胶防水密封胶粘带》 JC/T 942 的要求;防水密封胶垫宜采用兰元乙丙橡胶、氯丁橡 胶、硅橡胶，其性能应符合现行行业标准《硫化橡胶和热塑性橡 胶建筑用预成型密封垫的分类、要求和试验方法)) HG/T 3100 和国家标准《工业用橡胶板)) GB/T 5574 的要求;硅酣耐 候密封胶应符合现行国家标准《硅酣建筑密封胶)) GB/T 14683 的要求。 活荷载、风荷载、积灰荷载、雪荷载以及地震作用和温度作用。 金属面板与支承结构之间、支承结构与主体结构之间，须有相应 的变形能力，以适应主体结构的变形;当主体结构在外荷载作用 下产生位移时，一般不应使构件产生过大的内力和不能承受的 变形。 截面惯''性矩、截面模量和最大允许模距等内容，均应由生产厂家 负责提供。 压型金属板构造系统可分为单层金属板屋面、单层金属板复 合保温屋面、擦条露明型双层金属板复合保温屋面、攘条暗藏型 双层金属板复合保温屋面。 1 单层金属板屋面:厚度不应小于0.6mm 压型金属板; 冷弯型钢穰条。 2 单层金属板复合保温屋面z 厚度不应小于0.6mm 压型 金属板;玻璃棉毡保温层;隔汽层;热镀辞或不锈钢丝网;冷弯 型钢擦条。 3 穰条露明型双层金属板复合保温屋面z 厚度不应小于 0.6mm 上层压型金属板;玻璃棉毡保温层;隔汽层;冷弯型钢 附加穰条;厚度不应小于0.5mm 底层压型金属板;冷弯型钢主 擦条。 4 穰条暗藏型双层金属板复合保温屋面:厚度不应小于 0.6mm 上层压型金属板;玻璃棉毡保温层;隔汽层;冷弯型钢 附加模条;厚度不应小于0.5mm 底层压型金属板。 增设隔汽层;在严寒及寒冷地区或室内外温差较大的环境中，隔 汽层设置需通过热工计算。防水透汽膜是具有防风和防水透汽功 能的膜状材料，包括纺粘聚乙烯和聚丙烯膜;防水透汽膜应铺设 在屋面保温层外侧，可将外界水域空气气流阻挡在建筑外部，阻 止冷风渗透，同时能将室内的潮气排到室外。防水透汽膜性能应 符合本规范附录B. 1. 15 的规定，该指标摘自《建筑外墙防水工 程技术规程)) JGJjT 235 - 2011 第4.2.6 条的规定。 果长时间的结露则会滋生霉潮，对人体健康造成有害的影响，也 是不允许的。室内表面出现结露最直接的原因是内表面温度低于 室内空气的露点温度。一般说来，在金属板屋面结构内表面大面 积结露的可能性不大，结露往往都出现在热桥的位置附近。当然 要彻底杜绝金属板屋面结构内表面结露现象有时也是非常困难 的，只是要求在室内空气温、湿度设计条件下不应出现结露。根 据国内外有关热工计算资料，室内温度和相对湿度下的露点温度 可按表6 选用。 表6 室内温度和相对湿度下的露点温度 ("C) 室内温度 室内相对湿度(%) ("C ) 20 30 40 50 60 70 80 90 5 一14.4 -9.9 -6.6 -4.0 1. 8 。 1. 9 3.5 10 一10.5 -5.9 2. 5 0.1 2. 7 4.8 6. 7 8.4 15 -6.7 -2.0 1. 7 4.8 7.4 9. 7 11. 6 13.4 20 -3.0 2.1 6.2 9.4 12.1 14.5 16.5 18.3 25 一0.9 6.6 10.8 14.1 16.9 19.3 21. 4 23.3 30 -5.1 11. 0 15.3 18.8 21. 7 24. 1 26.3 28