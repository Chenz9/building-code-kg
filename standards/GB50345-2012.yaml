- id: GB 50345-2012#5.4.6
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.4.6
  text: '冷粘法铺贴卷材应符合下列规定: 1 胶粘剂涂刷应均匀，不得露底、堆积;卷材空铺、点粘、 条粘时，应按规定的位置及面积涂刷胶粘剂; 2 应根据胶粘剂的性能与施工环境、气温条件等，控制胶 粘剂涂刷与卷材铺贴的间隔时间; 3 铺贴卷材时应排除卷材下面的空气，并应辑压粘贴牢固; 4 铺贴的卷材应平整顺直，搭接尺寸应准确，不得扭曲、 皱折;搭接部位的接缝应满涂胶粘剂，辑压应粘贴牢固; 5 合成高分子卷材铺好压粘后，应将搭接部位的粘合面清 理干净，并应采用与卷材配套的接缝专用胶粘剂，在搭接缝粘合 面上应涂刷均匀，不得露底、堆积，应排除缝间的空气，并用棍 压粘贴牢固; 6 合成高分子卷材搭接部位采用胶粘带粘结时，粘合面应 清理干净，必要时可涂刷与卷材及胶粘带材性相容的基层胶粘 剂，撕去胶粘带隔离纸后应及时粘合接缝部位的卷材，并应辑压 粘贴牢固;低温施工时，宜采用热风机加热; 7 搭接缝口应用材性相容的密封材料封严。'
  is_mandatory_clause: false
