  text: '屋面排汽构造设计应符合下列规定: 1 找平层设置的分格缝可兼作排汽道，排汽道的宽度宜 为40mm; 2 排汽道应纵横贯通，并应与大气连通的排汽孔相通，排 汽孔可设在檐口下或纵横排汽道的交叉处; 3 排汽道纵横间距宜为6m ，屋面面积每36m2 宜设置→个 排汽孔，排汽孔应作防水处理; 4 在保温层下也可铺设带支点的塑料板。'
