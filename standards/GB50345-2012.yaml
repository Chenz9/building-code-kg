  text: '压型金属板采用紧固件连接的构造应符合下列规定: 1 铺设高波压型金属板时，在穰条上应设置固定支架，固 定支架应采用自攻螺钉与攘条连接，连接件宜每波设置一个; 2 铺设低波压型金属板时，可不设固定支架，应在波峰处 采用带防水密封胶垫的自攻螺钉与中禀条连接，连接件可每波或隔 波设置一个，但每块板不得少于3 个; 3 压型金属板的纵向搭接应位于穰条处，搭接端应与擦条 有可靠的连接，搭接部位应设置防水密封胶带。压型金属板的纵 向最小搭接长度应符合表4.9.13 的规定; 表4.9.13 压型金属板的纵向最小搭接长度 (mm) 压型金属板 纵向最小搭接长度 高波压型金属板 350 屋面坡度~10% 250 低波压型金属板 屋面坡度>10% 200 4 压型金属板的横向搭接方向宜与主导风向一致，搭接不 应小于一个波，搭接部位应设置防水密封胶带。搭接处用连接件 紧固时，连接件应采用带防水密封胶垫的自攻螺钉设置在波 峰上。'
