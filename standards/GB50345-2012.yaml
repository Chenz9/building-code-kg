- id: GB 50345-2012#5.3.7
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.3.7
  text: '喷涂硬泡聚氨醋保温层施工应符合下列规定: 1 基层应平整、干燥、干净; 2 施工前应对喷涂设备进行调试，并应喷涂试块进行材料 性能检测; 3 喷涂时喷嘴与施工基面的间距应由试验确定; 4 喷涂硬泡聚氨醋的配比应准确计量，发泡厚度应均匀 -致; 5 一个作业面应分遍喷涂完成，每遍喷涂厚度不宜大于 15mm，硬泡聚氨醋喷涂后20min 内严禁上人; 6 喷涂作业时，应采取防止污染的遮挡措施。'
