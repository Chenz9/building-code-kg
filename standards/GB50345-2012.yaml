  buf:
  - ''
  - '屋面工程施工的防火安全应符合下列规定:'
  - '1'
  - 可燃类防水、保温材料进场后，应远离火源;露天堆放
  - 时，应采用不燃材料完全覆盖;
  - '2'
  - 防火隔离带施工应与保温材料施工同步进行;
  - '3'
  - 不得直接在可燃类防水、保温材料上进行热熔或热粘法
  - 施工;
  - '4'
  - 喷涂硬泡聚氨醋作业时，应避开高温环境;施工工艺、
  - 工具及服装等应采取防静电措施;
  - '5'
  - 施工作业区应配备消防灭火器材;
  - '6'
  - 火源、热源等火灾危险源应加强管理;
  - '7'
  - 屋面上需要进行焊接、钻孔等施工作业时，周围环境应
  - 采取防火安全措施。 5. 1. 6
  - '屋面工程施工必须符合下列安全规定:'
  - '1'
  - 严禁在雨天、雪天和五级凤及其以上时施工;
  - '2'
  - 屋面周边和预留孔洞部位，必须按临边、洞口防护规定
  - 设置安全护栏和安全网;
  - '3'
  - 屋面坡度大于30% 时，应采取防滑措施;
  - '4'
  - 施工人员应穿防滑鞋，特殊情况下无可靠安全措施时，
  - 操作人员必须系好安全带并扣好保险钩。
  - '5.2'
  - 找坡层和找平层施工
