  text: 沥青瓦屋面檐沟和天沟的防水构造、应符合下列规定,1、檐沟防水层下应增设附加层，附加层伸入屋面的宽度不应小于500mm 2，檐沟防水层伸入瓦内的宽度不应小于150mm.并应与屋面防水层或防水垫层顺流水方向搭接,3、檐沟防水层和附加层应由沟底翻上至外侧顶部.卷材收头应用金属压条钉压,并应用密封材料封严.涂膜收头应用防水涂料多遍涂刷.4,沥青瓦伸入檐沟内的长度宜为10mm，20mm.5、天沟采用搭接式或编织式铺设时、沥青瓦下应增设不小于1000mm宽的附加层,图4.11.13、6,天沟采用敞开式铺设时.在防水层或防水垫层上应铺设厚度不小于0，45mm的防锈金属板材，沥青瓦与金属板材应顺流水方向搭接 搭接缝应用沥青基胶结材料粘结,搭接宽度不应小于100mm,女儿墙和山墙。
