  section: ''
  clause_no: 4.9.12
  text: '压型金属板采用咬口锁边连接的构造应符合下列规定: 1 在穰条上应设置与压型金属板波形相配套的专用固定支 座，并应用自攻螺钉与模条连接; 2 压型金属板应搁置在固定支座上，两片金属板的侧边应 确保在风吸力等因素作用下扣合或咬合连接可靠; 3 在大风地区或高度大于30m 的屋面，压型金属板应采用 360。咬口锁边连接; 4 大面积屋面和弧状或组合弧状屋面，压型金属板的立边 咬合宜采用暗扣直立锁边屋面系统; 5 单坡尺寸过长或环境温差过大的屋面，压型金属板宜采 用滑动式支座的360。咬口锁边连接。'
