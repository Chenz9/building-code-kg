  - 动，屋面板沿板块长度方向可有一定的移动量，使得屋面板不
  - 产生温度应力，这样金属板的单坡最小长度可以大大提高。根
  - 据本规范第4.9.15 条第2 款的规定，由于金属板单坡长度过
  - 大，板的伸缩量超过金属板铺装的有关尺寸，会影响檐沟及天 沟的使用，故本条提出金属板最大伸缩变形量不宜超过
  - 100mm 的要求。有关压型金属板的单坡最大长度可参见本规
  - 范第5.9.5 条的条文说明。
