  buf:
  - '涂膜防水层施工应符合下列规定:'
  - '1'
  - 防水涂料应多遍均匀涂布，涂膜总厚度应符合设计要求;
  - '2'
  - 涂膜间夹铺胎体增强材料时，宜边涂布边铺胎体;胎体
  - 应铺贴平整，应排除气泡，并应与涂料粘结牢固。在胎体上涂布
  - 涂料时，应使涂料浸透胎体，并应覆盖完全，不得有胎体外露现
  - 象。最上面的涂膜厚度不应小于1. Omm;
  - '3'
  - 涂膜施工应先做好细部处理，再进行大面积涂布;
  - '4'
  - 屋面转角及立面的涂膜应薄涂多遍，不得流淌和堆积。
