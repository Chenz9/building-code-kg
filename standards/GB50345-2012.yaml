- id: GB 50345-2012#5.1.5
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.1.5
  text: 屋面工程施工的防火安全应符合下列规定，1 可燃类防水，保温材料进场后,应远离火源 露天堆放时.应采用不燃材料完全覆盖 2,防火隔离带施工应与保温材料施工同步进行.3，不得直接在可燃类防水 保温材料上进行热熔或热粘法施工。4，喷涂硬泡聚氨酯作业时.应避开高温环境。施工工艺,工具及服装等应采取防静电措施。
  is_mandatory_clause: false
  is_abolished: false
  superseded_by: null
  abolished_date: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: null
    modal_words: []
