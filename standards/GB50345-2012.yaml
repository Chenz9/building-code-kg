- id: GB 50345-2012#4.4.2
  standard_code: GB 50345-2012
  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.4.2
  text: 保温层设计应符合下列规定z 1 保温层宜选用吸水率低、密度和导热系数小，并有一定 强度的保温材料; 2 保温层厚度应根据所在地区现行建筑节能设计标准，经 计算确定; 3 保温层的含水率，应相当于该材料在当地自然风干状态 下的平衡含水率; 4 屋面为停车场等高荷载情况时，应根据计算确定保温材 料的强度; 5 纤维材料做保温层时，应采取防止压缩的措施; 6 屋面坡度较大时，保温层应采取防滑措施; 7 封闭式保温层或保温层干燥有困难的卷材屋面，宜采取 排汽构造措施。
