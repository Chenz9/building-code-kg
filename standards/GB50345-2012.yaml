  - 后方能进行上部保温层的施工。
  - 保护层施工时如损坏了保温层和防水层，不但会降低使用功
  - 能，而且屋面一旦出现渗漏，很难找到渗漏部位，也不便于及时
  - 修复。
  - '1'
  - 隔汽层施工前，应清理结构层上的松散杂物，凸出基层
  - 表面的硬物应剔平扫净。同时基层应作找平处理。
  - '2'
  - 隔汽层铺设在保温层之下，可采用一般的防水卷材或涂
  - 料，其做法与防水层相同。规定屋面周边隔汽层应沿墙面向上铺
  - 设，并高出保温层上表面不得小于150mm 。
  - '3'
  - 考虑到隔汽层被保温层、找平层等埋压，卷材隔汽层可
  - 采用空铺法进行铺设。为了提高卷材搭接部位防水隔汽的可靠
  - 性，搭接缝应采用满粘法，搭接宽度不应小于80mm。采用涂膜
  - 做隔汽层时，涂刷质量对隔汽效果影响极大，涂料涂刷应均匀，
  - 涂层元堆积、起泡和露底现象。
  - '4'
  - 若隔汽层出现破损现象，将不能起到隔绝室内水蒸气的
  - 作用，严重影响保温层的保温效果，故应对管道穿过隔汽层破损
  - 部位进行密封处理。
  - 管及排汽道的管壁四周应均匀打孔，以保证排汽的畅通。排汽管
  - 周围与防水层交接处应做附加层，排汽管的泛水处及顶部应采取
  - 防止雨水进入的措施。
  - 单层保温板在拼缝处的热量世漏，效果更佳。干铺法施工时，应
  - 铺平垫稳、拼缝严密，板间缝隙应用同类材料的碎屑嵌填密实;
  - 粘结法施工时，板状保温材料应贴严粘牢，在胶粘剂固化前不得 上人踩踏。
  - 本条还增加了机械固定法施工，即使用专用螺钉和垫片，将
  - 板状保温材料定点钉固在结构上。
  - 纤维材料保温层分为板状和毡状两种。由于纤维保温材
  - 料的压缩强度很小，是无法与板状保温材料相提并论的，故本条
  - 提出纤维保温材料在施工时应避免重压。板状纤维保温材料多用
  - 于金属压型板的上面，常采用螺钉和垫片将保温板与压型板固
  - 定，固定点应设在压型板的波峰上。毡状纤维保温材料用于混凝
  - 土基层的上面时，常采用塑料钉先与基层粘牢，再放人保温毡，
  - 最后将塑料垫片与塑料钉端热熔焊接。毡状纤维保温材料用于金
  - 属压型板的下面时，常采用不锈钢丝或铝板制成的承托网，将保
  - 温毡兜住并与模条固定。
  - 还特别提醒:在铺设纤维保温材料时，应重视做好劳动保护
  - 工作。纤维保温材料一般都采用塑料膜包装，但搬运和铺设纤维
  - 保温材料时，会随意掉落矿物纤维，对人体健康造成危害。施工
  - 人员应穿戴头罩、口罩、手套、鞋、帽和工作服，以防矿物纤维
  - 刺伤皮肤和眼睛或吸人肺部。
  - '1'
  - 喷涂硬泡聚氨醋保温层的基层表面要求平整，是为了保
  - 证保温层厚度均匀且表面达到要求的平整度;基层要求干净、干
  - 燥，是为了增强保温层与基层的粘结。
  - '2'
  - 喷涂硬泡聚氨醋必须使用专用喷涂设备，并应进行调试，
  - 使喷涂试块满足材料d性能要求;喷涂时喷枪与施工基面保持一定
  - 距离，是为了控制喷涂硬泡聚氨醋保温层的厚度均匀，又不至于
  - 使材料飞散;喷涂硬泡聚氨醋保温层施工应多遍喷涂完成，是为
  - 了能及时控制、调整喷涂层的厚度，减少收缩影响。一般情况
  - 下，聚氨醋发泡、稳定及固化时间约需15min ，故规定施工后
  - 20min 内不能上人，防止损坏保温层。
  - '3'
  - 由于喷涂硬泡聚氨醋施工受气候影响较大，若操作不慎
  - 会引起材料飞散，污染环境，故施工时应对作业面外易受飞散物 污染的部位，如屋面边缘、屋面上的设备等采取遮挡措施。
  - '4'
  - 因聚氨醋硬泡体的特点是不耐紫外线，在阳光长期照射
  - 下易老化，影响使用寿命，故要求喷涂施工完成后，及时做保
  - 护层。
  - 1 基层质量对于现浇泡沫混凝土质量有很大影响，浇筑前
  - 湿润基层可以阻止其从现浇泡沫混凝土中吸收水分，但应防止因
  - 积水而产生粘结不良或脱层现象。
  - 2 一般来说泡沫混凝土密度越低，其保温性能越好，但强
  - 度越低。泡沫混凝土配合比设计应按干密度和抗压强度来配制，
  - 并按绝对体积法来计算所组成各种材料的用量。配合比设计时，
  - 应先通过试配确保达到设计所要求的导热系数、干密度及抗压强
  - 度等指标。影响泡沫混凝土性能的一个很重要的因素是它的孔结
  - 构，细致均匀的孔结构有利于提高泡沫混凝土的性能。按泡沫混
  - 凝土生产工艺要求，对水泥、掺合料、外加剂、发泡剂和水必须
  - 计量准确;水泥料浆应预先搅拌2min. 不得有团块及大颗粒存
  - 在，再将发泡机制成的泡沫与水泥料浆混合搅拌5min~8min.
  - 不得有明显的泡沫飘浮和泥浆块出现。
  - '3'
  - 泡沫混凝土浇筑前，应设定浇筑面标高线，以控制浇筑
  - 厚度。泡沫棍凝土通常是保温层兼找坡层使用，由于坡面浇筑时
  - 混凝土向下流淌，容易出现沉降裂缝，故找坡施工时应采取模板
  - 辅助措施。
  - 4 泡沫混凝土的浇筑出料口离基层不宜超过1m. 采用泵送
  - 方式时，应采取低压泵送。主要是为了防止泡沫混凝土料浆中泡
  - 沫破裂，而造成性能指标的降低。
  - '5'
  - 泡沫混凝土厚度大于200mm 时应分层浇筑，否则应按
  - 施工缝进行处理。在泡沫混凝土凝结过程中，由于伴随有泌水、
  - 沉降、早期体积收缩等现象，有时会产生早期裂缝，所以在泡沫
  - 温凝土施工时应尽量降低浇筑速度和减少浇筑厚度，以防止混凝
  - 土终凝前出现沉降裂缝。在泡沫混凝土硬化过程中，由于水分蒸 发原因产生脱水收缩而引起早期干缩裂缝，预防干裂的措施主要
  - 是采用塑料布将外露的全部表面覆盖严密，保持混凝土处于润湿
  - 状态。
  - 为保证材料的规格质量，应当做好贮运、保管工作，减少材料的
  - 损坏。
  - 的物理性能检验项目。
  - 用水泥砂浆粘贴板状材料，在气温低于5 0C 时不宜施
  - 工，但随着新型防冻外加剂的使用，有可靠措施且能够保证质量
  - 时，根据工程实际情况也可在5 0C 以下时施工。
  - 现场喷涂硬泡聚氨醋施工时，气温过高或过低均会影响其发
  - 泡反应，尤其是气温过低时不易发泡。采用喷涂工艺施工，如果
  - 喷涂时风速过大则不易操作，故对施工时的风速也相应作出了
  - 规定。
