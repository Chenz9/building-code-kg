- id: GB 50345-2012#4.6.4
  standard_code: GB 50345-2012
  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.6.4
  text: '位移接缝密封防水设计应符合下列规定: 1 接缝宽度应按屋面接缝位移量计算确定; 2 接缝的相对位移量不应大于可供选择密封材料的位移 能力; 3 密封材料的嵌填深度宜为接缝宽度的50%~70%; 4 接缝处的密封材料底部应设置背衬材料，背衬材料应大 于接缝宽度20% ，嵌入深度应为密封材料的设计厚度; 5 背衬材料应选择与密封材料不粘结或粘结力弱的材料， 并应能适应基层的伸缩变形，同时应具有施工时不变形、复原率 高和耐久性好等性能。 4.7 保护层和隔离层设计'
  is_mandatory_clause: false
  is_abolished: false
  superseded_by: null
