  - 计要求与国外相比偏低，并且更重要的是只有设计要求，没有相
  - 关的标准测试方法对设计要求进行验证，元法确定建筑物的安全
  - 性。为此，中国建筑材料科学研究院苏州防水研究院所属的国赛
  - 建材工业建筑防水材料产品质量监督检验测试中心与国际上屋面
  - 系统检测最权威的机构美国FM 认证公司合作，引进了FM 成熟
  - 的屋面抗风揭测试技术，并于2010 年8 月建成了我国首个屋面
  - 系统抗风揭实验室，开展金属板屋面系统的抗风揭检测业务。卖
  - 验室通过了与FM 认证检测机构的对比试验，测试结果一致可
  - 靠，能够有效评价通过设计的屋面系统所能达到的抗风揭能力，
  - 保证建筑物的安全。通过该方法，能够检验屋面系统的设计、屋
  - 面系统所用的表面材料、基层材料、保温材料、固定件以及整个
  - 屋面系统的可靠性和可行性。 4.10
  - 玻璃采光顶设计
  - 玻璃采光顶是指由直接承受屋面荷载和作用的玻璃透光
  - 面板与支承体系所组成的围护结构，与水平面的夹角小于75。的围
  - 护结构和装饰性结构。玻璃采光顶作为建筑的外围护结构，其造
  - 型是建筑设计的重要内容，设计者不仅要考虑建筑造型的新颖、
  - 美观，还要考虑建筑的使用功能、造价、环境、能耗、施工条件
  - 等诸多因素，需重点对结构类型、材料和细部构造方面进行设计。
  - 玻璃采光顶的支承结构主要有钢结构、钢索杆结构、铝合金
  - 结构等，采光顶的支承形式包括啊?架、网架、拱壳、圆穹等;玻
  - 璃采光顶应按围护结构设计，主要承受自重以及直接作用于其上
  - 的风雪荷载、地震作用、温度作用等，不分担主体结构承受的荷
  - 载或地震作用。玻璃采光顶应具有足够的承载能力、刚度和稳定
  - 性，能够适应主体结构的变形及承受可能出现的温度作用。同
  - 时，玻璃采光顶的构造设计除应满足安全、实用、美观的要求
  - 外，尚应便于制作、安装、维修保养和局部更换。
  - 水密性能、热工性能、隔声性能和采光性能。性能要求的高低和
  - 建筑物的功能性质、重要性等有关，不同的建筑在很多性能上是
  - 有所不同的，玻璃采光顶的物理性能应根据建筑物的类别、高
  - 度、体型、功能以及建筑物所在的地理位置、气候和环境条件进
  - 行设计。如沿海或经常有台风的地区，要求玻璃采光顶的风压变
  - 形性能和雨水渗漏性能高些;风沙较大地区，要求玻璃采光顶的
  - 风压变形性能和空气渗透性能高些;寒冷地区和炎热地区，要求
  - 采光顶的保温隔热性能良好。下面列出现行国家标准《建筑玻璃
  - 采光顶>> ]G/T 231 中有关玻璃采光顶的承载性能、气密性能、
  - 水密性能、热工性能、隔声性能、采光性能等分级指标，供设计
  - 人员选用。
