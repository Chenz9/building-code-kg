- id: GB 50345-2012#5.10.9
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.10.9
  text: '玻璃接缝密封胶的施工应符合下列规定: 1 玻璃接缝密封应采用硅酣耐候密封胶，其性能应符合现 行行业标准《幕墙玻璃接缝用密封胶ìì JC/T 882 的有关规定， 密封胶的级别和模量应符合设计要求; 2 密封胶的嵌填应密实、连续、饱满，胶缝应平整光滑、 缝边顺直; 3 玻璃间的接缝宽度和密封胶的嵌填深度应符合设计要求; 4 不宜在夜晚、雨天嵌填密封胶，嵌填温度应符合产品说 明书规定，嵌填密封胶的基面应清洁、干燥。'
