  text: '屋面防水层设计应采取下列技术措施: 1 卷材防水层易拉裂部位，宜选用空铺、点粘、条粘或机 械固定等施工方法; 2 结构易发生较大变形、易渗漏和损坏的部位，应设置卷 材或涂膜附加层; 3 在坡度较大和垂直面上粘贴防水卷材时，宜采用机械固 定和对固定点进行密封的方法; 4 卷材或涂膜防水层上应设置保护层; 5 在刚性保护层与卷材、涂膜防水层之间应设置隔离层。'
