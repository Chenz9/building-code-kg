  clause_no: 5.10.6
  text: '点支承玻璃采光顶的安装施工应符合下列规定: 1 应根据采光顶分格测量，确定采光顶各分格点的空间 定位; 2 钢材T架及网架结构安装就位、调整后应及时紧固;钢索 杆结构的拉索、拉杆预应力施加应符合设计要求; 3 采光顶应采用不锈钢驳接组件装配，爪件安装前应精确 定出其安装位置; 4 玻璃宜采用机械吸盘安装，并应采取必要的安全措施; 5 玻璃接缝应采用硅酣耐候密封胶; 6 中空玻璃钻孔周边应采取多道密封措施。'
