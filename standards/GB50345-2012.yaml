- id: GB 50345-2012#B.2.5
  standard_code: GB 50345-2012
  chapter: 附录B 屋面工程用防水及保温材料主要性能指标
  section: ''
  clause_no: B.2.5
  text: '金属面绝热夹芯板主要性能指标应符合表 要求。 表8.2.5 金属面绝热夹芯板主要性能指标 指 标 项 目 模塑聚苯乙挤塑聚苯乙硬质聚氨醋岩棉、矿渣 玻璃棉 烯夹芯板 烯夹芯板 夹芯板 棉夹芯板 夹芯板 传热系数 主二0.68 王二0.63 [W/(m2 • K)] 三二0.45 主二0.85 三三0.90 续表B. 2. 5 指 标 项 目 模塑聚苯乙挤塑聚苯乙硬质聚氨醋岩棉、矿渣 玻璃棉 烯夹芯板 烯夹芯板 夹芯板 棉夹芯板 夹芯板 粘结强度 二三0.10 二主O. 10 二，0. 10 二，0.06 二三0.03 (孔。a) 金属面材厚度 彩色涂层钢板基板;?oO.5mm ，压型钢板;?oO.5mm 芯材密度 Ckg/m3 ) 二三18 二主38 二三100 二主64 剥离性能 粘结在金属面材上的芯材应均匀分布，并且每个剥离面的 粘结面积不应小于85% 抗弯承载力 夹芯板挠度为支座间距的1/200 时，均布荷载不应小于0.5 kN/m2 芯材燃烧''性能按《建筑材料及制品燃烧性能分级)) GB 8624 的有关规定分级。 防火性能 岩棉、矿渣棉夹芯板，当夹芯板厚度小于或等于80mm 时， 耐火极限应大于或等于30min; 当夹芯板厚度大于80mm 时， 耐火极限应大于或等于60min 本规范用词说明 1 为便于在执行本规范条文时区别对待，对要求严格程度 不同的用词说明如下: 1) 表示很严格，非这样做不可的用词: 正面词采用"必须"气，反面词采用"严禁" 2) 表示严格，在正常情况均应这样做的用词: 正面词采用"应飞反面词采用"不应"或"不得" 3ω) 表示允许稍有选择，在条件许可时首先应这样做的 用词: 正面词采用"宜"气，反面词采用"不宜" 4斟)表示有选择，在一定条件下可以这样做的用词，采用 "可"。 2 本规范中指明应按其他有关标准执行的写法为"应符 合......的规定"或"应按......执行"。 引用标准名录 1 ((建筑给水排水设计规范)) GB 50015 2 ((建筑设计防火规范)) GB 50016 3 ((建筑物防雷设计规范)) GB 50057 4 ((民用建筑热工设计规范)) GB 50176 5 ((公共建筑节能设计标准)) GB 50189 6 ((工业用橡胶板)) GB/T 5574 7 ((建筑材料及制品燃烧性能分级)) GB 8624 8 ((中空玻璃)) GB/T 11944 9 ((建筑用安全玻璃第3 部分:夹层玻璃)) GB 15763. 3 10 ((建筑用硅酣结构密封胶)) GB 16776 11 ((严寒和寒冷地区居住建筑节能设计标准)) JGJ 26 12 ((夏热冬暖地区居住建筑节能设计标准)) JGJ 75 13 ((夏热冬冷地区居住建筑节能设计标准)) JGJ 134 14 ((建筑玻璃采光顶)) JG/T 231 15 ((幕墙玻璃接缝用密封胶)) JC/T 882 16 ((建筑防水涂料有害物质限量)) JC 1066 17 ((硫化橡胶和热塑性橡胶 建筑用预成型密封垫的分类、 要求和试验方法)) HG/T 3100 中华人民共和国国家标准 屋面工程技术规范 GB 50345 - 2012 条文说明 修订说明 本规范是在《屋面工穆技术规范)) GB 50345 - 2004 的基础 上修订完成，上一版规范的主编单位是山西建筑工程(集团)总 公司，参编单位有北京市建筑工程研究院、中国建筑科学研究 院、浙江工业大学、太原理工大学、中国建筑标准设计研究所、 四川省建筑科学研究院、中国化学建材公司苏州防水研究设计 所、徐州卧牛山新型防水材料有限公司、山东力华防水建材有限 公司。主要起草人员是哈成德、王寿华、朱忠厚、严仁良、叶林 标、王天、项桦太、马芸芳、高延继、王宜群、杨胜、李国 干、孙晓东。 本次修订的主要技术内容是: 1. "基本规定"首次提出了屋 面工程应满足7 项基本要求，屋面工程设计与施工是按照屋面的 基本构造层次和细部构造进行规定的; 2. 屋面防水等级分为I 级和E 级，设防要求分别为两道防水设防和一道防水设防;屋面 防水层包括卷材防水层、涂膜防水层和复合防水层，淘汰了细石 混凝土防水层; 3. 屋面保温层包括板状材料保温层、纤维材料 保温层和整体材料保温层，增加了岩棉、矿渣棉和玻璃棉以及泡 沫混凝土砌块和现浇泡沫混凝土等不燃烧材料; 4. 瓦屋面包括 烧结瓦、混凝土瓦和沥青瓦，增加了金属板屋面和玻璃采光顶。 为了便于广大设计、施工、科研、学校等单位有关人员正确 理解和执行本规范条文内容，规范编制组按章、节、条顺序编制 了本规范的条文说明，对条文规定的目的、依据以及执行中需注 意的有关事项进行了说明。虽然本条文说明不具备与规范正文同 等的法律效力，但建议使用者认真阅读，作为正确理解和把握规 范规定的参考。 目次 1 总则…........…........….................................…........ 83 2 术语…………………………………………………………… 85 3 基本规定..........................................................….. 86 4 屋面工程设计...............................….......…..........… 94 4. 1 一般规定.....................................................…. 94 4. 2 排水设计..............…........…......................……. 97 4.3 找坡层和找平层设计............................................. 100 4.4 保温层和隔热层设计.................…......................... 101 4.5 卷材及涂膜防水层设计.............................….......... 108 4.6 接缝密封防水设计 ................…..….................…. 111 4.7 保护层和隔离层设计…........…............................... 113 4.8 瓦屋面设计...............................….........…........ 115 4.9 金属板屋面设计.....................................…........ 119 4. 10 玻璃采光顶设计........…·…................................. 127 4.11 细部构造设计..............….................................. 134 5 屋面工程施工…........…................…..................... 141 5.1 一般规定................................…...................... 141 5.2 找坡层和找平层施工........….................................. 143 5.3 保温层和隔热层施工….......................................... 144 5.4 卷材防水层施工....................................…......... 149 5. 5 涂膜防水层施工…….......................................... 154 5.6 接缝密封防水施工 ......................….........…........ 156 5.7 保护层和隔离层施工........…..................….........…. 158 5.8 瓦屋面施工…................................................... 160 5.9 金属板屋面施工…........…..............................…. 163 5. 10 玻璃采光顶施工........….....................….........…. 165 1 总则 近年来，由于在屋面工程中新型防水保温材料、新型屋 面形式及新的施工技术等方面均有较快的发展，同时一些屋面工 程专项技术标准也将陆续出台，原规范已不能适应屋面工程技术 发展的需要，故必须进行修订。 在本条中明确了这次规范修订的目的，就是要在设计、施工 方面提高我国屋面工程的技术水平，同时强调了以下四项要求: 1 保证屋面工程防水层和密封部位不渗漏，保温隔热功能 满足设计要求; 2 根据不同的建筑类型、重要程度、使用功能要求、屋面 形式以及地区特点等，在确保屋面工程质量的基础上做到经济 合理; 3 在屋面工程的设计和施工中，应对屋面工程的防水、保 温、隔热做到安全适用; 4 根据环境保护和建筑节能政策，在设计选材、施工作业 以及使用过程中均应符合环境保护和建筑节能的要求，防止对周 围环境造成污染。 1. O. 2 在本条中明确了本规范的适用范围。屋面工程应遵循 "材料是基础、设计是前提、施工是关键、管理是保证"的综合 治理原则，屋面工程设计与屋面工程施工的内容应从总体上涵盖 了所有屋面工程的专项技术标准。'
