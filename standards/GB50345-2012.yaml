  - 采用搭接式或编织式铺贴时，沥青瓦及其配套的防水层或防水垫
  - 层铺过天沟，因此只需在天沟内增设1000mm 宽的附加层。敞
  - 开式铺设时，天沟部位除了铺设1000mm 宽附加层及防水层或
  - 防水垫层外，应在上部再铺设厚度不小于O.45mm 的防锈金属
  - 板材，并与沥青瓦顺流水方向搭接，保证天沟防水的可靠性。
  - 处理。
  - 压顶的防水处理不当，雨水会从压顶进入女儿墙的裂缝，
  - JI顶 缝从防水层背后渗入室内，故对压顶的防水做法作出具体规定。
  - 低女儿墙的卷材防水层收头宜直接铺压在压顶下，用压条钉
  - 压固定并用密封材料封闭严密。高女儿墙的卷材防水层收头可在
  - 离屋面高度250mm 处，采用金属压条钉压固定，钉距不宜大于
  - 800mm ，再用密封材料封严，以保证收头的可靠性;为防止雨
  - 水沿高女儿墙的泛水渗人，卷材收头上部应做金属盖板保护。
  - 根据多年实践证实，防水涂料与水泥砂浆抹灰层具有良好的
  - 粘结性，所以在女儿墙部位，防水涂料一直涂刷至女儿墙或山墙
  - 的压顶下，压顶也应作防水处理，避免女儿墙及其压顶开裂而造
  - 成渗漏。
  - 瓦屋面及金属板屋面与突出屋面结构的交接处应作泛
  - 水处理。
  - 烧结瓦、混凝土瓦屋面的泛水是最易渗漏的部位，聚合物水
  - 泥砂浆具有一定的韧性，用于泛水处理可以防止开裂引起的泛水
  - 渗漏。
  - 沥青瓦屋面的泛水部位可增设附加层进行增强处理，收头参
  - 照女儿墙的做法。
  - 金属板屋面山墙泛水采用铺钉金属泛水板的形式，金属泛水
  - 板之间应顺流水方向搭接;金属泛水板的作用效果和可靠性，取
  - 决于泛水板与墙体的搭接宽度和收头做法、泛水板与金属屋面板
  - 搭盖宽度和连接做法，本条均作了具体规定。
  - 制品和塑料制品两种，其排水设计、施工都有成熟的经验和
  - 技术。
  - 水落口应牢固固定在承重结构上，否则水落口产生的松动会
  - 使水落口与棍凝土交接处的防水设防破坏，产生渗漏现象。
  - 水落口高出天沟及屋面最低处的现象一直较为普遍，究其原
  - 因是在埋设水落口或设计规定标高时，未考虑增加的附加层和排
  - 水坡度加大的尺寸。因此规定水落口杯必须设在沟底最低处，水
  - 落口埋设标高应根据附加层的厚度及排水坡度加大的尺寸确定。 对于水落口处的防水构造，采取多道设防、柔性密封、防排
  - 结合的原则处理。在水落口周围500mm 的排水坡度应不小于
  - 5% ，坡度过小，施工困难且不易找准;采取防水涂料涂封，涂
  - 层厚度为2mm ，相当于屋面涂层的平均厚度，使它具有一定的
  - 防水能力，防水层和附加层伸人水落口杯内不应小于50mm ，避
  - 免水落口处的渗漏发生。
  - 虹吸式排水方式是近年新出现的排水方式，具有排水
  - 速度快、汇水面积大的特点。水落口部位的防水构造和部件都有
  - 相应的系统要求，因此设计时应根据相关的要求进行专项设计。
  - 变形缝的防水构造应能保证防水设防具有足够的适应
  - 变形而不破坏的能力。变形缝的泛水墙高度规定是为了防止雨水
  - 漫过泛水墙，泛水墙的阴角部位应按照泛水做法要求设置附加
  - 层。防水层的收头应铺设或涂刷至泛水墙的顶部。
  - 变形缝中应预填不燃保温材料作为卷材的承托，在其上覆盖
  - 一层卷材并向缝中凹伸，上放圆形的衬垫材料，再铺设上层的合
  - 成高分子卷材附加层，使其形成。形覆盖。
  - 等高的变形缝顶部加盖钢筋混凝土或金属盖板加以保护。高
  - 低跨变形缝的附加层和防水层在高跨墙上的收头应固定牢固、密
  - 封严密;再在上部用固定牢固的金属盖板保护。
  - 为确保屋面工程质量，对伸出屋面的管道应做好防水
  - 处理，规定管道周围的找平层应抹出不小于30mm 的排水坡，
  - 并设附加层做增强处理;防水层应铺贴或涂刷至管道上，收头部
  - 位距屋面不宜小于250mm;
  - 卷材收头应用金属箍或铁丝紧固，
  - 密封材料封严。充分体现多道设防和柔性密封的原则。
  - 气道也常做成与烟囱相似的形式，由于有突出屋面结构的存在，
  - 其阴角处容易产生裂缝，防水施工也相对困难，因此在泛水部位
  - 应增设附加层，防水层收头采用金属压条钉压固定。另外为避免
  - 烟囱迎水面产生积水现象，应在迎水面中部抹出分水线，向两侧
  - 抹出一定的排水坡度，使雨水从两侧排走。 4.11.21
  - 屋面垂直出人口应防止雨水从盖板下倒灌入室内，故
  - 规定泛水高度不得小于250mm ，泛水部位变形集中且难以设置
  - 保护层，故在防水层施工前应先做附加增强处理，附加层的厚度
  - 和尺寸应符合条文规定。防水层的收头于压顶圈下，使收头的防
  - 水设防可靠，不会产生翘边、开口等缺陷。
  - 与垂直出入口基本相同。防水层应铺设至门洞踏步板下，收头处
  - 用密封材料封严，再用水泥砂浆保护。
  - 反梁在现代建筑中越来越多，按照排水设计的要求，
  - 大部分反梁中需设置过水孔，使雨水能流向水落口及时排走。反
  - 梁过水孔的孔底标高应与两侧的檐沟底面标高一致，由于檐沟有
  - 坡度要求，因此每个过水孔的孔底标高都是不同的，施工时应预
  - 先根据结构标高、保温层厚度、找坡层厚度等计算出每个过水孔
  - 的孔底标高，再进行过水孔管的安设。
  - 结构设计一般不允许在反梁上开设过大的孔洞，因此过水孔
  - 宜采用预埋管道的方式，为保证过水孔排水顺畅，规定了过水孔
  - 的最小尺寸。由于预埋管道与周边混凝士的线膨胀系数不同，温
  - 度变化时管道两端周围与1昆凝土接触处易产生裂缝，故管道口四
  - 周应预留凹槽用密封材料封严。
  - 由于大型建筑和高层建筑日益增多，在屋面上经常设
  - 置天线塔架、擦窗机支架、太阳能热水器底座等，这些设施有的
  - 搁置在防水层上，有的与屋面结构相连。若与结构相连时，防水
  - 层应包裹基座部分，设施基座的预埋地脚螺栓周围必须做密封处
  - 理，防止地脚螺栓周围发生渗漏。
  - 搁置在防水层上的设备，有一定的质量和振动，对防
  - 水层易造成破损，因此应按常规做卷材附加层，有些质量重、支
  - 腿面积小的设备，应该做细石i昆凝土垫块或衬垫，以免压坏防
  - 水层。
  - 烧结瓦或混凝土瓦屋面的脊瓦与坡面瓦之间的缝隙，
  - 一般采用聚合物水泥砂浆填实抹平，脊瓦下端距坡面瓦的高度不 宜超过80mm ，一是考虑施工操作，二是防止砂浆干缩开裂导致
  - 雨水流人而造成渗漏，并根据烧结瓦和1昆凝土瓦的特性，规定了
  - 脊瓦与坡面瓦的搭盖宽度。
  - 搭盖宽度，防止搭盖宽度过小，脊瓦易被风掀起。
  - 板下凹;板材端头应设置堵头板，防止施工过程中或渗漏时雨水
  - 流人金属板材内部。
  - 窗框固定铁脚、窗口防水卷材、支瓦条等配件，可由屋顶窗的生
  - 产厂家配套供应，并按照设计要求施工。
  - 沥青瓦屋面，屋顶窗的窗料及金属排水板、窗框固定
  - 铁脚、窗口防水卷材等配件，可由屋顶窗的生产厂家配套供应，
  - 并按照设计要求施工。 5
  - 屋面工程施工
  - '5.1'
  - 一般规定
  - 防水工程施工实际上是对防水材料的一次再加工，必须
  - 由防水专业队伍进行施工，才能保证防水工程的质量。防水专业
  - 队伍应由经过理论与实际施工操作培训，并经考试合格的人员组
  - 成。本条所指的防水专业队伍，应由当地建设行政主管部门对防
  - 水施工企业的规模、技术水平、业绩等综合考核后颁发证书，作
  - 业人员应由有关主管部门发给上岗证。
  - 实现防水施工专业化，有利于加强管理和落实责任制，有利
  - 于推行防水工程质量保证期制度，这是提高屋面防水工程质量的
  - 关键。对非防水专业队伍或非防水工施工的，当地质量监督部门
  - 应责令其停止施工。
  - 格遵守的基本原则，所以在屋面工程施工前，施工单位应组织相
  - 关人员认真熟悉设计图纸，掌握屋面工程的构造层次、材料选
  - 用、技术要求及质量要求等。在设计单位参与的条件下进行图纸
  - 会审，可以解决屋面工程在设计及施工中存在的问题，确保屋面
  - 工程的质量及施工的顺利进行。
  - 为了指导施工作业，确保屋面工程的质量，施工单位应根据
  - 设计图纸，结合施工的实际情况，编制有针对性的施工方案或技
  - 术措施。屋面工程施工方案的内容包括:工程概况、质量目标、
  - 施工组织与管理、防水保温材料及其使用、施工操作技术、安全
  - 注意事项等。
  - 屋面工程所采用的防水、保温材料，除有产品合格证书
  - 和性能检测报告等出厂质量证明文件外，还应有当地建设行政主
  - 管部门指定检测单位对该产品本年度抽样检验认证的试验报告， 其质量必须符合国家现行产品标准和设计要求。
  - 材料进入现场后，监理单位、施工单位应按规定进行抽样检
  - 验，检验应执行见证取样送检制度，并提出检验报告。抽样检验
  - 不合格的材料不得用在工程上。
  - 屋面工程是由若干构造层次组成的，如果下面的构造层
  - 质量不合格，而被上面的构造层覆盖，就会造成屋面工程的质量
  - 隐患。在屋面工程施工中，必须按各道工序分别进行检查验收，
  - 不能到工程全部做完后才进行一次性检查验收。每一道工序完成
  - 后，应经建设或监理单位检查验收，合格后方可进行下道工序的
  - 施工。
  - 对屋面工程的成品保护是一个非常重要的环节。屋面防水工
  - 程完工后，有时又要上人进行其他作业，如安装天线、水箱、堆
  - 放杂物等，会造成防水层局部破坏而出现渗漏。本条规定当下道
  - 工序或相邻工程施工时，应对已完成的部分采取保护措施。
  - 公安部、住房和城乡建设部于2009 年9 月
  - 25 日发布了
  - 《民用建筑外保温系统及外墙装饰防火暂行规定)) ，提出了屋面工
  - 程施工及使用中的防火规定。在屋面工程中使用的防水、保温材
  - 料很多是属于可燃材料，如改'性沥青防水卷材、合成高分子防水
  - 卷材、改性沥青防水涂料、合成高分子防水涂料以及有机保温材
  - 料等。所以施工单位在进行屋面工程施工时，对这些易燃的防
  - 水、保温材料的运输‘保管应远离火源，露天存放时应用不燃材
  - 料完全覆盖，以防引发火灾。在施工作业时，强调在可燃保温材
  - 料上不得采用热熔法、热粘法等施工工艺进行施工，以防引燃保
  - 温材料而酿成火灾。同时要求屋面工程施工时要加强火源、热源
  - 等火灾危险源的管理，并在屋面工程施工作业区配置足够的消防
  - 灭火器材，以防一旦着火，能够将火及时扑灭，不致酿成火灾。
