  text: '框支承玻璃采光顶的安装施工应符合下列规定: 1 应根据采光顶分格测量，确定采光顶各分格点的空间 定位; 2 支承结构应按顺序安装，采光顶框架组件安装就位、调 整后应及时紧固;不同金属材料的接触面应采用隔离材料; 3 采光顶的周边封堵收口、屋脊处压边收口、支座处封口 处理，均应铺设平整且可靠固定; 4 采光顶天沟、排水槽、通气槽及雨水排出口等细部构造 应符合设计要求; 5 装饰压板应顺流水方向设置，表面应平整，接缝应符合 设计要求。'
