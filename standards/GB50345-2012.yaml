  text: '采用基层处理剂时，其配制与施工应符合下列规定: 1 基层处理剂应与卷材相容; 2 基层处理剂应配比准确，并应搅拌均匀; 3 喷、涂基层处理刑前，应先对屋面细部进行涂刷; 4 基层处理剂可选用喷涂或涂刷施工工艺，喷、涂应均匀 一致，干燥后应及时进行卷材施工。'
