  - '1'
  - 外露使用的防水层，应选用耐紫外线、耐老化、耐候性
  - 好的防水材料F
  - '2'
  - 上人屋面，应选用耐霉变、拉伸强度高的防水材料;
  - '3'
  - 长期处于潮湿环境的屋面，应选用耐腐蚀、耐霉变、耐
  - 穿刺、耐长期水浸等'性能的防水材料;
  - '4'
  - 薄壳、装配式结构、钢结构及大跨度建筑屋面，应选用
  - 耐候性好、适应变形能力强的防水材料;
  - '5'
