  text: 屋面工程是建筑围护结构的重要部分，主要功能是防水 和保温。尽管屋面结构基层符合现行国家标准《建筑设计防火规 范)) GB 50016 中的有关建筑构件燃烧性能和耐火极限的规定， 但是屋面基层上大多是采用易燃或阻燃的防水和保温材料，会在 房屋建造和使用过程中可能造成火灾的蔓延。公安部与住房和城 乡建设部2009 年9 月下发了《关于印发〈民用建筑外保温系统 及外墙装饰防火暂行规定〉的通知)) ，通知中对屋顶保温材料的 燃烧性能等作了相应规定。据了解，现行国家标准《建筑材料及 制品燃烧性能分级)) GB 8624 、《建筑设计防火规范)) GB 50016 及《高层民用建筑设计防火规范)) GB 50045 目前正在修订中， 故本条只作原则性规定。
