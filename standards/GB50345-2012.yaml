  text: '卷材、涂料、密封材料在各种不同类型的屋面、不同的 工作条件、不同的使用环境中，由于气候温差的变化、阳光紫外 线的辐射、酸雨的侵蚀、结构的变形、人为的破坏等，都会给防 水材料带来一定程度的危害，所以本条规定在进行屋面工程设计 时，应根据建筑物的建筑造型、使用功能、环境条件选择与其相 适应的防水材料，以确保屋面防水工程的质量。 本规范附录A 是有关屋面工程用防水、保温材料标准， 这些标准都是现行的国家标准和行业标准。本规范附录B 是屋 面工程用防水、保温材料的主要性能指标，应该说明的是这些性 能指标不一定就是国家和行业产品标准的全部技术要求，而是屋 面工程对该种材料的技术要求，只要满足这些技术要求，才可以 在屋面工程中使用。 4.2 排水设计 "防排结合"是屋面工程设计的一条基本原则。屋面雨 水能迅速排走，减轻了屋面防水层的负担，减少了屋面渗漏的 机会。 排水系统的设计，应根据屋顶形式、气候条件、使用功能等 因素确定。对于排水方式的选择，一般屋面汇水面积较小，且檐 口距地面较近，屋面雨水的落差较小的低层建筑可采用元组织排 水。对于屋面汇水面积较大的多跨建筑或高层建筑，因檐口距地 面较高，屋面雨水的落差大，当刮大风下大雨时，易使从檐口落 下的雨水浸湿到墙面上，故应采用有组织排水。 屋面排水方式可分为有组织排水和无组织排水。有组织 排水就是屋面雨水有组织的流经天沟、檐沟、水落口、水落管 等，系统地将屋面上的雨水排出。在有组织排水中又可分为内排 水和外排水或内外排水相结合的方式，内排水是指屋面雨水通过 天沟由设置于建筑物内部的水落管排人地下雨水管网，如高层建 筑、多跨及汇水面积较大的屋面等。外排水是指屋面雨水通过檐 沟、水落口由设置于建筑物外部的水落管直接排到室外地面上， 如一般的多层住宅、中高层住宅等采用。元组织排水就是屋面雨 水通过檐口直接排到室外地面，如一般的低层住宅建筑等。一般 中、小型的低层建筑物或檐高不大于10m 的屋面可采用元组织 排水，其他情况下都应采取有组织排水。 在有条件的情况下，提倡收集雨水再利用或直接对雨水进行 利用。特别对于水资源缺乏的地区，充分利用雨水进行灌溉等， 有利于节能减排，变废为宝，节约资源。 由于高层建筑外排水系统的安装维护比较困难，因此设 计内排水系统为宜。多跨厂房因相邻两坡屋面相交，故只能用天 沟内排水的方式排出屋面雨水。在进行天沟设计时，尽可能采用 天沟外排水的方式，将屋面雨水由天沟两端排出室外。如果天沟 的长度较长，为满足沟底纵向坡度及沟底水落差的要求，一般沟 底分水线距水落口的距离超过20m 时，可采用除两端外排水口 外，在天沟中间增设水落口和内排水管。排水口的设置同时也确 定了找坡分区的划分，当屋面找坡较长时，可以增设排水口，以 减小找坡长度。 筑给水排水设计规范ìì GB 50015 的有关规定。首先应根据屋面 形式及使用功能要求，确定屋面的排水方式及排水坡度，明确是 采用有组织排水还是无组织排水。如采用有组织排水设计时，要 根据所在地区的气候条件、雨水流量、暴雨强度、降雨历时及排 水分区，确定屋面排水走向。通过计算确定屋面檐沟、天沟所需 要的宽度和深度。根据屋面汇水面积和当地降雨历时，按照水落 管的不同管径核定每根水管的屋面汇水面积以及所需水落管的数 量，并根据檐沟、天沟的位置及屋面形状布置水落口及水落管。 屋面形式、屋面面积、屋面高低层的设置等情况，将屋面划分成 若干个排水区域，根据排水区域确定屋面排水线路，排水线路的 设置应在确保屋面排水通畅的前提下，做到长度合理。 当采用重力式排水时，每个水落口的汇水面积宜为 150m2 ~200m2 ，在具体设计时还要结合地区的暴雨强度及当地 的有关规定、常规做法来进行调整。屋面每个汇水面积内，雨水 排水立管不宜少于2 根，是避免一根排水立管发生故障，屋面排 水系统不会瘫痪。 上后，会对低跨屋面造成冲刷，天长日久就会使低跨屋面的防水 层破坏，所以在低跨屋面上受高跨屋面排下的雨水直接冲刷的部 位，应采取加铺卷材或在水落管下加设水簸宾等措施，对低跨屋 面进行保护。 目前在屋面工程中大部分采用重力流排水，但是随着建 筑技术的不断发展，一些超大型建筑不断涌现，常规的重力流排 水方式就很难满足屋面排水的要求，为了解决这一问题，本规范 修订时提出了推广使用虹吸式屋面雨水排水系统的必要性。虹吸 排水的原理是利用建筑屋面的高度和雨水所具有的势能，产生虹 吸现象，通过雨水管道变径，在该管道处形成负压，屋面雨水在 管道内负压的抽吸作用下，以较高的流速迅速排出屋面雨水。 相对于普通重力流排水，虹吸式雨水排水系统的排水管道均 按满流有压状态设计，悬吊横管可以无坡度铺设。由于产生虹吸 作用时，管道内水流流速很高，相对于同管径的重力流排水量 大，故可减少排水立管的数量，同时可减小屋面的雨水负荷，最 大限度地满足建筑使用功能要求。 虹吸式屋面雨水排水系统，目前在我国逐渐被采用，如东莞 国际会展中心、上海科技馆、浦东国际机场、北京世贸商城等一 批大型项目相继建成技人使用后，系统运行良好。为了在我国推 广应用这一技术，中国工程建设标准化协会制定了《虹吸式屋面 雨水排水系统技术规程)) CECS183 : 2005 。故本条规定暴雨强 度较大地区的工业厂房、库房、公共建筑等大型屋面，宜采用虹 吸式屋面雨水排水系统。 由于虹吸排水系统的设计有一定的技术要求，排水口、排水 管等构件如果不按要求设计，将起不到虹吸作用，所以虹吸式屋 面雨水排水系统应按专项技术规程进行设计。 落口堵塞或冻裂，而在化冻时水落口的冰尚未完全解冻，造成屋 面的溶水无法排出。故本条规定严寒地区应采用内排水，寒冷地 区宜采用内排水，以避免水落管受冻。有条件时，外排水系统应 对水落管和水落口采取防冻措施，以便屋面上化冻后的冰雪榕水 能顺利排出。 西、陕西、甘肃等地区。这种湿陷性黄土在上覆土的自重压力或 上覆土的自重压力与附加压力共同作用下，受水浸湿后，土体结 构逐渐被破坏，土颗粒向大孔中移动，从而导致地基湿陷，引起 上部建筑的不均匀下沉，使墙体出现裂缝。所以本条规定在湿陷 性黄土地区的建筑屋面宜采用有组织排水系统，将屋面雨水直接 排至排水管网或排至不影响建筑物地基的区域，避免屋面雨水直 接排到室外地面上，沿地面渗入地下而造成地基不均匀下沉，导 致建筑物破坏。 根据多年实践经验，檐沟、天沟宽度太窄不仅不利于防 水层施工，而且也不利于排水，所以本条规定其净宽度不应小于 300mm。檐沟、天沟的深度按沟底的分水线深度来控制，本条 规定分水线处的最小深度不应小于100mm ，如过小，则当沟中 水满时，雨水易由天沟边溢出，导致屋面渗漏。 在本条中还规定了檐沟、天沟沟底的纵向坡度不应小于 1% ，这是因为如果沟底坡度过小，在施工中很难做到沟底平直 顺坡，常常会因沟底凸凹不平或倒坡，造成檐沟、天沟中排水不 畅或积水。沟内如果长期积水，沟内的卷材或涂膜防水层易发生 霉烂，造成渗漏。 沟底的水落差就是天沟内的分水线到水落口的高差，本条文 规定沟底水落差不应大于200mm ，这是因为沟底排水坡度为 1% ，排水线路长20m 时，水落差就是200mm 。 而金属檐沟、天沟的坡度是由结构找坡的，考虑制作和安装方面 的因素，规定金属檐沟、天沟的纵向坡度宜为0.5% 。在雨水丰 富降雨量较大的地区，金属檐沟、天沟要有足够的盛水量及排水 能力，以免雨量较大时雨水溢出。 采用经过防锈处理的金属成品或塑料成品，这样不仅施工方便， 而且有利于保证工程质量。 4.3 找坡层和找平层设计 工业厂房和公共建筑只要对顶棚水平度要求不高或建筑功能允 许，应首先选择结构找坡，既节省材料、降低成本，又减轻了屋 面荷载，因此，本条规定混凝土结构屋面宜采用结构找坡，坡度 不应小于3% 。 当用材料找坡时，为了减轻屋面荷载和施工方便，可采用质 量轻和吸水率低的材料。找坡材料的吸水率宜小于20% ，过大 的吸水率不利于保温及防水。找坡层应具有一定的承载力，保证 在施工及使用荷载的作用下不产生过大变形。找坡层的坡度过大 势必会增加荷载和造价，因此本条规定材料找坡坡度宜为2% 。 平整的基层，找平层应具有一定的厚度和强度。如果整体现浇混 凝土板做到随挠随用原浆找平和压光，表面平整度符合要求时， 可以不再做找平层。采用水泥砂浆还是细石混凝土作找平层，主 要根据基层的刚度。根据调研结果，在装配式混凝土板或板状材 料保温层上设水泥砂浆找平层时，找平层易发生开裂现象，故本 规范修订时规定装配式混凝土板上应采用细石混凝土找平层。基 层刚度较差时，宜在混凝土内加钢筋网片。同时，还规定板状材 料保温层上应采用细石混凝土找平层。 由于找平层的自身干缩和温度变化，保温层上的找平层 容易变形和开裂，直接影响卷材或涂膜的施工质量，故本条规定 保温层上的找平层应留设分格缝，使裂缝集中到分格缝中，减少 找平层大面积开裂。分格缝的缝宽宜为5mm ，......，20mm ，当采用后 切割时可小些，采用预留时可适当大些，缝内可以不嵌填密封材 料。由于结构层上设置的找平层与结构同步变形，故找平层可以 不设分格缝。 4.4 保温层和隔热层设计 保温性能和使用要求。本次规范修订时，增加了矿物纤维制品和 泡沫混凝土等内容，目的是考虑屋面防火安全，着重推广无机保 温材料供设计人员选择。为此，本条按其材料把保温层分为三 类，即板状材料保温层、纤维材料保温层和整体材料保温层。 纤维材料是指玻璃棉制品和岩棉、矿渣棉制品，具有质量 轻、导热系数小、不燃、防蛙、耐腐蚀、化学稳定性好等特点， 做成毡状或板状的制品，是较好的绝热材料和不燃材料。 泡沫混凝土是用机械方法将发泡剂水溶液制备成泡沫，再将 泡沫加入水泥、集料、掺合料、外加剂和水等组成的料浆中，经 1昆合搅拌、浇筑成型、蒸汽养护或自然养护而成的轻质多孔保温 材料。泡沫混凝土制品的密度为300kg/m3~500kg/m3
    时，抗压 强度为 O. 3MPa~0. 5MPa ，导热系数为0.095W/(m. K)~ O. 010W /(m • K) 。因为泡沫混凝土的原料广泛、生产方便、价 格便宜，常用砌块或现场浇筑的方法，在建筑工程中得到广泛 应用。 1 元机保温材料按其构造分为纤维材料、粒状材料和多孔 材料，如矿物纤维制品、膨胀珍珠岩制品、泡沫玻璃制品、加气 说凝土、泡沫1昆凝土等。有机保温材料主要有泡沫塑料制品，如 聚苯乙烯泡沫塑料、硬质聚氨醋泡沫塑料等。屋面结构的总热阻 应为各层材料热阻及内、外表面换热阻的总和，其中保温材料的 热阻尤为重要。根据国家对节约能源政策的不断提升，目前民用 建筑节能标准己提高到50% 或65% ，为了使屋面结构传热系数 满足本地区建筑节能设计标准规定的限值，保温层宜选用吸水率 低、密度和导热系数小，并有一定强度的保温材料，其厚度应按 现行建筑节能设计标准计算确定。 2 由于保温材料大多数属于多孔结构，干燥时孔隙中的空 气导热系数较小，静态空气的导热系数A 为0.02 ，保温隔热性 较好。保温材料受潮后，其孔隙中存在水蒸气和水，而水的导热 系数A 为O. 5 比静态空气大20 倍左右，若材料孔隙中的水分受 冻成冰，冰的导热系数A 为2.0 相当于水的导热系数的4 倍，因 此保温材料的干湿程度与导热系数关系很大。由于每一个地区的 环境湿度不同，定出统一的含水率限值是不可能的，因此本条提 出了平衡含水率的问题。 在实际应用中的材料试件含水率，根据当地年平均相对湿度 所对应的相对含水率，可通过表5 计算确定。 表5 当地年平均相对湿度所对应的相对含水率 当地年均相对湿度 潮湿>75% 中等50%~75% 干燥<50% 相对含水率 w= 在 w1 = 旦二旦x 100% m w2 = 型L二!!!; x 100% m 式中: W1 一一试件的含水率 C%); W 2 试件的吸水率 C%) ; m1 试件在取样时的质量 (kg); 相对含水率 45% 40% 35% m2一一一试件在面干潮湿状态的质量 Ckg); m 试件的绝干质量 Ckg) 。 (1) 3 本次规范修订时，对板状保温材料的压缩强度作了规定， 如将挤塑聚苯板压缩强度规定为150kPa，在正常使用荷载情况 下可以满足上人屋面的要求。当屋面为停车场、运动场等情况 时，应由设计单位根据实际荷载验算后选用相应压缩强度的保温 材料。 4 矿物纤维制品在常见密度范围内，.其导热系数基本上不 随密度而变，而热阻却与其厚度成正比。考虑纤维材料在长期荷 载作用下的压缩蠕变，采取防止压缩的措施可以减少因厚度沉陷 而导致的热阻下降。 5 屋面坡度超过25%时，干铺保温层常发生下滑现象，故 应采取粘贴或铺钉措施，防止保温层变形和位移。 6 封闭式保温层是指完全被防水材料所封闭，不易蒸发或 吸收水分的保温层。吸湿性保温材料如加气混凝土和膨胀珍珠岩 制品，不宜用于封闭式保温层。保温层干燥有困难是指吸湿保温 材料在雨期施工、材料受潮或泡水的情况下，未能采取有效措施 控制保温材料的含水率。由于保温层含水率过高，不但会降低其 保温性能，而且在水分汽化时会使卷材防水层产生鼓泡，导致局 部渗漏。因此，对于封闭式保温层或保温层干燥有困难的卷材屋 面而言，当保温材料在施工使用时的含水率大于正常施工环境的 平衡含水率时，采取排汽构造是控制保温材料含水率的有效措 施。当卷材屋面保温层干燥有困难时，铺贴卷材宜采用空铺法、 点粘法、条粘法。 温度较低的部位。屋面热桥部位主要在屋顶与外墙的交接处，通 常称为结构性热桥。屋面热桥部位应采取保温处理，使该部位内 表面温度不低于室内空气的露点温度。 1 按照现行国家标准《民用建筑热工设计规范)) GB 50176 中有关围护结构内部冷凝受潮验算的规定，屋顶冷凝计算界面的 位置，应取保温层与外侧密实材料层的交界处。当围护结构材料 层的蒸汽渗透阻小于保温材料因冷凝受潮所需的蒸汽渗透阻时， 应设置隔汽层。外侧有卷材或涂膜防水层，内侧为钢筋混凝土屋 面板的屋顶结构，如经内部冷凝受潮验算不需要设隔汽层时，则 应确保屋面板及其接缝的密实性，达到所需的蒸汽渗透阻。 2 隔汽层是一道很弱的防水层，却具有较好的蒸汽渗透阻， 大多采用气密性、水密性好的防水卷材或涂料。隔汽层是隔绝室 内湿气通过结构层进人保温层的构造层，常年湿度很大的房间， 如温水游泳池、公共浴室、厨房操作间、开水房等的屋面应设置 隔汽层。 3 隔汽层做法同防水层，隔汽层应沿周边墙面向上连续铺 设，高出保温层上表面不得小于150mm ，隔汽层收边不需要与 保温层上的防水层连接，理由 1 :隔汽层不是防水层，与防水设 防无关联;理由 2. 隔汽层施工在前，保温层和防水层施工在 后，几道工序无法做到同步，防水层与墙面交接处的泛水处理与 隔汽层无关联。 屋面排汽构造设计是对封闭式保温层或保温层干燥有困 难的卷材屋面采取的技术措施。为了做到排汽道及排汽孔与大气 连通，使水汽有排走的出路，同时力求构造简单合理，便于施 工，并防止雨水进人保温层，本条对排汽道及排汽孔的设置作出 了具体的规定。 1 倒置式屋面的坡度宜为3% ，主要考虑到坡度太大会造 成保温材料下滑，太小不利于屋面的排水。 2 倒置式屋面保温材料容易受雨水浸泡，使导热系数增大， 保温性能下降，且易遭水侵蚀破坏，故应选用吸水率低，且长期 漫水不变质的保温材料，如挤塑聚苯乙烯泡沫塑料、硬质聚氨醋 泡沫塑料和喷涂硬泡聚氨醋等。 3 保温层很轻，若不加保护和埋压，容易被大风吹起，或 是被屋面雨水浮起。由于有机保温材料长期暴露在外，受到紫外 线照射及臭氧、酸碱离子侵蚀会过早老化，以及人在上面踩踏而 破坏，因此保温层上面应设置块体材料或细石棍凝土保护层。喷 涂硬泡聚氨醋与浅色涂料保护层间应具相容性。 4 为了不造成板状保温材料下面长期积水，在保温层的下 部应设置排水通道和泄水孔。'
