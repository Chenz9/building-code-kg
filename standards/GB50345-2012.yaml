  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.4.7
  text: 屋面隔热是指在炎热地区防止夏季室外热量通过屋面传 人室内的措施。在我国南方一些省份，夏季时间较长、气温较 高，随着人们生活的不断改善，对住房的隔热要求也逐渐提高， 采取了种植、架空、蓄水等屋面隔热措施。屋面隔热层设计应根 据地域、气候、屋面形式、建筑环境、使用功能等条件，经技术 经济比较确定。这是因为同样类型的建筑在不同地区采用隔热方 式也有很大区别，不能随意套用标准图或其他做法。从发展趋势 看，由于绿色环保及美化环境的要求，采用种植隔热方式将胜于 架空隔热和蓄水隔热。 1 降雨量很少的地区，夏季植物生长依赖人工浇灌，冬季 草木植物枯死，故停止浇水灌溉。由T降雨量少，人工浇灌的水 也不太多，种植土中的多余水甚少，不会造成植物烂根，所以不 必另设排水层。 南方温暖，夏季多雨，冬季不结冰，种植土中含水四季不 减。特别大雨之后，积水很多必须排出，以防止烂根，所以在种 植土下应设排水层。 冬季寒冷但夏季多雨的地区，下雨时有积聚如泽的现象，排 除明水不如用排水层作暗排好，所以在种植土下应设排水层。冬 季严寒，虽无雨但存雪，种植土含水量仍旧大，冻结之后降低保 温能力，所以在防水层下应加设保温层。 2 不同地区由于气候条件的不同，所选择的种植植物不同， 种植士的厚度也就不同，如乔木根深，地被植物根浅，故本条规 定所用材料及植物等应与当地气候条件相适应，并应符合环境保 护要求。 3 根据调研结果，种植屋面整体布置不便于管理，为便于 管理和设计排灌系统，种植植物的种类也宜分区。本次修订时， 将原规范中的整体布置取消，改为宜分区布置。 4 排水层的材料的品种较多，为了减轻屋面荷载，应尽量 选择塑料、橡胶类凹凸型排水板或网状交织排水板。如年降水量 小于蒸发量的地区，宜选用蓄水功能好的排水板。若采用陶粒作 排水层时，陶粒的粒径不应小于25mm ，堆积密度不宜大于 500kg/时，铺设厚度宜为lOOmm~150mm 。 过滤层是为防止种植土进人排水层造成流失。过滤屏太薄容 易损坏，不能阻止种植士流失;过滤层太厚，渗水缓慢，不易排 水。过滤层的单位面积质量宜为200g/m2 ~400g/m2 。 5 挡墙泄水孔是为了排地种植土中过多的水分，世水孔被 堵塞，造成种植土内积水，不但影响植物的生长，而且给防水层 的正常使用带来不利。 6 种植隔热层的荷载主要是种植土，虽厚度深有利植物生 长，但为了减轻屋面荷载，需要尽量选择综合性能良好的材料， 如田园土比较经济;改良土由于掺加了珍珠岩、蛙石等轻质材 料，其密度约为田园土的1/2 。 7 坡度大于20% 的屋面，排水层、种植土等易出现下滑， 为防止发生安全事故，应采取防滑措施，也可做成梯田式，利用 排水层和覆土层找坡。屋面坡度大于50% 时，防滑难度大，故 不宜采用种植隔热层。 1 我国广东、广西、湖南、湖北、四川等省属夏热冬暖地 区，为解决炎热季节室内温度过高的问题，多采用架空隔热层措 施;架空隔热层是利用架空层内空气的流动，减少太阳辐射热向 室内传递，故宜在屋顶通风良好的建筑物上采用。由于城市建筑 密度不断加大，不少城市高层建筑林立，造成风力减弱、空气对 流较差，严重影响架空隔热层的隔热效果。 2 根据国内采用混凝土支墩、砌块支墩与混凝土板组合、 金属支架与金属板组合等的实际情况，有关架空隔热制品及其支 座的质量，应符合有关材料标准的要求。 3 架空隔热层的高度，应根据屋面宽度或坡度大小的变化 确定。屋面较宽时，风道中阻力增加，宜采用较高的架空层，或 在中部设置通风口，以利于空气流通;屋面坡度较小时，进风口 和出风口之间的压差相对较小，为便于风道中空气流通，宜采用 较高的架空层，反之可采用较低的架空层。
