- id: GB 50345-2012#4.4.8
  standard_code: GB 50345-2012
  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.4.8
  text: '种植隔热层的设计应符合下列规定: 1 种植隔热层的构造层次应包括植被层、种植土层、过滤 层和排水层等; 2 种植隔热层所用材料及植物等应与当地气候条件相适应， 并应符合环境保护要求; 3 种植隔热层宜根据植物种类及环境布局的需要进行分区 布置，分区布置应设挡墙或挡板; 4 排水层材料应根据屋面功能及环境、经济条件等进行选 择F 过滤层宜采用200g/m2 ,..__ 400g/ m2 的土工布，过滤层应沿种 植土周边向上铺设至种植土高度; 5 种植土四周应设挡墙，挡墙下部应设泄水孔，并应与排 水出口连通; 6 种植土应根据种植植物的要求选择综合d性能良好的材料; 种植土厚度应根据不同种植士和植物种类等确定; 7 种植隔热层的屋面坡度大于20%时，其排水层、种植土 应采取防滑措施。'
  is_mandatory_clause: false
