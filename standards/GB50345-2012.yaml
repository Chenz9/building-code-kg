  - 成保温材料下滑，太小不利于屋面的排水。
  - '2'
  - 倒置式屋面保温材料容易受雨水浸泡，使导热系数增大，
  - 保温性能下降，且易遭水侵蚀破坏，故应选用吸水率低，且长期
  - 漫水不变质的保温材料，如挤塑聚苯乙烯泡沫塑料、硬质聚氨醋
  - 泡沫塑料和喷涂硬泡聚氨醋等。
  - '3'
  - 保温层很轻，若不加保护和埋压，容易被大风吹起，或
  - 是被屋面雨水浮起。由于有机保温材料长期暴露在外，受到紫外
  - 线照射及臭氧、酸碱离子侵蚀会过早老化，以及人在上面踩踏而
  - 破坏，因此保温层上面应设置块体材料或细石棍凝土保护层。喷
  - 涂硬泡聚氨醋与浅色涂料保护层间应具相容性。
  - '4'
  - 为了不造成板状保温材料下面长期积水，在保温层的下
  - 部应设置排水通道和泄水孔。
