  - 细部构造设计
  - 屋面的檐口、檐沟和天沟、女儿墙和山墙、水落口、变
  - 形缝、伸出屋面管道、屋面出人口、反梁过水孔、设施基座、屋
  - 脊、屋顶窗等部位，是屋面工程中最容易出现渗漏的薄弱环节。
  - 据调查表明，屋面渗漏中70%是由于细部构造的防水处理不当
  - 引起的，说明细部构造设防较难，是屋面工程设计的重点。
  - 随着建筑的大型化和复杂化以及屋面功能的增加，除上述常
  - 见的细部构造外，在屋面工程中出现新的细部构造形式也是很正
  - 常的，因此本规范未规定的新的细部构造应根据其特征进行
  - 设计。
  - 本规范在有关细部构造中所示意的节点构造，仅为条文的辅
  - 助说明，不能作为设计节点的构造详图。
- id: GB 50345-2012#4.11.2
  standard_code: GB 50345-2012
  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.11.2
  text: 屋面的节点部位由于构造形状比较复杂，多种材料交 接，应力、变形比较集中，受雨水冲刷频繁，所以应局部增强， 使其与大面积防水层同步老化。增强处理可采用多道设防、复合 用材、连续密封、局部增强。细部构造设计是保证防水层整体质 量的关键，同时应满足使用功能、温差变形、施工环境条件和工 艺的可操作性等要求。 4.11.(3 参见本规范第4. 6. 3 条的条文说明。 屋面的节点部位往往形状比较复杂，设计时可采用不同 的保温材料与大面的保温层衔接，形成连续保温层，防止热桥的 出现。节点部位保温材料的选择，应充分考虑保温层设置的可能 性和施工的可行性。保证热桥部位的内表面温度不低于室内空气 的露点温度。 和深度太小，雨水会由于虹吸现象越过滴水槽，使滴水处理失 效，故规定滴水槽的最小尺寸。 键，空铺、点粘、条粘的卷材在檐口端部800mm 范围内应满 粘，卷材防水层收头压人找平层的凹槽内，用金属压条钉压牢固 并进行密封处理，钉距宜为500 mm~800mm ，防止卷材防水层 收头翘边或被风揭起。从防水层收头向外的檐口上端、外檐至檐 口下部，均应采用聚合物水泥砂浆铺抹，以提高檐口的防水能 力。由于檐口做法属于元组织排水，檐口雨水冲刷量大，为防止 雨水沿檐口下端流向外墙，檐口下端应同时做鹰嘴和滴水槽。 涂膜防水层与基层粘结较好，在檐口处涂膜防水层收头 可以采用涂料多遍涂刷，以提高防水层的耐雨水冲刷能力，防止 防水层收头翘边或被风揭起。檐口端部和滴水处理方式参见本规 范第4. 11. 6 条的条文说明。 瓦屋面下部的防水层或防水垫层可设在保温层 的上面或下面，并应做到檐口的端部。烧结瓦、混凝土瓦屋面的 瓦头，挑出檐口的长度宜为50mm~70mm ，主要是防止雨水流 淌到封檐板上;沥青瓦屋面的瓦头，挑出檐口的长度宜为 10mm~20mm ，应沿檐口铺设金属滴水板，并伸入沥青瓦下宽 度不应小于80mm ，主要是有利于排水。
