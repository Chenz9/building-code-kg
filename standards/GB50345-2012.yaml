- id: GB 50345-2012#5.4.5
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.4.5
  text: '卷材搭接缝应符合下列规定: 1 平行屋脊的搭接缝应顺流水方向，搭接缝宽度应符合本 规范第4.5.10 条的规定; 2 同一层相邻两幅卷材短边搭接缝错开不应小于500mm; 3 上下层卷材长边搭接缝应错开，且不应小于幅宽的1/3; 4 叠层铺贴的各层卷材，在天沟与屋面的交接处，应采用 叉接法搭接，搭接缝应错开;搭接缝宜留在屋面与天沟侧面，不 宜留在沟底。'
