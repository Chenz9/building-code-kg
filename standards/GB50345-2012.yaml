- id: GB 50345-2012#5.10.7
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.10.7
  text: '明框玻璃组件组装应符合下列规定: 1 玻璃与构件槽口的配合应符合设计要求和技术标准的 规定; 2 玻璃四周密封胶条的材质、型号应符合设计要求，镶嵌 应平整、密实，胶条的长度宜大于边框内槽口长度1. 5% ~ 2.0%. 胶条在转角处应斜面断开，并应用粘结剂粘结牢固; 3 组件中的导气孔及排水孔设置应符合设计要求，组装时 应保持孔道通畅; 4 明框玻璃组件应拼装严密，框缝密封应采用硅酣耐候密 封胶。'
  is_mandatory_clause: false
