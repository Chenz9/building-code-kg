    建筑热工设计规范)) GB 50176 的有关规定。通过有关围护结构 内表面以及内部温度的计算和围护结构内部冷凝受潮的验算，才 能真正解决防结露问题。 由于金属板屋面的泄水能力较好，原规范规定金属板材 屋面坡度宜大于或等于10% ，但在规范的执行中带来不少争议， 故本条对屋面坡度取值经综合考虑作了修订。当屋面金属板采用 紧固件连接时，屋面坡度不宜小于10% ，维持原规范的规定; 当屋面金属板采用咬口锁边连接时，屋面坡度不宜小子5% 。杜 绝了因传统采用螺栓固定而造成屋面渗漏。 金属板材的热胀冷缩，金属檐沟、天沟的长度不宜太长。如果板 材材质为不锈钢板，热胀系数为17.3X10- 6 j"C 。冬夏最大温差 为60 0C ，板长为30m ，则伸缩量为&= 30 X 103 X 60 X 17.3 X 10-6 = 31. 14mm。檐沟、天沟的纵向伸缩量控制在30mm 左右 是可行的，本条规定檐沟、天沟的伸缩缝间距不宜大于30m 。 按国家标准《建筑给水排水设计规范)) GB 50015 - 2003 中 第4. 9. 8 条的规定，建筑屋面雨水排水工程应设置溢流口、溢流 堪、溢流管系统等溢流设施。溢流排水不得危害建筑设施和行人 安全。由于金属板屋面清理不及时，内檐沟及内天沟落水口堵塞 引起的渗漏水比较普遍，而且屋面板与内檐沟及内天沟的细部构 造防水难度较大，本条规定内檐沟及内天沟应设置溢流口或溢流 系统，沟内宜按0.5%找坡。 金属板是将镀层钢板或铝合金板经辑压冷弯，沿板宽方向形成连 续波形截面的成型板，一方面大大提高屋面板的刚度，另一方面 波肋的存在允许屋面板在横向有一定的伸缩。由于在工厂轧制的 压型金属板受运输条件的限制，一般板长宜在12m 之内;在施 工现场轧制的压型金属板应根据吊装条件尽量采用较长尺寸的板 材，以减少板的纵向搭接，防止渗漏。 压型金属板采用紧固件连接时，由于板的纵向伸缩受到紧 固件的约束，使得屋面板的钉孔处和螺钉均存在温度应力，故 金属板的单坡长度不宜超过12m。压型金属板采用咬口锁边 时，由于固定支座仅限制屋面板在板宽方向和上下方向的移 动，屋面板沿板块长度方向可有一定的移动量，使得屋面板不 产生温度应力，这样金属板的单坡最小长度可以大大提高。根 据本规范第4.9.15 条第2 款的规定，由于金属板单坡长度过 大，板的伸缩量超过金属板铺装的有关尺寸，会影响檐沟及天 沟的使用，故本条提出金属板最大伸缩变形量不宜超过 100mm 的要求。有关压型金属板的单坡最大长度可参见本规 范第5.9.5 条的条文说明。 利影响，以及地基不均匀沉降或抗震设防要求，必须设置伸缩 缝、沉降缝、防震缝，统称变形缝。金属板屋面外围护结构， 应能适应主体结构的变形要求，本条规定金属板在主体结构的 变形缝处宜断开，不宜直接跨越主体结构变形缝，变形缝上部 应加扣带伸缩的金属盖板。 金属板屋面的细部构造设计比较复杂，不同供应商的金 属屋面板构造做法也不尽相同，很难统一标准，一般均应对细部 构造进行深化设计。金属板屋面细部构造，是指金属板变形大、 应力与变形集中、用材多样、施工条件苛刻、最易出现质量问题 和发生渗漏的部位，细部构造是保证金属板屋面整体质量的 关键。 体要求。 暗扣直立锁边屋面系统固定方式:首先将T 形铝质固定支 座固定在模条上，再将压型金属板扣在固定支座的梅花头上，最 后用电动锁边机将金属板材的搭接边咬合在一起。由于固定方法 先进，温度变形自由伸缩，抗风性能好，现场施工方便，保证屋 面防水功能，在国内许多大型公共建筑得到推广应用。 金属板屋面由于保温层设在金属板的下面，所以大面积金属 屋面板都存在严重的温度变形问题，如不合理释放这部分变形， 容易导致金属屋面板局部折屈、隆起和磨损，故本条规定单坡尺 寸过长或环境温差过大的建筑屋面，压型金属板宜采用滑动式支 座的360。咬口锁边连接。滑动式支座分为座顶或座体两部分， 座体开有一长圆孔，座顶卡在长圆孔内，沿长圆孔可以左右滑 动。长圆孔的长度可以根据金属板伸缩量的大小由中间向两端逐 渐加大。同时还需考虑在静荷载作用下，座顶和座体之间的相对 滑动必须克服相互间的摩擦力。 4.9. 日本条是对压型金属板采用紧固件连接的构造设计提出了 具体要求。对于压型金属板连接件主要选用自攻螺钉，连接件必 须带有较好的防水密封胶垫材料，以防止连接点渗漏。对于压型 金属板上下排板的搭接长度，应根据板型和屋面坡度确定;压型 金属板的纵向搭接和横向连接部位，均应设置通长防水密封胶 带，以防搭接缝渗漏。 聚氨醋、聚苯乙烯、岩棉、矿渣棉、玻璃棉芯材，通过粘结剂或 发泡复合而成的保温复合板材。本条对夹芯板采用紧固件连接的 构造作了具体的规定，为了减少屋面的接缝，防止渗漏和提高保 温性能，应尽量采用长尺寸的夹芯板。 金属板屋面的檐口、檐沟、天沟、屋脊以及金属泛水板 与女儿墙、山墙等交接处，均是屋面渗漏的薄弱部位，本条规定 了金属板铺装的最小尺寸要求。 固化、性能优异的硅酣密封胶，具有良好的粘结性、延伸性、水 密性、气密性，固化后形成耐用、高性能及其弹性和耐气候性 能。本条规定了压型金属板和金属面绝热夹芯板的自攻螺钉、拉 娜钉外露处，均应采用硅酣耐候密封胶密封。 硅酣耐候密封胶在使用前，应进行粘结材料的相容性和粘结 性试验，确认合格后才能使用。 当铝合金材料与除不锈钢以外的其他金属材料接触、紧 固时，容易产生电化学腐蚀，应在铝合金材料及其他金属材料之 间采用橡胶或聚四氟乙烯等隔离材料。 部的光线不足问题。透光屋面材料常用聚碳酸醋类板，其构造特 点及技术数据应参见专业厂家样本，板材性能应满足国家相关 规定。 聚碳酸醋类板包括实心板和中空板，适用于各种曲面造型的 要求。在实体工程中，若将采光板做成与配套使用的压型金属板 相同的板型，采光板与压型金属板的横向连接采用咬合或扣合的 方式，两板之间因空隙较小而形成毛细作用;同时由于采光板与 金属板的热胀系数差别很大，当接缝密封胶的位移不能满足接缝 位移量要求时，即在板缝部位很容易发生渗漏。大量工程实践也 证明，若采光顶与金属板采用平面交接，由于变形差异，防水细 部构造很难处理，故采光带必须高出屋面一定的距离，将两种不 同材料的建筑构造完全分开，并应在采光带的四周与金属板屋面 的交接处做好泛水处理。 本条对采光带设置宜高出金属板屋面250mm 的要求，符合 本规范第4.9.15 条有关泛水板与突出屋面墙体搭接高度不应小 于250mm 的规定。 于金属板屋面抗风揭能力的不足，对建筑的安全性能影响重大， 产生破坏造成的损失也非常严重，因此，无论国内和国外对建筑 的风荷载安全都很重视。 我国对建筑物的风荷载设计，主要是按现行国家标准《建筑 结构荷载规范)) GB 50009 的规定。由于现行规范对风荷载的设 计要求与国外相比偏低，并且更重要的是只有设计要求，没有相 关的标准测试方法对设计要求进行验证，元法确定建筑物的安全 性。为此，中国建筑材料科学研究院苏州防水研究院所属的国赛 建材工业建筑防水材料产品质量监督检验测试中心与国际上屋面 系统检测最权威的机构美国FM 认证公司合作，引进了FM 成熟 的屋面抗风揭测试技术，并于2010 年8 月建成了我国首个屋面 系统抗风揭实验室，开展金属板屋面系统的抗风揭检测业务。卖 验室通过了与FM 认证检测机构的对比试验，测试结果一致可 靠，能够有效评价通过设计的屋面系统所能达到的抗风揭能力， 保证建筑物的安全。通过该方法，能够检验屋面系统的设计、屋 面系统所用的表面材料、基层材料、保温材料、固定件以及整个 屋面系统的可靠性和可行性。 4.10 玻璃采光顶设计 玻璃采光顶是指由直接承受屋面荷载和作用的玻璃透光 面板与支承体系所组成的围护结构，与水平面的夹角小于75。的围 护结构和装饰性结构。玻璃采光顶作为建筑的外围护结构，其造 型是建筑设计的重要内容，设计者不仅要考虑建筑造型的新颖、 美观，还要考虑建筑的使用功能、造价、环境、能耗、施工条件 等诸多因素，需重点对结构类型、材料和细部构造方面进行设计。 玻璃采光顶的支承结构主要有钢结构、钢索杆结构、铝合金 结构等，采光顶的支承形式包括啊?架、网架、拱壳、圆穹等;玻 璃采光顶应按围护结构设计，主要承受自重以及直接作用于其上 的风雪荷载、地震作用、温度作用等，不分担主体结构承受的荷 载或地震作用。玻璃采光顶应具有足够的承载能力、刚度和稳定 性，能够适应主体结构的变形及承受可能出现的温度作用。同 时，玻璃采光顶的构造设计除应满足安全、实用、美观的要求 外，尚应便于制作、安装、维修保养和局部更换。 水密性能、热工性能、隔声性能和采光性能。性能要求的高低和 建筑物的功能性质、重要性等有关，不同的建筑在很多性能上是 有所不同的，玻璃采光顶的物理性能应根据建筑物的类别、高 度、体型、功能以及建筑物所在的地理位置、气候和环境条件进 行设计。如沿海或经常有台风的地区，要求玻璃采光顶的风压变 形性能和雨水渗漏性能高些;风沙较大地区，要求玻璃采光顶的 风压变形性能和空气渗透性能高些;寒冷地区和炎热地区，要求 采光顶的保温隔热性能良好。下面列出现行国家标准《建筑玻璃 采光顶>> ]G/T 231 中有关玻璃采光顶的承载性能、气密性能、 水密性能、热工性能、隔声性能、采光性能等分级指标，供设计 人员选用。 1 承载性能:玻璃采光顶承载性能分级指标S 应符合表7 的规定。 表7 承载性能分级 注: 1 9 级时需同时标注S 的实测值; 2 5 值为最不利组合荷载标准值3 3 分级指标值S 为绝对值。 2 气密性能:玻璃采光顶开启部分，采用压