  chapter: 4 屋面工程设计
  section: ''
  clause_no: 4.11.11
  text: '卷材或涂膜防水屋面檐沟(图4.11.11) 和天沟的防 水构造，应符合下列规定: 图4.1 1. 11 卷材、涂膜防水屋面檐沟 1←防水层; 2一附加层; 3一密封材料; 4 水泥钉; 5 金属压条; 6 保护层 1 檐沟和天沟的防水层下应增设附加层，附加层伸入屋面 的宽度不应小于250mm; 2 檐沟防水层和附加层应由沟底翻上至外侧顶部，卷材收 头应用金属压条钉压，并应用密封材料封严，涂膜收头应用防水 涂料多遍涂刷; 3 檐沟外侧下端应做鹰嘴或滴水槽; 4 檐沟外侧高于屋面结构板时，应设置溢水口。'
