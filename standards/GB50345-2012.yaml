- id: GB 50345-2012#5.10.8
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.10.8
  text: '隐框及半隐框玻璃组件组装应符合下列规定: 1 玻璃及框料粘结表面的尘埃、油渍和其他污物，应分别 使用带溶剂的擦布和干擦布清除干净，并应在清洁1h 内嵌填密 封胶; 2 所用的结构粘结材料应采用硅酣结构密封胶，其性能应 符合现行国家标准《建筑用硅酣结构密封胶ìì GB 16776 的有关 规定;硅酣结构密封胶应在有效期内使用; 3 硅酣结构密封胶应嵌填饱满，并应在温度15 0C ~30oC 、 相对湿度50% 以上、洁净的室内进行，不得在现场嵌填; 4 硅酣结构密封胶的粘结宽度和厚度应符合设计要求，胶 缝表面应平整光滑，不得出现气泡; 5 硅酣结构密封胶固化期间，组件不得长期处于单独受力 状态。'
  is_mandatory_clause: false
