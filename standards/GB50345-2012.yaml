  section: ''
  clause_no: 5.3.11
  text: '保温层的施工环境温度应符合下列规定: 1 干铺的保温材料可在负温度下施工; 2 用水泥砂浆粘贴的板状保温材料不宜低于5 0C; 3 喷涂硬泡聚氨醋宜为150C~350C ，空气相对湿度宜小于 85% ，风速不宜大于三级; 4 现浇泡沫混凝土宜为50C~350C 。 5.3.12 种植隔热层施工应符合下列规定: 1 种植隔热层挡墙或挡板施工时，留设的泄水孔位置应准 确，并不得堵塞; 2 凹凸型排水板宜采用搭接法施工，搭接宽度应根据产品 的规格具体确定;网状交织排水板宜采用对接法施工;采用陶粒 作排水层时，铺设应平整，厚度应均匀; 3 过滤层士工布铺设应平整、无皱折，搭接宽度不应小于 100mm ，搭接宜采用粘合或缝合处理;土工布应沿种植土周边 向上铺设至种植土高度; 4 种植土层的荷载应符合设计要求;种植士、植物等应在 屋面上均匀堆放，且不得损坏防水层。'
