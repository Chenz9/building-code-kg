  - 总则
  - 近年来，由于在屋面工程中新型防水保温材料、新型屋
  - 面形式及新的施工技术等方面均有较快的发展，同时一些屋面工
  - 程专项技术标准也将陆续出台，原规范已不能适应屋面工程技术
  - 发展的需要，故必须进行修订。
  - 在本条中明确了这次规范修订的目的，就是要在设计、施工
  - '方面提高我国屋面工程的技术水平，同时强调了以下四项要求:'
  - 1 保证屋面工程防水层和密封部位不渗漏，保温隔热功能
  - 满足设计要求;
  - '2'
  - 根据不同的建筑类型、重要程度、使用功能要求、屋面
  - 形式以及地区特点等，在确保屋面工程质量的基础上做到经济
  - 合理;
  - '3'
  - 在屋面工程的设计和施工中，应对屋面工程的防水、保
  - 温、隔热做到安全适用;
  - '4'
  - 根据环境保护和建筑节能政策，在设计选材、施工作业
  - 以及使用过程中均应符合环境保护和建筑节能的要求，防止对周
  - 围环境造成污染。
  - 1. O. 2
  - 在本条中明确了本规范的适用范围。屋面工程应遵循
  - '"材料是基础、设计是前提、施工是关键、管理是保证"的综合'
  - 治理原则，屋面工程设计与屋面工程施工的内容应从总体上涵盖
  - 了所有屋面工程的专项技术标准。
- id: GB 50345-2012#1.0.3
  standard_code: GB 50345-2012
  chapter: 1 总则
  section: ''
  clause_no: 1.0.3
  text: '环境保护和建筑节能是我国的一项重大技术政策，关系 到我国经济建设可持续发展的战略决策。屋面工程设计和施工应 从材料选择、施工方法等方面着手，考虑其对周围环境的影响程 度以及建筑节能效果，并应采取针对性措施。 本条中除保留原规范的内容外，还增加了在屋面工程设计和 施工中有关防火安全的规定。对屋面工程的设计和施工，必须依 据公安部、住房和城乡建设部联合发布的《民用建筑外保温系统 及外墙装饰防火暂行规定》的要求，制定有关防火安全的实施细 则及规定，采取必要的防火措施，确保屋面在火灾情况下的安 全性。 2 术语 本规范从屋面工程设计和施工的角度列出了 17 条术语。术 语中包括以下3 种情况: 1 在原规范中的一些均为人所熟知的术语，在这次修订时 予以删除，如"沥青防水卷材、高聚物改性沥青防水卷材、合成 高分子防水卷材"等。 2 对尚未出现在国家标准、行业标准中的术语，在这次修 订时予以增加，如"复合防水层、相容性"等。 3 对过去在国家标准或行业标准不统一的术语，在这次修 订中予以统一，如"防水垫层、持钉层"等。 3 基本规定 的使用功能及要求，把屋面当做一个系统工程来进行研究，同时 考虑了我国的实际情况，建立屋面工程技术内在规律的理论，指 导屋面工程的技术发展。对屋面工程的基本要求说明如下: 1 具有良好的排水功能和阻止水侵人建筑物内的作用。 排水是利用水向下流的特性，不使水在防水层上积滞，尽快 排除。防水是利用防水材料的致密性、憎水性构成一道封闭的防 线，隔绝水的渗透。因此，屋面排水可以减轻防水的压力，屋面 防水又为排水提供了充裕的排除时间，防水与排水是相辅相 成的。 2 冬季保温减少建筑物的热损失和防止结露。 按我国建筑热工设计分区的设计要求，严寒地区必须满足冬 季保温，寒冷地区应满足冬季保温，夏热冬冷地区应适当兼顾冬 季保温。屋面应采用轻质、高效、吸水率低、性能稳定的保温材 料，提高构造层的热阻;同时，屋面传热系数必须满足本地区建 筑节能设计标准的要求，以减少建筑物的热损失。屋面大多数采 用外保温构造，造成屋面的内表面大面积结露的可能性不大，结 露主要出现在檐口、女儿墙与屋顶的连接处，因此对热桥部位应 采取保温措施。 3 夏季隔热降低建筑物对太阳能辐射热的吸收。 按我国建筑热工设计分区的设计要求，夏热冬冷地区必须满 足夏季防热要求，夏热冬暖地区必须充分满足夏季防热要求。屋 面应利用隔热、遮阳、通风、绿化等方法来降低夏季室内温度， 也可采用适当的围护结构减少太阳的辐射传人室内。屋面若采用 含有轻质、高效保温材料的复合结构，对达到所需传热系数比较 容易，要达到较大的热惰性指标就很困难，因此对屋面结构形式 和隔热性能亟待改善。屋面传热系数和热惰性指标必须满足本地 区建筑节能设计标准的要求，在保证室内热环境的前提下，使夏 季空调能耗得到控制。 4 适应主体结构的受力变形和温差变形。 屋面结构设计一般应考虑自重、雪荷载、风荷载、施工或使 用荷载，结构层应保证屋面有足够的承载力和刚度;由于受到地 基变形和温差变形的影响，建筑物除应设置变形缝外，屋面构造 层必须采取有效措施。有关资料表明，导致防水功能失效的主要 症结，是防水工程在结构荷载和变形荷载的作用下引起的变形， 当变形受到约束时，就会引起防水主体的开裂。因此，屋面工程 一要有抵抗外荷载和变形的能力，二要减少约束、适当变形，采 取"抗"与"放"的结合尤为重要。 5 承受风、雪荷载的作用不产生破坏。 虽然屋面工程不作为承重结构使用，但对其力学性能和稳定 性仍然提出了要求。国内外屋顶突然明塌事故，给了我们深刻的 教训。屋面系统在正常荷载引起的联合应力作用下，应能保持稳 定;对金属屋面、采光顶来讲，承受风、雪荷载必须符合现行国 家标准《建筑结构荷载规范)) GB 50009 的有关规定，特别是屋 面系统应具有足够的力学性能，使其能够抵抗由风力造成压力、 吸力和振动，而且应有足够的安全系数。 6 具有阻止火势蔓延的性能。 对屋面系统的防火要求，应依据法律、法规制定有关实施细 则。在火灾情况下的安全性，屋面系统所用材料的燃烧性能和耐 火极限必须符合现行国家标准《建筑设计防火规范)) GB 50016 的有关规定，屋面工程应采取必要的防火构造措施，保证防火 安全。 7 满足建筑外形美观和使用要求。 建筑应具有物质和艺术的两重性，既要满足人们的物质需 求，又要满足人们的审美要求。现代城市的建筑由于跨度大、功 能多、形状复杂、技术要求高，传统的屋面技术已很难适应。随 着人们对屋面功能要求的提高及新型建筑材料的发展，屋面工程 枝计突破了过去千篇一律的屋面形式。通过建筑造型所表达的艺 术性，不应刻意表现繁琐、豪华的装饰，而应重视功能适用、结 构安全、形式美观。 3. O. 2 就我国屋面工程的现状看，屋面大体上可分为卷材防水 屋面、涂膜防水屋面、保温屋面、隔热屋面、瓦屋面、金属板屋 面、采光顶等种类。在每类屋面中，由于所用材料不同和构造各 异，因而形成了各种屋面工程。屋面工程是一个完整的系统，主 要应包括屋面基层、保温与隔热层、防水层和保护层。本条是按 照屋面的所用材料来进行分类，并列表叙述屋面基本构造层次， 有关构造层的定义可见术语内容。本条在执行时，允许设计人员 稍有选择，但在条件许可时首先应这样做。 3. O. 3 本条规定了屋面工程设计的基本原则: 1 屋面是建筑的外围护结构，主要是起覆盖作用，借以抵 抗雨雪，避免日晒等自然界大气变化的影响，同时亦起着保温、 隔热和稳定墙身等作用。根据本规范第3. 0.1 条的规定，屋面工 程的基本功能不仅为建筑的耐久性和安全性提供保证，而且成为 防水、节能、环保、生态及智能建筑技术健康发展的平台，因 此，保证功能在屋面工程设计中具有十分重要的意义和作用。 2 根据人们对屋面功能要求的提高及新型建筑材料的发展， 屋面工程设计将突破过去千篇一律的屋面形式，对防水、节能、 环保、生态等方面提出了更高的要求。由于屋面构造层次较多， 除应考虑相关构造层的匹配和相容外，还应研究构造层间的相互 支持，方便施工和维修。国内当前屋面工程中设计深度严重不 足，特别是构造设计不够合理，造成屋面功能无法得到保证的现 状，因此，构造合理是提高屋面工程寿命的重要措施。 3 屋面防水和排水是一个问题的两个方面，考虑防水的同 时应考虑排水，应先让水顺利、迅速地排走，不使屋面积水，自 然可减轻防水层的压力。屋面工程中对屋面坡度、檐沟、天沟的 汇水面积、水落口数量、管径大小等设计，应尽可能使水以较快 的速度、简捷的途径顺畅排除，总之，做好排水是提高防水功能 的有效措施，因此，防排结合是屋面防水概念设计的主要内容。 4 由于新型建筑材料的不断涌现，设计人员应该熟悉材料 的种类及其性能，并根据屋面使用功能、工程造价、工程技术条 件等因素，合理选择使用材料，提供适用、安全、经济、美观的 构造方案。选材有以下标准: (1)根据不同的工程部位选材; (2) 根据主体功能要求选材; (3) 根据工程环境选材; (4) 根据 工程标准选材。因此，优选用材是保证屋面工程质量的基本 条件。 5 建筑既要满足人们物质需要，又要满足审美要求;它不 但体现某个时代的物质文化水平和科学技术水平，而且还反映出 这个时代的精神面貌。 1 施工单位必须按照工程设计图纸和施工技术标准施工， 不得擅自修改屋面工程设计，不得偷工减料。在施工过程中发现 设计文件和图纸有差错的，施工单位应当及时提出意见和建议， 因此，按图施工是保证屋面工程施工质量的前提。 2 施工单位必须按照工程设计要求、施工技术标准和合同 约定，对进入施工现场的屋面防水、保温材料进行抽样检验，并 提出检验报告。未经检验或检验不合格的材料，不得在工程中使 用，因此，材料检验是保证屋面工程施工质量的基础。 3 施工单位必须建立、健全施工质量检验制度，严格工序 管理，做好隐蔽工程的质量检查和记录。屋面工程每道工序施工 后，均应采取相应的保护措施，因此，工序检查是保证屋面工程 施工质量的关键。 4 施工单位应具备相应的资质，并应建立质量管理体系。 施工单位应编制屋面工程专项施工方案，并应经过审查批准。施 工单位应按有关的施工工艺标准和经审定的施工方案施工，并应 对施工全过程实行质量控制，因此，过程控制是保证屋面工程施 工质量的措施。 5 屋面工程施工质量验收，应按现行国家标准《屋面工程 质量验收规范)) GB 50207 的规定执行。施工单位对施工过程中 出现质量问题或不能满足安全使用要求的屋面工程，应当负责返 修或返工，并应重新进行验收，因此，质量验收是保证屋面工程 施工质量的杂件。 3. O. 5 本条对屋面防水等级和设防要求作了较大的修订。原规 范对屋面防水等级分为四级， 1 级为特别重要或对防水有特殊要 求的建筑，由于这类建筑极少采用，本次修订作了"对防水有特 殊要求的建筑屋面，应进行专项防水设计"的规定;原规范凹级 为非永久性建筑，由于这类建筑防水要求很低，本次修订给予删 除，故本条根据建筑物的类别、重要程度、使用功能要求，将屋 面防水等级分为I 级和H 级，设防要求分别为两道防水设防和一 道防水设防。 本规范征求意见稿和送审稿中，都曾明确将屋面防水等级分 为I 级和E 级，防水层的合理使用年限分别定为20 年和10 年， 设防要求分别为两道防水设防和一道防水设防。关于防水层合理 使用年限的确定，主要是根据建设部《关于治理屋面渗漏的若干 规定)) (991) 370 号文中"..... .选材要考虑其耐久性能保证10 年"的要求，以及考虑我国的经济发展水平、防水材料的质量和 建设部《关于提高防水工程质量的若干规定)) (991) 837 号中 有关精神提出的。考虑近年来新型防水材料的门类齐全、品种繁 多，防水技术也由过去的沥青防水卷材叠层做法向多道设防、复 合防水、单层防水等形式转变。对于屋面的防水功能，不仅要看
    防水材料本身的材性，还要看不同防水材料组合后的整体防水效 果，这一点从历次的工程调研报告中已得到了证实。由于对防水 层的合理使用年限的确定，目前尚缺乏相关的实验数据，根据本 规范审查专家建议，取消对防水层合理使用年限的规定。 的规定，严寒和寒冷地区居住建筑应进行冬季保温设计，保证内 表面不结露;夏热冬冷地区居住建筑应进行冬季保温相夏季防热 设计，保证保温、隔热''性能符合规定要求;夏热冬暖地区居住建 筑应进行夏季防热设计，保证隔热性能符合规定要求。建筑节能 设计中的传热系数和热惰性指标，是围护结构热工性能参数。根 据建筑物所处城市的气候分区区属不同，公共建筑和居住建筑屋 面的传热系数和热惰性指标不应大于表I 和表2 规定的限值。 表1 公共建筑不同气候区屋面传热系数限值 传热系数k[(W/m2 • K)J 气候分区 0.3<体型系数 体型系数王三0.3 主二0.4 屋顶透明部分 严寒地区A 区 主二0.35 :<;;;0.30 主二2. 50 严寒地区B 区 三二0.45 三三0.35 :<;;;2.60 寒冷地区 王三0.55 :<;;;0.45 主二2. 70 夏热冬冷地区 主二O. 70 王三3.00 夏热冬暖地区 主ζ0.90 主二3.50 表2 居住建筑不同气候区屋面传热系数和热惰性指标限值 传热系数k[(W/m2 • K)J 气候分区 三二3 层建筑 4~8 层建筑 二主9 层建筑 严寒地区A 区 0.20 0.25 0.25 严寒地区B 区 0.25 0.30 0.30 严寒地区C 区 0.30 0.40 0.40 寒冷地区A 区 0.35 0.45 0.45 寒冷地区B 区 0.35 0.45 0.45 热惰性指标 体型系数:<;;;0.40 体型系数>0.40 夏热冬 冷地区 D>2.5 主三1. 00 主二0.60 D王二2. ;r 主二0.80 =二0.50 夏热冬 D''?2.5 4二1. 00 暖地区 运0.50'
