  text: 本条对种植隔热层施工作出具体规定 1。种植隔热层挡墙泄水孔是为了排泄种植土中过多的水分而设置的，若留设位置不正确或泄水孔被堵塞。种植土中过多的水分不能排出、不仅会影响使用。而且会对防水层不利 2，排水层是指能排出渗入种植土中多余水分的构造层.排水层的施工必须与排水管.排水沟.水落口等排水系统连接且不得堵塞.保证排水畅通.3。过滤层土工布应沿种植土周边向上敷设至种植土高度,以防止种植土的流失而造成排水层堵塞 4,考虑到种植土和植物的重量较大、如果集中堆放在一起或不均匀堆放，都会使屋面结构的受力情况发生较大的变化。严重时甚至会导致屋面结构破坏事故。
