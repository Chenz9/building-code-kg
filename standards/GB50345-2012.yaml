  buf:
  - '架空隔热层的设计应符合下列规定:'
  - '1'
  - 架空隔热层宜在屋顶有良好通风的建筑物上采用，不宜
  - 在寒冷地区采用F
  - '2'
  - 当采用混凝土板架空隔热层时，屋面坡度不宜大于5%;
  - '3'
  - 架空隔热制品及其支座的质量应符合国家现行有关材料
  - 标准的规定F
  - '4'
  - 架空隔热层的高度宜为180mm，..__ 300mm ，架空板与女儿
  - 墙的距离不应小于250mm;
  - '5'
  - 当屋面宽度大于10m 时，架空隔热层中部应设置通风
  - 屋脊;
  - '6'
  - 架空隔热层的进风口，宜设置在当地炎热季节最大频率
  - 风向的正压区，出风口宜设置在负压区。 4.4.10
  - '蓄水隔热层的设计应符合下列规定:'
  - '1'
  - 蓄水隔热层不宜在寒冷地区、地震设防地区和振动较大
  - 的建筑物上采用;
  - '2'
  - 蓄水隔热层的蓄水池应采用强度等级不低于C25 、抗渗
  - 等级不低于凹的现浇混凝土，蓄水池内宜采用20mm 厚防水砂
  - 浆抹面;
  - '3'
  - 蓄水隔热层的排水坡度不宜大于0.5%;
  - '4'
  - 蓄水隔热层应划分为若干蓄水区，每区的边长不宜大于
  - 10m，在变形缝的两侧应分成两个互不连通的蓄水区。长度超过
  - 40m 的蓄水隔热层应分仓设置，分仓隔墙可采用现浇混凝土或
  - 砌体;
  - '5'
  - 蓄水池应设溢水口、排水管和给水管，排水管应与排水
  - 出口连通;
  - '6'
  - 蓄水池的蓄水深度宜为150mm~200mm;
  - '7'
  - 蓄水池溢水口距分仓墙顶面的高度不得小于100mm;
  - '8'
  - 蓄水池应设置人行通道。
  - '4.5'
  - 卷材及涂膜防水层设计
