  section: ''
  clause_no: 5.3.3
  text: '隔汽层施工应符合下列规定: 1 隔汽层施工前，基层应进行清理，宜进行找平处理; 2 屋面周边隔汽层应沿墙面向上连续铺设，高出保温层上 表面不得小于150mm; 3 采用卷材做隔汽层时，卷材宜空铺，卷材搭接缝应满粘， 其搭接宽度不应小于80mm; 采用涂膜做隔汽层时，涂料涂刷应 均匀，涂层不得有堆积、起泡和露底现象; 4 穿过隔汽层的管道周围应进行密封处理。'
