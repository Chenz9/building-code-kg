  text: '玻璃采光顶材料的贮运、保管应符合下列规定: 1 采光顶部件在搬运时应轻拿轻放，严禁发生互相碰撞; 2 采光玻璃在运输中应采用有足够承载力和刚度的专用货 架;部件之间应用衬垫固定，并应相互隔开; 3 采光顶部件应放在专用货架上，存放场地应平整、坚实、 通风、干燥，并严禁与酸碱等类的物质接触。 附录A 屋面工程用防水及保温材料标准 A.O.l 屋面工程用防水材料标准应按表A. 0.1 选用。 表A. O.l 屋面工程用防水材料标准 类别 标准名称 标准编号 1.弹性体改性沥青防水卷材 GB 18242 2. 塑性体改性沥青防水卷材 GB 18243 改性沥青 3. 改性沥青聚乙烯胎防水卷材 防水卷材 GB 18967 4. 带自粘层的防水卷材 GB/T 23260 5. 自粘聚合物改性沥青防水卷材 GB 23441 1.聚氯乙烯防水卷材 GB 12952 高分子 2. 氯化聚乙烯防水卷材 GB 12953 防水卷材 3. 高分子防水材料第1 部分=片材 GB 18173. 1 4. 氯化聚乙烯-橡胶共混防水卷材 JC/T 684 1.聚氨醋防水涂料 GB/T 19250 2. 聚合物水泥防水涂料 GB/T 23445 防水涂料 3. 水乳型沥青防水涂料 JC/T 408 4. 溶剂型橡胶沥青防水涂料 JC/T 852 5. 聚合物乳液建筑防水涂料 JC/T 864 1.硅酣建筑密封胶 GB/T 14683 2. 建筑用砖酣结构密封胶 GB 16776 3. 建筑防水沥青嵌缝油膏 JC/T 207 4. 聚氨醋建筑密封胶 JC/T 482 密封材料 5. 聚硫建筑密封胶 JC/T 483 6. 中空玻璃用弹性密封胶 JC/T 486 7. 混凝土建筑接缝用密封胶 JC/T 881 8. 幕墙玻璃接缝用密封胶 JC/T882 9. 彩色涂层钢板用建筑密封胶 JC/T 884 续表AO.l 类别 标准名称 标准编号 1.玻纤胎沥青瓦 GB/T 20474 瓦 2. 烧结瓦 GB/T 21149 3. 混凝土瓦 JC/T 746 1.高分子防水卷材胶粘剂 JC/T 863 2. 丁基橡胶防水密封胶粘带 JC/T 942 3. 坡屋面用防水材料聚合物改性沥青防水 JC/T 1067 垫层 配套材料 4. 披屋面用防水材料自粘聚合物沥青防水 垫层 JC/T 1068 5. 沥青防水卷材用基层处理剂 JC/T 1069 6. 自粘聚合物沥青泛水带 JC/T 1070 7. 种植屋面用耐根穿刺防水卷材 JC/T 1075 A.O.2 屋面工程用保温材料标准应按表A. O. 2 的规定选用。 表A. O.2 屋面工程用保温材料标准 类别 标准名称 标准编号 聚苯乙烯 1.绝热用模塑聚苯乙烯泡沫塑料 GB/T 10801. 1 泡沫塑料 2. 绝热用挤塑聚苯乙烯泡沫塑料 CXPS) GB/T 10801. 2 硬质聚氨 1.建筑绝热用硬质聚氨醋泡沫塑料 GB/T 21558 醋泡沫塑料 2. 喷涂聚氨醋硬泡体保温材料 JC/T 998 1.膨胀珍珠岩绝热制品 GB/T 10303 无机硬质 2. 蒸压加气混凝土砌块 GB/T 11968 绝热制品 3. 泡沫玻璃绝热制品 JC/T 647 4. 泡沫混凝土砌块 JC/T 1062 纤维保 1.建筑绝热用玻璃棉制品 GB/T 17795 温材料 2. 建筑用岩棉、矿渣棉绝热制品 GB/T 19686 金属面绝 1. 建筑用金属面绝热夹芯板 GB/T 23932 热夹芯板 附录B 屋面工程用防水及 保温材料主要性能指标 B.l 防水材料主要性能指标'
