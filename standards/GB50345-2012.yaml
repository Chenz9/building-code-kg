  clause_no: 4.7.2
  text: '对于块体材料作保护层，在调研中发现往往因温度升高 致使块体膨胀隆起，因此，本条规定分格缝纵横间距不应大于 10m ，分格缝宽度宜为20mm 。 护层表面出现起砂、起皮现象。水泥砂浆保护层由于自身的干缩 和温度变化的影响，往往产生严重龟裂，且裂缝宽度较大，以至 造成碎裂、脱落。根据工程实践经验，在水泥砂浆保护层上划分 表面分格缝，分格面积宜为1m2 ，将裂缝均匀分布在分格缝内， 避免了大面积的龟裂。 4二7.4 用细石混凝土作保护层时，分格缝设置过密，不但给施 工带来困难，而且不易保证质量，分格面积过大又难以达到防裂 的效果，根据调研的意见，规定纵横间距不应大于6m ，分格缝 宽度宜为10mm~20mm 。 脂加工而成，具有良好的帖结性和不透水性;产品化学性质稳 定，能长期经受日光照射和气候条件变化的影响，具有优良的耐 紫外线、耐老化性和耐久性，可在各类防水材料基面上作耐候、 耐紫外线罩面防护。 空隙的屋面，高温季节会出现因刚性保护层热胀顶推女儿墙，有 的还将女儿墙推裂造成渗漏，而在刚性保护层与女儿墙间留出空 隙的屋面，均未出现推裂女儿墙事故，故本条规定了块体材料、 水泥砂浆、细石混凝土保护层与女儿墙或山墙之间，应预留宽度 为30mm 的缝隙，缝内宜填塞聚苯乙烯泡沫塑料，并用密封材 料嵌填。 定期进行维护或修理，为避免在搬运材料、工具及维护作业中， 对防水层造成损伤和破坏，故本条规定在经常维护设施周围与出 人口之间的人行道应设置块体材料或细石混凝土保护层。 隔离层的作用是找平、隔离。在柔性防水层上设置块体 材料、水泥砂浆、细石混凝土等刚性保护层，由于保护层与防水 层之间的粘结力和机械咬合力，当刚性保护层膨胀变形时，会对 防水层造成损坏，故在保护层与防水层之间应铺设隔离层，同时 可防止保护层施工时对防水层的损坏。对于不同的屋面保护层材 料，所用的隔离层材料有所不同，本条列出了隔离层材料的适用 范围和技术要求。 4.8 瓦屋面设计 和沥青瓦屋面。近年来随着建筑设计的多样化，为了满足造型和 艺术的要求，对有较大坡度的屋面工程也越来越多地采用了瓦 屋面。 本次修订规范时将屋面防水等级划分为I 、 E 两级，本条规 定防水等级为I 级的瓦屋面，防水做法采用瓦+防水层;防水等 级为E 级的瓦屋面，防水做法采用瓦+防水垫层。这就使瓦屋面 能在一般建筑和重要建筑的屋面工程中均可以使用，扩大了瓦屋 面的使用范围。 在进行瓦屋面设计时，瓦屋面的基层可以用木基层，也 可以用混凝土基层，其构造做法应符合以下要求: 1 烧结瓦、混凝土瓦铺设在木基层上时，宜先在基层上铺 设防水层或防水垫层，然后钉顺水条、挂瓦条，最后再挂瓦。 2 烧结瓦、混凝土瓦铺设在混凝土基层上时，宜在混凝土 表面上先抹水泥砂浆找平层，再在其上铺设防水层或防水垫层， 然后钉顺水条、挂瓦条，最后再挂瓦。 3 烧结瓦、混凝土瓦铺设在有保温层的混凝土基层上时， 宜先在保温层上铺设防水层或防水垫层，再在其上设细石混凝土 持钉层，然后钉顺水条、挂瓦条，最后再挂瓦。 4 沥青瓦铺设在木基层上时，宜先在基层上铺设防水层或 防水垫层，然后铺钉沥青瓦。 5 沥青瓦铺设在混凝土基层上时，宜在混凝土表面上先抹 水泥砂浆找平厚，再在其上铺设防水层或防水垫层，最后再铺钉 沥青瓦。 6 沥青瓦铺设在有保温层的混凝土基层上时，宜先在保温 层上铺设防水层或防水垫层，再在其上铺设持钉层，最后再铺钉 沥青瓦。 薄弱环节。在调研中发现这些部位发生渗漏的情况比较多见，所 以对这些部位应作泛水处理，其泛水高度不应小于250mm 。 在一些建筑中为满足建筑造型的要求而加大瓦屋面的坡 度，当瓦屋面的坡度大于100% 时，瓦片容易坠落，尤其是在大 风或地震设防地区，屋面受外力的作用，瓦片极易被掀起、抛 出，导致屋面损坏。本条规定在大风及地震设防地区或屋面坡度 大于100%时，对瓦片应采用固定加强措施。烧结瓦、混凝土瓦 屋面，应用镀铸铁丝将全部瓦片与挂瓦条绑扎固定;沥青瓦屋面 檐口四周及屋脊部位，每张沥青瓦片应增加固定钉数量，同时上 下沥青瓦之间应采用沥青基胶结材料满粘。 严寒及寒冷地区瓦屋面工程的檐口部位，在冬季下雪后 会形成冰棱或冰坝，不仅影响了屋面上雪水的排出，而且也容易 损坏檐口，因此，设计时应采取防止冰雪融化下坠和冰坝形成的 措施，以确保屋面工程正常使用。 还不能算作是一种防水材料，只有瓦和防水垫层组合后才能形成 一道防水设防。防水垫层质量的好坏，直接关系到瓦屋面质量的 好坏，因此本条对防水垫层所用卷材的品种、最小厚度和搭接宽 度作出了规定。 要求，同时也考虑到施工人员在屋面上操作时对木基层所产生的 荷载作用，所以本条规定持钉层为木板时厚度不应小于20mm 。 而当持钉层采用人造板时，因其属于有性能分级的结构性人工板 材，故其厚度可比普通木板减薄。当持钉层为细石混凝土时，考 虑到细石混凝土中骨料的粒径，如混凝土的厚度小于35mm 则 很难施工，所以规定细石混凝土的厚度不应小于35mm 。 4.8.8 本条强调檐沟、天沟设置防水层的重要性，防水层可采 用防水卷材、防水涂膜或金属板材。 烧结瓦、混凝土瓦屋面都应有一定坡度，以便迅速排走 屋面上的雨水。由于木屋架、钢木屋架的高跨比一般为1/6~'' 1/4 ，如果按最小高跨比为1/6 考虑，则屋面的最小坡度应为 33.33% ，而原规范中规定平瓦屋面的坡度不应小于20% ，这个 坡度仅相当于11018'' ，坡度太小不仅不利于屋面排水，而且瓦片 之间易发生爬水，导致屋面渗漏，所以本条规定烧结瓦、混凝土 瓦屋面的坡度不应小于30% 。'
