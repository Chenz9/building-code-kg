- id: GB 50345-2012#3.0.8
  standard_code: GB 50345-2012
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.8
  text: '本条是依据现行国家标准《建筑物防雷设计规范)) GB 50057 和《建筑幕墙)) GBjT 21086 的有关规定，对屋面工程的 防雷设计提出要求。 环境保护是我国的一项重大政策。 1989 年国家制定了 《中华人民共和国环境保护法)) ，明确提出了保护和改善生活环境 与生态环境，防治污染或其他公害，保障人体健康等要求，因 此，在进行屋面工程的防水层、保温层设计时，应选择对环境和 人身健康元害的防水、保温材料。在进行屋面工程的防水层、保 温层施工时，应严格按照要求施工，必要时应采取措施，防止对 周围环境造成污染及对人身健康带来危害。 随着科学技术的不断发展，在屋面工程中也不断涌现出 许多新型屋面形式和新型防水、保温材料，施工工艺也相应得到 较大的发展。本条是依据《建设领域推广应用新技术的规定》 (建设部令第109 号)和《建设部推广应用新技术管理细则)) (建 科 [2002J 222 号)的精神，注重在建筑工程中推广应用新技术 和限制、禁止使用落后的技术。对采用性能、质量可靠的防水、 保温材料和相应的施工技术等科技成果，必须经过科技成果鉴 定、评估或新产品、新技术鉴定，并应制定相应的技术规程。同 时还强调新材料、新工艺、新技术、新产品需经屋面工程实践检 验，符合有关安全及功能要求的方可推广应用。 3.0.11 排水系统不但交工时要畅通，在使用过程中应经常检 查，防止水落口、檐沟、天沟堵塞，以免造成屋面长期积水和大 雨时溢水。工程交付使用后，应由使用单位建立维护保养制度， 指定专人定期对屋面进行检查、维护。做好屋面的维护保养工 作，是延长防水层使用年限的根本保证。据调查，很多屋面由交 付使用到发现渗漏期间，从未有人对屋面进行过检查或清理，造 成屋面排水口堵塞、长期积水或杂草滋长，有的屋面因上人而造 成局部损坏，加速了防水层的老化、开裂、腐烂和渗漏。为此， 本条对屋面工程管理、维护、保养提出了原则规定。 4 屋面工程设计 4.1 一般规定 要考虑建筑的使用功能、造价、环境、能耗、施工条件等因素， 经技术经济分析选择屋面形式、构造和材料。 1 屋面防水等级应根据建筑物的类别、重要程度、使用功 能要求确定。不同防水等级的屋面均不得发生渗漏。本规范规定 I 级防水屋面应采用两道防水设防， 11 级防水屋面应采用一道防 水设防。 2 国内目前屋面工程中，有的设计深度严重不足，设计者 可以不进行认真的选材和任意套用通用节点详图，使得施工方可 以任意采用建筑材料，操作也可以随便，监理方认可或不认可均 无依据。因此，设计时必须考虑使用功能、环境条件、材料选 择、施工技术、综合性价比等因素，对屋面防水、保温构造认真 进行处理，重要部位要有大样图。以便施工单位"照图施工"， 监理单位"按图检查"，从而避免屋面工程在施工中的随意性。 3 屋面排水系统设计是建筑设计图纸的主要内容，由于近 年来屋面形式多样化，常常限制了水落管的合理设置。所以，在 建筑初步设计阶段，就应明确屋面排水系统包括排水分区、水落 口的分布及排水坡度的设计。施工图设计应明确分水脊线、带水 坡起线，排水途径应通畅便捷，水落口应负荷均匀，同时应明确 找坡方式和选用的找坡材料。 4 屋面工程使用的材料必须符合国家现行有关标准的规定， 严禁使用国家明令禁止使用及淘汰的材料。合理选择屋面工程使 用的防水和保温材料，设计文件中应详细注明防水、保温材料的 品种、规格、性能等。鉴于目前市场上有许多假冒伪劣材料，很 难保证达到国家制定的技术指标，如果设计时不严加控制，就容 易被伪劣材料混充，所以在设计时应注明所用材料的技术指标， 以便于施工时检测。 本条规定了屋面防水层设计时确保工程质量的技术措施。 1 考虑在防水卷材与基层满粘后，基层变形产生裂缝会影 响卷材的正常使用。对于屋面上预计可能产生基层开裂的部位， 如板端缝、分格缝、构件交接处、构件断面变化处等部位，宜采 用空铺、点粘、条粘或机械固定等施工方法，使卷材不与基层粘 结，也就不会出现卷材零延伸断裂现象。 2 对容易发生较大变形或容易遭到较大破坏和老化的部位， 如檐口、檐沟、泛水、水落口、伸出屋面管道根部等部位，均应 增设附加层，以增强防水层局部抵抗破坏和老化的能力。附加层 可选用与防水层相容的卷材或涂膜。 3 大坡面或垂直面上粘贴防水卷材，往往由于卷材本身重 力大于粘结力而使防水层发生下滑现象，设计时应采用金属压条 钉压固定，并用密封材料封严。这里一般不建议采用提高卷材粘 结力的方法，过大粘结力对克服基层变形影响不利。 4 在卷材或涂膜防水层上均应设置保护层，以保护防水层 不直接受阳光紫外线照射或酸雨等侵害以及人为的破坏，从而延 长防水层的使用寿命。常用的保护层有块体材料、水泥砂浆、细 石混凝土、浅色涂料以及铝筒等。 5 由于刚性保护层材料的自身收缩或温度变化影响，直接 拉伸防水层，使防水层疲劳开裂而发生渗漏，因此，在刚性保护 层与卷材、涂膜防水层之间应做隔离层，以减少两者之间的粘结 力、摩擦力，并使保护层的变形不受到约束。 工程实践中，关于相容性的问题是设计人员最为关心但 却最容易被忽视的。本次规范修订时对相容性给出了定义，即相 邻两种材料之间互不产生有害的物理和化学作用的性能。本条规 定在卷材、涂料与基层处理剂、卷材与胶粘剂或胶粘带、卷材与 卷材、卷材与涂料复合使用、密封材料与接缝基材等情况下应具 有相容性。表3 及表4 分别列出卷材基层处理剂及胶粘剂的选用 和涂膜基层处理剂的选用。 表3 卷材基层处理荆及胶粘剂的选用 卷 材 基层处理剂 卷材胶粘剂 石油沥青冷底子油或橡 橡胶改性沥青冷胶粘剂 高聚物改性沥青卷材 胶改性沥青冷胶粘剂稀 释液 或卷材生产厂家指定产品 合成高分子卷材 卷材生产厂家随卷材配套供应产品或指定的产品 表4 涂膜基层处理剂的选用 涂 料 基层处理剂 高聚物改性沥青涂料 石油沥青冷底子汹 水乳型涂料 掺O.2%~O.3%乳化剂的水溶液或软水稀释，质量比为 1: O. 5~1 : 1. 切忌用天然水或自来水 溶剂型涂料 直接用相应的溶剂稀释后的涂料薄涂 聚合物水泥涂料 由聚合物乳液与水泥在施工现场随配随用'
