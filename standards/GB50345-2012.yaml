  buf:
  - 本规范适用于房屋建筑屋面工程的设计和施工。
  - 1. o. 3 屋面工程的设计和施工，应遵守国家有关环境保护、建
  - 筑节能和防火安全等有关规定，并应制定相应的措施。
  - 1. O. 4
  - 屋面工程的设计和施工除应符合本规范外，尚应符合国
  - 家现行有关标准的规定。 2
  - 术语
