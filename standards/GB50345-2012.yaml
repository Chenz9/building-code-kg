  - 的防水材料;
  - '6'
  - 坡屋面应选用与基层粘结力强、感温性小的防水材料;
  - '7'
  - 屋面接缝密封防水，应选用与基材粘结力强和耐候性好、
  - 适应位移能力强的密封材料;
  - '8'
  - 基层处理剂、胶粘剂和涂料，应符合现行行业标准《建
  - 筑防水涂料有害物质限量)) JC 1066 的有关规定。
