  section: ''
  clause_no: 4.9.1
  text: '金属板屋面防水等级和防水做法应符合表4.9.1 的规定。 表4.9.1 金属板屋面防水等级和防水做法 防水等级 防水做法 I 级 压型金属板+防水垫层 E 级 压型金属板、金属西绝热夹芯极 注: 1 当防水等级为I 级时，压型铝合金板基板厚度不应小子。.9mm õ 压型铜板 基板厚度不应小于0.6mm õ 2 当防水等级为I 级时，压型金属板应采用360。破口锁边连接方式; 3 在I 级屋面防水做法中，仅作压型金属板时，应符合《金属压型板应用技 术规范B 等相关技术的规定。'
