- id: GB 50345-2012#5.3.13
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.3.13
  text: '架空隔热层施工应符合下列规定: 1 架空隔热层施工前，应将屋面清扫干净，并应根据架空 隔热制品的尺寸弹出支座中线; 2 在架空隔热制品支座底面，应对卷材、涂膜防水层采取 加强措施; 3 铺设架空隔热制品时，应随时清扫屋面防水层上的落灰、 杂物等，操作时不得损伤已完工的防水层; 4 架空隔热制品的铺设应平整、稳固，缝隙应勾填密实。'
