  text: '装配式钢筋混凝土板的板缝嵌填施工应符合下列规定: 1 嵌填混凝土前板缝内应清理干净，并应保持湿润; 2 当板缝宽度大于40mm 或上窄下宽时，板缝内应按设计 要求配置钢筋; 3 嵌填细石混凝土的强度等级不应低于C20 ，填缝高度宜 低于板面1 Omm""_''20mm ，且应振捣密实和浇水养护; 4 板端缝应按设计要求增加防裂的构造措施。'
