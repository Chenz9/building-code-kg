- id: GB 50345-2012#5.3.5
  standard_code: GB 50345-2012
  chapter: 5 屋面工程施工
  section: ''
  clause_no: 5.3.5
  text: '板状材料保温层施工应符合下列规定: 1 基层应平整、干燥、干净; 2 相邻板块应错缝拼接，分层铺设的板块上下层接缝应相 互错开，板间缝隙应采用同类材料嵌填密实; 3 采用干铺法施工时，板状保温材料应紧靠在基层表面上， 并应铺平垫稳; 4 采用粘结法施工时，胶粘剂应与保温材料相容，板状保 温材料应贴严、粘牢，在胶粘剂固化前不得上人踩踏; 5 采用机械固定法施工时，固定件应固定在结构层上，固 定件的间距应符合设计要求。'
  is_mandatory_clause: false
