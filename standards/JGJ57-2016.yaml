  standard_code: JGJ 57-2016
  chapter: 7 后台
  section: 7.1演出用房
  clause_no: 7.1.10
  text: 候场室应靠近上场口、下场口，并应符合下列规定：使用面积不宜少于30m²。门净宽不应小于1.40m，净高不应小于2.40m。候场室内宜设穿衣镜和男、女厕所。当受场地限制时，后台跑场道可兼做演员候场空间。7.1. 11后台跑场道的设置应简短便捷，并应符合下列规定：1后台跑场道净宽不应小于2.10m，净高不应低于2.40m。当剧场后台跑场道兼作演员候场休息区及服装道具临时存放区时，净宽不应小于2.80m，在出场口附近宜设候场休息空间。2后台跑场道地面标高应与舞台一致。3后台跑场道应做吸声处理，跑场道地面应防滑及防止产生噪声。7.1. 12小道具室宜靠近演员上场口、下场口设置。7.1. 13剧场应设乐队休息室和乐器调音室。有条件时，宜另设指挥休息室。休息室和乐器调音室应与乐池联系方便，并应防止调音噪声对舞台演出的干扰。7.1. 14洗室、浴室、厕所不应靠近主舞台，并应符合下列规定：洗室洗脸盆应按每6人10人设1个。淋浴室喷头应按每6人～10人设1个。3后台每层均应设男、女厕所，且男大便器应按每10人～15人设1个，男小便器应按每7人～15人设1女天便器应按每10人12人设1个。
