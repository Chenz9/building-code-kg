  text: 第一道耳光室位置应使灯具光轴经台口侧边沿，射向表演区的水平投影与舞台中轴线形成的水平夹角不大于45°，并不2耳光室宜分层设置，且第一层底部应高出舞台面2.50m。3耳光室每层净高宜为2.10m，射光口净宽不应小于 1.20m。当乐池升起作为表演区时，应设两道耳光。射光口应设金属护网，并应符合本规范第6.4.3条第6款的规定。6甲等剧场设不少于两道耳光室；乙等剧场设不少于一道耳光室。7耳光室灯具投射光轴靠近观众厅侧墙方向1.00m范围内，不应有遮挡障碍物。耳光室投光口两侧墙面宜设灯杆预埋钢构件。
