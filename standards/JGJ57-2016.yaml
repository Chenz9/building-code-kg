  text: 灯光控制室、音响控制室均宜设在观众厅池座后部中央部位，并应符合下列规定：1当灯光控制室和音响控制室在同一层时，灯光控制室应设置在舞台下场口同侧，音响控制室应设置舞台上场口同侧。面积均不应小于20m²。监视窗口应能看到舞台表演区全部，窗口宽度不应小于2.00m，窗口净高不应小于0.60m。音响控制室应能听到主扩扬声器直达声应便于灯光和音响操作人员观察观众席情况。应便于与舞台工作人员联络方便。6.7. 2调光柜室和功放室宜设在主舞台两侧舞台口高度的位置，调光柜室宜设置在和灯光控制室同一侧。功放室宜设置在和音响控制室同一侧，甲等剧场的调光柜室和功放室面积均不应小于20m²，乙等的不应小于14m。调光柜室和灯光控制室、功放室与音响控制室之间应敷设相应的管线。
