  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: 为保证剧场建筑设计满足使用功能、安全卫生、节能、环保、经济及舞台工艺等方面的基本要求，制定本规范。1.0. 2本规范适用于新建、扩建和改建的剧场建筑设计。
