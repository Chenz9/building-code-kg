  chapter: 1 总则
  section: ''
  clause_no: 1.0.4
  text: 根据使用性质及观演条件，剧场建筑可用于歌舞剧、话剧、戏曲等三类戏剧演出。当剧场为多用途时，其技术要求应按其主要使用性质确定，其他用途应适当兼顾。×
