  standard_code: JGJ 57-2016
  chapter: 7 后台
  section: 7.1演出用房
  clause_no: 7.1.6
  text: 化妆室应符合下列规定：化妆室采光窗应具有遮光措施。大、中化妆室的门，净宽不应小于1.40m，净高不应低于2.40m。3化妆室应设洗脸盆，且小化妆室每间应设1个，中化妆室每间不应少于1个，大化妆室每间不应少于2个。4中、小化妆室宜附设卫生间、淋浴室，供主要演员使用的化妆室应附设卫生间和淋浴室。中、小化妆室宜附设更衣间。7.1. 7抢妆室应靠近台口或上场口、下场口设置。7.1. 8化妆室、服装室、乐队休息室、候场室等，应设监视显示屏，并应专送舞台演出实况音频、视频信号。7.1. 9服装室应按男、女分别设置，并应符合下列规定：甲等剧场不应少于4间人使用面积不应少于160m；乙等剧场不应少于3间，使用面积不应少于110m。2服装室的门，净宽不应小于1.40m，净高不应低于2.40m。服装室内宜分设男、女更衣间。
