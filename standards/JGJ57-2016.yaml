  text: 合唱队排练厅地面应设台阶式站席，每个合唱队演员所占面积可按140m人计。舞蹈排练厅应符合下列规定7.2. 4斤内净高不宜小于5.00m。地面应为弹性木地板或舞蹈地胶毯。练功扶手高度应为0.80m～1.20m，距墙应为0.20m～0.30m一个墙面应设通长镜子，高度应大于2.00m。7.2. 5排练厅宜设单独的音响灯光控制室。7.2. 6琴房应设置单独控制的空调，每间的使用面积不宜小于6m²。7.2. 7排练厅、琴房不宜靠近主舞台，并应防止对舞台演出产生干扰。
