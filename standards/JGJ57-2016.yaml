  text: 追光室应符合下列规定：甲等剧场应设追光室，并应预留3组以上容量不小于32A、220V的追光灯电源。当乙等剧场不设追光室时，可在楼座观众厅后部设临时追光位，并应预留2组以上容量不小于32A、220V的追光灯电源。2追光室应设在楼座观众厅的后部，并应左右各设1个，进深和宽度均不应小于3.50m，追光室的室内净高不应小于2.20m。也可在观众厅后墙上方墙内做成通长追光室。3追光室射光口的宽度、高度及射光口下沿距地面距离，应根据选用灯型进行计算。射光口下沿至最后一排观众的座椅地面高度不应小于1.80m。
