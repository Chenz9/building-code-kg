  text: 作用在主舞台、侧舞台、后舞台及台唇台面上的荷载取值，应符合下列规定：1对于舞台面上设置的固定设施，其荷载取值应根据其实际重量取值。2台面均布活荷载取值不应小于5.0kN/m²。3当台面上有车载转台等移动设施时，等效均布活荷载取值应根据其实际重量按现行国家标准《建筑结构荷载规范》GB50009进行计算，且不应小于5.0kN/m²。4各种机械舞台台面上作用的均布活荷载取值应根据舞台工艺设计的要求确定，且静止时其值不应小于5.0kN/m²，升降时不应小于2.5kN/m²。
