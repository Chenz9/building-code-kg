  text: 观众厅外的疏散通道应符合下列规定：1室内部分的坡度不应大于1：8，室外部分的坡度不应大于1：10，并应采取防滑措施，室内坡道的装饰材料燃烧性能不应低于B1级，为残疾人设置的通道坡度不应大于1：12。2地面以上2.00m内不得有任何突出物，并不得设置落地镜子及装饰性假门。3当疏散通道穿过前厅及休息厅时，设置在前厅、休息厅的商品零售部及衣物寄存处不得影响疏散的畅通。疏散通道的隔墙耐火极限不应小于1.00h。5对于疏散通道内装修材料燃烧性能，顶棚不低于A级，墙面和地面不低于B1级，并不得在燃烧时产生有毒气体。6疏散通道宜有自然通风及采光，当没有自然通风及采光时，应设人工照明，疏散通道长度超过20m时，应采用机械通风排烟。
