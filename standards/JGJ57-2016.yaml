  text: 灯光配线应符合下列规定：1由可控硅（晶闸管）调光装置配出的舞台灯光回路，不宜采用多回路共用中性线方式，宜采用单相配电方式。2由可控硅（晶闸管）调光装置配出的舞台灯光线路，应选用金属导管、槽盒敷设，调光线路应远离音响、电视及通讯等线路。当两种线路平行敷设时，其间距应大于1.00m，当垂直交叉时，其间距应大于0.50m。3当可控硅（晶闸管）调光装置电源采用三相配电时，其中性线截面积应为相线的两倍。4舞台照明设备的接电应采用专用接插件连接，且接插件额定容量应有足够的裕度。
