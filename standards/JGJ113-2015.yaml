  text: 定位块的尺寸应符合下列规定：长度不应小于25mm；宽度应等于玻璃的厚度加上前部余隙和后部余隙；厚度应等于边缘间隙。12.2. 4支承块与定位块的位置应符合下列规定（图12.2.4）：1采用固定安装方式时，支承块和定位块的安装位置应距离槽角为（1/10）～（1/4）边长位置之间；2采用可启安装方式时，支承块和定位块的安装位置距槽角不应小于30mm。当安装在窗框架上的铰链位于槽角部30mm和距槽角1/4边长点之间时，支承块和定位块的安装位置应与铰链安装的位置一致；3支承块、定位块不得堵塞泄水孔。给息公开图12.2.4支承块和定位块安装位置1一定位块；2玻璃：3—框架；4—支承块弹性止动片的尺寸应符合下列规定：12.2. 5览专用长度不应小于25mm；高度应比凹槽深度小3mm；厚度应等于前部余隙或后部余隙。12.2. 66弹性止动片位置应符合下列规定：《弹性止动片应安装在玻璃相对的两侧，弹性止动片之间的间距不应大于300mm；2弹性止动片安装的位置不应与支承块和定位块的位置相同。12.2. 7密封胶的应用应符合下列规定：对于多孔表面的框材，框材表面应涂底漆。当密封胶用于塑料门窗安装时，应确定其适用性和相容性；用密封胶安装时，应使用支承块、定位块、弹性止动片；密封胶上表面不应低于槽口，并应做成斜面；下表面应低于槽口3mm。
