- id: JGJ 100-2015#7.4.11
  standard_code: JGJ 100-2015
  chapter: 7 建筑设备
  section: 7.4电气
  clause_no: 7.4.11
  text: 大型和特大型机动车库应设置出人口管理系统，中型和 小型类机动车库宜设置出人口管理系统；公共场所的大型和特大 型机动车库宜设置停车引导系统。机动车库管理系统的设置应符 合现行国家标准《智能建筑设计标准》GB 50314 的规定。 31 本规范用词说明 1 为便于在执行本规范条文时区别对待，对要求严格程度 不同的用词说明如下： 1 ）表示很严格，非要这样做不可的： 正面词采用“必须”，反面词采用“严禁”； 2）表示严格，在正常情况下均应这样做的： 正面词采用“应”，反面词采用“不应”或“不得”； 3）表示允许稍有选择，在条件许可时首先应这样做的： 正面词采用“宜”，反面词采用“不宜’气 4）表示有选择，在一定条件下可以这样做的，采用 “可”。 2 条文中指明应按其他有关标准执行的写法为： “应符 合……的规定”或“应按……执行”。 32 引用标准名录 1 《建筑给水排水设计规范》GB 50015 2 《建筑设计防火规范》GB 50016 3 《供配电系统设计规范》GB 50052 4 《汽车库、修车库、停车场设计防火规起》GB 50067 5 《智能建筑设计标准》GB 50314 6 《民用建筑设计通则》GB 50352 7 《安全标志及其使用导则》GB 2894 8 《工业企业设计卫生标准》GBZ 1 9 《城市道路工程设计规范》 CJ] 37 10 《机械式停车库工程技术规范》JGJ/T 326 33 中华人民共和国行业标准 车库建筑设计规范 JGJ 100 - 2015 条文说明 修订说明 《车库建筑设计规范》 JGJ 100 - 2015 ，经住房和城乡建设部 2015 年3 月 30 日以第788 号公告批准、发布。 本规范是在《汽车库建筑切，十规范》JGJ 100 98 的基础上修订 而成，上一版的主编单位是北京建筑工程学院（现北京建筑大学）， 参加单位是浙江省城乡规划设计研究院、苏州城建环保学院、北京 恩菲停车设备集团、上海建筑设计研究院、北京首汽集团公司，主 要起草人员是沈运柱、许家珍、史奉羔、姜勇、李运保、张安益。 本次修订的主要技术内容是： 1. 由《汽车库建筑设计规范》 更名为《车库建筑设计规范》，增加非机动车部分以扩大规范适 用范围； 2. 对规范中的术语、名词等进行了补充、修改与完善； 3. 对原规范中相应章节名称进行修订，将“库址和总平面”章 节修订为“基地与总平面”，将坡道式汽车库修订为机动车库； 将“机械式汽车库”修订为“机械式机动车库”，新增“非机动 车库”章节； 4. 对规范中相应章节的体例与内容进行修订与完 善，将机动车库、机械式机动车库、非机动车库分别从一般规 定、出人口及坡道、停车区域、构造措施四个方面进行修订，其 中机动车库按照出人口类型分为坡道式、升降梯式、平人式兰种 类型； 5. 对建筑设备相关内容进行了调整与完善。 为便于广大设计、施工、科研、学校等单位有关人员在使用 本规范时能正确理解和执行条文规定，《车库建筑设计规范》编 制组按章、节、条顺序编制了本规范的条文说明。对条文规定的 目的、依据以及执行中需要注意的有关事项进行了说明。还着重 对强制性条文的强制性理由作了解释。
