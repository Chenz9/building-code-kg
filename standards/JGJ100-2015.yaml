  text: 车库基地出人口的设计应符合下列规定：基地出人口的数量和位置应符合现行国家标准《民用建筑设计通则》GB50352的规定及城市交通规划和管理的有关规定；2基地出人口不应直接与城市快速路相连接，且不宜直接与城市主干路相连接；3基地主要出入口的宽度不应小于4m，并应保证出入口与内部通道衔接的顺畅；4当需在基地出入口办理车辆出入手续时，出入口处应设置候车道，且不应占用城市道路；机动车候车道宽度不应小于4m、长度不应小于10m，非机动车应留有等候空间；5机动车库基地出入口应具有通视条件，与城市道路连接的出人口地面坡度不宜大于5%；6机动车库基地出入口处的机动车道路转弯半径不宜小于6m，且应满足基地通行车辆最小转弯半径的要求；7相邻机动车库基地出入口之间的最小距离不应小于15m，且不应小于两出入口道路转弯半径之和。
