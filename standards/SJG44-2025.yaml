clauses:
- id: SJG 44-2025#1.0.1
  standard_code: SJG 44-2025
  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: 为贯彻国家有关节约能源与环境保护的法规和政策，结合本地区气候条件和低碳发展目标要求，改善深圳市公共建筑室内环境，降低建筑能耗，制定本标准。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: null
    modal_words: []
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 深圳市2009年在国标《公共建筑节能设计标准》GB50189-2005的基础上发布了《公共建筑节能设计标准》深圳实施细则SZJG29-2009，2018年基于《公共建筑节能设计标准》GB50189-2015，对深圳市公共建筑节能提出进一步要求，结合节能65%的目标进行修订，发布了深圳市《公共建筑节能设计规范》SJG44-2018。深圳市公共建筑节能工作经过近20年的发展，取得了显著成绩。为顺应国家建筑节能工作不断发展的需要，进一步提高我市建筑节能的目标和水平，需要编制更高要求的建筑节能技术标准。根据2022年4 月1 日全面实施的国家强制性规范《建筑节能与可再生能源利用通用规范》GB55015-2021的2.0.1 条，新建居住建筑和公共建筑平均设计能耗水平应在2016 年执行的节能设计标准基础上分别降低30%和20%。公共建筑平均节能率应为72%。根据《深圳经济特区绿色建筑条例》第十一条，大力发展超低能耗建筑，鼓励开展近零能耗建筑、零碳建筑、近零碳排放试验区的示范建设，通过规模化应用绿色建材、可再生能源等产品和技术降低建筑碳排放强度和碳排放总量，实现碳排放目标。为了支撑超低能耗建筑发展需要，并且避免新建成的公共建筑因双碳需求而进行节能改造，本标准在符合国家规范基础上，考虑可再生能源利用后的平均节能率目标为78%。原深圳市《公共建筑节能设计规范》SJG44-2018 同时废止。
    note: 合并重复提取片段
