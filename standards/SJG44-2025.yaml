    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables:
  - table_id: 表8.1.3
    type: parameter_table
    note: 条件→参数查表（OCR合并正文，行列结构缺失）
    content: 表8.1.3 的规定；党政机关、学校、医院等公共机构建筑可再生能源利用量应不小于屋面有效面积50%安装光伏系统时的年发电量；其他类型公共建筑可再生能源利用量应不小于屋面有效面积30%安装光伏系统时的年发电量。表8.1.3新建公共建筑可再生能源利用率建筑高度H（m）H≤24可再生能源利用率≥15%24<H≤5050<H≤75≥10%75<H≤100≥7%H>100≥5%≥3%注：可再生能源利用率计算可按附录E.0.4计算。
  - table_id: 表4
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 本条规定了新建建筑可再生能源利用指标的要求，本条两款规定了两种设计方法下光伏发电量要求，可根据项目情况选择其中一款执行。本条第1 款为根据建筑能耗计算结果及不同建筑高度的可再生能源利用比例要求确定可再生能源替代率要求。约定的是可再生能源利用规模的“目标”，可再生能源包括太阳能热水、空气源热泵及光伏发电。目的是鼓励通过建筑本体设计及主被动技术的应用，最大限度降低建筑能耗，当建筑本体能耗较低时，可再生能源利用率的目标实现相对更为容易。深圳地区建筑可再生能源应用类型以太阳能光伏发电为主。因此，建筑可再生能源利用率指标主要综合参考深圳地区公共建筑的运行监测数据、典型近零能耗办公建筑光伏自给率模拟结合和夏热冬暖地区近零能耗建筑示范项目运行数据的统计分析结果确定。根据深圳市大型公共建筑能耗监测平台中1000栋建筑基本信息及能耗监测数据，按照屋顶面积50%估算，测算深圳市办公、商业、酒店三类主要公共建筑的光伏发电量占建筑能耗的比例见表4。从表中可知，当建筑高度小于24m时，建筑光伏发电量占建筑能耗的比例可达到17.4%~50.1%；当建筑高度在24m~50m之间时，建筑光伏发电量占建筑综合能耗的比例可达到6%~21.2%；当建筑高度在50m~75m之间时，建筑光伏发电量占建筑综合能耗的比例可达到3.2%~11.3%；当建筑高度在75m~100m之间时，建筑光伏发电量占建筑综合能耗的比例可达到2.3%~8% ；当建筑高度大于100m时，建筑光伏发电量占建筑综合能耗的比例可达到1.4%~5.7%。由于深圳市大型公建能耗监测平台监测的为既有公共建筑能耗，建筑节能水平比按照本标准要求的建筑节能水平低，故光伏发电量占建筑综合能耗的比例偏低。表4深圳三类公共建筑光伏发电量占建筑能耗比例测算数据类型H≤2424＜H≤5050＜H≤7575＜H≤100H＞100商业建筑18.0%6.0%3.2%2.3%1.4%办公建筑50.1%21.2%11.3%8.0%5.7%续表4类型H≤2424＜H≤5050＜H≤7575＜H≤100H＞100酒店建筑17.4%7.7%4.1%3.0%2.4%根据对深圳市典型超低能耗办公建筑的光伏自给率（建筑本地消纳的光伏电量占扣除插座用电后的建筑年综合用电量）的模拟分析结果（见表5）：1）建筑光伏替代率随着建筑层数（建筑高度）的增加而减小；2）当建筑不配置储能系统且光伏发电不上网的情景下，考虑到建筑屋顶被周围环境遮挡、屋顶其他设备占用空间等因素，假设建筑屋顶面积50%可用于铺设光伏组件（考虑光伏组件安装间距及检修通道，光伏组件覆盖率约40%）时：建筑高度小于24m 时（6 层及以下），建筑光伏发电量占建筑综合能耗的比例可达到59%~78%；建筑高度在24m~50m 之间时（7 层~13 层），建筑光伏发电量占建筑综合能耗的比例可达33%~54%；建筑高度在50m~75m 之间时（14 层~20 层），建筑光伏发电量占建筑综合能耗的比例可达23%~33%；建筑高度在75m~100m 之间时（21 层~27 层），建筑光伏发电量占建筑综合能耗的比例可达18%~22%，建筑高度在100m~150m（28 层~41 层）之间时，建筑光伏发电量占建筑综合能耗的比例可达12%~17%；建筑高度在150m~200m 之间时（42 层~55 层），建筑光伏发电量占建筑综合能耗的比例可达9%~12%。表5深圳市典型近零能耗办公建筑光伏自给率模拟结果建筑高度H<24m24m≤H<50m50m≤H<75m75m≤H<100m100m≤H<150m150m≤H<200m建筑层数1≤N≤67≤N≤1314≤N≤2021≤N≤2728≤N≤4142≤N≤55光伏发电利用量/56%~74%31%~51%22%-29%16%-21%11%-16%8%-11%年总能耗（100%屋面）光伏发电利用量/118%~157%67%~108%46%-63%35%-44%24%-34%18%-24%年综合能耗（100%屋面）光伏发电利用量/28%~37%16%-25%11%-15%8%-10%6%-8%4%-6%年总能耗（50%屋面）光伏发电利用量/年综合能耗59%~78%33%-54%23%-33%18%-22%12%-17%9%-12%（50%屋面）根据对夏热冬暖地区超低能耗公共建筑建筑光伏自给率的实际运行数据的分析计算结果（见表6）：1）建筑光伏替代率随着建筑层数的增加而减少；2）当建筑高度小于24m 时（6 层及以下），建筑光伏发电量占建筑综合能耗的比例可达到59%~107%；建筑高度在24m~75m 之间时（7~20 层），建筑光伏发电量占建筑综合能耗的比例可达14%~41%；建筑高度在75m~100m 之间时（21 层~27 层），建筑光伏发电量占建筑综合能耗的比例可达12%~14%。对比建筑光伏替代率的实际运行结果和模拟结果可以发现，实际工程项目的建筑光伏替代率会略低于模拟结果，主要是由于实际建筑光伏替代率受光气候因素、建筑周围遮挡因素、光伏安装位置（立面和屋顶）及灰尘等诸多因素影响，会略低于模拟结果。表6夏热冬暖地区近零能耗建筑光伏自给率实测结果建筑高度H（m）H≤2424＜H≤5050＜H≤7575＜H≤100光伏发电量/年综合能耗-实测值59%-107%14%-41%14%12%因此，本标准中可再生能源利用率指标确定时，结合建筑光伏替代率的模拟结果和实测结果，参照不同高度（层数）范围内的工程项目可达到的建筑光伏自给率的低限值取。当建筑中采用太阳能光热系统和空气源热泵系统时，可再生能源利用率计算时，还应将太阳能光热系统和空气源热泵系统替代的常规能源量计入可再生能源利用量。《深圳市碳达峰实施方案》提出党政机关、学校、医院等公共机构建筑屋顶光伏覆盖率力争达到50%，其他类型公共建筑比例不低于30%。第2 款是为了简化设计计算，便于设计方案时统筹考虑，结合《深圳市碳达峰实施方案》提出可再生能源利用率/可再生能源利用量的量化要求。此处光伏安装面积包括光伏组件面积及必要的检修通道面积。屋面有效面积为屋面水平投影面积扣除因遮挡及必要的消防设施所占面积。光伏组件的设置应避免受自身、建筑本体及周边建筑的遮挡，在冬至日采光面上的日照时数不宜小于3h，因此在计算建筑屋顶有效面积时允许扣除日照时数小于3h的屋面面积。此外，消防车道、消防登高面等涉及安全设施的使用，此部分面积可予以扣除。通过步道、连廊、楼梯等直接连通市政道路、公园等市政设施供市民24 小时自由进出活动且高度低于24m的活动平台，可作为城市配套广场不计入屋面面积。作为塔楼配套供小区内部人员活动的裙房屋面应计入屋面面积。在进行光伏设计时宜采用建筑光伏一体化设计，光伏组件类型、安装位置应结合建筑方案合理设计，可按项目整体统筹考虑设置于屋顶、立面、场地及构筑物等适宜的位置。光伏组件的布置存在模数、排列、检修通道及立面效果等因素，避免因造型等因素导致光伏组件的面积比例过低，本条计算屋面光伏发电量当量时光伏组件占光伏面积的比例应按80%计算。光伏组件采用不同形式、安装在不同位置时，发电量不同，应结合光伏设计方案、遮挡、辐射强度及光伏组件效率进行光伏年发电量的分析计算，各部分的光伏发电量之和应该不低于计算得出光伏年发电量要求。光伏发电量计算应符合《民用建筑绿色性能计算标准》JGJ/T449 的要求，在计算当量综合年发电量时，光伏板应按水平无遮挡安装方式，参考薄膜组件光电转化效率按15%计算。如设计中选用转换效率更高/低的光伏组件时可根据本标准要求的光伏年发电量计算结果反推光伏组件面积要求，对于水平屋面需安装的光伏组件面积可按下式计算：A=× 1× 2×（3）式中：——屋面有效面积（m2），屋面水平投影面积扣除因遮挡及必要的消防设施面积；A——光伏组件面积（m2）；1——光伏覆盖率比例，党政机关、学校、医院等公共机构建筑取50%，其他类型公共2——光伏组件占光伏安装面积的比例，取80%；建筑取30%；1——光伏组件标准效率，取15%；2——光伏组件设计效率。
