  converted_tables:
  - raw: 本条款对大型公共建筑集中空调的空调制冷机房系统的能效提出了更高要求。根据历年深圳市大型公共建筑能耗监测系统数据，采用集中空调系统的大型公共建筑中，空调制冷机房系统运行能耗占建筑总运行能耗的比例大于25%。2019年6 月国家发展改革委等七部委联合印发了《绿色高效制冷行动方案》提出到2030 年，大型公共建筑制冷能效提升30%，制冷总体能效水平提升25%以上。根据《中国建筑节能年度发展研究报告2018》研究表明，广东省内部分建筑空调制冷机房系统全年平均能效2.5~3.0，存在较大的提升空间，提升空调制冷机房系统能效是进一步提升公共建筑节能率的重要技术措施。空调制冷机房系统能效指标值的制定综合考虑了国内外现行标准的指标值、夏热冬暖地区案例调研结果以及建筑节能模拟计算结果，高于国内现行标准的相关能效指标值的要求。空调制冷机房系统应在设计阶段计算空调制冷机房系统名义工况能效比，对空调制冷机房系统全年平均设计能效比预测分析，并确定空调制冷机房系统全年平均运行能效比的目标值；在施工和运行使用阶段按空调制冷机房系统全年平均运行能效比的目标值进行工程实施；在建筑投入使用且不少于一个完整的供冷期之后，对空调制冷机房系统全年平均运行能效比进行评价。
