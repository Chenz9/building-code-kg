  converted_tables:
  - raw: 本条规定了新建建筑可再生能源系统宜与分布式储能、柔性用电负荷一体化集成设计要求。可再生能源资源受气象条件的影响具有较大的波动性和不确定性，而且可再生能源资源供能量与建筑用能负荷需求不同步，导致大量的可再生能源资源无法有效利用。可再生能源系统与分布式储能系统（蓄冷、蓄热、蓄电、电动车双向充电设施等）、建筑柔性用电负荷（空调负荷、照明负荷、办公用电设备等）集成设计，可以利用储能系统和建筑柔性负荷“削峰填谷”，促进本地可再生能源消纳，提高可再生能源利用率，同时降低常规电源峰值负荷，增强建筑对电网的友好性。
