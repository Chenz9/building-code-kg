  - raw: 制冷机在制冷的同时需要排除大量的冷凝热，通常这部分热量由冷却系统通过冷却塔散发到室外大气中。采用具有冷凝热回收（部分或全部）功能的机组，将部分冷凝热或全部冷凝热进行回收予以有效利用具有显著的节能意义。参考《多联机空调系统工程技术规程》JGJ174-2010 总则的第1.0.2 条“本规程适用于在新建、改建、扩建的工业与民用建筑中，以变制冷剂流量多联分体式空调机组为主要冷热源的空调工程的设计、施工及验收。说明本规程”，多联式空调（热泵）系统可不执行本条规定。
