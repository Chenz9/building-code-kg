  standard_code: SJG 44-2025
  chapter: 5 空调与通风节能设计
  section: ''
  clause_no: 5.5.8
  text: 冷热源系统的控制功能应符合下列要求：应能进行冷水（热泵）机组、水泵、阀门、冷却塔等设备的顺序启停和连锁控制；应能与冷水机组自带控制单元建立通信连接，进行冷水机组的台数控制，应采用冷量优化控制方式；应能进行水泵的台数控制及流量优化控制方式；二级泵应能进行自动变速控制，宜根据管道压差控制转速，且压差宜能优化调节；应能进行冷却塔风机的台数控制，宜根据室外气象参数进行变速控制；应能进行冷却塔的自动排污控制；宜能根据室外气象参数和末端需求进行供水温度的优化调节；宜能按照累计运行时间进行设备的轮换使用；对于装机容量较大、设备台数较多的冷热源机房，宜采用机组群控方式；当采用群控方式时，控制系统应与冷水机组自带控制单元建立通信连接。
