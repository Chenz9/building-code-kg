  tables: []
  converted_tables:
  - raw: 本条参考《民用建筑直流配电设计标准》T/CABEE030-2022 第4.1.3 条，规定了太阳能光伏发电系统在屋顶安装的设计要求。屋顶是建筑外表面中接受太阳辐射最多的地方，也是可安装光伏面积较大且完整的区域。因此，屋顶光伏系统的安装容量、朝向、倾角与间距应根据安全、美观、负荷时间规律和投资收益等因素进行确定，侧重于考虑光伏发电量与经济性，兼顾美观性。光伏组件的发电量与太阳辐射强度、太阳辐射光谱、环境温度、光伏组件温度系数等因素有关。当光伏组件的方位角和倾斜角不同时，单位面积光伏组件接收到的太阳辐射量不同，因此发电量也会有变化，图3 显示了不同朝向和不同倾斜角下我国典型城市年发电量分布。图3光伏组件不同朝向和不同倾斜角安装时的年发电量对比当光伏组件安装倾角不同时，不仅年度发电总量不同，而且每个月份的发电量分布也不同。光伏组件水平安装时，夏季发电量较大，冬季发电量较小；以最佳倾斜角安装时，光伏组件全年发电量最大，且各月发电量较为平均；竖直安装时，光伏组件夏季发电量较小，而冬季发电量较大。由于我国位于北半球，夏季太阳高度角较高，因此水平面太阳辐射强度高，而竖直面太阳辐射强度低；冬季太阳高度角较低，因此水平面太阳辐射强度低，而竖直面太阳辐射强度高。以北京和广州为例，当光伏组件水平安装、南向最佳倾斜角安装和南向竖直安装时，光伏组件逐月发电量如图4 所示。考虑到我国南方地区夏季空调负荷较大，北方地区冬季采暖负荷较大，可以因地制宜根据负荷需求采用不同的安装方式，在尽可能实现光伏系统全年发电量最大的同时兼顾考虑光伏系统每月发电量与负荷需求的匹配性。图4光伏组件不同倾斜角安装时的逐月发电量对比考虑到组件间距（见图5），以最佳倾斜安装时单位屋顶面积发电量比水平安装光伏组件时的单位屋顶面积发电量低。因此，采用最佳倾斜角安装光伏组件和采用水平安装光伏组件可以产生不同的经济效益。当屋顶面积比较紧缺、并且对初投资不敏感，但是对光伏发电量占比有要求时，可以采用水平安装光伏组件，最大化利用占地面积（见图6），从而实现单位占地面积光伏发电量最大。而当屋顶面积充裕并且对投资性价比要求高时，可以采用最佳倾斜角安装光伏组件，虽然单位屋顶面积光伏发电量较低，但是单位面积光伏组件的发电量相比其他安装方式要高，投资收益最大。图5太阳能光伏阵列前后排间距计算示意图图6我国代表性城市光伏组件占地率随倾斜角变化示意图此外，设计时应同步考虑美观性。在实际项目中，还可以选择以介于最佳倾斜角和水平之间的某个角度进行安装，以追求包括光伏系统的初投资和屋顶租金在内的综合效益最大化。
    note: 合并重复提取片段
