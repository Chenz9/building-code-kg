- id: SJG 44-2025#8.1.2
  standard_code: SJG 44-2025
  chapter: 8 可再生能源应用
  section: ''
  clause_no: 8.1.2
  text: 经技术经济分析适宜时，可再生能源建筑应用系统宜与分布式储能系统、建筑柔性用电负荷一体化集成设计。
