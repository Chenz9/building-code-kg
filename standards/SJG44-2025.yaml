  text: 低压配电系统进行无功补偿时，应合理设置补偿装置，按补偿方式可以采用三相共补、分相补偿以及混合的方式，按安装位置可采用集中和就地补偿的方式。在安全、经济前提下，异步电机可采取就地补偿，提高功率因数，降低线路损耗。对于三相不平衡或单相配电的系统，宜采用分相无功自动补偿装置。无功补偿容量及功率因数应按当地供电单位规定，及现行国家标准《供配电系统设计规范》GB50052 及《民用建筑电气设计标准》GB51348 的相关要求设计。
