- id: SJG 44-2025#1.0.3
  standard_code: SJG 44-2025
  chapter: 1 总则
  section: ''
  clause_no: 1.0.3
  text: 公共建筑节能设计应遵循被动节能措施优先的原则，充分利用天然采光、自然通风，改善围护结构保温隔热性能，在保证生活和生产所必需的室内环境参数和使用功能的前提下，提高建筑设备及系统的能源利用效率，充分利用可再生能源，降低空调、通风、给水排水、照明及电梯系统的用能需求及化石能源消耗量。
  is_abolished: false
