- id: SJG 44-2025#5.3.1
  standard_code: SJG 44-2025
  chapter: 5 空调与通风节能设计
  section: ''
  clause_no: 5.3.1
  text: 空调冷、热水系统的设计应符合下列规定：应采用闭式循环水系统；只要求按季节进行供冷和供热转换的空调系统，应采用两管制水系统；当建筑物内有些空调区需全年供冷水，有些空调区冷、热水定期交替供应时，宜采用分区两管制水系统；全年运行过程中，供冷和供热工况频繁交替转换或需同时使用的空调系统，宜采用四管制水系统；对于冷水水温和供回水温差要求一致且各区域管路压力损失相差不大的中小型工程，单台水泵功率较大时，经技术和经济比较，在确保设备的适应性、控制方案和运行管理可靠的前提下，空调冷水可采用冷水机组变流量的一级泵变流量系统，且应保证冷水机组流量不低于允许的最低流量，一级泵应采用调速泵；系统作用半径较大、设计水流阻力较高的大型工程或各环路运行时间有明显区别的大型工程（如酒店、办公），空调冷水宜采用二级泵变流量系统。当各环路的设计水温一致且设计水流阻力接近时，二级泵宜集中设置；当各环路的设计水流阻力相差较大或各系统水温或温差要求不同时，宜按区域或系统分别设置二级泵。二级泵应采用调速泵；冷源设备集中设置且用户分散的区域供冷等大规模空调冷水系统，当二级泵的输送距离较远且各用户管路阻力相差较大，或者水温（温差）要求不同时，可采用多级泵系统，且二级泵等负荷侧各级泵应采用调速泵；冷水机组的冷水供、回水设计温差不应小于5℃。在技术可靠、经济合理的前提下宜尽量加大冷水供、回水温差；空调水系统的定压和膨胀，宜采用高位膨胀水箱方式；采用集中冷却的水环热泵空调系统，冷却水泵宜根据流量需求的变化采用变速变流量调节方式；采用水/水或汽/水热交换器间接供冷供热的循环水系统，负荷侧的二次水循环泵宜根据流量需求的变化采用变速变流量调节方式；应通过合理划分和均匀布置环路，并进行水力平衡计算，合理选用水管管径，减少各并联环路之间压力损失的相对差额；当相对差额大于15%时，应在计算的基础上，根据水力平衡要求配置必要的水力平衡装置；不宜采用增加平衡阀等辅助设备作为水力平衡的主要手段。
  is_abolished: false
