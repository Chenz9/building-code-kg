  converted_tables:
  - raw: 本条规定了新建建筑中可再生能源应用的基本要求。深圳地区建筑可再生能源类型主要有太阳能光伏、太阳能热水、空气源热泵等。可再生能源建筑应用系统设计时，需要结合资源条件、场地条件及用能负荷需求情况，进行技术适宜性和经济性分析，选择技术经济适宜的可再生能源类型；在同一项目用地范围内、不同建筑的可再生能源系统，宜进行统筹规划设计，以提高单位用地面积或单位屋顶面积的可再生能源产能量及经济效益；目前光伏技术发展较为成熟，具有较广泛的适用性，除了有稳定热水需求的酒店、医院等建筑，其他建筑及场地停车棚等宜优先采用太阳能光伏。
