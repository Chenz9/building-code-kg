- id: SJG 44-2025#8.1.3
  standard_code: SJG 44-2025
  chapter: 8 可再生能源应用
  section: ''
  clause_no: 8.1.3
  text: 新建公共建筑可再生能源利用规模应不低于下列规定之一： 1 可再生能源利用率应不低于表8.1.3 的规定； 2 党政机关、学校、医院等公共机构建筑可再生能源利用量应不小于屋面有效面积50%安 装光伏系统时的年发电量；其他类型公共建筑可再生能源利用量应不小于屋面有效面积30%安 装光伏系统时的年发电量。 表8.1.3 新建公共建筑可再生能源利用率 建筑高度H（m） 可再生能源利用率 H ≤24 ≥15% 24 < H ≤50 ≥10% 50 < H ≤75 ≥7% 75 < H ≤100 ≥5% H > 100 ≥3% 注：可再生能源利用率计算可按附录E.0.4 计算。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
