  - raw: 编制组调研了国内主要冷水机组生产厂家，根据本标准的节能目标要求进行分解，确定设备能效值。编制组通过组织专家研讨和厂家调研，冷量小于528kW的离心式冷水机组生产和销售已基本停止；水冷活塞式/涡旋式冷水机组大于528kW 的机组市场总销售量占比很小，冷量主要分布在小于528kW，而水冷活塞式冷水机组基本已不生产及销售，与相同的螺杆式或离心式相比能效相差较大，当所需容量大于528kw时，不建议选用水冷活塞/涡旋式机组。此外，《热泵和冷水机组能效限定值及能效等级》GB19577 中蒸气压缩循环冷水（热泵）机组的能效等级指标已不按活塞式/涡旋式/螺杆式/离心式类型进行区分。编制组结合专家研讨建议及厂家调研结果，对不同类型的冷水机组性能要求进行了合并简化。冷水（热泵）机组性能系数（COP）及综合部分负荷性能系数（IPLV）应同时满足《建筑节能与可再生能源利用通用规范》GB55015 的要求。依据《热泵和冷水机组能效限定值及能效等级》GB19577-2024，蒸气压缩循环冷水（热泵）机组的能效等级指标采用双通道评价指标，选取综合部分负荷性能系数（IPLV）或性能系数（COP）中的一个指标体系的能效值进行能效等级判定。本标准特别提出对于超出《建筑节能与可再生能源利用通用规范》GB55015的要求的指标，满足其中一种指标即可。双工况制冷机组制造时需照顾到两个工况工作条件下的效率，会比单工况机组低，因此不在本条适用范围内，不执行本条规定；水（地）源热泵不执行本条规定。双工况制冷机组、水（地）源热泵机组的性能系数应满足《蓄能空调工程技术标准》JGJ158、《地源热泵系统工程技术规范》GB50366 等相关标准规范的要求。
