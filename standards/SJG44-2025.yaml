- id: SJG 44-2025#3.0.6
  standard_code: SJG 44-2025
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.6
  text: 新建公共建筑应根据建筑及设备系统设计，进行建筑全年运行能耗预测计算。依据本标 准设计的公共建筑，应采取有效措施控制其施工、运营的节能性能质量，全年运行能耗指标不应 高于现行国家、地方公共建筑能耗标准的约束值以及《深圳经济特区绿色建筑条例》中关于运行 能耗的要求。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 不应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 《民用建筑能耗标准》GBT51161-2016、《公共建筑能耗标准》DBJ/T15-126、《深圳市公共建筑能耗标准》SJG34-2017、《深圳经济特区绿色建筑条例》等法规标准中均提出了公共建筑运行能耗约束值或限额值要求，因此在公共建筑节能设计中应同步考虑建筑运行能耗。全年运行能耗包括空调（含供暖）、通风、给水排水（含生活热水）、照明、电梯、动力设备、办公设备及其他配备设备的能耗，是建筑正常运行的全部能耗（特殊能耗除外）。需要特别说明的是本条中的运行能耗与本标准节能计算（权衡计算）的能耗范围不同，节能计算中的能耗范围仅包括与节能设计有关的能耗，如：空调（含供暖）、通风、照明、给水排水（含生活热水）及电梯系统的能耗；办公设备及其他配备设备的能耗属于功能性/工艺性用能需求，不含在节能计算（权衡计算）的能耗范围中。降低公共建筑运行能耗是实现深圳市碳达峰的重要路径，因此，在设计中宜充分考虑公共建筑的实际运行需求，设置数字能源管理系统，以实现真实降低运行阶段能耗的目标。鼓励设计中预留接入虚拟电厂平台的条件，以利于实现运行阶段参与电力需求响应，降低公共建筑运行碳排放。建筑与建筑热工节能设计深圳市地处我国东南沿海，受季风影响大，自然通风条件优越。建筑本体设计是实现更高节能目标的基础。进行建筑布局时，应根据通风时段的主导风向，通过建筑功能的合理布局和形态的设计，提升自然通风的效果。高度超过100m 的公共建筑宜专题论证自然通风效果，兼顾自然通风和防风的需求。
    note: 合并重复提取片段
