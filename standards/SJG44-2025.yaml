  standard_code: SJG 44-2025
  chapter: 6 电气节能设计
  section: ''
  clause_no: 6.3.3
  text: 符合本标准第6.3.2 条中规定的建筑物所采集的分类能耗、分项计量数据以及采用集中空调的公共建筑制冷系统的总供冷量应准确实时地传输至市级数据中心，并应保证计量、传输系统的正常运行；宜预留接入虚拟电厂平台的条件。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 虚拟电厂是一种通过先进信息通信技术和软件系统，实现分布式发电、储能系统、可控负荷、电动汽车等分布式能源的聚合和协调，以作为一个特殊电厂参与电力市场和电网运行的电源协调管理系统。未来，可再生能源的波动性、分布式能源的多样性将对传统电力系统运行调度的算法和算力构成严峻的挑战，而虚拟电厂的出现有望使得量大面广的分布式资源得以聚合和有序管理，从而填补传统电力系统对10kV以下配网的调节能力短板，为电网优化调度和韧性提升开辟一条新的路径。近年来随着需求响应的快速发展和电力市场改革的推进，建筑显著的负荷调节潜力正在被不断挖掘以参与电力系统供需互动，国内外已开展了一些建筑负荷调节的研究与应用，我国电力市场上也提供了建筑用户参与的产品和相关机制。因此，鼓励公共建筑在设计之处同步预留接入虚拟电厂平台的条件，以促进公共建筑在运行阶段参与电力需求响应，降低运行碳排放。
