- id: SJG 44-2025#3.0.5
  standard_code: SJG 44-2025
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.5
  text: 新建公共建筑运行碳排放强度应符合国家和深圳的碳排放要求。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables:
  - table_id: 表1
    type: parameter_table
    note: 条件→参数查表（OCR合并正文）
    content: 根据《建筑节能与可再生能源利用通用规范》GB55015-2021 第2.0.3 条，新建的居住和公共建筑碳排放强度应分别在2016年执行的节能设计标准的基础上平均降低40%，碳排放强度平均降低7kgCO2/(m2.a)以上。碳排放计算范围为运行碳排放，包括正常运行时由于能源消耗所产生的碳排放，不包括建筑生命周期的其他阶段，如生产、运输、建造和拆除阶段的碳排放，具体包括空调、通风、供暖（如有）、照明、生活热水及电梯能耗导致的运行碳排放，不包括插座用电及特殊能耗产生的碳排放。碳排放强度下降指标7kgCO2/(m2.a)为平均指标，由于不同建筑能耗强度差异大，因此对于单个建筑的节能设计，碳排放报告中仅需与按《公共建筑节能设计标准》GB50189-2015的参照建筑碳排放值进行比对，满足下降40% 或碳排放强度下降7kgCO2/(m2.a)视为满足本条要求。碳排放计算方法应符合《建筑碳排放计算标准》GB/T51366的要求，当有地方规定时应同步执行地方标准的规定。碳排放强度指标指建筑正常运行时建筑空调（含供暖）、通风、给水排水（含生活热水）、照明、电梯系统所使用的能源消耗所产生的碳排放，不包括插座用电及特殊能耗产生的碳排放，也不包括建筑生命周期生产、运输、建造和拆除阶段的碳排放。电力=σ×当采用蓄电、蓄冷等利用峰谷能源的措施，其利用的低谷能源碳排放按下列公式计算。=0=×（1）（2）E电力——运营期CO2 排放量，单位为吨（tCO2）；式中：ACi——逐时电量，单位为兆瓦时（MWh）；EFi——电力消费的动态CO2 排放因子，单位为吨/兆瓦时（tCO2/MWh），当无详细K——动态碳排放因子折算系数，为低谷能源费用单价与日平均能源费用单价的比数据时可按式D.0.2-2 计算；值，当无详细数据时可取0.30。主要能源碳排放因子应参考国家或地方最新的发布数据，此处列出主意能源碳排放因子供设计人员参考。表1主要能源碳排放因子折二氧化碳系数/固碳系数能源品种折标煤系数原煤0.7143kgce/kg1.9003kg-CO 2/kg天然气1.3300kgce/m32.1650kg-CO 2/m3续表1能源品种折标煤系数折二氧化碳系数/固碳系数洗精煤0.9000kgce/kg2.1182kg-CO 2/kg焦炭0.9714kgce/kg2.6482kg-CO 2/kg原油1.4286kgce/kg3.0752kg-CO 2/kg汽油1.4714kgce/kg3.0425kg-CO 2/kg柴油1.4571kgce/kg3.1451kg-CO 2/kg燃料油1.4286kgce/kg3.0472kg-CO 2/kg1.4714kgce/kg3.1517kg-CO 2/kg煤油1.7143kgce/kg2.9240kg-CO 2/kg液化石油气炼厂干气1.5715kgce/kg3.0116kg-CO 2/kg其他石油制品1.4286kgce/kg2.8890kg-CO 2/kg电力0.1229kgce/kWh0.4512kg-CO 2/kWh碳汇/1.95tCO 2/公顷注：表中能源碳排放因子摘自深圳市生态环境局2020年发布的《深圳市近零碳排放区试点建设实施方案》。此处列出常见节能建筑运行碳排放量测算值供设计人员参考。表2节能建筑碳排放强度值（单位kgCO2/m2.a）建筑类别单位面积碳排放量党政机关办公建筑办公建筑商业办公建筑三星级及以下酒店建筑四星级五星级大型百货店商业建筑大型购物中心大型超市三级医院医院建筑其他医院注：以上碳排放因子按0.4512kg-CO 2/kWh进行计算。
