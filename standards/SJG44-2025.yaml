  chapter: 附录D 围护结构热工性能的权衡计算
  section: ''
  clause_no: D.0.2
  text: 围护结构热工性能的权衡判断应按照下列步骤进行：进行围护结构热工性能权衡判断前，应对设计建筑的下列热工性能进行核查：屋面传热系数应不大于0.4W/(m2·K)；外墙包括(非透光幕墙)的传热系数应不大于1.5W/(m2·K)；外窗(包括透光幕墙)与屋顶透光部分的综合太阳得热系数SHGC 应符合本标准D.0.1 的规定；根据设计建筑生成参照建筑；计算参照建筑在规定条件下的全年空调能耗（含供暖）；将参照建筑的全年空调能耗作为设计建筑的全年空调能耗限值；计算设计建筑的全年空调能耗，如大于参照建筑的全年空调能耗限值，应调整窗墙面积比或围护结构热工性能参数，使设计建筑的全年空调能耗不超过限值。调整后不超过参照建筑全年空调能耗限值的建筑，可判定其围护结构的总体热工性能符合节能要求。
