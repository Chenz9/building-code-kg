  tables: []
  converted_tables:
  - raw: 本条依据《建筑节能与可再生能源利用通用规范》GB55015-2021的要求，明确提出主要功能房间均应有开启扇或通风换气装置。结合《深圳市公共建筑节能设计规范》SJG44-2018的要求，对于办公建筑、酒店建筑、学校建筑、医疗建筑及公寓建筑的100m 以下部分外窗及幕墙可开启具有较好的实施性，同时对节能的贡献较大，因此保留了原条文要求。对于100m 以上部分的外窗及幕墙，本标准未提出明确数量要求，宜通过模拟分析综合考虑安全的前题下采用适当的自然通风或机械通风的方式，降低过渡季空调能耗。当同一房间若同时存在外窗和透光幕墙时，开启面积可以根据设计需要及通风效果在外窗、幕墙上统筹布置。考虑到目前部分建筑因政策及其他标准要求不能采用幕墙形式而是采用外墙通窗的做法，参考幕墙及广东省节能设计标准的要求，当外窗可开启扇的有效通风换气面积达到所在房间外墙面积的10%时，可视为满足可开启面积的要求。当可开启窗扇设置在2m 以上等不便于开启的位置时，应设有便于开启的手动或自动控制开关，以保障可开启扇的有效使用。考虑深圳市气候特点，综合工程实际的可行性、经济性及可持续性因素，本标准围护结构热工参数与《建筑节能与可再生能源利用通用规范》GB55015-2021 的要求一致。单一立面窗墙面积比的定义为建筑某一个立面的窗户洞口面积与该立面总面积之比。屋顶或顶棚面积，应按支承屋顶的外墙外包线围成的面积计算。外墙面积，应按不同朝向分别计算某一朝向的外墙面积，由该朝向的外表面积减去外窗面积构成，外窗（包括阳台门上部透光部分）面积，应按不同朝向和有无阳台分别计算，取洞口面积。外门面积，应按不同朝向分别计算，取洞口面积。阳台门下部不透光部分面积，应按不同朝向分别计算，取洞口面积。在某一建筑立面出现凸凹时计算窗墙面积比，其外墙总面积计算相当于把凸凹的面积拉伸进行计算，即在单一立面(某一立面)凸凹的面积和非凸凹的外墙面。同理单一立面窗洞口面积等于凸凹面上窗的面积和非凸凹的外墙上窗洞口的总面积。单一立面的划分通常可依照建筑立面图设置，较为规则的建筑通常包括四个单一立面。同一朝向的两个方向的立面应作为两个独立的单一立面设置，如图1 西立面1、西立面2 和东立面1、东立面2；同一立面归属不同朝向时也应作为两个独立的单一立面设置，如图2 圆弧应根据附录
