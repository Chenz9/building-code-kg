  text: 空调制冷机房系统全年平均设计能效比计算应符合下列规定：宜优先采用具备全年8760 小时逐时负荷和建筑能耗计算功能的建筑能耗模拟软件建立能耗仿真模型，并按设计文件设置空调冷源系统设备，根据全年逐时负荷及空调能耗计算得出；当不具备模拟计算条件采用简化计算时应根据25%、50%、75%、100%负荷率下空调冷源系统设备的设计运行模式计算得出不同负荷率下制冷机房系统设计能效值；其次，通过围护结构模拟计算工具计算得出全年8760 小时逐时负荷，统计得出（0%~25%]，（25%~50%]，（50%~75%]，（75%~100%]各区间负荷率下的全年累计冷负荷后按下式计算：AEERBEERCEERDEER（E.0.3）EER25%50%75%100%adABCDEERad——制冷机房系统全年平均设计能效比；式中：EER25%——25%负荷率下制冷机房系统设计能效值；EER50%——50%负荷率下制冷机房系统设计能效值；EER75%——75%负荷率下制冷机房系统设计能效值；EER100%——100%负荷率下制冷机房系统设计能效值；A——（0%~25%]负荷率区间的累计冷负荷；B——（25%~50%]负荷率区间的累计冷负荷；C——（50%~75%]负荷率区间的累计冷负荷；D——（75%~100%]负荷率区间的累计冷负荷。
