- id: SJG 44-2025#1.0.2
  standard_code: SJG 44-2025
  chapter: 1 总则
  section: ''
  clause_no: 1.0.2
  text: 本标准适用于深圳市新建、扩建和改建公共建筑的节能设计。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: null
    modal_words: []
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 本标准适用于深圳市各类新建、扩建和改建的公共建筑。扩建是指保留原有建筑，在其基础上增加另外的功能、形式、规模，使得新建部分成为与原有建筑相关的新建建筑；改建是指对原有建筑的功能或者形式进行改变，而建筑的规模和建筑的占地面积均不改变的新建建筑。既有建筑节能改造是在建筑原有功能不变的情况下，对建筑围护结构及用能设备或系统的改善。既有建筑节能改造项目中涉及改造的部分应符合本标准要求。民用建筑又分为居住建筑和公共建筑，其中公共建筑主要包括以下类型的建筑：办公建筑：政府办公楼、商务办公楼、企事业单位办公楼、工业用地中的研发用房等；商业服务建筑：百货商场、专业商店、银行、商业网点建筑等；宾馆饭店建筑：酒店、采用集中空调的旅馆、餐馆等；文化场馆建筑：展览馆、博物馆、图书馆、档案馆、文化馆、纪念馆等；科研教育建筑：各类学校教学楼与办公楼、实验室、科研楼等；医疗卫生建筑：综合医院、专科医院、社区医疗所、康复中心、急救中心等；体育建筑：体育馆、游泳馆、健身房等；通信建筑：邮政楼、电信楼、广播电视建筑等；交通建筑：汽车客运站、铁路旅客站、港口客运站、空港航站楼、城市轨道客运站等；影剧院建筑：电影院、剧院、音乐厅、歌舞厅等；大型综合体建筑；其他公共建筑。公寓及商务公寓根据使用功能确定，公寓中不超过总面积10%的大堂及配套建筑按主体功能合并计算；当采用集中风管式的中央空调系统时，可按公建计算。当一栋建筑内既有居住建筑，又有公共建筑时，其公共建筑部分应按照本标准进行节能设计，其居住建筑部分应按照居住建筑节能设计标准进行节能设计。不适用于没有设置供暖、空调系统的工业建筑，也不适用于宗教建筑等有特殊要求的公共建筑，战争、自然灾害等不可抗条件下对建筑节能与可再生能源利用的要求。对使用期限为2 年以下的临时建筑、交通岗亭、报刊亭、30m2以下的独立门卫值班室、独立建筑的公共厕所、垃圾站不做强制要求，可参照执行。本标准只规定节能性能及相关节能技术措施，与节能措施相关的防火、电气及结构安全方面的要求，应按响应工程建设强制性规范执行。
    note: 合并重复提取片段
