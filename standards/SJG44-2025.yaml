  - raw: 随着LED灯的发展，近年来深圳地区越来越多使用LED灯，因此照明功率密度有了大幅度降低。根据验收项目的现场照明功率密度检测数据统计，主要功能房间可达到《建筑照明设计标准》GB50034-2013现行值的50%，设备房为现行值的30%，结合深圳地区碳达峰及本标准节能目标的要求，因此有必要将主要功能房间照明功率密度值在现行国家标准《建筑节能与可再生能源利用通用规范》GB55015 的基础上提升。此外，考虑到照明设计还需要结合房间功能需求、房间体型、眩光限值和配光要求限制以及光源的多样性，对部分房间当采用荧光灯等其他节能灯具时，较难达到此条照明功率密度要求，其照明功率密度值可增加，但不得超出本标准第
