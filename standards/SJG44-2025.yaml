- id: SJG 44-2025#6.2.1
  standard_code: SJG 44-2025
  chapter: 6 电气节能设计
  section: ''
  clause_no: 6.2.1
  text: 应通过负荷计算，合理确定变压器容量及台数，并应满足下列要求：各变压器设计负荷率宜控制在70%~85%范围内以减少变压器自身能耗，配电变压器的能效等级应不低于现行国家标准《电力变压器能效限定值及能效等级》GB20052 的2 级要求；宜按《民用建筑电气设计标准》GB51348 的变压器容量指标节能值进行变压器容量设计，并宜结合附录K 中同类建筑的实际运行数据进行变压器台数及运行方式设计，实现变压器经济运行。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters:
  - name: 率宜控制在
    unit: '%'
    condition: null
    min_value: 70.0
    max_value: 70.0
  - name: 率宜控制在
    unit: '%'
    condition: null
    min_value: 85.0
    max_value: 85.0
  tables: []
  converted_tables:
  - raw: 《建筑节能与可再生能源利用通用规范》GB55015-2021要求电力变压器应高于能效限定值或能效等级3 级的要求，《公共建筑节能设计标准》GB50189-2015 要求变压器能效值不应低于GB20052-2013中能效标准的节能评价值。而《电力变压器能效限定值及能效等级》GB20052-2020的能效限定值相当于《三相配电变压器能效限定值及能效等级》GB20052-2013节能评价值的要求，本条保留了变压器能效等级不低于现行国家标准《电力变压器能效限定值及能效等级》GB20052的2级要求，实际上相对《建筑节能与可再生能源利用通用规范》GB55015-2021 提高了设计要求。由于超低能耗建筑和近零能耗建筑的计算范围不含插座用电，为响应并跟踪超低能耗建筑和近零能耗建筑在运行阶段的实际运行能耗，对于有条件的建筑宜将插座用电独立计量。对于底部裙楼为商业建筑的综合体建筑，由于每个商铺需要独立计量收取电费，不利于将空调及照明用电分开设置，因此6.3.2 条第2 款中明确针对采用集中空调系统的公共建筑，集中空调系统是指一个空调系统供应多个区域或多个用户的用冷量时，空调系统并非从每一户或区域单独供应，对于此种情况，具备较好的做分项计量的条件。如不设新风系统的多联机系统、每户独立空调等，不属于此类情况。
    note: 合并重复提取片段
  references:
