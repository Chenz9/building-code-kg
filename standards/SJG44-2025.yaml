  text: 给水系统加压设备设计应符合下列规定：给水设备在满足卫生安全、经济合理的原则下，宜采用变频、叠压等节能加压供水设备；采用叠压供水方式时，应取得当地供水行政主管部门及供水部门批准，并不得造成该地区城镇供水管网供水压力低于本地规定的最低供水压力；生活给水系统采用变频调速泵组时，应根据用水量和用水均匀性等因素合理选择大泵、小泵搭配及调节设施，并宜配置气压罐，供小流量用水，避免大泵频繁启动；变频调速泵在额定转速时的工作点，应位于水泵高效区的末端；生活给水系统加压水泵应根据给水管网水力计算配置水泵数量与选型，并应保证设计工况下水泵效率处在高效区；且水泵效率不宜低于现行国家标准《清水离心泵能效限定值及节能评价值》GB19762 规定的水泵节能评价值。
