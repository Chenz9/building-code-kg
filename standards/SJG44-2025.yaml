- id: SJG 44-2025#A.0.2
  standard_code: SJG 44-2025
  chapter: 附录A 建筑节能设计文件编制
  section: ''
  clause_no: A.0.2
  text: 公共建筑施工图的绿色专篇节能章节应包括下列内容：节能设计说明应包括下列内容：1）基本情况；2）节能设计依据；3）建筑、空调、通风、电气、给排水及可再生能源等节能措施；4）围护结构主体材料及保温材料热工性能参数；5）围护结构热工性能指标（可列表说明）；6）参照建筑和设计建筑的全年空调能耗指标（当围护结构的设计指标不能达标时应进行权衡判断）。节能设计图纸应包括下列内容：1）围护结构节能构造做法详图或标准图索引；2）其他节能构配件详图（如外遮阳设施）或标准图索引；3）建筑、空调、通风、电气、给排水及可再生能源等设计图纸。节能计算书应包括下列内容：1）各朝向窗墙面积比的计算；2）外窗可开启面积与外窗总面积的比值计算；3）屋顶透光部分面积与屋顶总面积的比值计算；4）屋顶平均传热系数Km、平均热惰性指标Dm 的计算；5）外墙平均传热系数Km、平均热惰性指标Dm 的计算；6）底面接触室外空气的架空或外挑楼板传热系数K 的计算；7）外窗外遮阳系数SD 和外窗太阳得热系数SHGC 的计算；8）参照建筑和设计建筑全年空调能耗指标的计算（当围护结构的设计有任何一项不满足本标准第4.2.2、4.3.1 和4.3.2 条时，则应进行该项计算）；参照建筑和设计建筑全年空调能耗指标的计算应包括：输入的边界条件、采用的模拟软件、输出结果、输出结果分析等；9）空调系统热负荷和逐项逐时的冷负荷计算书；10）风机的单位风量耗功率计算；11）空调冷、热水系统的水力计算；12）空调高效机房计算书；13）建筑材料、部品、构件及设备选择的节能性能要求等。
