- id: SJG 44-2025#7.2.2
  standard_code: SJG 44-2025
  chapter: 7 给排水节能设计
  section: ''
  clause_no: 7.2.2
  text: 给水系统节能设计应符合下列规定：给水系统应充分利用城镇给水管网或小区给水管网的水压直接供水，经当地供水行政主管部门及供水部门批准可采用直接从城镇给水管网吸水的叠压供水系统；应综合城镇给水管网的水压、建筑物用途、层数、层高、用水要求、材料设备性能、维护管理、节约供水和能耗等因素确定给水系统竖向分区；应合理采取减压限流节水措施，确保分区压力和用水点处压力满足现行国家标准《建筑给水排水设计标准》GB50015 及《民用建筑节水设计标准》GB50555 的相关规定；二次加压泵站的数量、位置、规模和供水压力应根据城镇给水条件、建筑规模、建筑高度、建筑分布、使用标准、安全供水和降低能耗等因素合理确定，且宜靠近用水大户；二次供水加压设施服务半径应符合当地供水主管部门的要求，并不宜大于500m，且不宜穿越市政道路；应按使用用途、付费或管理单元，分类、分级设置用水计量装置，并宜采用远传计量系统。
