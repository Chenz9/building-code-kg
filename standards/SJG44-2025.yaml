  text: 建筑围护结构的传热计算取值和参数计算必须符合下列规定：必须在设计文件中注明选用的节能材料或产品的性能指标要求，当选用的建筑材料热工性能不明确时，应以法定检测机构的检测报告或模拟计算报告提供的数据为依据；外墙的传热系数应为包括结构性热桥在内的平均传热系数，外墙平均传热系数和外窗（包括透光幕墙）的传热系数应按现行国家标准《民用建筑热工设计规范》GB50176 的相关规定计算；单层围护结构的传热系数应按下式计算：K1/(R0.16)（C.0.3-1）R（C.0.3-2）δ式中：λ——单层材料的厚度（m）；——单层材料的导热系数[W/（m·K）]。多层围护结构的传热系数为：K/(RRRR)（C.0.3-3）ijeRj（C.0.3-4）jRi——内表面换热阻，取0.11(m2·K)/W；j式中：Re——外表面换热阻，取0.05(m2·K)/W；Rj——第j 层材料的热阻[(m2·K)/W]；δjλj——第j 层材料的厚度（m）；——第j 层材料的导热系数[(m2·K)/W]。外墙、屋面的传热系数应为包括结构性热桥在内的平均传热系数，当幕墙与其室内侧的建筑构件（楼层边框梁、防火棉封堵及窗台墙）组成复合外墙面且上下具有封口板时可作为非透明幕墙参与外墙平均传热系数计算，并应按下式计算：=+σ+σ（C.0.3-5）Km式中：——外墙、屋面的平均传热系数[W/(m2·K)]；KP——外墙主体部位的传热系数[W/(m2·K)]，按现行国家标准《民用建筑热工设计规范》GB50176 的规定计算；KBi——外墙周边热桥部位的传热系数[W/(m2·K)]，按现行国家标准《民用建筑热工设计规范》GB50176 的规定计算；AP——外墙主体部位的面积（m2）；ABi——外墙周边热桥部位的面积（m2）；透光围护结构的传热系数应按下式计算：=σ+σ+σσ+σ+σ（C.0.3-6）K式中：Ag——透光面板面积（m2）；Kgc——透光面板中心的传热系数[W/(m2·K)]；——幕墙单元、门窗的传热系数[W/(m2·K)]；Ap——非透光面板面积（m2）；Kpc——非透光面板中心的传热系数[W/(m2·K)]；Af——框面积（m2）；Kf——框的传热系数[W/(m2·K)]。D<2.5 的轻质屋顶和东西向外墙，还应满足现行国家标准《民用建筑热工设计规范》GB50176 所规定的隔热要求；单层材料围护结构的热惰性指标应按式C.0.3-7 计算，多层材料围护结构的热惰性指标应按式C.0.3-8 计算。DRS（C.0.3-7）R式中：S——单层材料的热阻[(m2·K)/W]；——单层材料的蓄热系数[W/(m2·K)]。（C.0.3-8）D(RjS)Rj——第j 层材料的热阻[(m2·K)/W]；j式中：Sj——第j 层材料的的蓄热系数[W/(m2·K)]。计算外墙隔热验算时应按照短板不利原则，当外墙为同类结构材质时应取其厚度薄的墙体，而当外墙为不同的结构材质时应取其热惰性指标（D）小的墙体；楼梯间外墙有通向室外的常开开口时可不考虑传热系数的限制；电梯间的外墙在选型时也应考虑传热系数的限制；凸出外墙外表面不超过800mm 的凸窗顶部、底部和侧墙非透光部分可不考虑传热系数的限制；地下车库的顶板可不考虑传热系数的限制。
