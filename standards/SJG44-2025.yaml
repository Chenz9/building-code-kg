  text: 公共建筑的通风，应符合以下节能原则：应优先采用自然通风排除室内的余热、余湿量或其他污染物；当自然通风不能满足室内空间的通风换气要求时，应设置机械进风系统、机械排风系统或机械进排风系统；建筑物内产生大量热湿以及有害物质的部位，应优先采用局部排风，必要时辅以全面排风；当通风系统使用时间较长且运行工况（风量、风压）有较大变化时，通风机应采用变频或直流变速风机。
