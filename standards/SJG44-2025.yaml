- id: SJG 44-2025#8.2.2
  standard_code: SJG 44-2025
  chapter: 8 可再生能源应用
  section: ''
  clause_no: 8.2.2
  text: 太阳能光伏发电系统安装在公共建筑立面时，应考虑光伏组件与建筑围护结构的融合度和美观性进行一体化设计，并综合考虑光伏组件的发电量、吸收率、发射率、透射率和周围建筑遮挡等因素，出具经济技术分析报告，使系统的节能、采光、热舒适性综合效益最大化。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 本条参考《夏热冬暖地区净零能耗公共建筑技术导则》T/CABEE004-2019 第7.2.3 条，规定了太阳能光伏发电系统在立面安装时设计要求。立面安装的太阳能光伏系统应与建筑围护结构一体化设计，充分考虑光伏系统与建筑围护结构的融合度和美观性，同时还要兼顾光伏系统对建筑的节能效益最大化。立面安装的单位面积的太阳能光伏系统虽然发电量没有屋顶以最佳倾斜角安装的光伏系统多，但是立面光伏系统除了发电外，还可以通过减少太阳得热量从而减少室内空调能耗，因此在衡量其节能效益时，应综合考虑其发电量和空调节能收益。尤其是半透明光伏窗或光伏幕墙，其单位面积的空调节能收益往往远大于其发电量，因此，在设计立面光伏系统时应使得系统的综合节能效益最大化。同时，半透明光伏窗或光伏幕墙还会对室内光环境和热舒适性产生影响。因此，在立面光伏系统设计时，不仅要考虑节能性能，还要考虑其对光环境和热舒适性的影响。对室内光环境和视觉舒适性起决定性作用的参数就是半透明光伏组件的透射率，实际工程设计中应该根据应用场合的照度需求来确定半透明光伏组件的透射率，通常情况下，光伏组件的透射率可以选择30%~35%，对于采光需求略低的场所透射率可以选择20%~25%。对于热舒适性起决定性作用的参数是光伏组件的吸收率和红外发射率。由于光伏组件的吸收率和红外发射率都很高，直接使用双玻半透明光伏组件作为窗户或者玻璃幕墙时会导致夏季窗户的内表面温度过高而冬季内表面温度偏低的现象。因此，在实际工程中，往往不会单独使用双玻半透明光伏组件作为窗户或玻璃幕墙，而是将双玻半透明光伏组件制作成中空玻璃或者双层通风玻璃幕墙的形式来改善其热性能，从而一方面可以减少光伏窗/光伏幕墙带来的空调能耗，另一方面可以改善室内热环境。
    note: 合并重复提取片段
