    max_value: 5.0
  tables: []
  converted_tables:
  - raw: 从节能角度，本条对热水供应系统的选择作出了相应规定。有集中供应热水要求的公共建筑，能很好实行集中管理，采用集中热水供应系统，即可确保热水供应系统使用的舒适性和安全性，也可实现集中统一管理的节能；对于分散用水点热水日用水量（按60°C）小于5m³时的热水系统，因设置集中热水供应系统，其系统的热损失相对较大，因此宜采用局部热水供应系统；对于热水使用具有每日固定时段时，采用定时集中热水供应系统，可有效减少能耗；对于公共建筑中设有较大公共浴室、洗衣房、厨房等耗热量较大且用水时段较固定的用水部位，设独立的热水管网定时供应热水或设局部热水供应系统，可通过精细化管理，有效控制能源的消耗；当多栋建筑有热水供应需求时，采用共用热水供应系统，可实现集中统一管理节能。
