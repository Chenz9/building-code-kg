- id: SJG 44-2025#4.2.5
  standard_code: SJG 44-2025
  chapter: 4 建筑与建筑热工节能设计
  section: ''
  clause_no: 4.2.5
  text: 公共建筑中主要功能房间的外窗（含透光幕墙）应设置可开启扇或通风换气装置并满足下列规定：办公建筑、酒店建筑、学校建筑、医疗建筑及公寓建筑的100m以下部分，主要功能房间外窗的可开启扇有效通风换气面积不应小于该房间外窗面积的30%，透光幕墙应具有不小于房间透光幕墙面积10％的有效通风换气面积；外窗的有效通风换气面积占外窗面积的比例应以一个房间中的所有外窗计算；同一房间若同时存在外窗和透光幕墙时，可开启面积可合并计算，且不少于两者之和；外窗（包括透光幕墙）的有效通风换气面积应为可开启扇面积和窗开启后的空气流通界面面积的较小值；主要功能房间是指公共建筑内除室内交通、卫浴、大堂等之外的人员长期停留房间；可开启扇应便于开启，高位开启扇应在人员活动高度处设置开启装置。
  is_abolished: false
