- id: SJG 44-2025#1.0.4
  standard_code: SJG 44-2025
  chapter: 1 总则
  section: ''
  clause_no: 1.0.4
  text: 深圳市公共建筑的节能设计，除应符合本标准的规定外，尚应符合国家、广东省和深圳 市现行有关强制性标准和法规政策的规定。
