  text: 根据深圳市建筑能耗管理系统近三年各类建筑变压器有功电能逐时监测数据，提供变压器容量指标、变压器峰值负载率和长期运行负载率范围的实际数据供设计人员参考，具体数据可参考表K.0.1-1、K.0.1-2。表K.0.1-1建筑变压器实际运行数据参考建筑建筑面积变压器容量指标近三年变压器峰值负长期运行（万m2）（VA/m2）载率负载率范围政府办公A2.753.373.1%62.3%~66.4%政府办公B1.575.737.2%21.2%~26.6%政府办公C6.5104.642.5%32.1%~36.5%政府办公D1.1137.349.3%31.2%~35.4%政府办公E1.069.3%30.5%~31.1%商业办公A6.052.059.6%35.3%~36.8%商业办公B5.475.360.4%41.0%~43.8%商业办公C8.699.435.1%23.0%~27.4%商业办公D3.6123.342.9%28.3%~31.3%商业办公E2.1176.530.2%19.7%~26.1%商场建筑A-家居百货3.172.869.5%45.4%~51.8%商场建筑B-日用百货100.843.7%35.5%~52.3%商场建筑C-超市1.2172.759.7%41.8%~49.3%商场建筑D-购物中心8.475.462.5%40.9%~42.2%商场建筑E-购物中心10.1138.967.5%43.2%~51.9%宾馆饭店A-五星5.680.457.2%31.0%~34.4%宾馆饭店B-四星1.765.648.4%31.2%~39.1%宾馆饭店C-三星3.050.2%33.6%~43.9%注：1变压器负载率=逐时有功电能/（变压器容量*功率因素）；长期运行负载率范围指在该类建筑正常营运时间段中，时间占比95%以上的运行负载率区间。表K.0.1-2建筑变压器实际运行数据（四分位数）95%的建筑变压器设计上限实际75%的建筑变压器满变压器实际运行峰值用电值建筑类型参考范围足用电需求的容量设计值（W/m2）（VA/m2）（VA/m2）国家机关办公建筑30~4798~11160~68商业办公建筑29~4588~100商场建筑53~79146~165103~117宾馆饭店建筑27~4081~9243~49注：1四分位数：是统计学中分位数的一种，即把所有数值由小到大排列并分成四等份，处于三个分割点位置的数值就是四分位数。2根据实际用电需求，综合考虑功率因素和变压器负载率情况，折算理论变压器设计容量，参考变压器上限负载率范围75%~85%计算。本标准用词说明为了便于在执行本标准条文时区别对待，对要求严格程度不同的用词说明如下：1）表示很严格，非这样做不可的用词：正面词采用“必须”，反面词采用“严禁”；2）表示严格，在正常情况下均应这样做的用词：正面词采用“应”，反面词采用“不应”或“不得”；3）表示允许稍有选择，在条件许可时首先应这样做的用词：正面词采用“宜”，反面词采用“不宜”；4）表示有选择，在一定条件下可以这样做的用词，采用“可”。条文中指明应按其他有关的标准执行的写法为“应符合……的规定”或“应按……执行”。引用标准名录《建筑给水排水设计标准》GB50015《建筑照明设计标准》GB50034《供配电系统设计规范》GB50052《民用建筑热工设计规范》GB50176《公共建筑节能设计标准》GB50189《智能建筑设计标准》GB50314《民用建筑节水设计标准》GB50555《民用建筑供暖通风与空气调节设计规范》GB50736《民用建筑电气设计标准》GB51348《建筑节能与可再生能源利用通用规范》GB55015《建筑环境通用规范》GB55016《通风机能效限定值及能效等级》GB19761《清水离心泵能效限定值及节能评价值》GB19762《热泵和冷水机组能效限定值及能效等级》GB19577《电力变压器能效限定值及能效等级》GB20052《近零能耗建筑技术标准》GB/T51350《建筑碳排放计算标准》GB/T51366《设备及管道绝热设计导则》GB/T8175《空气过滤器》GB/T14295《灯和灯系统的光生物安全性》GB/T20145《建筑幕墙》GB/T21086《建筑幕墙、门窗通用技术条件》GB/T31433《LED 室内照明应用技术要求》GB/T31831《体育场馆照明设计及检测标准》JGJ153《城市夜景照明设计规范》JGJ/T163《公共建筑能耗远程监测系统技术规程》JGJ/T285《深圳市电动自行车充电库（棚）工程技术规程》SJG39《公共建筑集中空调自控系统技术规程》SJG65《中小学校项目规范》SJG120《电动汽车充电系统技术规范第2 部分：充电站及充电桩设计规范》SZDB/Z29.2深圳市工程建设地方标准公共建筑节能设