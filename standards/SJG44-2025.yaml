  converted_tables:
  - raw: 依据工业和信息化部发布的《光伏制造行业规范条件（2021 年本）》，新建和改扩建企业及项目产品应满足以下要求：多晶硅组件和单晶硅组件（双面组件按正面效率计算）的平均光电转换效率分别不低于18.4%和20%；硅基、CIGS、CdTe及其他薄膜组件的平均光电转换效率分别不低于13%、16%、15%、15%。此外该文件同时提出晶硅组件衰减率首年不高于2.5%，后续每年不高于0.6%，25年内不高于17%；薄膜组件衰减率首年不高于5%，后续每年不高于0.4%，25年内不高于15%。为了提升建筑有限的光伏安装面积的发电效果，节约材料，并促进光伏产业的产品提升，规定了太阳能光伏发电系统的光伏组件光电转换效率及衰减率的指标要求。
