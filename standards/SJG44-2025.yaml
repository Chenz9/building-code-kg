- id: SJG 44-2025#5.2.1
  standard_code: SJG 44-2025
  chapter: 5 空调与通风节能设计
  section: ''
  clause_no: 5.2.1
  text: 空调冷源与热源应根据建筑物规模、用途、建设地点的能源条件、结构、价格以及国家节能减排和环保政策的相关规定，通过综合论证确定，并应符合下列规定：具有城市、区域供冷或工厂余热时，宜作为空调或供暖的冷、热源；具有热电厂或工厂余热的建筑，宜优先利用电厂或工厂余热的供冷、供热技术；当废热或工业余热的温度较高、经技术经济论证合理时，冷源宜采用吸收式冷水机组；在技术经济合理的情况下，冷、热源宜利用空气能、浅层地能、太阳能、风能等可再生能源；当采用可再生能源受到气候等原因的限制无法保证时，应设置辅助冷、热源；在具有稳定热量消耗的项目中，宜优先应用分布式热电冷联供技术，实现电力和天然气的削峰填谷，提高能源的综合利用率；在执行分时电价、峰谷电价差较大的地区，经技术经济比较，采用低谷电能够明显起到对电网“削峰填谷”和节省运行费用时，宜采用蓄能系统供冷、供热；有天然地表水等资源可利用，或者有可利用的浅层地下水且能保证100%回灌时，可采用地表水或地下水地源热泵系统供冷、供热。
