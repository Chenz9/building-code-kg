  converted_tables:
  - raw: 本条对给水系统节能设计，主要从利用城镇给水管网或小区给水管网的水压、叠压供水系统的采用条件、给水系统竖向分区、减压限流措施的采用、二次加压泵站的设置等规定设计要求。建筑物底部的楼层应充分利用城镇给水管网或小区给水管网的水压直接供水。当城镇给水管网或小区给水管网的水压和（或）水量不足时，应根据卫生安全、经济节能的原则选用储水调节和（或）加压供水方案。在征得当地供水行政主管部门及供水部门批准认可时，可采用直接从城镇给水管网吸水的叠压供水系统；建筑给排水节能与节水密切相关，给水系统竖向合理分区、采取合理减压限流措施等，均是节水的主要措施，也是给排水系统实现节能的关键。为避免高压出流造成供水能耗和水资源的浪费，给水系统应竖向合理分区，各分区的静水压力不宜大于0.45MPa；设有集中热水系统时，分区静水压力不宜大于0.55MPa。并采取限流的节水措施，在满足卫生器具工作压力要求的前提下，使生活给水系统用水点处供水压力不宜大于0.20MPa；二次加压泵站位置与能耗有很大的关系，如果位置设置不合理，将造成能耗的浪费；按使用用途、付费或管理单元，分类、分级设置用水计量装置，是节能节水的重要手段。
