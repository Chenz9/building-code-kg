  section: ''
  clause_no: 4.3.6
  text: 建筑透明围护结构设计宜采用下列改善围护结构隔热性能的措施：门窗、幕墙、天窗及采光顶等透明围护结构的玻璃宜采用镀膜玻璃（包括阳光控制膜、Low-E 膜等）等遮阳型的玻璃系统，或采用由上述玻璃品种组合的中空玻璃；透明围护结构宜设置遮阳装置；空调房间大面积采用玻璃窗、玻璃幕墙时，宜根据建筑功能、建筑节能的需要，采用智能控制的遮阳系统、通风换气系统；当采用双层玻璃幕墙时，宜采用空气外循环的双层形式；空调房间的双层幕墙，其夹层内宜设置可以调节的活动遮阳装置；公共建筑的出入口处或频繁开启的外门宜设置空气幕或采用自动门、闭门器等防止空气渗透措施；智能控制系统宜能够感知天气的变化，能结合室内人员的需求，对遮阳装置、通风换气装置进行实时的控制。
