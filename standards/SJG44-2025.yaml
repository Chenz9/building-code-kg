  section: ''
  clause_no: 4.1.3
  text: 建筑平面设计应充分利用自然通风和天然采光等条件结合围护结构隔热和遮阳措施降低建筑的用能需求，自然通风的设计应符合下列规定：应合理设置功能空间的平面布局，建筑过渡空间和公共空间宜设置成开敞、半开敞空间和非空调房间；应结合外门窗、内门、通道等组织好自然通风，必要时可辅以机械通风或风扇满足室内热舒适需求；建筑中庭等公共空间宜采取自然通风降温措施，必要时设置机械排风措施；体育馆比赛大厅等人员密集的高大空间，宜具备全面使用自然通风的条件，以满足过渡季群众活动的需要。
