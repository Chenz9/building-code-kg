  text: 全空气空调系统的控制应满足下列要求：室内温度传感器的设置位置应不高于人员活动高度，高大空间当不具备条件时室内温度传感器应不高于4.5m 的空调区域；应能进行风机、风阀和水阀的启停连锁控制；应能按照使用时间进行定时启停控制，宜对启停时间进行优化调整；采用变风量系统时，风机应采用变速控制方式；过渡季宜采用加大新风比的控制方式；宜根据室外气象参数优化调节室内温度设定值；全新风系统送风末端宜采用设置人离延时关闭控制方式。
