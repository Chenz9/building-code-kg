  text: 热水系统选择宜符合下列规定：有集中供应热水要求的公共建筑，宜采用集中热水供应系统，当有定时集中供应热水需求时，宜采用定时集中热水供应系统；当分散用水点热水日用水量（按60°C 计）小于5m³时，宜采用局部热水供应系统；当采用集中热水供应系统的公共建筑中设有公共浴室、洗衣房、厨房等耗热量较大且用水时段较固定的用水部位时，宜设独立的热水管网或局部热水供应系统；多栋建筑有热水供应需求时，可根据建筑物分布情况、管理情况等采用共用热水供应系统。
