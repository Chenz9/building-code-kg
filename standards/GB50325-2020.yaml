  clause_no: C.2.2
  text: 测量步骤应符合下列规定：7在测量建筑场地按20m建筑场地网格布点，布点数不应少于16个，应于网格点交叉处进行土壤氢析出率测量。工作温度应为一10℃～40℃;相对湿度不应大于 90%。2测量时，应清扫采样点地面，去除腐殖质、杂草及石块，把取样器扣在平整后的地面上，并应用泥土对取样器周围进行密封，准备就绪后，开始测量并开始计时（t。3土壤表面氢析出率测量过程中，应符合下列规定：1)使用聚集罩时，罩口与介质表面的接缝处应进行封堵；2)被测介质表面应平整，各个测量点测量过程中罩内空间的容积不应出现明显变化；3）测量时间等参数应与仪器测量灵敏度相适应，一般为1h～2h;4)测量应在无风或微风条件下进行。
