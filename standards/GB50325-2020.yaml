  clause_no: C.3.2
  text: 调查方法应符合下列规定：1调查前应制订方案，准备好测量仪器和其他工具。仪器在使用前应进行标定，当使用2台或2台以上仪器进行调查时，所用仪器宜同时进行标定。工作温度应为一10℃～40℃；相对湿度不应大于90%。2测点定位：调查测点位置应用北斗或GPS定位，同时应对地理位置进行简要描述。3测量深度：调查打孔深度应统一定为500mm～800mm，孔径应为20mm~40mm。4测量次数：每一测点应重复测量3次，且以算术平均值作为该点浓度，或每一测点在3m²范围内打3个孔，每孔测一次求平均值。5其他测量要求和测量过程中需要记录的事项应按本标准附录C.1执行。
