  chapter: 附录B 环境测试舱法测定装饰装修材料游离甲醛、VOC释放量
  section: ''
  clause_no: B.0.4
  text: B.0.4测试应符合下列规定：1测试前样品应在（23士1）℃、相对湿度（50士5）%条件下放置不少于1d，样品件之间距离不应小于25mm，且应使空气在所有样品件表面上自由循环，恒温恒湿室内空气换气次数不应低于1次/h，室内空气中甲醛浓度不应大于0.05mg/m3、VOc浓度不应大于0.3mg/m；2人造木板及其制品、黏合木结构材料、壁布、帷幕样品应垂直放在环境测试舱内的中心位置，样品件之间距离不应小于200mm，其表面应与气流方向平行；3地毯、地毯衬垫样品应正面向上平铺在环境测试舱底，使空气气流均匀地从试样表面通过；:23:4环境测试舱法测试人造木板及其制品、黏合木结构材料的游离甲醛释放量时，在测试的第2d开始每天取样2次，每次间隔应超过3h，如果达到稳定状态，可停止取样；当最后4次测定的甲醛浓度的平均值与最大值或最小值之间的偏差低于5%或低于0.005mg/m²时，认为达到稳定状态；若一直未达到稳定状态，以第28d的测试结果作为测定值；5环境测试舱法测试地毯、地毯衬垫、壁布、帷幕的游离甲醛或VOC释放量，样品在试验条件下，在环境测试舱内持续放置时间应为24h。
