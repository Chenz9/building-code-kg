  standard_code: GB 50325-2020
  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: 为了预防和控制民用建筑工程中主体材料和装饰装修材料产生的室内环境污染，保障公众健康，维护公共利益，做到技术先进、经济合理，制定本标准。
