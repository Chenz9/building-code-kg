  text: A.1.3主动抽气采集型测定建筑材料表面氢析出率步骤应按下列步骤进行：1被测试块准备：应使被测样品表面积（m²）与抽气采集容器（抽气采集容器或盛装被测试块容器）内净空间容积（m3）之比约为2：1，清理被测试块表面，准备测量；2测量装置准备：抽气采集容器（或盛装被测试块容器）应与.21·测量仪器气路连接到位。试块测试前，应测量气路系统内干净空气氢浓度本底值并记录；3应将被测试块及测量装置摆放到位，使抽气采集容器（抽气采集容器或盛装被测试块容器）密封，直至测量结束；4准备就绪后开始测量并计时，试块测量时间应在2h以上、10h以内；5测量温度应在25℃土5℃范围内，相对湿度应在45%士15%范围内。6=3(A.1.3)试块表面氢析出率[Bq（m²·s)];测量装置系统内的空气氮浓度（Bq/m3）：V—测量系统内净空间容积，即抽气采集容器内净容积，其值等于盛装被测试块容器内容积减去被测试块的外形体积后的值(m"）；被测试块的外表面积（m²）；t一丛开始测量到测量结束经历的时间（s）。
