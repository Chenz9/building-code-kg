- id: GB 50189-2015#1.0.3
  standard_code: GB 50189-2015
  chapter: 1 总则
  section: ''
  clause_no: 1.0.3
  text: 公共建筑节能设计应根据当地的气候条件，在保证室内环境参数条件下，改善围护结构保温隔热性能，提高建筑设备及系统的能源利用效率，利用可再生能源，降低建筑暖通空调、给水排水及电气系统的能耗。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 全国公共建筑节能设计
    conditions: []
    exceptions: []
  constraint:
