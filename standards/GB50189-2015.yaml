- id: GB 50189-2015#B.0.6
  standard_code: GB 50189-2015
  chapter: 附录B 围护结构热工性能的权衡计算
  section: ''
  clause_no: B.0.6
  text: B.0.6 计算设计建筑和参照建筑全年供暖和空调总耗电量时，空气调节系统冷源应采用电驱动冷水机组；严寒地区、寒冷地区供暖系统热源应采用燃煤锅炉；夏热冬冷地区、夏热冬暖地区、温和地区供暖系统热源应采用燃气锅炉，并应符合下列规定：1全年供暖和空调总耗电量应按下式计算：E=EH+EC（B.0.6-1）式中：E——全年供暖和空调总耗电量（kWh/m2）；EC——全年空调耗电量（kWh/m2）；EH——全年供暖耗电量（kWh/m2）。2 全年空调耗电量应按下式计算：QEAC（B.0.6-2）CSCOPT式中：QC——全年累计耗冷量（通过动态模拟软件计算得到）（kWh）；A——总建筑面积（m2）；SCOPT——供冷系统综合性能系数，取2.50。3 严寒地区和寒冷地区全年供暖耗电量应按下式计算：QEH（B.0.6-3）HAqq式中：QH——全年累计耗热量（通过动态模拟软件计算得到）（kWh）；——热源为燃煤锅炉的供暖系统综合效率，取0.60；q1——标准煤热值，取8.14 kWh/ kgce；q2——发电煤耗（kgce /kWh）取0.360kgce/kWh。4 夏热冬冷、夏热冬暖和温和地区全年供暖耗电量应按下式计算：QEH（B.0.6-4）HAqq式中：——热源为燃气锅炉的供暖系统综合效率，取0.75；q——标准天然气热值，取9.87 kWh/m3；——天然气与标煤折算系数，取1.21 kgce /m3。附录C建筑围护结构热工性能权衡判断审核表表C 建筑围护结构热工性能权衡判断审核表项目名称工程地址设计单位设计日期气候区域采用软件软件版本建筑面积m2建筑外表面积m2建筑体积m3建筑体形系数设计建筑窗墙面积比屋顶透光部分与屋M的限值立面1立面2立面3立面4顶总面积之比M20%设计建筑参照建筑是否符合围护结构部位传热系数K太阳得热系传热系数K太阳得热系标准规定W/（m2·K）W/（m2·K）限值数SHGC数SHGC屋顶透光部分立面1外窗（包括透光幕墙）立面2外窗（包括透光幕墙）立面3外窗（包括透光幕墙）立面4外窗（包括透光幕墙）屋面－－外墙(包括非透光幕墙)－－底面接触室外空气的架－－空或外挑楼板非供暖房间与供暖房间－－的隔墙与楼板设计建筑参照建筑是否符合围护结构部位保温材料层热阻保温材料层热阻R标准规定R[(m2·K)/W][(m2·K)/W]限值周边地面供暖地下室与土壤接触的外墙变形缝（两侧墙内保温时）围护结构传热系数基本要求K设计建筑是否满足基本要求[W/（m2·K）]屋面外墙(包括非透光幕墙)权衡判断基本要求判定外窗（包括透光幕墙）太阳得热系数SHGC围护结构是否是 / 否满足基本要求权衡计算结果设计建筑（kWh/ m2）参照建筑（kWh/ m2）全年供暖和空调总耗电量权衡判断结论设计建筑的围护结构热工性能合格 / 不合格
