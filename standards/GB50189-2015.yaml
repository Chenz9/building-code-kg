- id: GB 50189-2015#4.2.1
  standard_code: GB 50189-2015
  chapter: 4 供暖通风与空气调节
  section: 4.2 冷源与热源
  clause_no: 4.2.1
  text: 供暖空调冷源与热源应根据建筑规模、用途、建设地点的能源条件、结构、价格以及国家节能减排和环保政策的相关规定，通过综合论证确定，并应符合下列规定：1有可供利用的废热或工业余热的区域，热源宜采用废热或工业余热。当废热或工业余热的温度较高、经技术经济论证合理时，冷源宜采用吸收式冷水机组。2在技术经济合理的情况下，冷、热源宜利用浅层地能、太阳能、风能等可再生能源。当采用可再生能源受到气候等原因的限制无法保证时，应设置辅助冷、热源。3不具备本条第1、2款的条件，但有城市或区域热网的地区，集中式空调系统的供热热源宜优先采用城市或区域热网。4不具备本条第1、2款的条件，但城市电网夏季供电充足的地区，空调系统的冷源宜采用电动压缩式机组。5不具备本条第1款~第4款的条件，但城市燃气供应充足的地区，宜采用燃气锅炉、燃气热水机供热或燃气吸收式冷（温）水机组供冷、供热。6不具备本条第1款~5款条件的地区，可采用燃煤锅炉房、燃油锅炉供热，蒸汽吸收式冷水机组或燃油吸收式冷（温）水机组供冷、供热。7夏季室外空气设计露点温度较低的地区，宜采用间接蒸发冷却冷水机组作为空调系统的冷源。8天然气供应充足的地区，当建筑的电力负荷、热负荷和冷负荷能较好匹配、能充分发挥冷、热、电联产系统的能源综合利用效率且经济技术比较合理时，宜采用分布式燃气冷热电三联供系统。9全年进行空气调节，且各房间或区域负荷特性相差较大，需要长时间地向建筑同时供热和供冷，经技术经济比较合理时，宜采用水环热泵空调系统供冷、供热。10在执行分时电价、峰谷电价差较大的地区，经技术经济比较，采用低谷电能够明显起到对电网“削峰填谷”和节省运行费用时，宜采用蓄能系统供冷、供热。11夏热冬冷地区以及干旱缺水地区的中、小型建筑宜采用空气源热泵或土壤源地源热泵系统供冷、供热。12有天然地表水等资源可供利用、或者有可利用的浅层地下水且能保证100%回灌时，可采用地表水或地下水地源热泵系统供冷、供热。13具有多种能源的地区，可采用复合式能源供冷、供热。
  is_abolished: false
  abolished_date: null
