  text: 照明控制应符合下列规定：1 照明控制应结合建筑使用情况及天然采光状况，进行分区、分组控制；2 旅馆客房应设置节电控制型总开关；3 除单一灯具的房间，每个房间的灯具控制开关不宜少于2 个，且每个开关所控的光源数不宜多于6 盏；4 走廊、楼梯间、门厅、电梯厅、卫生间、停车库等公共场所的照明，宜采用集中开关控制或就地感应控制；5 大空间、多功能、多场景场所的照明，宜采用智能照明控制系统；6 当设置电动遮阳装置时，照度控制宜与其联动；7 建筑景观照明应设置平时、一般节日、重大节日等多种模式自动控制装置。
