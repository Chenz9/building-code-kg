- id: GB 50189-2015#3.4.2
  standard_code: GB 50189-2015
  chapter: 3 建筑与建筑热工
  section: 3.4 围护结构热工性能的权衡判断
  clause_no: 3.4.2
  text: 建筑围护结构热工性能的权衡判断，应首先计算参照建筑在规定条件下的全年供暖和空气调节能耗，然后计算设计建筑在相同条件下的全年供暖和空气调节能耗，当设计建筑的供暖和空气调节能耗不大于参照建筑的供暖和空气调节能耗时，应判定围护结构的总体热工性能符合节能要求。当设计建筑的供暖和空气调节能耗大于参照建筑的供暖和空气调节能耗时，应调整设计参数重新计算，直至设计建筑的供暖和空气调节能耗不大于参照建筑的供暖和空气调节能耗。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 全国公共建筑节能设计
