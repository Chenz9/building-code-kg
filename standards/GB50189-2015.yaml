- id: GB 50189-2015#4.5.7
  standard_code: GB 50189-2015
  chapter: 4 供暖通风与空气调节
  section: 4.5 监测、控制与计量
  clause_no: 4.5.7
  text: 冷热源机房的控制功能应符合下列规定：1应能进行冷水（热泵）机组、水泵、阀门、冷却塔等设备的顺序启停和连锁控制；2 应能进行冷水机组的台数控制，宜采用冷量优化控制方式；3 应能进行水泵的台数控制，宜采用流量优化控制方式；4二级泵应能进行自动变速控制，宜根据管道压差控制转速，且压差宜能优化调节；5 应能进行冷却塔风机的台数控制，宜根据室外气象参数进行变速控制；6 应能进行冷却塔的自动排污控制；7 宜能根据室外气象参数和末端需求进行供水温度的优化调节；8 宜能按累计运行时间进行设备的轮换使用；9 冷热源主机设备3 台以上的，宜采用机组群控方式；当采用群控方式时，控制系统应与冷水机组自带控制单元建立通信连接。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: 全国公共建筑节能设计
    conditions:
    - 当采用群控方式时
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
