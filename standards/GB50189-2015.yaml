- id: GB 50189-2015#4.5.8
  standard_code: GB 50189-2015
  chapter: 4 供暖通风与空气调节
  section: 4.5 监测、控制与计量
  clause_no: 4.5.8
  text: 全空气空调系统的控制应符合下列规定：1 应能进行风机、风阀和水阀的启停连锁控制；2 应能按使用时间进行定时启停控制，宜对启停时间进行优化调整；3 采用变风量系统时，风机应采用变速控制方式；4 过渡季宜采用加大新风比的控制方式；5 宜根据室外气象参数优化调节室内温度设定值；6 全新风系统送风末端宜采用设置人离延时关闭控制方式。
