- id: GB 50189-2015#4.3.5
  standard_code: GB 50189-2015
  chapter: 4 供暖通风与空气调节
  section: 4.3 输配系统
  clause_no: 4.3.5
  text: 集中空调冷、热水系统的设计应符合下列规定：1当建筑所有区域只要求按季节同时进行供冷和供热转换时，应采用两管制空调水系统；当建筑内一些区域的空调系统需全年供冷、其它区域仅要求按季节进行供冷和供热转换时，可采用分区两管制空调水系统；当空调水系统的供冷和供热工况转换频繁或需同时使用时，宜采用四管制空调水系统。2冷水水温和供回水温差要求一致且各区域管路压力损失相差不大的中小型工程，单台水泵功率较大时，经技术经济比较，在确保设备的适应性、控制方案和运行管理可靠的前提下，空调冷水可采用冷水机组和负荷侧均变流量的一级泵系统，且一级泵应采用调速泵。3系统作用半径较大、设计水流阻力较高的大型工程，空调冷水宜采用变流量二级泵系统。当各环路的设计水温一致且设计水流阻力接近时，二级泵宜集中设置；当各环路的设计水流阻力相差较大或各系统水温或温差要求不同时，宜按区域或系统分别设置二级泵，且二级泵应采用调速泵。4提供冷源设备集中且用户分散的区域供冷的大规模空调冷水系统，当二级泵的输送距离较远且各用户管路阻力相差较大，或者水温（温差）要求不同时，可采用多级泵系统，且二级泵等负荷侧各级泵应采用调速泵。
