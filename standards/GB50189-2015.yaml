- id: GB 50189-2015#B.0.5
  standard_code: GB 50189-2015
  chapter: 附录B 围护结构热工性能的权衡计算
  section: ''
  clause_no: B.0.5
  text: B.0.5 计算参照建筑全年累计耗冷量和累计耗热量时，应符合下列规定：1建筑的形状、大小、朝向、内部的空间划分和使用功能、建筑构造尺寸应与设计建筑一致；2建筑围护结构做法应与建筑设计文件一致，围护结构热工性能参数取值应符合本标准第3.3节的规定；3建筑空气调节和供暖系统的运行时间、室内温度、照明功率密度及开关时间、房间人均占有的使用面积及在室率、人员新风量及新风机组运行时间表、及电器设备功率密度及使用率应与设计建筑一致；4建筑空气调节和供暖应采用全年运行的两管制风机盘管系统。供暖和空气调节区的设置应与设计建筑一致。
