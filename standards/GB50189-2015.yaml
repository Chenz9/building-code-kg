  text: 空气源热泵机组的设计应符合下列规定：1具有先进可靠的融霜控制，融霜时间总和不应超过运行周期时间的20％；2 冬季设计工况下，冷热风机组性能系数（COP）不应小于1.8，冷热水机组性能系数（COP）不应小于2.0；3 冬季寒冷、潮湿的地区，当室外设计温度低于当地平衡点温度时，或当室内温度稳定性有较高要求时，应设置辅助热源；4 对于同时供冷、供暖的建筑，宜选用热回收式热泵机组。
