- id: GB 50189-2015#B.0.4
  standard_code: GB 50189-2015
  chapter: 附录B 围护结构热工性能的权衡计算
  section: ''
  clause_no: B.0.4
  text: B.0.4计算设计建筑全年累计耗冷量和累计耗热量时，应符合以下规定：1建筑的形状、大小、朝向、内部的空间划分和使用功能、建筑构造尺寸、建筑围护结构传热系数、做法、外窗（包括透光幕墙）太阳得热系数、窗墙面积比、屋面开窗面积应与建筑设计文件一致；2建筑空气调节和供暖应按全年运行的两管制风机盘管系统设置。建筑功能区除设计文件明确为非空调区外，均应按设置供暖和空气调节计算；3建筑的空气调节和供暖系统运行时间、室内温度、照明功率密度值及开关时间、房间人均占有的使用面积及在室率、人员新风量及新风机组运行时间表、电器设备功率密度及使用率应按表B.0.4-1~表B.0.4-10设置。表B.0.4-1 空气调节和供暖系统的日运行时间类别系统工作时间工作日7：00～18：00办公建筑节假日－宾馆建筑全年l：00～24：00商场建筑全年8：00 ～21：00医疗建筑-门诊楼全年8：00 ～21：00工作日7：00～18：00学校建筑-教学楼节假日－表B.0.4-2供暖空调区室内温度(℃)时间建筑类别空调办公建工作日供暖筑、教空调学楼节假日供暖宾馆建空调筑、住全年供暖院部商场建空调筑、门全年供暖诊楼时间建筑类别2l空调26.工作日办公建供暖筑、教空调学楼节假日供暖宾馆建空调筑、住全年供暖院部商场建空调筑、门全年供暖诊楼表B.0.4-3照明功率密度值(W/m2)建筑类别照明功率密度办公建筑9.0宾馆建筑7.0商场建筑10.0医院建筑-门诊楼9.0学校建筑-教学楼9.0表B.0.4-4照明开关时间(％)时间建筑类别工作日办公建筑、教学楼节假日宾馆建筑、全年住院部商场建筑、全年l0l0门诊楼时间建筑类别工作日办公建筑、教学楼节假日宾馆建筑、全年住院部商场建筑、全年100 10门诊楼表B.0.4-5不同类型房间人均占有的建筑面积（m2/人）建筑类别人均占有的建筑面积办公建筑宾馆建筑商场建筑医院建筑-门诊楼学校建筑-教学楼表B.0.4-6房间人员逐时在室率(％)时间建筑类别办公建筑、工作日教学楼节假日宾馆建筑、全年住院部全年商场建筑、全年门诊楼全年时间建筑类别办公建筑、工作日教学楼节假日宾馆建筑、全年住院部全年商场建筑、全年门诊楼全年20 20表B.0.4-7 不同类型房间的人均新风量（m3/h·人）建筑类别新风量办公建筑宾馆建筑商场建筑医院建筑-门诊楼学校建筑-教学楼表B.0.4-8新风运行情况（1表示新风开启，0表示新风关闭）时间建筑类别办公建筑、工作日教学楼节假日宾馆建筑、全年住院部全年商场建筑、全年门诊楼全年时间建筑类别2l办公建筑、工作日教学楼节假日宾馆建筑、全年住院部全年商场建筑、全年门诊楼全年表B.0.4-9不同类型房间电器设备功率密度(W/m2)建筑类别电器设备功率办公建筑宾馆建筑商场建筑医院建筑-门诊楼学校建筑-教学楼表B.0.4-10电器设备逐时使用率(％)时间建筑类别办公建筑、工作日教学楼节假日宾馆建筑、全年住院部全年商场建筑、全年门诊楼全年时间建筑类别2l办公建筑、工作日教学楼节假日宾馆建筑、全年住院部全年商场建筑、全年门诊楼全年
