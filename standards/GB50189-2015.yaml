  chapter: 6 电气
  section: 6.3 照明
  clause_no: 6.3.4
  text: 光源的选择应符合下列规定：1一般照明在满足照度均匀度条件下，宜选择单灯功率较大、光效较高的光源，不宜选用荧光高压汞灯，不应选用自镇流荧光高压汞灯；2 气体放电灯用镇流器应选用谐波含量低的产品；3 高大空间及室外作业场所宜选用金属卤化物灯、高压钠灯；4 除需满足特殊工艺要求的场所外，不应选用白炽灯；5走道、楼梯间、卫生间、车库等无人长期逗留的场所，宜选用发光二极管（LED）灯；6 疏散指示灯、出口标志灯、室内指向性装饰照明等宜选用发光二极管（LED）灯；7室外景观、道路照明应选择安全、高效、寿命长、稳定的光源，避免光污染。
