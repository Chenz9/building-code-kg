  text: 低压消防给水系统的系统工作压力应大于或等于0.60MPa。高压和临时高压消防给水系统的系统工作压力应符合下列规定：1 对于采用高位消防水池、水塔供水的高压消防给水系统，应为高位消防水池、水塔的最大静压；2 对于采用市政给水管网直接供水的高压消防给水系统，应根据市政给水管网的工作压力确定；3 对于采用高位消防水箱稳压的临时高压消防给水系统，应为消防水泵零流量时的压力与消防水泵吸水口的最大静压之和；4 对于采用稳压泵稳压的临时高压消防给水系统，应为消防水泵零流量时的水压与消防水泵吸水口的最大静压之和、稳压泵在维持消防给水系统压力时的压力两者的较大值。
