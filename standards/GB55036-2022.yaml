- rule_id: R_GB550362022_3_0_2_1
  source_clause: GB 55036-2022#3.0.2
  rule_type: validation
  when:
  - activity_type == '消防设施设计'
  - component_type IN ['IfcBuilding', 'IfcSystem']
  - system_type == '低压消防给水系统'
  then:
    type: threshold
    param: 系统工作压力
    operator: '>='
    value: 0.6
    unit: MPa
  source_text: 低压消防给水系统的系统工作压力应大于或等于0.60MPa。
  table_source: null
  auto_generated: false
  note: 方案A模式①简单阈值；依据《建筑规范数值关系运算的结构化表达方案对比与建议.md》§五模板，2026-09-08人工精修（回源建标库文本核验）
- rule_id: R_GB550362022_3_0_2_2
  source_clause: GB 55036-2022#3.0.2
  rule_type: validation
  when:
  - activity_type == '消防设施设计'
  - component_type IN ['IfcBuilding', 'IfcSystem']
  - system_type IN ['高压消防给水系统', '临时高压消防给水系统']
  then:
    type: conditional
    branches:
    - when:
        supply_mode: 高位消防水池/水塔供水
      then:
        type: ref
        param: 高位消防水池、水塔的最大静压
        unit: MPa
    - when:
        supply_mode: 市政给水管网直接供水
      then:
        type: ref
        param: 市政给水管网的工作压力
        unit: MPa
    - when:
        supply_mode: 高位消防水箱稳压
      then:
        type: arithmetic
        operator: +
        operands:
        - ref: 消防水泵零流量时的压力
          unit: MPa
        - ref: 消防水泵吸水口的最大静压
          unit: MPa
        result_unit: MPa
    - when:
        supply_mode: 稳压泵稳压
      then:
