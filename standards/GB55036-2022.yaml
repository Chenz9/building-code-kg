  chapter: 3 消防给水与消火栓系统
  section: ''
  clause_no: 3.0.4
  text: 室外消火栓系统应符合下列规定：1 室外消火栓的设置间距、室外消火栓与建（构）筑物外墙、外边缘和道路路沿的距离，应满足消防车在消防救援时安全、方便取水和供水的要求；2 当室外消火栓系统的室外消防给水引入管设置倒流防止器时，应在该倒流防止器前增设1个室外消火栓；3 室外消火栓的流量应满足相应建（构）筑物在火灾延续时间内灭火、控火、冷却和防火分隔的要求；4 当室外消火栓直接用于灭火且室外消防给水设计流量大于30L/s时，应采用高压或临时高压消防给水系统。
