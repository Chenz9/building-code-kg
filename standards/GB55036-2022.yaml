- id: GB 55036-2022#2.0.1
  standard_code: GB 55036-2022
  chapter: 2 基本规定
  section: ''
  clause_no: 2.0.1
  text: 用于控火、灭火的消防设施，应能有效地控制或扑救建（构）筑物的火灾；用于防护冷却或防火分隔的消防设施，应能在规定时间内阻止火灾蔓延。
  is_abolished: false
