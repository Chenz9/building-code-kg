  text: 消防设施的施工现场应满足施工的要求。消防设施的安装过程应进行质量控制，每道工序结束后应进行质量检查。隐蔽工程在隐蔽前应进行验收；其他工程在施工完成后，应对其安装质量、系统与设备的功能进行检查、测试。
