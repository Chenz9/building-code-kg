  chapter: 2 基本规定
  section: ''
  clause_no: 2.0.2
  text: 消防给水与灭火设施应具有在火灾时可靠动作，并按照设定要求持续运行的性能；与火灾自动报警系统联动的灭火设施，其火灾探测与联动控制系统应能联动灭火设施及时启动。
