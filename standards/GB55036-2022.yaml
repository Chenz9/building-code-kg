  chapter: 10 灭火器
  section: ''
  clause_no: 10.0.1
  text: 灭火器的配置类型应与配置场所的火灾种类和危险等级相适应，并应符合下列规定：1A类火灾场所应选择同时适用于A类、E类火灾的灭火器。2B类火灾场所应选择适用于B类火灾的灭火器。B类火灾场所存在水溶性可燃液体（极性溶剂)且选择水基型灭火器时，应选用抗溶性的灭火器。一3C类火灾场所应选择适用于C类火灾的灭火器。4D类火灾场所应根据金属的种类、物态及其特性选择适用于特定金属的专用灭火器。5E类火灾场所应选择适用于E类火灾的灭火器。带电设备电压超过1kV且灭火时不能断电的场所不应使用灭火器带电扑救。F类火灾场所应选择适用于E类、F类火灾的灭火器。当配置场所存在多种火灾时，应选用能同时适用扑救该场所所有种类火灾的灭火器。
