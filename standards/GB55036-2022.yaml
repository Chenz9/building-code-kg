  section: ''
  clause_no: 3.0.8
  text: 消防水池应符合下列规定：1 消防水池的有效容积应满足设计持续供水时间内的消防用水量要求；当消防水池采用两路消防供水且在火灾中连续补水能满足消防用水量要求时，在仅设置室内消火栓系统的情况下，有效容积应大于或等于50m³，其他情况下应大于或等于100m³；2 消防用水与其他用水共用的水池，应采取保证水池中的消防用水量不作他用的技术措施；3 消防水池的出水管应保证消防水池有效容积内的水能被全部利用，水池的最低有效水位或消防水泵吸水口的淹没深度应满足消防水泵在最低水位运行安全和实现设计出水量的要求；4 消防水池的水位应能就地和在消防控制室显示，消防水池应设置高低水位报警装置；5 消防水池应设置溢流水管和排水设施，并应采用间接排水。
