  clause_no: 7.3.8
  text: 用于基坑支护的型钢立柱、钢管立柱、钢筋混凝土立柱，穿过地下室结构底板的防水做法 应符合下列规定： 1 用于基坑支护的型钢立柱时，应在底板厚度的1/2 处，格构柱的内外侧分别设置止水钢板， 止水钢板单侧宽度不宜小于100mm，钢板厚度不小于3mm，其构造可见图7.3.8-1； 图7.3.8-1 格构型钢立柱与底板节点防水做法 1—原土夯实；2—混凝土垫层；3—钢柱周边500mm 范围内水泥基渗透结晶型防水涂料（刷至止水钢板以下）； 4—防水卷材至角钢边；5—细石混凝土保护层；6—止水钢板；7—卷材与角钢内、外边均采用专用密封胶密封 2 浇筑底板时宜在立柱直径+500mm 范围内预留后浇洞口，待立柱拆除后再补做防水并浇 筑混凝土，其防水构造可见图7.3.8-2； 图7.3.8-2 钢筋混凝土立柱与底板节点构造 1—底板防水层上翻300 空铺；2—挤塑聚苯板保护；3—单组分聚氨酯建筑密封胶；4—底板水层； 5—钢板止水带；6—防水混凝土底板；7—后浇补偿收缩防水混凝土 3 当立柱混凝土强度及抗渗等级不低于底板混凝土相应等级时，也可采用与底板一次性浇 筑，其防水构造可见图7.3.8-3； 52 图7.3.8-3 立柱与底板一次性浇筑节点构造 1—钢筋混凝土立柱；2—防水混凝土环梁；3—立柱在底板厚度范围内植筋； 防水混凝土底板；5—单组分聚氨酯建筑密封胶 4 用于基坑支护的为钢管立柱时，在底板厚度的1/2 处，钢管柱的外侧设置止水钢板，止水 钢板单侧宽度不应小于100mm，钢板厚度不小于3mm，其构造可见图7.3.8-4。 图7.3.8-4 钢立柱与底板节点构造 1—止水钢板环钢柱焊接；2—原有钢立柱；3—遇水膨胀止水条（胶）环柱一周；4—防水混凝土底板 5—截柱后采用15mm 厚钢板与钢柱内侧满焊；
