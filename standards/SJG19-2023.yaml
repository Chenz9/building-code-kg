- id: SJG 19-2023#7.1.1
  standard_code: SJG 19-2023
  chapter: 7 建筑工程地下防水设计与施工
  section: ''
  clause_no: 7.1.1
  text: 地下工程防水设计应根据地表水、地下水、毛细管水等的作用，以及由于人为因素引起的附近水文地质改变的影响确定。单建式地下工程，宜采用全封闭、部分封闭的防排水设计；附建式全地下或半地下工程的防水设防高度，应高出室外地坪高程500mm 以上。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters:
  - name: 外地坪高程
    unit: mm
    condition: null
    min_value: 500.0
    max_value: 500.0
  tables: []
  converted_tables:
  - raw: 防水混凝土是经现场湿作业完成，由于水分蒸发，会产生毛细孔、微细裂缝，以及施工中的允许缺陷，导致渗水。再者地下土壤中含有“氡”，易附于混凝土的孔隙中等原因。地下工程除防水混凝土主体设防外，应在迎水面设置柔性防水层，抵御结构防水混凝土开裂和堵塞混凝土表面毛细孔，阻止地下水浸入到结构中，从而保护了防水混凝土，提高了结构的耐久性。单独建造的地下工程应是全面封闭设防，除防水混凝土外，迎水面均应有柔性防水层。而附建式地下工程，柔性防水层应高出室外地坪500mm，过低时会发生爬水现象。
    note: 合并重复提取片段
