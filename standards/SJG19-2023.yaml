  - raw: 立面柔性涂料防水层上直接粘贴饰面砖容易出现空鼓、掉砖情况，为提高与饰面层的粘结强度，可采用拉毛、甩浆、涂刷界面剂或在最后一遍涂料未固化前均匀撒上一层干燥的细砂等方式来避免出现空鼓、掉砖的情况。聚合物水泥防水砂浆、高分子益胶泥为水泥基材料，与饰面层粘结强度高，可直接粘贴饰面砖。
