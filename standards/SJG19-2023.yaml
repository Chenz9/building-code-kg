  clause_no: 7.2.2
  text: 建筑地下工程防水设计工作年限应不低于工程结构设计工作年限，根据工程重要性可选 择A、B、C 方案，应符合表7.2.2 的规定。选用多道防水层之间防水材料的材性应相容。 内掺 自修复防水混凝土 外设防水层 适用范围 防水卷材 防水涂料 水泥基防水材料 一级防水 A 应选其一 应选择3 道，防水卷材或防水涂料至少1 道 重要建筑地下室 一级防水 B 应选其一 应选择2 道，防水卷材或防水涂料至少1 道 地下室 二级防水 C 选防水混凝土 防水卷材或防水涂料1 道 对渗漏不敏感建筑 注：1 I 类防水使用环境下的甲类工程，地下主体结构宜采用内掺自修复防水混凝土； 2 叠合式结构的侧墙等工程部位，外设防水层应采用水泥基防水材料。
