- id: SJG 19-2023#7.2.8
  standard_code: SJG 19-2023
  chapter: 7 建筑工程地下防水设计与施工
  section: 1.2厚热塑性橡胶自粘橡胶防
  clause_no: 7.2.8
  text: 水泥基渗透结晶防水材料作为一道防水层时，用量应不小于1.5kg/m2且厚度不应低于1.0mm，宜采用干撒、喷涂或涂抹等方法施工，并应及时养护，养护时间不得少于72h，质量应符合《水泥基渗透结晶型防水材料》GB 18445 中C 类的标准。
