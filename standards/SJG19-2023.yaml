- id: SJG 19-2023#11.1.7
  standard_code: SJG 19-2023
  chapter: 11 工程验收
  section: 11.1 一般规定
  clause_no: 11.1.7
  text: 外墙、屋面、卫生间墙地面、独立水容器、混凝土结构蓄水类等有防水要求的部位在完工后应进行检验验收，应按下列规定进行检查：1 外墙防水除了在雨后要全部检查渗漏外，还要进行淋水检验，持续淋水2h 后要全面检查渗漏情况，并做好检查记录和维修记录；2 建筑屋面工程在屋面防水层和节点防水完成后，应进行雨后观察或淋水、蓄水试验。采用雨后观察时，降雨应达中雨量级标准；采用淋水试验室时，持续淋水时间不应小于2h；檐沟、天沟、雨水口等应单独进行蓄水试验，最低蓄水高度不应小于20mm，蓄水时间不应少于24h；3 卫生间地面防水层和饰面层施工完成后，均应全数进行蓄水试验，最低蓄水高度不应小于20mm，蓄水时间不应少于24h，全面检查渗漏水并做好检查记录和维修记录；渗漏水的检查和维修部位应包含相邻楼层、相邻墙地面；4 有防水要求的内墙面应进行淋水试验，淋水时间不应小于30min；5 独立水容器、混凝土结构蓄水类工程，应进行满池蓄水试验，蓄水时间不应少于24h；6 外墙、屋面、卫生间墙地面、独立水容器、混凝土结构蓄水类等有防水要求的部位在淋水、蓄水或雨后发现渗漏水点，必须进行整改，整改后的部位淋水、蓄水时间应加倍。
