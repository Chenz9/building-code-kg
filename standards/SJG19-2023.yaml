  text: 双面自粘防水卷材与高分子防水卷材复合施工应符合下列规定：1 干燥基层应涂刷基层处理剂后直接铺贴防水卷材，基层潮湿无明水时时，应采用湿铺法铺贴，采用湿铺法时，应涂抹一道水泥浆或聚合物水泥浆后立即铺贴湿铺防水卷材，水泥浆固化前不得扰动；2 铺贴双面自粘防水卷材时先对卷材进行裁剪试铺，撕净卷材底面隔离纸，抬铺或滚铺粘贴，边铺贴边向两侧排出卷材下空气，辊压粘牢。铺贴检查合格后，即可铺上复合在上部的高分子防水卷材，自粘类高分子防水卷材铺贴前，应撕掉双面自粘防水卷材上表面隔离膜；3 高分子防水卷材铺贴应符合本标准第4.4.1 条第5～8 款的规定。
