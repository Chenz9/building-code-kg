- id: SJG 19-2023#4.4.1
  standard_code: SJG 19-2023
  chapter: 4 屋面防水设计与施工
  section: 4.4 屋面防水层施工
  clause_no: 4.4.1
  text: 防水涂料与防水卷材复合施工应符合下列规定： 1 涂料施工时，基层干燥程度应满足材料性能要求，并进行测试。当材料性能适合潮湿基 层施工时，基层应干净、无明水； 2 多组分防水涂料应按规定配比、计量准确、机械搅拌至均匀，不得有沉淀、分层现象； 3 防水涂料应多遍薄涂，每遍涂覆后应待涂料完全成膜后才可继续施工。防水涂料可根据 使用操作要求的厚度涂覆。当涂料兼作粘结层时，应在最后留适量涂料作为粘结料，涂覆后立即 粘贴卷材； 4 涂料涂刷时，涂层不应流挂、不堆积、不露底，厚度均匀。厚涂时应采用专用控制厚度 的刮板刮抹。防水涂料施工应具备通风挥发条件。涂层厚度应按用量控制，干燥成膜后应现场取 样测量，达到要求后方可进行下一道工序施工； 5 水性涂料不宜作为粘结料使用； 6 铺贴防水卷材前应先对卷材进行裁剪试铺。立面或大坡面铺贴卷材时，应采用满粘法， 减少短边搭接； 7 防水卷材铺贴应平整、顺直、不褶皱，铺贴时应排出卷材下的空气，辊压粘结牢固。铺 贴自粘防水卷材时，应先将粘结面隔离纸撕开，抬铺或滚铺粘贴。高分子防水卷材铺贴时应松弛 不拉伸，改性沥青防水卷材铺贴时应拉紧不松弛； 8 防水卷材的接缝处应平整、顺直、不扭曲。大面积防水卷材铺贴完成后，清理防水卷材 的搭接缝卷材两粘结面，采用专用胶粘剂或直接用胶粘带粘结、排气并粘结牢固，封口用密封胶 封边，不同品种防水卷材的搭接宽度，应符合表4.4.1 的要求； 热沥青 ≥100 自粘搭接（含湿铺） ≥80 高分子类 防水卷材 胶粘剂、粘结料 ≥100 胶粘带、自粘胶 ≥80 单缝焊 ≥60，有效焊接宽度不应小于25 双缝焊 ≥80，有效焊接宽度10×2+空腔宽 塑料防水板双缝焊 ≥100，有效焊接宽度10×2+空腔宽 9 涂料防水层应先进行立面、泛水施工，后进行大面施工；卷材防水层应先进行大面施 工，后铺立面、泛水，并应粘牢，排出卷材下空气，钉压收头，用密封材料密封； 10 防水卷材采用水泥基材料搭接粘结时，防水层边长不应大于45m。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 不应
    - 不得
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables:
  - table_id: 表4.4.1
    type: parameter_table
    note: 条件→参数查表（OCR合并正文，行列结构缺失）
    content: 表4.4.1 的要求；表4.4.1防水卷材最小搭接宽度防水卷材类型搭接方式搭接宽度（mm）聚合物改性沥青热熔法、热沥青≥100类防水卷材自粘搭接（含湿铺）≥80胶粘剂、粘结料≥100胶粘带、自粘胶≥80高分子类单缝焊≥60，有效焊接宽度不应小于25防水卷材双缝焊≥80，有效焊接宽度10×2+空腔宽塑料防水板双缝焊≥100，有效焊接宽度10×2+空腔宽9 涂料防水层应先进行立面、泛水施工，后进行大面施工；卷材防水层应先进行大面施工，后铺立面、泛水，并应粘牢，排出卷材下空气，钉压收头，用密封材料密封；10 防水卷材采用水泥基材料搭接粘结时，防水层边长不应大于45m。
  converted_tables:
  - raw: 涂料与卷材复合施工将是一种基本形式，在此做较详细规定。1 基层干燥度将显著影响涂膜质量，如果涂料需要基层干燥，必须经测定基层干燥度合格后方可施工，可在潮湿基面上施工的涂料也不能有明水；（注：测试基层干燥度方法：将1m2卷材平坦地干铺在基层上，静置3～4h 后掀开检查，基层覆盖部位与卷材上未见水印，即可铺设隔汽层或防水层）；2 多组分涂料必须配比准确、搅拌均匀才能反应完全，才能成膜坚固；3 非固化橡胶沥青涂料和反应型涂料可厚涂。当采用涂料作为卷材的胶粘剂时，应在涂料施工时预留一定量作为胶粘剂，涂刷粘结涂料应均匀一致，铺卷材时应排出卷材下空气并粘牢，从而形成整体防水层。待检查合格后才能继续进行下一道工序施工；4 挥发型涂料的关键工序是薄涂多遍，每遍完全干燥成膜后才能继续施工，否则，涂膜遇水将出现反乳而降低性能或造成渗漏。反应型涂料厚涂时，应用带齿刮板才能控制厚度，从而保证防水层质量；5 为了保证卷材铺贴位置准确、粘结牢固，规定了卷材试铺工艺和铺贴要点；6 涂膜上铺贴高分子卷材时，忌拉伸过紧，因为高分子卷材在使用过程中的收缩较大，应松弛但不褶皱；改性沥青卷材则要求拉紧，避免受热鼓胀；7 搭接缝施工是卷材防水的关键，故要求接缝平整、顺直不扭曲，在卷材接缝上下面涂胶粘剂，然后粘合封；8 复合防水层施工过程中，每道防水层施工后应立即检查验收，否则，隐蔽后将无法检查验收；9 本条规定内容是防水施工工艺的要求。
    note: 合并重复提取片段
