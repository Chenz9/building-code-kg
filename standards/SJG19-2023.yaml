    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 本条根据现行国家强制性标准《建筑与市政工程防水通用规范》GB 55030，针对工程防水设计提出“以防为主、防排结合、综合治理、因地制宜”的原则。通过多年实践，提出了防水层“构造合理、材料耐久、设防可靠、经济实用”的要求。“可靠”是指全面设防，适应主体功能的要求；“合理”是指结构构造合理，选材适用；“耐久”是指选用材料的材质和厚度要适应耐久要求；“经济”是指在可靠、合理、耐久的前提下的综合经济效益。
