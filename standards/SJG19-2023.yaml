  tables: []
  converted_tables:
  - raw: 在目前的施工技术水平下，防水混凝土的裂缝是难以避免的。如有宽度大于0.05mm 或贯通的裂缝，会产生明显渗水，应按《地下工程渗漏治理技术规程》JGJ/T 212—2010 进行堵漏及防水加强处理，保证地下工程不渗漏。如裂缝宽度小于0.05mm，漏水量显著降低，并能快速愈合。因此从渗漏水角度来看，宽度大于0.05mm 的贯穿渗水裂缝必须修补，而宽度小于0.05mm，一般无需处理，均可自愈合。
