  text: 自修复防水混凝土内部设置的各种钢筋或绑扎铁丝，不得接触模板。用于固定模板的螺栓必须穿过混凝土结构时，可采用工具式螺栓或螺栓加堵头，螺栓上应加焊方形止水环。拆模后应将留下的凹槽用防水砂浆嵌填和找平，并应将螺栓部位的四周用水泥基渗透结晶型防水涂料进行均涂刷。
