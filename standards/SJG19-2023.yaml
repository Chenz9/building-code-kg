    unit: '%'
    condition: null
    min_value: 0.1
    max_value: null
  - name: aO量不得
    unit: kg
    condition: null
    min_value: 3.0
    max_value: null
  tables: []
  converted_tables:
  - raw: 防水混凝土施工受当地材料、施工条件影响较大，故应根据施工工程的条件做好试配试验。由于试验室的条件远比工地优越，施工时对于影响混凝土抗渗性能因素难以控制，因此试验室试配的抗渗等级应提高一级。《混凝土结构耐久性设计与施工指南》CESS 01—2004 中限定混凝土原材料（水泥、矿物掺合料、集料、外加剂、拌和水等）中引入的氯离子总量，应不超过胶凝材料重量的0.1%。碱骨料反应会引起混凝土破坏，由于地下工程长期受地下水、地表水的作用，如果混凝土中含碱量高，遇到混凝土中的集料具有碱活性时，会有碱骨料反应的发生，其含量控制引用自《地下工程防水技术规范》GB 50108—2008。
