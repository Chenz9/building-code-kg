  tables: []
  converted_tables:
  - raw: 种植屋面设置泄水层是防止屋面积水过多，因此需有排水层。目前采用排水板或卵石层，使水能迅速排除。排水板是一层凹凸的板，它将多余水排走，但在凹槽中积有一定的水量，不下雨时供给植物。为避免种植介质的流失，在排水层上铺设一层无纺布作为滤水层。种植屋面防水层常年处于高湿、泡水环境，防止窜水渗漏是保障阻根功能持久有效的必要举措。对于施工后防水层能与基面密封满粘、防水材料覆有高分子膜物理阻根层的高分子膜基湿铺防水卷材、满粘法施工的乙烯胎基防水卷材、耐碱长丝纤维的聚乙烯丙纶防水卷材等材料，鼓励制定企业标准、团体标准，通过耐根穿刺相关有资质机构检测和省级及以上技术评估后，推广使用。
