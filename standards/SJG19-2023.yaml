  text: 金属板材屋面施工应符合下列规定：1 压型钢板应根据板型和设计的配板铺设。铺设时，应先在檩条上安装固定支架；压型钢板和固定支架之间应采用锁边机进行直立锁边处理，当采用钩头螺栓连接时，对压型钢板四角应预先钻好钉孔，并应按此孔位置在檩条上定位钻孔，其孔径应比螺栓直径大0.5mm；2铺设压型钢板屋面时，上、下两排板的搭接长度应根据板型和屋面坡长确定，不应小于200mm。接缝内应用密封材料嵌填严密；3 压型钢板的安装应使用单向螺栓或拉铆钉连接固定。压型钢板与固定支架应用螺栓固定；4 压型钢板应伸入檐沟内，其长度不应小于50mm。檐口应用异形镀锌钢板的堵头封檐板；山墙应用异形镀锌钢板的包角板和固定支架封严；5 每块泛水板的长度不宜大于2m，与压型钢板的搭接宽度不应小于200mm。泛水板的安装应平直。
