  text: F.2.3 防水涂料与基层浸水后粘结性能应符合下列规定：1 所使用的水泥砂浆块尺寸应为70mm×70mm×20mm，应采用强度等级42.5普通硅酸盐水泥，质量配比为水泥:中砂:水＝1:2:0.4，水泥砂浆块的成型和养护按国家标准《建筑防水涂料试验方法》GB/T 16777-2008中7.1.1.4进行。养护结束的水泥砂浆块，应测试吸水率。将养护好的砂浆块放在（105±2）℃条件下干燥至恒重，取出在（23±2）℃干燥器皿中冷却2h，称量初始重量，放入符合国家标准《分析实验室用水规格和试验方法》GB/T 6682-2008规定的三级水中浸泡1h±2min，取出擦干或吸干砂浆块表面明水，称量浸水后质量并计算吸水率。应选择吸水率小于4%的水泥砂浆块进行试验；2应按国家标准《建筑防水涂料试验方法》GB/T 16777-2008 中第7 章A 法制备的粘结性能试件10 个，每5 个为一组。基层处理剂的使用按生产商要求。取一组制备好的试件在标准试验条件下养护6d，用双组分无溶剂环氧胶粘剂（如环氧植筋胶）将拉伸用上夹具与涂膜面粘贴在一起，继续养护至7d±2h，养护结束后应按国家标准《建筑防水涂料试验方法》GB/T 16777-2008 中7.1 测试粘结强度（σ0），修约至3 位有效数字。对于部分与胶粘剂粘结不良产品，可在粘贴前用砂纸适当打磨涂膜表面，改善接触面粘结性；3应取另一组已在标准试验条件养护7d的试件。将砂浆基层四个侧面和涂布面的边缘约5mm部分用石蜡和松香热熔后质量比为1:1的混合物进行封边处理，按F.2.1进行浸水试验，连续浸泡6d±2h，取出擦干或吸干涂膜表面明水，用双组分无溶剂环氧胶粘剂（如环氧植筋胶）将拉伸用上夹具与涂膜面粘贴在一起，在标准试验条件下放置3h±10min后继续放入水中浸泡24h±1h。对于部分与胶粘剂粘结不良产品，可在粘贴前用砂纸适当打磨涂膜表面，改善接触面粘结性。处理完毕后取出试件并擦干或吸干表面明水后，沿上夹具边缘四边用刀切割涂膜至基层，使试验面积为40mm×40mm，然后立即按国家标准《建筑防水涂料试验方法》GB/T 16777-2008中
