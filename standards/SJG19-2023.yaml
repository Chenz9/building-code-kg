  text: F.1.2 试件设备及养护应符合下列规定：1 试验前样品及所有器具应在标准试验条件下放置至少24h；2 试件制备及养护应按产品对应的国家标准、行业标准规定进行。当产品无对应国家标准、行业标准时，或国家标准、行业标准无规定时，试件的形状尺寸和数量可见表F.1.2。防水涂料涂膜试件的厚度应为（1.5±0.2）mm。防水卷材应均匀分布裁取试件，取样位置距外侧卷头不应少于300mm，并应避免靠近卷芯部位。接缝剥离强度、搭接缝不透水性应在搭接边部位取样。表F.1.2 防水卷材、防水涂料试件形状尺寸和数量数量试件形状尺寸a序号项目个mm卷材100×70外观涂料50×50耐水性防水卷材吸水率100×70防水涂料与基层无处理 5—浸水后粘结性能浸水处理 5人工气候加速老化100×50搭接前 400×200搭接前 2无处理试件 50×200试件 5搭接前 400×200搭接前 2接缝剥离强度热老化试件 50×200试件 5搭接前 400×200搭接前 2浸水试件 50×200试件 5搭接前约 300×200搭接前 6无处理试件约 300×300试件 3搭接前约 300×200搭接前 6搭接缝不透水性热老化试件约 300×300试件 3搭接前约 300×200搭接前 6浸水试件约 300×300试件 3外观、拉伸性能按产品标准拉伸性能—腐蚀性介质耐久性c处理时 150×150处理时 2低温性能低温柔性卷材试件 150×25每个试验面 5续表F.1.2序号项目试件形状尺寸a数量mm个处理时 100×100处理时 1低温柔性涂料试件 100×25试验时 3处理时 100×125处理时 2腐蚀性介质耐久性c低温性能卷材试件 100×50每个试验面 2低温弯折性处理时 100×100处理时 1涂料试件 100×25试验时 3a 卷材试件形状尺寸对应为：纵向×横向。b 非固化橡胶沥青防水涂料试件数量为5个。c 列出的是单一腐蚀性介质耐久性试验所需试件形状尺寸和数量。当采用多种介质种类时，所需试件形状尺寸不变，数量相应增加。
