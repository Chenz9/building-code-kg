  clause_no: 4.3.6
  text: 当屋面有种植区域与非种植区域时，做地垄墙、种植区耐根穿刺材料满铺或种植区耐根穿刺材料向非种植区域延伸2000mm，种植屋面的种植介质下应设过滤层，过滤层宜采用标称断裂强度不小于6.5kN/m 且不小于300g/m2的非织造土工布等材料。排水口应设置滤水装置和排水管。过滤层下应设排水板、卵石等材料组成的排水层。当采用土工布作为过滤层、凹凸型高分子排水板作为排水层时，宜采用二者直接粘结复合的产品，与排水板复合的土工布宜为不小于200g/m2的聚丙烯土工布，以确保过滤层不被种植土压入排水板的凹陷处，挤占排水空间。
