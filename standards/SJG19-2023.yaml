    content: 预制混凝土外墙板接缝防、排水应符合下列规定：1 按防水措施，可分为材料防水和构造防水两大类。材料防水通常采用接缝嵌填耐候建筑密封胶、墙板周边设置橡胶止水条等；构造防水主要有外低内高企口缝、设置排水空腔及排水管等；表5.2.8 是参考了国内现行国家与地方标准，并吸收工程实践经验的基础上汇总而成。表中部分措施还应结构各地方外墙板的习惯形式，以及是否有保温夹心层等因素进行选用；3设置排水管的目的有两方面：一是将可能进入缝内水排出；二是联通接缝内空腔，达到气压平衡的作用；4目前，市场上用于装配式建筑外墙防水的密封胶品种主要包括耐候聚氨酯建筑密封胶、硅烷改性聚醚硅酮建筑密封胶（MS 胶）等。考虑到密封胶的使用环境和耐久性，本规程规定用于装配式混凝土结构建筑外墙接缝的密封胶为位移能力不应低于25%的低模量建筑密封胶。
