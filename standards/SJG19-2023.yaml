  clause_no: 7.3.9
  text: 结构变形或管道伸缩量较小时，穿墙管可采用主管直接埋入混凝土内的固定式防水法，主 管应加焊钢板止水环或环绕遇水膨胀止水条，并应在迎水面预留凹槽，槽内应采用密封材料嵌填 密实。当结构变形或管道伸缩量较大或有更换要求时，应采用套管式防水法，套管应加焊止水环， 其防水构造宜采用图7.3.9 的形式。 53 图7.3.9 单管穿墙防水节点构造 1—刚性安装聚合物水泥防水砂浆满填；2—聚氨酯密封胶；3—柔性安装聚氨酯泡沫堵塞；4—钢板止水环； 5—遇水膨胀止水条；6—预埋钢套管；7—穿墙管；8—附加防水层；9—外墙防水层；
  is_abolished: false
