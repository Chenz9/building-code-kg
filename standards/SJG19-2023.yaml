  text: F.5.4 热老化试验应按F.5.2制备试件。应将养护好的试件按国家标准《建筑防水材料老化试验方法》GB/T 18244—2022中第5章规定进行处理，试验条件应为（70±2）℃连续处理7d±2h。对于有自粘层的防水卷材，应将搭接好的试件胶层面朝上，胶层面隔离材料保留进行处理，处理时将试件平放在尺寸稍大一些的胶合板上，可在胶层面上放置一块尺寸相近的无纺布和3mm～4mm厚铝塑板。处理结束后取出试件应在标准试验条件下放置2h，并应按F.5.3进行试验；
