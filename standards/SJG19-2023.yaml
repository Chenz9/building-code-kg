  text: 自修复防水混凝土结构钢筋保护层厚度控制，应采用水泥或混凝土垫块，并应符合下列规定：1 垫块的数量、间距和固定方式，应考虑钢筋绑扎和混凝土浇筑等施工荷载；2 垫块应具有足够的承载力；3 垫块的抗渗、抗冻、防腐蚀等性能，应与结构混凝土相同或相近。
