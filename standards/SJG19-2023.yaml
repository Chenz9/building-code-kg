    type: parameter_table
    note: 条件→参数查表（OCR合并正文，行列结构缺失）
    content: 表7.1.2 的规定，抗压强度应满足工程结构要求。表7.1.2防水混凝土最低抗渗等级（按埋置深度确定抗渗等级）工程埋置深度（m）设计抗渗等级H＜10P810≤H＜20P10H≥20P12
  converted_tables:
  - raw: 地下工程结构采用防水混凝土，实践证明不但提高地下工程的防水能力，同时也提高了结构的耐久性，是应肯定的，所以规定地下工程的钢筋混凝土应采用防水混凝土。防水混凝土均应达到P8及以上的抗渗等级，低于该等级，防水混凝土的耐久性、抗渗性、密实性都不能符合要求。深圳临海地下水位高，部分区域地下水对钢筋混凝土有一定腐蚀性，故抗渗等级有适当提高。
