  - raw: 金属板屋面防水的关键是接缝，由于金属受温差影响变形量大，热胀冷缩频繁并直接受热，所以在接缝处要求放置一定厚度、耐热、老化性能高的橡胶条，可采用丁基橡胶条、带，三元乙丙橡胶条、带密封，以适应变形和耐久。
