  text: F.6.2 应在每种溶液中浸入按表F.1.2裁取的一组大块试片，试片上面离液面至少20mm，试片之间应隔开放置，密闭容器，每隔7d更换一次溶液。浸泡28d后取出用清水冲洗干净，擦干，立即观察外观。在标准试验条件下放置1d，每块大试片上均匀裁取纵向、横向拉伸性能试件（涂料产品不区分纵横向）和低温性能试件。对于内增强型卷材，拉伸性能试件应离试片边缘10mm以上裁取。按产品标准进行拉伸性能试验和低温性能试验。本标准用词说明1 为便于在执行本标准条文时区别对待，对要求严格程度不同的用词说明如下：1）表示很严格，非这样做不可的：正面词采用“必须”，反面词采用“严禁”；2）表示严格，在正常情况下均应这样做的：正面词采用“应”，反面词采用“不应”或“不得”；3）表示允许稍有选择，在条件许可时首先应这样做的：正面词采用“宜”，反面词采用“不宜”；4）表示有选择，在一定条件下可以这样做的用词采用“可”。2 条文中指定按其他有关标准、标准的规定执行时，写法为“应符合……的规定”或“应按……执行”。引用标准名录1《建筑与市政工程防水通用规范》GB 550302 《建筑与市政工程施工质量控制通用规范》GB 550323《混凝土外加剂》GB 80764《聚氯乙烯防水卷材》GB 129525《SBS 弹性体改性沥青防水卷材》GB 182426 《APP 塑性体改性沥青防水卷材》GB 182437《水泥基渗透结晶型防水材料》GB 184458《改性沥青聚乙烯胎防水卷材》GB 189679《无机防水堵漏材料》GB 2344010 《自粘聚合物改性沥青防水卷材》GB 2344111《热塑性聚烯烃（TPO）防水卷材》GB 2778912 《建筑胶粘剂有害物质限量》GB 3098213《地下工程防水技术规范》GB 5010814 《混凝土外加剂应用技术规范》GB 5011915 《混凝土结构工程施工质量验收规范》GB 5020416 《屋面工程质量验收规范》GB 5020717 《地下防水工程质量验收规范》GB 5020818 《建筑装饰装修工程质量验收标准》GB 5021019 《建筑防腐蚀工程施工及验收规范》GB 5021220 《建筑工程施工质量验收统一标准》GB 5030021 《建筑防水卷材试验方法第9 部分高分子防水卷材拉伸性能》GB/T 328.922 《建筑防水卷材试验方法第10 部分沥青和高分子防水卷材不透水性》GB/T 328.1023 《建筑防水卷材试验方法第11 部分沥青防水卷材耐热性》GB/T 328.1124 《建筑防水卷材试验方法第13 部分高分子防水卷材尺寸稳定性》GB/T 328.131725 《建筑防水卷材试验方法第14 部分沥青防水卷材低温柔性》GB/T 328.1426 《建筑防水卷材试验方法第15 部分高分子防水卷材低温弯折性》GB/T 328.1527 《建筑防水卷材试验方法第18 部分沥青防水卷材撕裂性能（钉杆法）》GB/T328.1828 《建筑防水卷材试验方法第21 部分高分子防水卷材接缝剥离性能》GB/T 328.2129 《水泥标准稠度用水量、凝结时间、安定性检验方法》GB/T 134630 《胶粘剂180°剥离强度试验方法挠性材料对刚性材料》GB/T 279031 《碳素结构钢和低合金结构钢热轧钢板和钢带》GB/T 327432 《塑料薄膜和薄片厚度测定-机械方法》GB/T 667233 《铝及铝合金压型板》GB/T 689134 《色漆和清漆抗流挂性评定》GB/T 926435 《塑料灰分的测定第1 部分：通用方法》GB/T 9345.136 《建筑用压型钢板》GB/T 1275537 《硅酮和改性硅酮建筑密封胶》GB/T 1468338 《土工布及其有关产品无负荷时垂直渗透特性的测定》GB/T 1578939 《建筑防水涂料试验方法》GB/T 1677740 《生活饮用水输配水设备及防护材料的安全性评价标准》GB/T 1721941 《水泥胶砂强度检验方法（ISO 法）》GB/T 1767142 《高分子防水材料第1 部分：片材》GB/T 18173.143 《高分子防水材料第2 部分：止水带》GB/T 18173.244 《高分子防水材料第3 部分：遇水膨胀橡胶》GB/T 18173.345 《高分子防水材料第4 部分：盾构法隧道管片用橡胶密封垫》GB/T 18173.446 《聚氨酯防水涂料》GB/T 1925047 《橡胶密封件给、排水管及污水管道用接口密封圈材料规范》GB/T 2187348 《聚合物水泥防水涂料》GB/T 2344549 《喷涂聚脲防水涂料》GB/T 2344650 《预铺防水卷材》GB/T 2345751 《饰面石材用胶粘剂》GB/T 2426452 《预拌砂浆