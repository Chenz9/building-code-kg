- id: SJG 19-2023#9.1.8
  standard_code: SJG 19-2023
  chapter: 9 城市隧道和管廊防水设计与施工
  section: ''
  clause_no: 9.1.8
  text: 市政地下防水工程竣工验收前应进行全面检查，并应对渗漏水缺陷部位进行治理。渗漏水治理设计、选材和施工应符合现行行业标准《地下工程渗漏治理技术规程》JGJ/T 212 的规定，治理后的防水效果应符合工程防水类别的质量要求。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 现行国家标准《城市综合管廊工程技术规范》GB 50838—2015 第4.3.9 条规定“雨水纳入城市综合管廊可利用结构本体或采用管道方式”，第6.3.9 条规定“利用城市综合管廊结构本体排除雨水时，雨水舱结构空间应完全独立和严密，并应采取防止雨水倒灌或渗漏至其他舱室的措施”，即允许将管廊舱室作为本体直接作为雨水通道。事实上，考虑到城市综合管廊分舱舱室断面尺寸较小、廊体结构接缝数量较多的现实，目前的防水施工水平尚难以满足这一设计需要。一旦发生渗漏则必然会影响其他舱室的正常使用，带来不可预知的风险。从防水功能的可靠性出发，本规程不推荐将城市综合管廊舱室直接作为雨水排水通道。9.2 防 水 设 计
