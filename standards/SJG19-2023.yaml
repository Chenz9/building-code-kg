    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 下沉式卫生间的上下防水层采用不同构造，目的是避免对填充层形成全封闭（不透气）。下沉防水层可采用聚氨酯或丙烯酸等耐水浸泡的涂料。下沉式卫生间的主要目的，是横向管道维修时可在自家解决。因而，可减少对下层住房的打扰。但此设计却将可维修变成了不可维修。下沉式卫生间的任何维修，都可能是破坏性的：凿打、挖掘，产生大量垃圾且噪声扰四邻，渣土乱环境。况且，该设计全套技术并不成熟，包括上下防水层的设计、填充材料、管道接头。只要现场监管不力，或施工未严格按设计或相关工法进行，渗漏风险陡增。因此，从设计的角度总体考虑，弊大于利。应只在住宅设计中，并且业主要求时才采用。6.3 其他层次设计
