  clause_no: 7.5.6
  text: 超长大体积混凝土施工时，除留置变形缝或后浇带外，也可采用跳仓法施工，跳仓的最大分块尺寸不宜大于40m，跳仓间隔施工的时间不宜小于7d，跳仓接缝处应按施工缝的要求处理。
