  clause_no: 6.2.5
  text: 有填充层的厨房间、下沉式卫生间，应在结构板面上和地面饰面层下各设置一道防水层，下防水层宜采用聚氨酯防水涂料，填充层应采用吸水率低的材料，上防水层宜采用聚合物水泥防水涂料或聚合物水泥防水砂浆，并应在沉箱底部设置侧排水地漏。
