  clause_no: 9.2.13
  text: 预制管节拼装接缝密闭性的检测宜符合下列规定：1 采用注水加压的方式检测接缝密闭性时，应先通过预留检测孔向拼接缝中注水并充满，加压至设计压力，关闭水源后观察压降变化。当10min 内压力损失不大于设计压力的10%时，为合格；2 当采用遇水膨胀橡胶复合密封条时，不宜采用注水加压的方式检测接缝密闭性；3 宜根据现场施工技术水平、质量控制措施等因素，确定检测频率。
