  text: 立面涂料防水层上直接粘贴饰面砖时可采用拉毛、甩浆、涂刷界面剂或在最后一遍涂层未固化前均匀撒砂等措施，保证与饰面砖的粘结强度。聚合物水泥防水砂浆和高分子益胶泥可直接粘贴饰面砖。
