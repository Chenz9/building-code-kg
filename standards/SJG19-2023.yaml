  clause_no: 9.2.30
  text: 管片外防水涂料应符合下列规定：1对有中等以上腐蚀性介质的地层应采用外防防水涂料；2 具有良好的耐化学腐蚀性、抗微生物侵蚀性、耐磨性，并应无毒或低毒；3 涂层应能在盾构密封用钢丝刷与钢板挤压条件下不损伤、不渗水；4 防水涂料宜采用环氧、改性环氧、外涂型水泥基渗透结晶型等材料；5 在管片外弧面混凝土裂缝宽度达到0.2mm时，仍能在最大埋深处的水压下或0.8MPa水压不渗漏；6 涂料应涂刷在衬砌背面和环、纵缝橡胶密封垫外侧混凝土上。
