  converted_tables:
  - raw: 聚乙烯丙纶卷材防水层是指底部聚合物防水胶粘料和卷材共同组成的防水层，两者缺一不可，因此，聚合物防水胶粘料的质量是关键，必须经抽检合格才可以施工，施工时材料配比应准确、搅拌应均匀、铺抹厚度要保证，而且基层应湿润无明水，边刮抹浆料边铺卷材，并刮压卷材，排出下面空气，使它与基层粘牢，这是工艺技术的关键。
