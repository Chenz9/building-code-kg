  text: 混凝土结构蓄水类工程的防水节点构造设计应包括变形缝、施工缝、后浇带、穿埋管道、 孔口等部位，并应符合下列规定： 1 混凝土结构的变形缝、施工缝、后浇带的防水构造应符合表8.2.3 的规定； 变形缝、后浇带的防水构造 施工缝 变形缝 后浇带 混 凝 土 界 面 处 理 剂 或 外 涂 型 水 泥 基 渗 透 结 晶 性 防 水 材 料 预 埋 注 浆 管 遇 水 膨 胀 止 水 条 或 止 水 胶 中 埋 式 止 水 带 外 贴 式 止 水 带 中 埋 式 中 孔 型 橡 胶 止 水 带 外 贴 式 中 孔 型 止 水 带 可 卸 式 止 水 带 密 封 嵌 缝 材 料 外 贴 防 水 卷 材 或 外 涂 防 水 涂 料 补 偿 收 缩 混 凝 土 预 埋 注 浆 管 中 埋 式 止 水 带 遇 水 膨 胀 止 水 条 或 止 水 胶 外 贴 式 止 水 带 不应少于2 种 应选 不应少于2 种 应选 不应少于1 种 2 穿过结构防水层的管道应采用预埋套管，套管直径应大于管道直径50mm，套管与管道之 60 间采用密封材料填实，端口周边应填塞密封胶；埋入混凝土结构中的管道和套管应焊止水环及粘 贴缓膨型遇水膨胀止水条； 3 地下水池通向地面的各种孔口应采取防倒灌措施，孔口高出室外地坪高程不应小于 300mm。
