    content: 表3.0.4-1、表3.0.4-2、表3.0.4-3 的规定。市政蓄水工程应包括城镇公用设施和工业企业中的贮水或水处理地下构筑物、生活垃圾卫生填埋场防渗系统，不包括工业企业中具有特殊要求的给水排水工程构筑物。城市隧道和管廊防水设计与施工适用于地铁车站、区间隧道及城市综合管廊等市政地下工程防水设计与施工。表3.0.4-1 市政蓄水类工程防水等级及适用工程类型市政蓄水类工程类别甲类乙类丙类建筑室内水池、对渗漏敏感的室外除甲类和丙类以外的蓄水对渗漏水无严格要求游泳池和嬉水池。市政给水池和污类工程的蓄水类工程水池、侵蚀性介质贮液池等工程I类一级一级二级海洋、化学腐蚀环境Ⅱ类使用一级二级三级除I类环境外，干湿交替环境环境III类类别除I类环境外，长期浸水、长二级三级三级期湿润环境，非干湿交替的环境市政给水池和污水池、侵蚀性介质地表、地下水调蓄水池；雨人工湖、自然水体、景适用工程类型贮液池等工程水排水调蓄水池等观水系等表3.0.4-2 城市隧道和管廊地下工程防水等级及适用工程类型工程类别使用环境类别防水等级适用工程类型地铁车站及人行通道；变电站等对渗漏敏感的市政地下工程（甲类）一级设备集中区段；跨海隧道、过江隧道、湖底隧道地铁区间隧道及联络通道；地铁除甲类和丙类以外的市政地下工程（乙抗浮设防水位标高与地下结构一级车站风道等附属结构；地下过街类）板底标高高差H≥0m（Ⅰ类）人行通道；综合管廊对渗漏不敏感的物品、设备使用或贮存场部分地铁区间隧道、涵洞、出渣所，不影响正常使用的市政地下工程（丙二级支（隧）道类）注：暗挖法地下工程防水等级应根据工程类别、工程地质条件和施工条件等因素确定。表3.0.4-3 道桥工程防水设防等级工程类别使用环境类别防水等级适用工程类型特大桥、大桥、城市快速路、主干酸雨和盐雾等不良气候地区的使用环特大桥、大桥，城市快速路、一级路上的桥梁、交通量较大的城市次境（Ⅰ类）主干路上的桥梁，交通量较大干路上的桥梁，钢桥面板桥梁（甲的城市次干路上的桥梁，钢桥除Ⅰ类环境外的其他使用环境（Ⅱ类）一级类）面板桥梁，过街人行通道酸雨和盐雾等不良气候地区的使用环一级除甲类以外的城市桥梁工程；道路甲类以外的城市桥梁工程。道境（Ⅰ类）隧道工程（乙类）路隧道工程除Ⅰ类环境外的其他使用环境（Ⅱ类）二级
  converted_tables:
  - raw: 本次修订新增市政蓄水工程和道桥工程等相关内容，与原标准中的市政隧道和管廊一起并入市政工程，防水设计工作年限依据《建筑与市政工程防水通用规范》GB 55030的规定，并根据《建筑与市政工程防水通用规范》GB 55030，结合深圳市的气候特点、所处环境和工程地质情况，市政工程各部位的防水设防等级如下：1 市政蓄水类工程按防水功能的重要程度，将市政给水池和污水池、侵蚀性介质贮液池等列为甲类工程，对渗漏无严格要求的蓄水类工程列为丙类工程，除甲类和丙类以外的为乙类蓄水工程；按工程使用环境，将海洋、化学腐蚀环境划为Ⅰ类，有干湿交替的环境划为Ⅱ类，将除Ⅰ类和Ⅱ类外的长期浸水和长期湿润环境划为Ⅲ类，由此，将Ⅰ类和Ⅱ类使用环境下的市政给水池和污水池、侵蚀性介质贮液池等甲类蓄水工程，以及在海洋、化学腐蚀环境下地表、地下水调蓄水池；雨水排水调蓄水池等工程，设计为一级防水；2 根据深圳市地下工程抗浮设防水位标高与地下结构板底标高高差（H）一般不小于0m，则市政地下工程（城市隧道和管廊）属Ⅰ类防水使用环境，按防水功能的重要程度，对渗漏敏感的市政地下工程，为甲类工程，如：城市综合管廊干线或上部有种植绿化要求的综合管廊、轨道交通地下车站、行人通道、机电设备集中区段，设计为一级防水。对渗漏不敏感的物品、设备使用或贮存场所，不影响正常使用的丙类市政地下工程，如：城市综合管廊、轨道交通区间隧道及连接通道等附属结构，设计为二级防水；3 根据防水工程重要程度，对于深圳市道桥工程中的特大桥、大桥、城市快速路、主干道上桥梁、交通量较大的城市次干路上的桥梁，钢桥面板桥梁等，为甲类工程，桥梁工程桥面设计为一级防水；深圳地区存在有酸雨和盐雾等气候区域，属Ⅰ类使用环境，在此环境下，除甲类以外的城市桥梁工程和道路隧道工程，桥梁工程桥面也设计为一级防水。
    note: 合并重复提取片段
