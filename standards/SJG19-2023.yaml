    max_value: 2.0
  tables: []
  converted_tables:
  - raw: 热熔改性沥青涂料施工时基层干燥是最基本的要求，其次，施工温度要保证。温度过高易造成能源浪费和对改性沥青的老化损害；温度过低，不易涂刮。涂料涂刮应均匀一致，一般为一次性厚涂，如果厚薄不易掌握可分遍涂刷刮，第二次涂刷刮时不能上人，可铺薄胎体布或撒滑石粉。与卷材复合时，卷材铺贴应在涂料冷却前进行，铺贴改性沥青卷材时应拉紧不得松弛。与合成高分子卷材复合时，温度控制在50℃-60℃之间，过高损害卷材，过低粘结不良。
