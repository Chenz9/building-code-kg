  clause_no: 4.4.6
  text: 密封材料施工应符合下列规定：1 密封材料嵌缝的两侧基面应坚固，表面应平整、干燥、密实，不得有裂纹、麻面、起皮和起砂现象，嵌填密封材料前应先涂刷与密封材料相容的基面处理剂；2 槽缝底部应垫放背衬材料。嵌填聚氨酯、丁基等密封材料前应先涂刷渗透环氧作基面处理；3 基面处理剂干燥后应及时嵌缝，嵌缝深度宜为缝宽的0.5～0.7 倍，嵌填密封材料应与基面粘结良好、连续不间断，不得混入气泡，表面应平整；4 填嵌密封材料时，应采取遮挡措施，避免污染周边部件；嵌填密封材料后应及时保护。
