  clause_no: 7.3.4
  text: 后浇带应设在受力和变形小的部位，具体位置及间距应由结构设计确定，其宽度宜为 700mm～1000mm。后浇带应采用补偿收缩混凝土，其混凝土强度等级和抗渗等级应不低于两侧混 凝土相应等级，钢筋应连接，两侧中部应设置钢板止水带，或设置缓膨型遇水膨胀橡胶止水条并 宜设置预备注浆系统，后浇带混凝土两侧接缝处可涂水泥基渗透结晶型防水剂，附加防水层宜采 用2mm 厚柔性防水材料，每边宜宽出后浇带300mm，可见图7.3.4-1。底板后浇带设计宜选用超 前止水构造，可见图7.3.4-2。 48 底板后浇带 1—混凝土垫层；2—附加防水层；3—底板防水层；4—细石混凝土保护层；5—防水混凝土结构底板；6—钢板止水带； 7—后浇补偿收缩防水混凝土；8—采用可拆除的快易收口钢网；9—缓膨型遇水膨胀橡胶止水条；10—预备注浆系统 侧墙后浇带 1—保护层；2—附加防水层；3—侧墙防水层；4—防水混凝土结构侧墙；5—钢板止水带；6—后浇补偿收缩防水混凝土； 7—采用可拆除的快易收口钢网；8—缓膨型遇水膨胀橡胶止水条；9—预备注浆系统 49 顶板后浇带 1—防水混凝土结构顶板；2—钢板止水带；3—后浇补偿收缩防水混凝土；4—采用可拆除的快易收口钢网；5—保护层； 6—附加防水层；7—顶板防水层；8—隔离层；9—缓膨型遇水膨胀橡胶止水条；10—预备注浆系统 图7.3.4-1 后浇带 图7.3.4-2 底板超前止水后浇带 1—底板防水层；2—附加防水层；3—混凝土垫层；4—外贴式橡胶止水带；5—细石混凝土保护层；6—结构配筋；7—钢板止水 带；8—后浇补偿收缩防水混凝土；9—采用可拆除的快易收口钢网；10—缓膨型遇水膨胀橡胶止水条；
