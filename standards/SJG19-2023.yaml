  tables: []
  converted_tables:
  - raw: 近年来，地下工程越来越多地采用了内支撑的支护形式，深圳地区常用的内支撑立柱主要有三种：格构式型钢柱、钢筋混凝土立柱和钢管混凝土立柱；格构式型钢立柱和钢管混凝土立柱一般与底板整体浇筑，以后不再拆除，这两种立柱一般采用在底板厚度1/2 处设置不小于100mm宽、3mm 厚的止水钢板（格构式型钢柱需在每一肢型钢内外两侧设置止水钢板），底板主防水层与钢管、型钢立柱节点处采用遇水膨胀止水胶。钢筋混凝土由于立柱混凝土一般抗渗性较差，其强度和配筋与底板都有不同，建议参照后浇带作法采用后浇洞口的方式进行施工，底板主防水层施工时在立柱处留出500mm 宽防水搭接边，以便钢筋混凝土立柱拆除后防水层的有效搭接；洞口应增加防水附加层；当立柱混凝土抗压强度及抗渗等级均能满足要求，在结构工程师的同意下，也可以采用直接在底板部位的混凝土立柱上植筋、在立柱周边增加钢筋混凝土环（暗）梁的方式与底板一次性浇筑，底板完成后不再凿除立柱，底板与混凝土立柱节点处的防水处理与钢管或格构式型钢柱相同，这种方法简化了节点防水处理。
    note: 合并重复提取片段
