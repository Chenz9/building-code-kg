  converted_tables:
  - raw: 深圳是沿海地区，台风多，雨量大。近年来，建筑外墙的渗漏现象日益严重。根据墙体特点，制订组合防水层。外墙面防水材料只能采用防水砂浆、高分子益胶泥、防水涂料，不能采用卷材和热敏感性大的沥青基材料，已是显而易见。外墙面防水砂浆和防水涂料要求具有耐水、耐候性外，还应具有一定的抗基层变形能力和较强粘结力，因此只能选择聚合物水泥防水砂浆和聚合物水泥防水涂料。聚合物水泥防水砂浆或涂料厚度，按墙体材料和楼层高度选择，混凝土墙体或较低楼层，取较小值；砌块墙体和较高楼层取较高值，主要是考虑风压对雨水渗入墙体的影响。当外墙采用饰面砖，要求防水层采用聚合物水泥防水砂浆、高分子益胶泥，采用专用瓷砖胶或高分子益胶泥粘贴瓷砖。应先进行样板房施工，经拉拔检测合格后方可进行大面积施工。
