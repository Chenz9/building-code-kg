  converted_tables:
  - raw: 规定了填埋场防渗的功能及性能要求。填埋场进行防渗处理可以有效阻断渗沥液进入环境中，避免地表水与地下水的污染。此外，应防止地下水进入填埋场，地下水进入填埋场后一方面会大大增加渗沥液的产生量，增大渗沥液处理量和工程投资；另一方面，地下水的顶托作用会破坏填埋场底部防渗系统。因此，填埋场必须进行防渗处理，并且在地下水位较高的场区应设置地下水导排系统。防渗层设计应对防渗系统工程材料的物理性质、化学性质以及抗老化性质加以要求，具体指标要求应符合产品标准要求，并且确保防渗层在防渗区域覆盖完整，且在填埋场运行期间及封场后填埋垃圾降解稳定化期间内均有效。
