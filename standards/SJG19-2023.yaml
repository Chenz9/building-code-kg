- id: SJG 19-2023#9.2.18
  standard_code: SJG 19-2023
  chapter: 9 城市隧道和管廊防水设计与施工
  section: 9.2 防水设计
  clause_no: 9.2.18
  text: 矿山法市政地下工程防水层的设计应符合下列规定：1 防水层宜选用塑料防水板，也可选用高分子自粘胶膜预铺防水卷材或喷涂丙烯酸盐、喷涂橡胶沥青防水涂料等喷涂成膜类防水涂料；2 塑料防水板、高分子自粘胶膜预铺防水卷材或喷涂成膜防水涂料应与衬垫材料结合使用；3 防水层应设置在复合式衬砌的初期支护和二次衬砌之间；防水板与初支喷射混凝土之间应设置缓冲层；4 防水层宜在初期支护结构基本稳定后进行施工；5 衬垫材料应固定在基面上，固定点的间距应根据基面平整情况确定，拱部不宜大于0.3m，边墙不宜大于0.5m，底部不宜大于1.0m，局部凹凸不平时应加密固定点；6塑料防水板铺设后，应在其内表面设置注浆嘴及注浆导管等预埋注浆系统。
