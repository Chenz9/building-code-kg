- id: SJG 19-2023#7.5.4
  standard_code: SJG 19-2023
  chapter: 7 建筑工程地下防水设计与施工
  section: 7.5 地下工程防水层施工
  clause_no: 7.5.4
  text: 防水混凝土应根据施工工艺及材料进行配合比设计和试验，试验的抗渗等级应比设计等级高0.2MPa；混凝土拌合物的氯离子含量不应超过胶凝材料总量的0.1%；混凝土中各类材料的总碱量即Na2O 量不得大于3kg/m3。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
