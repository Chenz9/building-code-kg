  - raw: 《高层建筑混凝土结构技术规程》JGJ 3—2010中12.2.3“…可每隔30m～40m设置贯通顶板、底板及墙板的施工后浇带。…后浇带封闭时间宜滞后45d 以上”；后浇带设防增加了迎水面附加防水层，以适应开裂的要求，同时后浇带两侧要求打遇水膨胀橡胶止水胶，阻止变形开裂时水的渗透。本次修订增加了预备注浆系统，预备注浆系统由预埋注浆管、连接管/件及PVC导管组成，用于混凝土中的后浇带、施工缝、新旧混凝土之间的接缝等处的永久密封。当水渗入接缝时，可以通过设定在表面的PVC 导管注入水泥或化学浆液加以封堵。这种注浆系统可以重复使用，极大地解决了混凝土裂缝特别是活动缝的渗漏水问题。
