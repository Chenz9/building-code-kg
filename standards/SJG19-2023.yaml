  clause_no: 4.4.23
  text: 瓦屋面施工应符合下列规定：1铺设防水卷材应自下而上平行屋脊铺贴，搭接应顺流水方向；卷材铺贴时应压实铺平，上部卷材施工时不得损坏下部卷材；2 挂瓦条间距应根据瓦的规格和屋面坡度确定。在现浇混凝土屋面板基层上宜抹掺抗裂纤维聚合物水泥砂浆顺水条，每隔1.5m 留出20mm 缝隙；3平瓦应铺成整齐的行列，彼此紧密搭接，靠近屋脊处的第一排瓦应用砂浆粘牢。平瓦铺设时应均匀分散堆放在两坡屋面上，不得集中堆放，宜由两坡从下向上同时对称铺设；4在基层上采用泥背铺设平瓦时，前后坡宜自下而上同时对称施工，并随即铺设平瓦；5 砂浆顺水条可在找平层施工时一起完成，或在找平层完成后再抹掺抗裂纤维聚合物水泥砂浆，砂浆顺水条或金属固定件位置应准确、顺直；6挂瓦条金属固定件应埋置在结构板中。埋件周边应用密封材料密封，密封前应对密封部位进行清洁处理；7根据预埋锚固筋设计位置，锚固筋预先植入结构板中，植筋长度应高出保护层20mm以上；8 在挂瓦条上用金属丝绑扎固定瓦片时，绑扎应牢固不松动。
