  - raw: 自粘卷材施工，一般不能在干燥基层上直接铺贴，需先涂刷基层处理剂；如果基层潮湿，应涂刮一道水泥浆3mm-5mm厚，并边刮抹水泥浆边铺卷材。因自粘卷材粘结力强，施工时应先预铺裁剪，避免边铺边裁剪。铺贴时底面的隔离纸必须撕干净，不得残留，铺贴时要排净卷材下空气，拉紧、滚压粘牢。
