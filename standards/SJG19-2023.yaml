  section: 10.3施工
  clause_no: 10.3.23
  text: 钢桥面防水粘结层施工应符合以下规定：1 施工前应对工作面进行清洁处理，清除油污、水分及其他污染；2 如设置防腐层，应在防腐层彻底固化并检验合格后，进行防水粘结层施工。如未设置防腐层，应在喷砂除锈后4h 内完成第一层防水粘结层施工；3 防水粘结层材料在涂布前应采用动力搅拌器充分搅拌均匀；4 如采用喷涂方式，喷涂前应对桥梁栏杆和其他易受喷涂飞溅影响的桥梁部位进行防护；喷涂作业时，当风速较大导致出现撒布斑痕，应采取有效的防风遮挡措施，风速大于10m/s时不得施工；5 涂布应均匀，对于漏涂、龟裂、流坠、针眼和气泡等缺陷应及时修补。
