- id: SJG 19-2023#7.2.6
  standard_code: SJG 19-2023
  chapter: 7 建筑工程地下防水设计与施工
  section: 1.2厚热塑性橡胶自粘橡胶防
  clause_no: 7.2.6
  text: 处于腐蚀介质中的地下室工程，除应在迎水面采用耐腐蚀的防水材料进行设防外，尚应符合《建筑防腐蚀工程施工及验收规范》GB 50212 的规定。底板或外墙现场不具备施工外防水且地下水腐蚀性和氡浓度均不超标时，应采用外涂型水泥基渗透结晶型防水材料、渗透型硅烷防水剂做内防水，同时应增加结构抗裂措施。
