  section: ''
  clause_no: 1.0.2
  text: 本标准适用于深圳市建筑和市政工程的防水设计、施工、验收和运行维护。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: null
    modal_words: []
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 防水工程设计、选材、施工、验收是一个系统工程，四者紧密联系。按照“设计是前提，材料是基础，施工是关键，管理是保证”的原则，确保使用年限内不得发生渗漏。本次修订按照《建筑与市政工程防水通用规范》GB 55030规定，增加运行维护等相关内容。
    note: 合并重复提取片段
