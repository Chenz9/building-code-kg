- id: SJG 19-2023#9.2.11
  standard_code: SJG 19-2023
  chapter: 9 城市隧道和管廊防水设计与施工
  section: 9.2 防水设计
  clause_no: 9.2.11
  text: 承插式接口的密封应符合下列规定：1承口及插口尺寸应符合设计规定；2当采用柔性矩形（弧形）承插接头时，宜在插口工作面上设置两道弹性橡胶密封圈，并应在其间预留检测孔。可见图9.2.11-1；图9.2.11-1双胶圈柔性承插接头密封防水构造1—建筑密封胶；2—聚乙烯泡沫板；3—弹性橡胶密封圈；4—预留检测孔3当采用纵向锁紧承插接头时，宜在插口工作面上设置两道弹性橡胶密封圈，或宜在端面上设置一道遇水膨胀橡胶复合密封条或自粘丁基腻子复合密封条，并在工作面上设置一道弹性橡胶密封圈，两道密封措施之间应预留检测孔。可见图9.2.11-2；图9.2.11-2 纵向锁紧承插接头密封防水构造1—建筑密封胶；2—聚乙烯挤塑聚苯板；3—弹性橡胶密封圈；4—预留检测孔；5—遇水膨胀橡胶复合密封条或自粘丁基腻子复合密封条4 当采用钢承插口接头时，承口钢环和插口钢环所用钢板厚度不宜小于10mm，材质应符合现行国家标准《碳素结构钢和低合金结构钢热轧钢板和钢带》GB/T 3274的规定，并应采取防腐蚀措施。插口部位宜设置双道弹性橡胶密封圈，并应在其间预留检测孔。可见图9.2.11-3；图9.2.11-3 钢承口承插接头密封防水构造1—承口钢环；2—遇水膨胀橡胶止水条（胶）；3—聚乙烯泡沫板；4—弹性密封胶嵌缝（双组分聚硫）；5—插口钢环；6—弹性橡胶密封圈；7—预留检测孔5插口端面宜按设计要求设置聚乙烯泡沫板衬垫，其性能应符合现行行业标准《混凝土接缝密封嵌缝板》JC/T 2255 的规定。衬垫的厚度、铺设面积、压缩率等应符合设计要求；6弹性橡胶密封圈、遇水膨胀橡胶复合密封条、自粘丁基橡胶复合密封条等应预先安装在承口预留的沟槽中，并应环向闭合；7沟槽的形式、截面尺寸应与密封条的形式和尺寸相匹配；8 接缝迎水面可嵌填低模量建筑密封胶，背水面宜嵌填高模量建筑密封胶；9 预制混凝土城市综合管廊拼装前，密封圈（条）和聚乙烯泡沫板等应安装完毕；密封胶宜在接缝密闭性检测合格后再施工。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters:
  - name: 板厚度
    unit: mm
    condition: null
    min_value: null
    max_value: 10.0
  tables: []
  converted_tables:
  - raw: 本条规定了承插式结构密封应满足的要求。2 在这种承插口构造中，主要依靠工作面上两道弹性橡胶密封圈的压缩变形—回弹实现接缝的密封，纵向刚度不如带锁紧装置的城市综合管廊。弹性橡胶密封圈的压缩比是关键技术指标之一；3 由于采用了纵向锁紧装置，增加了管节间的连接刚度，位于承口端面的遇水膨胀橡胶密封条或自粘丁基橡胶复合密封条受压变形回弹，与位于插口工作面上的弹性橡胶密封圈共同作用，形成双道密封。通常，密封圈是指在工厂预制成型并闭环，现场无须进行搭接的定型密封制品；密封条是指在工厂预制成型，但需要在现场进行搭接处理的密封制品。位于承口端面上的弹性橡胶复合密封条有加强防水密封和降低土体中瓦斯等危险气体渗入廊体，引起安全事故风险的作用；4 考虑到钢套环与管节混凝土温度收缩不一致，两者之间可能存在渗水通道，通常采用设置遇水膨胀止焊接止水片等防水措施。在钢套环管节端头预留沟槽中灌注低模量建筑密封胶，也有助于提高钢套环与混凝土之间的防水性能；6 承插口中设置的密封条主要有弹性橡胶密封圈和遇水膨胀橡胶复合密封条、自粘丁基橡胶复合密封条两类。弹性橡胶密封圈的材质可以是三元乙丙橡胶（EPDM）、氯丁橡胶（CR）、丁苯橡胶、丁腈橡胶等，可根据地下水环境进行选择。一般在工厂中预制成环，截面一般为楔形、梳形、圆形，主要用在插口工作面上；遇水膨胀橡胶复合密封条是以弹性橡胶为主的顶面挤出复合遇水膨胀橡胶，截面一般呈梯形；安装在插口端面的预留凹槽中，利用压缩力实现接缝密封；顶部遇水膨胀橡胶遇水后膨胀，达到以水止水的密封效果。自粘丁基橡胶复合密封条是在海绵橡胶或中部开孔的三元乙丙橡胶条表面包覆一层2mm～3mm 厚的丁基腻子制成，充分结合了丁基腻子的粘结性、蠕变性和水密性、气密性以及弹性密封条的弹性，具有施工简便、密封可靠的优点。在橡胶条表面复合自粘丁基橡胶，在压力的作用下，利用丁基橡胶的粘结和填充补平作用实现接缝的密封，截面呈梯形、中空梯形或其他特殊形式。与遇水膨胀橡胶复合密封条一样，安装在承口的工作面上并在现场进行搭接；7 与盾构法隧道管片环纵缝中使用的弹性橡胶密封垫的作用机理不同，安装在插口端面预留凹槽中的密封条两侧均为混凝土（分别为承口和插口的端面），在拼装压力作用下不仅占满预留凹槽，而且向两侧变形，最终达到密封的目的。预留凹槽的作用更多地体现在安装的定位上。实践证明，适当的压缩率在保持接缝密闭性的同时，有利于延长密封条的使用寿命，通常不超过45%；8 接缝迎水面的密封胶在底部难以闭合成环，故可做可不做；接缝背水面具备胶体封闭成环的条件，可以成为一道密封防水措施。
