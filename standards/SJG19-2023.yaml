- id: SJG 19-2023#4.4.2
  standard_code: SJG 19-2023
  chapter: 4 屋面防水设计与施工
  section: 4.4 屋面防水层施工
  clause_no: 4.4.2
  text: 非固化橡胶沥青防水涂料与防水卷材复合施工应符合下列规定：1基层应干净、干燥；2 在基面上划出基线，应先对卷材进行裁剪预铺，施工非固化橡胶沥青涂料前重新将卷材卷回；3 非固化橡胶沥青防水涂料宜采用专用的加热设备加热，加热温度不应高于160℃，倒在基面上的热熔涂料应及时按弹线位置铺摊刮平，也可采用喷涂施工；4 采用与改性沥青防水卷材复合使用时，可在热熔涂料涂覆后立即进行防水卷材施工；5 卷材铺贴应符合本标准第4.4.1条第6～9款的规定，卷材铺贴后2h内不得扰动、上人踩踏。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
