  converted_tables:
  - raw: “防水材料的耐久性应与工程防水设计工作年限相适应”摘自《建筑与市政工程防水通用规范》GB 55030中对防水材料的规定。为配合标准制订，我们对拟选的材料做了各项基本性能测试。在行了粘贴于基层的防水层窜水压力试验，不同厚度材料抵抗基层开裂试验，热老化72h的变形（收缩、膨胀）试验，以确定材料使用环境要求。对所选用的材料了耐水压力、抗裂、窜水压力、粘结强度和耐介质水性能的试验。总结了防水设防新思路：“基层封闭”，“组合防水”，“全面连续设防”，不但要求防水层材料具有水密性，并且应具有抵抗结构变形、适应施工环境等全面要求。
