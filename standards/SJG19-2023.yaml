  text: 抗浮锚杆节点处宜采用防水涂料整体防水，防水涂料的厚度不应小于2mm，当底板防水 采用卷材时，应采用单组分聚氨酯建筑密封胶或非固化橡胶沥青防水涂料进行加强处理，锚杆体 之间的间隙可采用单组分聚氨酯建筑密封胶密封或非固化橡胶防水涂料灌满。其抗浮锚杆防水构 造可见图7.3.7。 图7.3.7 锚杆防水节点构造 51 1—底板防水层；2—防水涂料（厚度不小于2mm）； 3—灌注单组分聚氨酯建筑密封胶或非固化橡胶沥青防水涂料（总厚度不小于20mm）；4—混凝土垫层； 5—细石混凝土保护层（预铺反粘防水卷材不设此层）；6—防水混凝土底板；
