- id: SJG 19-2023#7.1.5
  standard_code: SJG 19-2023
  chapter: 7 建筑工程地下防水设计与施工
  section: ''
  clause_no: 7.1.5
  text: 地下工程墙面防水混凝土表面可不设找平层，对拉螺杆孔宜用聚合物水泥防水砂浆填塞密实，混凝土表面缺陷处宜用聚合物水泥浆修补平顺，防水层直接施工在结构基面上。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: should
    modal_words:
    - 宜
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 目前，较多混凝土模板采用光面的金属板或细木板，成型后混凝土表面光滑，再做找平层反容易出现空鼓、开裂等现象，且造成人工和材料的浪费。因此，只需要对拆模后的混凝土表面缺陷进行处理，将表面的凸出疙瘩物清除，涂刮一道聚合物水泥浆修补平顺，目的只是堵塞混凝土表面气孔，形成平整、光滑的表面。这样既省工、省料又提高了质量，防水层直接施工在钢筋混凝土结构基面上其防水效果更佳，是应大力提倡的。
    note: 合并重复提取片段
  references: []
