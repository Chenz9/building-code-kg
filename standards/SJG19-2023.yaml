  text: 柔性外设防水层的甩槎和接槎应符合下列规定： 1 侧墙及顶板部位的柔性外设防水层的施工宜拼接缝检漏合格后进行； 2 底板防水层的甩槎宜设置在混凝土垫层上，甩槎部位的防水层表面应设置隔离膜及临时 保护措施，保护层宽度不应小于350mm，底板-侧墙部位防水层的搭接宽度不应小于150mm。可 见图9.2.14。 3 拼接缝底板部位可不做柔性外设防水层的加强层，侧墙及顶板部位宜设置加强层，加强层 的宽度不宜小于300mm，变形缝部位应设置加强层； 4 底板柔性防水层应采用细石混凝土设置保护层，保护层厚度不应小于50mm，抗压强度等 级不应低于C30，平整度不应大于±2mm。 图9.2.14 预制拼装结构综合管廊底板防水层的甩槎 1—素土夯实；2—混凝土垫层；3—外设防水层；4—隔离层；5—临时保护措施； 6—细石混凝土保护层；
