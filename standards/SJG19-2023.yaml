  parameters: []
  tables: []
  converted_tables:
  - raw: 无穿透直立锁边工艺系统是一种先进的工艺，因此提倡采用。金属板材的另一个防水关键问题是将板紧密地固定在支架上，用螺栓（螺钉）固定，以减少变形。板应采用带防水垫圈的镀锌螺栓（螺钉）固定，固定点应设在波峰上。所有外露的螺栓（螺钉），均应涂抹密封材料保护。4.4 平屋面防水层施工I 平 屋 面完整的防水层可能是由多种材料组成的，为了保证施工质量，就应当按防水层所构成的材料体系提出施工要求，故将所有主体设防的有关复合施工工艺逐条列出其保证质量的施工要点。
