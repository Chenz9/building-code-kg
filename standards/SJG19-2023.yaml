- id: SJG 19-2023#4.2.1
  standard_code: SJG 19-2023
  chapter: 4 屋面防水设计与施工
  section: 4.2 细部构造设计
  clause_no: 4.2.1
  text: 细部构造设计应符合下列规定：1细部构造设计应遵循多道设防、复合用材、连续密封、适应基面的原则；2不同材性的两种材料交接处或基面变形可能产生开裂处应设分格缝、预留缝（槽）并嵌填密封材料；3 在应力集中变形较大的分格缝、施工缝、变形缝、预留缝部位，防水层应采用延伸率大的防水材料，或采取空铺法施工；4标准未作规定的细部构造应按上述要求，根据细部构造特征进行节点构造图设计。
  is_abolished: false
  abolished_date: null
  superseded_by: null
