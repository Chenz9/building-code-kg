  text: 防水材料性能指标应符合国家、行业、地方标准，进场验收应符合下列规定：1材料进场应提供产品合格证和说明书、出厂检测报告、型式检验报告；2材料应按标准要求运输和贮存，分类存放，防水材料的进场复验按本标准附录C 规定进行，材料送检应执行有见证取样送检规定，复验合格后方可使用；3物理性能全部项目检验结果符合标准规定时，即判定该批材料性能合格；若有两项或以上项目检验结果不符合标准规定，则判定该批材料性能不合格；若仅有一项检验结果不符合标准规定，允许在同批材料中重新取样对该项进行复检，复检结果符合标准规定，则判定该批材料性能合格，否则判为不合格；4防水层设计应适应工程特点和施工环境条件，符合环境保护规定。防水材料的有害物质限量应符合本标准附录D 的规定。防水材料（含配套材料）有害物质含量应符合现行行业标准《建筑防水涂料中有害物质限量》JC 1066 和产品标准要求，用于装饰装修分部工程的防水材料有害物质含量应符合现行深圳市地方标准《建筑装饰装修涂料与胶粘剂有害物质限量》SZJG 48的要求，并应符合下列规定：1）有害物质含量全部项目检验结果符合标准规定时，即判定该批材料有害物质含量合格；2）有两项或以上项目检验结果不符合标准规定，则判定该批材料不合格；3）若仅有一项检验结果不符合标准规定，允许在同批材料中重新取样对该项进行复检，复检结果符合标准规定，则判定该批材料有害物质含量合格，否则判为不合格。
