- id: SJG 19-2023#9.2.29
  standard_code: SJG 19-2023
  chapter: 9 城市隧道和管廊防水设计与施工
  section: 9.2 防水设计
  clause_no: 9.2.29
  text: 嵌缝防水应符合下列规定：1 在管片内侧环纵向边沿设置嵌缝槽，其深宽比不应小于2.5，槽深宜为25mm～55mm，单面槽宽宜为5mm～10mm；2 嵌缝材料应有良好的不透水性、潮湿基面粘结性、耐久性、弹性和抗下坠性；3 嵌缝应为整环作业，应根据嵌缝槽断面构造形式和城市综合管廊的衬砌接缝形式确定嵌缝材料的材质及嵌缝细部构造；4 嵌缝防水施工应在盾构千斤顶顶力影响范围外进行。同时，应根据盾构施工方法、综合管廊的沉降稳定性，确定嵌缝作业开始的时间；5 嵌缝作业应在接缝堵漏和无明显渗水后进行，嵌缝槽表面混凝土如有缺损，应采用聚合物水泥砂浆或特种水泥修补，强度不应小于混凝土本体强度。嵌缝材料嵌填时，应先刷涂基层处理剂，嵌填应密实、平整。
