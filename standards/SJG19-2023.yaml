  text: 检验划分应符合下列规定：1 混凝土原材料及拌合物、现浇混凝土结构及预制装配式混凝土结构的检验批划分应符合现行国家标准《混凝土结构工程施工质量验收规范》GB 50204 的规定；2细部构造防水应按变形缝或后浇带等施工段划分检验批，并应全数检查；3 卷材防水层、涂料防水层、砂浆防水层等外设防水层应按照变形缝、后浇带等施工段划分检验批；4 矿山法、盾构法、顶进法施工的城市隧道与管廊防水工程应按隧道区间、变形缝等施工段划分检验批；5 盾构法、顶管和箱涵顶进法隧道的管片（管节）拼装接缝及螺栓孔防水处理、管片（管节）嵌缝及孔洞封堵应逐环（节）检查。
