  - raw: 本条款对《地下工程防水技术规范》GB 50108—2008 作了补充。柔性防水层应有一个良好的基层，为了保证垫层不变形，地基土层为原土时，不应再行扰动。基土为回填土时，则应分层夯实，以减少沉降变形。由于回填土压实度不够，常发生局部下沉现象。应提高垫层混凝土厚度，必要时应配置钢筋。
