  - name: 吸水率
    unit: '%'
    condition: null
    min_value: 3.0
    max_value: null
  tables: []
  converted_tables:
  - raw: 将保温层设置在防水层上面的做法叫倒置式屋面，倒置式屋面的优越性显而易见，由于防水层被保温层埋置封闭，大大提高了防水层的使用寿命，同时，防水层直接与结构层粘结，防止水在防水层下窜流，提高了防水层的可靠性，即使出现局部渗漏，也便于查找漏源。正置式、封闭式屋面，保温层含水率过高时，不但会降低其保温性能，而且在水分汽化时会使卷材防水层产生鼓泡，导致局部渗漏。采取排汽构造是控制保温材料含水率的有效措施。
