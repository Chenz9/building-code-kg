  converted_tables:
  - raw: 沥青瓦属轻质瓦，其设计之初，就是与檩条、木望板配套使用的：木望板上干铺油毡一层，然后铺钉沥青瓦，简洁而方便，全过程干作业。沥青瓦移植到钢筋混凝土坡屋面上，如果将其直接钉粘在混凝土基层上，会令其优势全失。较合理的构造是用在轻质保温块材上，因沥青瓦质轻，减少了下滑重力对保温层的不利。另外，因为不设挂瓦条，钢筋头可不留，在保温砌块的砂浆找平层上先铺沥青瓦垫层，然后直接粘钉沥青瓦。此种构造，要求保温砌块有一定的强度，且不能太脆。砂浆找平层则宜采用聚合物水泥砂浆，至少应为纤维水泥砂浆，目的是增加砂浆的韧性，以便钉铺沥青瓦时，减少钉孔四周开裂。沥青瓦钉铺，应采用专门设计的射钉。III 金 属 屋 面
