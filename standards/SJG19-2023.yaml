  text: 止水带的选择，应根据伸缩缝变形梁及水压、工作环境、经济因素等条件综合考虑确定。止水带材质应考虑介质的腐蚀性影响，当遇有含弱酸、碱性的水时宜选用氯丁橡胶止水带，当遇有含油类的水时，宜选用丁腈橡胶止水带。
