  text: 地下工程混凝土结构防水设计应包括下列内容：1 防水等级和设防要求；2 防水混凝土的抗渗等级和其他技术指标、质量保证措施；3 变形缝、诱导缝、施工缝、后浇带、桩头、锚杆、基坑支护立柱穿地下室底板节点、穿墙管等工程细部构造的防水措施，选用的材料及其技术指标、质量保证措施；4 工程的防排水系统、截水系统及工程各种洞口的防倒灌措施；5 建筑地下室或地下构造物存在上浮问题时，应进行整体抗浮及底板局部抗浮验算及设计，并应采取有效的抗浮措施。
