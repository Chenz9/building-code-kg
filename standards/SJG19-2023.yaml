- id: SJG 19-2023#3.0.1
  standard_code: SJG 19-2023
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.1
  text: 工程防水设计应遵循以防为主、防排结合、综合治理、因地制宜的原则。防水工程应构造合理、材料耐久、设防可靠、经济实用。
