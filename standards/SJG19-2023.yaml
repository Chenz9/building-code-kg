  conflicts: []
- id: SJG 19-2023#7.1.6
  standard_code: SJG 19-2023
  chapter: 7 建筑工程地下防水设计与施工
  section: ''
  clause_no: 7.1.6
  text: 当支护结构（地下连续墙或支护桩）作为主体结构侧墙外模时，应采用预铺反粘防水卷材做防水层，安装侧墙内模时宜采用工具式模板支撑系统或钢管对顶加斜撑的支模方式，少用或不用穿过防水卷材的对拉螺杆，应在背水面增加刚性防水层；当支护结构表面平整度差时，可采用细石混凝土或水泥砂浆修补抹平。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 目前，深圳地区单面支模的现象越来越多，这种把支护结构作为外侧模板用，先铺设预铺反粘卷材，后进行主体结构的施工方法，也可称为外防内贴法。采用预铺的方法，使防水卷材与外墙混凝土粘结牢固，具有很好的防窜水功能，又由于预铺卷材与外围护结构之间不粘结，结构变形不会造成防水层的破坏；由于卷材在对拉螺栓位置会穿孔，故支模时不宜设置穿过防水层的对拉螺栓，可采用工具式单面支模方式或对顶的支模方式，这两种方法已经在深圳地区地铁或部分房建工程施工中得到大量应用且效果良好。
    note: 合并重复提取片段
