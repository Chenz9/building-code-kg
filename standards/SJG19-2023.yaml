  tables: []
  converted_tables:
  - raw: 地下室底板直接施工在基岩上时，粗糙的基岩面对结构底板混凝土有嵌固作用，限制了结构底板混凝土的收缩变形而产生裂缝，同时微风化等天然地基强度高，限制了建筑物的沉降，容易引起结构底板裂缝，所以应在基岩面与结构底板间增设褥垫层，一般可在垫层混凝土下设置油毡或砂层作为褥垫层。
