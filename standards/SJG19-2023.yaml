    max_value: null
  tables: []
  converted_tables:
  - raw: 找平层系防水层的依附层，它的质量直接影响到防水层的效果。找平层强度低，易开裂，则防水层粘结不牢、空鼓或被拉裂，因此对找平层提出要求。找平层的目标是有一个平整、坚硬的表面，就目前施工水平，现浇钢筋混凝土采取随浇随抹工艺或加浆抹平工艺完全可行，这不但节约材料，更主要是确保了找平层的质量，减少了对防水层的损害。实践证明，找平层中掺抗裂纤维对减少找平层开裂有很好效果，应予推广。
    note: 合并重复提取片段
  - raw: 条的规定，用于地下防水工程的聚合物水泥防水涂料的耐水性不应小于80%（试样浸水后不烘干测量）。研究显示，采用丙烯酸酯乳液的涂料耐水性更易达到标准要求；3 非固化橡胶沥青防水涂料与热熔橡胶沥青防水涂料本体强度很低，宜与材料性能相容的改性沥青类防水卷材叠合使用，充分发挥涂料对基层缺陷的弥合能力，以及卷材良好的力学性能和厚度均一的优势；4 在聚氨酯、聚合物水泥涂料防水层上直接热熔施工改性沥青防水卷材，会造成涂料防水层损伤。
