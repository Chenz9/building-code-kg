- id: SJG 19-2023#7.6.12
  standard_code: SJG 19-2023
  chapter: 7 建筑工程地下防水设计与施工
  section: 7.6内掺自修复防水混凝土施工
  clause_no: 7.6.12
  text: 混凝土配合比应经试验确定，并应符合下列规定：1 试配要求的抗渗等级应比设计要求提高0.2MPa；2 混凝土的水胶比不得大于0.50，有侵蚀性介质时，水胶比不宜大于0.45；3 混凝土胶凝材料总量、水泥用量、砂率、灰砂比等指标，应符合现行相关国家标准的有关规定；4 自修复防水材料的掺加量应根据各厂家要求的规定；5 混凝土拌合物的氯离子含量不应超过胶凝材料总量的0.1%;混凝土中各类材料的总碱量当量不得大于3kg/m³；6 根据混凝土结构耐久性设计的要求，混凝土原材料的选用应符合现行国家标准《混凝土结构耐久性设计规范》GB 50476 的有关规定。
