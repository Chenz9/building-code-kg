  converted_tables:
  - raw: 城市综合管廊不属于给水排水管道，原则上并不适用于《给水排水管道工程施工及验收规范》GB 50268—2008 有关条文规定，但预制拼装城市综合管廊的接头形式及橡胶圈防水原理借鉴了钢筋混凝土管、预应力混凝土管等管道防水接头设计方法。预制管廊的拼缝接头水压试验，借鉴其中单口水压试验的方法，在工厂和现场进行的拼缝接头水压试验，工厂内试验成功后方可进行现场拼装。试验的主要合格标准包括试验压力值、恒压时间、允许压降值。本条规定参考了现行国家标准《给水排水管道工程施工及质量验收规范》GB 50268—2008 中“附录D 闭水试验法”和“附录E 闭气试验法”的一些规定，但在试验时间、压力等参数上又不完全相同。再结合当前工程实践经验的基础上，提出了相关试验参数。当采用注水加压法时，通常取拼接缝所在部位管廊基础最大埋深加5m 计算得到的水头压力为设计检测压力。11工 程 验 收本标准的设计、施工部分均按工程部位（屋面、外墙、室内、地下室）进行编制。但在工程验收部分，为了避免内容的大量重复，特按层次（基层、找平层、防水层、保温隔离层）和材料种类（卷材、涂料、结构防水混凝土、密封材料）进行编制。
