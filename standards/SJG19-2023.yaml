    _v21_param_note: 原名 '间不得少于' 为 OCR 碎片，已回源条文正文更正
  tables: []
  converted_tables:
  - raw: 从水泥基渗透结晶型防水涂料的应用情况看，这类材料目前市场比较混乱，产品质量良莠不齐，假冒伪劣产品时常出现，严重影响了地下工程的防水质量。外涂型水泥基渗透结晶型防水涂料中活性成分的拥有量是一定的，要想得到更多的生成物堵塞混凝土结构的毛细孔隙，必须有一定的厚度和或单位面积用量，所以规定其厚度为1mm 且用量应不少于1.5kg/m2。同时，规定了厚度指标，采用双控措施，外涂型水泥基渗透结晶型防水涂料是一种无机防水涂料，宜用于主体结构的迎水面或背水面。由于凝固快，与基面有较强的粘结力，比有机防水涂料更适宜用作主体结构背水面的防水。外涂型水泥基渗透结晶型防水涂料与混凝土主体结构结合仍应认为是2 道刚性防水设防，不适用于变形较大或受振动部位。7.3 细部构造设计
