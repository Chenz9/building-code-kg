  text: 三元乙丙橡胶防水卷材防水层施工应符合下列规定：1 基层应平整、干净、湿润无明水；2 防水卷材应进行试铺，按位置尺寸裁剪；3采用粘结料搭接时应按配比搅拌均匀，稠度适中，均匀摊平后，立即滚铺搭接；采用胶粘带搭接时应先粘接下部卷材，再与上层卷材粘接；4 采用粘结料搭接时接缝处应清理干净，两个粘结面同时涂刷粘结料，立即粘合。接缝处不得有褶皱、翘曲、开裂现象；铺贴卷材后2h 内不得上人踩踏；5粘贴三元乙丙橡胶防水卷材时，应符合本标准第4.4.1 条的规定。
