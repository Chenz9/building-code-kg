  text: 高层建筑地下室长度超过伸缩缝最大间距时，可通过设置变形缝、后浇带、诱导缝等措施， 减少混凝土裂缝，其细部构造设计应符合下列规定： 1 节点应连续密封，不得间断； 2 节点应多道设防，提高设防可靠性； 3 变形缝应有二道以上设防，防水层应满足变形的要求； 4 在两种不同材料交接处应留槽密封； 5 根据计算有明显沉降变形处，应设变形缝，无明显沉降变形的地下室宜少设或不设变形缝。 后浇带、施工缝、变形缝构造设防标准应符合 表7.3.1 明挖法地下工程结构接缝的防水措施 部位 施工缝 变形缝 后浇带 诱导缝 防 水 措 施 混凝 土界 面处 理剂 或外 涂型 水泥 基渗 透结 晶型 防水 材料 预 埋 注 浆 管 遇 水 膨 胀 止 水 条 或 止 水 胶 中 埋 式 止 带 中 埋 式 中 孔 型 橡 胶 止 水 带 外 贴 式 中 孔 型 止 水 带 可 卸 式 止 水 带 密 封 嵌 缝 材 料 外 贴 式 防 水 卷 材 或 外 涂 防 水 涂 料 补偿 收缩 混凝 土 预 埋 注 浆 管 中 埋 式 止 带 遇 水 膨 胀 止 水 条 或 止 水 胶 外贴 式止 水带 中 埋 式 中 孔 型 橡 胶 止 水 带 密 封 嵌 缝 材 料 外 贴 式 止 水 带 外贴 式防 水卷 材或 外涂 防水 涂料 方案 不应少于2 种 应 选 不应少于2 种 应 选 不应少于1 种 应 选 不应少于1 种。
