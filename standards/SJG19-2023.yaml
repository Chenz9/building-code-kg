  clause_no: 7.1.2
  text: 地下工程迎水面主体结构应采用防水混凝土，防水混凝土抗渗等级应根据地下工程埋深 确定，并应根据防水等级的要求采取其他防水措施，抗渗等级应符合表7.1.2 的规定，抗压强度 应满足工程结构要求。 表7.1.2 防水混凝土最低抗渗等级（按埋置深度确定抗渗等级） 工程埋置深度（m） 设计抗渗等级 H＜10 P8 10≤H＜20 P10 H≥20 P12。
