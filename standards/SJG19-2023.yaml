  clause_no: 4.4.30
  text: 单层防水卷材屋面机械固定施工应符合下列规定：1 隔汽层宜空铺于压型钢板或装配式屋面板上，采用机械固定法施工时应与保温隔热层同时固定；隔汽材料的搭接宽度不应小于100mm，并应采用密封胶带连接；屋面开孔及周边部位的隔汽层应采用密封措施；2 保温板多层铺设时，上下层保温板应错缝铺设；机械固定施工时，保温板材的压缩强度和点荷载强度应符合设计要求；固定件规格、布置方式和数量应符合设计要求；3 固定件间距和数量应根据抗风揭试验和当地的使用环境条件确定，且符合设计要求；螺钉固定件必须固定在压型钢板的波峰上，并应垂直于屋面板，与防水卷材结合紧密；在屋面收边和开口部位，当固定钉不能固定在波峰上时，应增设收边加强钢板，固定在收边加强钢板上；4 卷材铺贴和固定的方向宜垂直于屋面压型钢板波峰；坡度大于25%时，宜垂直屋脊铺贴；铺贴和固定卷材应平整、顺直、松弛，不得褶皱；5 改性沥青防水卷材搭接边采用热熔法施工，应加热均匀，不得过熔或漏熔；高分子防水卷材搭接边采用焊接法施工，接缝不得漏焊或过焊；6 螺钉穿出钢屋面板的有效长度不得小于20mm，当底板为混凝土屋面板时，嵌入混凝土屋面板的有效长度不得小于30mm；7 用于屋面机械固定系统的卷材搭接，螺栓中心距卷材边缘的距离不应小于30mm，搭接处不得露出钉帽，搭接缝应密封；8 卷材防水层周边800mm 范围内应满粘，收头应采取金属压条钉压固定，密封处理。
