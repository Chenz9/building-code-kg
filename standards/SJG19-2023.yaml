  text: 混凝土结构的外观质量缺陷应由监理单位和施工单位及相关方，根据对结构性能和使用 功能影响的严重程度，按 表7.6.7 混凝土结构外观缺陷 名称 现象 严重缺陷 一般缺陷 露筋 构件内钢筋未被混凝土包裹而外露 纵向受力钢筋有露筋 其他钢筋有少量露筋 蜂窝 混凝土表面缺少水泥砂浆而形成石子外露 构件主要受力部位有蜂窝 其他部位有少量蜂窝 孔洞 混凝土中孔穴深度和长度均超过保护层厚度 构件主要受力部位有孔洞 其他部位有少量孔洞 夹渣 混凝土中夹有杂物且深度超过保护层厚度 构件主要受力部位有夹渣 其他部位有少量夹渣 疏松 混凝土中局部不密实 构件主要受力部位有疏松 其他部位有少量疏松 裂缝 缝隙从混凝土表面延伸至混凝土内部 构件主要受力部位有影响结构性能 或使用功能的裂缝 其他部位有少量不影响结构 性能或使用功能的裂缝 连接部位 缺陷 构件连接处混凝土有缺陷及连接钢筋、连接 件松动 连接部位有影响结构传力性能的缺 陷 连接部位有基本不影响结构 传力性能的缺陷 外形缺陷 缺棱掉角、棱角不直、翘曲不平、飞边凸肋 等 清水混凝土构件有影响使用功能或 装饰效果的外形缺陷 其他混凝土构件有不景响使 用功能的外形缺陷 外形缺陷 构件表面麻面、掉皮、起砂、沾污等 具有重要装饰效果的清水混凝土构 件有外表缺陷 其他混凝土构件有不影响使 用功能的外表缺陷。
