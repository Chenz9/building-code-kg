  converted_tables:
  - raw: 柔性防水层应与混凝土结构底板完全粘合。如果粘合不完全，一旦防水层出现破损就会窜水，失去了柔性防水层的作用，水就会渗到混凝土承台底板，造成渗漏。因此，要求柔性防水层与混凝土结构底板紧密结合。
