  - raw: 垫层混凝土随浇随抹光是一种行之已久的成熟工艺，省去在浇好垫层上再做砂浆找平层。原浆压光工艺，强度高，省工、省料，使平整的基层成为一个整体，不会出现脱层、强度低等缺陷。地梁、桩根部或转角处做成圆弧，是便于涂料或卷材的施工，使其与基层粘结良好。
