  text: 侧墙防水层的保护层宜采用30mm 厚聚苯乙烯挤塑泡沫板、砌体或塑料排水板。底板防水层的保护层厚度应不小于50mm、强度等级不小于C20的细石混凝土；基础梁侧面防水层的保护层宜采用20mm 聚合物水泥砂浆（梁槽侧面挂热镀锌钢丝网）；当采用预铺防水卷材时，防水层与底板结构之间不设保护层及隔离层。地下室肥槽在侧墙周边500mm范围内回填土压实系数应不小于0.94。
