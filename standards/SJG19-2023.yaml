  text: 防水混凝土 waterproof concrete以阻止水的渗透（漏）为目标，采用优选的水泥、砂、石等混凝土原材料，掺加具有抗裂、防水功能的外加剂或矿物掺合料，通过优化配合比和严格的施工措施，制成具有良好抗渗性能和抗裂性能的混凝土。
