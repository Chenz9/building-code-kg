  - raw: 水落口有横排水和直排水两种做法。水落口是雨水集中排出的部位，受水冲刷严重，大雨时短期积水，因此，首先要注意加大排水坡度，避免积水；二是水落口与找平层间材料不同，变形收缩首先在这里开裂，故应预留凹槽嵌密封材料。由于水流集中冲刷，还需增加附加增强层是十分必要的。
