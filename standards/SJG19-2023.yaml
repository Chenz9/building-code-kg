  clause_no: 7.5.15
  text: 当预铺防水卷材施工时，阴、阳角部位应做成圆弧形或八字角，宜不铺设附加层。大面防水施工时，应先进行测量、弹线、定位，对卷材进行裁剪铺设，将预铺防水卷材空铺或临时固定在基层上，使后浇混凝土与卷材胶膜层紧密粘合，使后浇混凝土与卷材胶膜层紧密粘合。卷材长边应采用自粘胶、胶粘带或热风焊接。采用热风焊接时，搭接缝上应覆盖高分子自粘胶带，胶带宽度不应小于120mm；短边应采用胶粘带搭接或对接。预铺卷材宜不设保护层，在绑扎钢筋时应采取保护措施，侧壁卷材防水层应有保护措施，以便于侧壁外防水层连接。
