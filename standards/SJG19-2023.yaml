  text: 蓄水工程的防水层施工应符合下列规定：1 用于生活水池、游泳池内壁的防水材料，应有符合卫生标准的检验报告或卫生防疫部门检测证明文件方可进行施工；2 用于有腐蚀介质污水池内壁的防水材料，应确认其相关性能指标满足设计要求方可进行施工；3 溢流口、吸污口、给水口、回水放空口、穿过结构防水层管道等细部节点周边与找平层之间应预留凹槽，并嵌填密封材料；4 游泳池周边溢水沟防水材料的选择和施工应与池体内部防水层一致；5 防水层施工前，应先做好阴阳角、管口、管道周边等细部节点部位的增强处理。
