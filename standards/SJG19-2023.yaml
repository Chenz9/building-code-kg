  section: 9.3 施工
  clause_no: 9.3.2
  text: 塑料防水板的铺设应符合下列规定：1铺设塑料防水板时，宜由拱顶向两侧展铺，并应边铺边用压焊机将塑料板与暗钉圈焊接牢靠，不应有漏焊、假焊和焊穿现象；2 两幅塑料防水板的搭接宽度不应小于100mm，长边搭接缝应采用热熔双焊缝，每条焊缝的有效宽度不应小于15mm，短边应采用热熔单焊缝焊接，有效焊接宽度不应小于30mm；3 环向铺设时，下部防水板接头应压住上部防水板；防水板纵向搭接和环向搭接处应采用T型接头，中间一层防水板应做剪角处理；4 塑料防水板铺设时，预埋的分区塑料止水带及注浆盘宜采用热熔或粘结固定在防水板表面；5 分段设置塑料防水板时，两端应采取封闭措施。
