- id: SJG 19-2023#3.0.16
  standard_code: SJG 19-2023
  chapter: 3 基本规定
  section: ''
  clause_no: 3.0.16
  text: 列构造层不应作为一道防水层：1 混凝土屋面结构；2保温层；3隔汽层；4不具备防水功能的装饰瓦、不搭接瓦等装饰层；5墙面砖、地面砖、墙面装饰涂料、地坪涂料等装饰层；6憎水性涂料；7细石混凝土保护层；8聚合物水泥砂浆找平层或细石混凝土找平层；9卷材或涂膜厚度不满足规定要求的防水层；10 塑料排水板。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 不应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 根据目前出现的问题，常误将一些有一定防水功能的材料作为一道防水层，造成防水设防失效或质量降低，故列出多种不可作为一道防水层的条文。1 屋面、墙体混凝土结构在结构设计计算时，允许混凝土裂缝不大于0.3mm，且屋面、墙体结构层处于建筑物外部，受自然环境、温度变形影响和混凝土后期收缩变形影响，开裂是不可避免的，所以不可以作为一道防水层；2 块体的保温材料接缝多，不能防水。整体保温层的吸水率、孔隙率过高，易渗漏。3 隔汽层过薄，只能阻止水蒸气通过，不能承受水压、自然环境和建筑物对防水层的损害，故隔汽层和防水层不能混淆；4 装饰瓦、不搭接瓦、面砖，均有很多接缝，其粘结材料也不能全部密实，加之材料和结构本身的变形，微细裂缝不可避免，所以不能成为一道防水层；5 憎水性涂料可阻止水的渗透，但对于结构混凝土或砂浆的开裂是无能为力的；6 防水层厚度不足，耐久性不够，防水层会被破坏而渗漏。7 塑料排水板的拼接缝不能形成密封防水。
    note: 合并重复提取片段
