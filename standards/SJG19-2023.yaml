  - raw: 找平层系防水层的依附层，它的质量直接影响到防水层的效果。找平层强度差或开裂，则防水层很容易出现粘结不牢、空鼓，导致被拉裂现象。做找平层的目的是获得平整、坚硬的表面。就目前施工水平，现浇钢筋混凝土采取随浇随抹工艺或加浆抹平工艺完全可行，这不但节约材料，更主要是确保了找平层的质量，减少了对防水层的损害。找平层中掺抗裂纤维，实践证明对减少找平层开裂很有效的。
    note: 合并重复提取片段
