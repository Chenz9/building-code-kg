  converted_tables:
  - raw: 防水设计工作年限依据《建筑与市政工程防水通用规范》GB 55030的规定，并根据《建筑与市政工程防水通用规范》GB 55030，结合深圳市的气候特点、所处环境和工程地质情况，建筑工程各部位的防水设防等级如下：1 深圳市的年降水量（P）不小于1300mm，屋面工程属Ⅰ类防水使用环境，按防水功能的重要程度，对民用建筑和对渗漏敏感的工业建筑屋面，为甲类工程，设计为一级防水；对渗漏不敏感的工业建筑屋面，为丙类工程，设计为二级防水。对除甲类和丙类以外的乙类建筑屋面工程，设计为一级防水；2 深圳市的年降水量（P）不小于1300mm，外墙工程属Ⅰ类防水使用环境，按防水功能的重要程度，对民用建筑和对渗漏敏感的工业建筑甲类工程外墙，及对渗漏不影响正常使用的工业建筑乙类工程外墙，均设计为一级防水；3 根据防水功能的重要程度，民用建筑和对渗漏敏感的工业建筑室内楼地面和墙面，为甲类工程，按防水使用环境，频繁遇水场合或长期相对湿度（RH）不小于90%的Ⅰ类防水使用环境和间隙遇水环境的Ⅱ类室内工程（如厨卫间、洗浴间、水泵房---等），均设计为一级防水；对于偶发渗漏水可能造成明显损失的场合，为Ⅲ类防水使用环境，设计为二级防水；4 根据深圳市地下工程抗浮设防水位标高与地下结构板底标高高差（H）一般不小于0m，则建筑地下工程属Ⅰ类防水使用环境，按防水功能的重要程度，对有人员活动的民用建筑地下室和对渗漏敏感的建筑地下工程，为甲类工程，设计为一级防水。对渗漏不敏感的物品、设备使用或贮存场所，不影响正常使用的建筑地下工程为丙类工程，设计为二级防水。对除甲类和丙类以外的乙类建筑地下工程，设计为一级防水；5 建筑蓄水类工程按防水功能的重要程度，将建筑室内水池、对渗漏敏感的泳池和嬉水池等列为甲类工程，除甲类以外的为乙类蓄水工程；按工程使用环境，将有干湿交替的环境划为Ⅱ类，将长期浸水和长期湿润环境，非干湿交替环境划为Ⅲ类。由此，将Ⅱ类使用环境下的甲类蓄水工程，设计为一级防水；将长期浸水、长期湿润，非干湿交替环境使用的建筑室内水池、泳池和嬉水池、蓄水池、消防水池等设计为二级防水。
