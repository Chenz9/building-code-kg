  converted_tables:
  - raw: 变形缝有等高缝和高低缝两种，等高缝又可分为高出屋面和不高出屋面的变形缝。不管何种防水材料的屋面，变形缝构造均相同，必须采用两层合成高分子卷材覆盖，这是因为合成高分子卷材厚而柔软，强度高，延伸率大，耐久性好，耐高低温性好等特点。卷材中间为Ω 形，留有变形余地，并与屋面防水层搭接，泛水处必须用聚合物水泥砂浆保护。
