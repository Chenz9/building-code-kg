  clause_no: 4.3.3
  text: 结构混凝土屋面板的找平层，宜采用原浆抹平压光；采用水泥砂浆找平层时，宜采用M20聚合物水泥砂浆；保温层上应先设无纺布隔离层，再施工细石混凝土找平层或保护层，保护层应采用不小于50mm 厚的C25 配筋细石混凝土。
