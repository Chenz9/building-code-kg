  text: C.0.1 建筑防水工程材料现场抽样复验可见表C.0.1。表C.0.1 建筑防水工程材料现场抽样复验项目材料名称及序组批原则及抽样规定外观质量检验进场复验项目号相关标准、规范代号弹性体改性沥青防水卷材可溶物含量、拉力、延伸率、GB 18242—2008低温柔性、耐热性、不透水塑性体改性沥青防水卷材性、接缝剥离强度（无处GB 18243—2008理）、搭接缝不透水性（无处改性沥青聚乙烯胎防水卷材理）GB 18967—2003断裂、孔洞、折皱、剥离、边缘不可溶物含量（PY 类）、拉伸性整齐，胎体露白、能、钉杆撕裂强度、低温柔自粘聚合物改性沥青防水卷材未浸透，撒布材料性、耐热性、不透水性、卷材GB 23441—2009粒度、颜色、每卷与铝板剥离强度、卷材与卷材（1）以同一生产厂的同一类卷材的接头剥离强度、持粘性、搭接缝不型、同一规格，大于1000卷透水性（无处理）抽5卷，每500卷～1000卷可溶物含量、拉力、延伸率、抽4卷，100卷～499卷抽3道桥用改性沥青防水卷材低温柔性、耐热性、接缝剥离JC/T 974-2005卷，100卷以下抽2卷，进行强度（无处理）、搭接缝不透规格尺寸和外观质量检验。水性（无处理）（2）在外观检验合格后，从可溶物含量（PY 类）、拉伸性中随机抽取1卷取至少4m2整能、钉杆撕裂强度、低温柔性/幅宽的试样一块用于物理力学低温弯折性、耐热性、不透水预铺防水卷材性能检测性、渗油性、尺寸变化率、抗GB/T 23457—2017裂纹、粘结，PY 类穿刺强度、接缝剥离强度（无产品胎基是否被浸处理）、搭接缝不透水性（无透、无孔洞、结处理）块、气泡、缺边、可溶物含量（PY 类）、拉伸性裂口、胶层断开，能、撕裂力、耐热性、低温柔每卷卷材的接头性、卷材与卷材剥离强度（无湿铺防水卷材处理）、与水泥砂浆剥离强度GB/T 35467—2017（无处理）、渗油性、持粘性、搭接缝不透水性（无处理）续表C.0.1序材料名称及组批原则及抽样规定外观质量检验进场复验项目号相关标准、规范代号异形片：边缘、裂纹、孔洞、粘连、拉伸强度、拉断伸长率、撕裂气泡、疤痕及其他强度、低温弯折、不透水性、机械损伤缺陷高分子防水材料第1 部分：片材复合强度（FS2）、粘结剥离强其他卷材：平整、GB/T 18173.1—2012度（片材与片材）（标准试验折痕、机械损伤、状态）、搭接缝不透水性（无杂质、胶块、凹处理）痕、气泡，每卷卷材的接头平整、折痕、杂质、断裂拉伸强度、拉断伸长率、胶块、粘连、气泡、撕裂强度、低温弯折、不透水高分子增强复合防水片材漏洞、其他机械损伤性、复合强度、接缝剥离强度GB/T 26518—2011缺陷、每卷卷材的接（无处理）、搭接缝不透水性（1）以同一生产厂的同一类头（无处理）型、同一规格，大于1000卷拉伸性能、低温弯折性、不透抽5卷，每500卷～1000卷水性、热处理尺寸变化率、撕聚氯乙烯防水卷材抽4卷，100卷～499卷抽3裂强度、接缝剥离强度（无处GB 12952—2011卷，100卷以下抽2卷，进行表面平整、边缘整理）、搭接缝不透水性（无处规格尺寸和外观质量检验。齐、无裂纹、孔理）（2）在外观检验合格后，从洞、粘结、气泡和拉伸性能、低温弯折性、热处中随机抽取1卷取至少4m2整疤痕、每卷卷材的热塑性聚烯烃（TPO）防水卷理尺寸变化率、不透水性、撕幅宽的试样一块用于物理力学接头材裂强度、接缝剥离强度（无处性能检测GB 27789—2011理）、搭接缝不透水性（无处理）拉伸性能、低温弯折性、热处表面平整，无孔理尺寸变化率、不透水性、撕热塑性聚烯烃（TPO）预铺防洞、结块、起泡、裂强度、接缝剥离强度（无处水卷材缺边和裂口，每卷理）、搭接缝不透水性（无处卷材的街头理）卷材表面、稀网、断网、卷端切边不断裂拉伸强度、拉断伸长率、良、无纺布与芯层撕裂强度、不透水性、低温弯聚乙烯丙纶复合防水卷材粘结、僵块、并折性、表层与芯层复合强度、丝、软皱褶、芯卷材灰分含量层、接头续表C.0.1序材料名称及组批原则及抽样规定外观质量检验进场复验项目号相关标准、规范代号（1）同一原料、配方生产的产品，粉料每10t为一批，不粉料：无杂质、无聚乙烯丙纶防水卷材用聚合物凝结时间、潮湿基面粘结强足10t按一批计；液料每5t 为结块粉末水泥粘结料度、剪切状态下的粘结性、粘一批，不足按一批液料：无杂质、无JC/T 2377-2016结层抗渗压力（2）每批产品随机抽取一组凝胶的均匀乳液样品，至少10kg。（1）同一规格，每12000㎡为一批，不足12000㎡按一批表面平整、厚度均膨胀指数、耐久性、干燥状态单轨道交通工程用天然膨润土防计；随机抽取6卷，进行尺寸匀，无破洞、破边，位面积质量、拉伸强度、最大负水毯偏差和外观质量检验；无残留断针，针刺均荷下伸长率、剥离强