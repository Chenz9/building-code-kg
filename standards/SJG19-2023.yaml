  text: 屋面钢板应优先采用无穿透直立锁边工艺系统安装固定，如选用螺栓固定时应优先选用暗螺栓；选用明螺栓时，应选用带防水垫圈的镀锌或不锈钢单面螺栓，屋面钢板连接处应用密封材料密封。
