  clause_no: 4.4.4
  text: 聚乙烯丙纶卷材复合防水层施工应符合下列规定：1 基层应平整、干净、湿润无明水；2 防水卷材应进行试铺，按位置尺寸裁剪；3 聚合物水泥防水胶粘料应按配比搅拌均匀，稠度适中。胶粘料用带齿刮板（抹子）均匀摊平后，立即滚铺卷材；4 用刮板刮压卷材，排除卷材下空气，使卷材铺贴平展、粘结牢固。接缝处应清理干净，两个粘结面同时涂刷防水胶粘料，立即粘合，接缝压实后在接缝边缘上再涂刷一层聚合物水泥防水胶粘料。接缝处不得有褶皱、翘曲、开裂现象；5 铺贴卷材后2h 内不得上人踩踏；6聚乙烯丙纶防水卷材用聚合物水泥胶结料应采用质量稳定的工厂化生产产品，施工前应进行抽检，合格后方可使用。
