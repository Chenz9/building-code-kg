- id: SJG 19-2023#7.5.5
  standard_code: SJG 19-2023
  chapter: 7 建筑工程地下防水设计与施工
  section: 7.5 地下工程防水层施工
  clause_no: 7.5.5
  text: 防水混凝土应连续浇筑，不留施工缝。当必须留设施工缝时，留设位置应由设计确定，并应符合下列规定：1施工缝混凝土继续浇筑前，应将其表面浮浆和杂物清除，再铺30mm～50mm 厚的M20 水泥砂浆或涂刷混凝土界面处理剂，并及时浇筑混凝土；2 施工缝中埋设的遇水膨胀橡胶止水条（胶）、预埋注浆管等应牢固地安装在缝表面或预留槽内。遇水膨胀橡胶止水条（胶）应具有缓膨胀性能，7d 的膨胀率不应大于最终膨胀率的60％，最终膨胀率宜大于220%。
  is_abolished: false
