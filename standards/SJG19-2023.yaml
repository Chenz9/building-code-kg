    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 保温材料的保温性能与它含水率关系很大，当含水率达20%时，它的保温性能则会下降一半，因此要求屋面保温材料应是低吸水率的材料。而轻质的闭孔材料保温性能高，而且要求具有一定的强度，避免受压缩产生变形。
