  clause_no: E.5.6
  text: E.5.6密封材料固化后，将带有通水装置的试件放入（20±2）℃水中约4h，水面应没过试件上表面。从水中取出带有通水装置的试件，将供水系统接入通水装置，水头高度保持80mm。测量1 分钟的水流量，连续测量两次，两次偏差不超过3g 时，取两次平均值作为该试件初始通水量V初始，精确至1g，每个试件的初始通水量均应在100g/min 至400g/min之间。测量完成后将带有通水装置的试件放入（20±2）℃水中养护，水面应没过试件上表面，继续养护28d，按初始通水量测量方法测量28d 龄期（从测量初始通水量开始计算龄期）通水量V28d。
