- id: SJG 19-2023#F.5.3
  standard_code: SJG 19-2023
  chapter: 附录F 防水卷材和防水涂料的通用技术要求试验方法
  section: 7.1测试浸水后粘结强度（σ1），修约至3位有效数字。
  clause_no: F.5.3
  text: F.5.3 无处理时试验应符合下列规定：1 在（23±5）℃进行试验，争议时在（23±2）℃，相对湿度（50±5）%进行试验；2 搭接缝不透水仪应充水直到满出，彻底排出水管中空气。将制备好的试件迎水面朝下放置在透水盘上，盖上开缝盘，开缝需与试件的接缝相垂直并对中，慢慢夹紧直到试件紧密安装在透水盘上，用布或压缩空气干燥试件的非迎水面，慢慢加压到规定的压力。达到规定压力后，启动计时装置，保持压力（30±2）min，试验时从开缝处观察试件的透水情况；3 加压过程中或保持压力过程中，水压突然下降或试件的接缝非迎水面有水为渗水，立即停止试验。3个试件在规定的时间均不透水为通过。
