    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 不完全缩缝是一种收缩缝，仅能适应缝两侧结构体积的缩小，因此在设缝处结构不留空隙。也是一种开裂引发缝，通过在设缝的位置削弱结构的断面，使结构在发生收缩变形时发生应力集中，开裂在该处发生。由于事先在此设置了止水带，既消散了池壁的应力，又可防止发生渗透。凹槽处的嵌缝密封料可进一步增加其防渗能力。
