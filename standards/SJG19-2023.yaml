  clause_no: 4.4.28
  text: 沥青瓦屋面施工应符合下列规定： 1 在混凝土基层上铺设沥青瓦，可用射钉与冷玛蹄脂粘结固定； 2 沥青瓦的基层应平整，铺设时在基层上应先铺一层沥青防水卷材垫毡，从檐口往上用射 钉钉铺；钉帽应盖在垫毡搭接边下面，垫毡搭接宽度不应小于50mm； 3 沥青瓦应自檐口向上铺设，第一层瓦应与檐口平行，切槽应向上指向屋脊，用射钉固定。 第二层沥青瓦应与第一层叠合，但切槽应向下指向檐口。第三层沥青瓦应压在第二层上，并露 出切槽125mm。沥青瓦之间的接缝，上下层不应重合； 4 每片沥青瓦不应少于4 个射钉，当屋面坡度大于80%时，应增加射钉固定； 5 铺设脊瓦时，应将沥青瓦沿切槽剪开，分成四块作为脊瓦，并用两个射钉固定。脊瓦应顺 年最大频率风向搭接，并应搭盖住两坡面沥青瓦接缝的1/3，脊瓦与脊瓦的压盖面不应小于脊瓦面 积的1/2； 6 屋面与突出屋面结构连接处，沥青瓦应铺贴至立面上，其高度不应小于250mm。在屋面 与突出屋面的烟囱、管道等连接处，应先做防水层，待铺瓦后再用高聚物改性沥青防水卷材做 单层防水； 7 在女儿墙泛水处，沥青瓦可沿基层与女儿墙的八字坡铺贴，并用镀锌薄钢板覆盖，钉于 墙体上，泛水上口与墙间的缝隙应用密封材料密封。
