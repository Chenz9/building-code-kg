- id: SJG 19-2023#1.0.1
  standard_code: SJG 19-2023
  chapter: 1 总则
  section: ''
  clause_no: 1.0.1
  text: 为提高深圳市建筑和市政工程防水技术水平，保证防水工程质量和安全，保障人身健康和生命财产安全，做到经济合理、环保节能，制订本标准。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: null
    modal_words: []
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 深圳地区的经济发展迅速，城市建设日新月异，人们在防水工程实践中逐渐认识到建筑防水工程的重要性，并摸索和积累了一些经验教训。为提高设计、施工质量，需要制订一部在国家规范原则下，根据深圳的实践经验、地区环境条件和材料供应状态、施工技术水平，提出一些新的理念，并符合深圳地区特色的、技术先进的、实用性强的防水工程标准，使防水工程设计、施工、验收有章可依，这是编制本标准的目的。本标准遵循现行国家强制性标准《建筑与市政工程防水通用规范》GB 55030的原则，以《屋面工程技术规范》GB 50345、《地下工程防水技术规范》GB 50108等现行国家标准的要求和建设部颁发的政策法规为准则，并新增道桥工程、蓄水工程等市政工程相关内容，依照“地方化”“具体化”“实用化”原则，防水层设计以“可靠、合理、耐久、经济”为方针，结合当地自然条件、习惯使用的材料、构造和工艺，列出具体的防水层方案。
    note: 合并重复提取片段
  references: []
  related_objects:
    component_types:
    - IfcRoof
    - IfcWall
    - IfcSlab
    - IfcBasement
