- id: SJG 19-2023#4.3.4
  standard_code: SJG 19-2023
  chapter: 4 屋面防水设计与施工
  section: 4.3 其他层次设计
  clause_no: 4.3.4
  text: 正置式屋面的柔性防水层上宜设刚性保护层，两者间应设置隔离层。隔离层可采用无纺布、油毡、塑料膜等与基层不粘结的材料，宜采取防滑措施。屋面防水层上应设混凝土保护层，倒置式屋面保温层上应设刚性混凝土保护层。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
  applicability:
    scope: ''
    conditions: []
    exceptions: []
  constraint:
    modal_level: must
    modal_words:
    - 应
    is_mandatory_clause: false
    mandatory_basis: null
  parameters: []
  tables: []
  converted_tables:
  - raw: 柔性防水层若没有保护层而完全暴露时，由于直接遭受日光暴晒，紫外线、臭氧、热老化作用，雨水冲刷、风吹、霜冻，人的踩踏和活动，大大加速防水层的老化和损坏，缩短防水层的寿命。因此，本条文作了对柔性防水层上必须做保护层的规定，它对减少维修费用和降低综合成本具有重大意义。在屋面设计中，隔离层的作用是隔离、消除保护层与防水层之间的粘结及机械咬合。卷材、涂膜防水层上设置块体材料、细石混凝土等刚性保护层，本条强调了在刚性保护层与防水层之间设置隔离层的必要性。从施工的角度要求做到平整，起到完全隔离的作用，保证刚性保护层胀缩变形时不致损坏防水层。倒置式屋面保温层上也应设保护层，尤其是一般硬泡聚氨酯、聚苯乙烯泡沫板等强度低的材料，应做刚性保护层。
    note: 合并重复提取片段
