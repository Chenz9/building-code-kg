    note: 合并重复提取片段
  - raw: 群管穿墙时，可采用集中式的钢板止水环（止水环位于墙宽一半处，止水钢板出外侧套管边不小于80mm），即采用一块钢板上按各套管的位置开孔，穿墙管穿过各个洞口并与钢板满焊，要求从钢板中部开洞的套管开始向外焊接，以防止外侧的套管焊好而不好施焊中间的套管。全部焊好后，带套管的穿墙群管止水钢板与外墙钢筋点焊固定好位置，浇筑混凝土时一次成型，此法方便且能确保质量。电缆或管道敷设完成后的套管内侧采用柔性采用密封。
