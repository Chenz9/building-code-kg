    min_value: null
    max_value: 7.0
  tables: []
  converted_tables:
  - raw: 对于超长大体积混凝土的施工，可按《混凝土结构设计规范》GB 50010—2010 的要求留置变形缝、后浇带或跳仓方法分段施工。这样，可在一定程度上减轻外部约束程度，减少每次浇筑段的蓄热量，防止水化热的积聚，减少温度应力；由于跳仓接缝处的应力较大，应通过计算确定分仓张缝处的配筋率和加强构造措施，此种方法在深圳有一些工程中得到了应用。
