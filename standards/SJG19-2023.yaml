  converted_tables:
  - raw: 穿地下工程外墙时的套管防水主要解决套管与外墙之间、套管与管道之间的节点渗漏，套管与外墙之间的渗漏水主要采用套管周圈设置止水坏，止水环宽度不小于80mm。实践证明，这种方法可有效解决套管与侧墙之间的渗漏，而且较好地适应了管道或结构变形；管道与套管之间采用聚合物水泥砂浆填满，外侧采用单组分聚氨酯密封胶密封并与大面防水形成连续防水层，使节点达到良好的防水效果。
