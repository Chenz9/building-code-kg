- id: SJG 19-2023#F.5.2
  standard_code: SJG 19-2023
  chapter: 附录F 防水卷材和防水涂料的通用技术要求试验方法
  section: 7.1测试浸水后粘结强度（σ1），修约至3位有效数字。
  clause_no: F.5.2
  text: F.5.2 试件应按F.4.1制备。当采用水泥基类胶粘剂搭接试件时，应采用丁基胶带或双组分聚氨酯防水涂料等材料填充试件密封圈部位的搭接缝，以避免试验时密封区域的试件因受力压坏胶粘剂导致透水。搭接后试件的尺寸约为300mm×300mm。在不影响试验结果的前提下，沿橡胶密封圈一圈，采用胶带、密封胶或粘贴尺寸厚度适合的卷材等形式将试件与透水盘之间密封，同时消除卷材搭接后迎水面产生的高度差。需要时，非迎水面可直接放置尺寸合适的卷材填充高度差。搭接示意图见图F.5.2；AA水压方向图F.5.2塔接示意图A-A1—开缝；2—搭接后的试件；3—橡胶密封圈；4—开缝盖板；5—非迎水面高度填充用卷材；6—迎水面密封填充用胶带、密封胶、卷材等。图F.5.2塔接示意图（续）
