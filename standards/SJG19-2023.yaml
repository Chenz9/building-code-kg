  converted_tables:
  - raw: 由于现代复杂、创新的建筑设计不断涌现，建筑构造设计多样性、个性化，使得建筑防水细部构造千变万化，不可能一一列出。为了保证节点的防水可靠，根据“多道设防”“复合用材”“适应变形”“连续设防”“增强设防”的原则制订了几个典型的细部构造图，供设计者参考。多数细部构造应由设计人员根据原则自行作出详细的节点大样图。
