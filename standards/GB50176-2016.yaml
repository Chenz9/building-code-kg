- id: GB 50176-2016#8.2.6
  standard_code: GB 50176-2016
  chapter: 8 自然通风设计
  section: 8.2技术措施
  clause_no: 8.2.6
  text: 室内通风路径的设计应遵循布置均匀、阻力小的原则，应符合下列规定：1可将室内开空间、走道、室内房间的门窗、多层的共享空间或者中庭作为室内通风路径。在室内空间设计时宜组织好上述空间，使室内通风路径布置均匀，避免出现通风死角。2宜将人流密度大或发热量大的场所布置在主通风路径上；将人流密度大的场所布置在主通风路径的上游，将人流密度小但发热量大的场所布置在主通风路径的下游。3室内通风路径的总截面积应大于排风口面积。
