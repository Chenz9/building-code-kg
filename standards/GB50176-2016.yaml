- id: GB 50176-2016#4.4.5
  standard_code: GB 50176-2016
  chapter: 4 建筑热工设计原则
  section: ''
  clause_no: 4.4.5
  text: 围护结构防潮设计应遵循下列基本原则。1.室内空气湿度不宜过高。2、地面,外墙表面温度不宜过低。3.可在围护结构的高温侧设隔汽层，4,可采用具有吸湿，解湿等调节空气湿度功能的围护结构材料、5，应合理设置保温层。防止围护结构内部冷凝、6、与室外雨水或土壤接触的围护结构应设置防水.潮、层。
