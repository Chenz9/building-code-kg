- id: GB 50176-2016#6.2.3
  standard_code: GB 50176-2016
  chapter: 6 围护结构隔热设计
  section: 6.2屋面
  clause_no: 6.2.3
  text: 屋面隔热可采用下列措施：宜采用浅色外饰面。宜采用通风隔热屋面。通风屋面的风道长度不宜大于10m，通风间层高度应大于0.3m，屋面基层应做保温隔热层，檐口处宜采用导风构造，通风平屋面风道口与女儿墙的距离不应小于0.6m。3可采用有热反射材料层（热反射涂料、热反射膜、铝箔等）的空气间层隔热屋面。单面设置热反射材料的空气间层，热反射材料应设在温度较高的一侧。4可采用蓄水屋面。水面宜有水浮莲等浮生植物或白色漂浮物。水深宜为0.15m~0.2m。5宜采用种植屋面。种植屋面的保温隔热层应选用密度小、压缩强度大、导热系数小、吸水率低的保温隔热材料。可采用淋水被动蒸发屋面。宜采用带老虎窗的通气阁楼坡屋面。采用带通风空气层的金属夹芯隔热屋面时，空气层厚度不宜小于0.1m。
