- id: GB 50176-2016#7.3.4
  standard_code: GB 50176-2016
  chapter: 7 围护结构防潮设计
  section: ''
  clause_no: 7.3.4
  text: 室内地面和地下室外墙防潮宜采用下列措施 1，建筑室内一层地表面宜高于室外地坪0.6m以上。2，采用架空通风地板时，通风口应设置活动的遮挡板,使其在冬季能方便关闭。遮挡板的热阻应满足冬季保温的要求.3。地面和地下室外墙宜设保温层，4。地面面层材料可采用蓄热系数小的材料、减少表面温度与空气温度的差值 5。地面面层可采用带有微孔的面层材料.6，面层宜采用导热系数小的材料.使地表面温度易于紧随空气温度变化 7。面层材料宜有较强的吸湿，解湿特性,具有对表面水分湿调节作用.
