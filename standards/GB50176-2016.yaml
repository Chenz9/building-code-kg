- id: GB 50176-2016#8.2.4
  standard_code: GB 50176-2016
  chapter: 8 自然通风设计
  section: 8.2技术措施
  clause_no: 8.2.4
  text: 进、排风口的设置应充分利用空气的风压和热压以促进空气流动，设计应符合下列规定：1进风口的洞口平面与主导风向间的夹角不应小于45°。无法满足时，宜设置引风装置。2进、排风口的平面布置应避免出现通风短路。3宜按照建筑室内发热量确定进风口总面积，排风口总面积不应小于进风口总面积。4室内发热量大，或产生废气、异味的房间，应布置在自然通风路径的下游。应将这类房间的外窗作为自然通风的排风口。可利用天井作为排风口和竖向排风风道。进、排风口应能方便地开启和关闭，并应在关闭时具有良好的气密性。
  is_abolished: false
  abolished_date: null
  superseded_by: null
