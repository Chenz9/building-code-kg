- id: GB 50176-2016#8.2.5
  standard_code: GB 50176-2016
  chapter: 8 自然通风设计
  section: 8.2技术措施
  clause_no: 8.2.5
  text: 当房间采用单侧通风时，应采取下列措施增强自然通风效果：通风窗与夏季或过渡季节典型风向之间的夹角应控制在45°～60°之间；宜增加可开启外窗窗扇的高度；迎风面应有凹凸变化，尽量增大凹口深度；可在迎风面设置凹阳台。
