- id: GB 50176-2016#8.2.1
  standard_code: GB 50176-2016
  chapter: 8 自然通风设计
  section: 8.2技术措施
  clause_no: 8.2.1
  text: 建筑的总平面布置宜符合下列规定：建筑宜朝向夏季、过渡季节主导风向；2建筑朝向与主导风向的夹角：条形建筑不宜大于30°，点式建筑宜在30°～60°之间；建筑之间不宜相互遮挡，在主导风向上游的建筑底层宜架空。8.2. 2采用自然通风的建筑，进深应符合下列规定：未设置通风系统的居住建筑，户型进深不应超过12m；2公共建筑进深不宜超过40m，进深超过40m时应设置通风中庭或天井。
