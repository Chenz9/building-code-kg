  chapter: 3 材料工程要求
  section: 3.1一般规定
  clause_no: 3.2.2
  text: 本条要求防水混凝土应采取减少开裂的技术措施.抗开裂的技术措施包括但不限于，采用优化级配和高品质的骨料,调整水泥及其他胶凝材料种类.细度及用量.使用外加剂 控制水胶比.用水量 等配合比设计，合理配筋.控制结构厚度、优化浇筑振捣工艺、减少结构内外温差及加强养护等。
