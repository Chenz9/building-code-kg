  section: ''
  clause_no: 2.0.5
  text: 工程防水使用环境类别为Ⅱ类的明挖法地下工程，当该工程所在地年降水量大于400mm时，应按I类防水使用环境选用。2.0. 6工程防水等级应依据工程类别和工程防水使用环境类别分为一级、二级、三级。暗挖法地下工程防水等级应根据工程类别、工程地质条件和施工条件等因素确定，其他工程防水等级不应低于下列规定：1一级防水：I类、Ⅱ类防水使用环境下的甲类工程；I类防水使用环境下的乙类工程。2二级防水：Ⅲ类防水使用环境下的甲类工程；Ⅱ类防水使用环境下的乙类工程；I类防水使用环境下的丙类工程。3三级防水：Ⅲ类防水使用环境下的乙类工程；Ⅱ类、Ⅲ类防水使用环境下的丙类工程。
