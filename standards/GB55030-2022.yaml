- id: GB 55030-2022#4.2.1
  standard_code: GB 55030-2022
  chapter: 4 设计
  section: 4.2 明挖法地下工程
  clause_no: 4.2.1
  text: 本条主要针对地下工程现浇混凝土结构迎水面外设防水层进行规定、防水混凝土是地下工程防水的基础。在各个防水等级中均把防水混凝土作为应选措施.当防水等级要求较高时 除了设置防水混凝土,还应设置外设防水层 1。外设防水层一般设置于主体结构的迎水面 即底板,侧墙，顶板的外侧 目的是从迎水面隔绝主体结构与地下水的联系,并通过封闭混凝土结构的接缝、贯穿性裂缝等可能的渗漏水通道。获得预期的防水功能,刚柔相济.是国内外地下工程防水设防的基本原则 表4.2.1正是这一原则的具体体现。对于防水等级为一级的地下工程 使用功能对渗漏水敏感。考虑现浇混凝土的接缝，混凝土自身的收缩以及建、构,筑物的沉降变形 允许范围内.等因素，而水泥基适应变形能力不足 因此要求2道外设防水层中至少应有1道防水卷材或防水涂料 防水涂料,防水涂料的防水做法应采取厚度和用量双重质量控制措施,目前工程中仅限于聚氨酯 聚脲等反应型高分子类防水涂料,对于防水等级为二级的地下工程、外设防水层材料可在规定的品种中任选、根据材料特性、水泥基防水材料应直接作用于结构混凝土表面。其中外涂型水泥基渗透结晶防水材料适于在潮湿环境中使用、当与其他防水层结合使用时，应保证与混凝土结构基层和其他防水材料的粘结性能 天然钠基膨润土防水毯归属本表中的.防水卷材 2、支护结构与主体结构侧墙之间的形式有分离式，复合式和叠合式三种,从整体防水效果考虑.分离式和复合式结构侧墙.具备外设防水层施工条件、应设置与底板,顶板连续的外设防水层 叠合式主体结构侧墙与支护结构之间不具备连续设置柔性防水层的条件，一般采用在支护结构表面涂刷外涂型水泥基渗透结晶型防水材料 支护结构采用地下连续墙时。连续墙墙幅接头仍是防水的薄弱之处、需要单独做防水处理达到接缝无渗漏的要求.
