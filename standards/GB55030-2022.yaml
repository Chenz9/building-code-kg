- id: GB 55030-2022#3.3.1
  standard_code: GB 55030-2022
  chapter: 3 材料工程要求
  section: 3.3防水卷材和防水涂料
  clause_no: 3.3.1
  text: 防水材料耐水性测试试验应按不低于23℃×14d的条件进行，试验后不应出现裂纹、分层、起泡和破碎等现象。当用于地下工程时，浸水试验条件不应低于23℃×7d，防水卷材吸水率不应大于4%；防水涂料与基层的粘结强度浸水后保持率不应小于80%，非固化橡胶沥青防水涂料应为内聚破坏。
  is_abolished: false
  abolished_date: null
  superseded_by: null
  abolition_note: null
