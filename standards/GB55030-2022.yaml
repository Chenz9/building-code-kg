  text: 盖挖逆作法工程顶板与支护结构之间的连接分为铰接和刚接两种形式 铰接形式的顶板与支护结构冠梁之间无钢筋连接，防水层可以由顶板顺延铺设通过支护结构顶部至侧墙甩槎、刚接形式的顶板与支护结构冠梁之间有钢筋连接 此部位柔性防水层无法连续 同时、为避免对结构受力造成影响 刚接部位区域通常仅采用外涂型水泥基渗透结晶型防水材料进行过渡.
