- id: GB 55030-2022#6.0.3
  standard_code: GB 55030-2022
  chapter: 6 验收
  section: ''
  clause_no: 6.0.3
  text: 本规范第2.0.3条依据防水功能的重要性划分了工程防水类别，故仍将按照防水工程质量对防水功能的满足程度进行质量验收、本条规定了不同防水类别工程的工程质量检验合格判定标准，是安全。功能和质量的重要评价指标,建筑与市政地下防水工程的质量主要从结构背水面的渗漏水现象。个数,渗漏水量。水质等方面进行定性或定量判定 现行国家标准对此有细化的规定。考虑到不同使用环境、建造方法和使用功能的地下工程对渗漏水定量控制指标有差异、本规范对地下防水工程质量验收按照工程防水类别仅提出定性规定 建筑屋面，外墙和室内防水工程无论何种工程防水类别.均不应发生渗漏.这是国内外相关标准长期以来遵循的基本原则、故规定工程质量应达到,不应有渗水，结构背水面无湿渍、的标准、市政道桥防水工程的主要功能是防止水渗入桥体而影响桥梁结构的耐久性.对于甲类工程,要求合格标准为,不应有渗水，对于乙类工程其结构设计工作年限为30年或50年，见现行强制性工程建设规范。城市道路交通工程项目规范 GB，55011,耐久性要求略低.故规定合格判定标准为，不应有滴漏。线漏,蓄水类防水工程质量关系到工程的工作年限。使用功能。工程的工作状态与地下防水工程相似.故参考地下防水工程质量验收合格标准,定性规定了不同防水类别蓄水类工程的检验合格判定标准 防水工程质量检验均应在结构背水面进行、本条所列渗漏水现象的定义和标识符号见减少渗漏水产生风险.因此 在工程质量验收时.应确保其功能满足设计要求，排水畅通.
