  text: 肥槽回填质量对明挖法地下工程防水工程质量有较大影响,肥槽如处理不当。不但可能造成侧墙防水层被破坏。更是将肥槽变成贮水空间。增加渗漏风险、当回填层的渗透系数大于周边相邻土层时,基坑底部易形成积水、而底板与侧墙交接处是防水的薄弱环节，因此提出基坑底部区域回填层的压实系数要求，基坑底部区域指基坑底部至结构底板上表面以上500mm。或基坑底部至结构底板纵向水平施工缝以上500mm的范围，顶板防水层以上采用渗透系数小的回填层有利于阻挡降水对地下工程防水的影响 同时对回填层作一定厚度的密实性要求、有助于对防水层的保护，压实系数取值参考了现行国家标准。建筑地基基础设计规范 GB,50007的相关规定.。
