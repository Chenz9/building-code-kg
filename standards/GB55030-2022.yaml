  section: ''
  clause_no: 2.0.1
  text: 工程防水应遵循因地制宜、以防为主、防排结合综合治理的原则。2.0. 2工程防水设计工作年限应符合下列规定：地下工程防水设计工作年限不应低于工程结构设计工作年限；屋面工程防水设计工作年限不应低于20年；室内工程防水设计工作年限不应低于25年；桥梁工程桥面防水设计工作年限不应低于桥面铺装设计工作年限；5非侵蚀性介质蓄水类工程内壁防水层设计工作年限不应低于10年。
